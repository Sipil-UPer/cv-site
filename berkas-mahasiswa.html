<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Berkas mahasiswa — Program Studi</title>
<meta name="description" content="Pedoman, pengumuman, dan berkas program studi untuk mahasiswa.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tema.css?v=2026-11-16-05a43b">
<style>
  /* Halaman publik berkas mahasiswa (pemilik 2026-11-16; 76-patch-berkas-mahasiswa.sql). Warna dari tema.css. */
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{max-width:860px;margin:0 auto;padding:0 16px 80px}
  .hero{background:var(--biru);color:#fff;border-bottom:4px solid var(--merah)}
  .hero-in{max-width:860px;margin:0 auto;padding:22px 16px 20px}
  h1{font-family:var(--serif);font-size:clamp(22px,4.2vw,30px);font-weight:600;margin:0;line-height:1.2;color:#fff}
  .prodi{color:var(--biru-m4);font-size:14px;margin-top:6px}
  .kosong, .ket{color:var(--muted)}
  .ket{font-size:13.5px}
  .cari{margin:18px 0 4px}
  .cari input{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
  h2{font-family:var(--serif);font-size:19px;font-weight:600;margin:24px 0 8px}
  h2 .n{font-family:var(--mono);font-size:12px;color:var(--muted);font-weight:400;margin-left:6px}
  .daftar{list-style:none;margin:0;padding:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .daftar li{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line-soft)}
  .daftar li:last-child{border-bottom:0}
  .daftar .isi{flex:1;min-width:0}
  .daftar .judul{font-weight:600;overflow-wrap:anywhere}
  .daftar .meta{font-size:13px;color:var(--muted);margin-top:2px}
  .pengumuman{border-left:4px solid var(--merah)}
  .daftar .teks{white-space:pre-line;margin-top:4px;overflow-wrap:anywhere}
  a.buka{flex:none;font-weight:600;font-size:14px;text-decoration:none;color:#fff;background:var(--biru);padding:7px 14px;border-radius:7px}
  a.buka:hover{filter:brightness(1.1)}
  a.buka:focus-visible{outline:2px solid var(--biru);outline-offset:2px}
  @media (max-width:480px){.daftar li{flex-direction:column;align-items:stretch}.daftar a.buka{text-align:center}}
  .msg.buruk{color:var(--merah)}
  footer{margin-top:32px;font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<header class="hero"><div class="hero-in">
  <h1>Berkas mahasiswa</h1><div class="prodi" id="hProdi"></div>
</div></header>
<main class="wrap">
  <div class="cari"><input id="cari" type="search" placeholder="Cari pedoman, pengumuman, jadwal…" aria-label="Cari berkas" autocomplete="off"></div>
  <div id="isi"><p class="kosong">Memuat…</p></div>
  <footer>Berkas dibuka di Google Drive. Pertanyaan tentang isi berkas: hubungi sekretariat program studi.</footer>
</main>
<script src="config.js?v=2026-11-16-05a43b"></script>
<script>
// Galat saat memuat skrip ditampilkan sebagai pesan, bukan halaman kosong.
addEventListener('error', function (e) {
  if (document.getElementById('galat-muat')) return;
  var d = document.createElement('div');
  d.id = 'galat-muat';
  d.style.cssText = 'margin:16px;padding:12px 14px;border:1px solid var(--merah);' +
    'background:var(--merah-m3);color:var(--ink);font:14px/1.5 system-ui,sans-serif';
  d.textContent = 'Halaman gagal dimuat: ' + (e.message || 'galat skrip') +
    '. Tekan Ctrl+Shift+R untuk memuat ulang tanpa cache.';
  document.body.insertBefore(d, document.body.firstChild);
});
</script>
<script type="module">
// Berkas prodi untuk mahasiswa, tanpa login (pemilik 2026-11-16). Isi dipilih admin per dokumen pustaka
// (Data prodi > Dokumen, centang "Mahasiswa"); fungsi dokumen_mahasiswa() (76-patch-berkas-mahasiswa.sql)
// hanya mengembalikan dokumen yang dicentang, bukan berkas privat, dan belum lewat masa berlakunya.
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
import { infoJenis } from './rencana-bukti.js?v=2026-11-16-05a43b';

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = id => document.getElementById(id);
const tgl = s => String(s || '').slice(0, 10).split('-').reverse().join('/');
const sb = createClient(window.SB_URL, window.SB_KEY, { auth: { persistSession: false } });

fetch('data.json?v=' + Date.now()).then(r => r.ok ? r.json() : {}).catch(() => ({}))
  .then(d => {
    const p = [d.prodi, d.institusi].filter(Boolean).join(' · ');
    $('hProdi').textContent = p;
    if (d.prodi) document.title = 'Berkas mahasiswa — ' + d.prodi;
  });

let DOK = [];

// Pengumuman paling atas (terbaru dulu), lalu kelompok jenis menurut abjad; di dalam kelompok, tahun terbaru dulu.
function kelompok(xs){
  const m = new Map();
  xs.forEach(d => { if (!m.has(d.jenis)) m.set(d.jenis, []); m.get(d.jenis).push(d); });
  return [...m.entries()]
    .map(([j, ys]) => ({ jenis: j, nama: j === 'pengumuman' ? 'Pengumuman' : infoJenis(j).nama,
      xs: ys.sort((a, b) => j === 'pengumuman' ? String(b.diperbarui).localeCompare(String(a.diperbarui))
        : (b.tahun - a.tahun) || String(a.judul).localeCompare(String(b.judul), 'id')) }))
    .sort((a, b) => (b.jenis === 'pengumuman') - (a.jenis === 'pengumuman') || a.nama.localeCompare(b.nama, 'id'));
}

// Alamat https://… di pengumuman teks menjadi tautan (teks sudah di-escape; tanda baca penutup tidak ikut).
const tautkan = s => esc(s).replace(/https?:\/\/[^\s<]*[^\s<.,;:!?)]/g,
  u => `<a href="${u}" target="_blank" rel="noopener nofollow">${u}</a>`);

function baris(d){
  const nama = d.judul || infoJenis(d.jenis).nama;
  const meta = [d.tahun, d.nomor && 'No. ' + d.nomor, d.tanggal && 'tanggal ' + tgl(d.tanggal),
    d.berlaku_sampai && 'berlaku s.d. ' + tgl(d.berlaku_sampai), 'diperbarui ' + tgl(d.diperbarui)].filter(Boolean).join(' · ');
  if (d.teks) return `<li><div class="isi"><div class="judul">${esc(nama)}</div>
    ${d.isi ? `<div class="teks">${tautkan(d.isi)}</div>` : ''}<div class="meta">${esc(meta)}</div></div></li>`;
  return `<li><div class="isi"><div class="judul">${esc(nama)}</div><div class="meta">${esc(meta)}</div></div>
    <a class="buka" href="${esc(d.url)}" target="_blank" rel="noopener">Buka</a></li>`;
}

function gambar(){
  const q = $('cari').value.trim().toLowerCase();
  const xs = DOK.filter(d => !q || [d.judul, d.isi, infoJenis(d.jenis).nama, d.nomor, d.tahun].join(' ').toLowerCase().includes(q));
  if (!DOK.length) { $('isi').innerHTML = '<p class="kosong">Belum ada berkas yang dibagikan untuk mahasiswa.</p>'; return; }
  if (!xs.length) { $('isi').innerHTML = '<p class="kosong">Tidak ada berkas yang cocok.</p>'; return; }
  $('isi').innerHTML = kelompok(xs).map(g => `<section><h2>${esc(g.nama)}<span class="n">${g.xs.length}</span></h2>
    <ul class="daftar${g.jenis === 'pengumuman' ? ' pengumuman' : ''}">${g.xs.map(baris).join('')}</ul></section>`).join('');
}

// Berkas (76) dan pengumuman teks (77) dimuat bersamaan; bila salah satu gagal, yang lain tetap tampil.
const [rb, rp] = await Promise.all([sb.rpc('dokumen_mahasiswa'), sb.rpc('pengumuman_mahasiswa_aktif')]);
if (rb.error) console.error('dokumen_mahasiswa:', rb.error.message, '(jalankan supabase/76-patch-berkas-mahasiswa.sql)');
if (rp.error) console.error('pengumuman_mahasiswa_aktif:', rp.error.message, '(jalankan supabase/77-patch-pengumuman-teks.sql)');
if (rb.error && rp.error) {
  $('isi').innerHTML = '<p class="msg buruk">Daftar berkas belum tersedia. Coba lagi nanti.</p>';
} else {
  DOK = [...(rb.data || []).filter(d => /^https?:\/\//i.test(d.url || '')),
         ...(rp.data || []).map(p => ({ ...p, jenis: 'pengumuman', teks: true }))];
  gambar();
  $('cari').addEventListener('input', gambar);
}
</script>
</body>
</html>
