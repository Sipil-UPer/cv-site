<style>
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
  .wrap{max-width:1180px;margin:0 auto;padding:18px 20px 80px}
  .kosong, .ket{color:var(--muted)} .ket{font-size:13px}
  .saring{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin:4px 0 12px;font-size:13.5px}
  .saring select, .saring input{font:inherit;font-size:14px;padding:5px 7px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
  .saring input[type=search]{min-width:220px}
  .ringkas{display:flex;flex-wrap:wrap;gap:10px;margin:4px 0 14px}
  .ringkas div{background:var(--panel);border:1px solid var(--line);padding:8px 14px}
  .ringkas b{font-family:var(--mono);font-size:20px;display:block}
  .ringkas span{font-size:12.5px;color:var(--muted)}
  table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);font-size:13.5px}
  th{text-align:left;font-size:12px;color:var(--muted);font-weight:500;border-bottom:1px solid var(--line);padding:7px 9px;background:var(--bg);white-space:nowrap}
  td{border-bottom:1px solid var(--line-soft);padding:7px 9px;vertical-align:top}
  td.n, th.n{text-align:right;font-family:var(--mono)}
  td .kecil{font-size:12px;color:var(--muted)}
  button.b{font:inherit;font-size:13.5px;padding:6px 12px;border:1px solid var(--biru);background:var(--biru);color:#fff;cursor:pointer}
  button.b.ringan{background:var(--panel);color:var(--biru)}
  .tag{display:inline-block;font-size:12px;padding:1px 8px;border:1px solid var(--line);background:var(--bg);white-space:nowrap}
  .tag.hijau{border-color:var(--hijau);color:var(--hijau)} .tag.biru{border-color:var(--biru);color:var(--biru)}
  .lebar-tabel{overflow-x:auto}
</style>
</head>
<body>
<div class="hero" role="region" aria-label="Pembuka halaman"><div class="hero-in">
  <div class="hero-inst" data-identitas></div>
  <h1>Daftar mahasiswa</h1>
  <div class="sub" id="hSub">Memuat…</div>
</div></div>
<main class="wrap" id="isi"><p class="kosong">Memuat…</p></main>
<script src="config.js?v=2026-11-28-c88499"></script>
<script>
// Galat saat memuat skrip (mis. modul lama dari cache bercampur dengan
// halaman baru) ditampilkan sebagai pesan, bukan halaman kosong.
addEventListener('error', function (e) {
  if (document.getElementById('galat-muat')) return;
  var d = document.createElement('div');
  d.id = 'galat-muat';
  d.style.cssText = 'margin:16px;padding:12px 14px;border:1px solid var(--merah);' +
    'background:var(--merah-m3);color:var(--ink);font:14px/1.5 system-ui,sans-serif';
  d.textContent = 'Halaman gagal dimuat: ' + (e.message || 'galat skrip') +
    '. Tekan Ctrl+Shift+R untuk memuat ulang tanpa cache; bila tetap muncul, kirim pesan ini ke admin.';
  document.body.insertBefore(d, document.body.firstChild);
});
</script>
<script type="module">
// Daftar mahasiswa (pemilik 2026-11-26): mahasiswa aktif (unggahan SIAKAD per semester di Perwalian) dan lulusan (periode
// yudisium), IPK/SKS terakhir, email, dosen wali, riwayat TA. Akses = RLS tabel mahasiswa (186): admin, Kaprodi, pimpinan
// melihat semua; dosen wali melihat mahasiswa walinya. Excel juga dipakai sebagai daftar sasaran tracer study.
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/+esm';
import { gerbang } from './menu.js?v=2026-11-28-c88499';
import { punya } from './koordinator.js?v=2026-11-28-c88499';
import { SHEETJS } from './nilai-cpl.js?v=2026-11-28-c88499';
import { susunDaftar, saringDaftar, ringkasDaftar, lembarDaftar, STATUS_MHS, teksPeriode } from './daftar-mahasiswa.js?v=2026-11-28-c88499';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = id => document.getElementById(id);
const sb = createClient(window.SB_URL, window.SB_KEY);
const MAKS_TAMPIL = 300;
let SAYA = null, SEMUA = false, DATA = [], SEMUA_BARIS = false;

// Supabase membatasi 1000 baris per permintaan: ambil bertahap.
async function ambilSemua(buat){
  const out = [];
  for (let dari = 0; ; dari += 1000) {
    const { data, error } = await buat().range(dari, dari + 999);
    if (error) throw new Error(error.message);
    out.push(...(data || []));
    if (!data || data.length < 1000) return out;
  }
}

async function muat(){
  const [mahasiswa, semester, dosen, jadwal] = await Promise.all([
    ambilSemua(() => sb.from('mahasiswa').select('nim,nama,email,angkatan,lulus_periode').order('nim')),
    ambilSemua(() => sb.from('mahasiswa_semester').select('nim,ts,semester,sks_total,ipk,wali_id').order('nim')),
    sb.from('dosen').select('id,nidn,nama').then(r => r.data || []),
    ambilSemua(() => sb.from('jadwal_ta').select('nim,tahap,tanggal,status,hasil,pembimbing,pembimbing_luar').order('id'))
      .catch(() => ambilSemua(() => sb.from('jadwal_ta').select('nim,tahap,tanggal,status,hasil,pembimbing').order('id'))),
  ]);
  DATA = susunDaftar({ mahasiswa, semester, dosen, jadwal });
}

function saringan(){
  return { q: $('fQ').value, angkatan: $('fAng').value, status: $('fSt').value, tahunLulus: $('fLulus').value };
}

function gambar(){
  const xs = saringDaftar(DATA, saringan()), r = ringkasDaftar(xs);
  $('ringkas').innerHTML = [['semua', 'ditampilkan'], ['aktif', 'aktif'], ['lulus', 'lulus'], ['tidak_aktif', 'tidak tercatat aktif']]
    .map(([k, l]) => `<div><b>${r[k]}</b><span>${l}</span></div>`).join('');
  const tampil = SEMUA_BARIS ? xs : xs.slice(0, MAKS_TAMPIL);
  const tag = x => `<span class="tag${x.status === 'aktif' ? ' hijau' : x.status === 'lulus' ? ' biru' : ''}">${esc(STATUS_MHS[x.status])}</span>`;
  const ta = x => x.ta ? `${esc(x.ta.tahap)} <span class="kecil">${esc(x.ta.tanggal)}${x.ta.status !== 'selesai' ? ' · ' + esc(x.ta.status) : ''}</span>`
    + (x.ta.pembimbing.length ? `<div class="kecil">${esc(x.ta.pembimbing.join('; '))}</div>` : '') : '—';
  $('tabel').innerHTML = !xs.length ? '<p class="kosong">Tidak ada mahasiswa yang cocok dengan saringan.</p>'
    : `<div class="lebar-tabel"><table><thead><tr><th>NIM</th><th>Nama</th><th class="n">Angkatan</th><th>Status</th>
        <th>Semester terakhir / yudisium</th><th class="n">IPK</th><th class="n">SKS</th><th>Dosen wali</th><th>TA terakhir</th><th>Email</th>
      </tr></thead><tbody>${tampil.map(x => `<tr><td>${esc(x.nim)}</td><td>${esc(x.nama)}</td><td class="n">${esc(x.angkatan ?? '—')}</td>
        <td>${tag(x)}</td><td>${x.status === 'lulus' ? esc(teksPeriode(x.lulus_periode)) : esc(x.semester_terakhir || '—')}</td>
        <td class="n">${x.ipk == null ? '—' : x.ipk.toFixed(2)}</td><td class="n">${x.sks ?? '—'}</td><td>${esc(x.wali || '—')}</td>
        <td>${ta(x)}</td><td>${x.email ? `<a href="mailto:${esc(x.email)}">${esc(x.email)}</a>` : '—'}</td></tr>`).join('')}</tbody></table></div>`
      + (xs.length > tampil.length ? `<p class="ket">Menampilkan ${tampil.length} dari ${xs.length}.
          <button type="button" class="b ringan" id="bSemua">Tampilkan semua</button></p>` : '');
  if ($('bSemua')) $('bSemua').onclick = () => { SEMUA_BARIS = true; gambar(); };
}

async function unduh(){
  const xs = saringDaftar(DATA, saringan()), aoa = lembarDaftar(xs);
  try {
    const X = await import(SHEETJS), wb = X.utils.book_new(), ws = X.utils.aoa_to_sheet(aoa);
    ws['!cols'] = aoa[0].map((_, j) => ({ wch: Math.min(50, Math.max(8, ...aoa.slice(0, 200).map(r => String(r[j] ?? '').length))) }));
    X.utils.book_append_sheet(wb, ws, 'Mahasiswa');
    const s = saringan(), bagian = [s.status, s.angkatan && `angkatan-${s.angkatan}`, s.tahunLulus && `lulus-${s.tahunLulus}`].filter(Boolean);
    X.writeFile(wb, `daftar-mahasiswa${bagian.length ? '-' + bagian.join('-') : ''}.xlsx`);
  } catch (e) { alert('Unduh gagal: ' + (e.message || e)); }
}

async function mulai(){
  SAYA = await gerbang(sb);
  if (!SAYA) return;
  SEMUA = SAYA.peran === 'admin' || punya(SAYA, 'kaprodi') || SAYA.peran === 'pimpinan';
  $('hSub').textContent = `Masuk sebagai ${SAYA.nama}`;
  await muat();
  const angkatan = [...new Set(DATA.map(x => x.angkatan).filter(Boolean))].sort((a, b) => b - a);
  const tahunLulus = [...new Set(DATA.map(x => String(x.lulus_periode || '').slice(0, 4)).filter(Boolean))].sort().reverse();
  $('isi').innerHTML = `
    <p class="ket">${SEMUA ? 'Seluruh mahasiswa aktif (unggahan SIAKAD per semester di Perwalian) dan lulusan (daftar yudisium).'
      : 'Mahasiswa yang pernah tercatat dalam perwalian Anda.'} Data pribadi (email, IPK): gunakan hanya untuk keperluan prodi.
      Saring <b>Status: Lulus</b> dan <b>Tahun lulus</b>, lalu unduh Excel untuk daftar sasaran tracer study.</p>
    <div class="ringkas" id="ringkas"></div>
    <div class="saring">
      <input type="search" id="fQ" placeholder="Cari NIM atau nama" aria-label="Cari NIM atau nama">
      <label>Angkatan <select id="fAng"><option value="">Semua</option>${angkatan.map(a => `<option>${a}</option>`).join('')}</select></label>
      <label>Status <select id="fSt"><option value="">Semua</option>${Object.entries(STATUS_MHS)
        .map(([k, l]) => `<option value="${k}">${esc(l)}</option>`).join('')}</select></label>
      <label>Tahun lulus <select id="fLulus"><option value="">Semua</option>${tahunLulus.map(a => `<option>${a}</option>`).join('')}</select></label>
      <button type="button" class="b" id="bUnduh">Unduh Excel</button>
    </div>
    <div id="tabel"></div>`;
  for (const id of ['fQ', 'fAng', 'fSt', 'fLulus']) $(id).addEventListener(id === 'fQ' ? 'input' : 'change', () => { SEMUA_BARIS = false; gambar(); });
  $('bUnduh').onclick = unduh;
  gambar();
}
mulai().catch(e => { $('isi').innerHTML = `<p class="kosong">Gagal memuat: ${esc(e.message)}</p>`; });
</script>
</body>
</html>
