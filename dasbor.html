<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Dasbor operasional — Kinerja Program Studi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tema.css?v=2026-11-17-395d5b">
<link rel="stylesheet" href="kepala.css?v=2026-11-17-395d5b">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
  .wrap{max-width:1120px;margin:0 auto;padding:18px 20px 80px}
  .kosong, .ket{color:var(--muted)} .ket{font-size:13px}
  .ringkas{display:flex;flex-wrap:wrap;gap:10px;margin:4px 0 16px}
  .ringkas div{background:var(--panel);border:1px solid var(--line);padding:8px 14px}
  .ringkas b{font-family:var(--mono);font-size:22px;display:block}
  .ringkas span{font-size:12.5px;color:var(--muted)}
  .ringkas .awas b{color:var(--merah)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
  .kartu{background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--line);padding:12px 14px}
  .kartu.ok{border-top-color:var(--hijau)} .kartu.perhatian{border-top-color:var(--merah)}
  .kartu h2{font-family:var(--serif);font-size:17px;margin:0 0 2px}
  .pj{font-size:13px;color:var(--muted);margin-bottom:6px}
  .peringatan{font-size:12.5px;color:var(--emas);margin:2px 0}
  .baris{display:flex;gap:10px;align-items:baseline;padding:4px 0;border-top:1px solid var(--line-soft);font-size:14px}
  .baris a{flex:1;color:var(--ink);text-decoration:none} .baris a:hover{text-decoration:underline}
  .baris .n{font-family:var(--mono);font-weight:600}
  .baris .lewat{font-family:var(--mono);font-size:12px;color:var(--merah);font-weight:600}
</style>
</head>
<body>
<header class="hero"><div class="hero-in">
  <div class="hero-inst" data-identitas></div>
  <h1>Dasbor operasional</h1>
  <div class="sub" id="hSub">Memuat…</div>
</div></header>
<main class="wrap" id="isi"><p class="kosong">Memuat…</p></main>
<script src="config.js?v=2026-11-17-395d5b"></script>
<script>
// Galat saat memuat skrip ditampilkan sebagai pesan, bukan halaman kosong.
addEventListener('error', function (e) {
  if (document.getElementById('galat-muat')) return;
  var d = document.createElement('div');
  d.id = 'galat-muat';
  d.style.cssText = 'margin:16px;padding:12px 14px;border:1px solid var(--merah);' +
    'background:var(--merah-m3);color:var(--ink);font:14px/1.5 system-ui,sans-serif';
  d.textContent = 'Halaman gagal dimuat: ' + (e.message || 'galat skrip') +
    '. Tekan Ctrl+Shift+R untuk memuat ulang tanpa cache; bila tetap muncul, kirim pesan ini ke admin.';
  document.body.insertBefore(d, document.body.firstChild);
});
</script>
<script type="module">
// Dasbor operasional (pemilik 2026-11-17): koordinator prodi melihat per bidang siapa penanggung jawabnya dan antrean yang
// menunggu/terlambat. Hanya membaca; tindakan dilakukan di halaman kerja masing-masing (tautan di tiap baris).
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/+esm';
import { gerbang } from './menu.js?v=2026-11-17-395d5b';
import { ringkasDasbor, HARI_ANTRE } from './dasbor.js?v=2026-11-17-395d5b';
import { labelPeran } from './koordinator.js?v=2026-11-17-395d5b';

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = id => document.getElementById(id);
const sb = createClient(window.SB_URL, window.SB_KEY);
const baca = q => q.then(r => r.error ? [] : (r.data || []), () => []);   // tabel belum ada = kosong

async function mulai(){
  const saya = await gerbang(sb);
  if (!saya) return;
  $('hSub').textContent = `Masuk sebagai ${saya.nama} (${labelPeran(saya)})`;
  const [koordinator, pengajuan, jadwal, temuan, tindak, karya, kabar] = await Promise.all([
    baca(sb.from('koordinator').select('jabatan,mulai,selesai,nomor_sk,dokumen_id,dosen(nama)')),
    baca(sb.from('pengajuan_mahasiswa').select('jenis,status,tahap,dibuat,diperbarui').in('status', ['pembimbing', 'admin', 'disetujui']).limit(3000)),
    baca(sb.from('jadwal_ta').select('tanggal,status,hasil,batas_revisi,revisi_selesai').limit(3000)),
    baca(sb.from('ami_temuan').select('status,tenggat')),
    baca(sb.from('rapat_tindak').select('status,tenggat')),
    baca(sb.from('karya').select('status').eq('status', 'diajukan').limit(2000)),
    baca(sb.from('kabar_kegiatan').select('status').eq('status', 'diajukan'))]);
  // OBE O1 (101-patch-evaluasi-cpl-gkm.sql); tanpa patch = kosong.
  const [perluTL, tanpaBaris, tindakEval] = await Promise.all([baca(sb.rpc('evaluasi_perlu_tl')), baca(sb.rpc('cpl_belum_tanpa_evaluasi')),
    baca(sb.from('evaluasi_tindak').select('status,tenggat'))]);
  const B = ringkasDasbor({ koordinator, pengajuan, jadwal, temuan, tindak, karya, kabar, perluTL, tanpaBaris, tindakEval });
  const semua = B.flatMap(b => b.item), lewat = semua.reduce((a, i) => a + i.lewat, 0);
  const antre = semua.reduce((a, i) => a + i.n, 0), peringatan = B.reduce((a, b) => a + b.pj.peringatan.length, 0);
  $('isi').innerHTML = `
    <p class="ket">Per bidang: penanggung jawab (Admin prodi › Penugasan koordinator) dan pekerjaan yang menunggu. Merah = terlambat
      (pengajuan menunggu lebih dari ${HARI_ANTRE} hari, revisi atau tenggat lewat). Klik baris untuk membuka halaman kerjanya.</p>
    <div class="ringkas"><div class="${lewat ? 'awas' : ''}"><b>${lewat}</b><span>terlambat</span></div>
      <div><b>${antre}</b><span>dalam antrean</span></div>
      <div class="${peringatan ? 'awas' : ''}"><b>${peringatan}</b><span>peringatan penugasan</span></div></div>
    <div class="grid">${B.map(b => {
      const masalah = b.item.some(i => i.lewat) || b.pj.peringatan.length;
      return `<section class="kartu ${masalah ? 'perhatian' : 'ok'}"><h2>${esc(b.bidang)}</h2>
        ${b.jabatan ? `<div class="pj">Penanggung jawab: ${b.pj.nama.length ? esc(b.pj.nama.join(', ')) : '—'}</div>` : '<div class="pj">Koordinator prodi dan admin prodi</div>'}
        ${b.pj.peringatan.map(t => `<div class="peringatan">⚠ ${esc(t)}</div>`).join('')}
        ${b.item.map(i => `<div class="baris"><a href="${esc(i.href)}">${esc(i.label)}</a><span class="n">${i.n}</span>${
          i.lewat ? `<span class="lewat">${i.lewat} terlambat</span>` : ''}</div>`).join('')
          || '<div class="ket">Profil dan alat laboratorium dikelola kepala lab di halaman Laboratorium.</div>'}</section>`;
    }).join('')}</div>`;
}
mulai().catch(e => { $('isi').innerHTML = `<p class="kosong">Gagal memuat: ${esc(e.message)}</p>`; });
</script>
</body>
</html>
