// Galat saat memuat skrip (mis. modul lama dari cache bercampur dengan
// halaman baru) ditampilkan sebagai pesan, bukan halaman kosong.
addEventListener('error', function (e) {
  if (document.getElementById('galat-muat')) return;
  var d = document.createElement('div');
  d.id = 'galat-muat';
  d.style.cssText = 'margin:16px;padding:12px 14px;border:1px solid var(--merah);' +
    'background:var(--merah-m3);color:var(--ink);font:14px/1.5 system-ui,sans-serif';
  d.textContent = 'Halaman gagal dimuat: ' + (e.message || 'galat skrip') +
    '. Tekan Ctrl+Shift+R untuk memuat ulang tanpa cache; bila tetap muncul, kirim pesan ini ke admin.';
  document.body.insertBefore(d, document.body.firstChild);
});
</script>

/* =====================================================================

   Tabel lkps_* (supabase/16-patch-data-lkps.sql) memakai kolom yang sama

   jadi skor berubah setelah bangun berikutnya. Khusus admin (RLS).

     tahun | ta (2025/2026) | bulan | int (>= 0) | num (>= 0, opsional maks)

     cek (centang -> boolean, tampil "V"; awal = nilai baris baru)
     dokumen (pilih dari pustaka -> id dokumen; saran = jenis yang didahulukan)
     jamak (beberapa pilihan -> array teks; o = fungsi yang mengembalikan
            [[nilai, label]], dipanggil saat formulir digambar)
   Kait opsional per tab: patch (berkas SQL bila tabel belum ada), urut

   olah(nilai) sebelum simpan, cek(nilai) -> pesan galat.
   ===================================================================== */

const esc = s => String(s ?? '').replace(/[&<>"']/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = id => document.getElementById(id);

const SB_URL = window.SB_URL || '', SB_KEY = window.SB_KEY || '';
if (!SB_URL || !SB_KEY || SB_URL.includes('xxxx')) {
  $('isi').innerHTML = '<p class="kosong">config.js belum diisi.</p>';
  throw new Error('config.js belum diisi');
}
const sb = createClient(SB_URL, SB_KEY);
const UNGGAH = (() => {
  const url = String(window.UPLOAD_URL || '').trim();
  if (!url) return null;
  const ext = String(window.UPLOAD_EXT || '').toLowerCase().split(',').map(s => s.trim()).filter(Boolean);
  return { url, ext, maxMb: Number(window.UPLOAD_MAX_MB) || 0, accept: ext.map(x => '.' + x).join(',') };
})();

const BULAN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus',

const TABEL = [
  { id: 'tracer', tabel: 'lkps_tracer_lulusan', judul: 'Tracer study', butir: '48–51',

async function mulai(){
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return layarMasuk();
  const { data: saya } = await sb.from('dosen').select('nama,email,peran')
    .ilike('email', session.user.email).maybeSingle();
  if (!saya) { $('hSub').textContent = 'Tidak terdaftar'; $('isi').innerHTML = '<p class="kosong">Email belum terdaftar.</p>'; return; }
  SAYA = saya;
  pasangMenu(sb);
  if (saya.peran !== 'admin') {
    $('hSub').textContent = `Masuk sebagai ${saya.nama}`;
    $('isi').innerHTML = '<p class="kosong">Halaman ini khusus admin prodi.</p>';
    return;
  }
  $('hSub').textContent = `Masuk sebagai ${saya.nama} (admin)`;
  // Pilihan dosen (BKD, pembimbing): tanpa admin/asesor yang bukan DTPS
  // (admin staf/tendik bukan dosen).
  const { data: ds } = await sb.from('dosen').select('nidn,nama,peran,dtps').order('nama');
  DOSEN = (ds || []).filter(d => d.nidn && (d.dtps || ['dosen', 'pimpinan'].includes(d.peran)));
  ADA29 = !(await sb.from('lkps_bukti').select('dokumen_id').limit(1)).error;
  ADA30 = !(await sb.from('dokumen').select('nomor,tanggal').limit(1)).error;   // 30-patch-spmi.sql
  ADA43 = !(await sb.from('lkps_bukti').select('unsur').limit(1)).error;
  await muatPustaka();
  const awal = new URLSearchParams(location.search).get('tab');
  AKTIF = TABEL.find(t => t.id === awal) || TABEL[0];
  $('isi').innerHTML = `
    <div class="info">Data di halaman ini dipakai untuk skor, rincian, dan LKPS. Perubahan
      tampil di halaman skor setelah data dibangun ulang.</div>
    <nav class="grup-tab" id="grup"></nav>
    <nav class="tabs" id="tabs"></nav>
    <div class="b" id="panel"></div>`;
  // Sekali saja: panel tetap ada antar tab, isinya yang diganti.
  $('panel').addEventListener('click', klikPanel);
  $('grup').onclick = e => {
    const b = e.target.closest('[data-grup]');
    if (!b) return;
    pilihTab(TABEL.find(t => grupTab(t) === b.dataset.grup));
  };
  $('tabs').onclick = e => {
    const b = e.target.closest('[data-tab]');
    if (b) pilihTab(TABEL.find(t => t.id === b.dataset.tab));
  };
  pilihTab(AKTIF);
}

// Isian awal unggah ke pustaka untuk baris r: tahun baris, judul = label baris.
function setelUnggah(r){
  if (!$('bk_jenis')) return;
  const T = AKTIF;
  const judul = r ? T.label(r).slice(0, 120) : '';
  // Baris tanpa tahun (MK, VMTS, peta jalan): ikut tahun dokumen pustaka yang
  // sama jenis + judulnya, supaya unggah ulang MENGGANTI, bukan versi baru.
  const ada = !(r && T.tahun(r)) && DOK.filter(d => d.jenis === $('bk_jenis').value && (d.judul || '') === judul)
    .sort((a, b) => b.tahun - a.tahun)[0];
  $('bk_tahun').value = (r && T.tahun(r)) || ada?.tahun || new Date().getFullYear();
  $('bk_dj').value = judul;
  ketUnggah();
}
function ketUnggah(){
  const j = infoJenis($('bk_jenis').value);
  $('bk_dj').hidden = j.tunggal;
  const ada = cariDokumen(DOK, j.id, $('bk_tahun').value, $('bk_dj').value);
  $('bk_ket').className = 'ket' + (ada ? ' buruk' : '');
  $('bk_ket').textContent = ada
    ? `Sudah ada di pustaka: ${labelDokumen(ada)}. Unggahan akan MENGGANTI berkas itu (tidak membuat salinan); `
      + 'bila berkasnya sama, cukup pilih dari pustaka di atas.'
    : `Akan disimpan sebagai: ${j.nama}${j.tunggal ? '' : ' — (judul)'} tahun ${$('bk_tahun').value || '…'}.`;
}

    .sort((a, b) => (urut.indexOf(a.id) + 1 || 99) - (urut.indexOf(b.id) + 1 || 99));

    `<button data-tab="${t.id}" aria-selected="${t === AKTIF}">${esc(t.judul)}</button>`).join('') : '';
  $('tabs').hidden = isi.length < 2;
  bukaTab();
}

// Isi kotak pilihan jamak dengan pilihan terkini dan nilai terpilih.
function isiJamak(c, terpilih){
  const box = $('f_' + c.k);
  if (!box) return;
  const pilih = new Set(terpilih || []);
  const o = c.o();
  box.innerHTML = o.length ? o.map(([v, l]) => `<label class="cek"><input type="checkbox" value="${esc(v)}"${
    pilih.has(v) ? ' checked' : ''}>${esc(l)}</label>`).join('') : `<span class="kosong">${esc(c.kosong || 'Belum ada pilihan.')}</span>`;
}

// Mahasiswa jamak: pecah "A; B" menjadi baris nama + NIM, dan sebaliknya.
const pecahMhs = v => String(v ?? '').split(';').map(s => s.trim());
const barisMhs = (nama = '', nim = '') => `<div class="mhs-baris"><input data-mhs="nama" placeholder="Nama mahasiswa"
  value="${esc(nama)}"><input data-mhs="nim" placeholder="NIM" value="${esc(nim)}">
  <button type="button" class="btn ghost kecil" data-hapus-mhs="1" title="Hapus mahasiswa ini">×</button></div>`;
function isiMhs(c, r){
  const box = $('f_' + c.k);
  const nama = pecahMhs(r?.[c.k]), nim = pecahMhs(r?.[c.nim]);
  const n = Math.max(nama.filter(Boolean).length, nim.filter(Boolean).length, 1);
  box.innerHTML = Array.from({ length: n }, (_, i) => barisMhs(nama[i] || '', nim[i] || '')).join('');
}

function isian(c){
  const id = 'f_' + c.k, wj = c.wajib ? ' <span class="wj">*</span>' : '';
  if (c.t === 'mhs')
    return `<div class="fld lebar"><label>${esc(c.l)}${wj}</label><div class="mhs-daftar" id="${id}">${barisMhs()}</div>
      <button type="button" class="btn ghost kecil" data-tambah-mhs="${c.k}">+ Tambah mahasiswa</button></div>`;
  if (c.t === 'dokumen')
    return `<div class="fld lebar"><label for="${id}">${esc(c.l)}${wj}</label><select id="${id}">${opsiPustaka(DOK, c.saran || [])}</select>
      <small>Dipilih dari tab Dokumen (pustaka); unggah dokumennya di sana bila belum ada.</small></div>`;
  if (c.t === 'paragraf')
    return `<div class="fld lebar"><label for="${id}">${esc(c.l)}${wj}</label><textarea id="${id}" rows="3"></textarea>${c.contoh ? htmlContoh(id) : ''}</div>`;
  if (c.t === 'cek')
    return `<div class="fld"><label class="cek" style="margin-top:20px"><input type="checkbox" id="${id}"${c.awal ? ' checked' : ''}>${esc(c.l)}</label></div>`;
  if (c.t === 'jamak')
    return `<div class="fld lebar"><label>${esc(c.l)}${wj}</label><div class="jamak" id="${id}"></div></div>`;
  let el;
  if (c.t === 'pilihan' || c.t === 'bulan' || c.t === 'nidn') {
    const o = c.t === 'bulan' ? BULAN.map((b, i) => [String(i + 1), b])
            : c.t === 'nidn' ? DOSEN.map(d => [d.nidn, `${d.nama} (${d.nidn})`]) : c.o;
    el = `<select id="${id}"><option value="">—</option>${o.map(([v, l]) =>
      `<option value="${esc(v)}">${esc(l)}</option>`).join('')}</select>`;
  } else if (c.t === 'url') {
    el = `<input type="url" id="${id}" placeholder="https://…">
      ${UNGGAH ? `<div class="unggah-baris"><input type="file" id="${id}_berkas" accept="${esc(UNGGAH.accept)}">
        <button type="button" class="btn ghost kecil" data-unggah="${c.k}">Unggah</button></div>` : ''}`;
  } else {
    const jenis = ['int', 'num', 'tahun'].includes(c.t) ? 'number' : c.t === 'tanggal' ? 'date' : 'text';
    const atr = c.t === 'num' ? ' step="any" min="0"' : c.t === 'int' ? ' step="1" min="0"'
              : c.t === 'tahun' ? ' step="1" min="1990" max="2100"' : '';
    el = `<input type="${jenis}" id="${id}"${atr}${c.t === 'ta' ? ' placeholder="2025/2026"' : ''}>`;
  }
  return `<div class="fld${c.lebar || c.t === 'url' ? ' lebar' : ''}"><label for="${id}">${esc(c.l)}${wj}</label>${el}</div>`;
}

// Baca dan periksa isian; hasil {nilai, galat}. Aturan = batasan SQL patch 16.
function bacaForm(){
  const nilai = {}, galat = [];
  for (const c of kolomForm(AKTIF)) {
    const el = $('f_' + c.k);
    if (c.t === 'cek') { nilai[c.k] = el.checked; continue; }
    if (c.t === 'dokumen') { nilai[c.k] = el.value ? +el.value : null; continue; }
    if (c.t === 'mhs') {
      const rows = [...el.querySelectorAll('.mhs-baris')].map(b => ({
        nama: b.querySelector('[data-mhs=nama]').value.trim(), nim: b.querySelector('[data-mhs=nim]').value.trim() }))
        .filter(x => x.nama || x.nim);
      if (rows.some(x => x.nama.includes(';') || x.nim.includes(';'))) { galat.push(`${c.l}: satu orang per baris, tanpa titik koma`); continue; }
      if (c.wajib && !rows.length) { galat.push(`${c.l}: wajib diisi`); continue; }
      nilai[c.k] = rows.length ? rows.map(x => x.nama).join('; ') : null;
      nilai[c.nim] = rows.some(x => x.nim) ? rows.map(x => x.nim).join('; ') : null;
      continue;
    }
    if (c.t === 'jamak') { nilai[c.k] = [...el.querySelectorAll('input:checked')].map(x => x.value); continue; }
    const v = el.value.trim();
    el.classList.remove('salah');
    const salah = p => { galat.push(`${c.l}: ${p}`); el.classList.add('salah'); };
    if (!v) { if (c.wajib) salah('wajib diisi'); nilai[c.k] = null; continue; }
    if (c.t === 'tahun' || c.t === 'int' || c.t === 'bulan') {
      const n = Number(v);
      if (!Number.isInteger(n)) { salah('harus bilangan bulat'); continue; }
      if (c.t === 'tahun' && (n < 1990 || n > 2100)) { salah('tahun 1990–2100'); continue; }
      if (c.t === 'int' && n < 0) { salah('tidak boleh negatif'); continue; }
      nilai[c.k] = n;
    } else if (c.t === 'num') {
      const n = Number(v.replace(',', '.'));
      if (!Number.isFinite(n) || n < 0) { salah('angka ≥ 0 (desimal memakai titik)'); continue; }
      if (c.maks != null && n > c.maks) { salah(`maksimal ${c.maks}`); continue; }
      nilai[c.k] = n;
    } else if (c.t === 'tanggal') {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(v) || +v.slice(0, 4) < 1990 || +v.slice(0, 4) > 2100) { salah('tanggal 1990–2100'); continue; }
      nilai[c.k] = v;
    } else if (c.t === 'ta') {
      const m = v.match(/^(\d{4})\/(\d{4})$/);
      if (!m || +m[2] !== +m[1] + 1) { salah('tulis seperti 2025/2026'); continue; }
      nilai[c.k] = v;
    } else if (c.t === 'url') {
      if (!/^https?:\/\/\S+$/i.test(v)) { salah('tautan https://…'); continue; }
      nilai[c.k] = v;
    } else nilai[c.k] = v;
  }
  if (!galat.length && AKTIF.olah) AKTIF.olah(nilai);
  if (!galat.length && AKTIF.cek) { const g = AKTIF.cek(nilai); if (g) galat.push(g); }
  return { nilai, galat };
}

function isiForm(r){
  SUNTING = r ? r.id : null;
  ANTREAN = [];
  kolomForm(AKTIF).forEach(c => {
    const el = $('f_' + c.k);
    if (c.t === 'cek') { el.checked = r ? r[c.k] === true : !!c.awal; return; }
    if (c.t === 'mhs') { isiMhs(c, r); return; }
    if (c.t === 'jamak') { isiJamak(c, r ? r[c.k] : []); return; }
    el.value = r && r[c.k] != null ? String(r[c.k]) : '';
    el.classList.remove('salah');
  });
  $('simpan').textContent = r ? 'Simpan perubahan' : 'Tambah baris';
  $('batal').hidden = !r;
  tulis('', r ? 'Mengubah baris terpilih.' : '');
  setelUnggah(r);
  document.querySelectorAll('#daftar tr').forEach(tr => tr.classList.toggle('sunting', !!r && tr.dataset.id === String(r.id)));
  gambarBukti();
  if (r) $('form').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

const tulis = (cls, t) => { const m = $('msg'); m.className = 'msg' + (cls ? ' ' + cls : ''); m.textContent = t; };

async function muatBaris(){
  const T = AKTIF;
  let q = sb.from(T.tabel).select('*');
  for (const k of (T.urut || [])) q = q.order(k, { ascending: true, nullsFirst: false });
  const { data, error } = await q.order('id', { ascending: !!T.urut });
  const box = $('daftar');
  if (T !== AKTIF) return;
  if (error) {
    box.innerHTML = `<p class="kosong">Tabel <code>${esc(T.tabel)}</code> belum bisa dibaca (${esc(error.message)}).
      Jalankan <code>supabase/${esc(T.patch || '16-patch-data-lkps.sql')}</code>.</p>`;
    $('simpan').disabled = true;
    return;
  }
  BARIS = data || [];
  if (T.siapkan) BARIS.forEach(T.siapkan);
  // Pilihan jamak bisa bergantung pada baris tab ini (mis. MK pendukung).
  kolomForm(T).filter(c => c.t === 'jamak').forEach(c => {
    const r = SUNTING ? BARIS.find(x => x.id === SUNTING) : null;
    isiJamak(c, r ? r[c.k] : [...($('f_' + c.k)?.querySelectorAll('input:checked') || [])].map(x => x.value));
  });
  const lb = await sb.from('lkps_bukti').select((ADA29 ? 'id,baris_id,judul,url,dokumen_id' : 'id,baris_id,judul,url')
      + (ADA43 ? ',unsur' : ''))
    .eq('tabel', T.tabel).order('id');
  LB_GAGAL = lb.error ? lb.error.message : '';
  LB = new Map();
  (lb.data || []).forEach(x => { if (!LB.has(x.baris_id)) LB.set(x.baris_id, []); LB.get(x.baris_id).push(x); });
  if (!BARIS.length) { box.innerHTML = '<p class="kosong">Belum ada baris.</p>'; return; }
  const tampil = (c, v) => c.t === 'cek' ? (v === true ? 'V' : '—')
    : c.t === 'dokumen' ? (dokPer(v) ? `<a href="${esc(dokPer(v).url)}" target="_blank" rel="noopener nofollow">${esc(labelDokumen(dokPer(v)))}</a>` : '—')
    : c.t === 'mhs' ? (v ? esc(pecahMhs(v).filter(Boolean).join('; ')) : '—')
    : c.t === 'jamak' ? (v && v.length ? esc(v.map(x => (c.o().find(o => o[0] === x) || [x, x])[1]).join('; ')) : '—')
    : v == null || v === '' ? '—'
    : c.t === 'tanggal' ? esc(String(v).slice(0, 10).split('-').reverse().join('/'))
    : c.t === 'paragraf' ? esc(String(v).length > 90 ? String(v).slice(0, 88) + '…' : v)
    : c.t === 'url' ? `<a href="${esc(v)}" target="_blank" rel="noopener nofollow">buka</a>`
    : c.t === 'bulan' ? esc(BULAN[v - 1] || v)
    : c.t === 'nidn' ? esc((DOSEN.find(d => d.nidn === v) || {}).nama || v)
    : c.t === 'pilihan' ? esc((c.o.find(o => o[0] === String(v)) || [v, v])[1]) : esc(v);
  box.innerHTML = `<table class="t"><thead><tr>${kolomForm(T).map(c => `<th>${esc(c.l)}</th>`).join('')}
      <th>Bukti</th><th>Diperbarui</th><th></th></tr></thead><tbody>${BARIS.map(r => `<tr data-id="${r.id}">
      ${kolomForm(T).map(c => `<td>${tampil(c, r[c.k])}</td>`).join('')}
      <td>${T.privat ? (r.bukti_url ? `<button type="button" class="btn ghost kecil" data-lkd="${esc(r.bukti_url)}">Buka LKD</button>` : '—')
        : buktiBaris(r).map(x => `<a href="${esc(x.url)}" target="_blank" rel="noopener nofollow"
        title="${esc(x.judul)}">${esc(x.judul.length > 24 ? x.judul.slice(0, 22) + '…' : x.judul)}</a>`).join('<br>') || '—'}</td>
      <td>${esc(String(r.diperbarui || '').slice(0, 10))}${T.tanda ? T.tanda(r) : ''}</td>
      <td><button type="button" class="btn ghost kecil" data-ubah="${r.id}">Ubah</button>
          <button type="button" class="btn bahaya kecil" data-hapus="${r.id}">Hapus</button></td></tr>`).join('')}
    </tbody></table>`;
}

async function simpan(){
  const { nilai, galat } = bacaForm();
  if (galat.length) return tulis('buruk', galat.join(' · '));
  const isi = { ...nilai, oleh: SAYA.email, diperbarui: new Date().toISOString() };
  $('simpan').disabled = true;
  const lkd = AKTIF.privat ? $('lkd_berkas')?.files[0] : null;
  if (lkd) {
    tulis('', 'Mengunggah LKD…');
    try { isi.bukti_url = await unggahLKD(sb, lkd, nilai.tahun_akademik, nilai.semester, (DOSEN.find(d => d.nidn === nilai.nidn) || {}).nama); }
    catch (err) { $('simpan').disabled = false; return tulis('buruk', err.message || String(err)); }
  }
  const q = SUNTING ? sb.from(AKTIF.tabel).update(isi).eq('id', SUNTING)
                    : sb.from(AKTIF.tabel).insert(isi).select('id').single();
  const { data: hasil, error } = await q;
  $('simpan').disabled = false;
  let catatan = '';
  if (!error && !SUNTING && ANTREAN.length) {
    const { error: eB } = await sb.from('lkps_bukti').insert(ANTREAN.map(b => barisBukti(b, hasil.id)));
    if (eB) catatan = ' Bukti gagal dicatat (' + eB.message + '); ubah baris lalu tambahkan lagi.';
  }
  if (error) return tulis('buruk', /duplicate|unique/i.test(error.message)
    ? 'Baris dengan kunci yang sama sudah ada (mis. tahun yang sama). Ubah baris itu saja.'
    : 'Gagal menyimpan: ' + error.message);
  const ubah = !!SUNTING;
  isiForm(null);
  tulis(catatan ? 'buruk' : 'ok', (ubah ? 'Perubahan tersimpan.' : 'Baris ditambahkan.') + catatan);
  await muatBaris();
}

async function klikPanel(e){
  const lk = e.target.closest('[data-lkd]');
  if (lk) return bukaLKD(sb, lk.dataset.lkd);
  const tm = e.target.closest('[data-tambah-mhs]');
  if (tm) { $('f_' + tm.dataset.tambahMhs).insertAdjacentHTML('beforeend', barisMhs()); return; }
  const hm = e.target.closest('[data-hapus-mhs]');
  if (hm) {
    const box = hm.closest('.mhs-daftar');
    hm.closest('.mhs-baris').remove();
    if (!box.querySelector('.mhs-baris')) box.insertAdjacentHTML('beforeend', barisMhs());
    return;
  }
  const u = e.target.closest('[data-ubah]');
  if (u) return isiForm(BARIS.find(r => r.id === +u.dataset.ubah));
  const h = e.target.closest('[data-hapus]');
  if (h) {
    const r = BARIS.find(x => x.id === +h.dataset.hapus);
    // Dokumen pustaka tidak dibuang (bisa dipakai di tempat lain); hanya tautannya.
    const urls = buktiBaris(r || {}).filter(x => !x.pustaka).map(x => x.url);
    if (!r || !confirm(`Hapus baris "${AKTIF.label(r)}"?` +
      (urls.length ? ` ${urls.length} berkas buktinya ikut dihapus. ${PESAN_SAMPAH}` : '') +
      ' Dokumen pustaka yang ditautkan tetap tersimpan di tab Dokumen.')) return;
    try { await buangSemua(sb, urls); }
    catch (err) { return tulis('buruk', 'Gagal membuang berkas bukti: ' + (err.message || err)); }
    const { error } = await sb.from(AKTIF.tabel).delete().eq('id', r.id);
    if (error) return tulis('buruk', 'Gagal menghapus: ' + error.message);
    await sb.from('lkps_bukti').delete().eq('tabel', AKTIF.tabel).eq('baris_id', r.id);
    if (SUNTING === r.id) isiForm(null);
    tulis('ok', 'Baris dihapus.');
    return muatBaris();
  }
  const g = e.target.closest('[data-unggah]');
  if (g) return ADA29 ? unggahPustaka(g) : unggah(g);
  const tk = e.target.closest('[data-tautkan]');
  if (tk) {
    const id = +$('bk_pustaka').value;
    if (!id) return tulis('buruk', 'Pilih dokumen dari pustaka dulu.');
    return tambahBukti([{ dokumen_id: id }]);
  }
  const lp = e.target.closest('[data-lepas-bukti]');
  if (lp) {
    if (!confirm('Lepas dokumen ini dari baris? Dokumennya tetap ada di pustaka.')) return;
    const { error } = await sb.from('lkps_bukti').delete().eq('id', +lp.dataset.lepasBukti);
    if (error) return tulis('buruk', 'Gagal: ' + error.message);
    await muatBaris(); gambarBukti(); return;
  }
  const pu = e.target.closest('[data-unggah-pustaka]');
  if (pu) return unggahPustakaTab(pu);
  const hd = e.target.closest('[data-hapus-dok]');
  if (hd) return hapusDokumen(+hd.dataset.hapusDok);
  const ud = e.target.closest('[data-ubah-dok]');
  if (ud) return ubahNomorDokumen(+ud.dataset.ubahDok);
  const tl = e.target.closest('[data-tautan]');
  if (tl) {
    const url = $('bk_url').value.trim(), judul = $('bk_judul').value.trim();
    if (!/^https?:\/\/\S+$/i.test(url)) return tulis('buruk', 'Isi tautan bukti https://… yang sah.');
    await tambahBukti([{ judul: judul || 'Tautan bukti', url }]);
    $('bk_url').value = ''; $('bk_judul').value = '';
    return;
  }
  const ha = e.target.closest('[data-hapus-antrean]');
  if (ha) { ANTREAN.splice(+ha.dataset.hapusAntrean, 1); return gambarBukti(); }
  const hb = e.target.closest('[data-hapus-bukti]');
  if (hb) {
    if (!confirm('Hapus bukti ini dari baris? ' + PESAN_SAMPAH)) return;
    try { await buangBerkas(sb, hb.dataset.url); }
    catch (err) { return tulis('buruk', 'Gagal membuang berkas: ' + (err.message || err)); }
    const { error } = await sb.from('lkps_bukti').delete().eq('id', +hb.dataset.hapusBukti);
    if (error) return tulis('buruk', 'Gagal: ' + error.message);
    await muatBaris(); gambarBukti();
  }
}

// Semua bukti satu baris: kolom tautan lama + lkps_bukti.
function buktiBaris(r){
  const lama = r[kolomLama(AKTIF)];
  const pustaka = x => x.dokumen_id ? { ...x, pustaka: true, url: dokPer(x.dokumen_id)?.url || '',
    judul: labelDokumen(dokPer(x.dokumen_id)) || 'Dokumen pustaka' } : x;
  return [...(lama ? [{ judul: 'Bukti (lama)', url: lama }] : []), ...(LB.get(r.id) || []).map(pustaka)];
}
// Baris lkps_bukti dari satu bukti (tautan pustaka atau tautan luar).
const barisBukti = (b, barisId) => ({ ...(b.dokumen_id
  ? { tabel: AKTIF.tabel, baris_id: barisId, dokumen_id: b.dokumen_id, judul: '', oleh: SAYA.email }
  : { tabel: AKTIF.tabel, baris_id: barisId, judul: b.judul, url: b.url, oleh: SAYA.email }),
  ...(b.unsur ? { unsur: b.unsur } : {}) });

// Bukti di form: baris yang diubah (tersimpan) atau baris baru (antrean).
function gambarBukti(){
  const ul = $('bukti-l');
  if (!ul) return;
  if (LB_GAGAL) { ul.innerHTML = `<li class="kosong">Tabel lkps_bukti belum bisa dibaca (${esc(LB_GAGAL)}).
    Jalankan supabase/17-patch-lkps-bukti.sql.</li>`; return; }
  const r = SUNTING ? BARIS.find(x => x.id === SUNTING) : null;
  const xs = r ? buktiBaris(r).map(x => ({ ...x, hapus: !x.id ? ''
                   : x.pustaka ? `data-lepas-bukti="${x.id}"` : `data-hapus-bukti="${x.id}" data-url="${esc(x.url)}"` }))
               : ANTREAN.map((x, i) => ({ ...x, ...(x.dokumen_id ? { pustaka: true, url: dokPer(x.dokumen_id)?.url || '',
                   judul: labelDokumen(dokPer(x.dokumen_id)) } : {}), hapus: `data-hapus-antrean="${i}"` }));
  gambarUnsur(xs);
  ul.innerHTML = xs.length ? xs.map(x => `<li>${x.unsur ? `<span class="tag-unsur">unsur ${x.unsur}</span> ` : ''}${
    x.pustaka ? '<span class="tag-pustaka">pustaka</span> ' : ''}<a href="${esc(x.url)}"
    target="_blank" rel="noopener nofollow">${esc(x.judul)}</a>
    ${x.hapus ? `<button type="button" class="btn bahaya kecil" ${x.hapus} title="${x.pustaka ? 'Lepas dari baris' : 'Hapus'}">×</button>` : ''}</li>`).join('')
    : `<li class="kosong">${r ? 'Belum ada bukti.' : 'Belum ada bukti; yang diunggah akan tersimpan bersama baris ini.'}</li>`;
}

// Ringkasan unsur: mana yang sudah ada buktinya dan skor butir dari baris ini.
function gambarUnsur(xs){
  const box = $('unsur-status');
  if (!box) return;
  const T = AKTIF, aktif = T.unsur.aktif();
  $('unsur-pilih').hidden = !aktif;
  $('unsur-mati').hidden = aktif || !T.unsur.mati;
  $('unsur-mati').textContent = T.unsur.mati || '';
  if (!aktif) { box.innerHTML = ''; return; }
  const ada = new Set(xs.map(x => +x.unsur).filter(Boolean));
  const no = typeof T.unsur.butir === 'function' ? T.unsur.butir({ jenis: $('f_jenis')?.value }) : T.unsur.butir;
  box.innerHTML = `<b>Unsur butir ${esc(no)}</b> (skor dari baris ini: ${skorUnsur(ada)} dari 4)<ol>${
    T.unsur.daftar.map((u, i) => `<li class="${ada.has(i + 1) ? 'ada' : 'belum'}">${
      ada.has(i + 1) ? '✓' : '—'} ${esc(u)}</li>`).join('')}</ol>
    <small>Skor = banyaknya unsur berurutan mulai unsur 1 yang ada buktinya.</small>`;
}

async function tambahBukti(items){
  // Dokumen pustaka yang sudah tertaut ke baris ini (untuk unsur yang sama) tidak ditautkan dua kali.
  const u = unsurDipilih();
  items = items.map(b => ({ ...b, unsur: u }));
  const kunci = x => `${x.dokumen_id}|${x.unsur || ''}`;
  const sudah = new Set((SUNTING ? LB.get(SUNTING) || [] : ANTREAN).filter(x => x.dokumen_id).map(kunci));
  const baru = items.filter(b => !b.dokumen_id || !sudah.has(kunci(b)));
  if (!baru.length) return tulis('buruk', 'Dokumen itu sudah menjadi bukti baris ini.');
  items = baru;
  if (!SUNTING) { ANTREAN.push(...items); gambarBukti(); return tulis('ok', `${items.length} bukti siap; tersimpan saat baris disimpan.`); }
  const { error } = await sb.from('lkps_bukti').insert(items.map(b => barisBukti(b, SUNTING)));
  if (error) return tulis('buruk', 'Bukti gagal dicatat: ' + error.message);
  await muatBaris(); gambarBukti();
  tulis('ok', `${items.length} bukti ditambahkan.`);
}

const keB64 = f => new Promise((ok, gagal) => {
  const r = new FileReader();
  r.onload = () => ok(String(r.result).split(',')[1] || '');
  r.onerror = () => gagal(new Error('Berkas tidak bisa dibaca: ' + f.name));
  r.readAsDataURL(f);
});

// Bukti baris -> Drive data-lkps/dokumen/<tabel>/<tahun>/<label>/ (Apps
// Script kind 'dokumen', mode 'tambah'). Beberapa berkas sekaligus; tiap
// berkas menjadi satu bukti (lkps_bukti).
async function unggah(tombol){
  const semua = [...($('bk_berkas').files || [])];
  if (!semua.length) return tulis('buruk', 'Pilih berkas bukti dulu.');
  const ditolak = semua.filter(f => {
    const e = ((f.name.match(/\.([^.]+)$/) || [])[1] || '').toLowerCase();
    return !UNGGAH.ext.includes(e) || (UNGGAH.maxMb && f.size > UNGGAH.maxMb * 1024 * 1024);
  });
  if (ditolak.length) return tulis('buruk', `Ditolak: ${ditolak.map(f => f.name).join(', ')}. ` +
    `Diterima: ${UNGGAH.ext.join(', ')}, maksimal ${UNGGAH.maxMb} MB.`);
  const r = SUNTING ? BARIS.find(x => x.id === SUNTING) : bacaForm().nilai;
  const tahun = AKTIF.tahun(r || {}) || new Date().getFullYear();
  tombol.disabled = true;
  const items = [], gagal = [];
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) throw new Error('Sesi login habis. Muat ulang halaman.');
    for (let i = 0; i < semua.length; i++) {
      const f = semua[i];
      tulis('', `Mengunggah ${i + 1} dari ${semua.length}: ${f.name}…`);
      try {
        const res = await fetch(UNGGAH.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ token: session.access_token, kind: 'dokumen', jenis: AKTIF.tabel,
            tahun: String(tahun), judul: AKTIF.label(r || {}).slice(0, 80), mode: 'tambah',
            filename: f.name, data: await keB64(f) }) });
        const out = await res.json();
        if (!out.ok) throw new Error(out.error || 'Unggah gagal.');
        items.push({ judul: f.name, url: tautanBerkas(out) });
      } catch (err) {
        gagal.push(`${f.name}: ${err.message || err}`);
        if (/Sesi login/.test(err.message || '')) break;
      }
    }
    $('bk_berkas').value = '';
    if (items.length) await tambahBukti(items);
    if (gagal.length) tulis('buruk', `${items.length} dari ${semua.length} terunggah. Gagal: ${gagal.join('; ')}`);
  } catch (err) {
    tulis('buruk', err.message || String(err));
  } finally {
    tombol.disabled = false;
  }
}

// ---------------------------------------------------------------------
//  Pustaka dokumen (29-patch-pustaka-dokumen.sql)
// ---------------------------------------------------------------------
async function muatPustaka(){
  const { data, error } = await sb.from('dokumen').select('*').order('jenis').order('tahun', { ascending: false });
  DOK_GAGAL = error ? error.message : '';
  DOK = data || [];
}

// Pesan hasil unggahKePustaka; `_ada` = berkas yang sama sudah tersimpan (31-patch-sidik-berkas.sql).
const pesanPustaka = (d, akhir) => d._ada === 'pustaka'
  ? `Berkas yang sama sudah ada di pustaka sebagai ${labelDokumen(d)}; tidak diunggah ulang${akhir ? ', dokumen itu ' + akhir : ''}.`
  : d._ada === 'bukti'
  ? `Berkas yang sama sudah tersimpan sebagai bukti lain; ${labelDokumen(d)} dicatat di pustaka dengan berkas itu, tanpa unggah ulang${akhir ? ', lalu ' + akhir : ''}.`
  : `${labelDokumen(d)} tersimpan di pustaka${akhir ? ' dan ' + akhir : ''}.`;

// Unggah dari bukti baris: berkas masuk pustaka (kunci sama = mengganti), lalu ditautkan.
async function unggahPustaka(tombol){
  const berkas = [...($('bk_berkas').files || [])];
  tombol.disabled = true;
  try {
    const d = await unggahKePustaka(sb, UNGGAH, { jenis: $('bk_jenis').value, tahun: $('bk_tahun').value,
      judul: $('bk_dj').value, berkas, oleh: SAYA.email, progres: s => tulis('', s) });
    await muatPustaka();
    $('bk_berkas').value = '';
    $('bk_pustaka').innerHTML = opsiPustaka(DOK, AKTIF.dok);
    ketUnggah();
    await tambahBukti([{ dokumen_id: d.id }]);
    tulis('ok', pesanPustaka(d, 'ditautkan ke baris ini'));
  } catch (err) {
    tulis('buruk', err.message || String(err));
  } finally {
    tombol.disabled = false;
  }
}

// Tab Dokumen: unggah ke pustaka + daftar dokumen dan tempat pemakaiannya.
async function bukaPustaka(){
  const T = AKTIF;
  $('panel').innerHTML = `<p class="ket">${esc(T.ket)}</p>${saranTab(T)}
    ${DOK_GAGAL ? `<p class="kosong">Tabel <code>dokumen</code> belum bisa dibaca (${esc(DOK_GAGAL)}).
      Jalankan supabase/13-patch-dokumen.sql.</p>` : ''}
    ${UNGGAH && !DOK_GAGAL ? `<div class="grid">
      <div class="fld"><label for="pk_jenis">Jenis dokumen (bertanda privat: tanpa tautan publik)</label><select id="pk_jenis">${opsiJenis([], '')}</select></div>
      <div class="fld"><label for="pk_tahun">Tahun dokumen</label><input type="number" id="pk_tahun" min="1990" max="2100"
        value="${new Date().getFullYear()}"></div>
      <div class="fld" id="pk_judul_w"><label for="pk_judul">Judul (jenis banyak)</label><input type="text" id="pk_judul" maxlength="120"></div>
      ${ADA30 ? `<div class="fld"><label for="pk_nomor">Nomor dokumen (opsional)</label><input type="text" id="pk_nomor" maxlength="120"></div>
      <div class="fld"><label for="pk_tanggal">Tanggal dokumen (opsional)</label><input type="date" id="pk_tanggal"></div>` : ''}
      <div class="fld lebar"><label>Berkas</label><div class="unggah-baris"><input type="file" id="pk_berkas" accept="${esc(UNGGAH.accept)}" multiple>
        <button type="button" class="btn" data-unggah-pustaka="1">Unggah ke pustaka</button></div>
        <p class="ket" id="pk_ket"></p></div></div>` : ''}
    <div class="aksi"><span class="msg" id="msg"></span></div>
    <div class="gulir" id="daftar"><p class="kosong">Memuat…</p></div>
    <h3 class="sub-h">Privatkan berkas lama</h3>
    <p class="ket">Berkas jenis privat yang terlanjur punya tautan publik dipindah ke folder privat, tautan publiknya dicabut,
      dan catatannya menuju halaman kata sandi.</p>
    <div class="aksi"><button type="button" class="btn ghost" id="privatkan">Privatkan berkas lama</button>
      <span class="msg" id="privatkan_msg"></span></div>
    <h3 class="sub-h">Rapikan berkas lama</h3><div id="rapikan"></div>`;
  $('privatkan').onclick = async e => {
    const m = $('privatkan_msg');
    e.target.disabled = true;
    try {
      const n = await privatkanLama(sb, t => { m.className = 'msg'; m.textContent = t; });
      m.className = 'msg'; m.textContent = n ? `${n} berkas dipindah ke penyimpanan privat.` : 'Tidak ada berkas yang perlu dipindah.';
      await muatPustaka(); await gambarPustaka();
    } catch (err) { m.className = 'msg buruk'; m.textContent = err.message || String(err); }
    e.target.disabled = false;
  };
  pasangRapikan(sb, $('rapikan'), { tabel: TABEL, saran: SARAN_DOK, oleh: SAYA.email,
    selesai: async () => { await muatPustaka(); await gambarPustaka(); } });
  if ($('pk_jenis')) {
    const ket = () => {
      const j = infoJenis($('pk_jenis').value);
      $('pk_judul_w').hidden = j.tunggal;
      const ada = cariDokumen(DOK, j.id, $('pk_tahun').value, $('pk_judul').value);
      $('pk_ket').className = 'ket' + (ada ? ' buruk' : '');
      $('pk_ket').textContent = ada ? `Sudah ada: ${labelDokumen(ada)}. Unggahan akan MENGGANTI berkasnya (versi lama ke _arsip).`
        : (j.contoh ? `Contoh judul: ${j.contoh}.` : '');
    };
    ['pk_jenis', 'pk_tahun', 'pk_judul'].forEach(i => { $(i).oninput = ket; });
    ket();
  }
  await gambarPustaka();
}

// Pemakaian dokumen: baris Data prodi (lkps_bukti) dan butir (butir_bukti).
async function gambarPustaka(){
  const box = $('daftar');
  if (!box || DOK_GAGAL) { if (box) box.innerHTML = ''; return; }
  const [lb, bb, pp] = await Promise.all([
    ADA29 ? sb.from('lkps_bukti').select('dokumen_id,tabel') : { data: [] },
    sb.from('butir_bukti').select('dokumen_id,butir'),
    // Tautan tahap PPEPP ke pustaka (30-patch-spmi.sql); tabel belum ada -> kosong.
    sb.from('lkps_spmi_ppepp').select('dokumen_id,audit_dokumen_id,rtm_dokumen_id,peningkatan_dokumen_id')]);
  const judulTab = Object.fromEntries(TABEL.map(x => [x.tabel, x.judul]));
  const pakai = new Map();
  (lb.data || []).filter(x => x.dokumen_id).forEach(x => { if (!pakai.has(x.dokumen_id)) pakai.set(x.dokumen_id, []); pakai.get(x.dokumen_id).push(judulTab[x.tabel] || x.tabel); });
  (pp.error ? [] : pp.data || []).forEach(x => ['dokumen_id', 'audit_dokumen_id', 'rtm_dokumen_id', 'peningkatan_dokumen_id']
    .forEach(k => { if (!x[k]) return; if (!pakai.has(x[k])) pakai.set(x[k], []); pakai.get(x[k]).push('SPMI (PPEPP)'); }));
  (bb.data || []).filter(x => x.dokumen_id).forEach(x => { if (!pakai.has(x.dokumen_id)) pakai.set(x.dokumen_id, []); pakai.get(x.dokumen_id).push('butir ' + x.butir); });
  if (!DOK.length) { box.innerHTML = '<p class="kosong">Belum ada dokumen di pustaka.</p>'; return; }
  const ringkas = xs => Object.entries(xs.reduce((a, s) => (a[s] = (a[s] || 0) + 1, a), {}))
    .map(([s, n]) => n > 1 ? `${s} (${n})` : s).join(', ');
  box.innerHTML = `<table class="t"><thead><tr><th>Jenis</th><th>Tahun</th><th>Judul</th>${ADA30 ? '<th>Nomor</th><th>Tanggal</th>' : ''}<th>Dipakai di</th>
      <th>Berkas</th><th>Diperbarui</th><th></th></tr></thead><tbody>${DOK.map(d => `<tr>
      <td>${esc(infoJenis(d.jenis).nama)}</td><td>${esc(d.tahun)}</td><td>${esc(d.judul || '—')}</td>
      ${ADA30 ? `<td>${esc(d.nomor || '—')}</td><td>${esc(d.tanggal ? String(d.tanggal).split('-').reverse().join('/') : '—')}</td>` : ''}
      <td>${esc(ringkas(pakai.get(d.id) || []) || '—')}</td>
      <td><a href="${esc(d.url)}" target="_blank" rel="noopener nofollow">buka</a></td>
      <td>${esc(String(d.diperbarui || '').slice(0, 10))}</td>
      <td>${ADA30 ? `<button type="button" class="btn ghost kecil" data-ubah-dok="${esc(d.id)}">Nomor/tanggal</button> ` : ''}<button type="button" class="btn bahaya kecil" data-hapus-dok="${esc(d.id)}" data-pakai="${(pakai.get(d.id) || []).length}">Hapus</button></td>
    </tr>`).join('')}</tbody></table>`;
}

async function unggahPustakaTab(tombol){
  const berkas = [...($('pk_berkas').files || [])];
  tombol.disabled = true;
  try {
    const d = await unggahKePustaka(sb, UNGGAH, { jenis: $('pk_jenis').value, tahun: $('pk_tahun').value,
      judul: $('pk_judul').value, berkas, oleh: SAYA.email, progres: s => tulis('', s),
      nomor: $('pk_nomor')?.value, tanggal: $('pk_tanggal')?.value });
    await muatPustaka();
    $('pk_berkas').value = '';
    tulis('ok', pesanPustaka(d, ''));
    await gambarPustaka();
  } catch (err) {
    tulis('buruk', err.message || String(err));
  } finally {
    tombol.disabled = false;
  }
}

// Nomor dan tanggal dokumen pustaka tanpa unggah ulang (LKPS 7.a, 30-patch-spmi.sql).
async function ubahNomorDokumen(id){
  const d = dokPer(id);
  if (!d) return;
  const nomor = prompt(`Nomor dokumen ${labelDokumen(d)} (kosongkan bila tidak ada):`, d.nomor || '');
  if (nomor === null) return;
  const tgl = prompt('Tanggal dokumen, format YYYY-MM-DD (kosongkan bila tidak ada):', d.tanggal || '');
  if (tgl === null) return;
  if (tgl.trim() && !/^\d{4}-\d{2}-\d{2}$/.test(tgl.trim())) return tulis('buruk', 'Tanggal ditulis YYYY-MM-DD, mis. 2024-03-15.');
  const { error } = await sb.from('dokumen').update({ nomor: nomor.trim() || null, tanggal: tgl.trim() || null }).eq('id', id);
  if (error) return tulis('buruk', 'Gagal menyimpan: ' + error.message);
  await muatPustaka();
  tulis('ok', 'Nomor dan tanggal dokumen tersimpan.');
  await gambarPustaka();
}

async function hapusDokumen(id){
  const d = dokPer(id);
  const n = +(document.querySelector(`[data-hapus-dok="${id}"]`)?.dataset.pakai || 0);
  if (!d || !confirm(`Hapus ${labelDokumen(d)} dari pustaka?` +
    (n ? ` Dokumen ini dipakai sebagai bukti di ${n} tempat; tautan buktinya ikut hilang.` : '') + ` ${PESAN_SAMPAH}`)) return;
  try { await buangBerkas(sb, d.url); }
  catch (err) { return tulis('buruk', 'Gagal membuang berkas: ' + (err.message || err)); }
  const { error } = await sb.from('dokumen').delete().eq('id', id);
  if (error) return tulis('buruk', 'Gagal menghapus: ' + error.message);
  await muatPustaka();
  tulis('ok', 'Dokumen dihapus dari pustaka.');
  await gambarPustaka();
}

  $('kirim').onclick = async () => {
    const em = $('em').value.trim();

    $('pesan').textContent = error ? 'Gagal: ' + error.message : 'Tautan masuk sudah dikirim. Periksa email Anda.';
  };
}

sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_IN' && !SAYA) mulai(); });
mulai().catch(e => { $('isi').innerHTML = `<p class="kosong">${esc(e.message)}</p>`; });
