addEventListener('error', function (e) {
  if (document.getElementById('galat-muat')) return;
  var d = document.createElement('div');
  d.id = 'galat-muat';
  d.style.cssText = 'margin:16px;padding:12px 14px;border:1px solid var(--merah);' +
    'background:var(--merah-m3);color:var(--ink);font:14px/1.5 system-ui,sans-serif';

    '. Tekan Ctrl+Shift+R untuk memuat ulang tanpa cache; bila tetap muncul, kirim pesan ini ke admin.';
  document.body.insertBefore(d, document.body.firstChild);
});

async function simpanImporSPM(){

  const r = RENCANA_SPM;
  if (!r) return;

  const jejak = { oleh: SAYA.email, diperbarui: new Date().toISOString() };
  const semua = [...r.baru, ...r.ubah, ...r.sama];
  const urutan = new Map(semua.map((b, i) => [b.kode, i + 1]));
  const teks = b => ({ kode: b.kode, induk: b.induk, sub: b.sub, lembar: b.lembar, pernyataan: b.pernyataan, luaran: b.luaran,
    pic: b.pic, referensi: b.referensi, urutan: urutan.get(b.kode), ...jejak });
  const potong = (xs, n) => Array.from({ length: Math.ceil(xs.length / n) }, (_, i) => xs.slice(i * n, i * n + n));
  try {
    msg('', 'Menyimpan butir…');
    for (const xs of potong(r.baru.map(b => ({ ...teks(b), asal: 'institusi', dipantau: true, aktif: true })), 100)) {
      const { error } = await sb.from('spmi_standar').insert(xs);

      if (error) throw error;

      const { data, error } = await sb.from('spmi_standar').select('id,kode').in('kode', ks);
      if (error) throw error;
      (data || []).forEach(x => ids.set(x.kode, x.id));
    }
    msg('', 'Menyimpan target per TS…');
    const tg = semua.flatMap(b => Object.entries(b.target).filter(() => ids.has(b.kode))
      .map(([ts, target]) => ({ standar_id: ids.get(b.kode), tahun_ts: +ts, target, ...jejak })));
    for (const xs of potong(tg, 200)) {
      const { error } = await sb.from('spmi_capaian').upsert(xs, { onConflict: 'standar_id,tahun_ts' });
      if (error) throw error;
    }

    msg('ok', `${r.baru.length} butir baru, ${r.ubah.length} diperbarui, ${tg.length} target tersimpan. Capaian diisi di halaman Siklus PPEPP.`);
  } catch (err) {
    $('spm_simpan').disabled = false;
    msg('buruk', 'Gagal: ' + err.message + '. Bagian yang sudah tersimpan tetap ada; simpan lagi untuk melanjutkan.');
  }
}

function barisIKU(kepala, sel){

  const jenis = ambil('jenis').toLowerCase();

  const nama = ambil('nama');

  const ts = ambil('tahun_ts');
  if (/^\d{4}$/.test(ts) && +ts >= 2000 && +ts <= 2100) isi.tahun_ts = +ts; else galat.push('tahun_ts: 4 angka, mis. 2026');
  const bidang = ambil('bidang').toLowerCase().replace(/\s+/g, '_');
  if (bidang) { if (BIDANG_IKU.includes(bidang)) isi.bidang = bidang; else galat.push('bidang: ' + BIDANG_IKU.join('/')); }
  const arah = ambil('arah').toLowerCase();
  if (arah) { if (/^min/.test(arah)) isi.arah = 'minimal'; else if (/^maks|^max/.test(arah)) isi.arah = 'maksimal'; else galat.push('arah: minimal/maksimal'); }
  for (const k of ['butir', 'target', 'capaian', 'urutan']) {
    const v = ambil(k).replace(',', '.');
    if (v === '') continue;
    if (!Number.isFinite(+v)) { galat.push(`${k} bukan angka`); continue; }
    isi[k] = ['butir', 'urutan'].includes(k) ? Math.round(+v) : +v;
  }
  if (isi.butir != null && (isi.butir < 1 || isi.butir > 60)) galat.push('butir 1–60');
  for (const k of ['satuan', 'tujuan_strategis', 'dampak', 'daya_saing', 'analisis']) { const v = ambil(k); if (v) isi[k] = v; }
  return { isi, galat };
}

// ---------------------------------------------------------------------
const KOLOM_CSV_MK = ['kode', 'nama', 'semester', 'sks_kuliah', 'sks_seminar', 'sks_praktikum', 'sifat',
  'unit_penyelenggara', 'inti', 'basic_science', 'capstone', 'aktif'];
const CONTOH_CSV_MK = [
  ['SI1101', 'Kalkulus I', '1', '3', '0', '0', 'wajib', 'universitas', 'tidak', 'ya', 'tidak', 'ya'],
  ['SI4201', 'Perancangan Terintegrasi', '7', '2', '0', '2', 'wajib', 'prodi', 'ya', 'tidak', 'ya', 'ya'],
  ['SI4305', 'Rekayasa Pantai', '7', '2', '0', '0', 'pilihan', 'prodi', 'tidak', 'tidak', 'tidak', 'ya']];
// CSV dengan pemisah ';' atau ',' (dipilih dari baris judul) dan tanda kutip.
function bacaCSV(teks){
  teks = String(teks || '').replace(/^\uFEFF/, '');
  const judul = teks.split(/\r?\n/)[0] || '';
  const pisah = (judul.match(/;/g) || []).length > (judul.match(/,/g) || []).length ? ';' : ',';
  const baris = []; let r = [], v = '', q = false;
  for (let i = 0; i < teks.length; i++) {
    const c = teks[i];
    if (q) { if (c === '"') { if (teks[i + 1] === '"') { v += '"'; i++; } else q = false; } else v += c; continue; }
    if (c === '"') q = true;
    else if (c === pisah) { r.push(v); v = ''; }
    else if (c === '\n') { r.push(v); baris.push(r); r = []; v = ''; }
    else if (c !== '\r') v += c;
  }
  if (v !== '' || r.length) { r.push(v); baris.push(r); }
  return baris.filter(x => x.some(s => s.trim() !== ''));
}
// Baris CSV -> {kode, isi, galat}; sel kosong tidak menimpa (kolomnya dilewati).
function barisMK(kepala, sel, lama){
  const ambil = k => { const i = kepala.indexOf(k); return i < 0 ? '' : String(sel[i] ?? '').trim(); };
  const isi = {}, galat = [];
  const kode = ambil('kode');
  if (!kode) return { kode, isi, galat: ['kode kosong'] };
  isi.kode = kode;
  const nama = ambil('nama');
  if (nama) isi.nama = nama; else if (!lama) galat.push('nama kosong (MK baru)');
  for (const k of ['semester', 'sks_kuliah', 'sks_seminar', 'sks_praktikum']) {
    const v = ambil(k).replace(',', '.');
    if (v === '') continue;
    if (!Number.isFinite(+v) || +v < 0) galat.push(`${k} bukan angka`);
    else isi[k] = k === 'semester' ? Math.round(+v) : +v;
  }
  if (isi.semester != null && (isi.semester < 1 || isi.semester > 14)) galat.push('semester 1–14');
  const sifat = ambil('sifat').toLowerCase();
  if (sifat) { if (/^w/.test(sifat)) isi.sifat = 'wajib'; else if (/^p/.test(sifat)) isi.sifat = 'pilihan'; else galat.push('sifat: wajib/pilihan'); }
  const unit = ambil('unit_penyelenggara').toLowerCase();
  if (unit) { if (['universitas', 'fakultas', 'prodi'].includes(unit)) isi.unit_penyelenggara = unit; else galat.push('unit: universitas/fakultas/prodi'); }
  for (const k of ['inti', 'basic_science', 'capstone', 'aktif']) {
    const v = ambil(k).toLowerCase();
    if (v === '') continue;
    if (/^(ya|y|v|1|true|benar|x)$/.test(v)) isi[k] = true;
    else if (/^(tidak|t|n|0|false|salah|-)$/.test(v)) isi[k] = false;
    else galat.push(`${k}: ya/tidak`);
  }
  const bag = ['sks_kuliah', 'sks_seminar', 'sks_praktikum'];
  if (bag.some(k => k in isi)) isi.sks = bag.reduce((a, k) => a + (+(k in isi ? isi[k] : lama?.[k]) || 0), 0);
  return { kode, isi, galat };
}

const KOLOM_PERSEN = ['sangat_baik', 'baik', 'cukup', 'kurang'];
const taKini = () => { const d = new Date(), y = d.getFullYear(); return d.getMonth() >= 8 ? `${y}/${y + 1}` : `${y - 1}/${y}`; };
function gambarMassalKepuasan(ta){
  const box = $('massal');
  if (!box) return;
  const tas = [...new Set(BARIS.map(r => r.tahun_akademik).filter(Boolean))].sort().reverse();
  const awal = ta || tas[0] || taKini();
  const per = new Map(BARIS.filter(r => r.tahun_akademik === awal).map(r => [r.aspek, r]));
  const bukti = [...per.values()].find(r => r.bukti_url)?.bukti_url || '';
  box.innerHTML = `<details class="massal" open><summary><b>Isi sekaligus: tujuh aspek satu tahun akademik</b>
      (${per.size} dari 7 aspek ${esc(awal)} sudah ada)</summary>
    <div class="unggah-baris"><label>Tahun akademik survei <input id="m_ta" value="${esc(awal)}" placeholder="2025/2026"
      list="m_ta_ada"></label><datalist id="m_ta_ada">${tas.map(x => `<option value="${esc(x)}">`).join('')}</datalist>
      <button type="button" class="btn ghost kecil" id="m_muat">Tampilkan</button></div>
    <div class="gulir"><table class="t"><thead><tr><th>Aspek</th><th>Sangat baik %</th><th>Baik %</th><th>Cukup %</th>
      <th>Kurang %</th><th>Jumlah</th><th>Rencana tindak lanjut</th></tr></thead><tbody>
    ${ASPEK_KEPUASAN.map(([a, l]) => { const r = per.get(a) || {}; return `<tr data-aspek="${a}"><td>${esc(l)}</td>
      ${KOLOM_PERSEN.map(k => `<td><input type="number" min="0" max="100" step="0.01" data-k="${k}"
        value="${r[k] ?? ''}" style="width:78px"></td>`).join('')}
      <td data-jml>—</td><td><input data-k="rencana_tindak_lanjut" value="${esc(r.rencana_tindak_lanjut || '')}"></td></tr>`; }).join('')}
    </tbody></table></div>
    <div class="unggah-baris"><label>Tautan laporan survei (dipakai ketujuh baris)
      <input type="url" id="m_bukti" value="${esc(bukti)}" placeholder="https://…" style="min-width:320px"></label></div>
    <p class="ket">Kosongkan keempat persentase untuk aspek yang belum ada datanya (dihitung 0 di butir 52).
      Tiap baris yang diisi harus berjumlah 100.</p>
    <div class="aksi"><button type="button" class="btn" id="m_simpan">Simpan tujuh aspek</button>
      <span class="msg" id="m_msg"></span></div></details>`;
  const hitung = () => box.querySelectorAll('tr[data-aspek]').forEach(tr => {
    const v = KOLOM_PERSEN.map(k => tr.querySelector(`[data-k="${k}"]`).value.trim());
    const sel = tr.querySelector('[data-jml]');
    if (v.every(x => x === '')) { sel.textContent = '—'; sel.style.color = ''; return; }
    const j = v.reduce((a, x) => a + (+x || 0), 0);
    sel.textContent = String(Math.round(j * 100) / 100);
    sel.style.color = Math.abs(j - 100) > 1 ? 'var(--merah)' : 'var(--hijau)';
  });
  box.oninput = hitung;
  hitung();
  $('m_muat').onclick = () => gambarMassalKepuasan($('m_ta').value.trim());
  $('m_simpan').onclick = simpanMassalKepuasan;
}
async function simpanMassalKepuasan(){
  // Formulir digambar ulang setelah simpan: elemen pesan dicari setiap kali.
  const tulisM = (cls, s) => { const msg = $('m_msg'); msg.className = 'msg' + (cls ? ' ' + cls : ''); msg.textContent = s; };
  const ta = $('m_ta').value.trim(), bukti = $('m_bukti').value.trim();
  const m = ta.match(/^(\d{4})\/(\d{4})$/);
  if (!m || +m[2] !== +m[1] + 1) return tulisM('buruk', 'Tahun akademik ditulis seperti 2025/2026.');
  if (bukti && !/^https?:\/\/\S+$/i.test(bukti)) return tulisM('buruk', 'Tautan laporan survei tidak sah.');
  const baris = [], salah = [];
  $('massal').querySelectorAll('tr[data-aspek]').forEach(tr => {
    const v = Object.fromEntries(KOLOM_PERSEN.map(k => [k, tr.querySelector(`[data-k="${k}"]`).value.trim()]));
    const nama = tr.cells[0].textContent;
    if (Object.values(v).every(x => x === '')) return;
    if (Object.values(v).some(x => x === '')) return salah.push(`${nama}: isi keempat persentase`);
    const j = KOLOM_PERSEN.reduce((a, k) => a + +v[k], 0);
    if (Math.abs(j - 100) > 1) return salah.push(`${nama}: berjumlah ${j}`);
    baris.push({ tahun_akademik: ta, aspek: tr.dataset.aspek, ...Object.fromEntries(KOLOM_PERSEN.map(k => [k, +v[k]])),
      rencana_tindak_lanjut: tr.querySelector('[data-k="rencana_tindak_lanjut"]').value.trim() || null,
      bukti_url: bukti || null, oleh: SAYA.email, diperbarui: new Date().toISOString() });
  });
  if (salah.length) return tulisM('buruk', 'Periksa: ' + salah.join('; ') + '.');
  if (!baris.length) return tulisM('buruk', 'Belum ada aspek yang diisi.');
  $('m_simpan').disabled = true;
  const { error } = await sb.from('lkps_kepuasan_pengguna').upsert(baris, { onConflict: 'tahun_akademik,aspek' });
  $('m_simpan').disabled = false;
  if (error) return tulisM('buruk', 'Gagal menyimpan: ' + error.message);
  await muatBaris();
  gambarMassalKepuasan(ta);
  tulisM('ok', `${baris.length} aspek ${ta} tersimpan.` + (baris.length < 7 ? ` ${7 - baris.length} aspek belum diisi (dihitung 0).` : ''));
}

// Isian awal unggah ke pustaka untuk baris r: tahun baris, judul = label baris.
function setelUnggah(r){
  if (!$('bk_jenis')) return;
  const T = AKTIF;
  const judul = r ? T.label(r).slice(0, 120) : '';
  // Baris tanpa tahun (MK, VMTS, peta jalan): ikut tahun dokumen pustaka yang
  // sama jenis + judulnya, supaya unggah ulang MENGGANTI, bukan versi baru.
  const ada = !(r && T.tahun(r)) && DOK.filter(d => d.jenis === $('bk_jenis').value && (d.judul || '') === judul)
    .sort((a, b) => b.tahun - a.tahun)[0];
  $('bk_tahun').value = (r && T.tahun(r)) || ada?.tahun || new Date().getFullYear();
  $('bk_dj').value = judul;
  ketUnggah();
}
function ketUnggah(){
  const j = infoJenis($('bk_jenis').value);
  $('bk_dj').hidden = j.tunggal;
  const ada = cariDokumen(DOK, j.id, $('bk_tahun').value, $('bk_dj').value);
  $('bk_ket').className = 'ket' + (ada ? ' buruk' : '');
  $('bk_ket').textContent = ada
    ? `Sudah ada di pustaka: ${labelDokumen(ada)}. Unggahan akan MENGGANTI berkas itu (tidak membuat salinan); `
      + 'bila berkasnya sama, cukup pilih dari pustaka di atas.'
    : `Akan disimpan sebagai: ${j.nama}${j.tunggal ? '' : ' — (judul)'} tahun ${$('bk_tahun').value || '…'}.`;
}

// Kelompok tab (pemilik 2026-11-04): baris atas kelompok, baris bawah tab di
// kelompok terpilih. Urutan kelompok = urutan tampil.
const GRUP_TAB = [
  ['Dokumen', ['dokumen']],
  ['Dosen & SDM', ['bkd', 'tendik']],
  ['Kurikulum & penelitian', ['mk', 'tema', 'peta_dok', 'kerjasama', 'bidang_keahlian', 'topik_keahlian']],
  ['Mahasiswa & lulusan', ['mahasiswa', 'kohort', 'prestasi', 'publikasi', 'luaran', 'tracer', 'kepuasan']],
  ['Institusi & keuangan', ['vmts', 'prodi_upps', 'dana']],
  ['Sarana & K3L', ['prasarana', 'dok_k3l', 'fas_k3l']],
  ['SPMI', ['standar', 'revisi', 'spmi', 'target', 'temuan']],
];
const grupTab = T => (GRUP_TAB.find(([, ids]) => ids.includes(T.id)) || ['Lainnya'])[0];

function pilihTab(T){
  AKTIF = T || TABEL[0];
  history.replaceState(null, '', '?tab=' + AKTIF.id);
  const g = grupTab(AKTIF);
  const grup = [...GRUP_TAB.map(([n]) => n), ...(TABEL.some(t => grupTab(t) === 'Lainnya') ? ['Lainnya'] : [])];
  $('grup').innerHTML = grup.map(n => `<button data-grup="${esc(n)}" aria-selected="${n === g}">${esc(n)}</button>`).join('');
  const urut = (GRUP_TAB.find(([n]) => n === g) || [, []])[1];
  const isi = TABEL.filter(t => grupTab(t) === g)
    .sort((a, b) => (urut.indexOf(a.id) + 1 || 99) - (urut.indexOf(b.id) + 1 || 99));
  $('tabs').innerHTML = isi.length > 1 ? isi.map(t =>
    `<button data-tab="${t.id}" aria-selected="${t === AKTIF}">${esc(t.judul)}</button>`).join('') : '';
  $('tabs').hidden = isi.length < 2;
  bukaTab();
}

  if (T.khusus) return bukaPustaka();
  $('panel').innerHTML = `<p class="ket">${nomorButir(T.butir).length
    ? `<b>${htmlTautanButir(nomorButir(T.butir), null, 'Dipakai di')}.</b>` : `<b>${esc(T.butir)}.</b>`} ${esc(T.ket)}</p>${saranTab(T)}
    ${T.id === 'kepuasan' ? '<div id="massal"></div>' : ''}${T.id === 'mk' ? '<div id="impor-mk"></div>' : ''}${T.id === 'target' ? '<div id="capaian-iku"></div><div id="impor-iku"></div>' : ''}${T.id === 'temuan' ? '<div id="ringkas-temuan"></div>' : ''}${T.id === 'standar' ? '<div id="pantau-lembar"></div><div id="impor-standar"></div>' : ''}
    <form id="form" novalidate><div class="grid">${kolomForm(T).map(isian).join('')}
      ${T.tanpaBukti ? '' : T.privat ? blokLKD() : blokBukti(T)}</div>
      <div class="aksi"><button type="submit" class="btn" id="simpan">Tambah baris</button>

  $('form').addEventListener('change', e => { if (['f_capstone', 'f_jenis'].includes(e.target.id)) gambarBukti(); });
  if ($('bk_jenis')) ['bk_jenis', 'bk_tahun', 'bk_dj'].forEach(i => { $(i).oninput = ketUnggah; });
  setelUnggah(null);
  ANTREAN = [];
  await muatBaris();
  gambarBukti();
}

// Isi kotak pilihan jamak dengan pilihan terkini dan nilai terpilih.
function isiJamak(c, terpilih){
  const box = $('f_' + c.k);
  if (!box) return;
  const pilih = new Set(terpilih || []);
  const o = c.o();
  box.innerHTML = o.length ? o.map(([v, l]) => `<label class="cek"><input type="checkbox" value="${esc(v)}"${
    pilih.has(v) ? ' checked' : ''}>${esc(l)}</label>`).join('') : `<span class="kosong">${esc(c.kosong || 'Belum ada pilihan.')}</span>`;
}

// Mahasiswa jamak: pecah "A; B" menjadi baris nama + NIM, dan sebaliknya.
const pecahMhs = v => String(v ?? '').split(';').map(s => s.trim());
const barisMhs = (nama = '', nim = '') => `<div class="mhs-baris"><input data-mhs="nama" placeholder="Nama mahasiswa"
  value="${esc(nama)}"><input data-mhs="nim" placeholder="NIM" value="${esc(nim)}">
  <button type="button" class="btn ghost kecil" data-hapus-mhs="1" title="Hapus mahasiswa ini">×</button></div>`;
function isiMhs(c, r){
  const box = $('f_' + c.k);
  const nama = pecahMhs(r?.[c.k]), nim = pecahMhs(r?.[c.nim]);
  const n = Math.max(nama.filter(Boolean).length, nim.filter(Boolean).length, 1);
  box.innerHTML = Array.from({ length: n }, (_, i) => barisMhs(nama[i] || '', nim[i] || '')).join('');
}

function isian(c){
  const id = 'f_' + c.k, wj = c.wajib ? ' <span class="wj">*</span>' : '';
  if (c.t === 'mhs')
    return `<div class="fld lebar"><label>${esc(c.l)}${wj}</label><div class="mhs-daftar" id="${id}">${barisMhs()}</div>
      <button type="button" class="btn ghost kecil" data-tambah-mhs="${c.k}">+ Tambah mahasiswa</button></div>`;
  if (c.t === 'dokumen')
    return `<div class="fld lebar"><label for="${id}">${esc(c.l)}${wj}</label><select id="${id}">${opsiPustaka(DOK, c.saran || [])}</select>
      <small>Dipilih dari tab Dokumen (pustaka); unggah dokumennya di sana bila belum ada.</small></div>`;
  if (c.t === 'paragraf')
    return `<div class="fld lebar"><label for="${id}">${esc(c.l)}${wj}</label><textarea id="${id}" rows="3"></textarea>${c.contoh ? htmlContoh(id) : ''}</div>`;
  if (c.t === 'cek')
    return `<div class="fld"><label class="cek" style="margin-top:20px"><input type="checkbox" id="${id}"${c.awal ? ' checked' : ''}>${esc(c.l)}</label></div>`;
  if (c.t === 'jamak')
    return `<div class="fld lebar"><label>${esc(c.l)}${wj}</label><div class="jamak" id="${id}"></div></div>`;
  let el;
  if (c.t === 'pilihan' || c.t === 'bulan' || c.t === 'nidn') {
    const o = c.t === 'bulan' ? BULAN.map((b, i) => [String(i + 1), b])
            : c.t === 'nidn' ? DOSEN.map(d => [d.nidn, `${d.nama} (${d.nidn})`]) : opsi(c);
    el = `<select id="${id}"><option value="">—</option>${o.map(([v, l]) =>
      `<option value="${esc(v)}">${esc(l)}</option>`).join('')}</select>`;
  } else if (c.t === 'url') {
    el = `<input type="url" id="${id}" placeholder="https://…">
      ${UNGGAH ? `<div class="unggah-baris"><input type="file" id="${id}_berkas" accept="${esc(UNGGAH.accept)}">
        <button type="button" class="btn ghost kecil" data-unggah="${c.k}">Unggah</button></div>` : ''}`;
  } else {
    const jenis = ['int', 'num', 'tahun'].includes(c.t) ? 'number' : c.t === 'tanggal' ? 'date' : 'text';
    const atr = c.t === 'num' ? ' step="any" min="0"' : c.t === 'int' ? ' step="1" min="0"'
              : c.t === 'tahun' ? ' step="1" min="1990" max="2100"' : '';
    el = `<input type="${jenis}" id="${id}"${atr}${c.t === 'ta' ? ' placeholder="2025/2026"' : ''}>`;
  }
  return `<div class="fld${c.lebar || c.t === 'url' ? ' lebar' : ''}"><label for="${id}">${esc(c.l)}${wj}</label>${el}</div>`;
}

// Baca dan periksa isian; hasil {nilai, galat}. Aturan = batasan SQL patch 16.
function bacaForm(){
  const nilai = {}, galat = [];
  for (const c of kolomForm(AKTIF)) {
    const el = $('f_' + c.k);
    if (c.t === 'cek') { nilai[c.k] = el.checked; continue; }
    if (c.t === 'dokumen') { nilai[c.k] = el.value ? +el.value : null; continue; }
    if (c.t === 'mhs') {
      const rows = [...el.querySelectorAll('.mhs-baris')].map(b => ({
        nama: b.querySelector('[data-mhs=nama]').value.trim(), nim: b.querySelector('[data-mhs=nim]').value.trim() }))
        .filter(x => x.nama || x.nim);
      if (rows.some(x => x.nama.includes(';') || x.nim.includes(';'))) { galat.push(`${c.l}: satu orang per baris, tanpa titik koma`); continue; }
      if (c.wajib && !rows.length) { galat.push(`${c.l}: wajib diisi`); continue; }
      nilai[c.k] = rows.length ? rows.map(x => x.nama).join('; ') : null;
      nilai[c.nim] = rows.some(x => x.nim) ? rows.map(x => x.nim).join('; ') : null;
      continue;
    }
    if (c.t === 'jamak') { nilai[c.k] = [...el.querySelectorAll('input:checked')].map(x => x.value); continue; }
    const v = el.value.trim();
    el.classList.remove('salah');
    const salah = p => { galat.push(`${c.l}: ${p}`); el.classList.add('salah'); };
    if (!v) { if (c.wajib) salah('wajib diisi'); nilai[c.k] = null; continue; }
    if (c.t === 'tahun' || c.t === 'int' || c.t === 'bulan') {
      const n = Number(v);
      if (!Number.isInteger(n)) { salah('harus bilangan bulat'); continue; }
      if (c.t === 'tahun' && (n < 1990 || n > 2100)) { salah('tahun 1990–2100'); continue; }
      if (c.t === 'int' && n < 0) { salah('tidak boleh negatif'); continue; }
      nilai[c.k] = n;
    } else if (c.t === 'num') {
      const n = Number(v.replace(',', '.'));
      if (!Number.isFinite(n) || n < 0) { salah('angka ≥ 0 (desimal memakai titik)'); continue; }
      if (c.maks != null && n > c.maks) { salah(`maksimal ${c.maks}`); continue; }
      nilai[c.k] = n;
    } else if (c.t === 'tanggal') {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(v) || +v.slice(0, 4) < 1990 || +v.slice(0, 4) > 2100) { salah('tanggal 1990–2100'); continue; }
      nilai[c.k] = v;
    } else if (c.t === 'ta') {
      const m = v.match(/^(\d{4})\/(\d{4})$/);
      if (!m || +m[2] !== +m[1] + 1) { salah('tulis seperti 2025/2026'); continue; }
      nilai[c.k] = v;
    } else if (c.t === 'url') {
      if (!/^https?:\/\/\S+$/i.test(v)) { salah('tautan https://…'); continue; }
      nilai[c.k] = v;
    } else nilai[c.k] = v;
  }
  if (!galat.length && AKTIF.olah) AKTIF.olah(nilai);
  if (!galat.length && AKTIF.cek) { const g = AKTIF.cek(nilai); if (g) galat.push(g); }
  return { nilai, galat };
}

function isiForm(r){
  SUNTING = r ? r.id : null;
  ANTREAN = [];
  kolomForm(AKTIF).forEach(c => {
    const el = $('f_' + c.k);
    if (c.t === 'cek') { el.checked = r ? r[c.k] === true : !!c.awal; return; }
    if (c.t === 'mhs') { isiMhs(c, r); return; }
    if (c.t === 'jamak') { isiJamak(c, r ? r[c.k] : []); return; }
    el.value = r && r[c.k] != null ? String(r[c.k]) : '';
    el.classList.remove('salah');
  });
  $('simpan').textContent = r ? 'Simpan perubahan' : 'Tambah baris';
  $('batal').hidden = !r;
  tulis('', r ? 'Mengubah baris terpilih.' : '');
  setelUnggah(r);
  document.querySelectorAll('#daftar tr').forEach(tr => tr.classList.toggle('sunting', !!r && tr.dataset.id === String(r.id)));
  gambarBukti();
  if (r) $('form').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

const tulis = (cls, t) => { const m = $('msg'); m.className = 'msg' + (cls ? ' ' + cls : ''); m.textContent = t; };

async function muatBaris(){
  const T = AKTIF;
  let q = sb.from(T.tabel).select('*');
  for (const k of (T.urut || [])) q = q.order(k, { ascending: true, nullsFirst: false });
  const { data, error } = await q.order('id', { ascending: !!T.urut });
  const box = $('daftar');
  if (T !== AKTIF) return;
  if (error) {
    box.innerHTML = `<p class="kosong">Tabel <code>${esc(T.tabel)}</code> belum bisa dibaca (${esc(error.message)}).
      Jalankan <code>supabase/${esc(T.patch || '16-patch-data-lkps.sql')}</code>.</p>`;
    $('simpan').disabled = true;
    return;
  }
  BARIS = data || [];
  if (T.siapkan) BARIS.forEach(T.siapkan);
  if (T.id === 'kepuasan') gambarMassalKepuasan($('m_ta')?.value.trim());
  if (T.id === 'mk' && $('impor-mk') && !$('impor-mk').innerHTML) gambarImporMK();
  if (T.id === 'target') gambarCapaianIKU($('ci_ts')?.value);
  if (T.id === 'target' && $('impor-iku') && !$('impor-iku').innerHTML) gambarImporIKU();
  if (T.id === 'temuan' && $('ringkas-temuan')) $('ringkas-temuan').innerHTML = htmlRingkasTemuan(ringkasTemuan(BARIS));
  if (T.id === 'standar' || T.id === 'temuan') await muatDaftarSPMI();
  if (T.id === 'standar' && $('impor-standar') && !$('impor-standar').innerHTML) gambarImporStandar();
  if (T.id === 'standar') gambarPantauLembar();

async function simpan(){
  const { nilai, galat } = bacaForm();
  if (galat.length) return tulis('buruk', galat.join(' · '));
  const isi = { ...nilai, oleh: SAYA.email, diperbarui: new Date().toISOString() };
  $('simpan').disabled = true;
  const lkd = AKTIF.privat ? $('lkd_berkas')?.files[0] : null;
  if (lkd) {
    tulis('', 'Mengunggah LKD…');
    try { isi.bukti_url = await unggahLKD(sb, lkd, nilai.tahun_akademik, nilai.semester, (DOSEN.find(d => d.nidn === nilai.nidn) || {}).nama); }
    catch (err) { $('simpan').disabled = false; return tulis('buruk', err.message || String(err)); }
  }
  const q = SUNTING ? sb.from(AKTIF.tabel).update(isi).eq('id', SUNTING)
                    : sb.from(AKTIF.tabel).insert(isi).select('id').single();
  const { data: hasil, error } = await q;
  $('simpan').disabled = false;
  // LKD (pemilik 2026-11-11): unggahan gagal dipakai dibuang; LKD lama yang diganti dibuang.
  if (lkd && isi.bukti_url) {
    const lama = SUNTING ? BARIS.find(x => x.id === SUNTING)?.bukti_url : null;
    if (error) await buangLKD(sb, isi.bukti_url);
    else if (lama && lama !== isi.bukti_url) await buangLKD(sb, lama);
  }
  let catatan = '';
  if (!error && !SUNTING && ANTREAN.length) {
    const { error: eB } = await sb.from('lkps_bukti').insert(ANTREAN.map(b => barisBukti(b, hasil.id)));
    if (eB) catatan = ' Bukti gagal dicatat (' + eB.message + '); ubah baris lalu tambahkan lagi.';
  }
  if (error) return tulis('buruk', /duplicate|unique/i.test(error.message)
    ? 'Baris dengan kunci yang sama sudah ada (mis. tahun yang sama). Ubah baris itu saja.'
    : 'Gagal menyimpan: ' + error.message);
  const ubah = !!SUNTING;
  isiForm(null);
  tulis(catatan ? 'buruk' : 'ok', (ubah ? 'Perubahan tersimpan.' : 'Baris ditambahkan.') + catatan);
  await muatBaris();
}

// Ringkasan unsur: mana yang sudah ada buktinya dan skor butir dari baris ini.

async function tambahBukti(items){
  // Dokumen pustaka yang sudah tertaut ke baris ini (untuk unsur yang sama) tidak ditautkan dua kali.
  const u = unsurDipilih();
  items = items.map(b => ({ ...b, unsur: u }));
  const kunci = x => `${x.dokumen_id}|${x.unsur || ''}`;
  const sudah = new Set((SUNTING ? LB.get(SUNTING) || [] : ANTREAN).filter(x => x.dokumen_id).map(kunci));
  const baru = items.filter(b => !b.dokumen_id || !sudah.has(kunci(b)));
  if (!baru.length) return tulis('buruk', 'Dokumen itu sudah menjadi bukti baris ini.');
  items = baru;
  if (!SUNTING) { ANTREAN.push(...items); gambarBukti(); return tulis('ok', `${items.length} bukti siap; tersimpan saat baris disimpan.`); }
  const { error } = await sb.from('lkps_bukti').insert(items.map(b => barisBukti(b, SUNTING)));
  if (error) return tulis('buruk', 'Bukti gagal dicatat: ' + error.message);
  await muatBaris(); gambarBukti();
  tulis('ok', `${items.length} bukti ditambahkan.`);
}

const keB64 = f => new Promise((ok, gagal) => {
  const r = new FileReader();
  r.onload = () => ok(String(r.result).split(',')[1] || '');
  r.onerror = () => gagal(new Error('Berkas tidak bisa dibaca: ' + f.name));
  r.readAsDataURL(f);
});

// Bukti baris -> Drive data-lkps/dokumen/<tabel>/<tahun>/<label>/ (Apps
// Script kind 'dokumen', mode 'tambah'). Beberapa berkas sekaligus; tiap
// berkas menjadi satu bukti (lkps_bukti).
async function unggah(tombol){
  const semua = [...($('bk_berkas').files || [])];
  if (!semua.length) return tulis('buruk', 'Pilih berkas bukti dulu.');
  const ditolak = semua.filter(f => {
    const e = ((f.name.match(/\.([^.]+)$/) || [])[1] || '').toLowerCase();
    return !UNGGAH.ext.includes(e) || (UNGGAH.maxMb && f.size > UNGGAH.maxMb * 1024 * 1024);
  });
  if (ditolak.length) return tulis('buruk', `Ditolak: ${ditolak.map(f => f.name).join(', ')}. ` +
    `Diterima: ${UNGGAH.ext.join(', ')}, maksimal ${UNGGAH.maxMb} MB.`);
  const r = SUNTING ? BARIS.find(x => x.id === SUNTING) : bacaForm().nilai;
  const tahun = AKTIF.tahun(r || {}) || new Date().getFullYear();
  tombol.disabled = true;
  const items = [], gagal = [];
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) throw new Error('Sesi login habis. Muat ulang halaman.');
    for (let i = 0; i < semua.length; i++) {
      const f = semua[i];
      tulis('', `Mengunggah ${i + 1} dari ${semua.length}: ${f.name}…`);
      try {
        const res = await fetch(UNGGAH.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ token: session.access_token, kind: 'dokumen', jenis: AKTIF.tabel,
            tahun: String(tahun), judul: AKTIF.label(r || {}).slice(0, 80), mode: 'tambah',
            filename: f.name, data: await keB64(f) }) });
        const out = await res.json();
        if (!out.ok) throw new Error(out.error || 'Unggah gagal.');
        items.push({ judul: f.name, url: tautanBerkas(out) });
      } catch (err) {
        gagal.push(`${f.name}: ${err.message || err}`);
        if (/Sesi login/.test(err.message || '')) break;
      }
    }
    $('bk_berkas').value = '';
    if (items.length) await tambahBukti(items);
    if (gagal.length) tulis('buruk', `${items.length} dari ${semua.length} terunggah. Gagal: ${gagal.join('; ')}`);
  } catch (err) {
    tulis('buruk', err.message || String(err));
  } finally {
    tombol.disabled = false;
  }
}

      m.className = 'msg'; m.textContent = n ? `${n} berkas dipindah ke penyimpanan privat.` : 'Tidak ada berkas yang perlu dipindah.';
      await muatPustaka(); await gambarPustaka();
    } catch (err) { m.className = 'msg buruk'; m.textContent = err.message || String(err); }
    e.target.disabled = false;
  };
  pasangRapikan(sb, $('rapikan'), { tabel: TABEL, saran: SARAN_DOK, oleh: SAYA.email,
    selesai: async () => { await muatPustaka(); await gambarPustaka(); } });
  if ($('pk_jenis')) {
    const ket = () => {
      const j = infoJenis($('pk_jenis').value);
      $('pk_judul_w').hidden = j.tunggal;
      const ada = cariDokumen(DOK, j.id, $('pk_tahun').value, $('pk_judul').value);
      $('pk_ket').className = 'ket' + (ada ? ' buruk' : '');
      $('pk_ket').textContent = ada ? `Sudah ada: ${labelDokumen(ada)}. Unggahan akan MENGGANTI berkasnya (versi lama ke _arsip).`
        : (j.contoh ? `Contoh judul: ${j.contoh}.` : '');
    };
    ['pk_jenis', 'pk_tahun', 'pk_judul'].forEach(i => { $(i).oninput = ket; });
    ket();
  }
  await gambarPustaka();
}

// Pemakaian dokumen: baris Data prodi (lkps_bukti) dan butir (butir_bukti).
async function gambarPustaka(){
  const box = $('daftar');
  if (!box || DOK_GAGAL) { if (box) box.innerHTML = ''; return; }
  const [lb, bb, pp] = await Promise.all([
    ADA29 ? sb.from('lkps_bukti').select('dokumen_id,tabel') : { data: [] },
    sb.from('butir_bukti').select('dokumen_id,butir'),
    // Tautan tahap PPEPP ke pustaka (30-patch-spmi.sql); tabel belum ada -> kosong.
    sb.from('lkps_spmi_ppepp').select('dokumen_id,audit_dokumen_id,rtm_dokumen_id,peningkatan_dokumen_id')]);
  const judulTab = Object.fromEntries(TABEL.map(x => [x.tabel, x.judul]));
  const pakai = new Map();
  (lb.data || []).filter(x => x.dokumen_id).forEach(x => { if (!pakai.has(x.dokumen_id)) pakai.set(x.dokumen_id, []); pakai.get(x.dokumen_id).push(judulTab[x.tabel] || x.tabel); });
  (pp.error ? [] : pp.data || []).forEach(x => ['dokumen_id', 'audit_dokumen_id', 'rtm_dokumen_id', 'peningkatan_dokumen_id']
    .forEach(k => { if (!x[k]) return; if (!pakai.has(x[k])) pakai.set(x[k], []); pakai.get(x[k]).push('SPMI (PPEPP)'); }));
  (bb.data || []).filter(x => x.dokumen_id).forEach(x => { if (!pakai.has(x.dokumen_id)) pakai.set(x.dokumen_id, []); pakai.get(x.dokumen_id).push('butir ' + x.butir); });
  if (!DOK.length) { box.innerHTML = '<p class="kosong">Belum ada dokumen di pustaka.</p>'; return; }
  const ringkas = xs => Object.entries(xs.reduce((a, s) => (a[s] = (a[s] || 0) + 1, a), {}))
    .map(([s, n]) => n > 1 ? `${s} (${n})` : s).join(', ');
  box.innerHTML = `<table class="t"><thead><tr><th>Jenis</th><th>Tahun</th><th>Judul</th>${ADA30 ? '<th>Nomor</th><th>Tanggal</th>' : ''}<th>Dipakai di</th>
      <th>Berkas</th><th>Diperbarui</th><th></th></tr></thead><tbody>${DOK.map(d => `<tr>
      <td>${esc(infoJenis(d.jenis).nama)}</td><td>${esc(d.tahun)}</td><td>${esc(d.judul || '—')}</td>
      ${ADA30 ? `<td>${esc(d.nomor || '—')}</td><td>${esc(d.tanggal ? String(d.tanggal).split('-').reverse().join('/') : '—')}${d.berlaku_sampai
        ? `<br><small class="ket">berlaku s.d. ${esc(String(d.berlaku_sampai).split('-').reverse().join('/'))}</small>` : ''}</td>` : ''}
      <td>${esc(ringkas(pakai.get(d.id) || []) || '—')}</td>
      <td><a href="${esc(d.url)}" target="_blank" rel="noopener nofollow">buka</a></td>
      <td>${esc(String(d.diperbarui || '').slice(0, 10))}</td>
      <td>${ADA30 ? `<button type="button" class="btn ghost kecil" data-ubah-dok="${esc(d.id)}">Nomor/tanggal</button> ` : ''}<button type="button" class="btn bahaya kecil" data-hapus-dok="${esc(d.id)}" data-pakai="${(pakai.get(d.id) || []).length}">Hapus</button></td>
    </tr>`).join('')}</tbody></table>`;
}

async function unggahPustakaTab(tombol){
  const berkas = [...($('pk_berkas').files || [])];
  tombol.disabled = true;
  try {
    const d = await unggahKePustaka(sb, UNGGAH, { jenis: $('pk_jenis').value, tahun: $('pk_tahun').value,
      judul: $('pk_judul').value, berkas, oleh: SAYA.email, progres: s => tulis('', s),
      nomor: $('pk_nomor')?.value, tanggal: $('pk_tanggal')?.value });
    await muatPustaka();
    $('pk_berkas').value = '';
    tulis('ok', pesanPustaka(d, ''));
    await gambarPustaka();
  } catch (err) {
    tulis('buruk', err.message || String(err));
  } finally {
    tombol.disabled = false;
  }
}

// Nomor dan tanggal dokumen pustaka tanpa unggah ulang (LKPS 7.a, 30-patch-spmi.sql).
async function ubahNomorDokumen(id){
  const d = dokPer(id);
  if (!d) return;
  const nomor = prompt(`Nomor dokumen ${labelDokumen(d)} (kosongkan bila tidak ada):`, d.nomor || '');
  if (nomor === null) return;
  const tgl = prompt('Tanggal dokumen, format YYYY-MM-DD (kosongkan bila tidak ada):', d.tanggal || '');
  if (tgl === null) return;
  if (tgl.trim() && !/^\d{4}-\d{2}-\d{2}$/.test(tgl.trim())) return tulis('buruk', 'Tanggal ditulis YYYY-MM-DD, mis. 2024-03-15.');
  // Masa berlaku (53-patch-berlaku-dokumen.sql): ditanyakan bila kolomnya sudah ada.
  const adaBerlaku = 'berlaku_sampai' in d;
  const berlaku = adaBerlaku ? prompt('Berlaku sampai, format YYYY-MM-DD (kosongkan bila tidak berbatas waktu):', d.berlaku_sampai || '') : '';
  if (berlaku === null) return;
  if (berlaku.trim() && !/^\d{4}-\d{2}-\d{2}$/.test(berlaku.trim())) return tulis('buruk', 'Tanggal berlaku ditulis YYYY-MM-DD, mis. 2027-03-15.');
  const isi = { nomor: nomor.trim() || null, tanggal: tgl.trim() || null, ...(adaBerlaku ? { berlaku_sampai: berlaku.trim() || null } : {}) };
  const { error } = await sb.from('dokumen').update(isi).eq('id', id);
  if (error) return tulis('buruk', 'Gagal menyimpan: ' + (/berlaku_check/.test(error.message)
    ? 'tanggal berlaku tidak boleh sebelum tanggal dokumen.' : error.message));
  await muatPustaka();
  tulis('ok', adaBerlaku ? 'Nomor, tanggal, dan masa berlaku dokumen tersimpan.' : 'Nomor dan tanggal dokumen tersimpan.');
  await gambarPustaka();
}

async function hapusDokumen(id){
  const d = dokPer(id);
  const n = +(document.querySelector(`[data-hapus-dok="${id}"]`)?.dataset.pakai || 0);
  if (!d || !confirm(`Hapus ${labelDokumen(d)} dari pustaka?` +
    (n ? ` Dokumen ini dipakai sebagai bukti di ${n} tempat; tautan buktinya ikut hilang.` : '') + ` ${PESAN_SAMPAH}`)) return;
  try { await buangBerkas(sb, d.url); }
  catch (err) { return tulis('buruk', 'Gagal membuang berkas: ' + (err.message || err)); }
  const { error } = await sb.from('dokumen').delete().eq('id', id);
  if (error) return tulis('buruk', 'Gagal menghapus: ' + error.message);
  await muatPustaka();
  tulis('ok', 'Dokumen dihapus dari pustaka.');
  await gambarPustaka();
}

function layarMasuk(){
  $('hSub').textContent = 'Perlu masuk';
  $('isi').innerHTML = `<div class="masuk"><p>Masukkan email kampus Anda — tautan masuk dikirim tanpa kata sandi.</p>
    <input id="em" type="email" placeholder="nama@kampus.ac.id" autocomplete="email">
    <button class="btn" id="kirim">Kirim tautan masuk</button><p class="ket" id="pesan"></p></div>`;
  $('kirim').onclick = async () => {
    const em = $('em').value.trim();
    if (!em) return;
    const { error } = await sb.auth.signInWithOtp({ email: em, options: { emailRedirectTo: location.href } });
    $('pesan').textContent = error ? 'Gagal: ' + error.message : 'Tautan masuk sudah dikirim. Periksa email Anda.';
  };
}

sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_IN' && !SAYA) mulai(); });
mulai().catch(e => { $('isi').innerHTML = `<p class="kosong">${esc(e.message)}</p>`; });
</script>
