<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tema.css?v=2026-11-28-e2efdc">

<style>
  /* Forum pemangku kepentingan (200-patch-forum-pemangku.sql, pemilik 2026-11-27) */
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
  .wrap{max-width:1250px;margin:0 auto;padding:18px 20px 80px}
  .kosong, .ket{color:var(--muted)}
  .ket{font-size:13px}
  .kartu{background:var(--panel);border:1px solid var(--line);padding:14px 18px;margin-bottom:16px}
  .kartu h2{font-size:17px;margin:0 0 6px;color:var(--biru)}
  .alat{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0}
  select, input[type=text], input[type=date], input[type=email], input[type=url], textarea{font:inherit;font-size:14px;padding:5px 7px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
  .form{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px 14px;margin:8px 0;padding:10px;border:1px dashed var(--line)}
  .form label{display:flex;flex-direction:column;font-size:13px;color:var(--muted);gap:3px}
  .form label.cek{flex-direction:row;align-items:center;gap:6px}
  .form .lebar{grid-column:1/-1}
  .b{font:inherit;font-size:14px;padding:5px 12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
  .b.utama{background:var(--biru);border-color:var(--biru);color:#fff}
  .b.bahaya{color:var(--merah);border-color:var(--merah)}
  .b.kecil{font-size:12.5px;padding:2px 8px}
  .pesan{font-size:13.5px;margin:6px 0} .pesan.galat{color:var(--merah)} .pesan.ok{color:var(--hijau)}
  .gulir{overflow-x:auto}
  table.ds{width:100%;border-collapse:collapse;font-size:13.5px}
  table.ds th{text-align:left;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);padding:5px 6px}
  table.ds td{padding:5px 6px;border-bottom:1px solid var(--line-soft);vertical-align:top}
  .st{font-size:12px;font-weight:600;padding:1px 7px;border:1px solid var(--line);white-space:nowrap}
  .st.diadopsi{color:var(--hijau);border-color:var(--hijau)} .st.tidak_diadopsi{color:var(--muted)} .st.dikaji{color:var(--biru);border-color:var(--biru)} .st.baru{color:#8A5A00;border-color:#8A5A00}
  .putus{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px;margin-top:6px}
  .putus textarea{grid-column:1/-1;min-height:48px}
  @media(max-width:700px){.wrap{padding-left:16px;padding-right:16px}}
</style>
</head>
<body>
<div class="hero" role="region" aria-label="Pembuka halaman"><div class="hero-in">
  <div class="hero-inst" data-identitas></div>
  <h1>Forum pemangku kepentingan</h1>
  <div class="sub" id="hSub">Memuat…</div>
</div></div>
<main class="wrap" id="isi"><p class="kosong">Memuat…</p></main>
<script src="config.js?v=2026-11-28-e2efdc"></script>
<script>
// Galat saat memuat skrip ditampilkan sebagai pesan, bukan halaman kosong.
addEventListener('error', function (e) {
  if (document.getElementById('galat-muat')) return;
  var d = document.createElement('div');
  d.id = 'galat-muat';
  d.style.cssText = 'margin:16px;padding:12px 14px;border:1px solid var(--merah);' +
    'background:var(--merah-m3);color:var(--ink);font:14px/1.5 system-ui,sans-serif';
  d.textContent = 'Halaman gagal dimuat: ' + (e.message || 'galat skrip') +
    '. Tekan Ctrl+Shift+R untuk memuat ulang tanpa cache; bila tetap muncul, kirim pesan ini ke admin.';
  document.body.insertBefore(d, document.body.firstChild);
});
</script>
<script type="module">
// Forum pemangku kepentingan (200, pemilik 2026-11-27): anggota, pertemuan (Rapat jenis 'pemangku'), masukan dan tindak
// lanjutnya. Admin, Kaprodi, GKM mengelola; pimpinan membaca; dosen PJ melihat masukan yang ditugaskan. Logika: pemangku.js.
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/+esm';
import { gerbang } from './menu.js?v=2026-11-28-e2efdc';
import { punya } from './koordinator.js?v=2026-11-28-e2efdc';
import { KATEGORI_PEMANGKU, SALURAN, TOPIK_MASUKAN, STATUS_MASUKAN, rekapMasukan, perKategori, kategoriSumber, csvMasukan } from './pemangku.js?v=2026-11-28-e2efdc';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sb = createClient(window.SB_URL, window.SB_KEY);
const baca = q => q.then(r => r.error ? [] : (r.data || []), () => []);
const opsi = (o, v) => Object.entries(o).map(([k, l]) => `<option value="${k}"${k === v ? ' selected' : ''}>${esc(l)}</option>`).join('');
const HARI = new Date(Date.now() + 7 * 3600e3).toISOString().slice(0, 10), TH = +HARI.slice(0, 4);
const nilai = id => $(id)?.value?.trim() ?? '';
function tulis(id, k, t){ const m = $(id); if (m) { m.className = 'pesan ' + k; m.textContent = t; } }

let SAYA = null, PEMANGKU = [], MASUKAN = [], RAPAT = [], DOSEN = [], ADA = true, UBAH_P = null, SARING = { tahun: String(TH), topik: '', status: '' };
const KELOLA = () => SAYA?.peran === 'admin' || punya(SAYA, 'kaprodi') || punya(SAYA, 'gkm');
const BACA = () => KELOLA() || SAYA?.peran === 'pimpinan';
const namaP = id => PEMANGKU.find(p => p.id === id);
const sumber = m => { const p = namaP(m.pemangku_id); return p ? [p.nama, p.organisasi].filter(Boolean).join(', ') : (m.sumber_nama || '—'); };
const namaD = id => DOSEN.find(d => d.id === id)?.nama || '';

async function muat(){
  const m = await sb.from('pemangku_masukan').select('*').order('tanggal', { ascending: false });
  ADA = !m.error; MASUKAN = m.data || [];
  [PEMANGKU, RAPAT] = await Promise.all([BACA() ? baca(sb.from('pemangku').select('*').order('nama')) : [],
    baca(sb.from('rapat').select('id,judul,tanggal,tempat').eq('jenis', 'pemangku').order('tanggal', { ascending: false }))]);
}

function gambar(){
  if (!ADA) { $('isi').innerHTML = '<p class="kosong">Tabel belum ada: jalankan supabase/200-patch-forum-pemangku.sql.</p>'; return; }
  if (!BACA()) {
    const xs = MASUKAN.filter(m => m.pj_dosen_id === SAYA.id);
    $('isi').innerHTML = `<section class="kartu"><h2>Masukan yang ditugaskan kepada saya</h2>
      <p class="ket">Masukan pemangku yang Anda tindak lanjuti. Laporkan hasilnya kepada Kaprodi atau GKM agar statusnya diperbarui.</p>
      ${xs.length ? tabelMasukan(xs, false) : '<p class="kosong">Tidak ada masukan yang ditugaskan kepada Anda.</p>'}</section>`;
    return;
  }
  const kelola = KELOLA();
  $('isi').innerHTML = `<section class="kartu" id="anggota"></section><section class="kartu" id="pertemuan"></section>
    <section class="kartu" id="masukan"></section><section class="kartu" id="rekap"></section>`;
  gambarAnggota(kelola); gambarPertemuan(); gambarMasukan(kelola); gambarRekap();
  if (location.hash) document.querySelector(location.hash)?.scrollIntoView();
}

// ---------------------------------------------------------------- anggota
function gambarAnggota(kelola){
  const x = UBAH_P || { kategori: 'industri', anggota_forum: true, aktif: true };
  const forum = PEMANGKU.filter(p => p.anggota_forum && p.aktif);
  $('anggota').innerHTML = `<h2>Anggota dan daftar pemangku</h2>
    <p class="ket">Pemangku eksternal prodi (industri, alumni, pengguna lulusan, asosiasi profesi, pemerintah, akademisi). Centang <b>Anggota forum</b>
      untuk anggota forum/IAB yang ditetapkan. Email hanya terbaca pengelola. ${forum.length} anggota forum aktif.</p>
    ${kelola ? `<details${UBAH_P ? ' open' : ''}><summary><b>${UBAH_P ? 'Ubah pemangku' : 'Tambah pemangku'}</b></summary><div class="form">
      <label>Nama <input type="text" id="pNama" maxlength="120" value="${esc(x.nama || '')}"></label>
      <label>Organisasi <input type="text" id="pOrg" maxlength="200" value="${esc(x.organisasi || '')}"></label>
      <label>Jabatan <input type="text" id="pJab" maxlength="120" value="${esc(x.jabatan || '')}"></label>
      <label>Kategori <select id="pKat">${opsi(Object.fromEntries(Object.entries(KATEGORI_PEMANGKU).filter(([k]) => k !== 'mahasiswa')), x.kategori)}</select></label>
      <label>Email <input type="email" id="pEmail" maxlength="200" value="${esc(x.email || '')}"></label>
      <label class="cek"><input type="checkbox" id="pForum"${x.anggota_forum ? ' checked' : ''}> Anggota forum/IAB</label>
      <label>Periode mulai <input type="date" id="pMulai" value="${esc(x.periode_mulai || '')}"></label>
      <label>Periode selesai <input type="date" id="pSelesai" value="${esc(x.periode_selesai || '')}"></label>
      <label class="cek"><input type="checkbox" id="pAktif"${x.aktif !== false ? ' checked' : ''}> Aktif</label>
      <label class="lebar">Catatan <input type="text" id="pCat" maxlength="1000" value="${esc(x.catatan || '')}"></label>
      <div class="lebar"><button type="button" class="b utama" id="bPemangku">${UBAH_P ? 'Simpan perubahan' : 'Tambah'}</button>
        ${UBAH_P ? '<button type="button" class="b" id="bPBatal">Batal</button>' : ''} <span class="pesan" id="mPemangku" role="status"></span></div></div></details>` : ''}
    ${PEMANGKU.length ? `<div class="gulir"><table class="ds"><thead><tr><th>Nama</th><th>Organisasi</th><th>Kategori</th><th>Forum</th><th>Periode</th><th>Masukan</th><th></th></tr></thead><tbody>
      ${PEMANGKU.map(p => `<tr${p.aktif ? '' : ' class="ket"'}><td>${esc(p.nama)}${p.jabatan ? `<div class="ket">${esc(p.jabatan)}</div>` : ''}</td>
        <td>${esc(p.organisasi || '')}</td><td>${esc(KATEGORI_PEMANGKU[p.kategori])}</td><td>${p.anggota_forum ? 'ya' : ''}</td>
        <td>${esc([p.periode_mulai, p.periode_selesai].filter(Boolean).join(' s.d. '))}</td><td>${MASUKAN.filter(m => m.pemangku_id === p.id).length}</td>
        <td>${kelola ? `<button type="button" class="b kecil" data-ubah-p="${p.id}">Ubah</button>` : ''}</td></tr>`).join('')}</tbody></table></div>`
      : '<p class="kosong">Belum ada pemangku.</p>'}`;
  if ($('bPemangku')) $('bPemangku').onclick = simpanPemangku;
  if ($('bPBatal')) $('bPBatal').onclick = () => { UBAH_P = null; gambar(); };
  document.querySelectorAll('[data-ubah-p]').forEach(b => { b.onclick = () => { UBAH_P = namaP(+b.dataset.ubahP); gambar(); $('anggota').scrollIntoView(); }; });
}

async function simpanPemangku(){
  const isi = { nama: nilai('pNama'), organisasi: nilai('pOrg') || null, jabatan: nilai('pJab') || null, kategori: nilai('pKat'), email: nilai('pEmail') || null,
    anggota_forum: $('pForum').checked, periode_mulai: nilai('pMulai') || null, periode_selesai: nilai('pSelesai') || null, aktif: $('pAktif').checked,
    catatan: nilai('pCat') || null };
  if (isi.nama.length < 2) return tulis('mPemangku', 'galat', 'Tulis nama.');
  const { error } = UBAH_P ? await sb.from('pemangku').update(isi).eq('id', UBAH_P.id) : await sb.from('pemangku').insert(isi);
  if (error) return tulis('mPemangku', 'galat', 'Gagal: ' + error.message);
  UBAH_P = null; await muat(); gambar();
}

// ---------------------------------------------------------------- pertemuan (Rapat)
function gambarPertemuan(){
  $('pertemuan').innerHTML = `<h2>Pertemuan forum</h2>
    <p class="ket">Catat pertemuan di <a href="rapat.html">Kegiatan › Rapat dan notulen</a> dengan jenis <b>Forum pemangku kepentingan (IAB)</b>: undangan,
      tamu eksternal beserta instansinya, daftar hadir QR, notulen, dan tindak lanjut. Masukan dari pertemuan dicatat di bawah dan ditautkan ke rapatnya.</p>
    ${RAPAT.length ? `<ul>${RAPAT.map(r => `<li><a href="rapat.html?id=${r.id}">${esc(r.judul)}</a> <span class="ket">${esc(r.tanggal)}${r.tempat ? ' · ' + esc(r.tempat) : ''}
      · ${MASUKAN.filter(m => m.rapat_id === r.id).length} masukan</span></li>`).join('')}</ul>` : '<p class="kosong">Belum ada pertemuan berjenis forum pemangku.</p>'}`;
}

// ---------------------------------------------------------------- masukan dan tindak lanjut
function tabelMasukan(xs, kelola){
  return `<div class="gulir"><table class="ds"><thead><tr><th>Tanggal</th><th>Sumber</th><th>Topik</th><th>Masukan</th><th>Status dan tindak lanjut</th></tr></thead><tbody>
    ${xs.map(m => `<tr><td>${esc(m.tanggal)}</td><td>${esc(BACA() ? sumber(m) : KATEGORI_PEMANGKU[kategoriSumber(m, PEMANGKU)])}<div class="ket">${esc(SALURAN[m.saluran])}${m.rapat_id ? ` · <a href="rapat.html?id=${m.rapat_id}">rapat</a>` : ''}</div></td>
      <td>${esc(TOPIK_MASUKAN[m.topik])}</td><td>${esc(m.isi)}${m.bukti_url ? ` <a href="${esc(m.bukti_url)}" target="_blank" rel="noopener">bukti</a>` : ''}</td>
      <td><span class="st ${esc(m.status)}">${esc(STATUS_MASUKAN[m.status])}</span>
        ${m.pj_dosen_id ? `<div class="ket">PJ ${esc(namaD(m.pj_dosen_id))}${m.tenggat ? `, tenggat ${esc(m.tenggat)}` : ''}</div>` : ''}
        ${m.tindak_lanjut ? `<div>${esc(m.tindak_lanjut)}</div>` : ''}${m.alasan ? `<div class="ket">Alasan: ${esc(m.alasan)}</div>` : ''}
        ${kelola ? `<details><summary class="ket">Perbarui</summary><div class="putus">
          <select data-st="${m.id}">${opsi(STATUS_MASUKAN, m.status)}</select>
          <select data-pj="${m.id}"><option value="">(PJ)</option>${DOSEN.map(d => `<option value="${d.id}"${d.id === m.pj_dosen_id ? ' selected' : ''}>${esc(d.nama)}</option>`).join('')}</select>
          <input type="date" data-tg="${m.id}" value="${esc(m.tenggat || '')}" aria-label="Tenggat">
          <textarea data-tl="${m.id}" maxlength="2000" placeholder="Tindak lanjut (wajib bila diadopsi): perubahan apa, di dokumen/MK mana, kapan">${esc(m.tindak_lanjut || '')}</textarea>
          <textarea data-al="${m.id}" maxlength="1000" placeholder="Alasan (wajib bila tidak diadopsi)">${esc(m.alasan || '')}</textarea>
          <button type="button" class="b kecil utama" data-simpan-m="${m.id}">Simpan</button>
          <button type="button" class="b kecil bahaya" data-hapus-m="${m.id}">Hapus</button></div></details>` : ''}</td></tr>`).join('')}</tbody></table></div>`;
}

function gambarMasukan(kelola){
  const tahun = [...new Set([TH, ...MASUKAN.map(m => +String(m.tanggal).slice(0, 4))])].sort((a, b) => b - a);
  const xs = MASUKAN.filter(m => (!SARING.tahun || String(m.tanggal).startsWith(SARING.tahun)) && (!SARING.topik || m.topik === SARING.topik)
    && (!SARING.status || m.status === SARING.status));
  $('masukan').innerHTML = `<h2>Masukan dan tindak lanjut</h2>
    <p class="ket">Setiap masukan diputuskan: <b>Diadopsi</b> (tulis tindak lanjutnya: perubahan apa, di dokumen atau MK mana) atau <b>Tidak diadopsi</b>
      (tulis alasannya). PJ dan tenggat muncul di Tugas saya PJ. Bukti butir 2, 12, dan 58.</p>
    ${kelola ? `<details><summary><b>Catat masukan</b></summary><div class="form">
      <label>Tanggal <input type="date" id="mTgl" value="${HARI}"></label>
      <label>Pemangku <select id="mPem"><option value="">(isi sumber lain)</option>${PEMANGKU.filter(p => p.aktif).map(p => `<option value="${p.id}">${esc(p.nama)}${p.organisasi ? ', ' + esc(p.organisasi) : ''}</option>`).join('')}</select></label>
      <label>Sumber lain <input type="text" id="mSumber" maxlength="200" placeholder="mis. responden survei alumni"></label>
      <label>Kategori sumber lain <select id="mSKat"><option value="">(pilih)</option>${opsi(KATEGORI_PEMANGKU, '')}</select></label>
      <label>Saluran <select id="mSal">${opsi(SALURAN, 'forum')}</select></label>
      <label>Pertemuan (rapat) <select id="mRapat"><option value="">(tidak ada)</option>${RAPAT.map(r => `<option value="${r.id}">${esc(r.tanggal)} ${esc(r.judul)}</option>`).join('')}</select></label>
      <label>Topik <select id="mTopik">${opsi(TOPIK_MASUKAN, 'kurikulum')}</select></label>
      <label>PJ <select id="mPJ"><option value="">(belum)</option>${DOSEN.map(d => `<option value="${d.id}">${esc(d.nama)}</option>`).join('')}</select></label>
      <label>Tenggat <input type="date" id="mTenggat"></label>
      <label class="lebar">Masukan <textarea id="mIsi" maxlength="2000" rows="2"></textarea></label>
      <label class="lebar">Bukti (https, mis. notulen atau surat) <input type="url" id="mBukti"></label>
      <div class="lebar"><button type="button" class="b utama" id="bMasukan">Simpan</button> <span class="pesan" id="mMasukan" role="status"></span></div></div></details>` : ''}
    <div class="alat"><label>Tahun <select id="sTh"><option value="">Semua</option>${tahun.map(t => `<option${String(t) === SARING.tahun ? ' selected' : ''}>${t}</option>`).join('')}</select></label>
      <label>Topik <select id="sTp"><option value="">Semua</option>${opsi(TOPIK_MASUKAN, SARING.topik)}</select></label>
      <label>Status <select id="sSt"><option value="">Semua</option>${opsi(STATUS_MASUKAN, SARING.status)}</select></label>
      <span class="pesan" id="mDaftar" role="status"></span></div>
    ${xs.length ? tabelMasukan(xs, kelola) : '<p class="kosong">Tidak ada masukan untuk saringan ini.</p>'}`;
  if ($('bMasukan')) $('bMasukan').onclick = simpanMasukan;
  $('sTh').onchange = e => { SARING.tahun = e.target.value; gambar(); };
  $('sTp').onchange = e => { SARING.topik = e.target.value; gambar(); };
  $('sSt').onchange = e => { SARING.status = e.target.value; gambar(); };
  document.querySelectorAll('[data-simpan-m]').forEach(b => { b.onclick = () => perbaruiMasukan(+b.dataset.simpanM); });
  document.querySelectorAll('[data-hapus-m]').forEach(b => { b.onclick = async () => {
    if (!confirm('Hapus masukan ini? Bila tidak dipakai, lebih baik tandai Tidak diadopsi beserta alasannya.')) return;
    const { error } = await sb.from('pemangku_masukan').delete().eq('id', +b.dataset.hapusM);
    if (error) return tulis('mDaftar', 'galat', error.message);
    await muat(); gambar(); }; });
}

async function simpanMasukan(){
  const isi = { tanggal: nilai('mTgl'), pemangku_id: +nilai('mPem') || null, sumber_nama: nilai('mSumber') || null, sumber_kategori: nilai('mSKat') || null,
    saluran: nilai('mSal'), rapat_id: +nilai('mRapat') || null, topik: nilai('mTopik'), pj_dosen_id: nilai('mPJ') || null, tenggat: nilai('mTenggat') || null,
    isi: nilai('mIsi'), bukti_url: nilai('mBukti') || null };
  if (!isi.tanggal || isi.isi.length < 5) return tulis('mMasukan', 'galat', 'Isi tanggal dan masukan (minimal 5 huruf).');
  if (!isi.pemangku_id && !isi.sumber_nama) return tulis('mMasukan', 'galat', 'Pilih pemangku atau tulis sumber lain.');
  if (isi.bukti_url && !/^https:\/\/\S+$/i.test(isi.bukti_url)) return tulis('mMasukan', 'galat', 'Bukti harus tautan https://');
  const { error } = await sb.from('pemangku_masukan').insert(isi);
  if (error) return tulis('mMasukan', 'galat', 'Gagal: ' + error.message);
  await muat(); gambar();
}

async function perbaruiMasukan(id){
  const q = s => document.querySelector(`[data-${s}="${id}"]`).value.trim();
  const isi = { status: q('st'), pj_dosen_id: q('pj') || null, tenggat: q('tg') || null, tindak_lanjut: q('tl') || null, alasan: q('al') || null };
  if (isi.status === 'diadopsi' && (isi.tindak_lanjut || '').length < 5) return tulis('mDaftar', 'galat', 'Diadopsi: tulis tindak lanjutnya.');
  if (isi.status === 'tidak_diadopsi' && (isi.alasan || '').length < 5) return tulis('mDaftar', 'galat', 'Tidak diadopsi: tulis alasannya.');
  const { error } = await sb.from('pemangku_masukan').update(isi).eq('id', id);
  if (error) return tulis('mDaftar', 'galat', 'Gagal: ' + error.message);
  await muat(); gambar(); tulis('mDaftar', 'ok', 'Tersimpan.');
}

// ---------------------------------------------------------------- rekap
function gambarRekap(){
  const rk = rekapMasukan(MASUKAN), pk = perKategori(MASUKAN, PEMANGKU, TH);
  const adopsi = MASUKAN.filter(m => m.status === 'diadopsi' && String(m.tanggal).startsWith(String(TH)));
  $('rekap').innerHTML = `<h2>Rekap untuk akreditasi</h2>
    <p class="ket">Tertindaklanjuti = sudah diputuskan diadopsi atau tidak (dengan alasan). Rekap tanpa nama juga masuk Laporan kinerja tahunan.</p>
    ${rk.length ? `<div class="gulir"><table class="ds"><thead><tr><th>Tahun</th><th>Topik</th><th>Masuk</th><th>Diadopsi</th><th>Tidak diadopsi</th><th>Belum diputuskan</th><th>Tertindaklanjuti</th></tr></thead>
      <tbody>${rk.map(r => `<tr><td>${r.tahun}</td><td>${esc(TOPIK_MASUKAN[r.topik])}</td><td>${r.masuk}</td><td>${r.diadopsi}</td><td>${r.tidak}</td><td>${r.baru + r.dikaji}</td>
        <td>${r.persen == null ? '–' : r.persen + '%'}</td></tr>`).join('')}</tbody></table></div>` : '<p class="kosong">Belum ada masukan.</p>'}
    <p>Sumber masukan ${TH}: ${Object.entries(pk).map(([k, n]) => `${esc(KATEGORI_PEMANGKU[k] || k)} ${n}`).join(' · ') || '—'}</p>
    ${adopsi.length ? `<h3>Masukan yang diadopsi tahun ${TH}</h3><ul>${adopsi.map(m => `<li><b>${esc(TOPIK_MASUKAN[m.topik])}</b> (${esc(KATEGORI_PEMANGKU[kategoriSumber(m, PEMANGKU)])}):
      ${esc(m.isi)} → ${esc(m.tindak_lanjut)}</li>`).join('')}</ul>` : ''}
    <div class="alat"><button type="button" class="b" id="bCsv">Unduh masukan (CSV)</button></div>`;
  $('bCsv').onclick = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csvMasukan(MASUKAN, sumber, m => namaD(m.pj_dosen_id))], { type: 'text/csv;charset=utf-8' }));
    a.download = `masukan-pemangku-${HARI}.csv`; a.click(); URL.revokeObjectURL(a.href);
  };
}

async function mulai(){
  SAYA = await gerbang(sb);
  if (!SAYA) return;
  $('hSub').textContent = `Masuk sebagai ${SAYA.nama}`;
  DOSEN = (await baca(sb.from('dosen').select('id,nama,aktif,peran').order('nama'))).filter(d => d.aktif !== false && !['asesor', 'pimpinan'].includes(d.peran));
  await muat();
  gambar();
}
mulai().catch(e => { $('isi').innerHTML = `<p class="kosong">Gagal memuat: ${esc(e.message)}</p>`; });
</script>
