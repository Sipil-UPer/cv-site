<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hasil survei kepuasan — Program Studi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tema.css?v=2026-11-13-08f7cd">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{max-width:960px;margin:0 auto;padding:0 16px 90px}
  a{color:var(--biru-2)}
  .hero{background:var(--biru);color:#fff;border-bottom:4px solid var(--merah)}
  .hero-in{max-width:960px;margin:0 auto;padding:28px 16px 22px}
  .balik{display:inline-block;text-decoration:none;font-family:var(--mono);font-size:11px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--biru-m2);margin-bottom:16px}
  h1{font-family:var(--serif);font-size:clamp(22px,4.2vw,32px);font-weight:600;margin:0;line-height:1.2;color:#fff}
  .prodi{color:var(--biru-m4);font-size:14px;margin-top:6px}
  .kosong, .ket{color:var(--muted)}
  .ket{font-size:13.5px}
  .tab{display:flex;flex-wrap:wrap;gap:6px;margin:20px 0 6px}
  .tab button{font:inherit;font-size:13.5px;padding:6px 12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
  .tab button[aria-pressed="true"]{background:var(--biru);color:#fff;border-color:var(--biru)}
  section.sv-kartu{background:var(--panel);border:1px solid var(--line);padding:6px 18px 10px;margin-top:14px}
  section.sv-kartu h2{font-family:var(--serif);font-size:18px;color:var(--biru);margin:12px 0 2px}
</style>
</head>
<body>
<header class="hero"><div class="hero-in">
  <a class="balik" href="index.html">&larr; Kembali ke dashboard</a>
  <h1>Hasil survei kepuasan</h1>
  <div class="prodi" id="hProdi"></div>
</div></header>
<main class="wrap" id="isi"><p class="kosong">Memuat…</p></main>
<script src="config.js?v=2026-11-13-08f7cd"></script>
<script>
// Galat saat memuat skrip ditampilkan sebagai pesan, bukan halaman kosong.
addEventListener('error', function (e) {
  if (document.getElementById('galat-muat')) return;
  var d = document.createElement('div');
  d.id = 'galat-muat';
  d.style.cssText = 'margin:16px;padding:12px 14px;border:1px solid var(--merah);' +
    'background:var(--merah-m3);color:var(--ink);font:14px/1.5 system-ui,sans-serif';
  d.textContent = 'Halaman gagal dimuat: ' + (e.message || 'galat skrip') +
    '. Tekan Ctrl+Shift+R untuk memuat ulang tanpa cache.';
  document.body.insertBefore(d, document.body.firstChild);
});
</script>
<script type="module">
// Rekap publik survei kepuasan (pemilik 2026-11-11; butir 57 unsur 7: hasil
// dipublikasikan). Hanya angka agregat dari survei_rekap(); isian teks dan
// jawaban per orang tidak pernah keluar dari basis data lewat halaman ini.
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
import { KELOMPOK_SURVEI, labelKelompok, rekapSurvei, htmlRekap, htmlLain, CSS_SURVEI } from './survei-kepuasan.js?v=2026-11-13-08f7cd';

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = id => document.getElementById(id);
const sb = createClient(window.SB_URL, window.SB_KEY);
const tgl = s => String(s || '').split('-').reverse().join('/');
const f2 = x => x == null ? '—' : (+x).toFixed(2).replace('.', ',');
document.head.insertAdjacentHTML('beforeend', `<style>${CSS_SURVEI}</style>`);
let DATA = [], PILIH = '';

fetch('data.json?v=' + Date.now()).then(r => r.ok ? r.json() : {}).catch(() => ({}))
  .then(d => { $('hProdi').textContent = [d.prodi, d.institusi].filter(Boolean).join(' · '); });

function gambar(){
  const ada = KELOMPOK_SURVEI.filter(([k]) => DATA.some(s => s.kelompok === k));
  if (!PILIH || !ada.some(([k]) => k === PILIH)) PILIH = ada[0]?.[0] || '';
  const xs = DATA.filter(s => s.kelompok === PILIH);
  // Tren: rerata keseluruhan tiap survei kelompok ini, urut TS.
  const tren = xs.map(s => ({ s, rk: rekapSurvei(s.pertanyaan, s.hitung) })).filter(x => x.s.n)
    .sort((a, b) => a.s.tahun_ts - b.s.tahun_ts || String(a.s.mulai).localeCompare(String(b.s.mulai)));
  $('isi').innerHTML = `<p class="ket">Survei kepuasan program studi terhadap mahasiswa, dosen, tenaga kependidikan, mitra, dan pengguna
      lulusan. Skala 1–4 (kurang, cukup, baik, sangat baik); "% puas" = jawaban baik atau sangat baik. Hanya angka rekap yang
      ditampilkan; isian bersifat anonim.</p>
    ${ada.length ? `<div class="tab">${ada.map(([k, l]) => `<button data-k="${k}" aria-pressed="${k === PILIH}">${esc(l)}</button>`).join('')}</div>` : ''}
    ${tren.length > 1 ? `<section class="sv-kartu"><h2>Tren ${esc(labelKelompok(PILIH).toLowerCase())}</h2>
      <div class="gulir"><table class="sv"><thead><tr><th>Survei</th><th>TS</th><th>Responden</th><th>Rerata</th><th>% puas</th></tr></thead><tbody>
      ${tren.map(({ s, rk }) => `<tr><td>${esc(s.judul)}</td><td>${s.tahun_ts - 1}/${s.tahun_ts}</td><td>${s.n}</td><td>${f2(rk.rerata)}</td><td>${f2(rk.puas)}</td></tr>`).join('')}
      </tbody></table></div></section>` : ''}
    ${xs.length ? xs.map(s => `<section class="sv-kartu"><h2>${esc(s.judul)}</h2>
        <p class="ket">${esc(labelKelompok(s.kelompok))} · TS ${s.tahun_ts - 1}/${s.tahun_ts} · ${tgl(s.mulai)} s.d. ${tgl(s.selesai)}</p>
        ${s.pertanyaan.some(q => q.jenis === 'skala') ? htmlRekap(rekapSurvei(s.pertanyaan, s.hitung), s.n)
          : `<p class="ket"><b>${s.n} responden</b></p>`}
        ${htmlLain(s.pertanyaan, { opsi: s.opsi || {}, angka: s.angka || {} }, s.n)}</section>`).join('')
      : '<p class="kosong">Belum ada hasil survei yang dipublikasikan.</p>'}`;
  document.querySelectorAll('.tab [data-k]').forEach(b => b.onclick = () => { PILIH = b.dataset.k; gambar(); });
}

sb.rpc('survei_rekap').then(({ data, error }) => {
  if (error) { $('isi').innerHTML = `<p class="kosong">Hasil survei belum tersedia.</p>`; return; }
  DATA = data || [];
  gambar();
}, e => { $('isi').innerHTML = `<p class="kosong">Gagal memuat: ${esc(e.message || e)}</p>`; });
</script>
</body>
</html>
