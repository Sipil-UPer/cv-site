<header class="hero">
  <div class="hero-in">

          khusus email yang didaftarkan prodi, sesuai perannya.</div>

  </div>

<main class="wrap" id="isi"></main>

<script src="config.js?v=2026-11-12-b7db2c"></script>
<script>
const N = n => new Intl.NumberFormat('id-ID').format(n);
const esc = s => String(s ?? '').replace(/[&<>"']/g,c=>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rapi = s => s ? String(s).replace(/_/g,' ') : '';
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

let D = null;

fetch('data.json?v=' + Date.now())
  .then(r => { if(!r.ok) throw new Error(r.status); return r.json(); })
  .then(d => { D = d; render(); })
  .catch(() => {
    document.getElementById('hProdi').textContent = 'Data belum tersedia';
    document.getElementById('isi').innerHTML =
      `<p class="kosong">Data belum tersedia. Hubungi admin prodi.</p>`;
  });

// =====================================================================
//  Grafik batang, digambar langsung sebagai SVG.
//  Tanpa pustaka luar supaya halaman tetap satu berkas dan tidak
//  bergantung pada CDN yang bisa berubah atau hilang.
//
//  mode 'tumpuk'   — batang bertumpuk, untuk komposisi dalam satu total
//  mode 'kelompok' — batang berdampingan, untuk membandingkan dua hal
// =====================================================================
function skalaRapi(maks){
  if(maks <= 4) return {atas:4, langkah:1};
  const kasar = maks/4;
  const p = Math.pow(10, Math.floor(Math.log10(kasar)));
  const langkah = [1,2,2.5,5,10].map(x=>x*p).find(x=>x>=kasar) || 10*p;
  return {atas: Math.ceil(maks/langkah)*langkah, langkah};
}

function chartBatang(label, seri, mode='tumpuk'){
  const W=580, H=250, ml=40, mr=12, mt=22, mb=38;
  const iw=W-ml-mr, ih=H-mt-mb;

  const total = label.map((_,i)=> seri.reduce((a,s)=>a+(s.nilai[i]||0),0));
  const puncak = mode==='tumpuk'
    ? Math.max(...total, 0)
    : Math.max(0, ...seri.flatMap(s=>s.nilai));
  if(!puncak) return '';

  const {atas, langkah} = skalaRapi(puncak);
  const y = v => mt + ih - (v/atas)*ih;
  const pita = iw/label.length;

  let g = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Grafik batang">`;

  for(let v=0; v<=atas; v+=langkah){
    g += `<line class="${v?'ggaris':'gnol'}" x1="${ml}" y1="${y(v)}" x2="${W-mr}" y2="${y(v)}"/>`
       + `<text class="gnilai" x="${ml-9}" y="${y(v)+3.5}" text-anchor="end">${v}</text>`;
  }

  const aktif = seri.filter(s=>s.nilai.some(v=>v>0));
  const lebarTumpuk = Math.min(54, pita*0.46);
  const nSeri = Math.max(aktif.length,1);
  const lebarKel = Math.min(22, (pita*0.62)/nSeri);
  let tunda = 0;

  label.forEach((l,i)=>{
    const cx = ml + pita*i + pita/2;

    if(mode==='tumpuk'){
      let dasar = 0;
      seri.forEach(s=>{
        const v = s.nilai[i]||0; if(!v) return;
        const t=y(dasar+v), b=y(dasar);
        g += `<rect class="batang" x="${cx-lebarTumpuk/2}" y="${t}" width="${lebarTumpuk}"
              height="${Math.max(b-t,1)}" fill="${s.warna}" rx="1"
              style="animation-delay:${(tunda++)*28}ms"
              ><title>${esc(s.nama)} ${l}: ${v}</title></rect>`;
        dasar += v;
      });
      if(total[i]) g += `<text class="gtotal" x="${cx}" y="${y(total[i])-7}"
                         text-anchor="middle">${total[i]}</text>`;
    } else {
      const lbrTotal = lebarKel*nSeri + 3*(nSeri-1);
      aktif.forEach((s,j)=>{
        const v = s.nilai[i]||0;
        const x = cx - lbrTotal/2 + j*(lebarKel+3);
        if(v){
          g += `<rect class="batang" x="${x}" y="${y(v)}" width="${lebarKel}"
                height="${Math.max(y(0)-y(v),1)}" fill="${s.warna}" rx="1"
                style="animation-delay:${(tunda++)*28}ms"
                ><title>${esc(s.nama)} ${l}: ${v}</title></rect>`
             + `<text class="gnilai" x="${x+lebarKel/2}" y="${y(v)-5}"
                text-anchor="middle">${v}</text>`;
        }
      });
    }
    g += `<text class="gsumbu" x="${cx}" y="${H-13}" text-anchor="middle">${esc(l)}</text>`;
  });

  g += `</svg>`;
  const legenda = aktif.map(s=>
    `<span><i style="background:${s.warna}"></i>${esc(s.nama)}</span>`).join('');
  return g + `<div class="legenda">${legenda}</div>`;
}

function kartu(judul, ket, isi){
  return `<div class="kartu"><h3>${esc(judul)}</h3><p class="ket">${esc(ket)}</p>${
    isi || '<p class="kosong" style="padding:6px 0">Belum ada data terverifikasi.</p>'}</div>`;
}

function bangunGrafik(){
  const tahun = [...new Set([
    ...D.publikasi.map(p=>p.tahun),
    ...D.kegiatan.map(k=>k.tahun),
    ...(D.prestasi_agregat||[]).map(p=>p.tahun),
  ])].sort((a,b)=>a-b).slice(-6).map(String);
  if(!tahun.length) return '';

  const C1=css('--biru'), C2=css('--biru-3'), C3=css('--emas'),
        CM=css('--merah'), CH=css('--hijau');

  const hit = (arr,f) => tahun.map(t => arr.filter(x=>String(x.tahun)===t && f(x)).length);

  const gPub = chartBatang(tahun, [
    {nama:'Internasional', warna:C1, nilai:hit(D.publikasi,p=>p.tingkat==='internasional')},
    {nama:'Nasional',      warna:C2, nilai:hit(D.publikasi,p=>p.tingkat==='nasional')},
    {nama:'Wilayah/lokal', warna:C3, nilai:hit(D.publikasi,p=>p.tingkat==='wilayah_lokal')},
  ], 'tumpuk');

  const gKeg = chartBatang(tahun, [
    {nama:'Penelitian', warna:C1, nilai:hit(D.kegiatan,k=>k.kategori==='penelitian')},
    {nama:'Pengabdian', warna:CH, nilai:hit(D.kegiatan,k=>k.kategori==='pkm')},
  ], 'kelompok');

  const pres = D.prestasi_agregat || [];
  const jml = (t,g) => pres.filter(p=>String(p.tahun)===t && p.tingkat===g)
                           .reduce((a,b)=>a+b.jumlah,0);
  const gPres = chartBatang(tahun, [
    {nama:'Internasional', warna:CM, nilai:tahun.map(t=>jml(t,'internasional'))},
    {nama:'Nasional',      warna:C2, nilai:tahun.map(t=>jml(t,'nasional'))},
    {nama:'Wilayah/lokal', warna:C3, nilai:tahun.map(t=>jml(t,'wilayah_lokal'))},
  ], 'tumpuk');

  const kel = {};
  D.kegiatan.forEach(k=>{ if(k.kelompok) kel[k.kelompok]=(kel[k.kelompok]||0)+1; });
  const urut = Object.entries(kel).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const gDana = urut.length ? urut.map(([nama,n])=>{
    const maks = Math.max(...urut.map(x=>x[1]));
    return `<div class="mendatar"><div class="nm">${esc(nama)}</div>
      <div class="tr"><div class="is" style="width:${(n/maks)*100}%"></div></div>
      <div class="an">${n}</div></div>`;
  }).join('') : '';

  return `
    <div class="bar"><h2>Tren kinerja</h2></div>
    <div class="grafik">
      ${kartu('Publikasi', 'Jumlah per tahun menurut tingkat terbitan', gPub)}
      ${kartu('Penelitian & pengabdian', 'Perbandingan jumlah kegiatan per tahun', gKeg)}
      ${kartu('Prestasi mahasiswa', 'Jumlah capaian per tahun menurut tingkat', gPres)}
      ${kartu('Sumber pendanaan', 'Sebaran kegiatan menurut asal dana', gDana)}
    </div>`;
}

// Mitra unik dari publikasi, penelitian, dan PkM; aturan sama dengan
// kumpulkan() di mitra.html (nama tanpa beda huruf besar-kecil).
function jumlahMitra(){
  const nama = new Set();
  [...D.publikasi, ...D.kegiatan].forEach(x => (x.mitra || []).forEach(m => {
    const n = (m.nama || '').trim().toLowerCase();
    if (n) nama.add(n);
  }));
  return nama.size;
}

// =====================================================================
function render(){
  document.getElementById('hProdi').textContent = 'Program Studi ' + D.prodi;
  document.getElementById('hInst').textContent = D.institusi || '';
  if (D.institusi) document.getElementById('hLogo').alt = D.institusi;
  document.title = ['Kinerja Program Studi ' + D.prodi, D.institusi].filter(Boolean).join(' — ');

  const totalPrestasi = (D.prestasi_agregat||[]).reduce((a,b)=>a+b.jumlah,0);
  document.getElementById('angka').innerHTML = [
    [D.dosen.length,     'Dosen',              'daftar.html?jenis=dosen'],
    [D.publikasi.length, 'Publikasi',          'daftar.html?jenis=publikasi'],
    [D.kegiatan.filter(k=>k.kategori==='penelitian').length, 'Penelitian', 'daftar.html?jenis=penelitian'],
    [D.kegiatan.filter(k=>k.kategori==='pkm').length,        'Pengabdian', 'daftar.html?jenis=pkm'],
    [totalPrestasi,      'Prestasi mahasiswa', 'daftar.html?jenis=prestasi'],
    [jumlahMitra(),      'Mitra kerja sama',   'mitra.html'],
    // SDGs (pemilik 2026-11-11): karya terkait SDGs -> sdgs.html. Kartu ini dan Topik keahlian
    // tidak tampil bila modulnya dimatikan (config.js FITUR_MATI, site/fitur.js).
    [[...D.publikasi, ...D.kegiatan, ...(D.luaran_dosen||[])].filter(k => (k.sdgs||[]).length).length,
                         'Karya ber-SDGs',     'sdgs.html'],
    // Peta keahlian (pemilik 2026-11-11): kata kunci dosen + topik publikasi -> keahlian.html.
    [new Set([...D.dosen.flatMap(d => d.kata_kunci || []), ...D.publikasi.flatMap(k => (k.topik || []).map(t => t.t))]
       .map(x => String(x).toLowerCase())).size, 'Topik keahlian', 'keahlian.html?tab=peta'],
  ].filter(([, , href]) => !(window.FITUR_MATI || []).includes({ 'sdgs.html': 'sdgs', 'keahlian.html?tab=peta': 'kepakaran' }[href]))
   .map(([v,l,href])=>`<a href="${href}"><b>${N(v)}</b><span>${l}</span></a>`).join('');
  // Jumlah topik persis sama dengan keahlian.html (petaTopik, termasuk bidang keahlian).
  import('./keahlian.js?v=2026-11-12-b7db2c').then(m => {
    const b = document.querySelector('#angka a[href^="keahlian.html"] b');
    // Dengan daftar baku (patch 61): topik baku yang sudah punya dosen (memilih atau berkarya).
    const B = m.daftarBaku(D), P = m.profilKeahlian(D);
    if (b) b.textContent = N(B ? m.petaBaku(P, B).baris.filter(r => !r.kosong).length : m.petaTopik(P).length);
  }).catch(() => {});

  // Beranda hanya grafik; daftarnya dibuka lewat angka rekap di atas
  // (daftar.html, mitra.html), pemilik 2026-11-04.
  document.getElementById('isi').innerHTML = `

}

// Angka pita/ringkasan naik perlahan saat pertama tampil (hormati
// preferensi reduced-motion; teks non-angka dibiarkan apa adanya).
function angkaNaik(sel){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  document.querySelectorAll(sel).forEach(el => {
    if (el.dataset.naik) return; el.dataset.naik = '1';
    const asli = el.textContent.trim();
    const t = parseFloat(asli.replace(',', '.'));
    if (!isFinite(t) || /[^0-9.,]/.test(asli)) return;
    const des = (asli.split(/[.,]/)[1] || '').length;
    const m0 = performance.now();
    const tik = n => {
      const q = Math.min(1, (n - m0) / 600), e = 1 - Math.pow(1 - q, 3);
      el.textContent = (t * e).toFixed(des).replace('.', asli.includes(',') ? ',' : '.');
      if (q < 1) requestAnimationFrame(tik); else el.textContent = asli;
    };
    requestAnimationFrame(tik);
  });
}

angkaNaik('.angka b');
