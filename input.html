<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Input Kinerja Dosen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tema.css?v=2026-11-05-4f158f">
<style>
  :root{--bg:#EEF0ED; --ink:#161E26; --muted:#616C76; --line:#D8DDD8; --line-soft:#E8EBE7; --accent:var(--biru); --accent-soft:var(--biru-m7); --pending:#8A5A00; --pending-soft:#FAF0DC; --reject:#8C2F2F; --reject-soft:#F7E7E7;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
       font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{max-width:960px;margin:0 auto;padding:0 20px 80px}
  .hero-in{max-width:960px}

  nav.tabs{display:flex;gap:2px;flex-wrap:wrap;margin:26px 0 20px;border-bottom:1px solid var(--line)}
  nav.tabs button{appearance:none;border:0;background:none;cursor:pointer;
    font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--muted);padding:10px 14px;border-bottom:2px solid transparent;margin-bottom:-1px}
  nav.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
  nav.tabs button:hover{color:var(--ink)}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:2px;
         padding:22px 24px;margin-bottom:22px}
  .panel h2{font-family:var(--serif);font-size:18px;font-weight:600;margin:0 0 4px}
  .panel .hint{color:var(--muted);font-size:13px;margin:0 0 20px}

  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 18px}
  .fld{display:flex;flex-direction:column;gap:5px}
  .fld.full{grid-column:1/-1}
  .fld[hidden]{display:none}
  label{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;
        text-transform:uppercase;color:var(--muted)}
  label .req{color:var(--reject)}
  .sub{font-size:12px;color:var(--muted);font-family:var(--sans);
       text-transform:none;letter-spacing:0;margin-top:-2px}
  input,select,textarea{font-family:var(--sans);font-size:14px;color:var(--ink);
    background:#fff;border:1px solid var(--line);border-radius:2px;padding:8px 10px;width:100%}
  input[type=file]{padding:6px;font-size:12.5px}
  select[disabled]{background:var(--bg);color:var(--muted)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:1px}

  .rekan{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
         gap:2px 14px;border:1px solid var(--line);border-radius:2px;padding:10px 12px;
         max-height:170px;overflow:auto;background:#fff}
  .rekan label{display:flex;gap:7px;align-items:center;font-family:var(--sans);
    font-size:13.5px;text-transform:none;letter-spacing:0;color:var(--ink);
    padding:3px 0;cursor:pointer}
  .rekan input{width:auto;margin:0}

  .rekan-item{display:flex;gap:10px;align-items:center;flex-wrap:wrap;
    padding:6px 0;border-bottom:1px solid var(--line-soft)}
  .rekan-item:last-child{border-bottom:0}
  .rekan-item .r-peran{padding:5px 8px;font:inherit;font-size:13px}
  .rekan-item select:disabled, .rekan-item input:disabled{opacity:.45}
  .mhs-baris{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .mhs-baris input{flex:1;min-width:110px}
  .mhs-baris input.nim{flex:0 0 130px}
  .mhs-daftar{margin-top:9px}
  .mhs-item{display:flex;gap:10px;align-items:center;padding:6px 0;
            border-top:1px solid var(--line-soft);font-size:13.5px}
  .mhs-item:first-child{border-top:0}
  .mhs-baris select{flex:0 0 150px}
  .mhs-baris label.cek{flex:0 0 auto;font-size:13px;white-space:nowrap}
  .mhs-item .n{flex:1}
  .mhs-item .i{font-family:var(--mono);font-size:12px;color:var(--muted);
               flex:0 0 120px}
  .cek{display:flex;gap:8px;align-items:center;font-family:var(--sans);
       font-size:14px;text-transform:none;letter-spacing:0;color:var(--ink);
       cursor:pointer;padding:8px 0}
  .cek input{width:auto;margin:0}
  .aksi{display:flex;align-items:center;gap:14px;margin-top:18px;flex-wrap:wrap}
  .btn{font-family:var(--sans);font-size:14px;font-weight:500;cursor:pointer;
    border-radius:2px;padding:9px 18px;border:1px solid var(--accent);
    background:var(--accent);color:#fff}
  .btn:hover{background:#0a423d}
  .btn[disabled]{opacity:.5;cursor:default}
  .btn.ghost{background:none;color:var(--accent)}
  .btn.ghost:hover{background:var(--accent-soft)}
  .btn.sm{font-size:12.5px;padding:5px 11px}
  .btn.danger{border-color:var(--reject);background:none;color:var(--reject)}
  .btn.danger:hover{background:var(--reject-soft)}
  .msg{font-size:13px}
  .msg.ok{color:var(--accent)} .msg.err{color:var(--reject)}

  /* peringatan duplikat — elemen paling penting di halaman ini */
  .dup{border:1px solid var(--pending);background:var(--pending-soft);
       border-radius:2px;padding:16px 18px;margin:18px 0 0;grid-column:1/-1}
  .dup h3{font-family:var(--serif);font-size:15px;font-weight:600;margin:0 0 4px;color:var(--pending)}
  .dup p{margin:0 0 10px;font-size:13.5px}
  .dup .karya{background:#fff;border:1px solid #E8D5A8;padding:11px 13px;
              border-radius:2px;margin-bottom:12px}
  .dup .karya b{font-weight:500;display:block;line-height:1.4}
  .dup .karya span{font-family:var(--mono);font-size:11px;color:var(--muted);
                   display:block;margin-top:4px}

  .rec{display:flex;gap:14px;padding:13px 0;border-top:1px solid var(--line-soft)}
  .spine{width:3px;flex:none;border-radius:2px;background:var(--pending)}
  .rec[data-s="terverifikasi"] .spine{background:var(--accent)}
  .rec[data-s="ditolak"] .spine{background:var(--reject)}
  .rec-b{flex:1;min-width:0}
  .rec-j{font-weight:500;line-height:1.35}
  .rec-m{font-family:var(--mono);font-size:11px;letter-spacing:.05em;color:var(--muted);
         margin-top:3px;display:flex;gap:10px;flex-wrap:wrap}
  .rec-a{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
  .bukti-saya{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:4px}
  ul.antrean{margin:6px 0;padding-left:18px;font-size:13px}
  ul.antrean li{margin:2px 0;word-break:break-word}
  details.kb{margin-top:6px;font-size:13px}
  details.kb summary{cursor:pointer;color:var(--accent);font-weight:500}
  details.kb ul{margin:6px 0;padding-left:18px}
  details.kb li{margin:3px 0;word-break:break-word}
  details.kb .btn.sm{padding:2px 9px;font-size:11.5px;margin-left:4px}
  .kb-f{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}
  .kb-f select, .kb-f input[type=text], .kb-f input[type=url]{flex:1 1 180px;padding:5px 7px;font:inherit}
  .kb-m, .kb-kos{font-size:12px;color:var(--muted)}
  .vb{display:block;margin-top:4px}
  .vb ul{margin:2px 0 0;padding-left:18px;text-transform:none;letter-spacing:0}
  .vb a{color:var(--accent);word-break:break-word}
  .bukti-saya a{color:var(--accent);word-break:break-all}
  .bukti-saya .btn.sm{padding:2px 9px;font-size:11.5px}
  .tag{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;
       padding:2px 7px;border-radius:2px;background:var(--pending-soft);color:var(--pending);
       white-space:nowrap}
  .rec[data-s="terverifikasi"] .tag{background:var(--accent-soft);color:var(--accent)}
  .rec[data-s="ditolak"] .tag{background:var(--reject-soft);color:var(--reject)}
  .kosong{color:var(--muted);font-size:13.5px;padding:14px 0}

  .masuk{max-width:400px;margin:64px auto}
  code{font-family:var(--mono);font-size:12.5px;background:var(--bg);padding:1px 5px}
  /* ajuan perubahan (tab Verifikasi) */
  .ajuan-ubah{border:1px solid var(--line);border-radius:3px;padding:12px 14px;margin-bottom:12px}
  table.beda{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:10px}
  table.beda th,table.beda td{border-bottom:1px solid var(--line-soft);padding:6px 8px;
    text-align:left;vertical-align:top}
  table.beda th{font-family:var(--mono);font-size:11px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--muted)}
  table.beda td:first-child{width:24%;color:var(--muted)}
  table.beda td:nth-child(3){background:#EAF4EC}
  @media(max-width:640px){.grid{grid-template-columns:1fr}}
</style>

<body>

<header class="hero">
  <div class="hero-in">
    <div class="hero-inst" data-identitas></div>
    <h1>Karya dosen</h1>
    <div class="sub">Publikasi, penelitian, PkM, luaran, rekognisi, dan integrasi mata kuliah</div>
  </div>
</header>

<div class="wrap" id="app"></div>

<script src="config.js?v=2026-11-05-4f158f"></script>
<script>
// Galat saat memuat skrip (mis. modul lama dari cache bercampur dengan
// halaman baru) ditampilkan sebagai pesan, bukan halaman kosong.
addEventListener('error', function (e) {
  if (document.getElementById('galat-muat')) return;
  var d = document.createElement('div');
  d.id = 'galat-muat';
  d.style.cssText = 'margin:16px;padding:12px 14px;border:1px solid var(--merah);' +
    'background:var(--merah-m3);color:#14212E;font:14px/1.5 system-ui,sans-serif';
  d.textContent = 'Halaman gagal dimuat: ' + (e.message || 'galat skrip') +
    '. Tekan Ctrl+Shift+R untuk memuat ulang tanpa cache; bila tetap muncul, kirim pesan ini ke admin.';
  document.body.insertBefore(d, document.body.firstChild);
});
</script>
<script type="module">
// =====================================================================
//  Konfigurasi dibaca dari config.js supaya berkas ini bisa ditimpa
//  saat ada pembaruan tanpa kehilangan kunci Supabase Anda.
// =====================================================================
const SUPABASE_URL = window.SB_URL;
const SUPABASE_ANON_KEY = window.SB_KEY;

import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
import { JENIS_BUKTI_KARYA, namaJenisBukti } from './rencana-bukti.js?v=2026-11-05-4f158f';
import { buangBerkas, buangSemua, PESAN_SAMPAH } from './hapus-berkas.js?v=2026-11-05-4f158f';
import { periksaBerkas, kolomSidik, teksTemuan } from './sidik-berkas.js?v=2026-11-05-4f158f';
import { htmlContoh, pasangContoh, durasiKS, JENIS_BUKTI_KS } from './manfaat-kerjasama.js?v=2026-11-05-4f158f';
import { pasangMenu } from './menu.js?v=2026-11-05-4f158f';

const app = document.getElementById('app');
if (!SUPABASE_URL || !SUPABASE_ANON_KEY
    || SUPABASE_URL.includes('XXXXXXXX') || SUPABASE_ANON_KEY.includes('GANTI')) {
  app.innerHTML = `<div class="masuk"><div class="panel"><h2>Belum dikonfigurasi</h2>
    <p class="hint">Buka berkas <code>config.js</code> di folder yang sama, lalu isi
    <code>SB_URL</code> dan <code>SB_KEY</code> dengan nilai dari proyek Supabase Anda.
    Gunakan kunci <strong>publishable</strong>, bukan secret.</p></div></div>`;
  throw new Error('konfigurasi kosong');
}

const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const TH = new Date().getFullYear();
const TAHUN = Array.from({length:12},(_,i)=>String(TH+1-i));
// Bulan opsional: memetakan karya ke tahun akademik (TS, Sep-Agu).
const BULAN = [['1','Januari'],['2','Februari'],
  ['3','Maret'],['4','April'],['5','Mei'],['6','Juni'],['7','Juli'],
  ['8','Agustus'],['9','September'],['10','Oktober'],['11','November'],
  ['12','Desember']];
// Dropdown "berasal dari kegiatan": diisi saat form dibuka dengan
// kegiatan penelitian/PkM milik dosen ini yang sudah tersimpan.
const F_INDUK = {n:'induk_id', l:'Berasal dari penelitian / PkM', t:'select',
  o:[['', '— tidak ada / mandiri —']],
  sub:'Pilih kegiatan yang menghasilkan karya ini. Hanya kegiatan Anda '
    + 'sendiri yang tampil; kosongkan bila tidak berasal dari kegiatan '
    + 'yang tercatat.'};

// Kerja sama induk (MoU/PKS/IA) yang dicatat admin di Data prodi
// (supabase/24-patch-kerjasama-induk.sql). Diisi saat form dibuka;
// dihapus dari form bila daftarnya belum bisa dibaca (patch belum jalan).
const F_KERJASAMA = {n:'kerjasama_id', l:'Kerja sama induk (MoU/PKS/IA)', t:'select', full:1,
  o:[['', '— tidak terkait kerja sama yang tercatat —']],
  sub:'Pilih bila kegiatan ini dilaksanakan dalam kerja sama yang sudah dicatat admin prodi. '
    + 'Di LKPS 2.a kegiatan ini tampil dengan tanggal, manfaat, dan bukti kerja sama itu. '
    + 'Kerja sama belum ada di daftar? Minta admin menambahkannya di Data prodi.'};

// Isian LKPS 2.a dari dosen (supabase/32-patch-isian-kerjasama.sql). Durasi dan
// status tidak diisi: dihitung rumus templat dari kedua tanggal.
const ISIAN_32 = ['manfaat_ks', 'mulai_ks', 'selesai_ks', 'jenis_bukti_ks'];
const F_MANFAAT_KS = {n:'manfaat_ks', l:'Manfaat kerja sama bagi program studi', t:'textarea', full:1,
  ph:'Mis. Mendukung topik tugas akhir 3 mahasiswa dan memperkaya materi mata kuliah Hidrologi dengan data lapangan dari mitra.',
  sub:'LKPS 2.a kolom 7. Isi bila kegiatan ini bersama mitra. Sebutkan manfaat nyata bagi prodi, bukan tujuan kegiatan; '
    + 'kosong = memakai isian kerja sama induk.' + htmlContoh('f_manfaat_ks', ['penelitian', 'pkm'])};
const F_MULAI_KS = {n:'mulai_ks', l:'Tanggal awal kerja sama', t:'date', sub:'Sesuai surat penugasan atau perjanjian.'};
const F_SELESAI_KS = {n:'selesai_ks', l:'Tanggal akhir kerja sama', t:'date', sub:'<span id="durasi_ks">Durasi dan status dihitung dari kedua tanggal.</span>'};
const F_BUKTI_KS = {n:'jenis_bukti_ks', l:'Bukti kerja sama', t:'select', full:1, o:JENIS_BUKTI_KS,
  sub:'LKPS 2.a kolom 12. Unggah berkasnya di bagian bukti, atau tautkan yang sudah ada.'};

// Isian LKPS tambahan (supabase/25-patch-isian-karya.sql). Nilai sah sama
// dengan daftar pilihan templat LKPS. Dibuang dari form bila kolomnya
// belum ada (siapkanIsian25), supaya simpan tidak gagal.
const ISIAN_25 = ['jumlah_sitasi', 'tema_id', 'keterlibatan_mhs', 'tkt', 'nomor_tkt', 'bukti_integrasi', 'sesuai_rps'];
const F_SITASI = {n:'jumlah_sitasi', l:'Jumlah sitasi (3 tahun terakhir)', t:'number', ph:'0',
  // Tafsiran 4.i (pemilik 2026-11-04): artikel tahun berapa pun, yang dihitung
  // sitasi yang DITERIMA dalam tiga tahun terakhir (TS-2 s.d. TS).
  sub:'LKPS 4.i: sitasi yang <b>diterima</b> artikel ini dalam tiga tahun terakhir (TS-2 s.d. TS), '
    + 'bukan total sepanjang masa. Artikel lama boleh, asal disitasi dalam tiga tahun itu. '
    + 'Hanya jurnal/prosiding terindeks <b>Scopus atau WoS</b> yang masuk tabel. '
    + 'Kolom LKPS meminta angka <b>Google Scholar</b>: jumlahkan batang grafik sitasi tiga tahun itu di halaman artikel; '
    + 'pembanding di Scopus: <i>Citation overview</i> dengan rentang tahun. '
    + 'Simpan tangkapan layarnya sebagai bukti (jenis Lainnya); perbarui tiap tahun.'};
const F_TEMA = {n:'tema_id', l:'Tema peta jalan', t:'select', o:[['', '— belum dipilih —']],
  sub:'Tema peta jalan penelitian/PkM prodi (daftar diisi admin di Data prodi). LKPS 6.h.1, 6.i, dan 3.a.3.'};
const F_KETERLIBATAN = {n:'keterlibatan_mhs', l:'Bentuk keterlibatan mahasiswa', t:'select',
  o:[['tugas_akhir','Tugas akhir'], ['perancangan','Perancangan'],
     ['pengembangan_produk','Pengembangan produk/jasa'], ['lainnya','Kegiatan lain yang relevan']],
  sub:'Untuk penelitian yang melibatkan mahasiswa (LKPS 6.h.1).'};
const F_TKT = {n:'tkt', l:'Tingkat kesiapan teknologi (TKT)', t:'select',
  o:[...Array.from({length:9}, (_, i) => [String(i+1), 'TKT ' + (i+1)])],
  sub:'Untuk teknologi tepat guna dan produk (LKPS 4.f.3).'};
const F_NOMOR_TKT = {n:'nomor_tkt', l:'Nomor sertifikat TKT', t:'text',
  sub:'Untuk teknologi tepat guna dan produk (LKPS 4.f.3).'};
const F_BUKTI_INTEGRASI = {n:'bukti_integrasi', l:'Bukti sahih integrasi', t:'select',
  o:[['naskah_hibah','Naskah hibah'], ['laporan_akhir','Laporan akhir'], ['publikasi','Publikasi'],
     ['lainnya','Bukti sahih lainnya']]};
const F_RPS = {n:'sesuai_rps', l:'Sudah tercantum di RPS', t:'select', o:[['true','Ya'], ['false','Belum']]};

const F_BULAN = {n:'bulan', l:'Bulan', t:'select', w:1, o:BULAN,
  sub:'Menentukan tahun akademik (TS): September ke atas masuk TS berikutnya'};
const TINGKAT = [['internasional','Internasional'],['nasional','Nasional'],
                 ['wilayah_lokal','Wilayah / lokal']];

const esc = s => String(s ?? '').replace(/[&<>"']/g,c=>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rapi = s => s ? String(s).replace(/_/g,' ') : '';
const norm = s => String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();

// ---------------------------------------------------------------------
//  Definisi form
//  Tipe field khusus:
//    'skema'  → dua dropdown bertingkat: kelompok, lalu skema
// ---------------------------------------------------------------------
const FORM = {
  publikasi: {
    judul:'Publikasi',
    hint:'Artikel jurnal, prosiding, buku, dan HKI. Isi DOI bila ada — itu yang mencegah entri ganda.',
    peran:[['penulis_pertama','Penulis pertama'],['anggota','Anggota']],
    korespondensi:true, mitra:true, mahasiswa:'publikasi',
    f:[
      {n:'judul', l:'Judul karya', t:'text', w:1, full:1},
      {n:'jenis', l:'Jenis', t:'select', w:1, o:[['jurnal','Artikel jurnal'],
        ['prosiding','Prosiding'],['buku','Buku'],['bab_buku','Bab dalam buku'],
        ['haki_paten','HKI / paten'],['lainnya','Lainnya']]},
      {n:'tahun', l:'Tahun terbit', t:'select', w:1, o:TAHUN.map(y=>[y,y])},
      F_BULAN,
      F_INDUK,
      {n:'nama_terbitan', l:'Nama jurnal / penerbit', t:'text'},
      {n:'tingkat', l:'Tingkat', t:'select', w:1, o:TINGKAT},
      {n:'indeksasi', l:'Indeksasi', t:'select', o:[['scopus_q1','Scopus Q1'],
        ['scopus_q2','Scopus Q2'],['scopus_q3','Scopus Q3'],['scopus_q4','Scopus Q4'],
        ['wos','Web of Science'],['sinta_1_2','SINTA 1–2'],['sinta_3_4','SINTA 3–4'],
        ['sinta_5_6','SINTA 5–6'],['tidak_terindeks','Tidak terindeks']]},
      {n:'doi', l:'DOI', t:'text', ph:'10.1016/j.jhydrol.2025.132000'},
      F_SITASI,
      {n:'url', l:'Tautan', t:'url', full:1, ph:'https://'},
    ]
  },
  kegiatan: {
    judul:'Penelitian & pengabdian',
    hint:'Satu entri untuk satu kegiatan, bukan per anggota. Agar tidak ganda, sebaiknya hanya ketua yang menginput; anggota mendaftarkan diri lewat tab Karya prodi.',
    peran:[['ketua','Ketua'],['anggota','Anggota']],
    mitra:true, mahasiswa:'kegiatan',
    f:[
      {n:'judul', l:'Judul kegiatan', t:'text', w:1, full:1},
      {n:'kategori', l:'Jenis', t:'select', w:1,
        o:[['penelitian','Penelitian'],['pkm','Pengabdian kepada masyarakat']]},
      {n:'tahun', l:'Tahun pelaksanaan', t:'select', w:1, o:TAHUN.map(y=>[y,y])},
      F_BULAN,
      {n:'skema', t:'skema', full:1},
      {n:'tingkat', l:'Tingkat kegiatan', t:'select', w:1, o:TINGKAT},
      F_KERJASAMA,
      F_MANFAAT_KS,
      F_MULAI_KS,
      F_SELESAI_KS,
      F_BUKTI_KS,
      F_TEMA,
      F_KETERLIBATAN,
      {n:'nama_pemberi_dana', l:'Nama pemberi dana', t:'text',

let saya = null, dosenList = [], refKelompok = [], refSkema = [];

async function mulai(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session) return layarMasuk();

  const { data } = await sb.from('dosen').select('*')
    .ilike('email', session.user.email).maybeSingle();
  if(!data) return layarTidakTerdaftar(session.user.email);
  saya = data;
  pasangMenu(sb);
  // Asesor, dan pimpinan (dekan) yang bukan DTPS prodi ini, hanya melihat
  // skor; tidak mengisi karya. Dekan yang DTPS (aktif) mengisi seperti dosen.
  // Batas tampilan, sama seperti tab Verifikasi untuk admin.
  if(saya.peran === 'asesor' || (saya.peran === 'pimpinan' && !saya.aktif))
    return layarHanyaLihat();

  const [ds, kl, sk] = await Promise.all([
    // Calon penulis: dosen aktif. Admin/asesor yang bukan DTPS (mis. admin
    // staf/tendik) bukan dosen, jadi tidak ditawarkan (pemilik 2026-11-03).
    sb.from('dosen').select('id,nama').eq('aktif', true)
      .or('dtps.eq.true,peran.in.(dosen,pimpinan)').order('nama'),
    sb.from('ref_kelompok_dana').select('*').order('urutan'),
    sb.from('ref_skema_dana').select('*').eq('aktif', true).order('urutan'),
  ]);
  dosenList = ds.data || []; refKelompok = kl.data || []; refSkema = sk.data || [];

  layarUtama();
}

function layarMasuk(){
  app.innerHTML = `<div class="masuk"><div class="panel">
    <h2>Masuk</h2>
    <p class="hint">Gunakan email kampus yang sudah didaftarkan admin prodi.
    Kami kirimkan tautan masuk — tidak ada kata sandi yang perlu diingat.</p>
    <div class="fld"><label for="em">Alamat email</label>
      <input id="em" type="email" autocomplete="email" placeholder="nama@kampus.ac.id"></div>
    <div class="aksi"><button class="btn" id="kirim">Kirim tautan masuk</button>
      <span class="msg" id="m"></span></div>
  </div></div>`;
  const em = document.getElementById('em'), m = document.getElementById('m'),
        kirim = document.getElementById('kirim');
  em.onkeydown = e => { if(e.key==='Enter') kirim.click(); };
  kirim.onclick = async()=>{
    m.className='msg';
    if(!em.value.includes('@')){ m.className='msg err'; m.textContent='Masukkan email yang valid.'; return; }
    kirim.disabled=true; m.textContent='Mengirim…';
    const { error } = await sb.auth.signInWithOtp({ email: em.value.trim(),
      options:{ emailRedirectTo: location.href.split('#')[0] }});
    kirim.disabled=false;
    if(error){ m.className='msg err'; m.textContent=error.message; }
    else { m.className='msg ok'; m.textContent='Tautan terkirim. Periksa kotak masuk Anda.'; }
  };
}

function layarUtama(){
  const tabs = [['publikasi','Publikasi'],['kegiatan','Penelitian & PkM'],
                ['luaran','Luaran & HKI'],['rekognisi','Rekognisi'],
                ['integrasi','Integrasi MK'],
                ['saya','Karya saya'],['semua','Karya prodi']];
  if(saya.peran==='admin') tabs.push(['verifikasi','Verifikasi']);

  app.innerHTML = `<nav class="tabs" role="tablist">${tabs.map(([k,l],i)=>
    `<button role="tab" data-t="${k}" aria-selected="${i===0}">${l}</button>`).join('')}
    </nav><div id="isi"></div>`;
  app.querySelectorAll('nav.tabs button').forEach(b=>{
    b.onclick = ()=>{
      app.querySelectorAll('nav.tabs button').forEach(x=>x.setAttribute('aria-selected','false'));
      b.setAttribute('aria-selected','true'); buka(b.dataset.t);
    };
  });
  buka('publikasi');
}

// Unggah berkas bukti ke Google Drive prodi lewat Apps Script
// (cv-data/apps-script/Code.gs). Server memeriksa ulang login, jenis, dan
// ukuran; pemeriksaan di sini hanya supaya dosen cepat tahu. Tanpa
// UPLOAD_URL di config.js bagian ini tidak tampil sama sekali.
function pasangUnggah(){
  // Antrean dikosongkan setiap kali form dibuka.
  antreanBukti = []; gambarAntrean();
  const url = String(window.UPLOAD_URL || '').trim();
  if(!url) return;
  const ext = String(window.UPLOAD_EXT || '').toLowerCase().split(',')
    .map(s=>s.trim()).filter(Boolean);
  const maxMb = Number(window.UPLOAD_MAX_MB) || 0;
  const berkas = document.getElementById('f_bukti_file'),
        jenisEl = document.getElementById('f_bukti_jenis'),
        tombol = document.getElementById('btn_unggah'),
        msg    = document.getElementById('unggah_msg');
  document.getElementById('unggah_baris').hidden = false;
  document.getElementById('unggah_sub').hidden = false;
  berkas.accept = ext.map(x=>'.'+x).join(',');
  const tulis = (cls, t)=>{ msg.className = 'msg' + (cls ? ' '+cls : ''); msg.textContent = t; };

  // Beberapa berkas sekaligus (pemilik 2026-11-03; pilihan folder dihapus).
  // Tiap berkas diunggah ke folder karya <tahun>/<dosen>/<judul>/ lalu masuk
  // antrean; saat karya disimpan, tiap berkas menjadi satu baris karya_bukti.
  tombol.onclick = async()=>{
    const semua = [...berkas.files];
    if(!semua.length) return tulis('err', 'Pilih berkas dulu.');
    const tahun = document.getElementById('f_tahun')?.value || '';
    if(!/^\d{4}$/.test(tahun)) return tulis('err', 'Pilih tahun pada isian dulu.');
    const judul = (document.getElementById('f_judul')?.value || '').trim();
    const dilewati = [], unggah = [];
    semua.forEach(f=>{
      const e = ((f.name.match(/\.([^.]+)$/) || [])[1] || '').toLowerCase();
      if(!ext.includes(e)) dilewati.push(`${f.name} (jenis)`);
      else if(maxMb && f.size > maxMb*1024*1024) dilewati.push(`${f.name} (> ${maxMb} MB)`);
      else unggah.push(f);
    });
    if(!unggah.length)
      return tulis('err', `Tidak ada berkas yang bisa diunggah. Diterima: ${ext.join(', ')}, ` +
                          `maksimal ${maxMb} MB. Dilewati: ${dilewati.join('; ')}.`);
    tombol.disabled = true;
    let berhasil = 0;
    const gagal = [], ulang = [];
    try {
      const { data:{ session } } = await sb.auth.getSession();
      if(!session) throw new Error('Sesi login habis. Muat ulang halaman lalu masuk lagi.');
      for(let i = 0; i < unggah.length; i++){
        const f = unggah[i];
        tulis('', `Memeriksa dan mengunggah ${i + 1} dari ${unggah.length}: ${f.name}…`);
        try {
          // Berkas yang sama persis sudah tersimpan (31-patch-sidik-berkas.sql),
          // mis. artikel bersama yang sudah diunggah penulis lain: pakai tautannya.
          const s = await periksaBerkas(sb, f);
          if(s.temuan){
            antreanBukti.push({ jenis: jenisEl.value, judul: f.name, url: s.temuan.url, sha256: s.sha256 });
            ulang.push(`${f.name} ${teksTemuan(s.temuan)}`);
            berhasil++;
            continue;
          }
          // text/plain supaya browser tidak mengirim preflight CORS, yang tidak
          // dilayani Apps Script.
          const body = { token: session.access_token, filename: f.name, year: tahun,
                         data: await keB64(f) };
          if(judul) body.group = judul;
          const res = await fetch(url, { method:'POST',
            headers:{ 'Content-Type':'text/plain;charset=utf-8' },
            body: JSON.stringify(body) });
          const out = await res.json();
          if(!out.ok) throw new Error(out.error || 'Unggah gagal.');
          antreanBukti.push({ jenis: jenisEl.value, judul: f.name, url: out.url, sha256: s.sha256 });
          berhasil++;
        } catch(err){
          gagal.push(`${f.name}: ${err.message || err}`);
          if(/Sesi login/.test(err.message || '')) break;
        }
      }
      berkas.value = '';
      gambarAntrean();
      const ringkas = [`${berhasil} dari ${unggah.length} berkas siap; tersimpan sebagai bukti saat karya disimpan`];
      if(ulang.length) ringkas.push('tidak diunggah ulang: ' + ulang.join('; '));
      if(dilewati.length) ringkas.push('dilewati: ' + dilewati.join('; '));
      if(gagal.length) ringkas.push('gagal: ' + gagal.join('; '));
      tulis(gagal.length || !berhasil ? 'err' : 'ok', ringkas.join('. ') + '.');
    } catch(err){
      tulis('err', err.message || String(err));
    } finally {
      tombol.disabled = false;
    }
  };
}

// Daftar mahasiswa disusun di memori dulu, baru disimpan bersama karya.
// Ini mencegah baris mahasiswa yatim bila penyimpanan karya gagal.
let mhsSementara = [];
// Berkas bukti terunggah yang menunggu karya disimpan (pasangUnggah).
let antreanBukti = [];
let mitraSementara = [];

// awal: daftar yang sudah tercatat (form ubah); kosong untuk entri baru.
function pasangMahasiswa(awal = []){
  mhsSementara = awal.map(m => ({ nim: m.nim, nama: m.nama, peran: m.peran,
                                  korespondensi: !!m.korespondensi }));
  const nim = document.getElementById('mhs_nim');
  const nama = document.getElementById('mhs_nama');
  const peran = document.getElementById('mhs_peran');
  const koresp = document.getElementById('mhs_koresp');
  const btn = document.getElementById('mhs_tambah');
  if(!btn) return;

  const gambar = ()=>{
    const w = document.getElementById('mhs_daftar');
    w.innerHTML = mhsSementara.map((m,i)=>{
      const tanda = [rapi(m.peran), m.korespondensi ? 'korespondensi' : null]
        .filter(Boolean).join(', ');
      return `
      <div class="mhs-item">
        <span class="i">${esc(m.nim)}</span>
        <span class="n">${esc(m.nama)}</span>
        <span class="tag">${esc(tanda)}</span>
        <button type="button" class="btn danger sm" data-h="${i}">Hapus</button>
      </div>`;}).join('');
    w.querySelectorAll('[data-h]').forEach(b=>{
      b.onclick = ()=>{ mhsSementara.splice(+b.dataset.h,1); gambar(); };
    });
  };

  const tambah = ()=>{
    const n = nim.value.trim(), m = nama.value.trim();
    if(!n || !m){ alert('Isi NIM dan nama mahasiswa lebih dulu.'); return; }
    if(mhsSementara.some(x=>x.nim===n)){ alert('NIM ini sudah ada di daftar.'); return; }
    // Penulis pertama hanya boleh satu orang dalam satu karya.
    if(peran.value === 'penulis_pertama'
       && mhsSementara.some(x=>x.peran === 'penulis_pertama')){
      alert('Sudah ada mahasiswa berperan penulis pertama pada entri ini.');
      return;
    }
    mhsSementara.push({nim:n, nama:m, peran:peran.value,
                       korespondensi: koresp ? koresp.checked : false});
    nim.value=''; nama.value='';
    if(koresp) koresp.checked = false;
    nim.focus(); gambar();
  };

  btn.onclick = tambah;
  [nim,nama].forEach(el=> el.onkeydown = e=>{
    if(e.key==='Enter'){ e.preventDefault(); tambah(); } });
  gambar();
}

// Mitra disusun di memori dulu, sama seperti mahasiswa, agar tidak ada
// baris mitra yatim bila penyimpanan karyanya gagal.
// Daftar mitra yang pernah dipakai, untuk saran ketik dan pencegahan
// nama kembar. Dimuat sekali per sesi halaman.
let mitraDikenal = null;
async function muatMitraDikenal(){
  if(mitraDikenal) return mitraDikenal;
  const { data } = await sb.from('karya_mitra')
    .select('institusi, tingkat, negara').limit(2000);
  // Kunci normalisasi: huruf kecil, tanpa tanda baca, tanpa awalan badan
  // usaha, spasi dirapatkan — supaya "PT. PP (Persero) Tbk" dan
  // "PT PP Persero Tbk" dikenali sebagai satu institusi yang sama.
  const peta = new Map();
  (data || []).forEach(m=>{
    const k = kunciMitra(m.institusi);
    if(k && !peta.has(k)) peta.set(k, m);
  });
  mitraDikenal = peta;
  return peta;
}

function kunciMitra(nama){
  return String(nama || '').toLowerCase()
    .replace(/[.,()\-—–"']/g, ' ')
    .replace(/\b(pt|cv|ud|tbk|persero|the|universitas|university|univ)\b/g, ' ')
    .replace(/\s+/g, ' ').trim();
}

function pasangMitra(awal = []){
  mitraSementara = awal.map(m => ({ institusi: m.institusi, tingkat: m.tingkat,
                                    negara: m.negara || null }));
  const nama = document.getElementById('mtr_nama');
  const tingkat = document.getElementById('mtr_tingkat');
  const negara = document.getElementById('mtr_negara');
  const btn = document.getElementById('mtr_tambah');
  if(!btn) return;

  const gambar = ()=>{
    const w = document.getElementById('mtr_daftar');
    w.innerHTML = mitraSementara.map((m,i)=>`
      <div class="mhs-item">
        <span class="n">${esc(m.institusi)}</span>
        <span class="tag">${esc(rapi(m.tingkat))}</span>
        <span class="i">${esc(m.negara || '')}</span>
        <button type="button" class="btn danger sm" data-h="${i}">Hapus</button>
      </div>`).join('');
    w.querySelectorAll('[data-h]').forEach(b=>{
      b.onclick = ()=>{ mitraSementara.splice(+b.dataset.h,1); gambar(); };
    });
  };

  // Isi saran dari mitra yang pernah dipakai; gagal memuat tidak
  // menghalangi input, hanya kehilangan sarannya.
  muatMitraDikenal().then(peta=>{
    const dl = document.getElementById('mitra_dikenal');
    if(!dl) return;
    dl.innerHTML = [...peta.values()]
      .sort((a,b)=>a.institusi.localeCompare(b.institusi))
      .map(m=>`<option value="${esc(m.institusi)}">`).join('');
  }).catch(()=>{});

  const tambah = ()=>{
    const n = nama.value.trim();
    if(!n){ alert('Isi nama institusi mitra lebih dulu.'); return; }
    if(!tingkat.value){ alert('Pilih tingkat kerja samanya.'); return; }
    if(mitraSementara.some(x=>x.institusi.toLowerCase() === n.toLowerCase())){
      alert('Institusi ini sudah ada di daftar.'); return;
    }
    // Ejaan berbeda untuk institusi yang sama membuat butir 6 menghitung
    // dua mitra. Tawarkan ejaan baku yang sudah dipakai sebelumnya.
    const sama = mitraDikenal && mitraDikenal.get(kunciMitra(n));
    if(sama && sama.institusi !== n){
      if(confirm(`Institusi ini sepertinya sudah pernah dicatat dengan ejaan:\n\n`
                 + `    ${sama.institusi}\n\n`
                 + `Pakai ejaan itu agar tidak terhitung sebagai dua mitra berbeda?`)){
        nama.value = sama.institusi;
        if(!tingkat.value && sama.tingkat) tingkat.value = sama.tingkat;
        if(!negara.value && sama.negara) negara.value = sama.negara;
        return;   // beri kesempatan memeriksa sebelum menambah
      }
    }
    mitraSementara.push({institusi:n, tingkat:tingkat.value,
                         negara: negara.value.trim() || null});
    nama.value=''; negara.value=''; tingkat.value=''; nama.focus(); gambar();
  };

  // Memilih dari daftar saran ikut mengisi tingkat dan negara yang
  // tercatat sebelumnya, sehingga satu institusi tidak berpindah-pindah
  // tingkat antar-entri.
  nama.addEventListener('change', ()=>{
    const sama = mitraDikenal && mitraDikenal.get(kunciMitra(nama.value));
    if(!sama) return;
    if(!tingkat.value && sama.tingkat) tingkat.value = sama.tingkat;
    if(!negara.value && sama.negara) negara.value = sama.negara;
  });

  btn.onclick = tambah;
  [nama,negara].forEach(el=> el.onkeydown = e=>{
    if(e.key==='Enter'){ e.preventDefault(); tambah(); } });
  gambar();
}

//  Deteksi duplikat
// ---------------------------------------------------------------------
async function cariDuplikat(kategori, judul, doi){
  if(doi && doi.trim()){
    const { data } = await sb.from('karya')
      .select('id,judul,tahun,status,karya_penulis(peran, korespondensi, dosen(nama))')
      .ilike('doi', doi.trim());
    if(data && data.length) return { sebab:'DOI yang sama', karya:data[0] };
  }
  const j = norm(judul);
  if(j.length < 12) return null;
  const { data } = await sb.from('karya')
    .select('id,judul,tahun,status,judul_norm,karya_penulis(peran, korespondensi, dosen(nama))')
    .eq('kategori', kategori);
  const cocok = (data||[]).find(k => k.judul_norm === j);
  return cocok ? { sebab:'judul yang identik', karya:cocok } : null;
}

        <b>${esc(d.karya.judul)}</b>
        <span>${d.karya.tahun} · ${esc(rapi(d.karya.status))} ·
          penulis terdaftar: ${nama.length ? esc(nama.join(', ')) : 'belum ada'}</span>
      </div>
      <div class="aksi" style="margin:0">
        <button class="btn sm" id="klaim">Saya juga penulis karya ini</button>
        <button class="btn ghost sm" id="batalDup">Bukan, ini karya berbeda</button>
        <span class="msg" id="dm"></span>
      </div>
    </div>`;

  document.getElementById('klaim').onclick = async()=>{
    const dm = document.getElementById('dm');
    dm.className='msg'; dm.textContent='Mendaftarkan…';
    const { error } = await sb.from('karya_penulis').insert({
      karya_id: d.karya.id, dosen_id: saya.id, peran,
      korespondensi: koresp, ditambahkan_sendiri: true });
    if(error){
      dm.className='msg err';
      dm.textContent = error.code === '23505'
        ? 'Anda sudah terdaftar sebagai penulis pada karya ini.' : error.message;
    } else {
      dm.className='msg ok';
      dm.textContent='Terdaftar. Admin prodi akan meninjau penambahan ini.';
      document.getElementById('frm').reset();
      muatKaryaSaya('daftar', 6);
    }
  };
  document.getElementById('batalDup').onclick = ()=>{
    document.getElementById('dupBox').innerHTML = '';
    document.getElementById('frm').dataset.lewati = '1';
  };
}

// ---------------------------------------------------------------------
async function simpan(key){
  const frm = document.getElementById('frm'), fm = document.getElementById('fm'),
        sub = document.getElementById('sub');
  fm.className='msg';

  const isi = Object.fromEntries(new FormData(frm).entries());
  Object.keys(isi).forEach(k=>{ if(isi[k]==='') isi[k]=null; });
  if(key !== 'kegiatan') isi.kategori = key;

  // Integrasi memilih kegiatan lewat dropdown; judulnya disalin dari entri
  // aslinya supaya laporan dan data.json tetap terbaca apa adanya tanpa
  // menelusuri relasi, dan tidak ada judul kembar akibat ketik ulang.
  if(key === 'integrasi'){
    if(!isi.induk_id){
      fm.className='msg err';
      fm.textContent='Pilih penelitian atau PkM yang diintegrasikan.';
      return;
    }
    isi.judul = JUDUL_INDUK[isi.induk_id] || '';
  }

  if(isi.mulai_ks && isi.selesai_ks && isi.selesai_ks < isi.mulai_ks){
    fm.className='msg err'; fm.textContent='Tanggal akhir kerja sama lebih awal dari tanggal awal.';
    return;
  }
  const peran  = document.getElementById('f_peran').value;
  const koresp = document.getElementById('f_koresponden')?.checked || false;
  const buktiUrl = (document.getElementById('f_bukti_url')?.value || '').trim();

  if(key === 'kegiatan'){
    if(!isi.skema_kode){
      fm.className='msg err'; fm.textContent='Pilih kelompok pendanaan dan skema dulu.';
      return;
    }
    const s = refSkema.find(x=>x.kode === isi.skema_kode);
    if(s && /lainnya/i.test(s.kode) && !isi.keterangan){
      fm.className='msg err';
      fm.textContent='Skema "lainnya" wajib disertai nama skema di kolom keterangan.';
      return;
    }
  }
  // Mitra dikumpulkan di daftar tersendiri; isian yang masih tertinggal di
  // kotak ketik tanpa ditekan "Tambah" adalah kesalahan yang paling sering
  // terjadi, jadi dicegat di sini alih-alih diam-diam dibuang.
  if(document.getElementById('mtr_nama')?.value.trim()){
    fm.className='msg err';
    fm.textContent='Ada institusi mitra yang belum ditekan "Tambah".';
    return;
  }
  if(document.getElementById('mhs_nim')?.value.trim()
     || document.getElementById('mhs_nama')?.value.trim()){
    fm.className='msg err';
    fm.textContent='Ada mahasiswa yang belum ditekan "Tambah".';
    return;
  }
  if(buktiUrl && !/^https:\/\/[^ ]+\.[^ ]+/.test(buktiUrl)){
    fm.className='msg err';
    fm.textContent='Tautan bukti harus berupa alamat https:// yang lengkap.';
    return;
  }

  sub.disabled = true;

  // 1. periksa duplikat, kecuali pengguna sudah menyatakan berbeda
  if(!frm.dataset.lewati){
    fm.textContent = 'Memeriksa duplikat…';
    const dup = await cariDuplikat(isi.kategori, isi.judul, isi.doi);
    if(dup){
      sub.disabled = false; fm.textContent = '';
      tampilDuplikat(dup, peran, koresp);
      document.querySelector('.dup').scrollIntoView({behavior:'smooth', block:'center'});
      return;
    }
  }

  // Peran rekan dibaca dan diperiksa SEBELUM karya dibuat, supaya batal
  // di sini tidak meninggalkan karya yatim tanpa penulis lengkap.
  const rekan = bacaRekan();
  const jumlahPertama = (peran === 'penulis_pertama' || peran === 'ketua' ? 1 : 0)
    + rekan.filter(r=>r.peran === 'penulis_pertama' || r.peran === 'ketua').length;
  if(jumlahPertama > 1 && !confirm(
      'Ada lebih dari satu orang berperan penulis pertama/ketua pada entri '
      + 'ini. Itu sah untuk co-first author, tetapi sering juga salah pilih. '
      + 'Lanjutkan?')){
    fm.textContent = 'Dibatalkan — periksa peran para penulis.';
    return;
  }

  // 2. simpan
  fm.textContent = 'Menyimpan…';
  try{
    const { data:k, error } = await sb.from('karya')
      .insert({ ...isi, bukti_url: buktiUrl || null,
                status:'diajukan', dilaporkan_oleh: saya.id })
      .select('id').single();
    if(error) throw error;

    const baris = [
      { karya_id:k.id, dosen_id:saya.id, peran, korespondensi:koresp, ditambahkan_sendiri:false },
      ...rekan.map(r=>({ karya_id:k.id, ...r, ditambahkan_sendiri:false }))];
    const { error:eP } = await sb.from('karya_penulis').insert(baris);
    if(eP) throw eP;

    if(mhsSementara.length){
      const { error:eM } = await sb.from('karya_mahasiswa').insert(
        mhsSementara.map(m=>({ karya_id:k.id, nim:m.nim, nama:m.nama,
                               peran:m.peran, korespondensi:m.korespondensi })));
      if(eM) throw eM;
    }

    if(mitraSementara.length){
      const { error:eMt } = await sb.from('karya_mitra').insert(
        mitraSementara.map(m=>({ karya_id:k.id, institusi:m.institusi,
                                 tingkat:m.tingkat, negara:m.negara })));
      if(eMt) throw eMt;
    }

    // Berkas bukti dari antrean: satu baris karya_bukti per berkas.
    let catatanBukti = '';
    if(antreanBukti.length){
      const { error:eB } = await sb.from('karya_bukti').insert(
        antreanBukti.map(b=>({ karya_id:k.id, jenis:b.jenis, judul:b.judul, url:b.url, ...kolomSidik(b.sha256) })));
      if(eB) catatanBukti = ' Bukti berkas gagal dicatat (' + eB.message
        + '); tambahkan lewat Karya saya > Bukti.';
    }

    frm.reset(); delete frm.dataset.lewati;
    antreanBukti = []; gambarAntrean();
    const um = document.getElementById('unggah_msg'); if(um){ um.className='msg'; um.textContent=''; }
    mhsSementara = []; pasangMahasiswa();
    mitraSementara = []; pasangMitra();
    if(key === 'kegiatan') pasangSkema();
    document.getElementById('dupBox').innerHTML = '';
    fm.className='msg ok'; fm.textContent='Tersimpan. Menunggu verifikasi admin prodi.' + catatanBukti;
    muatKaryaSaya('daftar', 6);
  }catch(err){
    fm.className='msg err';
    fm.textContent = err.code === '23505'
      ? 'DOI ini sudah terdaftar pada karya lain.'
      : (err.message || 'Gagal menyimpan.');
  }finally{ sub.disabled = false; }
}

// ---------------------------------------------------------------------
//  Ubah karya dan ajuan perubahan (pemilik 2026-11-04, patch 20)
//    pelapor + belum terverifikasi -> Ubah langsung (rpc ubah_karya);
//    selain itu (terverifikasi, atau penulis bukan pelapor) -> ajuan_ubah,
//    diputuskan admin di tab Verifikasi (rpc setujui_ajuan_ubah).
//  Yang dikirim hanya isian yang berubah; daftar penulis/mitra/mahasiswa
//  yang berubah dikirim utuh dan menggantikan daftar lama.
// ---------------------------------------------------------------------
const KUNCI_FORM = { publikasi:'publikasi', penelitian:'kegiatan', pkm:'kegiatan',
  luaran:'luaran', rekognisi:'rekognisi', integrasi:'integrasi' };

// Kolom karya yang diisi form `key`.
function kolomForm(key){
  const out = FORM[key].f.map(f => f.t === 'skema' ? 'skema_kode' : f.n);
  if(key === 'integrasi') out.push('judul');   // disalin dari kegiatan induk
  return out;
}

async function bukaUbah(id, mode){
  const { data: k, error } = await sb.from('karya')
    .select('*, karya_penulis(dosen_id, peran, korespondensi, dosen(nama)), '
          + 'karya_mitra(institusi, tingkat, negara), karya_mahasiswa(nim, nama, peran, korespondensi)')
    .eq('id', id).single();
  if(error || !k){ alert('Karya tidak bisa dimuat: ' + (error?.message || 'tidak ditemukan')); return; }
  const key = KUNCI_FORM[k.kategori];
  if(!key){ alert('Kategori karya ini belum punya form ubah.'); return; }
  // Kegiatan induk yang bukan atas nama dosen ini tidak ada di dropdown-nya.
  if(k.induk_id){
    const { data: ind } = await sb.from('karya').select('judul').eq('id', k.induk_id).maybeSingle();
    k._judulInduk = ind?.judul || '';
  }
  tandaiTab(key);
  tampilForm(key, { k, mode });
  window.scrollTo(0, 0);
}

// Isi form ubah dari baris karya; dipanggil setelah dropdown asinkron terisi.
function isiUbah(key, k){
  const frm = document.getElementById('frm');
  if(!frm) return;
  // Nilai lama yang tidak ada di pilihan (skema nonaktif, tahun lama) tetap
  // ditambahkan, supaya tidak berubah tanpa sengaja.
  const setel = (el, v) => {
    if(!el) return;
    const s = v == null ? '' : String(v);
    if(el.tagName === 'SELECT' && s && ![...el.options].some(o => o.value === s))
      el.insertAdjacentHTML('beforeend', `<option value="${esc(s)}">${esc(rapi(s))}</option>`);
    el.value = s;
  };
  FORM[key].f.forEach(f => {
    if(f.t === 'skema'){
      const s = refSkema.find(x => x.kode === k.skema_kode);
      const kel = document.getElementById('f_kelompok');
      if(s){ kel.value = s.kelompok; kel.dispatchEvent(new Event('change')); }
      const sk = document.getElementById('f_skema_kode');
      if(k.skema_kode){ sk.disabled = false; setel(sk, k.skema_kode); }
      return;
    }
    if(f.n === 'induk_id' && k.induk_id){
      const el = document.getElementById('f_induk_id');
      if(el && ![...el.options].some(o => o.value === k.induk_id))
        el.insertAdjacentHTML('beforeend', `<option value="${esc(k.induk_id)}">${
          esc('Saat ini: ' + (k._judulInduk || 'kegiatan lain'))}</option>`);
      if(!(k.induk_id in JUDUL_INDUK)) JUDUL_INDUK[k.induk_id] = k._judulInduk || k.judul;
    }
    setel(document.getElementById('f_' + f.n), k[f.n]);
  });
  const sendiri = (k.karya_penulis || []).find(p => p.dosen_id === saya.id);
  if(sendiri){
    setel(document.getElementById('f_peran'), sendiri.peran);
    const kr = document.getElementById('f_koresponden');
    if(kr) kr.checked = !!sendiri.korespondensi;
  }
  (k.karya_penulis || []).filter(p => p.dosen_id !== saya.id).forEach(p => {
    const c = frm.querySelector(`.r-ikut[value="${p.dosen_id}"]`);
    if(!c) return;
    c.checked = true; c.dispatchEvent(new Event('change'));
    const it = c.closest('.rekan-item');
    setel(it.querySelector('.r-peran'), p.peran);
    const kr = it.querySelector('.r-koresp');
    if(kr) kr.checked = !!p.korespondensi;
  });
}

async function simpanUbah(key, { k, mode }){
  const frm = document.getElementById('frm'), fm = document.getElementById('fm'),
        sub = document.getElementById('sub');
  const gagal = t => { fm.className = 'msg err'; fm.textContent = t; };
  fm.className = 'msg'; fm.textContent = '';

  const isi = Object.fromEntries(new FormData(frm).entries());
  Object.keys(isi).forEach(x => { if(isi[x] === '') isi[x] = null; });
  if(key === 'integrasi'){
    if(!isi.induk_id) return gagal('Pilih penelitian atau PkM yang diintegrasikan.');
    isi.judul = JUDUL_INDUK[isi.induk_id] || k.judul;
  }
  if(key === 'kegiatan'){
    if(!isi.skema_kode) return gagal('Pilih kelompok pendanaan dan skema dulu.');
    if(/lainnya/i.test(isi.skema_kode) && !isi.keterangan)
      return gagal('Skema "lainnya" wajib disertai nama skema di kolom keterangan.');
  }
  if(document.getElementById('mtr_nama')?.value.trim())
    return gagal('Ada institusi mitra yang belum ditekan "Tambah".');
  if(document.getElementById('mhs_nim')?.value.trim() || document.getElementById('mhs_nama')?.value.trim())
    return gagal('Ada mahasiswa yang belum ditekan "Tambah".');
  const alasan = (document.getElementById('f_alasan')?.value || '').trim();
  if(mode === 'ajuan' && !alasan) return gagal('Alasan perubahan wajib diisi.');

  // Hanya yang berubah. Angka dari basis data dibandingkan sebagai teks.
  const sama = (a, b) => String(a ?? '') === String(b ?? '');
  const data = {}, lama = {};
  const kBaru = {}, kLama = {};
  kolomForm(key).forEach(c => {
    if(!(c in isi)) return;   // select nonaktif tidak terkirim
    if(!sama(isi[c], k[c])){ kBaru[c] = isi[c]; kLama[c] = k[c] ?? null; }
  });
  if(Object.keys(kBaru).length){ data.karya = kBaru; lama.karya = kLama; }

  const peran = document.getElementById('f_peran').value;
  const koresp = document.getElementById('f_koresponden')?.checked || false;
  const penulis = [{ dosen_id: saya.id, peran, korespondensi: koresp }, ...bacaRekan()];
  const penulisLama = (k.karya_penulis || []).map(p => ({ dosen_id: p.dosen_id, peran: p.peran,
                                                          korespondensi: !!p.korespondensi }));
  const kunciP = xs => xs.map(p => `${p.dosen_id}|${p.peran}|${!!p.korespondensi}`).sort().join(';');
  if(kunciP(penulis) !== kunciP(penulisLama)){ data.penulis = penulis; lama.penulis = penulisLama; }

  if(FORM[key].mitra){
    const mLama = (k.karya_mitra || []).map(m => ({ institusi: m.institusi, tingkat: m.tingkat,
                                                    negara: m.negara || null }));
    const kunciM = xs => xs.map(m => `${(m.institusi || '').trim().toLowerCase()}|${m.tingkat || ''}|${
      (m.negara || '').trim()}`).sort().join(';');
    if(kunciM(mitraSementara) !== kunciM(mLama)){ data.mitra = mitraSementara; lama.mitra = mLama; }
  }
  if(FORM[key].mahasiswa){
    const sLama = (k.karya_mahasiswa || []).map(m => ({ nim: m.nim, nama: m.nama, peran: m.peran,
                                                        korespondensi: !!m.korespondensi }));
    const kunciS = xs => xs.map(m => `${m.nim}|${m.nama}|${m.peran}|${!!m.korespondensi}`).sort().join(';');
    if(kunciS(mhsSementara) !== kunciS(sLama)){ data.mahasiswa = mhsSementara; lama.mahasiswa = sLama; }
  }
  if(!Object.keys(data).length) return gagal('Tidak ada isian yang berubah.');

  const pertama = penulis.filter(r => r.peran === 'penulis_pertama' || r.peran === 'ketua').length;
  if(data.penulis && pertama > 1 && !confirm(
      'Ada lebih dari satu orang berperan penulis pertama/ketua pada entri ini. '
      + 'Itu sah untuk co-first author, tetapi sering juga salah pilih. Lanjutkan?')) return;

  sub.disabled = true;
  fm.textContent = mode === 'ajuan' ? 'Mengirim ajuan…' : 'Menyimpan…';
  try{
    const { error } = mode === 'ajuan'
      ? await sb.from('ajuan_ubah').insert({ jenis: 'karya', karya_id: k.id, data, lama,
                                             alasan, oleh: saya.id })
      : await sb.rpc('ubah_karya', { k: k.id, d: data });
    if(error) throw error;
    alert(mode === 'ajuan'
      ? 'Ajuan perubahan terkirim. Perubahan berlaku setelah disetujui admin prodi.'
      : 'Perubahan tersimpan. Karya kembali menunggu verifikasi admin prodi.');
    bukaTab('saya');
  }catch(err){
    gagal(err.code === '23505'
      ? (mode === 'ajuan' ? 'Karya ini sudah punya ajuan perubahan yang menunggu.'
                          : 'DOI ini sudah terdaftar pada karya lain.')
      : (err.message || 'Gagal menyimpan.'));
  }finally{ sub.disabled = false; }
}

// Tombol ubah per karya di Karya saya.
function aksiUbah(k){
  if(AJUAN_UBAH_GAGAL) return '';   // patch 20 belum dijalankan
  const xs = AJUAN_UBAH.get(k.id) || [];
  const tunggu = xs.find(a => a.status === 'menunggu');
  if(tunggu) return `<span class="tag" style="background:#FFF3D6;color:#7A5A00" title="Alasan: ${
      esc(tunggu.alasan || '-')}">menunggu persetujuan perubahan</span>`
    + (tunggu.oleh === saya.id ? `<button class="btn ghost sm" data-ub="${tunggu.id}">Batalkan ajuan</button>` : '');
  const tolak = xs.find(a => a.status === 'ditolak' && a.oleh === saya.id);
  const h = tolak ? `<span class="tag" style="background:#F7E7E7;color:#8C2F2F" title="Alasan admin: ${
      esc(tolak.catatan_admin || '-')}">perubahan ditolak</span>
    <button class="btn ghost sm" data-ut="${tolak.id}" data-alasan="${esc(tolak.catatan_admin || '-')}">Lihat alasan</button>` : '';
  return h + (k.dilaporkan_oleh === saya.id && k.status !== 'terverifikasi'
    ? `<button class="btn ghost sm" data-ubah="${k.id}">Ubah</button>`
    : `<button class="btn ghost sm" data-aju="${k.id}" title="Perubahan berlaku setelah disetujui admin">Ajukan perubahan</button>`);
}

// Label isian untuk tabel perbandingan admin.
function labelKolom(c){
  const khusus = { kategori: 'Jenis kegiatan', skema_kode: 'Skema', judul: 'Judul' };
  if(khusus[c]) return khusus[c];
  for(const F of Object.values(FORM)){
    const f = F.f.find(x => x.n === c);
    if(f?.l) return f.l;
  }
  return rapi(c);
}

function tabelBeda(a, nama, karya){
  const kosong = '<span class="kosong">—</span>';
  const nilai = (c, v) => {
    if(v == null || v === '') return kosong;
    if(c === 'skema_kode') return esc(namaSkema(v) || v);
    if(c === 'induk_id') return esc(karya.get(v)?.judul || v);
    if(c === 'kerjasama_id') return esc(NAMA_KS[v] || 'kerja sama #' + v);
    if(c === 'tema_id') return esc(NAMA_TEMA[v] || 'tema #' + v);
    if(c === 'sesuai_rps') return String(v) === 'true' ? 'Ya' : 'Belum';
    if(c === 'jenis_bukti_ks') return esc((JENIS_BUKTI_KS.find(x => x[0] === v) || [])[1] || v);
    return esc(rapi(String(v)));
  };
  const daftar = xs => xs.length ? xs.map(esc).join('<br>') : kosong;
  const tanda = p => rapi(p.peran) + (p.korespondensi ? ', korespondensi' : '');
  const pen = xs => (xs || []).map(p => `${nama.get(p.dosen_id) || 'dosen'} (${tanda(p)})`);
  const mtr = xs => (xs || []).map(m => [m.institusi, rapi(m.tingkat), m.negara].filter(Boolean).join(', '));
  const mhs = xs => (xs || []).map(m => `${m.nim} ${m.nama} (${tanda(m)})`);
  const baris = Object.keys(a.data?.karya || {}).map(c =>
    [labelKolom(c), nilai(c, a.lama?.karya?.[c]), nilai(c, a.data.karya[c])]);
  if(a.data?.penulis)   baris.push(['Penulis dari prodi', daftar(pen(a.lama?.penulis)), daftar(pen(a.data.penulis))]);
  if(a.data?.mitra)     baris.push(['Institusi mitra', daftar(mtr(a.lama?.mitra)), daftar(mtr(a.data.mitra))]);
  if(a.data?.mahasiswa) baris.push(['Mahasiswa terlibat', daftar(mhs(a.lama?.mahasiswa)), daftar(mhs(a.data.mahasiswa))]);
  return `<table class="beda"><thead><tr><th>Isian</th><th>Lama</th><th>Baru</th></tr></thead><tbody>${
    baris.map(([l, x, y]) => `<tr><td>${esc(l)}</td><td>${x}</td><td>${y}</td></tr>`).join('')}</tbody></table>`;
}

// Panel "Ajuan perubahan karya" di tab Verifikasi (admin).
async function muatAjuanUbahKarya(){
  const box = document.getElementById('au');
  if(!box) return;
  const { data: aj, error } = await sb.from('ajuan_ubah')
    .select('id,karya_id,data,lama,alasan,oleh,dibuat_pada')
    .eq('jenis', 'karya').eq('status', 'menunggu').order('dibuat_pada');
  if(error){ box.className = 'kosong'; box.textContent = 'Tabel ajuan_ubah belum bisa dibaca ('
    + error.message + '). Jalankan supabase/20-patch-ajuan-ubah.sql.'; return; }
  if(!aj?.length){ box.className = 'kosong'; box.textContent = 'Tidak ada ajuan perubahan.'; return; }
  // Nama dosen dan judul karya/induk yang dirujuk ajuan.
  const idDosen = new Set(), idKarya = new Set();
  aj.forEach(a => {
    idDosen.add(a.oleh); idKarya.add(a.karya_id);
    [a.data, a.lama].forEach(s => {
      (s?.penulis || []).forEach(p => idDosen.add(p.dosen_id));
      if(s?.karya?.induk_id) idKarya.add(s.karya.induk_id);
    });
  });
  const [{ data: ds }, { data: ks }] = await Promise.all([
    sb.from('dosen').select('id,nama').in('id', [...idDosen]),
    sb.from('karya').select('id,judul,tahun,kategori').in('id', [...idKarya]),
  ]);
  const nama = new Map((ds || []).map(d => [d.id, d.nama]));
  const karya = new Map((ks || []).map(k => [k.id, k]));
  // Nama kerja sama induk yang dirujuk ajuan (24-patch-kerjasama-induk.sql).
  const idKS = [...new Set(aj.flatMap(a => [a.data?.karya?.kerjasama_id, a.lama?.karya?.kerjasama_id]).filter(Boolean))];
  if(idKS.length){
    const { data: kk } = await sb.from('lkps_kerjasama').select('id,mitra,kegiatan').in('id', idKS);
    (kk || []).forEach(x => { NAMA_KS[x.id] = x.mitra + (x.kegiatan ? ' — ' + x.kegiatan : ''); });
  }
  // Nama tema peta jalan yang dirujuk ajuan (25-patch-isian-karya.sql).
  const idTema = [...new Set(aj.flatMap(a => [a.data?.karya?.tema_id, a.lama?.karya?.tema_id]).filter(Boolean))];
  if(idTema.length){
    const { data: tt } = await sb.from('ref_tema_peta_jalan').select('id,nama').in('id', idTema);
    (tt || []).forEach(x => { NAMA_TEMA[x.id] = x.nama; });
  }
  box.className = '';
  box.innerHTML = aj.map(a => {
    const k = karya.get(a.karya_id) || {};
    return `<div class="ajuan-ubah">
      <div><b>${esc(k.judul || '(karya)')}</b>
        <span class="tag">${esc(String(k.tahun || ''))} · ${esc(rapi(k.kategori))}</span></div>
      <div class="hint" style="margin:4px 0 0">Diajukan ${esc(nama.get(a.oleh) || 'dosen')},
        ${esc(String(a.dibuat_pada).slice(0, 10))}. Alasan: ${esc(a.alasan || '-')}</div>
      ${tabelBeda(a, nama, karya)}
      <div class="aksi" style="margin:10px 0 0">
        <button class="btn sm" data-su="${a.id}">Setujui</button>
        <button class="btn danger sm" data-tu="${a.id}">Tolak</button></div></div>`;
  }).join('');
  box.querySelectorAll('[data-su]').forEach(b => {
    b.onclick = async () => {
      if(!confirm('Terapkan perubahan ini? Data lama diganti dengan kolom "Baru".')) return;
      b.disabled = true;
      const { error: e } = await sb.rpc('setujui_ajuan_ubah', { a: +b.dataset.su });
      if(e) alert('Gagal menerapkan: ' + (e.code === '23505' ? 'DOI sudah terdaftar pada karya lain.' : e.message));
      muatAjuanUbahKarya();
    };
  });
  box.querySelectorAll('[data-tu]').forEach(b => {
    b.onclick = async () => {
      const c = prompt('Alasan penolakan (akan dilihat dosen):');
      if(c === null) return;
      const { error: e } = await sb.from('ajuan_ubah')
        .update({ status: 'ditolak', catatan_admin: c.trim() || '-' }).eq('id', +b.dataset.tu);
      if(e) alert('Gagal: ' + e.message);
      muatAjuanUbahKarya();
    };
  });
}

const namaSkema = kode => refSkema.find(s=>s.kode===kode)?.nama || '';

// Nama penulis beserta penanda posisi dan korespondensi.
// Keduanya berdiri sendiri: seorang dosen bisa sekaligus penulis
// pertama dan penulis korespondensi.
const daftarPenulis = kp => (kp||[]).map(p=>{
  const n = p.dosen?.nama; if(!n) return null;
  const tanda = [
    p.peran==='penulis_pertama' ? 'penulis pertama' : null,
    p.peran==='ketua'           ? 'ketua'           : null,
    p.korespondensi             ? 'korespondensi'   : null,
  ].filter(Boolean).join(', ');
  return tanda ? `${n} (${tanda})` : n;
}).filter(Boolean);

function barisKarya(k, aksi='', ekstra=''){
  const nama = daftarPenulis(k.karya_penulis);
  const nMhs = (k.karya_mahasiswa||[]).length;
  const mitra = (k.karya_mitra||[]).map(m=>m.institusi).filter(Boolean);
  const meta = [k.tahun, rapi(k.kategori), rapi(k.tingkat),
                k.nama_terbitan, namaSkema(k.skema_kode),
                mitra.length ? 'mitra: ' + mitra.join(', ') : null,
                nMhs ? `${nMhs} mahasiswa` : null].filter(Boolean);
  return `<div class="rec" data-s="${k.status}">
    <div class="spine"></div>
    <div class="rec-b">
      <div class="rec-j">${esc(k.judul)}</div>
      <div class="rec-m">${meta.map(x=>`<span>${esc(x)}</span>`).join('')}</div>
      ${nama.length?`<div class="rec-m"><span>${esc(nama.join(' · '))}</span></div>`:''}
      ${k.catatan?`<div class="rec-m"><span>Catatan: ${esc(k.catatan)}</span></div>`:''}
      ${ekstra}
    </div>
    <div class="rec-a"><span class="tag">${rapi(k.status)}</span>${aksi}</div>
  </div>`;
}

// Tautan bukti milik dosen, ditampilkan utuh dengan tombol salin supaya
// bisa langsung ditempel ke SISTER/BKD (permintaan pemilik 2026-11-03).
async function salinTeks(t){
  try { await navigator.clipboard.writeText(t); return true; }
  catch {
    const ta = document.createElement('textarea');
    ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch {}
    ta.remove(); return ok;
  }
}

function pasangSalin(box){
  box.querySelectorAll('[data-salin]').forEach(b=>{
    b.onclick = async()=>{
      const asli = b.textContent;
      b.textContent = await salinTeks(b.dataset.salin) ? 'Tersalin' : 'Gagal menyalin';
      setTimeout(()=>{ b.textContent = asli; }, 1500);
    };
  });
}

// Bukti jamak per karya (tabel karya_bukti, supabase/14-patch-bukti-jamak.sql;
// keputusan pemilik 2026-11-03). Bukti penelitian/PkM induk (karya.induk_id)
// ikut tampil pada publikasi/luaran/integrasi turunannya tanpa disalin.
// Dosen penulis boleh menambah bukti walau karya sudah terverifikasi dan
// menghapus bukti miliknya sendiri; aturan ditegakkan RLS.
let KB = new Map(), INDUK = new Map(), KB_GAGAL = '';
// Ajuan hapus karya terverifikasi (tabel ajuan_hapus, supabase/15-patch-ajuan-hapus.sql).
let AJUAN = new Map(), AJUAN_GAGAL = '';
// Ajuan perubahan karya (tabel ajuan_ubah, supabase/20-patch-ajuan-ubah.sql):
// karya_id -> [ajuan menunggu / ditolak].
let AJUAN_UBAH = new Map(), AJUAN_UBAH_GAGAL = '';
const keB64 = f => new Promise((ok, gagal) => {
  const r = new FileReader();
  r.onload = () => ok(String(r.result).split(',')[1] || '');
  r.onerror = () => gagal(new Error('Berkas tidak bisa dibaca: ' + f.name));
  r.readAsDataURL(f);
});

// Muat karya induk (penelitian/PkM asal) dan semua bukti jamak untuk daftar
// karya ini; dipakai tab Karya saya dan Verifikasi.
async function muatBuktiUntuk(data){
  INDUK = new Map(data.map(k => [k.id, k]));
  const indukIds = [...new Set(data.map(k => k.induk_id).filter(i => i && !INDUK.has(i)))];
  if(indukIds.length){
    const { data: ind } = await sb.from('karya').select('id,judul,kategori,bukti_url').in('id', indukIds);
    (ind || []).forEach(k => INDUK.set(k.id, k));
  }
  const ids = [...INDUK.keys()];
  KB = new Map();
  AJUAN = new Map();
  if(!ids.length){ KB_GAGAL = ''; return; }
  // Banyak karya (Karya prodi): ambil seluruh tabel, daftar id terlalu
  // panjang untuk alamat permintaan; dipetakan per karya di bawah.
  const saring = q => ids.length > 100 ? q : q.in('karya_id', ids);
  const { data: kb, error: eKb } = await saring(sb.from('karya_bukti')
    .select('id,karya_id,jenis,judul,url,oleh'));
  KB_GAGAL = eKb ? eKb.message : '';
  const { data: aj, error: eAj } = await saring(sb.from('ajuan_hapus')
    .select('id,karya_id,alasan,oleh,dibuat'));
  AJUAN_GAGAL = eAj ? eAj.message : '';
  AJUAN = new Map((aj || []).map(a => [a.karya_id, a]));
  const { data: au, error: eAu } = await saring(sb.from('ajuan_ubah')
    .select('id,karya_id,oleh,status,alasan,catatan_admin').eq('jenis', 'karya'));
  AJUAN_UBAH_GAGAL = eAu ? eAu.message : '';
  AJUAN_UBAH = new Map();
  (au || []).forEach(a => {
    if(!AJUAN_UBAH.has(a.karya_id)) AJUAN_UBAH.set(a.karya_id, []);
    AJUAN_UBAH.get(a.karya_id).push(a);
  });
  (kb || []).forEach(b => { if(!KB.has(b.karya_id)) KB.set(b.karya_id, []); KB.get(b.karya_id).push(b); });
}

// Daftar tautan bukti tanpa formulir (tab Verifikasi).
// Tautan berkas milik karya ini sendiri (isian awal + karya_bukti), tanpa
// bukti warisan induk: berkas warisan masih dipakai karya induknya.
function berkasMilikKarya(k){
  return daftarBuktiKarya(k).filter(x => x.id || x.lama).map(x => x.url);
}

// hapus=true (layar admin): tombol Hapus pada bukti milik karya ini
// (bukan bukti warisan induk); berkasnya dibuang ke Sampah Drive.
function htmlDaftarBukti(k, hapus = false){

function daftarBuktiKarya(k){
  const xs = [];
  if(k.bukti_url) xs.push({ url: k.bukti_url, label: 'Bukti (isian awal)', lama: k.id });
  (KB.get(k.id) || []).forEach(b => xs.push({ url: b.url, id: b.id, milik: b.oleh === saya.id,
    label: namaJenisBukti(b.jenis) + (b.judul ? ': ' + b.judul : '') }));
  const ind = k.induk_id && INDUK.get(k.induk_id);
  if(ind){
    const aw = `dari ${ind.kategori === 'pkm' ? 'PkM' : 'penelitian'} "${ind.judul}": `;
    if(ind.bukti_url) xs.push({ url: ind.bukti_url, label: aw + 'Bukti' });
    (KB.get(ind.id) || []).forEach(b => xs.push({ url: b.url,
      label: aw + namaJenisBukti(b.jenis) + (b.judul ? ': ' + b.judul : '') }));
  }
  return xs;
}

      <input type="url" id="kbu-${esc(k.id)}" placeholder="atau tempel tautan https://...">
