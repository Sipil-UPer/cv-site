// ---------------------------------------------------------------------
//  Sitasi per tahun (supabase/42-patch-sitasi-tahunan.sql, pemilik 2026-11-10):
//  satu kotak per tahun kalender sejak tahun terbit. Disimpan langsung, juga
//  pada karya terverifikasi (tanpa ajuan). Tarik dari OpenAlex tidak menimpa
//  angka yang diisi dosen.
// ---------------------------------------------------------------------
let sitasiSementara = new Map();   // tahun -> {jumlah, sumber, diambil, ubah}
const hariIniTeks = () => new Date().toISOString().slice(0, 10);

function htmlSitasi(){
  return `<div class="fld full" id="sitasi_fld"><label>Sitasi per tahun</label>
    <div class="sitasi-grid" id="sitasi_grid"></div>
    <div class="sub">Jumlah sitasi yang <b>diterima</b> artikel ini pada tiap tahun kalender. LKPS 4.i (sitasi tiga
      tahun terakhir, hanya jurnal/prosiding terindeks <b>Scopus atau WoS</b>) dihitung situs dari tahun yang beririsan
      dengan TS-2 s.d. TS. Kolom LKPS meminta angka <b>Google Scholar</b>: salin batang grafik sitasi per tahun dari
      halaman artikel. Angka bisa diubah kapan saja, juga setelah karya terverifikasi; tahun berjalan diperbarui tiap tahun.
      <br><button type="button" class="btn ghost sm" id="sitasi_tarik">Tarik dari OpenAlex</button>
      <span class="msg" id="sitasi_msg"></span></div></div>`;
}

function pasangSitasi(awal){
  sitasiSementara = new Map((awal || []).map(r => [+r.tahun, { jumlah: r.jumlah, sumber: r.sumber, diambil: r.diambil, ubah: false }]));
  const grid = document.getElementById('sitasi_grid');
  if(!grid) return;
  const tahunIni = new Date().getFullYear();
  const gambar = () => {
    const terbit = +document.getElementById('f_tahun')?.value || tahunIni;
    const dari = Math.min(terbit, ...[...sitasiSementara.keys()]);
    const tahun = [];
    for(let t = Math.min(dari, tahunIni); t <= tahunIni; t++) tahun.push(t);
    grid.innerHTML = tahun.map(t => { const s = sitasiSementara.get(t);
      return `<label class="sitasi-sel">${t}<input type="number" min="0" step="1" data-st="${t}" value="${s ? s.jumlah : ''}">
        <small>${s ? esc(SUMBER_SITASI[s.sumber] || s.sumber) : '&nbsp;'}</small></label>`; }).join('');
    grid.querySelectorAll('[data-st]').forEach(x => { x.oninput = () => {
      sitasiSementara.set(+x.dataset.st, { jumlah: x.value, sumber: 'manual', diambil: hariIniTeks(), ubah: true });
      x.nextElementSibling.textContent = 'manual';
    }; });
  };
  gambar();
  document.getElementById('f_tahun')?.addEventListener('change', gambar);
  const msg = document.getElementById('sitasi_msg');
  document.getElementById('sitasi_tarik').onclick = async () => {
    const doi = rapiDoi(document.querySelector('#frm [name=doi]')?.value);
    if(!doi){ msg.className = 'msg err'; msg.textContent = 'Isi DOI dulu.'; return; }
    msg.className = 'msg'; msg.textContent = 'Menarik dari OpenAlex…';
    try{
      const w = await ambilDoi(doi);
      if(!w){ msg.className = 'msg err'; msg.textContent = 'DOI tidak ditemukan di OpenAlex.'; return; }
      let n = 0;
      sitasiTahunan(w, tahunIni).forEach(r => {
        const s = sitasiSementara.get(r.tahun);
        if(s && s.sumber !== 'openalex') return;           // angka isian dosen tidak ditimpa
        sitasiSementara.set(r.tahun, { jumlah: r.jumlah, sumber: 'openalex', diambil: hariIniTeks(), ubah: true }); n++;
      });
      gambar();
      msg.className = 'msg ok'; msg.textContent = `${n} tahun diisi dari OpenAlex; angka yang Anda isi sendiri tidak diubah. Klik Simpan.`;
    }catch(e){ msg.className = 'msg err'; msg.textContent = e.batas ? teksBatas(e) : 'Gagal: ' + (e.message || e); }
  };
}

const adaUbahSitasi = () => [...sitasiSementara.values()].some(s => s.ubah);

// Simpan perubahan sitasi karya ini: kotak kosong = baris dihapus.
async function simpanSitasi(karyaId){
  const ubah = [...sitasiSementara.entries()].filter(([, s]) => s.ubah);
  if(!ubah.length) return;
  const hapus = ubah.filter(([, s]) => s.jumlah === '' || s.jumlah == null).map(([t]) => t);
  const isi = ubah.filter(([, s]) => s.jumlah !== '' && s.jumlah != null)
    .map(([t, s]) => ({ karya_id: karyaId, tahun: t, jumlah: Math.max(0, Math.round(+s.jumlah)), sumber: s.sumber, diambil: s.diambil }));
  if(hapus.length){
    const { error } = await sb.from('karya_sitasi').delete().eq('karya_id', karyaId).in('tahun', hapus);
    if(error) throw new Error('Sitasi gagal disimpan: ' + error.message);
  }
  if(isi.length){
    const { error } = await sb.from('karya_sitasi').upsert(isi, { onConflict: 'karya_id,tahun' });
    if(error) throw new Error('Sitasi gagal disimpan: ' + error.message);
  }
  ubah.forEach(([, s]) => { s.ubah = false; });
}

// ---------------------------------------------------------------------
//  Impor publikasi menjadi draf (impor-karya.js; supabase/41-patch-draf-karya.sql).
//  Pemilik 2026-11-10: draf hanya untuk penulisnya; diajukan setelah lengkap.
// ---------------------------------------------------------------------
function pasangImpor(){
  const msg = document.getElementById('imp_msg'), hasil = document.getElementById('imp_hasil');
  const hariIni = new Date().toISOString().slice(0, 10);
  let calon = [];
  const gambar = () => {
    if(!calon.length){ hasil.innerHTML = ''; return; }
    hasil.innerHTML = `<div class="gulir"><table class="rin"><thead><tr><th></th><th>Judul</th><th>Tahun</th>
      <th>Jurnal / prosiding</th><th>Sitasi</th><th>Keterangan</th></tr></thead><tbody>${calon.map((c, i) => `<tr>
        <td><input type="checkbox" data-imp="${i}" ${c.boleh ? '' : 'disabled'} ${c.boleh && c.pilih ? 'checked' : ''}></td>
        <td>${esc(c.d?.karya.judul || c.doi)}</td><td>${c.d?.karya.tahun || ''}</td>
        <td>${esc(c.d?.karya.nama_terbitan || '')}</td><td>${c.d?.sitasiTS ?? ''}</td>
        <td>${c.ket}${c.klaim ? ` <button type="button" class="btn ghost sm" data-imp-klaim="${c.klaim}">Tambahkan saya sebagai penulis</button>` : ''}</td>
      </tr>`).join('')}</tbody></table></div>
      <p><button type="button" class="btn sm" id="imp_simpan">Jadikan draf</button></p>`;
    hasil.querySelectorAll('[data-imp]').forEach(x => { x.onchange = () => { calon[+x.dataset.imp].pilih = x.checked; }; });
    hasil.querySelectorAll('[data-imp-klaim]').forEach(b => { b.onclick = async () => {
      b.disabled = true;
      const { error } = await sb.from('karya_penulis').insert({ karya_id: b.dataset.impKlaim, dosen_id: saya.id,
        peran: 'anggota', korespondensi: false, ditambahkan_sendiri: true });
      if(error){ alert('Gagal: ' + error.message); b.disabled = false; return; }
      b.replaceWith('Anda ditambahkan sebagai penulis; karya ini kini ada di Karya saya.');
      muatKaryaSaya('dsaya', null);
    }; });
    document.getElementById('imp_simpan').onclick = simpanDraf;
  };
  // Karya yang sudah ada di situs (yang terlihat), menurut DOI dan judul: {id, penulis saya?}.
  const karyaAda = async () => {
    const { data } = await sb.from('karya').select('id,doi,judul,status,karya_penulis(dosen_id)').eq('kategori', 'publikasi').limit(5000);
    const info = k => ({ id: k.id, milik: (k.karya_penulis || []).some(p => p.dosen_id === saya.id) });
    return { doi: new Map((data || []).filter(k => k.doi).map(k => [rapiDoi(k.doi), info(k)])),
             judul: new Map((data || []).filter(k => k.judul).map(k => [judulRapi(k.judul), info(k)])) };
  };
  const sudahAda = (doi, sudah) => ({ doi, boleh: false, klaim: sudah.milik ? null : sudah.id,
    ket: sudah.milik ? 'Sudah ada di Karya saya.' : 'Sudah ada di situs (diinput rekan).' });
  // Semua karya dari ORCID di profil (OpenAlex; pemilik 2026-11-10).
  document.getElementById('imp_orcid').onclick = async () => {
    if(!saya.orcid){
      msg.className = 'msg err';
      msg.innerHTML = 'ORCID belum diisi. Isi dulu di <a href="profil.html">Profil saya</a>.';
      return;
    }
    msg.className = 'msg'; msg.textContent = `Mengambil karya ORCID ${saya.orcid} dari OpenAlex…`;
    let r;
    try{ r = await karyaOrcid(saya.orcid); }
    catch(e){ msg.className = 'msg err'; msg.textContent = e.batas ? teksBatas(e) : 'Gagal: ' + (e.message || e); return; }
    if(!r || !r.works.length){
      msg.className = 'msg err';
      msg.textContent = 'OpenAlex belum mengenal karya untuk ORCID ini. Periksa ORCID di Profil saya, dan hubungkan '
        + 'Scopus/Crossref di orcid.org agar publikasinya tercatat. Sementara itu, pakai DOI atau ekspor Google Scholar.';
      return;
    }
    const ada = await karyaAda();
    calon = [];
    const dilihat = new Set();
    for(const w of [...r.works].sort((a, b) => (b.publication_year || 0) - (a.publication_year || 0))){
      const doi = rapiDoi(w.doi), kunci = judulRapi(w.title);
      if(!kunci || dilihat.has(doi || kunci)) continue;
      dilihat.add(doi || kunci);
      const d = drafDari(w, { orcid: saya.orcid, hariIni });
      const sudah = (doi && ada.doi.get(doi)) || ada.judul.get(kunci);
      if(sudah){ calon.push({ ...sudahAda(w.title, sudah), d }); continue; }
      calon.push({ doi: doi || w.title, d, boleh: true, pilih: d.centang,
        ket: (doi ? '' : 'Tanpa DOI. ') + (d.centang ? '' : `Jenis "${d.tipe || 'tanpa tahun'}" tidak dicentang bawaan.`) });
    }
    msg.className = 'msg';
    msg.textContent = `OpenAlex: ${r.works.length} karya atas nama "${r.nama}". Pastikan nama itu Anda. `
      + `${calon.filter(c => c.boleh).length} belum ada di situs.`;
    gambar();
  };
  // Ekspor Google Scholar (BibTeX): DOI dicari di OpenAlex menurut judul.
  document.getElementById('imp_bib').onchange = async ev => {
    const berkas = ev.target.files[0];
    if(!berkas) return;
    const teks = await berkas.text();
    ev.target.value = '';
    if(/^\s*"?(authors?|title)"?\s*,/i.test(teks)){
      msg.className = 'msg err'; msg.textContent = 'Berkas ini CSV. Ekspor ulang dari Google Scholar dengan pilihan BibTeX.'; return;
    }
    const entri = bacaBibtex(teks).filter(e => judulRapi(e.title));
    if(!entri.length){ msg.className = 'msg err'; msg.textContent = 'Tidak ada entri BibTeX di berkas ini.'; return; }
    msg.className = 'msg';
    const ada = await karyaAda();
    calon = [];
    const dilihat = new Set();
    let batas = null;                                            // galat 429: berhenti memanggil OpenAlex
    for(const [i, e] of entri.entries()){
      const kunci = judulRapi(e.title);
      if(dilihat.has(kunci)) continue;                          // judul ganda di berkas
      dilihat.add(kunci);
      // Yang sudah ada atau tidak dicentang bawaan tidak dicari: hemat kredit OpenAlex.
      const sudahJudul = ada.judul.get(kunci);
      if(sudahJudul){ calon.push({ ...sudahAda(e.title, sudahJudul), d: drafDariBib(e) }); continue; }
      const dBib = drafDariBib(e, { namaSaya: saya.nama });
      let w = null, catatan = '';
      if(dBib.centang && !batas){
        msg.textContent = `Mencari di OpenAlex ${i + 1}/${entri.length}…`;
        try{ w = pilihCocok(e, await cariJudul(e.title)); await new Promise(r => setTimeout(r, 150)); }
        catch(err){ if(err.batas) batas = err; }
      }
      if(!w) catatan = batas && dBib.centang ? 'DOI belum dicari: ' + teksBatas(batas) + ' Draf dibuat dari data Google Scholar.'
        : dBib.centang ? 'Tidak ditemukan di OpenAlex; dibuat dari data Google Scholar (tanpa DOI dan sitasi).'
        : 'Tidak dicentang bawaan (disertasi, data, atau tanpa tahun).';
      const doi = w?.doi ? rapiDoi(w.doi) : '';
      if(doi && dilihat.has('doi:' + doi)) continue;             // dua entri, satu artikel
      if(doi) dilihat.add('doi:' + doi);
      const sudah = (doi && ada.doi.get(doi)) || (w && ada.judul.get(judulRapi(w.title)));
      if(sudah){ calon.push({ ...sudahAda(e.title, sudah), d: dBib }); continue; }
      const d = w ? drafDari(w, { orcid: saya.orcid, hariIni }) : dBib;
      if(w && !d.penulis.dikenali) d.penulis = dBib.penulis;
      calon.push({ doi: doi || e.title, d, boleh: true, pilih: d.centang,
        ket: (w ? 'DOI ditemukan di OpenAlex.' : catatan) + (w && !d.centang ? ' Tidak dicentang bawaan.' : '') });
    }
    msg.className = batas ? 'msg err' : 'msg';
    msg.textContent = `${calon.filter(c => c.boleh).length} karya baru dari ${entri.length} entri.`
      + (batas ? ' ' + teksBatas(batas) + ' Sitasi bisa ditarik nanti dari formulir tiap draf.' : '');
    gambar();
  };
  document.getElementById('imp_cari').onclick = async () => {
    const dois = daftarDoi(document.getElementById('imp_doi').value);
    if(!dois.length){ msg.className = 'msg err'; msg.textContent = 'Tidak ada DOI yang dikenali.'; return; }
    msg.className = 'msg'; msg.textContent = `Mencari ${dois.length} DOI…`;
    const ada = await karyaAda();
    calon = [];
    for(const doi of dois){
      const sudah = ada.doi.get(doi);
      if(sudah){ calon.push(sudahAda(doi, sudah)); continue; }
      try{
        const w = await ambilDoi(doi);
        if(!w){ calon.push({ doi, boleh: false, ket: 'Tidak ditemukan di OpenAlex; isi manual di tab Publikasi.' }); continue; }
        const d = drafDari(w, { orcid: saya.orcid, hariIni });
        calon.push({ doi, d, boleh: true, pilih: d.centang,
          ket: (d.centang ? '' : `Jenis "${d.tipe || 'tanpa tahun'}" tidak dicentang bawaan. `)
            + (d.penulis.dikenali ? '' : 'ORCID Anda tidak tercantum di data ini; periksa bahwa ini karya Anda.') });
      }catch(e){
        calon.push({ doi, boleh: false, ket: e.batas ? teksBatas(e) : 'Gagal mengambil: ' + (e.message || e) });
        if(e.batas) break;                                       // DOI berikutnya pasti ditolak juga
      }
    }
    msg.textContent = '';
    gambar();
  };
  async function simpanDraf(){
    const pilih = calon.filter(c => c.boleh && c.pilih && c.d);
    if(!pilih.length){ msg.className = 'msg err'; msg.textContent = 'Belum ada yang dicentang.'; return; }
    msg.className = 'msg'; msg.textContent = 'Menyimpan draf…';
    let jadi = 0; const galat = [];
    for(const c of pilih){
      let { data: k, error } = await sb.from('karya').insert({ ...c.d.karya, dilaporkan_oleh: saya.id })
        .select('id').single();
      // Tanpa 44-patch-openalex-id.sql: simpan tanpa ID OpenAlex.
      if(error && /openalex_id/.test(error.message || '')){
        const { openalex_id, ...tanpa } = c.d.karya;
        ({ data: k, error } = await sb.from('karya').insert({ ...tanpa, dilaporkan_oleh: saya.id }).select('id').single());
      }
      if(error){ galat.push(`${c.doi}: ${error.code === '23505'
        ? 'DOI ini sudah dicatat dosen lain (mungkin masih draf). Minta rekan menambahkan Anda sebagai penulis.'
        : error.message}`); continue; }
      const { error: eP } = await sb.from('karya_penulis').insert({ karya_id: k.id, dosen_id: saya.id,
        peran: c.d.penulis.peran, korespondensi: c.d.penulis.korespondensi, ditambahkan_sendiri: false });
      if(eP){ await sb.from('karya').delete().eq('id', k.id); galat.push(`${c.doi}: ${eP.message}`); continue; }
      // Sitasi per tahun dari OpenAlex (42-patch-sitasi-tahunan.sql); gagal di sini tidak membatalkan draf.
      if(c.d.sitasi.length){
        const { error: eS } = await sb.from('karya_sitasi').insert(c.d.sitasi.map(r => ({ karya_id: k.id, ...r })));
        if(eS) galat.push(`${c.doi}: draf tersimpan, sitasi tidak (${eS.message})`);
      }
      jadi++; c.boleh = false; c.ket = 'Tersimpan sebagai draf.';
    }
    msg.className = galat.length ? 'msg err' : 'msg ok';
    msg.textContent = `${jadi} draf tersimpan.` + (galat.length ? ' Gagal: ' + galat.join(' · ') : '');
    gambar();
    muatKaryaSaya('dsaya', null);
  }
}

async function karyaProdi(){
  document.getElementById('isi').innerHTML = `<div class="panel">
    <h2>Karya prodi</h2>
    <p class="hint">Seluruh karya yang sudah masuk. Kalau Anda menemukan karya
    yang seharusnya mencantumkan nama Anda, daftarkan diri lewat tombol di sebelahnya.</p>
    <div class="fld" style="max-width:320px;margin-bottom:8px">
      <input type="search" id="cari" placeholder="Cari judul atau penulis"></div>
    <div id="dprodi" class="kosong">Memuat…</div></div>`;

  const { data } = await sb.from('karya')
    .select('*, karya_penulis(dosen_id, peran, korespondensi, dosen(nama))')
    .neq('status', 'draf')   // draf hanya di Karya saya (41-patch-draf-karya.sql)
    .order('tahun',{ascending:false}).limit(300);
  const semua = data || [];
  const admin = saya.peran === 'admin';
  if(admin) await muatBuktiUntuk(semua);

  const gambar = () => {
    const q = document.getElementById('cari').value.trim().toLowerCase();
    const d = semua.filter(k => !q ||
      (k.judul + ' ' + (k.karya_penulis||[]).map(p=>p.dosen?.nama).join(' '))
        .toLowerCase().includes(q));
    const box = document.getElementById('dprodi');
    if(!d.length){ box.className='kosong'; box.textContent='Tidak ada yang cocok.'; return; }
    box.className='';
    box.innerHTML = d.map(k=>{
      const sudah = (k.karya_penulis||[]).some(p=>p.dosen_id===saya.id);
      return barisKarya(k, sudah ? '' :
        `<button class="btn ghost sm" data-k="${k.id}" data-kat="${k.kategori}">Saya penulis</button>`,
        admin ? htmlDaftarBukti(k, true) : '');
    }).join('');
    box.querySelectorAll('[data-k]').forEach(b=>{
      b.onclick = async()=>{
        const opsi = b.dataset.kat === 'publikasi'
          ? 'penulis_pertama atau anggota'
          : 'ketua atau anggota';
        const p = prompt(`Posisi Anda pada karya ini (${opsi}):`, 'anggota');
        if(!p) return;
        const kor = b.dataset.kat === 'publikasi'
          && confirm('Apakah Anda juga penulis korespondensi pada karya ini?');
        const { error } = await sb.from('karya_penulis').insert({
          karya_id:b.dataset.k, dosen_id:saya.id, peran:p.trim(),
          korespondensi:kor, ditambahkan_sendiri:true });
        alert(error ? error.message : 'Terdaftar. Admin prodi akan meninjau penambahan ini.');
        if(!error) karyaProdi();
      };
    });
  };
  document.getElementById('cari').addEventListener('input', gambar);
  gambar();
}

// Hapus bukti karya oleh admin (Karya prodi): karya-tampil.js.
pasangHapusBuktiAdmin(sb, () => saya?.peran === 'admin');

sb.auth.onAuthStateChange(ev=>{ if(ev==='SIGNED_IN' && !saya) mulai(); });
mulai();
</script>
