      <span class="kb-m" id="kbm-${esc(k.id)}"></span></div>`}
  </details>`;
}

async function tambahBuktiKarya(k, muatUlang){
  const id = k.id, m = document.getElementById('kbm-' + id);
  const jenis = document.getElementById('kbj-' + id).value;
  const judul = document.getElementById('kbt-' + id).value.trim();
  const url = document.getElementById('kbu-' + id).value.trim();
  const fEl = document.getElementById('kbf-' + id);
  const berkas = fEl ? [...fEl.files] : [];
  const tulis = t => { m.textContent = t; };
  if(!berkas.length && !url) return tulis('Pilih berkas atau tempel tautan.');
  if(url && !/^https?:\/\/\S+$/i.test(url)) return tulis('Tautan harus https://...');
  const baris = [];
  try{
    if(berkas.length){
      const { data: { session } } = await sb.auth.getSession();
      if(!session) throw new Error('Sesi login habis. Muat ulang halaman.');
      for(let i = 0; i < berkas.length; i++){
        const f = berkas[i];
        tulis(`Memeriksa dan mengunggah ${i + 1}/${berkas.length}: ${f.name}...`);
        const nama = berkas.length > 1 || !judul ? (judul ? judul + ' — ' : '') + f.name : judul;
        // Berkas yang sama persis sudah tersimpan: pakai tautannya (31-patch-sidik-berkas.sql).
        const s = await periksaBerkas(sb, f);
        if(s.temuan){ baris.push({ karya_id: id, jenis, judul: nama, url: s.temuan.url, ...kolomSidik(s.sha256) }); continue; }
        // Folder Drive per karya: <tahun>/<nama dosen>/<judul karya>/ (Code.gs kind 'karya').
        const res = await fetch(window.UPLOAD_URL, { method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ token: session.access_token, kind: 'karya', year: k.tahun,
                                 group: k.judul, filename: f.name, data: await keB64(f) }) });
        const out = await res.json();
        if(!out.ok) throw new Error(out.error || 'Unggah gagal.');
        baris.push({ karya_id: id, jenis, judul: nama, url: out.url, ...kolomSidik(s.sha256) });
      }
    }
    if(url) baris.push({ karya_id: id, jenis, judul, url });
    const { error } = await sb.from('karya_bukti').insert(baris);
    if(error) throw new Error('Catatan bukti gagal disimpan: ' + error.message);
    muatUlang();
  }catch(e){ tulis(e.message || String(e)); }
}

async function muatKaryaSaya(wadahId, batas){
  const box = document.getElementById(wadahId);
  const { data:milik } = await sb.from('karya_penulis')
    .select('karya_id').eq('dosen_id', saya.id);
  const ids = (milik||[]).map(m=>m.karya_id);
  if(!ids.length){ box.className='kosong'; box.textContent='Belum ada entri.'; return; }

  let q = sb.from('karya').select('*, karya_penulis(peran, korespondensi, dosen(nama)), karya_mahasiswa(nim), karya_mitra(institusi)')
    .in('id', ids).order('dibuat_pada',{ascending:false});
  if(batas) q = q.limit(batas);
  const { data, error } = await q;
  if(error){ box.className='kosong'; box.textContent=error.message; return; }

  await muatBuktiUntuk(data);

  const semua = document.getElementById('salin-semua');
  if(semua){
    const ada = data.map(k => [k, daftarBuktiKarya(k)]).filter(([, xs]) => xs.length);
    semua.hidden = !ada.length;
    semua.dataset.salin = ada.map(([k, xs]) => `${k.tahun} — ${k.judul}\n` +
      xs.map(x => `${x.label}: ${x.url}`).join('\n')).join('\n\n');
    semua.textContent = `Salin semua tautan bukti (${ada.length} karya)`;
    pasangSalin(semua.parentElement);
  }

  box.className='';
  box.innerHTML = data.map(k => barisKarya(k, aksiUbah(k) + aksiHapus(k), panelBuktiKarya(k))).join('');
  pasangSalin(box);
  const muatUlang = () => muatKaryaSaya(wadahId, batas);
  box.querySelectorAll('[data-kb-tambah]').forEach(b => {
    b.onclick = () => { b.disabled = true;
      tambahBuktiKarya(data.find(k => k.id === b.dataset.kbTambah), muatUlang).finally(() => b.disabled = false); };
  });
  box.querySelectorAll('[data-kb-hapus]').forEach(b => {
    b.onclick = async () => {
      const admin = saya.peran === 'admin';
      if(!confirm('Hapus bukti ini? ' + (admin ? PESAN_SAMPAH : 'Berkas di Drive tidak dihapus.'))) return;
      try{
        if(admin) await buangBerkas(sb, b.dataset.url);
      }catch(err){ alert('Gagal membuang berkas: ' + (err.message || err)); return; }
      const { error } = await sb.from('karya_bukti').delete().eq('id', +b.dataset.kbHapus);
      if(error) alert('Gagal: ' + error.message); else muatUlang();
    };
  });
  box.querySelectorAll('[data-h]').forEach(b=>{
    b.onclick = async()=>{
      const k = (data || []).find(x => String(x.id) === String(b.dataset.h));
      const admin = saya.peran === 'admin';
      const urls = k ? berkasMilikKarya(k) : [];
      if(!confirm('Hapus entri ini?' + (admin && urls.length ? ` ${urls.length} berkas buktinya ikut dihapus. ${PESAN_SAMPAH}` : ''))) return;
      if(admin){
        try{ await buangSemua(sb, urls); }
        catch(err){ alert('Gagal membuang berkas: ' + (err.message || err)); return; }
      }
      const { error } = await sb.from('karya').delete().eq('id', b.dataset.h);
      if(error) alert('Gagal menghapus: ' + error.message);
      muatKaryaSaya(wadahId, batas);
    };
  });
  box.querySelectorAll('[data-ah]').forEach(b=>{
    b.onclick = async()=>{
      const alasan = prompt('Alasan mengajukan hapus karya ini (dibaca admin):');
      if(alasan === null) return;
      if(!alasan.trim()){ alert('Alasan wajib diisi.'); return; }
      const { error } = await sb.from('ajuan_hapus').insert({ karya_id: b.dataset.ah, alasan: alasan.trim() });
      if(error) alert('Gagal mengajukan: ' + error.message);
      muatKaryaSaya(wadahId, batas);
    };
  });
  box.querySelectorAll('[data-ab]').forEach(b=>{
    b.onclick = async()=>{
      if(!confirm('Batalkan ajuan hapus?')) return;
      const { error } = await sb.from('ajuan_hapus').delete().eq('karya_id', b.dataset.ab);
      if(error) alert('Gagal membatalkan: ' + error.message);
      muatKaryaSaya(wadahId, batas);
    };
  });
  // Ubah langsung / ajukan perubahan / batalkan / tutup ajuan ditolak.
  box.querySelectorAll('[data-ubah]').forEach(b => { b.onclick = () => bukaUbah(b.dataset.ubah, 'langsung'); });
  box.querySelectorAll('[data-aju]').forEach(b => { b.onclick = () => bukaUbah(b.dataset.aju, 'ajuan'); });
  box.querySelectorAll('[data-ub]').forEach(b => {
    b.onclick = async () => {
      if(!confirm('Batalkan ajuan perubahan?')) return;
      const { error } = await sb.from('ajuan_ubah').delete().eq('id', +b.dataset.ub);
      if(error) alert('Gagal membatalkan: ' + error.message);
      muatKaryaSaya(wadahId, batas);
    };
  });
  box.querySelectorAll('[data-ut]').forEach(b => {
    b.onclick = async () => {
      if(!confirm('Alasan admin menolak perubahan:\n\n' + b.dataset.alasan
        + '\n\nTutup pemberitahuan ini? Setelah itu Anda bisa mengajukan perubahan lagi.')) return;
      const { error } = await sb.from('ajuan_ubah').delete().eq('id', +b.dataset.ut);
      if(error) alert('Gagal: ' + error.message);
      muatKaryaSaya(wadahId, batas);
    };
  });
}

// Tombol hapus per karya (keputusan pemilik 2026-11-03):
//   belum terverifikasi + dilaporkan sendiri -> Hapus langsung;
//   terverifikasi -> Ajukan hapus (alasan), admin memutuskan di Verifikasi;
//   sudah diajukan -> tanda menunggu + Batalkan (bagi pengajunya).
function aksiHapus(k){
  if(k.status !== 'terverifikasi')
    return k.dilaporkan_oleh === saya.id
      ? `<button class="btn danger sm" data-h="${k.id}">Hapus</button>` : '';
  if(AJUAN_GAGAL) return '';
  const a = AJUAN.get(k.id);
  if(a) return `<span class="tag" style="background:#FFF3D6;color:#7A5A00" title="Alasan: ${esc(a.alasan)}">menunggu persetujuan hapus</span>`
    + (a.oleh === saya.id ? `<button class="btn ghost sm" data-ab="${k.id}">Batalkan ajuan</button>` : '');
  return `<button class="btn ghost sm" data-ah="${k.id}" title="Karya terverifikasi hanya bisa dihapus setelah disetujui admin">Ajukan hapus</button>`;
}

function karyaSaya(){
  document.getElementById('isi').innerHTML = `<div class="panel">
    <h2>Karya saya</h2>
    <p class="hint">Semua karya yang mencantumkan Anda sebagai penulis.
    Entri yang Anda laporkan dan belum terverifikasi bisa diubah langsung;
    selebihnya lewat <b>Ajukan perubahan</b> yang disetujui admin. Tautan bukti di bawah
    tiap karya bisa disalin dan ditempel ke SISTER/BKD; tautan folder membuka
    semua berkas di dalamnya.</p>
    <p><button type="button" class="btn ghost sm" id="salin-semua" hidden></button></p>
    <div id="dsaya" class="kosong">Memuat…</div></div>`;
  muatKaryaSaya('dsaya', null);
}

async function karyaProdi(){
  document.getElementById('isi').innerHTML = `<div class="panel">
    <h2>Karya prodi</h2>
    <p class="hint">Seluruh karya yang sudah masuk. Kalau Anda menemukan karya
    yang seharusnya mencantumkan nama Anda, daftarkan diri lewat tombol di sebelahnya.</p>
    <div class="fld" style="max-width:320px;margin-bottom:8px">
      <input type="search" id="cari" placeholder="Cari judul atau penulis"></div>
    <div id="dprodi" class="kosong">Memuat…</div></div>`;

  const { data } = await sb.from('karya')
    .select('*, karya_penulis(dosen_id, peran, korespondensi, dosen(nama))')
    .order('tahun',{ascending:false}).limit(300);
  const semua = data || [];
  const admin = saya.peran === 'admin';
  if(admin) await muatBuktiUntuk(semua);

  const gambar = () => {
    const q = document.getElementById('cari').value.trim().toLowerCase();
    const d = semua.filter(k => !q ||
      (k.judul + ' ' + (k.karya_penulis||[]).map(p=>p.dosen?.nama).join(' '))
        .toLowerCase().includes(q));
    const box = document.getElementById('dprodi');
    if(!d.length){ box.className='kosong'; box.textContent='Tidak ada yang cocok.'; return; }
    box.className='';
    box.innerHTML = d.map(k=>{
      const sudah = (k.karya_penulis||[]).some(p=>p.dosen_id===saya.id);
      return barisKarya(k, sudah ? '' :
        `<button class="btn ghost sm" data-k="${k.id}" data-kat="${k.kategori}">Saya penulis</button>`,
        admin ? htmlDaftarBukti(k, true) : '');
    }).join('');
    box.querySelectorAll('[data-k]').forEach(b=>{
      b.onclick = async()=>{
        const opsi = b.dataset.kat === 'publikasi'
          ? 'penulis_pertama atau anggota'
          : 'ketua atau anggota';
        const p = prompt(`Posisi Anda pada karya ini (${opsi}):`, 'anggota');
        if(!p) return;
        const kor = b.dataset.kat === 'publikasi'
          && confirm('Apakah Anda juga penulis korespondensi pada karya ini?');
        const { error } = await sb.from('karya_penulis').insert({
          karya_id:b.dataset.k, dosen_id:saya.id, peran:p.trim(),
          korespondensi:kor, ditambahkan_sendiri:true });
        alert(error ? error.message : 'Terdaftar. Admin prodi akan meninjau penambahan ini.');
        if(!error) karyaProdi();
      };
    });
  };
  document.getElementById('cari').addEventListener('input', gambar);
  gambar();
}

// Panel "Ajuan hapus karya" di tab Verifikasi (admin).
async function muatAjuanHapus(){
  const box = document.getElementById('ah');
  if(!box) return;
  const { data: aj, error } = await sb.from('ajuan_hapus')
    .select('id,karya_id,alasan,oleh,dibuat').order('dibuat');
  if(error){ box.className='kosong'; box.textContent = 'Tabel ajuan_hapus belum bisa dibaca (' + error.message
    + '). Jalankan supabase/15-patch-ajuan-hapus.sql.'; return; }
  if(!aj?.length){ box.className='kosong'; box.textContent='Tidak ada ajuan hapus.'; return; }
  const { data: ks } = await sb.from('karya')
    .select('*, karya_penulis(peran, korespondensi, dosen(nama)), karya_mahasiswa(nim), karya_mitra(institusi)')
    .in('id', aj.map(a => a.karya_id));
  const perId = new Map((ks || []).map(k => [k.id, k]));
  await muatBuktiUntuk(ks || []);
  const nama = id => (dosenList.find(d => d.id === id) || {}).nama || 'dosen';
  box.className='';
  box.innerHTML = aj.filter(a => perId.has(a.karya_id)).map(a => {
    const k = perId.get(a.karya_id);
    return barisKarya(k,
      `<button class="btn danger sm" data-sh="${k.id}">Setujui hapus</button>
       <button class="btn ghost sm" data-th="${k.id}">Tolak</button>`,
      `<div class="rec-m"><span>Diajukan ${esc(nama(a.oleh))}, ${esc(String(a.dibuat).slice(0, 10))}:
        ${esc(a.alasan)}</span></div>` + htmlDaftarBukti(k, true));
  }).join('');
  box.querySelectorAll('[data-sh]').forEach(b => {
    b.onclick = async () => {
      const k = perId.get(b.dataset.sh);
      const urls = berkasMilikKarya(k);
      if(!confirm(`Hapus permanen karya "${k.judul}"? Penulis, bukti, dan ajuannya ikut terhapus` +
        (urls.length ? `; ${urls.length} berkas buktinya dipindah ke Sampah Drive (bisa dipulihkan 30 hari).` : '.'))) return;
      try{ await buangSemua(sb, urls); }
      catch(err){ alert('Gagal membuang berkas: ' + (err.message || err)); return; }
      const { error: e } = await sb.from('karya').delete().eq('id', k.id);
      if(e) alert('Gagal menghapus: ' + e.message);
      muatAjuanHapus();
    };
  });
  box.querySelectorAll('[data-th]').forEach(b => {
    b.onclick = async () => {
      const k = perId.get(b.dataset.th);
      const c = prompt('Alasan penolakan (akan dilihat dosen di catatan karya):');
      if(c === null) return;
      const { error: e1 } = await sb.from('karya')
        .update({ catatan: 'Ajuan hapus ditolak: ' + (c.trim() || '-') }).eq('id', k.id);
      const { error: e2 } = await sb.from('ajuan_hapus').delete().eq('karya_id', k.id);
      if(e1 || e2) alert('Gagal: ' + (e1 || e2).message);
      muatAjuanHapus();
    };
  });
}

// ---------------------------------------------------------------------
//  Verifikasi (admin)
// ---------------------------------------------------------------------
async function tampilVerifikasi(){
  document.getElementById('isi').innerHTML = `
    <div class="panel"><h2>Menunggu verifikasi</h2>
      <p class="hint">Buka tautan bukti dan pastikan dapat diakses sebelum memverifikasi. Entri tanpa bukti sebaiknya dikembalikan ke dosennya.</p>
      <div id="vf" class="kosong">Memuat…</div></div>
    <div class="panel"><h2>Ajuan hapus karya</h2>
      <p class="hint">Karya terverifikasi yang diajukan dosen untuk dihapus.
      Setujui = karya dihapus beserta penulis dan buktinya (berkas di Drive
      tetap). Tolak = karya tetap, alasan penolakan ditulis di catatan karya.</p>
      <div id="ah" class="kosong">Memuat…</div></div>
    <div class="panel"><h2>Ajuan perubahan karya</h2>
      <p class="hint">Perubahan yang diajukan dosen pada karya terverifikasi (atau
      oleh penulis yang bukan pelapor). Setujui = kolom "Baru" diterapkan, status
      karya tetap. Tolak = data tetap, alasan penolakan dilihat pengajunya.</p>
      <div id="au" class="kosong">Memuat…</div></div>
    <div class="panel"><h2>Klaim penulis untuk ditinjau</h2>
      <p class="hint">Dosen yang mendaftarkan dirinya sendiri pada karya yang
      diinput orang lain. Hapus bila keliru.</p>
      <div id="kl" class="kosong">Memuat…</div></div>`;

  const [{ data }, { data: kataVisi }] = await Promise.all([
    sb.from('karya')
      .select('*, karya_penulis(peran, korespondensi, dosen(nama)), karya_mahasiswa(nim), karya_mitra(institusi)')
      .eq('status','diajukan').order('dibuat_pada'),
    sb.from('ref_kata_visi').select('kata'),
  ]);
  // Kata kunci hanya MENYOROT kandidat tidak relevan; keputusannya tetap
  // pada centang admin. Daftar kosong = tidak ada sorotan.
  const kunciVisi = (kataVisi || []).map(x => x.kata.toLowerCase());
  const mungkinLuar = k => kunciVisi.length
    && !kunciVisi.some(w => (k.judul || '').toLowerCase().includes(w));
  const box = document.getElementById('vf');
  if(!data?.length){ box.className='kosong'; box.textContent='Tidak ada entri yang menunggu.'; }
  else {
    // Semua bukti: isian awal, karya_bukti, dan bukti penelitian/PkM induk.
    await muatBuktiUntuk(data);
    box.className='';
    box.innerHTML = data.map(k=>barisKarya(k,
      `<label class="cek" style="margin-right:6px" title="Karya mendukung visi keilmuan prodi. Hilangkan centang bila di luar bidang — karya tetap tampil di profil dosen, hanya tidak dihitung pada butir akreditasi prodi.">
         <input type="checkbox" data-r="${k.id}" ${k.relevan_visi === false ? '' : 'checked'}>
         sesuai visi</label>
       ${mungkinLuar(k) ? '<span class="tag" style="background:#FFF3D6;color:#7A5A00" title="Judul tidak memuat satu pun kata kunci visi keilmuan — periksa relevansinya.">periksa relevansi</span>' : ''}
       ${k.bukti_path
          ? `<button class="btn ghost sm" data-f="${k.bukti_path}">Bukti lama</button>`
          : (daftarBuktiKarya(k).length ? '' : '<span class="tag">tanpa bukti</span>')}
       <button class="btn sm" data-v="${k.id}">Verifikasi</button>
       <button class="btn danger sm" data-x="${k.id}">Tolak</button>`,
      htmlDaftarBukti(k, true))).join('');

    // Entri lama masih menyimpan berkasnya di bucket Supabase.
    box.querySelectorAll('[data-f]').forEach(b=>{
      b.onclick = async()=>{
        const { data:s } = await sb.storage.from('bukti').createSignedUrl(b.dataset.f, 300);
        if(s?.signedUrl) window.open(s.signedUrl,'_blank','noopener');
      };
    });
    const ubah = async(id, status)=>{
      const patch = { status };
      const cek = box.querySelector(`[data-r="${id}"]`);
      if(cek) patch.relevan_visi = cek.checked;
      if(status==='ditolak'){
        const c = prompt('Alasan penolakan (akan dilihat dosen):');
        if(c===null) return;
        patch.catatan = c;
      }
      await sb.from('karya').update(patch).eq('id', id);
      tampilVerifikasi();
    };
    box.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>ubah(b.dataset.v,'terverifikasi'));
    box.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>ubah(b.dataset.x,'ditolak'));
  }

  await muatAjuanHapus();
  await muatAjuanUbahKarya();

  const { data:klaim } = await sb.from('karya_penulis')
    .select('karya_id, dosen_id, peran, korespondensi, ditambahkan_pada, dosen(nama), karya(judul,tahun)')
    .eq('ditambahkan_sendiri', true).order('ditambahkan_pada',{ascending:false});
  const kb = document.getElementById('kl');
  if(!klaim?.length){ kb.className='kosong'; kb.textContent='Belum ada klaim.'; return; }
  kb.className='';
  kb.innerHTML = klaim.map(c=>`<div class="rec" data-s="diajukan">
    <div class="spine"></div>
    <div class="rec-b">
      <div class="rec-j">${esc(c.dosen?.nama||'')} — ${esc(rapi(c.peran))}${
      c.korespondensi ? ', korespondensi' : ''}</div>
      <div class="rec-m"><span>${esc(c.karya?.judul||'')}</span>
        <span>${c.karya?.tahun||''}</span></div>
    </div>
    <div class="rec-a">
      <button class="btn danger sm" data-d="${c.karya_id}|${c.dosen_id}">Hapus klaim</button>
    </div></div>`).join('');
  kb.querySelectorAll('[data-d]').forEach(b=>{
    b.onclick = async()=>{
      if(!confirm('Hapus klaim penulis ini?')) return;
      const [ki,di] = b.dataset.d.split('|');
      await sb.from('karya_penulis').delete().eq('karya_id',ki).eq('dosen_id',di);
      tampilVerifikasi();
    };
  });
}

// Hapus bukti karya oleh admin (Verifikasi, Ajuan hapus, Karya prodi):
// buang berkas ke Sampah Drive dulu, lalu hapus catatannya; bukti isian
// awal (karya.bukti_url) dikosongkan.
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-adm-hapus]');
  if(!b || !saya || saya.peran !== 'admin') return;
  if(!confirm('Hapus bukti ini? ' + PESAN_SAMPAH)) return;
  b.disabled = true;
  try{
    await buangBerkas(sb, b.dataset.url);
    const { error } = b.dataset.lama
      ? await sb.from('karya').update({ bukti_url: null }).eq('id', b.dataset.lama)
      : await sb.from('karya_bukti').delete().eq('id', +b.dataset.id);
    if(error) throw error;
    const li = b.closest('li');
    if(li) li.remove();
  }catch(err){
    alert('Gagal menghapus: ' + (err.message || err));
    b.disabled = false;
  }
});

sb.auth.onAuthStateChange(ev=>{ if(ev==='SIGNED_IN' && !saya) mulai(); });
mulai();
</script>
