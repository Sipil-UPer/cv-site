<title>Insentif publikasi — Ruang kerja</title>

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@500;600&display=swap" rel="stylesheet">

<style>
  /* Dasar halaman ruang kerja (sama dengan halaman lain) */
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
  .wrap{max-width:1200px;margin:0 auto;padding:18px 20px 80px}
  a{color:var(--biru-2)}
  /* Insentif publikasi (163, pemilik 2026-11-24) */
  .kartu{background:#fff;border:1px solid var(--line);padding:14px 16px;margin:12px 0}
  h2{font-size:17px;margin:20px 0 6px;color:var(--biru)}
  .ket{font-size:13px;color:var(--muted)}
  table.t{border-collapse:collapse;width:100%;font-size:13px}
  table.t th,table.t td{border-bottom:1px solid var(--line-soft,#e5e7eb);padding:6px 7px;text-align:left;vertical-align:top}
  table.t th{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
  .st{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:9px;border:1px solid currentColor;white-space:nowrap}
  .st.biru{color:var(--biru-2)} .st.kuning{color:#8A5A00} .st.hijau{color:var(--hijau)} .st.merah{color:var(--merah)}
  .berkas a,.berkas span{display:inline-block;margin-right:8px;font-size:12px;white-space:nowrap}
  .berkas .kurang{color:var(--merah)}
  button.b{font:inherit;font-size:12.5px;padding:4px 10px;border:1px solid var(--biru);background:#fff;color:var(--biru);cursor:pointer;margin:2px 4px 2px 0}
  button.b.utama{background:var(--biru);color:#fff}
  button:disabled{opacity:.5;cursor:default}
  .msg{font-size:12.5px;margin-left:6px} .msg.ok{color:var(--hijau)} .msg.buruk{color:var(--merah)}
  .gulir{overflow-x:auto}
  .kosong{color:var(--muted);font-size:13.5px;padding:8px 0}
  input.judul{font:inherit;font-size:13.5px;padding:6px 8px;border:1px solid var(--line);min-width:320px}
</style>
</head>
<body>
<div class="hero" role="region" aria-label="Pembuka halaman"><div class="hero-in">
  <div class="hero-inst" data-identitas></div>
  <h1>Insentif publikasi</h1>
  <div class="sub" id="hSub">Memuat…</div>
</div></div>
<main class="wrap" id="isi"><p class="kosong">Memuat…</p></main>
<script src="config.js?v=2026-11-27-b8300c"></script>
<script>
// Galat saat memuat skrip ditampilkan sebagai pesan, bukan halaman kosong.
addEventListener('error', function (e) {
  if (document.getElementById('galat-muat')) return;
  var d = document.createElement('div');
  d.id = 'galat-muat';
  d.style.cssText = 'margin:16px;padding:12px 14px;border:1px solid var(--merah);' +
    'background:var(--merah-m3);color:var(--ink);font:14px/1.5 system-ui,sans-serif';
  d.textContent = 'Halaman gagal dimuat: ' + (e.message || 'galat skrip') +
    '. Tekan Ctrl+Shift+R untuk memuat ulang tanpa cache; bila tetap muncul, kirim pesan ini ke admin.';
  document.body.insertBefore(d, document.body.firstChild);
});
</script>
<script type="module">
// Insentif publikasi (163-patch-insentif-publikasi.sql, pemilik 2026-11-24). Dosen: klaim miliknya (klaim dibuat di Karya saya).
// Admin prodi atau Kaprodi aktif: periksa (siap / kembalikan), kumpulkan klaim siap menjadi pengajuan ke fakultas (rekap Excel
// umum; format fakultas menyusul), catat hasilnya (disetujui / ditolak / cair / tarik kembali). Semua perubahan lewat fungsi
// insentif_* di basis data; halaman ini hanya menampilkan.
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/+esm';
import { gerbang } from './menu.js?v=2026-11-27-b8300c';
import { BERKAS_INSENTIF, STATUS_INSENTIF, berkasKurang, langkahPengklaim, barisExcel, labelBerkas } from './insentif.js?v=2026-11-27-b8300c';
import { urlPublikasi, aTautan } from './tautan-publikasi.js?v=2026-11-27-b8300c';
import { SHEETJS } from './nilai-cpl.js?v=2026-11-27-b8300c';

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sb = createClient(window.SB_URL, window.SB_KEY);
const baca = q => q.then(r => ({ data: r.error ? [] : (r.data || []), error: r.error }), e => ({ data: [], error: e }));
const WARNA = { diklaim: 'biru', dikembalikan: 'kuning', siap: 'biru', diajukan: 'biru', disetujui: 'hijau', cair: 'hijau', ditolak: 'merah' };
const lencana = s => `<span class="st ${WARNA[s] || ''}">${esc(STATUS_INSENTIF[s] || s)}</span>`;

let SAYA = null, PENGELOLA = false, KLAIM = [], KARYA = new Map(), BUKTI = new Map(), DOSEN = new Map(), PENGAJUAN = [], PESAN = '';

async function muat(){
  const k = await baca(sb.from('insentif_publikasi').select('*').order('diklaim_pada', { ascending: false }));
  if (k.error && /insentif_publikasi/.test(k.error.message || '')) throw new Error('Patch 163 belum dijalankan admin prodi.');
  KLAIM = k.data;
  const ids = [...new Set(KLAIM.map(x => x.karya_id))];
  const [ka, bk, ds, pj] = await Promise.all([
    ids.length ? baca(sb.from('karya').select('id,judul,tahun,status,nama_terbitan,volume,nomor,halaman,indeksasi,doi,url,karya_penulis(dosen(nama))').in('id', ids)) : { data: [] },
    ids.length ? baca(sb.from('karya_bukti').select('id,karya_id,jenis,judul,url').in('karya_id', ids)) : { data: [] },
    baca(sb.from('dosen').select('id,nama,nidn')),
    baca(sb.from('insentif_pengajuan').select('*').order('tanggal', { ascending: false }))]);
  KARYA = new Map(ka.data.map(x => [x.id, { ...x, penulis: (x.karya_penulis || []).map(p => p.dosen?.nama).filter(Boolean) }]));
  BUKTI = new Map();
  for (const b of bk.data) { if (!BUKTI.has(b.karya_id)) BUKTI.set(b.karya_id, []); BUKTI.get(b.karya_id).push(b); }
  DOSEN = new Map(ds.data.map(d => [d.id, d]));
  PENGAJUAN = pj.data;
}

// Satu baris klaim: publikasi, pengklaim, berkas (tautan per jenis), status publikasi, status klaim.
function sel(k, aksi = ''){
  const p = KARYA.get(k.karya_id) || {}, bs = BUKTI.get(k.karya_id) || [], kurang = berkasKurang(bs);
  const berkas = BERKAS_INSENTIF.map(([j, l]) => { const b = bs.find(x => x.jenis === j);
    return b ? `<a href="${esc(b.url)}" target="_blank" rel="noopener">✓ ${esc(l)}</a>` : `<span class="kurang">✗ ${esc(l)}</span>`; }).join('');
  return `<tr><td>${aksi.includes('data-pilih') ? aksi.split('|')[0] : ''}${aTautan(urlPublikasi(p), p.judul || 'Publikasi')}
      <div class="ket">${esc([p.nama_terbitan, p.tahun, p.indeksasi].filter(Boolean).join(' · '))}${p.penulis?.length ? '<br>' + esc(p.penulis.join(', ')) : ''}</div></td>
    <td>${esc(DOSEN.get(k.pengklaim_id)?.nama || '')}</td>
    <td class="berkas">${berkas}</td>
    <td>${p.status === 'terverifikasi' ? '<span class="st hijau">terverifikasi</span>' : `<span class="st kuning">${esc(p.status || '?')}</span>`}</td>
    <td>${lencana(k.status)}${k.catatan ? `<div class="ket">${esc(k.catatan)}</div>` : ''}${kurang.length ? `<div class="ket">kurang ${kurang.length} berkas</div>` : ''}</td>
    <td>${aksi.includes('data-pilih') ? aksi.split('|')[1] || '' : aksi}</td></tr>`;
}
const tabel = (xs, aksi = () => '', kepala = '') => xs.length ? `<div class="gulir"><table class="t"><thead><tr><th>${kepala}Publikasi</th><th>Pengklaim</th>
  <th>Berkas</th><th>Publikasi</th><th>Klaim</th><th></th></tr></thead><tbody>${xs.map(k => sel(k, aksi(k))).join('')}</tbody></table></div>` : '<p class="kosong">Tidak ada.</p>';

function gambar(){
  const milik = KLAIM.filter(k => k.pengklaim_id === SAYA.id);
  const periksa = KLAIM.filter(k => ['diklaim', 'dikembalikan'].includes(k.status));
  const siap = KLAIM.filter(k => k.status === 'siap');
  $('isi').innerHTML = `
    <p class="ket">Klaim dibuat di <a href="karya.html">Karya saya</a> pada publikasi terbit tahun ini (centang <b>Klaim insentif</b> saat menyimpan, atau
      tombol di bawah publikasinya). Satu klaim per publikasi. Berkas wajib diunggah sebagai bukti karya: ${BERKAS_INSENTIF.map(b => b[1]).join(', ')}.
      Admin prodi atau Kaprodi memeriksa, lalu mengajukan ke fakultas.</p>
    ${PESAN ? `<p class="msg ok">${esc(PESAN)}</p>` : ''}
    <h2>Klaim saya</h2>
    ${milik.length ? `<div class="gulir"><table class="t"><thead><tr><th>Publikasi</th><th>Status</th><th>Langkah berikut</th></tr></thead><tbody>
      ${milik.map(k => { const p = KARYA.get(k.karya_id) || {}; return `<tr><td>${aTautan(urlPublikasi(p), p.judul || 'Publikasi')}</td><td>${lencana(k.status)}</td>
        <td class="ket">${esc(langkahPengklaim(k, p, BUKTI.get(k.karya_id) || []) || '—')}</td></tr>`; }).join('')}</tbody></table></div>`
      : '<p class="kosong">Belum ada klaim. Klaim dibuat di Karya saya.</p>'}
    ${PENGELOLA ? `
    <h2>Perlu diperiksa (${periksa.length})</h2>
    <p class="ket"><b>Tandai siap</b> hanya bisa bila publikasinya terverifikasi dan keempat berkas ada. <b>Kembalikan</b> wajib dengan catatan untuk dosen.</p>
    ${tabel(periksa, k => k.status === 'diklaim' ? `<button class="b utama" data-siap="${k.id}">Tandai siap</button><button class="b" data-kembali="${k.id}">Kembalikan</button>` : '<span class="ket">menunggu dosen</span>')}
    <h2>Siap diajukan ke fakultas (${siap.length})</h2>
    ${siap.length ? `<p><input class="judul" id="judulAju" value="Pengajuan insentif publikasi ${esc(new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' }))}">
      <button class="b utama" id="ajukan">Buat pengajuan dari yang dicentang</button><span class="msg" id="mAju"></span></p>` : ''}
    ${tabel(siap, k => `<input type="checkbox" data-pilih="${k.id}" checked> |<button class="b" data-kembali="${k.id}">Kembalikan</button>`)}
    <h2>Pengajuan ke fakultas (${PENGAJUAN.length})</h2>
    ${PENGAJUAN.length ? PENGAJUAN.map(pj => { const xs = KLAIM.filter(k => k.pengajuan_id === pj.id);
      return `<div class="kartu"><b>${esc(pj.judul)}</b> <span class="ket">· ${esc(pj.tanggal)} · ${xs.length} klaim</span>
        <button class="b" data-unduh="${pj.id}">Unduh Excel</button>
        ${tabel(xs, k => k.status === 'diajukan' ? `<button class="b" data-hasil="${k.id}" data-st="disetujui">Disetujui</button><button class="b" data-hasil="${k.id}" data-st="ditolak">Ditolak</button><button class="b" data-hasil="${k.id}" data-st="siap">Tarik kembali</button>`
          : k.status === 'disetujui' ? `<button class="b" data-hasil="${k.id}" data-st="cair">Cair</button>` : '')}</div>`; }).join('') : '<p class="kosong">Belum ada pengajuan.</p>'}` : ''}`;

  // Pesan basis data memakai kode berkas (naskah, indeksasi, loa, pernyataan): ditampilkan dengan nama berkasnya.
  const ramah = m => String(m || '').replace(/\b(naskah|indeksasi|loa|pernyataan)\b/g, j => labelBerkas(j));
  const jalan = async (tombol, f) => { tombol.disabled = true; const { error } = await f(); if (error) { tombol.disabled = false; alert(ramah(error.message)); return; } PESAN = ''; await muat(); gambar(); };
  document.querySelectorAll('[data-siap]').forEach(b => { b.onclick = () => jalan(b, () => sb.rpc('insentif_periksa', { p_id: +b.dataset.siap, p_status: 'siap', p_catatan: null })); });
  document.querySelectorAll('[data-kembali]').forEach(b => { b.onclick = () => {
    const c = (prompt('Catatan untuk dosen (wajib): apa yang perlu diperbaiki?') || '').trim();
    if (c) jalan(b, () => sb.rpc('insentif_periksa', { p_id: +b.dataset.kembali, p_status: 'dikembalikan', p_catatan: c })); }; });
  document.querySelectorAll('[data-hasil]').forEach(b => { b.onclick = () => {
    if (!confirm(`Catat "${b.textContent}" untuk klaim ini?`)) return;
    jalan(b, () => sb.rpc('insentif_hasil', { p_ids: [+b.dataset.hasil], p_status: b.dataset.st, p_catatan: null })); }; });
  document.querySelectorAll('[data-unduh]').forEach(b => { b.onclick = () => unduh(+b.dataset.unduh); });
  if ($('ajukan')) $('ajukan').onclick = async () => {
    const ids = [...document.querySelectorAll('[data-pilih]:checked')].map(c => +c.dataset.pilih), judul = $('judulAju').value.trim();
    if (!ids.length || judul.length < 3) { $('mAju').className = 'msg buruk'; $('mAju').textContent = 'Centang klaim dan isi judul pengajuan.'; return; }
    $('ajukan').disabled = true;
    const { data: pid, error } = await sb.rpc('insentif_ajukan', { p_judul: judul, p_ids: ids, p_catatan: null });
    if (error) { $('ajukan').disabled = false; $('mAju').className = 'msg buruk'; $('mAju').textContent = error.message; return; }
    await muat(); PESAN = `Pengajuan dibuat (${ids.length} klaim); rekap Excel diunduh.`; gambar(); unduh(pid);
  };
}

async function unduh(pid){
  const pj = PENGAJUAN.find(x => x.id === pid), xs = KLAIM.filter(k => k.pengajuan_id === pid);
  const X = await import(SHEETJS);
  const ws = X.utils.aoa_to_sheet(barisExcel(xs, KARYA, BUKTI, DOSEN));
  const wb = X.utils.book_new(); X.utils.book_append_sheet(wb, ws, 'Insentif');
  X.writeFile(wb, `insentif-publikasi-${(pj?.tanggal || 'pengajuan')}-${pid}.xlsx`);
}

async function mulai(){
  SAYA = await gerbang(sb);
  if (!SAYA) return;
  PENGELOLA = SAYA.peran === 'admin' || (SAYA.koordinator || []).includes('kaprodi');
  $('hSub').textContent = `Masuk sebagai ${SAYA.nama}${PENGELOLA ? ' · pemeriksa' : ''}`;
  await muat();
  gambar();
}
mulai().catch(e => { $('isi').innerHTML = `<p class="kosong">${esc(e.message)}</p>`; });
</script>
</body>
