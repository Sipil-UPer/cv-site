<style>
  /* Jadwal berhalangan dosen (132-patch-jadwal-berhalangan.sql, pemilik 2026-11-20) */
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
  .wrap{max-width:1400px;margin:0 auto;padding:18px 20px 80px}
  .kosong, .ket{color:var(--muted)}
  .ket{font-size:13px}
  .kartu{background:var(--panel);border:1px solid var(--line);padding:14px 18px;margin-bottom:16px}
  .kartu h2{font-size:17px;margin:0 0 6px;color:var(--biru)}
  .kartu h3{font-size:14.5px;margin:14px 0 6px}
  .alat{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0}
  select, input[type=text], input[type=date], input[type=time], input[type=search]{font:inherit;font-size:14px;padding:4px 6px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
  .b{font:inherit;font-size:14px;padding:5px 12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
  .b.utama{background:var(--biru);border-color:var(--biru);color:#fff}
  .b.bahaya{color:var(--merah);border-color:var(--merah)}
  .gulir{overflow-x:auto}
  table.ds{border-collapse:collapse;font-size:13.5px;width:100%}
  table.ds th{text-align:left;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);padding:5px 6px;vertical-align:bottom}
  table.ds td{padding:5px 6px;border-bottom:1px solid var(--line-soft);vertical-align:top}
  table.kisi{border-collapse:collapse;font-size:13px;min-width:100%}
  table.kisi th, table.kisi td{border:1px solid var(--line);padding:4px 6px;text-align:center;vertical-align:middle}
  table.kisi th{background:var(--kertas, transparent);font-weight:600}
  table.kisi th.slot{text-align:left;white-space:nowrap}
  table.kisi td.sel{min-width:96px;height:38px}
  table.kisi button.sel{width:100%;min-height:34px;font:inherit;font-size:12px;border:0;background:transparent;color:var(--ink);cursor:pointer}
  table.kisi td.halang, table.kisi td.halang button{background:rgba(200,60,50,.16)}
  table.kisi td.bisa{background:rgba(40,140,80,.14)}
  table.kisi td.sebagian{background:rgba(200,140,0,.14)}
  .nama{display:block;font-size:11.5px;line-height:1.3;text-align:left}
  .tab{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
  .tab button{font:inherit;font-size:14px;padding:6px 12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
  .tab button[aria-pressed=true]{border-color:var(--ink);box-shadow:inset 0 -3px 0 var(--merah)}
  .pilih-dosen{max-height:260px;overflow:auto;border:1px solid var(--line);padding:6px 8px;columns:2 260px}
  .pilih-dosen label{display:block;font-size:13.5px;break-inside:avoid}
  /* Kalender bertanggal (pemilik 2026-11-21): seret untuk blok; touch-action none supaya seret jari tidak menggulir. */
  table.kal{border-collapse:collapse;font-size:12px;min-width:100%;touch-action:none;user-select:none}
  table.kal th, table.kal td{border:1px solid var(--line);padding:0 4px;vertical-align:top}
  table.kal th{font-weight:600;padding:4px;text-align:center;white-space:nowrap}
  table.kal th.jam{text-align:right;font-family:var(--mono);font-weight:400;color:var(--muted);width:52px}
  table.kal td{min-width:110px;height:22px;cursor:crosshair}
  table.kal td.lalu{background:repeating-linear-gradient(45deg,transparent 0 6px,rgba(0,0,0,.04) 6px 12px);cursor:not-allowed}
  table.kal td.blok{background:rgba(200,60,50,.20);cursor:pointer}
  table.kal td.tanggal{background:rgba(200,140,0,.22);cursor:pointer}
  table.kal td.mingguan{background:rgba(110,110,110,.18);cursor:pointer}
  table.kal td.pilih{background:rgba(30,90,200,.30)}
  table.kal td .judul{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px;font-size:11.5px;line-height:21px}
  table.kal th.hari-ini{box-shadow:inset 0 -3px 0 var(--merah)}
  table.kal th.libur{color:#9E3A26} table.kal th .nama-libur{display:block;font-size:10.5px;font-weight:400;white-space:normal}
  table.kal td.libur:not([data-ada]){background:#FBF1EE}   /* hari libur (139) */
  .legenda{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:6px 0}
  .legenda span::before{content:'';display:inline-block;width:12px;height:12px;margin-right:4px;vertical-align:-2px;border:1px solid var(--line)}
  .legenda .l-blok::before{background:rgba(200,60,50,.20)} .legenda .l-tgl::before{background:rgba(200,140,0,.22)}
  .legenda .l-mg::before{background:rgba(110,110,110,.18)} .legenda .l-pilih::before{background:rgba(30,90,200,.30)}
  .panel-blok{border:1px solid var(--biru);padding:10px 14px;margin:10px 0;background:var(--panel)}
  .pesan{font-size:13.5px;margin:6px 0}
  .pesan.galat{color:var(--merah)} .pesan.ok{color:var(--hijau)}
  /* kelengkapan isian (140) */
  .pesan.peringatan{background:#FFF3D6;color:#7A5A00;padding:6px 10px}
  .kartu.konfirmasi{border-left:4px solid #C9A227} .kartu.konfirmasi.ok{border-left-color:var(--hijau)}
  .status-ok{color:var(--hijau);font-weight:600} .status-sebagian{color:#7A5A00} .status-kosong{color:var(--merah)}
  @media(max-width:700px){.wrap{padding-left:16px;padding-right:16px}}
</style>
</head>

<div class="hero" role="region" aria-label="Pembuka halaman"><div class="hero-in">
  <div class="hero-inst" data-identitas></div>

  <div class="sub" id="hSub">Memuat…</div>
</div></div>
<main class="wrap" id="isi"><p class="kosong">Memuat…</p></main>

<script>
// Galat saat memuat skrip ditampilkan sebagai pesan, bukan halaman kosong.
addEventListener('error', function (e) {
  if (document.getElementById('galat-muat')) return;
  var d = document.createElement('div');
  d.id = 'galat-muat';
  d.style.cssText = 'margin:16px;padding:12px 14px;border:1px solid var(--merah);' +
    'background:var(--merah-m3);color:var(--ink);font:14px/1.5 system-ui,sans-serif';
  d.textContent = 'Halaman gagal dimuat: ' + (e.message || 'galat skrip') +
    '. Tekan Ctrl+Shift+R untuk memuat ulang tanpa cache; bila tetap muncul, kirim pesan ini ke admin.';
  document.body.insertBefore(d, document.body.firstChild);
});
</script>
<script type="module">
// Jadwal berhalangan dosen (132-patch-jadwal-berhalangan.sql, pemilik 2026-11-20): dosen mengisi slot jam kuliah yang tidak
// bisa (mingguan per semester dan tanggal tertentu, termasuk jadwal di luar prodi); pengatur jadwal (admin, Kaprodi,
// koordinator TA/KP) melihat semua dan mencari slot kosong; dosen lain hanya jumlah per slot. Logika: jadwal-berhalangan.js.
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/+esm';
import { gerbang } from './menu.js?v=2026-11-28-bbb354';
import { punya } from './koordinator.js?v=2026-11-28-bbb354';
import { semesterKini } from './evaluasi-pembelajaran.js?v=2026-11-28-bbb354';
import { HARI, namaHari, JENIS_HALANGAN, namaJenis, labelSlot, cekSlot, perSel, cariSlotKosong, hariISO,
  cekRentang, labelRentang, rentangPadaTanggal, buatSlot, tambahHari, mingguDari, slotAntara, blokBaru, isiKalender, barisEkspor, EKSPOR_MAKS_HARI, ringkasBlok,
  kelengkapanBerhalangan, LABEL_KELENGKAPAN } from './jadwal-berhalangan.js?v=2026-11-28-bbb354';
import { SHEETJS } from './nilai-cpl.js?v=2026-11-28-bbb354';
import { petaLibur } from './hari-libur.js?v=2026-11-28-bbb354';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sb = createClient(window.SB_URL, window.SB_KEY);
const baca = q => q.then(r => r.error ? [] : (r.data || []), () => []);
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const tgl = s => String(s || '').split('-').reverse().join('/');
let SAYA = null, SLOT = [], HARI_AKTIF = [], DOSEN = [], MILIK = [], MILIK_TGL = [], SEMUA = [], SEMUA_TGL = [], REKAP = null, ADA = true;
// Rentang tanggal + hari + slot (135, pemilik 2026-11-21); ADA_RENTANG = false sebelum patch 135 dijalankan.
let MILIK_RENTANG = [], SEMUA_RENTANG = [], ADA_RENTANG = true;
let PERIODE = null, TAB = 'kalender', PILIH_DOSEN = new Set(), TGL_CARI = '', CARI = '';
// Kalender saya (pemilik 2026-11-21): minggu yang tampil, pilihan seret, blok baru, rincian blok, semua isian mingguan sendiri.
let MINGGU = '', PILIH_KAL = null, FORM_KAL = null, DETAIL_KAL = null, MILIK_SEMUA_MG = [];
let LIBUR = new Map();   // hari libur (139): 'YYYY-MM-DD' -> { nama, jenis }; tabel belum ada = kosong
// Konfirmasi isian lengkap per semester (140); ADA_KONF = false sebelum patch 140 dijalankan.
let KONF_SAYA = [], SEMUA_KONF = [], ADA_KONF = true;
const ADMIN = () => SAYA?.peran === 'admin';
const PENGATUR = () => ADMIN() || ['kaprodi', 'koordinator_ta', 'koordinator_kp'].some(j => punya(SAYA, j));
const namaDosen = id => { const d = DOSEN.find(x => x.id === id); return d ? (d.nama_gelar || d.nama) : '?'; };

function periodeDaftar(){
  const k = semesterKini(), [a] = k.ta.split('/').map(Number);
  const lanjut = k.sm === 'Ganjil' ? { ta: k.ta, sm: 'Genap' } : { ta: `${a + 1}/${a + 2}`, sm: 'Ganjil' };
  return [k, lanjut];
}

async function muat(){
  const s = await sb.from('jadwal_slot').select('*').order('urutan').order('mulai');
  ADA = !s.error;
  if (!ADA) return;
  SLOT = (s.data || []);
  HARI_AKTIF = (await baca(sb.from('jadwal_hari').select('hari'))).map(h => h.hari).sort((a, b) => a - b);
  DOSEN = (await baca(sb.from('dosen').select('id,nama,nama_gelar,aktif,peran').order('nama'))).filter(d => d.aktif !== false && d.peran !== 'asesor');
  const p = PERIODE, dari = iso(new Date(Date.now() - 7 * 864e5));
  MILIK = await baca(sb.from('dosen_berhalangan').select('*').eq('dosen_id', SAYA.id).eq('tahun_akademik', p.ta).eq('semester', p.sm));
  MILIK_SEMUA_MG = await baca(sb.from('dosen_berhalangan').select('*').eq('dosen_id', SAYA.id));
  MILIK_TGL = await baca(sb.from('dosen_berhalangan_tgl').select('*').eq('dosen_id', SAYA.id).gte('tanggal', dari).order('tanggal'));
  LIBUR = petaLibur(await baca(sb.from('hari_libur').select('tanggal,nama,jenis').gte('tanggal', dari)));
  const r = await sb.from('dosen_berhalangan_rentang').select('*').eq('dosen_id', SAYA.id).gte('selesai', dari).order('mulai');
  ADA_RENTANG = !r.error; MILIK_RENTANG = r.error ? [] : r.data || [];
  const kf = await sb.from('berhalangan_konfirmasi').select('*').eq('dosen_id', SAYA.id);
  ADA_KONF = !kf.error; KONF_SAYA = kf.error ? [] : kf.data || [];
  SEMUA_KONF = ADA_KONF && PENGATUR() ? await baca(sb.from('berhalangan_konfirmasi').select('*').eq('tahun_akademik', p.ta).eq('semester', p.sm)) : [];
  if (PENGATUR()) {
    SEMUA = await baca(sb.from('dosen_berhalangan').select('*').eq('tahun_akademik', p.ta).eq('semester', p.sm));
    SEMUA_TGL = await baca(sb.from('dosen_berhalangan_tgl').select('*').gte('tanggal', dari).order('tanggal'));
    SEMUA_RENTANG = ADA_RENTANG ? await baca(sb.from('dosen_berhalangan_rentang').select('*').gte('selesai', dari).order('mulai')) : [];
  } else {
    const { data } = await sb.rpc('jadwal_berhalangan_rekap', { p_ta: p.ta, p_semester: p.sm, p_dari: null, p_sampai: null });
    REKAP = data || { mingguan: [] };
  }
}

const slotAktif = () => SLOT.filter(s => s.aktif !== false);
function kisi(isiSel, hs = HARI_AKTIF){
  const ss = slotAktif();
  if (!hs.length || !ss.length) return `<p class="kosong">Slot jam kuliah dan hari belum diatur${ADMIN() ? ' (tab Atur slot dan hari).' : '; hubungi admin prodi.'}</p>`;
  return `<div class="gulir"><table class="kisi"><thead><tr><th class="slot">Slot</th>${hs.map(h => `<th>${namaHari(h)}</th>`).join('')}</tr></thead><tbody>
    ${ss.map(s => `<tr><th class="slot">${esc(labelSlot(s))}</th>${hs.map(h => isiSel(h, s)).join('')}</tr>`).join('')}</tbody></table></div>`;
}

function gambar(){
  if (!ADA) { $('isi').innerHTML = '<div class="kartu"><p class="kosong">Tabel jadwal belum ada. Admin menjalankan supabase/132-patch-jadwal-berhalangan.sql di Supabase.</p></div>'; return; }
  const tabs = [['kalender', 'Kalender saya'], ['saya', 'Mingguan semester'], ['rekap', PENGATUR() ? 'Rekap dan cari slot kosong' : 'Rekap prodi'], ...(ADMIN() ? [['atur', 'Atur slot dan hari']] : [])];
  const per = periodeDaftar();
  $('isi').innerHTML = `<div class="tab">${tabs.map(([k, l]) => `<button data-tab="${k}" aria-pressed="${TAB === k}">${l}</button>`).join('')}</div>
    ${TAB === 'saya' || TAB === 'rekap' ? `<div class="alat"><label>Semester <select id="fPeriode">${per.map((p, i) => `<option value="${i}"${p.ta === PERIODE.ta && p.sm === PERIODE.sm ? ' selected' : ''}>${p.sm} ${p.ta}</option>`).join('')}</select></label></div>` : ''}
    ${TAB === 'kalender' ? gambarKalender() : TAB === 'saya' ? gambarSaya() : TAB === 'rekap' ? gambarRekap() : gambarAtur()}`;
  pasang();
}

// Tanda "isian lengkap" (140) untuk semester terpilih, termasuk bila memang tidak ada halangan.
const konfSaya = ({ ta, sm }) => KONF_SAYA.find(k => k.tahun_akademik === ta && k.semester === sm);
function htmlKonfirmasi(){
  if (!ADA_KONF) return '';
  const k = konfSaya(PERIODE), sem = `${PERIODE.sm} ${PERIODE.ta}`;
  return `<div class="kartu konfirmasi${k ? ' ok' : ''}"><h2>Kelengkapan isian ${esc(sem)}</h2>
    ${k ? `<p>Sudah Anda tandai lengkap pada ${esc(tgl(String(k.dikonfirmasi_pada).slice(0, 10)))}. Bila ada perubahan, ubah isiannya saja; tanda ini tetap.</p>
      <p><button class="b" id="kBatal">Batalkan tanda lengkap</button> <span class="pesan" id="mKonf"></span></p>`
    : `<p>Setelah semua jadwal yang tidak bisa Anda pakai selama ${esc(sem)} diisi (mingguan di bawah dan tanggal/rentang di Kalender saya),
        tandai lengkap. <b>Bila memang tidak ada halangan, tetap tandai lengkap</b> supaya penyusun jadwal tahu Anda sudah memeriksa.</p>
      <p><button class="b utama" id="kTandai">Tandai isian ${esc(sem)} lengkap</button> <span class="pesan" id="mKonf"></span></p>`}</div>`;
}
// Pengingat kecil di Kalender saya bila semester berikutnya belum ditandai lengkap.
function bannerKonfirmasi(){
  if (!ADA_KONF) return '';
  const p = periodeDaftar()[1];
  return konfSaya(p) ? '' : `<p class="pesan peringatan" style="margin:0 0 10px">Isian berhalangan ${esc(p.sm)} ${esc(p.ta)} belum Anda tandai lengkap.
    Isi dulu bila ada, lalu tandai di tab <a href="#" id="keKonf">Mingguan semester</a>.</p>`;
}

function gambarSaya(){
  const sel = perSel(MILIK);
  return `${htmlKonfirmasi()}<div class="kartu"><h2>Jadwal mingguan yang tidak bisa</h2>
    <p class="ket">Klik sel untuk menandai atau membatalkan slot yang tidak bisa Anda pakai selama semester ini, termasuk jadwal di luar prodi
      (mengajar prodi lain, tugas fakultas/universitas, kegiatan luar). Jenis dan alasan di bawah dipakai untuk sel yang Anda tandai berikutnya.
      ${PENGATUR() ? '' : 'Nama dan alasan Anda hanya terlihat admin, Kaprodi, serta koordinator TA dan KP.'}</p>
    <div class="alat"><label>Jenis <select id="fJenis">${JENIS_HALANGAN.map(([k, l]) => `<option value="${k}">${l}</option>`).join('')}</select></label>
      <label>Alasan (opsional) <input type="text" id="fAlasan" maxlength="200" placeholder="mis. Mengajar Teknik Lingkungan" style="min-width:260px"></label></div>
    ${kisi((h, s) => { const r = (sel.get(`${h}|${s.id}`) || [])[0];
      return `<td class="sel${r ? ' halang' : ''}"><button class="sel" data-h="${h}" data-s="${s.id}" title="${r ? esc(`${namaJenis(r.jenis)}${r.alasan ? ': ' + r.alasan : ''}`) : 'Bisa'}">${r ? `✕ ${esc(namaJenis(r.jenis).split(' ')[0])}` : ''}</button></td>`; })}
    <p class="pesan" id="mSaya"></p>
    <p class="ket">${MILIK.length} slot ditandai untuk ${PERIODE.sm} ${PERIODE.ta}.</p></div>
  ${ADA_RENTANG ? '' : `<div class="kartu"><h2>Tanggal tertentu</h2>
    <p class="ket">Untuk halangan sekali waktu (dinas luar, konferensi, cuti). Tanggal lampau lebih dari seminggu tidak ditampilkan.</p>
    <div class="alat"><input type="date" id="tTanggal" min="${iso(new Date())}">
      <select id="tSlot"><option value="">Sepanjang hari</option>${slotAktif().map(s => `<option value="${s.id}">${esc(labelSlot(s))}</option>`).join('')}</select>
      <select id="tJenis">${JENIS_HALANGAN.map(([k, l]) => `<option value="${k}">${l}</option>`).join('')}</select>
      <input type="text" id="tAlasan" maxlength="200" placeholder="Alasan (opsional)">
      <button class="b utama" id="tTambah">Tambah</button></div><p class="pesan" id="mTgl"></p>
    ${MILIK_TGL.length ? `<table class="ds"><thead><tr><th>Tanggal</th><th>Slot</th><th>Jenis</th><th>Alasan</th><th></th></tr></thead><tbody>
      ${MILIK_TGL.map(t => `<tr><td>${namaHari(new Date(t.tanggal + 'T00:00:00').getDay() || 7)}, ${tgl(t.tanggal)}</td><td>${esc(labelSlot(SLOT.find(s => s.id === t.slot_id)))}</td>
        <td>${esc(namaJenis(t.jenis))}</td><td>${esc(t.alasan || '')}</td><td><button class="b bahaya" data-hapus-tgl="${t.id}">Hapus</button></td></tr>`).join('')}</tbody></table>`
      : '<p class="kosong">Belum ada.</p>'}</div>`}`;
}

// Tanggal atau rentang tanggal, hari tertentu, slot tertentu (135, pemilik 2026-11-21). Isian tanggal lama (132) tetap tampil.
function htmlRentangSaya(){
  const baris = [...MILIK_RENTANG.map(r => ({ urut: r.mulai, label: labelRentang(r, SLOT), jenis: r.jenis, alasan: r.alasan, hapus: `data-hapus-rentang="${r.id}"` })),
                 ...MILIK_TGL.map(t => ({ urut: t.tanggal, label: labelRentang({ mulai: t.tanggal, selesai: t.tanggal, slot_ids: t.slot_id ? [t.slot_id] : null }, SLOT),
                                          jenis: t.jenis, alasan: t.alasan, hapus: `data-hapus-tgl="${t.id}"` }))].sort((a, b) => a.urut.localeCompare(b.urut));
  return `<div class="kartu"><h2>Tanggal atau rentang tanggal</h2>
    <p class="ket">Untuk halangan di luar jadwal mingguan: satu tanggal (dinas luar, konferensi) atau rentang tanggal, mis. 1 Desember s.d.
      15 Januari setiap Selasa dan Kamis pada Jam 1–2. Kosongkan <b>Sampai</b> untuk satu tanggal; untuk rentang, <b>centang hari yang berlaku</b> (mis. hanya Senin untuk
      jadwal tiap Senin); tanpa jam dicentang = sepanjang hari. Periksa ringkasan sebelum menekan Tambah. Isian yang sudah lewat lebih dari seminggu tidak ditampilkan.</p>
    <div class="alat"><label>Dari <input type="date" id="rMulai" min="${iso(new Date())}"></label>
      <label>Sampai <input type="date" id="rSelesai" min="${iso(new Date())}"></label></div>
    <div class="alat"><span class="ket">Hari:</span>${HARI.map(([h, n]) => `<label><input type="checkbox" data-r-hari="${h}"> ${n}</label>`).join('')}</div>

      ${cari ? (cari.size ? kisi((h, s) => { const k = `${h}|${s.id}`; if (!cari.has(k)) return '<td></td>'; const xs = cari.get(k);
          return `<td class="sel ${xs.length ? 'halang' : 'bisa'}">${xs.length ? xs.map(x => `<span class="nama" title="${esc(`${namaJenis(x.jenis)}${x.alasan ? ': ' + x.alasan : ''}`)}">${esc(namaDosen(x.dosen_id))}${x.sumber === 'tanggal' ? ' (tgl)' : ''}</span>`).join('') : 'Semua bisa'}</td>`; }, TGL_CARI ? [hariISO(TGL_CARI)] : HARI_AKTIF)

    <div class="kartu"><h2>Unduh Excel berhalangan</h2>
      <p class="ket">Untuk menyusun jadwal kuliah dan rapat (manual atau dengan penjalan optimasi). Lembar <b>Mingguan</b>: isian semester
        ${esc(PERIODE.sm)} ${esc(PERIODE.ta)}; lembar <b>Tanggal</b>: blok kalender, rentang, dan isian tanggal dalam rentang di bawah (paling lama

      ${kisi((h, s) => { const xs = sel.get(`${h}|${s.id}`) || [];

      <h3>Halangan tanggal dan rentang tanggal (${nTgl})</h3>

          <td>${esc(namaJenis(t.jenis))}</td><td>${esc(t.alasan || '')}</td></tr>`).join('')}</tbody></table>` : '<p class="kosong">Belum ada.</p>'}</div>`;

// ---------- Kalender saya (pemilik 2026-11-21): minggu bertanggal x slot; seret untuk blok, judul wajib + jenis, ulangi
// tiap minggu sampai tanggal tertentu. Blok = baris dosen_berhalangan_rentang (135). Logika murni: jadwal-berhalangan.js.
const SUMBER_KAL = { blok: 'Blok kalender', tanggal: 'Isian tanggal', mingguan: 'Mingguan semester' };
const tglPendek = t => { const [, m, d] = t.split('-'); return `${+d}/${+m}`; };
const jamMulai = s => String(s?.mulai || '').slice(0, 5);
const semesterTgl = t => semesterKini(new Date(t + 'T00:00:00'));

function gambarKalender(){
  if (!ADA_RENTANG) return '<div class="kartu"><p class="kosong">Kalender butuh supabase/135-patch-berhalangan-rentang.sql; hubungi admin.</p></div>';
  const ss = slotAktif(), minggu = mingguDari(MINGGU), tgl = minggu.filter(t => HARI_AKTIF.includes(hariISO(t)));
  if (!ss.length || !HARI_AKTIF.length) return `<div class="kartu"><p class="kosong">Slot jam kuliah dan hari belum diatur${ADMIN() ? ' (tab Atur slot dan hari).' : '; hubungi admin prodi.'}</p></div>`;
  const kini = iso(new Date());
  const isi = isiKalender({ tanggal: tgl, slot: ss, rentang: MILIK_RENTANG, tanggalan: MILIK_TGL, mingguan: MILIK_SEMUA_MG, semesterDari: semesterTgl });
  const pilih = new Set(PILIH_KAL ? kunciPilih(PILIH_KAL) : []);
  const form = new Set(FORM_KAL ? FORM_KAL.kunci : []);
  const label = `${tglPendek(minggu[0])}–${tglPendek(minggu[6])} ${minggu[6].slice(0, 4)}`;
  const sel = (t, s, i) => {
    const k = `${t}|${s.id}`, xs = isi.get(k) || [], x = xs[0];
    const atas = i > 0 ? (isi.get(`${t}|${ss[i - 1].id}`) || [])[0] : null;
    const awal = x && !(atas && atas.sumber === x.sumber && atas.id === x.id);
    const kelas = [t < kini ? 'lalu' : '', x ? x.sumber : '', pilih.has(k) || form.has(k) ? 'pilih' : '', LIBUR.has(t) ? 'libur' : ''].filter(Boolean).join(' ');
    const judul = xs.map(y => `${y.judul || namaJenis(y.jenis)} (${SUMBER_KAL[y.sumber]})`).join('; ');
    return `<td data-t="${t}" data-s="${s.id}"${x ? ' data-ada="1"' : ''} class="${kelas}" title="${esc(`${labelSlot(s)}${judul ? ' · ' + judul : ''}`)}">${
      awal ? `<span class="judul">${esc(x.judul || namaJenis(x.jenis))}</span>` : ''}</td>`;
  };
  return `<div class="kartu"><h2>Kalender saya</h2>${bannerKonfirmasi()}
    <p class="ket">Seret dari jam mulai sampai jam selesai yang tidak bisa Anda pakai, lalu isi judulnya (mis. "Mengajar Teknik Lingkungan"). Seret melintasi
      beberapa hari untuk jam yang sama di hari-hari itu; ubah <b>Sampai</b> dan centang <b>Hari</b> untuk rentang tanggal atau jadwal rutin. Klik blok yang sudah ada untuk melihat atau menghapusnya.
      ${PENGATUR() ? '' : 'Judul Anda hanya terlihat admin, Kaprodi, serta koordinator TA dan KP; dosen lain hanya melihat jumlah.'}</p>
    <div class="alat"><button class="b" id="kSebelum">‹ Minggu sebelumnya</button><b>${esc(label)}</b>
      <button class="b" id="kSesudah">Minggu berikutnya ›</button><button class="b" id="kIni">Minggu ini</button></div>
    <div class="legenda"><span class="l-blok">Blok kalender</span><span class="l-tgl">Isian tanggal</span><span class="l-mg">Mingguan semester</span><span class="l-pilih">Dipilih</span></div>
    ${tgl.length ? `<div class="gulir"><table class="kal" id="kal"><thead><tr><th class="jam"></th>${tgl.map(t => { const lb = LIBUR.get(t);
        return `<th class="${[t === kini ? 'hari-ini' : '', lb ? 'libur' : ''].join(' ')}"${t >= kini ? ` data-hari-t="${t}" title="${lb ? esc(lb.nama) + ' · ' : ''}Klik untuk blok sepanjang hari" style="cursor:pointer"` : ''}>${namaHari(hariISO(t))} ${tglPendek(t)}${
          lb ? `<span class="nama-libur">${esc(lb.nama)}</span>` : ''}</th>`; }).join('')}</tr></thead>
      <tbody>${ss.map((s, i) => `<tr><th class="jam">${esc(jamMulai(s))}</th>${tgl.map(t => sel(t, s, i)).join('')}</tr>`).join('')}</tbody></table></div>`
      : '<p class="kosong">Minggu ini tidak memuat hari kuliah.</p>'}
    ${htmlFormKal()}${htmlDetailKal(isi)}<p class="pesan" id="mKal"></p></div>
  <details class="kartu"><summary><b>Isi dengan formulir</b> (rentang tanggal beberapa hari) dan daftar semua isian</summary>${htmlRentangSaya()}</details>`;
}

// Kunci sel 'tanggal|slot' di dalam kotak pilihan (hari t0..t1 pada minggu tampil, jam a..b).
function kunciPilih(p){
  const [d0, d1] = [p.t0, p.t1].sort(), ids = slotAntara(slotAktif(), p.a, p.b);
  return mingguDari(MINGGU).filter(t => t >= d0 && t <= d1 && HARI_AKTIF.includes(hariISO(t))).flatMap(t => ids.map(id => `${t}|${id}`));
}

function htmlFormKal(){
  if (!FORM_KAL) return '';
  const ss = slotAktif().filter(s => FORM_KAL.slot_ids.includes(s.id));
  const jam = FORM_KAL.sehari ? 'sepanjang hari' : ss.length ? `${String(ss[0].mulai).slice(0, 5)}–${String(ss[ss.length - 1].selesai).slice(0, 5)}` : '';
  return `<div class="panel-blok"><b>Blok baru: ${esc(jam)}</b>
    <div class="alat"><label><input type="checkbox" id="bSehari"${FORM_KAL.sehari ? ' checked' : ''}> Sepanjang hari</label>
      <span class="ket">semua jam pada hari-hari itu, mis. dinas luar atau cuti</span></div>
    <div class="alat"><input type="text" id="bJudul" maxlength="200" placeholder="Judul, mis. Mengajar Teknik Lingkungan" style="min-width:300px">
      <select id="bJenis">${JENIS_HALANGAN.map(([k, l]) => `<option value="${k}">${l}</option>`).join('')}</select></div>
    <div class="alat"><label>Dari <input type="date" id="bDari" value="${FORM_KAL.tanggal}" min="${iso(new Date())}"></label>
      <label>Sampai <input type="date" id="bSampai" value="${FORM_KAL.sampai}" min="${FORM_KAL.tanggal}"></label>
      <span class="ket">jam yang sama pada setiap hari yang dicentang dalam rentang ini; untuk jadwal rutin, isi Sampai dengan akhir semester.</span></div>
    <div class="alat"><span class="ket">Hari:</span>${HARI.map(([h, n]) => `<label><input type="checkbox" data-b-hari="${h}"${FORM_KAL.hari.includes(h) ? ' checked' : ''}> ${n}</label>`).join('')}</div>
    <p class="ket"><b>Akan diblok:</b> <span id="bRingkas"></span></p>
    <div class="alat"><button class="b utama" id="bSimpan">Simpan blok</button><button class="b" id="bBatal">Batal</button></div></div>`;
}

function htmlDetailKal(isi){
  if (!DETAIL_KAL) return '';
  const xs = isi.get(`${DETAIL_KAL.t}|${DETAIL_KAL.s}`) || [];
  if (!xs.length) return '';
  return `<div class="panel-blok"><b>${esc(namaHari(hariISO(DETAIL_KAL.t)))}, ${esc(tgl(DETAIL_KAL.t))}</b>
    ${xs.map(x => `<div class="alat"><span>${esc(x.judul || '(tanpa judul)')} · ${esc(namaJenis(x.jenis))} · ${esc(SUMBER_KAL[x.sumber])}${
      x.ulang ? ` · berulang ${esc(tgl(x.mulai))}–${esc(tgl(x.selesai))}` : ''}</span>
      ${x.sumber === 'mingguan' ? '<span class="ket">ubah di tab Mingguan semester</span>'
        : `<button class="b bahaya" data-hapus-kal="${x.sumber}|${x.id}"${x.ulang ? ' data-ulang="1"' : ''}>Hapus${x.ulang ? ' seluruh pengulangan' : ''}</button>`}</div>`).join('')}
    <div class="alat"><button class="b" id="dTutup">Tutup</button></div></div>`;
}

function pasangKalender(){
  if ($('kSebelum')) $('kSebelum').onclick = () => { MINGGU = tambahHari(MINGGU, -7); FORM_KAL = DETAIL_KAL = null; gambar(); };
  if ($('kSesudah')) $('kSesudah').onclick = () => { MINGGU = tambahHari(MINGGU, 7); FORM_KAL = DETAIL_KAL = null; gambar(); };
  if ($('kIni')) $('kIni').onclick = () => { MINGGU = mingguAwal(); FORM_KAL = DETAIL_KAL = null; gambar(); };
  const kal = $('kal');
  if (kal) {
    const sel = el => el?.closest?.('td[data-t]');
    const tandai = () => { const on = new Set(PILIH_KAL ? kunciPilih(PILIH_KAL) : []);
      kal.querySelectorAll('td[data-t]').forEach(td => td.classList.toggle('pilih', on.has(`${td.dataset.t}|${td.dataset.s}`))); };
    kal.onpointerdown = e => {
      const c = sel(e.target);
      if (!c || c.classList.contains('lalu')) return;
      e.preventDefault();
      if (c.dataset.ada) { DETAIL_KAL = { t: c.dataset.t, s: +c.dataset.s }; FORM_KAL = null; gambar(); return; }
      PILIH_KAL = { t0: c.dataset.t, t1: c.dataset.t, a: +c.dataset.s, b: +c.dataset.s };
      try { kal.setPointerCapture(e.pointerId); } catch { /* tetap jalan tanpa capture */ }
      tandai();
    };
    kal.onpointermove = e => {
      if (!PILIH_KAL) return;
      const c = sel(document.elementFromPoint(e.clientX, e.clientY));
      // Boleh melintasi hari (pemilik 2026-11-21): kotak pilihan = hari t0..t1 x jam a..b.
      if (c && !c.classList.contains('lalu') && (c.dataset.t !== PILIH_KAL.t1 || +c.dataset.s !== PILIH_KAL.b)) {
        PILIH_KAL.t1 = c.dataset.t; PILIH_KAL.b = +c.dataset.s; tandai(); }
    };
    kal.onpointerup = () => {
      if (!PILIH_KAL) return;
      const [d0, d1] = [PILIH_KAL.t0, PILIH_KAL.t1].sort(), hs = mingguDari(MINGGU).filter(t => t >= d0 && t <= d1).map(hariISO);
      FORM_KAL = { tanggal: d0, sampai: d1, hari: hs.filter(h => HARI_AKTIF.includes(h)), slot_ids: slotAntara(slotAktif(), PILIH_KAL.a, PILIH_KAL.b),
                   kunci: kunciPilih(PILIH_KAL) };
      PILIH_KAL = null; DETAIL_KAL = null; gambar();
      if ($('bJudul')) $('bJudul').focus();
    };
  }
  // Klik judul kolom hari = blok sepanjang hari tanggal itu (pemilik 2026-11-21).
  document.querySelectorAll('#kal th[data-hari-t]').forEach(th => { th.onclick = () => { const t = th.dataset.hariT;
    FORM_KAL = { tanggal: t, sampai: t, hari: [hariISO(t)], sehari: true, slot_ids: slotAktif().map(s => s.id), kunci: slotAktif().map(s => `${t}|${s.id}`) };
    DETAIL_KAL = null; gambar(); if ($('bJudul')) $('bJudul').focus(); }; });
  // Tanpa gambar ulang, supaya tanggal/hari/jenis yang sudah diubah tidak hilang; cukup judul panel.
  if ($('bSehari')) $('bSehari').onchange = e => { FORM_KAL.sehari = e.target.checked;
    const ss = slotAktif().filter(s => FORM_KAL.slot_ids.includes(s.id)), b = document.querySelector('.panel-blok b');
    if (b) b.textContent = 'Blok baru: ' + (FORM_KAL.sehari ? 'sepanjang hari' : ss.length ? `${String(ss[0].mulai).slice(0, 5)}–${String(ss[ss.length - 1].selesai).slice(0, 5)}` : ''); };
  // Ringkasan sebelum disimpan (pemilik 2026-11-21), diperbarui tiap isian berubah.
  const ringkasKal = () => { if (!$('bRingkas')) return; $('bRingkas').textContent = ringkasBlok({ tanggal: $('bDari').value, sampai: $('bSampai').value,
    hari: [...document.querySelectorAll('[data-b-hari]:checked')].map(c => +c.dataset.bHari), slot_ids: FORM_KAL.slot_ids, sepanjang: $('bSehari').checked }, slotAktif()); };
  ['bDari', 'bSampai', 'bSehari'].forEach(id => { if ($(id)) $(id).addEventListener('change', ringkasKal); });
  document.querySelectorAll('[data-b-hari]').forEach(c => c.addEventListener('change', ringkasKal));
  ringkasKal();
  const ringkasForm = () => { if (!$('rRingkas')) return; const m = $('rMulai').value;
    $('rRingkas').textContent = m ? 'Akan diblok: ' + ringkasBlok({ tanggal: m, sampai: $('rSelesai').value,
      hari: [...document.querySelectorAll('[data-r-hari]:checked')].map(c => +c.dataset.rHari),
      slot_ids: [...document.querySelectorAll('[data-r-slot]:checked')].map(c => +c.dataset.rSlot) }, slotAktif()) : ''; };
  ['rMulai', 'rSelesai'].forEach(id => { if ($(id)) $(id).addEventListener('change', ringkasForm); });
  document.querySelectorAll('[data-r-hari],[data-r-slot]').forEach(c => c.addEventListener('change', ringkasForm));
  if ($('bBatal')) $('bBatal').onclick = () => { FORM_KAL = null; gambar(); };
  if ($('dTutup')) $('dTutup').onclick = () => { DETAIL_KAL = null; gambar(); };
  if ($('bSimpan')) $('bSimpan').onclick = async () => {
    const h = blokBaru({ tanggal: $('bDari').value, sampai: $('bSampai').value, slot_ids: FORM_KAL.slot_ids, judul: $('bJudul').value,
                         jenis: $('bJenis').value, hari: [...document.querySelectorAll('[data-b-hari]:checked')].map(c => +c.dataset.bHari),
                         sepanjang: $('bSehari').checked });
    if (h.galat) return tulis('mKal', 'galat', h.galat.join(' '));
    $('bSimpan').disabled = true;
    const { error } = await sb.from('dosen_berhalangan_rentang').insert({ dosen_id: SAYA.id, ...h.baris });
    if (error) { $('bSimpan').disabled = false; return tulis('mKal', 'galat', error.message); }
    FORM_KAL = null; await segar(); tulis('mKal', 'ok', 'Blok tersimpan.');
  };
  document.querySelectorAll('[data-hapus-kal]').forEach(b => { b.onclick = async () => {
    const [sumber, id] = b.dataset.hapusKal.split('|');
    if (b.dataset.ulang && !confirm('Blok ini berulang tiap minggu. Hapus seluruh pengulangannya?')) return;
    const { error } = await sb.from(sumber === 'blok' ? 'dosen_berhalangan_rentang' : 'dosen_berhalangan_tgl').delete().eq('id', +id);
    if (error) return tulis('mKal', 'galat', error.message);
    DETAIL_KAL = null; await segar(); tulis('mKal', 'ok', 'Dihapus.');
  }; });
}

// Minggu awal kalender: minggu ini; bila hari ini bukan hari kuliah lagi (mis. Sabtu), minggu berikutnya.
function mingguAwal(){
  const kini = iso(new Date()), m = mingguDari(kini);
  return m.some(t => t >= kini && HARI_AKTIF.includes(hariISO(t))) ? m[0] : tambahHari(m[0], 7);
}

let DRAF_SLOT = null;
function gambarAtur(){
  if (!DRAF_SLOT) DRAF_SLOT = SLOT.map(s => ({ ...s, mulai: String(s.mulai).slice(0, 5), selesai: String(s.selesai).slice(0, 5) }));
  return `<div class="kartu"><h2>Slot jam kuliah</h2>
    <p class="ket">Sesuaikan dengan jam kuliah universitas. Menghapus slot juga menghapus isian dosen pada slot itu; nonaktifkan saja bila ragu.</p>
    <table class="ds"><thead><tr><th>Urutan</th><th>Label</th><th>Mulai</th><th>Selesai</th><th>Aktif</th><th></th></tr></thead><tbody>
      ${DRAF_SLOT.map((s, i) => `<tr><td>${i + 1}</td><td><input type="text" data-sl="${i}" data-k="label" value="${esc(s.label)}" maxlength="40" placeholder="Jam ${i + 1}"></td>
        <td><input type="time" data-sl="${i}" data-k="mulai" value="${esc(s.mulai)}"></td><td><input type="time" data-sl="${i}" data-k="selesai" value="${esc(s.selesai)}"></td>
        <td><input type="checkbox" data-sl="${i}" data-k="aktif"${s.aktif !== false ? ' checked' : ''}></td>
        <td><button class="b bahaya" data-hapus-slot="${i}">Hapus</button></td></tr>`).join('') || '<tr><td colspan="6" class="kosong">Belum ada slot.</td></tr>'}</tbody></table>
    <div class="alat"><button class="b" id="aTambah">+ Slot</button></div>
    <div class="alat"><span class="ket">Buat slot otomatis:</span>
      <label>dari <input type="time" id="gDari"></label><label>sampai <input type="time" id="gSampai"></label>
      <label>tiap <input type="number" id="gMenit" min="15" max="240" step="5" style="width:70px"> menit</label>
      <button class="b" id="gBuat">Buat</button>
      <span class="ket">mengganti daftar di atas (belum tersimpan sampai Simpan; isian dosen pada slot yang dihapus ikut terhapus).</span></div>
    <h3>Hari kuliah</h3>
    <div class="alat">${HARI.map(([h, n]) => `<label><input type="checkbox" data-hari="${h}"${HARI_AKTIF.includes(h) ? ' checked' : ''}> ${n}</label>`).join('')}</div>
    <div class="alat"><button class="b utama" id="aSimpan">Simpan slot dan hari</button><span class="pesan" id="mAtur"></span></div></div>`;
}

function tulis(id, kelas, t){ const m = $(id); if (m) { m.className = 'pesan ' + kelas; m.textContent = t; } }
async function segar(){ await muat(); gambar(); }

function pasang(){
  document.querySelectorAll('[data-tab]').forEach(b => { b.onclick = () => { TAB = b.dataset.tab; gambar(); }; });
  pasangKalender();
  if ($('fPeriode')) $('fPeriode').onchange = async e => { PERIODE = periodeDaftar()[+e.target.value]; await segar(); };
  // Tanda isian lengkap (140).
  if ($('kTandai')) $('kTandai').onclick = async () => {
    $('kTandai').disabled = true;
    const { error } = await sb.from('berhalangan_konfirmasi').upsert({ dosen_id: SAYA.id, tahun_akademik: PERIODE.ta, semester: PERIODE.sm,
      dikonfirmasi_pada: new Date().toISOString() }, { onConflict: 'dosen_id,tahun_akademik,semester' });
    if (error) { $('kTandai').disabled = false; return tulis('mKonf', 'galat', error.message); }
    await segar();
  };
  if ($('kBatal')) $('kBatal').onclick = async () => {
    const { error } = await sb.from('berhalangan_konfirmasi').delete().eq('dosen_id', SAYA.id).eq('tahun_akademik', PERIODE.ta).eq('semester', PERIODE.sm);
    if (error) return tulis('mKonf', 'galat', error.message);
    await segar();
  };
  if ($('keKonf')) $('keKonf').onclick = async e => { e.preventDefault(); TAB = 'saya'; PERIODE = periodeDaftar()[1]; await segar(); };
  // Jadwal saya: klik sel = tandai/batalkan.
  document.querySelectorAll('button.sel[data-h]').forEach(b => { b.onclick = async () => {
    const h = +b.dataset.h, s = +b.dataset.s, ada = MILIK.find(r => r.hari === h && r.slot_id === s);
    b.disabled = true;
    const { error } = ada ? await sb.from('dosen_berhalangan').delete().eq('id', ada.id)
      : await sb.from('dosen_berhalangan').insert({ dosen_id: SAYA.id, tahun_akademik: PERIODE.ta, semester: PERIODE.sm, hari: h, slot_id: s,
          jenis: $('fJenis').value, alasan: $('fAlasan').value.trim() || null });
    if (error) { b.disabled = false; tulis('mSaya', 'galat', error.message); return; }
    const jenis = $('fJenis').value, alasan = $('fAlasan').value;
    await segar();
    if ($('fJenis')) { $('fJenis').value = jenis; $('fAlasan').value = alasan; }
  }; });
  if ($('tTambah')) $('tTambah').onclick = async () => {
    if (!$('tTanggal').value) return tulis('mTgl', 'galat', 'Pilih tanggal.');
    const { error } = await sb.from('dosen_berhalangan_tgl').insert({ dosen_id: SAYA.id, tanggal: $('tTanggal').value, slot_id: $('tSlot').value ? +$('tSlot').value : null,
      jenis: $('tJenis').value, alasan: $('tAlasan').value.trim() || null });
    if (error) return tulis('mTgl', 'galat', /duplicate/i.test(error.message) ? 'Tanggal dan slot itu sudah ada.' : error.message);
    await segar();
  };
  // Rentang tanggal (135): hari dan slot yang dicentang; tanpa centang = semua hari / sepanjang hari.
  if ($('rTambah')) $('rTambah').onclick = async () => {
    const mulai = $('rMulai').value, selesai = $('rSelesai').value || mulai;
    const hari = [...document.querySelectorAll('[data-r-hari]:checked')].map(c => +c.dataset.rHari);
    const slot = [...document.querySelectorAll('[data-r-slot]:checked')].map(c => +c.dataset.rSlot);
    const g = cekRentang({ mulai, selesai, hari, slot });
    // Rentang wajib berhari (pemilik 2026-11-21: tanpa centang hari dulu berarti setiap hari dan membingungkan).
    if (selesai > mulai && !hari.length) g.unshift('Centang hari yang berlaku (mis. hanya Senin untuk jadwal tiap Senin).');
    if (g.length) return tulis('mTgl', 'galat', g.join(' '));
    $('rTambah').disabled = true;
    const { error } = await sb.from('dosen_berhalangan_rentang').insert({ dosen_id: SAYA.id, mulai, selesai, hari: hari.length ? hari : null,
      slot_ids: slot.length ? slot : null, jenis: $('rJenis').value, alasan: $('rAlasan').value.trim() || null });
    if (error) { $('rTambah').disabled = false; return tulis('mTgl', 'galat', error.message); }
    await segar(); tulis('mTgl', 'ok', 'Tersimpan.');
  };
  document.querySelectorAll('[data-hapus-rentang]').forEach(b => { b.onclick = async () => {
    const { error } = await sb.from('dosen_berhalangan_rentang').delete().eq('id', +b.dataset.hapusRentang);
    if (error) return tulis('mTgl', 'galat', error.message);
    await segar();
  }; });
  document.querySelectorAll('[data-hapus-tgl]').forEach(b => { b.onclick = async () => {
    const { error } = await sb.from('dosen_berhalangan_tgl').delete().eq('id', +b.dataset.hapusTgl);
    if (error) return tulis('mTgl', 'galat', error.message);
    await segar();
  }; });
  // Rekap pengatur: cari slot kosong.
  document.querySelectorAll('[data-dosen]').forEach(c => { c.onchange = () => { c.checked ? PILIH_DOSEN.add(c.dataset.dosen) : PILIH_DOSEN.delete(c.dataset.dosen); gambar(); }; });
  if ($('cDosen')) $('cDosen').oninput = e => { CARI = e.target.value; const p = e.target.selectionStart; gambar(); $('cDosen').focus(); $('cDosen').setSelectionRange(p, p); };
  if ($('cTanggal')) $('cTanggal').onchange = e => { TGL_CARI = e.target.value; gambar(); };
  if ($('cBersih')) $('cBersih').onclick = () => { PILIH_DOSEN.clear(); gambar(); };
  if ($('eUnduh')) $('eUnduh').onclick = async () => {
    const e = barisEkspor({ dosen: DOSEN.map(d => ({ id: d.id, nama: d.nama_gelar || d.nama })), slot: slotAktif(), mingguan: SEMUA,
      tanggalan: SEMUA_TGL, rentang: SEMUA_RENTANG, dari: $('eDari').value, sampai: $('eSampai').value, hariAktif: HARI_AKTIF });
    if (e.galat) return tulis('mEkspor', 'galat', e.galat);
    const X = await import(SHEETJS), wb = X.utils.book_new();
    X.utils.book_append_sheet(wb, X.utils.aoa_to_sheet(e.mingguan), 'Mingguan');
    X.utils.book_append_sheet(wb, X.utils.aoa_to_sheet(e.tanggal), 'Tanggal');
    X.writeFile(wb, `berhalangan_${$('eDari').value}_${$('eSampai').value}.xlsx`);
    tulis('mEkspor', 'ok', `${e.mingguan.length - 1} baris mingguan, ${e.tanggal.length - 1} baris tanggal.`);
  };
  // Atur slot (admin).
  document.querySelectorAll('[data-sl]').forEach(el => { el.onchange = () => { const s = DRAF_SLOT[+el.dataset.sl]; s[el.dataset.k] = el.type === 'checkbox' ? el.checked : el.value; }; });
  document.querySelectorAll('[data-hapus-slot]').forEach(b => { b.onclick = () => { DRAF_SLOT.splice(+b.dataset.hapusSlot, 1); gambar(); }; });
  if ($('gBuat')) $('gBuat').onclick = () => {
    const s = buatSlot($('gDari').value, $('gSampai').value, $('gMenit').value);
    if (s.galat) return tulis('mAtur', 'galat', s.galat);
    DRAF_SLOT = s; gambar(); tulis('mAtur', '', `${s.length} slot dibuat. Periksa, centang hari kuliah, lalu Simpan.`);
  };
  if ($('aTambah')) $('aTambah').onclick = () => { DRAF_SLOT.push({ label: `Jam ${DRAF_SLOT.length + 1}`, mulai: '', selesai: '', aktif: true }); gambar(); };
  if ($('aSimpan')) $('aSimpan').onclick = async () => {
    const hari = [...document.querySelectorAll('[data-hari]:checked')].map(c => +c.dataset.hari);
    const g = cekSlot(DRAF_SLOT);
    if (!hari.length) g.push('Pilih minimal satu hari kuliah.');
    if (g.length) return tulis('mAtur', 'galat', g.join(' '));
    const dihapus = SLOT.filter(s => !DRAF_SLOT.some(d => d.id === s.id));
    if (dihapus.length && !confirm(`Hapus ${dihapus.length} slot (${dihapus.map(s => s.label).join(', ')})? Isian dosen pada slot itu ikut terhapus.`)) return;
    for (const s of dihapus) { const { error } = await sb.from('jadwal_slot').delete().eq('id', s.id); if (error) return tulis('mAtur', 'galat', error.message); }
    for (const [i, s] of DRAF_SLOT.entries()) {
      const isi = { urutan: i + 1, label: s.label.trim(), mulai: s.mulai, selesai: s.selesai, aktif: s.aktif !== false };
      const { error } = s.id ? await sb.from('jadwal_slot').update(isi).eq('id', s.id) : await sb.from('jadwal_slot').insert(isi);
      if (error) return tulis('mAtur', 'galat', error.message);
    }
    const hapusHari = HARI_AKTIF.filter(h => !hari.includes(h)), tambahHari = hari.filter(h => !HARI_AKTIF.includes(h));
    if (hapusHari.length) { const { error } = await sb.from('jadwal_hari').delete().in('hari', hapusHari); if (error) return tulis('mAtur', 'galat', error.message); }
    if (tambahHari.length) { const { error } = await sb.from('jadwal_hari').insert(tambahHari.map(h => ({ hari: h }))); if (error) return tulis('mAtur', 'galat', error.message); }
    DRAF_SLOT = null; await segar(); tulis('mAtur', 'ok', 'Tersimpan.');
  };
}

async function mulai(){
  SAYA = await gerbang(sb);
  if (!SAYA) return;
  $('hSub').textContent = `Masuk sebagai ${SAYA.nama}`;
  PERIODE = periodeDaftar()[0];
  await muat();
  MINGGU = mingguAwal();
  gambar();
}
mulai().catch(e => { $('isi').innerHTML = `<p class="kosong">Gagal memuat: ${esc(e.message)}</p>`; });
</script>
</body>
</html>
