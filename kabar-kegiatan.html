  .cek-baris{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:2px 12px;font-size:13.5px}

// Galat saat memuat skrip ditampilkan sebagai pesan, bukan halaman kosong.
addEventListener('error', function (e) {

  var d = document.createElement('div');
  d.id = 'galat-muat';
  d.style.cssText = 'margin:16px;padding:12px 14px;border:1px solid var(--merah);' +
    'background:var(--merah-m3);color:var(--ink);font:14px/1.5 system-ui,sans-serif';
  d.textContent = 'Halaman gagal dimuat: ' + (e.message || 'galat skrip') +
    '. Tekan Ctrl+Shift+R untuk memuat ulang tanpa cache; bila tetap muncul, kirim pesan ini ke admin.';
  document.body.insertBefore(d, document.body.firstChild);
});

<script type="module">
// Kabar kegiatan program studi (pemilik 2026-11-16; 81-patch-kabar-kegiatan.sql).
// Dosen dan admin mengajukan kabar beserta foto; admin menerbitkan. Kabar terbit tampil di
// beranda dan kabar.html (dibangun bangun.py tiap jam, foto disalin dari Drive).
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/+esm';
import { gerbang } from './menu.js?v=2026-11-17-f000e4';

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = id => document.getElementById(id);
const sb = createClient(window.SB_URL, window.SB_KEY);
const tgl = s => String(s || '').slice(0, 10).split('-').reverse().join('/');
const JENIS = [['kuliah_tamu', 'Kuliah tamu'], ['kunjungan_lapangan', 'Kuliah/kunjungan lapangan'], ['seminar', 'Seminar / lokakarya'],
  ['pengabdian', 'Pengabdian kepada masyarakat'], ['kerja_praktik', 'Kerja praktik'], ['kompetisi', 'Kompetisi'],
  ['kerja_sama', 'Kerja sama'], ['lainnya', 'Lainnya']];
const STATUS = { diajukan: 'Menunggu terbit', terbit: 'Terbit', ditolak: 'Ditolak' };
const FOTO_EXT = ['jpg', 'jpeg', 'png'];
const MAKS_FOTO = 6;

let SAYA = null, DATA = [], SUNTING = null, FOTO = [], BUKTI = [];
// Bukti pendukung akreditasi (88-patch-kegiatan-akreditasi.sql); ADA88 = patch sudah dijalankan.
let ADA88 = false, MK = [], KS = [];
const KAIT = [['suasana_akademik', 'Suasana akademik (butir 21)'], ['pembelajaran', 'Proses pembelajaran / praktik lapangan (butir 16, 18)'],
  ['kerja_sama', 'Pelaksanaan kerja sama (butir 6–7)'], ['pemangku', 'Keterlibatan pemangku eksternal (butir 13–14)']];
const admin = () => SAYA?.peran === 'admin';
const milik = r => r.dilaporkan_oleh === SAYA.id;

const keB64 = f => new Promise((ok, gagal) => {
  const r = new FileReader();
  r.onload = () => ok(String(r.result).split(',')[1]);
  r.onerror = () => gagal(r.error);
  r.readAsDataURL(f);
});

// Foto ke Drive lewat Apps Script (kind 'karya'): <tahun>/<pengunggah>/Kabar - <judul>/, dibagikan baca-saja.
async function unggahFoto(berkas, tahun, judul, tulis){
  if (!window.UPLOAD_URL) throw new Error('Unggah berkas belum disiapkan di config.js.');
  const maxMb = Number(window.UPLOAD_MAX_MB) || 0;
  const { data: { session } } = await sb.auth.getSession();
  if (!session) throw new Error('Sesi login habis. Muat ulang halaman.');
  const hasil = [];
  for (let i = 0; i < berkas.length; i++) {
    const f = berkas[i], e = ((f.name.match(/\.([^.]+)$/) || [])[1] || '').toLowerCase();
    if (!FOTO_EXT.includes(e)) throw new Error(`${f.name}: unggah foto JPG atau PNG.`);
    if (maxMb && f.size > maxMb * 1024 * 1024) throw new Error(`${f.name}: lebih dari ${maxMb} MB.`);
    tulis('', `Mengunggah ${i + 1}/${berkas.length}: ${f.name}…`);
    const res = await fetch(window.UPLOAD_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ token: session.access_token, kind: 'karya', year: tahun, group: `Kabar - ${judul}`,
                             filename: f.name, data: await keB64(f) }) });
    const out = await res.json();
    if (!out.ok) throw new Error(out.error || 'Unggah gagal.');
    hasil.push(out.url);
  }
  return hasil;
}

function kerangka(){
  $('isi').innerHTML = `
    <div class="kartu"><h2 id="fJudul">Kabar baru</h2>
      <p class="ket">Kegiatan program studi untuk situs publik: kuliah tamu, kunjungan lapangan, seminar, pengabdian,
        kerja praktik, kompetisi, kerja sama. Setelah diterbitkan admin, kabar tampil di beranda dan halaman Kabar
        kegiatan, paling lambat sejam kemudian. Foto: suasana kegiatan, tanpa dokumen pribadi.</p>
      <div class="grid">
        <label class="lebar">Judul<input id="fJ" maxlength="200" placeholder="Kuliah tamu: Teknologi beton rendah karbon"></label>
        <label>Tanggal<input id="fT" type="date"></label>
        <label>Jenis<select id="fJn">${JENIS.map(([k, l]) => `<option value="${k}">${l}</option>`).join('')}</select></label>
        <label>Tempat<input id="fTp" maxlength="200"></label>
        <label class="lebar">Ringkasan (20–1200 huruf)<textarea id="fR" maxlength="1200"
          placeholder="Apa kegiatannya, siapa yang terlibat, dan apa hasilnya."></textarea></label>
        <label class="lebar">Tautan (opsional)<input id="fU" type="url" placeholder="https://"></label>
        ${ADA88 ? htmlAkreditasi() : ''}
        <div class="lebar"><label style="font-size:13px;color:var(--muted)">Foto (JPG/PNG, maks. ${MAKS_FOTO})</label>
          <div class="aksi" style="margin-top:4px"><input id="fF" type="file" accept=".jpg,.jpeg,.png" multiple>
            <button class="b" type="button" id="fUnggah">Unggah foto</button></div>
          <div class="foto" id="fFoto"></div></div>
      </div>
      <div class="aksi"><button class="b utama" type="button" id="fSimpan">Ajukan</button>
        <button class="b" type="button" id="fBatal" hidden>Batal</button><span class="msg" id="fMsg"></span></div>
    </div>
    ${admin() ? `<div class="kartu"><h2>Menunggu terbit</h2><div id="antre"></div></div>` : ''}
    <div class="kartu"><h2>${admin() ? 'Semua kabar' : 'Kabar saya'}</h2><div id="daftar"></div></div>`;
  $('fUnggah').onclick = unggah;
  if (ADA88) { $('fBUnggah').onclick = unggahBukti; $('fMkCari').oninput = saringMk; }
  $('fSimpan').onclick = simpan;
  $('fBatal').onclick = () => isiForm(null);
  $('isi').addEventListener('click', klik);
  isiForm(null);
}

function tulis(kelas, t){ const m = $('fMsg'); m.className = 'msg' + (kelas ? ' ' + kelas : ''); m.textContent = t; }
function gambarFoto(){
  $('fFoto').innerHTML = FOTO.map((u, i) => `<span><a href="${esc(u)}" target="_blank" rel="noopener">Foto ${i + 1}</a>
    <button class="b" type="button" data-buang-foto="${i}">×</button></span>`).join('');
}
function isiForm(r){
  SUNTING = r; FOTO = r ? [...(r.foto || [])] : [];
  $('fJudul').textContent = r ? 'Ubah kabar' : 'Kabar baru';
  $('fJ').value = r?.judul || ''; $('fT').value = r?.tanggal || new Date().toLocaleDateString('sv');
  $('fJn').value = r?.jenis || 'kuliah_tamu'; $('fTp').value = r?.tempat || '';
  $('fR').value = r?.ringkasan || ''; $('fU').value = r?.tautan || '';
  $('fSimpan').textContent = r ? 'Simpan' : admin() ? 'Terbitkan' : 'Ajukan';
  $('fBatal').hidden = !r; tulis('', ''); gambarFoto();
  if (ADA88) {
    BUKTI = r ? [...(r.bukti || [])] : [];
    document.querySelectorAll('[data-kait]').forEach(c => { c.checked = (r?.keterkaitan || []).includes(c.dataset.kait); });
    document.querySelectorAll('#fMk input').forEach(c => { c.checked = (r?.mata_kuliah || []).includes(c.value); });
    $('fNs').value = r?.narasumber || ''; $('fKs').value = r?.kerjasama_id ?? ''; $('fJm').value = r?.jumlah_mahasiswa ?? '';
    $('fTampil').checked = r ? r.tampil_publik !== false : true;
    $('fMkCari').value = ''; saringMk(); gambarBukti();
  }
}

// Bagian akreditasi (pemilik 2026-11-17): opsional, sebagai bukti pendukung (bukan dasar skor).
function htmlAkreditasi(){
  return `<div class="lebar akr"><div class="akr-judul">Untuk akreditasi (opsional) · bukti pendukung, bukan dasar skor</div>
    <div class="lbl">Keterkaitan</div>
    <div class="cek-baris">${KAIT.map(([k, l]) => `<label><input type="checkbox" data-kait="${k}"> ${l}</label>`).join('')}</div>
    <div class="grid">
      <label>Narasumber dan instansinya<input id="fNs" maxlength="300" placeholder="Ir. Nama, M.T. — PT Contoh"></label>
      <label>Kerja sama induk<select id="fKs"><option value="">(tidak ada)</option>${KS.map(k =>
        `<option value="${k.id}">${esc(k.mitra)}${k.kegiatan ? ' — ' + esc(k.kegiatan) : ''}</option>`).join('')}</select></label>
      <label>Jumlah mahasiswa peserta<input id="fJm" type="number" min="0" max="5000"></label>
    </div>
    <div class="lbl">Mata kuliah terkait <input id="fMkCari" type="search" placeholder="cari kode/nama" style="margin-left:6px"></div>
    <div class="pilih-mk" id="fMk">${MK.map(m => `<label data-cari="${esc((m.kode + ' ' + m.nama).toLowerCase())}">
      <input type="checkbox" value="${esc(m.kode)}"> ${esc(m.kode)} — ${esc(m.nama)}</label>`).join('') || '<span class="ket">Daftar MK kosong.</span>'}</div>
    <div class="lbl">Bukti pendukung (daftar hadir, laporan, materi; PDF/JPG/PNG/DOCX, maks. 10; tidak tampil di situs)</div>
    <div class="aksi" style="margin-top:2px"><input id="fBBerkas" type="file" multiple>
      <button class="b" type="button" id="fBUnggah">Unggah bukti</button></div>
    <div class="foto" id="fBukti"></div>
    <label class="cek-satu"><input type="checkbox" id="fTampil" checked> Tampil di situs publik (beranda dan Kabar kegiatan)</label>
  </div>`;
}
function saringMk(){
  const q = ($('fMkCari')?.value || '').trim().toLowerCase();
  document.querySelectorAll('#fMk label').forEach(l => { l.hidden = !!q && !l.dataset.cari.includes(q) && !l.querySelector('input').checked; });
}
function gambarBukti(){
  $('fBukti').innerHTML = BUKTI.map((u, i) => `<span><a href="${esc(u)}" target="_blank" rel="noopener">Bukti ${i + 1}</a>
    <button class="b" type="button" data-buang-bukti="${i}">×</button></span>`).join('');
}
// Bukti ke Drive lewat Apps Script (privat: daftar hadir memuat nama); kelompok "Kabar - <judul>".
async function unggahBukti(){
  const f = [...$('fBBerkas').files], judul = $('fJ').value.trim(), tanggal = $('fT').value;
  if (!f.length) return tulis('buruk', 'Pilih berkas bukti dulu.');
  if (!judul || !tanggal) return tulis('buruk', 'Isi judul dan tanggal dulu; keduanya menjadi nama folder bukti.');
  if (BUKTI.length + f.length > 10) return tulis('buruk', 'Paling banyak 10 bukti.');
  $('fBUnggah').disabled = true;
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) throw new Error('Sesi login habis. Muat ulang halaman.');
    for (let i = 0; i < f.length; i++) {
      tulis('', `Mengunggah bukti ${i + 1}/${f.length}: ${f[i].name}…`);
      const res = await fetch(window.UPLOAD_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ token: session.access_token, kind: 'karya', year: tanggal.slice(0, 4), group: `Kabar - ${judul}`,
                               privat: true, filename: `Bukti - ${f[i].name}`, data: await keB64(f[i]) }) });
      const out = await res.json();
      if (!out.ok) throw new Error(out.error || 'Unggah gagal.');
      BUKTI.push(out.url);
    }
    $('fBBerkas').value = ''; gambarBukti(); tulis('ok', 'Bukti terunggah; tekan Simpan/Ajukan.');
  } catch (e) { tulis('buruk', e.message || String(e)); }
  finally { $('fBUnggah').disabled = false; }
}

async function unggah(){
  const f = [...$('fF').files], judul = $('fJ').value.trim(), tanggal = $('fT').value;
  if (!f.length) return tulis('buruk', 'Pilih foto dulu.');
  if (!judul || !tanggal) return tulis('buruk', 'Isi judul dan tanggal dulu; keduanya menjadi nama folder foto.');
  if (FOTO.length + f.length > MAKS_FOTO) return tulis('buruk', `Paling banyak ${MAKS_FOTO} foto.`);
  $('fUnggah').disabled = true;
  try { FOTO.push(...await unggahFoto(f, tanggal.slice(0, 4), judul, tulis)); $('fF').value = ''; gambarFoto(); tulis('ok', 'Foto terunggah.'); }
  catch (e) { tulis('buruk', e.message || String(e)); }
  finally { $('fUnggah').disabled = false; }
}

async function simpan(){
  const isi = { judul: $('fJ').value.trim(), tanggal: $('fT').value, jenis: $('fJn').value,
    tempat: $('fTp').value.trim() || null, ringkasan: $('fR').value.trim(), tautan: $('fU').value.trim() || null,
    foto: FOTO, oleh: SAYA.email, diperbarui: new Date().toISOString() };
  if (ADA88) Object.assign(isi, {
    keterkaitan: [...document.querySelectorAll('[data-kait]:checked')].map(c => c.dataset.kait),
    mata_kuliah: [...document.querySelectorAll('#fMk input:checked')].map(c => c.value).slice(0, 10),
    narasumber: $('fNs').value.trim() || null, kerjasama_id: $('fKs').value ? +$('fKs').value : null,
    jumlah_mahasiswa: $('fJm').value === '' ? null : Math.max(0, Math.round(+$('fJm').value)),
    bukti: BUKTI, tampil_publik: $('fTampil').checked });
  if (isi.judul.length < 3) return tulis('buruk', 'Judul minimal 3 huruf.');
  if (!isi.tanggal) return tulis('buruk', 'Isi tanggal kegiatan.');
  if (isi.ringkasan.length < 20) return tulis('buruk', 'Ringkasan minimal 20 huruf.');
  if (isi.tautan && !/^https?:\/\/\S+$/i.test(isi.tautan)) return tulis('buruk', 'Tautan harus diawali http:// atau https://.');
  $('fSimpan').disabled = true;
  try {
    let q;
    // Kabar baru dari admin langsung terbit (pemilik 2026-11-17); dosen mengajukan lalu diverifikasi admin.
    if (!SUNTING) q = sb.from('kabar_kegiatan').insert({ ...isi, status: admin() ? 'terbit' : 'diajukan', dilaporkan_oleh: SAYA.id });
    else if (admin()) q = sb.from('kabar_kegiatan').update(isi).eq('id', SUNTING.id);
    else q = sb.from('kabar_kegiatan').update({ ...isi, status: 'diajukan', catatan: null }).eq('id', SUNTING.id);
    const { error } = await q;
    if (error) throw error;
    const baru = !SUNTING;
    await muat(); isiForm(null);
    tulis('ok', baru ? (admin() ? 'Terbit; tampil di situs paling lambat sejam lagi.' : 'Terkirim; admin akan menerbitkannya.') : 'Tersimpan.');
  } catch (e) { tulis('buruk', 'Gagal: ' + (e.message || e)); }
  finally { $('fSimpan').disabled = false; }
}

async function ubahStatus(id, status, catatan){
  const { error } = await sb.from('kabar_kegiatan').update({ status, catatan: catatan ?? null, diperbarui: new Date().toISOString() }).eq('id', id);
  if (error) return alert('Gagal: ' + error.message);
  await muat();
}

async function klik(ev){
  const t = ev.target.closest('button'); if (!t) return;
  if (t.dataset.buangFoto != null) { FOTO.splice(+t.dataset.buangFoto, 1); gambarFoto(); return; }
  if (t.dataset.buangBukti != null) { BUKTI.splice(+t.dataset.buangBukti, 1); gambarBukti(); return; }
  const r = DATA.find(x => String(x.id) === (t.dataset.ubah || t.dataset.hapus || t.dataset.terbit || t.dataset.tolak || t.dataset.tarik));
  if (!r) return;
  if (t.dataset.ubah) { isiForm(r); $('fJudul').scrollIntoView({ behavior: 'smooth' }); }
  else if (t.dataset.terbit) await ubahStatus(r.id, 'terbit');
  else if (t.dataset.tarik) await ubahStatus(r.id, 'diajukan');
  else if (t.dataset.tolak) { const c = prompt('Catatan untuk pengaju (alasan ditolak):'); if (c?.trim()) await ubahStatus(r.id, 'ditolak', c.trim()); }
  else if (t.dataset.hapus) {
    if (!confirm(`Hapus kabar "${r.judul}"? Foto di Drive tidak ikut terhapus.`)) return;
    const { error } = await sb.from('kabar_kegiatan').delete().eq('id', r.id);
    if (error) return alert('Gagal: ' + error.message);
    await muat();
  }
}

function htmlItem(r){
  const jenis = (JENIS.find(j => j[0] === r.jenis) || [, r.jenis])[1];
  const bolehUbah = admin() || (milik(r) && r.status !== 'terbit');
  return `<div class="item ${esc(r.status)}"><div class="kepala"><span class="status">${STATUS[r.status] || esc(r.status)}</span>
      <span>${tgl(r.tanggal)} · ${esc(jenis)}${r.tempat ? ' · ' + esc(r.tempat) : ''}</span><span>${(r.foto || []).length} foto</span>${ADA88 ? `<span>${(r.bukti || []).length} bukti</span>${
      r.tampil_publik === false ? '<span class="status">tidak tampil di situs</span>' : ''}` : ''}</div>
    ${ADA88 && (r.keterkaitan || []).length ? `<div class="ket">Akreditasi: ${(r.keterkaitan || []).map(k => esc((KAIT.find(x => x[0] === k) || [, k])[1])).join(' · ')}</div>` : ''}
    <div class="judul">${esc(r.judul)}</div><div class="isi">${esc(r.ringkasan)}</div>
    ${r.catatan ? `<div class="ket">Catatan admin: ${esc(r.catatan)}</div>` : ''}
    <div class="aksi">${bolehUbah ? `<button class="b" data-ubah="${r.id}">Ubah</button><button class="b bahaya" data-hapus="${r.id}">Hapus</button>` : ''}
      ${admin() && r.status !== 'terbit' ? `<button class="b" data-terbit="${r.id}">Terbitkan</button>` : ''}
      ${admin() && r.status === 'diajukan' ? `<button class="b" data-tolak="${r.id}">Tolak</button>` : ''}
      ${admin() && r.status === 'terbit' ? `<button class="b" data-tarik="${r.id}">Tarik dari situs</button>` : ''}</div></div>`;
}

async function muat(){
  const { data, error } = await sb.from('kabar_kegiatan').select('*').order('tanggal', { ascending: false }).order('id', { ascending: false });
  if (error) throw new Error(/kabar_kegiatan/.test(error.message) ? 'Tabel kabar belum ada: jalankan supabase/81-patch-kabar-kegiatan.sql.' : error.message);
  DATA = data || [];
  const lihat = admin() ? DATA : DATA.filter(milik);
  if ($('antre')) $('antre').innerHTML = DATA.filter(r => r.status === 'diajukan').map(htmlItem).join('') || '<p class="kosong">Tidak ada yang menunggu.</p>';
  $('daftar').innerHTML = lihat.map(htmlItem).join('') || '<p class="kosong">Belum ada kabar.</p>';
}

async function mulai(){
  SAYA = await gerbang(sb);
  if (!SAYA) return;
  $('hSub').textContent = `Masuk sebagai ${SAYA.nama}`;
  ADA88 = !(await sb.from('kabar_kegiatan').select('keterkaitan').limit(1)).error;
  if (ADA88) {
    const [m, k] = await Promise.all([sb.from('ref_mata_kuliah').select('kode,nama,kurikulum').order('kode'),
                                      sb.from('lkps_kerjasama').select('id,mitra,kegiatan').order('mitra')]);
    MK = [...new Map((m.data || []).map(x => [x.kode, x])).values()];
    KS = k.data || [];
  }
  kerangka();
  await muat();
}
mulai().catch(e => { $('isi').innerHTML = `<p class="kosong">Gagal memuat: ${esc(e.message)}</p>`; });
</script>
