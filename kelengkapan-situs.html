<style>
  /* Kelengkapan situs publik (pemilik 2026-11-21) */
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
  .wrap{max-width:1400px;margin:0 auto;padding:18px 20px 80px}
  .kosong, .ket{color:var(--muted)}
  .ket{font-size:13px}
  .kartu{background:var(--panel);border:1px solid var(--line);padding:14px 18px;margin-bottom:16px}
  .kartu h2{font-size:17px;margin:0 0 6px;color:var(--biru)}
  .alat{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0}
  select{font:inherit;font-size:14px;padding:4px 6px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
  .gulir{overflow-x:auto}
  table.ds{width:100%;border-collapse:collapse;font-size:13.5px}
  table.ds th{text-align:left;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);padding:5px 6px;vertical-align:bottom}
  table.ds td{padding:5px 6px;border-bottom:1px solid var(--line-soft);vertical-align:top}
  table.ds td.n{text-align:right;font-variant-numeric:tabular-nums}
  .kode{font-family:var(--mono);font-size:12px;color:var(--muted)}
  .chip{display:inline-block;font-size:11.5px;padding:1px 6px;border:1px solid var(--line);white-space:nowrap}
  .chip.kosong{color:var(--merah);border-color:var(--merah)} .chip.sebagian{color:#8A5A00;border-color:#8A5A00}
  .chip.terisi{color:var(--hijau);border-color:var(--hijau)} .chip.boleh{color:var(--muted)}
  tr.grup td{background:var(--bg);font-weight:600;color:var(--biru);padding-top:12px}
  .kemajuan{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
  .angka-st{display:flex;flex-direction:column;min-width:130px;padding:8px 10px;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;cursor:pointer;text-align:left}
  .angka-st b{font-size:22px;line-height:1.1} .angka-st span{font-size:12px}
  .angka-st.aktif{border-color:var(--ink);box-shadow:inset 0 -3px 0 var(--merah)}
  @media(max-width:700px){.wrap{padding-left:16px;padding-right:16px}}
</style>
</head>
<body>
<div class="hero" role="region" aria-label="Pembuka halaman"><div class="hero-in">
  <div class="hero-inst" data-identitas></div>
  <h1>Kelengkapan situs publik</h1>
  <div class="sub" id="hSub">Memuat…</div>
</div></div>
<main class="wrap" id="isi"><p class="kosong">Memuat…</p></main>
<script src="config.js?v=2026-11-22-866c27"></script>
<script>
// Galat saat memuat skrip ditampilkan sebagai pesan, bukan halaman kosong.
addEventListener('error', function (e) {
  if (document.getElementById('galat-muat')) return;
  var d = document.createElement('div');
  d.id = 'galat-muat';
  d.style.cssText = 'margin:16px;padding:12px 14px;border:1px solid var(--merah);' +
    'background:var(--merah-m3);color:var(--ink);font:14px/1.5 system-ui,sans-serif';
  d.textContent = 'Halaman gagal dimuat: ' + (e.message || 'galat skrip') +
    '. Tekan Ctrl+Shift+R untuk memuat ulang tanpa cache; bila tetap muncul, kirim pesan ini ke admin.';
  document.body.insertBefore(d, document.body.firstChild);
});
</script>
<script type="module">
// Kelengkapan situs publik (pemilik 2026-11-21): bagian halaman publik yang kosong/sebagian, dari data.json situs ini
// (sama dengan yang dibaca pengunjung). Logika: kelengkapan-situs.js. Hanya admin (menu Pemantauan).
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/+esm';
import { gerbang } from './menu.js?v=2026-11-22-866c27';
import { periksaKelengkapan, ringkasKelengkapan, STATUS_KS, tautanInternal } from './kelengkapan-situs.js?v=2026-11-22-866c27';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sb = createClient(window.SB_URL, window.SB_KEY);
let XS = [], DIPERBARUI = '', F = '', TAUTAN = '';

function gambar(){
  const r = ringkasKelengkapan(XS), nama = Object.fromEntries(STATUS_KS);
  const xs = XS.filter(x => !F || (F === 'boleh' ? x.bolehKosong && x.status === 'kosong' : x.status === F && !(F === 'kosong' && x.bolehKosong)));
  let grup = '';
  const baris = xs.map(x => {
    const kepala = x.halaman.judul !== grup ? (grup = x.halaman.judul,
      `<tr class="grup"><td colspan="5">${esc(x.halaman.judul)} <a class="kode" href="${esc(x.halaman.href)}" target="_blank" rel="noopener">lihat ↗</a></td></tr>`) : '';
    const st = x.bolehKosong && x.status === 'kosong' ? '<span class="chip boleh">Boleh kosong</span>' : `<span class="chip ${x.status}">${nama[x.status]}</span>`;
    const isi = !x.isi ? '' : x.isi.href ? `<a href="${esc(x.isi.href)}">${esc(x.isi.judul)}</a>` : esc(x.isi.judul);
    return `${kepala}<tr><td>${st}</td><td>${esc(x.judul)}</td><td>${esc(x.nilai)}</td><td>${isi}</td><td class="ket">${esc(x.catatan)}</td></tr>`;
  }).join('');
  $('isi').innerHTML = `<div class="kartu"><h2>Bagian situs publik</h2>
    <p class="ket">Dihitung dari data situs publik yang sedang tayang (diperbarui ${esc(DIPERBARUI || '?')}). Isian baru tampil di sini
      setelah pembangunan situs berikutnya (beberapa menit setelah disimpan, paling lama sejam). Bagian yang kosong tidak tampil di
      halaman publik, jadi pengunjung tidak melihat kotak kosong, tetapi halaman terasa sepi.</p>
    <div class="kemajuan">${[...STATUS_KS, ['boleh', 'Boleh kosong']].map(([k, l]) =>
      `<button class="angka-st${F === k ? ' aktif' : ''}" data-st="${k}"><b>${k === 'boleh' ? r.bolehKosong : r[k]}</b><span>${l}</span></button>`).join('')}</div>
    <div class="gulir"><table class="ds"><thead><tr><th>Status</th><th>Bagian</th><th>Isi sekarang</th><th>Isi di</th><th>Catatan</th></tr></thead>
      <tbody>${baris || '<tr><td colspan="5" class="kosong">Tidak ada.</td></tr>'}</tbody></table></div></div>
    <div class="kartu"><h2>Tautan internal rusak</h2>
      <p class="ket">Menjelajahi semua halaman situs publik (sitemap, menu, lalu tautan di tiap halaman) dan membuka setiap tujuan
        sekali. Tautan ke luar situs (DOI, situs mitra) tidak bisa diperiksa dari peramban. Butuh sekitar satu menit.</p>
      <button type="button" class="angka-st" id="cekTautan" style="padding:8px 14px">Periksa tautan internal</button>
      <div id="hasilTautan">${TAUTAN}</div></div>`;
  $('cekTautan').onclick = periksaTautan;
  document.querySelectorAll('[data-st]').forEach(b => { b.onclick = () => { F = F === b.dataset.st ? '' : b.dataset.st; gambar(); }; });
}

// Tautan internal rusak (pemilik 2026-11-22; pindah dari Mutu data): jelajahi halaman situs (paling banyak MAKS_HALAMAN),
// lalu cek setiap tujuan .html sekali. Halaman ruang kerja (noindex) dicek ada atau tidak, tetapi tidak dijelajahi.
const MAKS_HALAMAN = 400;
async function periksaTautan(){
  const tombol = $('cekTautan'), kotak = $('hasilTautan');
  tombol.disabled = true;
  const akar = new URL('./', location.href).href;
  const dikunjungi = new Map(), antre = [], asal = new Map();
  const awal = (u, dari) => { if (!antre.includes(u)) antre.push(u); if (!asal.has(u)) asal.set(u, dari); };
  awal(akar + 'index.html', 'beranda');
  try {
    // sitemap.xml memakai domain situs; dipetakan ke folder ini lewat alamat pertama yang berakhir '/' (beranda).
    const peta = await (await fetch(akar + 'sitemap.xml', { cache: 'no-store' })).text();
    const loc = [...peta.matchAll(/<loc>([^<]+)<\/loc>/g)].map(m => m[1].replace(/&amp;/g, '&'));
    const dasar = loc.find(u => u.endsWith('/')) || '';
    loc.forEach(u => { if (dasar && u.startsWith(dasar)) awal(akar + (u.slice(dasar.length) || 'index.html'), 'sitemap.xml'); });
  } catch { /* tanpa sitemap: mulai dari beranda dan menu */ }
  try {
    const { MENU } = await import('./kerangka.js?v=2026-11-22-866c27');
    MENU.flatMap(m => m.isi).map(x => x.href).filter(h => h && !h.startsWith('#'))
      .forEach(h => { const u = new URL(h, akar); u.hash = ''; u.search = ''; awal(u.href, 'menu kepala'); });
  } catch { /* menu tidak terbaca */ }
  ['privasi.html', 'peta-situs.html', 'ruang-kerja.html'].forEach(h => awal(akar + h, 'kaki halaman'));
  try {
    while (antre.length && dikunjungi.size < MAKS_HALAMAN) {
      const grup = antre.splice(0, 6).filter(u => !dikunjungi.has(u));
      kotak.innerHTML = `<p class="ket">Memeriksa… ${dikunjungi.size} halaman dibaca.</p>`;
      await Promise.all(grup.map(async u => {
        let kode = 0, isi = '';
        try { const r = await fetch(u, { cache: 'no-store' }); kode = r.status; if (r.ok) isi = await r.text(); } catch { kode = 0; }
        dikunjungi.set(u, kode);
        if (kode !== 200 || /<meta name="robots" content="noindex/.test(isi)) return;
        for (const t of tautanInternal(isi, u, akar)) {
          if (!asal.has(t)) asal.set(t, u);
          if (!dikunjungi.has(t) && !antre.includes(t)) antre.push(t);
        }
      }));
    }
    const pendek = u => String(u || '').startsWith(akar) ? u.slice(akar.length) : (u || '?');
    const rusak = [...dikunjungi].filter(([, k]) => k !== 200);
    TAUTAN = `<p class="ket">${dikunjungi.size} halaman diperiksa${antre.length ? ` (berhenti di batas ${MAKS_HALAMAN})` : ''}.</p>`
      + (rusak.length ? `<ol>${rusak.map(([u, k]) => `<li>${esc(pendek(u))} (${k || 'gagal dibuka'}) — ditautkan dari ${esc(pendek(asal.get(u)))}</li>`).join('')}</ol>`
        : '<p><b>Tidak ada tautan rusak.</b></p>');
    kotak.innerHTML = TAUTAN;
  } catch (e) { kotak.innerHTML = `<p class="kosong">Pemeriksaan gagal: ${esc(e.message)}</p>`; }
  finally { tombol.disabled = false; }
}

async function mulai(){
  const saya = await gerbang(sb);
  if (!saya) return;
  $('hSub').textContent = `Masuk sebagai ${saya.nama}`;
  const D = await fetch('data.json', {cache: 'no-cache'}).then(r => { if (!r.ok) throw new Error(`data.json ${r.status}`); return r.json(); });
  DIPERBARUI = D.diperbarui || '';
  XS = periksaKelengkapan(D);
  gambar();
}
mulai().catch(e => { $('isi').innerHTML = `<p class="kosong">Gagal memuat: ${esc(e.message)}</p>`; });
</script>
</body>
</html>
