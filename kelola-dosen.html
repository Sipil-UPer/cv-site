<script>
// Galat saat memuat skrip (mis. modul lama dari cache bercampur dengan
// halaman baru) ditampilkan sebagai pesan, bukan halaman kosong.
addEventListener('error', function (e) {
  if (document.getElementById('galat-muat')) return;
  var d = document.createElement('div');
  d.id = 'galat-muat';
  d.style.cssText = 'margin:16px;padding:12px 14px;border:1px solid var(--merah);' +
    'background:var(--merah-m3);color:var(--ink);font:14px/1.5 system-ui,sans-serif';
  d.textContent = 'Halaman gagal dimuat: ' + (e.message || 'galat skrip') +
    '. Tekan Ctrl+Shift+R untuk memuat ulang tanpa cache; bila tetap muncul, kirim pesan ini ke admin.';
  document.body.insertBefore(d, document.body.firstChild);
});
</script>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/+esm';
import { pasangMenu } from './menu.js?v=2026-11-22-866c27';
import { dosenLogin } from './dosen-login.js?v=2026-11-22-866c27';
import { htmlSaran } from './saran-bukti.js?v=2026-11-22-866c27';
import { unduhCV } from './cv-dosen.js?v=2026-11-22-866c27';
import { KOLOM_PROFIL, KATEGORI, JABATAN,
  formLKPS, bacaFormLKPS, pasangEditor } from './profil-dosen.js?v=2026-11-22-866c27';
import { hitungVerifikasi } from './verifikasi-hitung.js?v=2026-11-22-866c27';
import { KELOMPOK as KELOMPOK_LABEL, URUT_KELOMPOK, kelompokDosen, ampuPerTA, statusTS, hitungTS } from './dosen-hitung.js?v=2026-11-22-866c27';

/* =====================================================================
   KELOLA DOSEN — daftar dosen prodi diisi admin di situs (keputusan
   pemilik 2026-11-03), menggantikan lembar `dosen` di data-prodi.xlsx dan
   `bangun.py --sinkron-dosen`. Tabel `dosen` (supabase/01-skema.sql;
   kolom pendidikan + jabatan sejak supabase/18-patch-dosen-web.sql).
   Hak tulis: policy dosen_admin (admin saja). Aturan isian (dulu juga di
   sinkron_dosen() bangun.py, dipensiunkan 2026-11-04):
     - nidn dan nama wajib; email wajib untuk DTPS dan admin, boleh kosong untuk
       DT/DTT/industri (155, pemilik 2026-11-22); nidn dan email unik; admin staf tanpa NIDN
       memakai NIP/NUP atau kode STAF-001;
     - asesor tidak pernah DTPS;
     - dosen tidak dihapus (karya merujuk ke barisnya): set aktif = tidak.
   Pengaman: admin tidak bisa mencabut peran admin/aktif dirinya sendiri,
   dan selalu tersisa minimal satu admin aktif.
   ===================================================================== */

const esc = s => String(s ?? '').replace(/[&<>"']/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = id => document.getElementById(id);

const SB_URL = window.SB_URL || '', SB_KEY = window.SB_KEY || '';
if (!SB_URL || !SB_KEY || SB_URL.includes('xxxx')) {
  $('isi').innerHTML = '<p class="kosong">config.js belum diisi.</p>';
  throw new Error('config.js belum diisi');
}
const sb = createClient(SB_URL, SB_KEY);

// Nilai sah; sama dengan PERAN_SAH, PETUNJUK_EXCEL dan validasi() di bangun.py.
const PERAN = [['dosen', 'Dosen'], ['admin', 'Admin'], ['pimpinan', 'Pimpinan'], ['asesor', 'Asesor']];
const PERAN_BUKAN_DTPS = ['asesor'];
// Kelompok dosen -> [kunci, label, dtps, kategori] (pemilik 2026-11-10; APS-AV 2025:
// DTPS = dosen tetap berkeahlian sesuai kompetensi inti; industri dihitung DTT).
const KELOMPOK = [
  ['dtps', 'DTPS (dosen tetap, keahlian sesuai kompetensi inti prodi)', true, 'tetap'],
  ['dt', 'Dosen tetap PT dari prodi lain (DT)', false, 'tetap'],
  ['dtt', 'Dosen tidak tetap (DTT)', false, 'tidak_tetap'],
  ['industri', 'Dosen industri/praktisi (dihitung DTT)', false, 'industri'],
  // Pilihan eksplisit untuk staf (pemilik 2026-11-17): admin/tenaga kependidikan tidak dihitung dosen sama sekali.
  ['staf', 'Bukan dosen (admin/tenaga kependidikan): tidak dihitung dosen', false, null],
];
function kelompokDari(r){
  if (r.dtps) return 'dtps';
  // Baris tersimpan tanpa DTPS dan tanpa kategori = bukan dosen (staf); formulir baru tetap kosong.
  return { tetap: 'dt', tidak_tetap: 'dtt', industri: 'industri' }[r.kategori] || (r.id ? 'staf' : '');
}
const PENDIDIKAN = [['', '—'], ['S2', 'S2'], ['S3', 'S3']];
const POLA = {
  sinta_id: [/^[0-9]+$/, 'hanya angka'],
  scopus_id: [/^[0-9]+$/, 'hanya angka'],
  orcid: [/^[0-9]{4}-[0-9]{4}-[0-9]{4}-[0-9]{3}[0-9X]$/i, 'format 0000-0000-0000-0000'],
};
const KOLOM = 'id,nidn,nama,email,peran,pendidikan,jabatan,sinta_id,scopus_id,orcid,aktif,dtps';

// ADA_LKPS: kolom profil LKPS 4.a ada (supabase/22-patch-profil-dosen.sql).
let AMPU = new Map(), SUMBER = new Map(), ADA_AMPU = false;   // 154: mengampu per tahun akademik
let ADA_155 = false;   // 155: kolom boleh_masuk + email boleh kosong
let SAYA = null, DOSEN = [], SUNTING = null, ADA_LKPS = true, ADA_ALT = false, ADA_KK = false, KK = null, ADA_TB = false, ADA_NIP = false, ADA_NUPTK = false, ADA_GELAR = false;

const nama = (daftar, v) => (daftar.find(x => x[0] === (v || '')) || [, v || '—'])[1];
const opsi = (daftar, v) => daftar.map(([k, l]) =>
  `<option value="${esc(k)}"${k === (v || '') ? ' selected' : ''}>${esc(l)}</option>`).join('');

function tulis(jenis, teks){ const m = $('pesan'); m.className = 'msg ' + jenis; m.textContent = teks; }

// Tempel URL profil -> ambil ID-nya (sama dengan id_saja() di bangun.py).
function idSaja(v){
  let s = String(v || '').trim();
  if (!s || ['nan', 'none', '-'].includes(s.toLowerCase())) return '';
  if (/http/i.test(s)) {
    s = s.slice(s.toLowerCase().lastIndexOf('http'));
    const m = s.match(/authorId=([0-9]+)/i);
    if (m) return m[1];
    s = s.replace(/\/+$/, '').split('?')[0].split('#')[0].split('/').pop();
  }
  return s.trim();
}

async function mulai(){
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return layarMasuk();
  const { data: saya } = await dosenLogin(sb, session, 'id,nama,email,peran');
  if (!saya) { $('hSub').textContent = 'Tidak terdaftar'; $('isi').innerHTML = '<p class="kosong">Email belum terdaftar.</p>'; return; }
  SAYA = saya;
  pasangMenu(sb);
  if (saya.peran !== 'admin') {
    $('hSub').textContent = `Masuk sebagai ${saya.nama}`;
    $('isi').innerHTML = '<p class="kosong">Halaman ini khusus admin prodi.</p>';
    return;
  }
  $('hSub').textContent = `Masuk sebagai ${saya.nama} (admin)`;
  $('isi').innerHTML = `
    <div class="info">Daftar orang di situs prodi, dikelompokkan. <b>Peran</b> = hak di situs (Admin, Dosen, Pimpinan, Asesor);
      <b>kelompok</b> = jenis untuk akreditasi: DTPS (dosen tetap, homebase prodi ini), DT bukan DTPS (homebase prodi lain),
      tugas belajar, DTT, industri, dan <b>staf (bukan dosen)</b>. Untuk akreditasi, DTPS/DT/DTT dihitung <b>hanya bila
      mengampu MK prodi pada TS</b> (kelas di Penyusunan kelas, atau centang <b>manual</b> di kolom Mengampu); tugas belajar,
      staf, dan asesor tidak pernah dihitung. Dosen yang pindah tidak dihapus, cukup dinonaktifkan. Skor berubah setelah situs
      dibangun ulang (otomatis tiap jam).</div>
    ${htmlSaran('dosen')}
    <div class="b"><p class="ket" style="margin:0">Ajuan perubahan profil dari dosen diputuskan di
      <a href="verifikasi.html#profil">halaman Verifikasi</a><span id="nProfil"></span>.</p></div>
    <div class="b" id="form"></div>
    <h2>Daftar dosen</h2>
    <div class="gulir" id="daftar"><p class="kosong">Memuat&hellip;</p></div>`;
  await muat();
  hitungVerifikasi(sb).then(n => { if (n.profil) $('nProfil').textContent = ` (${n.profil} menunggu)`; });
}

// Ajuan perubahan profil diputuskan di verifikasi.html (verifikasi-profil.js,
// pemilik 2026-11-08).

async function muat(){
  let { data, error } = await sb.from('dosen').select(KOLOM + ',' + KOLOM_PROFIL).order('nama');
  if (error && /kategori|riwayat|column/i.test(error.message)) {   // patch 22 belum dijalankan
    ADA_LKPS = false;
    ({ data, error } = await sb.from('dosen').select(KOLOM).order('nama'));
  }
  if (error) {
    const kolomHilang = /pendidikan|jabatan|column/i.test(error.message);
    $('daftar').innerHTML = `<p class="kosong">Daftar dosen tidak bisa dibaca: ${esc(error.message)}${
      kolomHilang ? '. Jalankan supabase/18-patch-dosen-web.sql di Supabase.' : ''}</p>`;
    $('form').innerHTML = '';
    return;
  }
  DOSEN = data || [];
  // Email alternatif untuk masuk (patch 69); kueri terpisah supaya daftar tetap tampil sebelum patch.
  const alt = await sb.from('dosen').select('id,email_alternatif');
  ADA_ALT = !alt.error;
  if (ADA_ALT) { const m = new Map((alt.data || []).map(x => [x.id, x.email_alternatif])); DOSEN.forEach(d => { d.email_alternatif = m.get(d.id) ?? null; }); }
  // Kelompok keahlian (patch 86, pemilik 2026-11-17): kolom dibaca terpisah; daftar KK dari data.json
  // (config.yaml public_site.expertise_groups), supaya daftarnya hanya ada di satu tempat.
  const kq = await sb.from('dosen').select('id,kelompok_keahlian');
  ADA_KK = !kq.error;
  if (ADA_KK) { const m = new Map((kq.data || []).map(x => [x.id, x.kelompok_keahlian])); DOSEN.forEach(d => { d.kelompok_keahlian = m.get(d.id) ?? null; }); }
  // Tugas belajar (patch 87, pemilik 2026-11-17): tampil di situs, tidak dihitung DTPS; kolom dibaca terpisah.
  const tq = await sb.from('dosen').select('id,tugas_belajar');
  ADA_TB = !tq.error;
  if (ADA_TB) { const m = new Map((tq.data || []).map(x => [x.id, x.tugas_belajar])); DOSEN.forEach(d => { d.tugas_belajar = m.get(d.id) ?? null; }); }
  // NIP (patch 89, pemilik 2026-11-17): tampil di situs untuk mahasiswa; kolom dibaca terpisah.
  const nq = await sb.from('dosen').select('id,nip');
  ADA_NIP = !nq.error;
  if (ADA_NIP) { const m = new Map((nq.data || []).map(x => [x.id, x.nip])); DOSEN.forEach(d => { d.nip = m.get(d.id) ?? null; }); }
  // NUPTK (patch 128, pemilik 2026-11-20): diisi dosen di Profil atau admin di sini; tidak tampil di situs publik.
  const uq = await sb.from('dosen').select('id,nuptk');
  ADA_NUPTK = !uq.error;
  if (ADA_NUPTK) { const m = new Map((uq.data || []).map(x => [x.id, x.nuptk])); DOSEN.forEach(d => { d.nuptk = m.get(d.id) ?? null; }); }
  // Nama dengan gelar (patch 111): lembar pengesahan RPS; kolom dibaca terpisah.
  const gq = await sb.from('dosen').select('id,nama_gelar');
  ADA_GELAR = !gq.error;
  if (ADA_GELAR) { const m = new Map((gq.data || []).map(x => [x.id, x.nama_gelar])); DOSEN.forEach(d => { d.nama_gelar = m.get(d.id) ?? null; }); }
  // Boleh masuk (patch 155, pemilik 2026-11-22): DT/DTT bisa ada di daftar tanpa bisa masuk; kolom dibaca terpisah.
  const bm = await sb.from('dosen').select('id,boleh_masuk');
  ADA_155 = !bm.error;
  if (ADA_155) { const m = new Map((bm.data || []).map(x => [x.id, x.boleh_masuk])); DOSEN.forEach(d => { d.boleh_masuk = m.get(d.id) ?? true; }); }
  if (KK === null) KK = await fetch('data.json', {cache: 'no-cache'}).then(r => r.ok ? r.json() : {}).then(d => d.situs?.kelompok_keahlian || []).catch(() => []);
  await muatAmpu();
  gambarDaftar();
  isiForm(SUNTING ? DOSEN.find(d => d.id === SUNTING) : null);
}

// Mengampu MK per tahun akademik (154): kelas Penyusunan kelas + centang manual; tabel yang belum ada dibaca kosong.
async function muatAmpu(){
  const baca = q => q.then(r => ({ ok: !r.error, data: r.error ? [] : (r.data || []) }), () => ({ ok: false, data: [] }));
  const [kl, kd, man] = await Promise.all([baca(sb.from('kelas_kuliah').select('id,tahun_akademik')),
    baca(sb.from('kelas_dosen').select('kelas_id,dosen_id')), baca(sb.from('dosen_ampu_ts').select('dosen_id,tahun_akademik'))]);
  ADA_AMPU = man.ok;
  AMPU = ampuPerTA({ kelas: kl.data, kd: kd.data, manual: man.data });
  const taKelas = new Map(kl.data.map(k => [k.id, k.tahun_akademik]));
  SUMBER = new Map();
  const catat = (ta, id, s) => { if (!ta) return; if (!SUMBER.has(ta)) SUMBER.set(ta, new Map()); if (SUMBER.get(ta).get(id) !== 'kelas') SUMBER.get(ta).set(id, s); };
  kd.data.forEach(r => catat(taKelas.get(r.kelas_id), r.dosen_id, 'kelas'));
  man.data.forEach(r => catat(r.tahun_akademik, r.dosen_id, 'manual'));
}

// Daftar per kelompok dan status hitungan pada TS (154, pemilik 2026-11-22): DTPS, DT bukan DTPS, tugas belajar, DTT,
// industri, pimpinan, staf (bukan dosen), asesor. "Dihitung TS" = masuk NDTPS/NDT/NDTT pada TS terpilih (dosen-hitung.js,
// aturan yang sama dengan bangun.py dan Skor). "Mengampu" = punya kelas di Penyusunan kelas pada TS itu, atau dicentang.
const tsBerjalanKD = () => { const d = new Date(); return d.getMonth() >= 8 ? d.getFullYear() + 1 : d.getFullYear(); };
let TS_KD = null;
function gambarDaftar(){
  TS_KD ??= tsBerjalanKD();
  const ta = `${TS_KD - 1}/${TS_KD}`, h = hitungTS(DOSEN, ta, AMPU);
  const pilihTS = [0, 1, 2].map(n => tsBerjalanKD() - n).map(x => `<option value="${x}"${x === TS_KD ? ' selected' : ''}>${x - 1}/${x}</option>`).join('');
  const kolomKK = ADA_KK && KK.length;
  const baris = d => {
    const st = statusTS(d, ta, AMPU, SUMBER), dosenProdi = !['staf', 'pimpinan', 'asesor'].includes(st.kelompok);
    const ampu = !dosenProdi ? '—' : SUMBER.get(ta)?.get(d.id) === 'kelas' ? 'ya (kelas)'
      : ADA_AMPU ? `<label class="cek"><input type="checkbox" data-ampu="${esc(d.id)}"${SUMBER.get(ta)?.get(d.id) === 'manual' ? ' checked' : ''}> manual</label>` : '—';
    const hitung = st.dtps ? 'DTPS' : st.dt ? 'DT' : st.dtt ? 'DTT' : `<span class="ket">tidak${st.alasan ? ': ' + esc(st.alasan) : ''}</span>`;
    return `<tr class="${d.id === SUNTING ? 'sunting' : ''}${d.aktif ? '' : ' nonaktif'}">
      <td>${esc(d.nama)}${d.tugas_belajar ? `<div class="ket">${esc(d.tugas_belajar)}</div>` : ''}</td><td>${esc(d.nidn)}</td><td>${d.email ? esc(d.email) : '<span class="ket">tanpa email</span>'}${
        ADA_155 && d.boleh_masuk === false ? '<div class="ket">tidak boleh masuk</div>' : ''}</td>
      <td>${esc(nama(PERAN, d.peran))}</td><td>${esc(d.pendidikan || '—')}</td><td>${esc(nama(JABATAN, d.jabatan))}</td>
      ${kolomKK ? `<td>${esc(KK.find(k => k.kode === d.kelompok_keahlian)?.nama || '—')}</td>` : ''}<td>${d.aktif ? 'ya' : 'tidak'}</td>
      <td>${ampu}</td><td>${hitung}</td>
      <td><button class="btn ghost kecil" data-ubah="${esc(d.id)}">Ubah</button>
        <button class="btn ghost kecil" data-cv-dosen="${esc(d.id)}" title="Unduh CV dosen ini (.docx)">CV</button></td></tr>`;
  };
  const grup = URUT_KELOMPOK.map(k => [k, DOSEN.filter(d => kelompokDosen(d) === k)]).filter(([, xs]) => xs.length);
  $('daftar').innerHTML = `<div class="b ringkas-ts"><label>TS <select id="ts_kd">${pilihTS}</select></label>
      <b>NDTPS ${h.ndtps}</b> · <b>NDT ${h.ndt}</b> · <b>NDTT ${h.ndtt}</b>${h.industri ? ` (${h.industri} industri)` : ''}
      <div class="ket">${h.diterapkan ? `Hanya dosen yang mengampu MK prodi pada ${ta} yang dihitung (kelas di
        <a href="kelas.html">Penyusunan kelas</a> atau centang <b>manual</b> di kolom Mengampu)${h.tidakMengampu.length ? `; tidak mengampu: ${esc(h.tidakMengampu.join(', '))}` : ''}.`
        : `Belum ada data mengampu MK untuk ${ta} (kelas atau centang), jadi syarat mengampu <b>belum diterapkan</b>: semua dosen aktif
        sesuai kelompoknya dihitung. Centang <b>manual</b> dosen yang mengampu, atau susun kelasnya di <a href="kelas.html">Penyusunan kelas</a>.`}
        ${ADA_AMPU ? '' : ' Centang manual tersedia setelah supabase/154-patch-dosen-mengampu-ts.sql dijalankan.'}
        Tugas belajar, staf, pimpinan bukan dosen prodi, dan asesor tidak pernah dihitung. Skor berubah setelah situs dibangun ulang.</div></div>
    <p class="ket">${DOSEN.length} orang.${ADA_LKPS ? '' : ' Profil LKPS 4.a belum tersedia: jalankan supabase/22-patch-profil-dosen.sql.'}
      <label class="ket" style="margin-left:12px">CV: <select id="cv_gaya"><option value="cv">CV akademik</option>
        <option value="hibah">Biodata pengusul hibah (A–J)</option></select> periode karya <select id="cv_periode"><option value="semua">semua tahun</option>
        <option value="5">5 tahun terakhir</option></select></label> <span class="msg" id="cv_msg"></span></p>
    ${grup.map(([k, xs]) => `<h3 class="kel">${esc(KELOMPOK_LABEL[k])} <span class="ket">${xs.length} orang</span></h3>
    <table class="t"><thead><tr><th>Nama</th><th>NIDN/kode</th><th>Email</th><th>Peran</th><th>Pendidikan</th><th>Jabatan</th>
      ${kolomKK ? '<th>KK</th>' : ''}<th>Aktif</th><th>Mengampu ${esc(ta)}</th><th>Dihitung TS</th><th></th></tr></thead>
      <tbody>${xs.map(baris).join('')}</tbody></table>`).join('')}`;
  $('ts_kd').onchange = e => { TS_KD = +e.target.value; gambarDaftar(); };
  $('daftar').querySelectorAll('[data-ampu]').forEach(c => { c.onchange = async () => {
    c.disabled = true;
    const ta2 = `${TS_KD - 1}/${TS_KD}`;
    const { error } = c.checked
      ? await sb.from('dosen_ampu_ts').insert({ dosen_id: c.dataset.ampu, tahun_akademik: ta2, oleh: SAYA.email })
      : await sb.from('dosen_ampu_ts').delete().eq('dosen_id', c.dataset.ampu).eq('tahun_akademik', ta2);
    if (error) { tulis('err', 'Centang mengampu gagal: ' + error.message); c.checked = !c.checked; c.disabled = false; return; }
    await muatAmpu(); gambarDaftar();
  }; });
  // CV dosen otomatis (pemilik 2026-11-11): admin mengunduh CV dosen mana pun.
  $('daftar').querySelectorAll('[data-cv-dosen]').forEach(b => {
    b.onclick = async () => {
      const d = DOSEN.find(x => x.id === b.dataset.cvDosen), m = $('cv_msg');
      b.disabled = true; m.textContent = `Menyusun CV ${d.nama}…`;
      try { await unduhCV(d, $('cv_periode').value, $('cv_gaya').value, sb); m.textContent = `Berkas ${d.nama} diunduh.`; }
      catch (err) { m.textContent = 'Gagal: ' + (err.message || err); }
      finally { b.disabled = false; }
    };
  });
  $('daftar').querySelectorAll('[data-ubah]').forEach(b => {
    b.onclick = () => { SUNTING = b.dataset.ubah; gambarDaftar(); isiForm(DOSEN.find(d => d.id === SUNTING));
                        $('form').scrollIntoView({ behavior: 'smooth' }); };
  });
}

function isiForm(d){
  const r = d || { peran: 'dosen', aktif: true, dtps: true };
  const diriSendiri = d && d.id === SAYA.id;
  $('form').innerHTML = `
    <p class="ket"><b>${d ? 'Ubah: ' + esc(d.nama) : 'Tambah dosen atau admin'}</b>${
      diriSendiri ? ' — ini akun Anda sendiri: peran admin dan aktif tidak bisa dicabut di sini.' : ''}</p>
    <div class="grid">
      <div class="fld"><label>Nama lengkap <span class="wj">*</span></label><input id="f_nama" value="${esc(r.nama)}"></div>
      <div class="fld"><label>NIDN <span class="wj">*</span></label><input id="f_nidn" value="${esc(r.nidn)}">
        <small>Admin staf tanpa NIDN: NIP/NUP, atau kode STAF-001.</small></div>
      ${ADA_GELAR ? `<div class="fld"><label>Nama dengan gelar</label><input id="f_gelar" maxlength="200" value="${esc(r.nama_gelar || '')}">
        <small>Lembar pengesahan RPS, mis. "Dr. Nama, S.T., M.T.". Dosen juga bisa mengisinya sendiri di Profil.</small></div>` : ''}
      ${ADA_NIP ? `<div class="fld"><label>NIP</label><input id="f_nip" maxlength="40" value="${esc(r.nip || '')}">
        <small>Tampil di situs (daftar dan halaman dosen) untuk keperluan mahasiswa. Kosong = tidak tampil.${ADA_NUPTK ? ' Dosen juga bisa mengisinya sendiri di Profil.' : ''}</small></div>` : ''}
      ${ADA_NUPTK ? `<div class="fld"><label>NUPTK</label><input id="f_nuptk" maxlength="40" value="${esc(r.nuptk || '')}">
        <small>Biasanya 16 angka. Tidak tampil di situs publik. Dosen juga bisa mengisinya sendiri di Profil.</small></div>` : ''}
      <div class="fld"><label>Email kampus${ADA_155 ? '' : ' <span class="wj">*</span>'}</label><input id="f_email" type="email" value="${esc(r.email)}">
        <small>Dipakai untuk masuk situs.${ADA_155 ? ' Wajib untuk DTPS dan admin; DT, DTT, dan industri boleh kosong (= tidak bisa masuk).' : ''}</small></div>
      ${ADA_ALT ? `<div class="fld"><label>Email alternatif untuk masuk</label><input id="f_email_alternatif" type="email"
        value="${esc(r.email_alternatif)}" placeholder="mis. nama@gmail.com">
        <small>Bila tautan masuk tidak sampai ke email kampus. Data tetap atas email kampus.</small></div>` : ''}
      <div class="fld"><label>Peran</label><select id="f_peran"${diriSendiri ? ' disabled' : ''}>${opsi(PERAN, r.peran)}</select>
        <small>Admin: verifikasi dan data prodi. Pimpinan: skor + rincian per dosen. Asesor: lihat skor.</small></div>
      <div class="fld"><label>Pendidikan tertinggi</label><select id="f_pendidikan">${opsi(PENDIDIKAN, r.pendidikan)}</select></div>
      <div class="fld"><label>Jabatan akademik</label><select id="f_jabatan">${opsi(JABATAN, r.jabatan)}</select></div>
      ${ADA_KK && KK.length ? `<div class="fld"><label>Kelompok keahlian</label><select id="f_kk"><option value="">(belum ditetapkan)</option>${
        KK.map(k => `<option value="${esc(k.kode)}"${r.kelompok_keahlian === k.kode ? ' selected' : ''}>${esc(k.nama)}</option>`).join('')}</select>
        <small>Pengelompokan di daftar dosen publik.</small></div>` : ''}
      ${ADA_TB ? `<div class="fld"><label>Sedang tugas belajar (keterangan)</label><input id="f_tb" maxlength="200"
        value="${esc(r.tugas_belajar || '')}" placeholder="S3, Kyoto University (2024–2028)">
        <small>Diisi = tampil di situs dengan keterangan ini, tetapi tidak dihitung DTPS. Kosongkan bila sudah kembali.</small></div>` : ''}
      <div class="fld"><label>SINTA ID</label><input id="f_sinta_id" value="${esc(r.sinta_id)}"></div>
      <div class="fld"><label>Scopus ID</label><input id="f_scopus_id" value="${esc(r.scopus_id)}"></div>
      <div class="fld"><label>ORCID</label><input id="f_orcid" value="${esc(r.orcid)}"></div>
      <div class="fld"><label>Status</label>
        <label class="cek"><input type="checkbox" id="f_aktif"${r.aktif ? ' checked' : ''}${diriSendiri ? ' disabled' : ''}>Aktif (masih bertugas; nonaktif = tidak masuk dan tidak dihitung)</label>
        ${ADA_155 ? `<label class="cek"><input type="checkbox" id="f_boleh_masuk"${r.boleh_masuk !== false ? ' checked' : ''}${diriSendiri ? ' disabled' : ''}>Boleh masuk situs (menginput data)</label>
        <small>Tanpa centang: tetap di daftar dan dihitung bila mengampu, tetapi tidak bisa masuk; kelasnya diinput koordinator MK atau admin.</small>` : ''}
        ${ADA_LKPS ? '' : `<label class="cek"><input type="checkbox" id="f_dtps"${r.dtps ? ' checked' : ''}>Dihitung DTPS prodi</label>`}</div>
      ${ADA_LKPS ? `<div class="fld"><label>Kelompok dosen</label>
        ${KELOMPOK.map(([k, ket]) => `<label class="cek"><input type="checkbox" data-kelompok="${k}"${
          kelompokDari(r) === k ? ' checked' : ''}>${ket}</label>`).join('')}
        <small>Pilih satu; yang lain terkunci sampai centangnya dilepas. DTPS mengisi datanya sendiri;
          DT prodi lain, DTT, dan industri diisi admin. Hanya yang <b>Aktif</b> dihitung di butir 26 dan Tabel 4.a.
          Kosongkan untuk staf/asesor yang bukan dosen.</small></div>` : ''}
    </div>
    ${ADA_LKPS ? `<details style="margin-top:14px"><summary><b>Profil untuk LKPS (Tabel 4.a)</b></summary>
      <div class="grid" style="margin-top:10px">
        <div class="fld"><label>Penilaian prodi</label>
          <label class="cek"><input type="checkbox" id="f_sesuai_kompetensi_inti"${r.sesuai_kompetensi_inti ? ' checked' : ''}>Sesuai kompetensi inti PS</label>
          <label class="cek"><input type="checkbox" id="f_sesuai_keahlian_mk"${r.sesuai_keahlian_mk ? ' checked' : ''}>Bidang keahlian sesuai MK yang diampu</label></div>
      </div>
      ${formLKPS(r)}</details>` : ''}
    <div class="aksi"><button class="btn" id="simpan">${d ? 'Simpan perubahan' : 'Tambah'}</button>
      ${d ? '<button class="btn ghost" id="batal">Batal</button>' : ''}<span class="msg" id="pesan"></span></div>`;
  // Kelompok saling meniadakan (pemilik 2026-11-10): satu dicentang, sisanya terkunci.
  const sinkronDtps = () => {
    const asesor = PERAN_BUKAN_DTPS.includes($('f_peran').value);
    if (!ADA_LKPS) {
      $('f_dtps').disabled = asesor;
      if (asesor) $('f_dtps').checked = false;
      return;
    }
    const kotak = [...document.querySelectorAll('[data-kelompok]')];
    if (asesor) kotak.forEach(c => { c.checked = false; });
    const pilih = kotak.find(c => c.checked);
    kotak.forEach(c => { c.disabled = asesor || (pilih && c !== pilih); });
    // Bawaan boleh masuk (155): formulir baru DT/DTT/industri tanpa centang, selama admin belum mengubahnya sendiri.
    const bm = $('f_boleh_masuk');
    if (bm && !d && !bm.dataset.disentuh) bm.checked = !['dt', 'dtt', 'industri'].includes(pilih?.dataset.kelompok);
    if (bm && !diriSendiri) { const admin = $('f_peran').value === 'admin'; bm.disabled = admin; if (admin) bm.checked = true; }
    const inti = $('f_sesuai_kompetensi_inti');
    const dtps = pilih?.dataset.kelompok === 'dtps';
    if (dtps) inti.checked = true;   // DTPS = keahlian sesuai kompetensi inti
    inti.disabled = dtps;
  };
  document.querySelectorAll('[data-kelompok]').forEach(c => { c.onchange = sinkronDtps; });
  $('f_peran').onchange = sinkronDtps;
  if ($('f_boleh_masuk')) $('f_boleh_masuk').onchange = e => { e.target.dataset.disentuh = '1'; };
  sinkronDtps();
  if (ADA_LKPS) pasangEditor($('form'));
  $('simpan').onclick = simpan;
  if (d) $('batal').onclick = () => { SUNTING = null; gambarDaftar(); isiForm(null); };
}

async function simpan(){
  const v = k => $('f_' + k).value.trim();
  const isi = {
    nama: v('nama'), nidn: v('nidn'), email: v('email').toLowerCase() || null, peran: $('f_peran').value,
    pendidikan: v('pendidikan') || null, jabatan: v('jabatan') || null,
    sinta_id: idSaja(v('sinta_id')) || null, scopus_id: idSaja(v('scopus_id')) || null,
    orcid: idSaja(v('orcid')) || null,
    aktif: $('f_aktif').checked, dtps: ADA_LKPS ? false : $('f_dtps').checked,
  };
  if (ADA_KK && $('f_kk')) isi.kelompok_keahlian = $('f_kk').value || null;
  if (ADA_GELAR && $('f_gelar')) {
    isi.nama_gelar = $('f_gelar').value.trim().replace(/\s+/g, ' ') || null;
    if (isi.nama_gelar && isi.nama_gelar.length < 3) return tulis('buruk', 'Nama dengan gelar paling sedikit 3 huruf.');
  }
  if (ADA_NIP && $('f_nip')) {
    isi.nip = $('f_nip').value.trim().replace(/\s+/g, ' ') || null;
    if (isi.nip && !/^[0-9A-Za-z][0-9A-Za-z ./-]{1,38}[0-9A-Za-z]$/.test(isi.nip))
      return tulis('buruk', 'NIP: 3–40 karakter berupa angka, huruf, spasi, titik, garis miring, atau tanda hubung.');
  }
  if (ADA_NUPTK && $('f_nuptk')) {
    isi.nuptk = $('f_nuptk').value.trim().replace(/\s+/g, ' ') || null;
    if (isi.nuptk && !/^[0-9A-Za-z][0-9A-Za-z ./-]{1,38}[0-9A-Za-z]$/.test(isi.nuptk))
      return tulis('buruk', 'NUPTK: 3–40 karakter berupa angka, huruf, spasi, titik, garis miring, atau tanda hubung.');
  }
  const kel = KELOMPOK.find(([k]) => document.querySelector(`[data-kelompok="${k}"]`)?.checked);
  if (ADA_LKPS) Object.assign(isi, bacaFormLKPS(isi.pendidikan), {
    dtps: kel ? kel[2] : false,
    kategori: kel ? kel[3] : null,
    sesuai_kompetensi_inti: $('f_sesuai_kompetensi_inti').checked,
    sesuai_keahlian_mk: $('f_sesuai_keahlian_mk').checked,
  });
  // Tugas belajar (patch 87): tidak dihitung DTPS (aturan basis data); kategori dosen tetap (DT). Sesudah
  // isian LKPS di atas, supaya pilihan kelompok DTPS tidak menimpanya.
  if (ADA_TB && $('f_tb')) {
    isi.tugas_belajar = $('f_tb').value.trim() || null;
    if (isi.tugas_belajar) { isi.dtps = false; if (ADA_LKPS) isi.kategori = 'tetap'; }
  }
  if (PERAN_BUKAN_DTPS.includes(isi.peran)) isi.dtps = false;
  if (!isi.nama || !isi.nidn) return tulis('buruk', 'Nama dan NIDN/kode wajib diisi.');
  // Email (155, pemilik 2026-11-22): wajib untuk DTPS dan admin; DT/DTT/industri boleh kosong. Sebelum patch: selalu wajib.
  if (!isi.email && (!ADA_155 || isi.dtps || isi.peran === 'admin'))
    return tulis('buruk', ADA_155 ? 'Email wajib untuk DTPS dan admin.' : 'Nama, NIDN/kode, dan email wajib diisi.');
  if (isi.email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(isi.email)) return tulis('buruk', 'Email tidak sah.');
  if (ADA_155 && $('f_boleh_masuk')) isi.boleh_masuk = isi.peran === 'admin' || $('f_boleh_masuk').checked;
  // Pengaman (pemilik 2026-11-17): admin bisa dosen atau staf; staf tidak boleh terhitung DTPS karena lupa mengganti kelompok.
  const sudahDtps = !!(SUNTING && DOSEN.find(d => d.id === SUNTING)?.dtps);   // admin dosen yang sudah DTPS: tanpa tanya ulang
  if (isi.peran === 'admin' && isi.dtps && !sudahDtps && !confirm(`${isi.nama} berperan Admin dan bertanda DTPS (dihitung dosen tetap prodi untuk `
      + 'akreditasi). Lanjutkan hanya bila ia memang dosen tetap prodi; untuk staf/tenaga kependidikan pilih "Bukan dosen".')) return;
  const lain = DOSEN.filter(d => d.id !== SUNTING);
  if (lain.some(d => String(d.nidn).toLowerCase() === isi.nidn.toLowerCase()))
    return tulis('buruk', `NIDN/kode ${isi.nidn} sudah dipakai.`);
  if (isi.email && lain.some(d => String(d.email || '').toLowerCase() === isi.email))
    return tulis('buruk', `Email ${isi.email} sudah terdaftar.`);
  if (ADA_ALT) {
    isi.email_alternatif = v('email_alternatif').toLowerCase() || null;
    const alt = isi.email_alternatif;
    if (alt && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(alt)) return tulis('buruk', 'Email alternatif tidak sah.');
    if (alt && alt === isi.email) return tulis('buruk', 'Email alternatif sama dengan email kampus.');
    if (alt && lain.some(d => [d.email, d.email_alternatif].map(x => String(x || '').toLowerCase()).includes(alt)))
      return tulis('buruk', `Email ${alt} sudah dipakai dosen lain.`);
    if (isi.email && lain.some(d => String(d.email_alternatif || '').toLowerCase() === isi.email))
      return tulis('buruk', `Email ${isi.email} sudah menjadi email alternatif dosen lain.`);
  }
  if (SUNTING === SAYA.id) { isi.peran = 'admin'; isi.aktif = true; if (ADA_155) isi.boleh_masuk = true; }
  const adminTersisa = lain.some(d => d.peran === 'admin' && d.aktif) || (isi.peran === 'admin' && isi.aktif);
  if (!adminTersisa) return tulis('buruk', 'Harus tersisa minimal satu admin aktif.');
  const ingat = Object.entries(POLA)
    .filter(([k, [re]]) => isi[k] && !re.test(isi[k]))
    .map(([k, [, ket]]) => `${k} (${ket})`);
  if (ingat.length && !confirm(`Format ${ingat.join(', ')} tidak sesuai; tautan profil mungkin tidak berfungsi. Tetap simpan?`)) return;

  $('simpan').disabled = true;
  const { error } = SUNTING
    ? await sb.from('dosen').update({ ...isi, diubah_pada: new Date().toISOString() }).eq('id', SUNTING)
    : await sb.from('dosen').insert(isi);
  if (error) { $('simpan').disabled = false; return tulis('buruk', 'Gagal menyimpan: ' + error.message); }
  const baru = !SUNTING;
  SUNTING = null;
  await muat();
  const bisaMasuk = isi.email && isi.aktif && isi.boleh_masuk !== false;
  tulis('ok', baru ? `${isi.nama} ditambahkan. ${bisaMasuk ? `Ia sekarang bisa masuk dengan ${isi.email}.`
    : 'Ia tidak bisa masuk situs (tanpa email, nonaktif, atau tidak boleh masuk).'}` : 'Perubahan tersimpan.');
}

function layarMasuk(){
  $('hSub').textContent = 'Perlu masuk';
  $('isi').innerHTML = `<div class="masuk"><p>Masukkan email kampus Anda — tautan masuk dikirim tanpa kata sandi.</p>
    <input id="em" type="email" placeholder="nama@kampus.ac.id" autocomplete="email">
    <button class="btn" id="kirim">Kirim tautan masuk</button><p class="ket" id="pesan"></p></div>`;
  $('kirim').onclick = async () => {
    const em = $('em').value.trim();
    if (!em) return;
    const { error } = await sb.auth.signInWithOtp({ email: em, options: { emailRedirectTo: location.href } });
    $('pesan').textContent = error ? 'Gagal: ' + error.message : 'Tautan masuk sudah dikirim. Periksa email Anda.';
  };
}

sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_IN' && !SAYA) mulai(); });
mulai().catch(e => { $('isi').innerHTML = `<p class="kosong">${esc(e.message)}</p>`; });
</script>
