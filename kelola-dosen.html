<style>
  *{box-sizing:border-box}

  .hero{background:var(--biru);color:#fff;border-bottom:4px solid var(--merah)}
  .hero-in{max-width:1100px;margin:0 auto;padding:26px 20px 24px}

    font-family:var(--mono);font-size:11px;letter-spacing:.1em;

<script>
// Galat saat memuat skrip (mis. modul lama dari cache bercampur dengan
// halaman baru) ditampilkan sebagai pesan, bukan halaman kosong.
addEventListener('error', function (e) {
  if (document.getElementById('galat-muat')) return;
  var d = document.createElement('div');
  d.id = 'galat-muat';
  d.style.cssText = 'margin:16px;padding:12px 14px;border:1px solid var(--merah);' +
    'background:var(--merah-m3);color:var(--ink);font:14px/1.5 system-ui,sans-serif';
  d.textContent = 'Halaman gagal dimuat: ' + (e.message || 'galat skrip') +
    '. Tekan Ctrl+Shift+R untuk memuat ulang tanpa cache; bila tetap muncul, kirim pesan ini ke admin.';
  document.body.insertBefore(d, document.body.firstChild);
});
</script>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
import { pasangMenu } from './menu.js?v=2026-11-14-64b5ca';
import { dosenLogin } from './dosen-login.js?v=2026-11-14-64b5ca';
import { htmlSaran } from './saran-bukti.js?v=2026-11-14-64b5ca';
import { unduhCV } from './cv-dosen.js?v=2026-11-14-64b5ca';
import { KOLOM_PROFIL, KATEGORI, JABATAN,
  formLKPS, bacaFormLKPS, pasangEditor } from './profil-dosen.js?v=2026-11-14-64b5ca';
import { hitungVerifikasi } from './verifikasi-hitung.js?v=2026-11-14-64b5ca';

/* =====================================================================
   KELOLA DOSEN — daftar dosen prodi diisi admin di situs (keputusan
   pemilik 2026-11-03), menggantikan lembar `dosen` di data-prodi.xlsx dan
   `bangun.py --sinkron-dosen`. Tabel `dosen` (supabase/01-skema.sql;
   kolom pendidikan + jabatan sejak supabase/18-patch-dosen-web.sql).
   Hak tulis: policy dosen_admin (admin saja). Aturan isian (dulu juga di
   sinkron_dosen() bangun.py, dipensiunkan 2026-11-04):
     - nidn, nama, email wajib; nidn dan email unik; admin staf tanpa NIDN
       memakai NIP/NUP atau kode STAF-001;
     - asesor tidak pernah DTPS;
     - dosen tidak dihapus (karya merujuk ke barisnya): set aktif = tidak.
   Pengaman: admin tidak bisa mencabut peran admin/aktif dirinya sendiri,
   dan selalu tersisa minimal satu admin aktif.
   ===================================================================== */

const esc = s => String(s ?? '').replace(/[&<>"']/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = id => document.getElementById(id);

const SB_URL = window.SB_URL || '', SB_KEY = window.SB_KEY || '';
if (!SB_URL || !SB_KEY || SB_URL.includes('xxxx')) {
  $('isi').innerHTML = '<p class="kosong">config.js belum diisi.</p>';
  throw new Error('config.js belum diisi');
}
const sb = createClient(SB_URL, SB_KEY);

// Nilai sah; sama dengan PERAN_SAH, PETUNJUK_EXCEL dan validasi() di bangun.py.
const PERAN = [['dosen', 'Dosen'], ['admin', 'Admin'], ['pimpinan', 'Pimpinan'], ['asesor', 'Asesor']];
const PERAN_BUKAN_DTPS = ['asesor'];
// Kelompok dosen -> [kunci, label, dtps, kategori] (pemilik 2026-11-10; APS-AV 2025:
// DTPS = dosen tetap berkeahlian sesuai kompetensi inti; industri dihitung DTT).
const KELOMPOK = [
  ['dtps', 'DTPS (dosen tetap, keahlian sesuai kompetensi inti prodi)', true, 'tetap'],
  ['dt', 'Dosen tetap PT dari prodi lain (DT)', false, 'tetap'],
  ['dtt', 'Dosen tidak tetap (DTT)', false, 'tidak_tetap'],
  ['industri', 'Dosen industri/praktisi (dihitung DTT)', false, 'industri'],
];
function kelompokDari(r){
  if (r.dtps) return 'dtps';
  return { tetap: 'dt', tidak_tetap: 'dtt', industri: 'industri' }[r.kategori] || '';
}
const PENDIDIKAN = [['', '—'], ['S2', 'S2'], ['S3', 'S3']];
const POLA = {
  sinta_id: [/^[0-9]+$/, 'hanya angka'],
  scopus_id: [/^[0-9]+$/, 'hanya angka'],
  orcid: [/^[0-9]{4}-[0-9]{4}-[0-9]{4}-[0-9]{3}[0-9X]$/i, 'format 0000-0000-0000-0000'],
};
const KOLOM = 'id,nidn,nama,email,peran,pendidikan,jabatan,sinta_id,scopus_id,orcid,aktif,dtps';

// ADA_LKPS: kolom profil LKPS 4.a ada (supabase/22-patch-profil-dosen.sql).
let SAYA = null, DOSEN = [], SUNTING = null, ADA_LKPS = true, ADA_ALT = false;

const nama = (daftar, v) => (daftar.find(x => x[0] === (v || '')) || [, v || '—'])[1];
const opsi = (daftar, v) => daftar.map(([k, l]) =>
  `<option value="${esc(k)}"${k === (v || '') ? ' selected' : ''}>${esc(l)}</option>`).join('');

function tulis(jenis, teks){ const m = $('pesan'); m.className = 'msg ' + jenis; m.textContent = teks; }

// Tempel URL profil -> ambil ID-nya (sama dengan id_saja() di bangun.py).
function idSaja(v){
  let s = String(v || '').trim();
  if (!s || ['nan', 'none', '-'].includes(s.toLowerCase())) return '';
  if (/http/i.test(s)) {
    s = s.slice(s.toLowerCase().lastIndexOf('http'));
    const m = s.match(/authorId=([0-9]+)/i);
    if (m) return m[1];
    s = s.replace(/\/+$/, '').split('?')[0].split('#')[0].split('/').pop();
  }
  return s.trim();
}

async function mulai(){
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return layarMasuk();
  const { data: saya } = await dosenLogin(sb, session, 'id,nama,email,peran');
  if (!saya) { $('hSub').textContent = 'Tidak terdaftar'; $('isi').innerHTML = '<p class="kosong">Email belum terdaftar.</p>'; return; }
  SAYA = saya;
  pasangMenu(sb);
  if (saya.peran !== 'admin') {
    $('hSub').textContent = `Masuk sebagai ${saya.nama}`;
    $('isi').innerHTML = '<p class="kosong">Halaman ini khusus admin prodi.</p>';
    return;
  }
  $('hSub').textContent = `Masuk sebagai ${saya.nama} (admin)`;
  $('isi').innerHTML = `
    <div class="info">Daftar dosen prodi. <b>aktif</b> = boleh masuk situs; <b>DTPS</b> = dihitung
      sebagai dosen tetap prodi (pembagi NDTPS, daftar dosen publik). Admin staf, dekan yang bukan
      DTPS prodi ini, dan asesor: aktif ya, DTPS tidak. Dosen yang pindah tidak dihapus, cukup
      dinonaktifkan. Skor berubah setelah situs dibangun ulang (otomatis tiap jam).</div>
    ${htmlSaran('dosen')}
    <div class="b"><p class="ket" style="margin:0">Ajuan perubahan profil dari dosen diputuskan di
      <a href="verifikasi.html#profil">halaman Verifikasi</a><span id="nProfil"></span>.</p></div>
    <div class="b" id="form"></div>
    <h2>Daftar dosen</h2>
    <div class="gulir" id="daftar"><p class="kosong">Memuat&hellip;</p></div>`;
  await muat();
  hitungVerifikasi(sb).then(n => { if (n.profil) $('nProfil').textContent = ` (${n.profil} menunggu)`; });
}

// Ajuan perubahan profil diputuskan di verifikasi.html (verifikasi-profil.js,
// pemilik 2026-11-08).

async function muat(){
  let { data, error } = await sb.from('dosen').select(KOLOM + ',' + KOLOM_PROFIL).order('nama');
  if (error && /kategori|riwayat|column/i.test(error.message)) {   // patch 22 belum dijalankan
    ADA_LKPS = false;
    ({ data, error } = await sb.from('dosen').select(KOLOM).order('nama'));
  }
  if (error) {
    const kolomHilang = /pendidikan|jabatan|column/i.test(error.message);
    $('daftar').innerHTML = `<p class="kosong">Daftar dosen tidak bisa dibaca: ${esc(error.message)}${
      kolomHilang ? '. Jalankan supabase/18-patch-dosen-web.sql di Supabase.' : ''}</p>`;
    $('form').innerHTML = '';
    return;
  }
  DOSEN = data || [];
  // Email alternatif untuk login (patch 69); kueri terpisah supaya daftar tetap tampil sebelum patch.
  const alt = await sb.from('dosen').select('id,email_alternatif');
  ADA_ALT = !alt.error;
  if (ADA_ALT) { const m = new Map((alt.data || []).map(x => [x.id, x.email_alternatif])); DOSEN.forEach(d => { d.email_alternatif = m.get(d.id) ?? null; }); }
  gambarDaftar();
  isiForm(SUNTING ? DOSEN.find(d => d.id === SUNTING) : null);
}

function gambarDaftar(){
  const n = DOSEN.filter(d => d.dtps && d.aktif !== false).length;
  $('daftar').innerHTML = `<p class="ket">${DOSEN.length} orang; ${n} dihitung DTPS.${ADA_LKPS ? '' :
      ' Profil LKPS 4.a belum tersedia: jalankan supabase/22-patch-profil-dosen.sql.'}
      <label class="ket" style="margin-left:12px">CV: <select id="cv_gaya"><option value="cv">CV akademik</option>
        <option value="hibah">Biodata pengusul hibah (A–J)</option></select> periode karya <select id="cv_periode"><option value="semua">semua tahun</option>
        <option value="5">5 tahun terakhir</option></select></label> <span class="msg" id="cv_msg"></span></p>
    <table class="t"><thead><tr><th>Nama</th><th>NIDN/kode</th><th>Email</th><th>Peran</th>
      ${ADA_LKPS ? '<th>Kategori</th>' : ''}<th>Pendidikan</th><th>Jabatan</th><th>Aktif</th><th>DTPS</th><th></th></tr></thead><tbody>${
    DOSEN.map(d => `<tr class="${d.id === SUNTING ? 'sunting' : ''}${d.aktif ? '' : ' nonaktif'}">
      <td>${esc(d.nama)}</td><td>${esc(d.nidn)}</td><td>${esc(d.email)}</td>
      <td>${esc(nama(PERAN, d.peran))}</td>${ADA_LKPS ? `<td>${esc(nama(KATEGORI, d.kategori))}</td>` : ''}<td>${esc(d.pendidikan || '—')}</td>
      <td>${esc(nama(JABATAN, d.jabatan))}</td><td>${d.aktif ? 'ya' : 'tidak'}</td>
      <td>${d.dtps ? 'ya' : 'tidak'}</td>
      <td><button class="btn ghost kecil" data-ubah="${esc(d.id)}">Ubah</button>
        <button class="btn ghost kecil" data-cv-dosen="${esc(d.id)}" title="Unduh CV dosen ini (.docx)">CV</button></td></tr>`).join('')
  }</tbody></table>`;
  // CV dosen otomatis (pemilik 2026-11-11): admin mengunduh CV dosen mana pun.
  $('daftar').querySelectorAll('[data-cv-dosen]').forEach(b => {
    b.onclick = async () => {
      const d = DOSEN.find(x => x.id === b.dataset.cvDosen), m = $('cv_msg');
      b.disabled = true; m.textContent = `Menyusun CV ${d.nama}…`;
      try { await unduhCV(d, $('cv_periode').value, $('cv_gaya').value, sb); m.textContent = `Berkas ${d.nama} diunduh.`; }
      catch (err) { m.textContent = 'Gagal: ' + (err.message || err); }
      finally { b.disabled = false; }
    };
  });
  $('daftar').querySelectorAll('[data-ubah]').forEach(b => {
    b.onclick = () => { SUNTING = b.dataset.ubah; gambarDaftar(); isiForm(DOSEN.find(d => d.id === SUNTING));
                        $('form').scrollIntoView({ behavior: 'smooth' }); };
  });
}

function isiForm(d){
  const r = d || { peran: 'dosen', aktif: true, dtps: true };
  const diriSendiri = d && d.id === SAYA.id;
  $('form').innerHTML = `
    <p class="ket"><b>${d ? 'Ubah: ' + esc(d.nama) : 'Tambah dosen atau admin'}</b>${
      diriSendiri ? ' — ini akun Anda sendiri: peran admin dan aktif tidak bisa dicabut di sini.' : ''}</p>
    <div class="grid">
      <div class="fld"><label>Nama lengkap <span class="wj">*</span></label><input id="f_nama" value="${esc(r.nama)}"></div>
      <div class="fld"><label>NIDN <span class="wj">*</span></label><input id="f_nidn" value="${esc(r.nidn)}">
        <small>Admin staf tanpa NIDN: NIP/NUP, atau kode STAF-001.</small></div>
      <div class="fld"><label>Email kampus <span class="wj">*</span></label><input id="f_email" type="email" value="${esc(r.email)}">
        <small>Dipakai untuk masuk situs.</small></div>
      ${ADA_ALT ? `<div class="fld"><label>Email alternatif untuk login</label><input id="f_email_alternatif" type="email"
        value="${esc(r.email_alternatif)}" placeholder="mis. nama@gmail.com">
        <small>Bila tautan masuk tidak sampai ke email kampus. Data tetap atas email kampus.</small></div>` : ''}
      <div class="fld"><label>Peran</label><select id="f_peran"${diriSendiri ? ' disabled' : ''}>${opsi(PERAN, r.peran)}</select>
        <small>Admin: verifikasi dan data prodi. Pimpinan: skor + rincian per dosen. Asesor: lihat skor.</small></div>
      <div class="fld"><label>Pendidikan tertinggi</label><select id="f_pendidikan">${opsi(PENDIDIKAN, r.pendidikan)}</select></div>
      <div class="fld"><label>Jabatan akademik</label><select id="f_jabatan">${opsi(JABATAN, r.jabatan)}</select></div>
      <div class="fld"><label>SINTA ID</label><input id="f_sinta_id" value="${esc(r.sinta_id)}"></div>
      <div class="fld"><label>Scopus ID</label><input id="f_scopus_id" value="${esc(r.scopus_id)}"></div>
      <div class="fld"><label>ORCID</label><input id="f_orcid" value="${esc(r.orcid)}"></div>
      <div class="fld"><label>Status</label>
        <label class="cek"><input type="checkbox" id="f_aktif"${r.aktif ? ' checked' : ''}${diriSendiri ? ' disabled' : ''}>Aktif (boleh masuk situs)</label>
        ${ADA_LKPS ? '' : `<label class="cek"><input type="checkbox" id="f_dtps"${r.dtps ? ' checked' : ''}>Dihitung DTPS prodi</label>`}</div>
      ${ADA_LKPS ? `<div class="fld"><label>Kelompok dosen</label>
        ${KELOMPOK.map(([k, ket]) => `<label class="cek"><input type="checkbox" data-kelompok="${k}"${
          kelompokDari(r) === k ? ' checked' : ''}>${ket}</label>`).join('')}
        <small>Pilih satu; yang lain terkunci sampai centangnya dilepas. DTPS mengisi datanya sendiri;
          DT prodi lain, DTT, dan industri diisi admin. Hanya yang <b>Aktif</b> dihitung di butir 26 dan Tabel 4.a.
          Kosongkan untuk staf/asesor yang bukan dosen.</small></div>` : ''}
    </div>
    ${ADA_LKPS ? `<details style="margin-top:14px"><summary><b>Profil untuk LKPS (Tabel 4.a)</b></summary>
      <div class="grid" style="margin-top:10px">
        <div class="fld"><label>Penilaian prodi</label>
          <label class="cek"><input type="checkbox" id="f_sesuai_kompetensi_inti"${r.sesuai_kompetensi_inti ? ' checked' : ''}>Sesuai kompetensi inti PS</label>
          <label class="cek"><input type="checkbox" id="f_sesuai_keahlian_mk"${r.sesuai_keahlian_mk ? ' checked' : ''}>Bidang keahlian sesuai MK yang diampu</label></div>
      </div>
      ${formLKPS(r)}</details>` : ''}
    <div class="aksi"><button class="btn" id="simpan">${d ? 'Simpan perubahan' : 'Tambah'}</button>
      ${d ? '<button class="btn ghost" id="batal">Batal</button>' : ''}<span class="msg" id="pesan"></span></div>`;
  // Kelompok saling meniadakan (pemilik 2026-11-10): satu dicentang, sisanya terkunci.
  const sinkronDtps = () => {
    const asesor = PERAN_BUKAN_DTPS.includes($('f_peran').value);
    if (!ADA_LKPS) {
      $('f_dtps').disabled = asesor;
      if (asesor) $('f_dtps').checked = false;
      return;
    }
    const kotak = [...document.querySelectorAll('[data-kelompok]')];
    if (asesor) kotak.forEach(c => { c.checked = false; });
    const pilih = kotak.find(c => c.checked);
    kotak.forEach(c => { c.disabled = asesor || (pilih && c !== pilih); });
    const inti = $('f_sesuai_kompetensi_inti');
    const dtps = pilih?.dataset.kelompok === 'dtps';
    if (dtps) inti.checked = true;   // DTPS = keahlian sesuai kompetensi inti
    inti.disabled = dtps;
  };
  document.querySelectorAll('[data-kelompok]').forEach(c => { c.onchange = sinkronDtps; });
  $('f_peran').onchange = sinkronDtps;
  sinkronDtps();
  if (ADA_LKPS) pasangEditor($('form'));
  $('simpan').onclick = simpan;
  if (d) $('batal').onclick = () => { SUNTING = null; gambarDaftar(); isiForm(null); };
}

async function simpan(){
  const v = k => $('f_' + k).value.trim();
  const isi = {
    nama: v('nama'), nidn: v('nidn'), email: v('email').toLowerCase(), peran: $('f_peran').value,
    pendidikan: v('pendidikan') || null, jabatan: v('jabatan') || null,
    sinta_id: idSaja(v('sinta_id')) || null, scopus_id: idSaja(v('scopus_id')) || null,
    orcid: idSaja(v('orcid')) || null,
    aktif: $('f_aktif').checked, dtps: ADA_LKPS ? false : $('f_dtps').checked,
  };
  const kel = KELOMPOK.find(([k]) => document.querySelector(`[data-kelompok="${k}"]`)?.checked);
  if (ADA_LKPS) Object.assign(isi, bacaFormLKPS(isi.pendidikan), {
    dtps: kel ? kel[2] : false,
    kategori: kel ? kel[3] : null,
    sesuai_kompetensi_inti: $('f_sesuai_kompetensi_inti').checked,
    sesuai_keahlian_mk: $('f_sesuai_keahlian_mk').checked,
  });
  if (!isi.nama || !isi.nidn || !isi.email) return tulis('buruk', 'Nama, NIDN/kode, dan email wajib diisi.');
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(isi.email)) return tulis('buruk', 'Email tidak sah.');
  if (PERAN_BUKAN_DTPS.includes(isi.peran)) isi.dtps = false;
  const lain = DOSEN.filter(d => d.id !== SUNTING);
  if (lain.some(d => String(d.nidn).toLowerCase() === isi.nidn.toLowerCase()))
    return tulis('buruk', `NIDN/kode ${isi.nidn} sudah dipakai.`);
  if (lain.some(d => String(d.email).toLowerCase() === isi.email))
    return tulis('buruk', `Email ${isi.email} sudah terdaftar.`);
  if (ADA_ALT) {
    isi.email_alternatif = v('email_alternatif').toLowerCase() || null;
    const alt = isi.email_alternatif;
    if (alt && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(alt)) return tulis('buruk', 'Email alternatif tidak sah.');
    if (alt && alt === isi.email) return tulis('buruk', 'Email alternatif sama dengan email kampus.');
    if (alt && lain.some(d => [d.email, d.email_alternatif].map(x => String(x || '').toLowerCase()).includes(alt)))
      return tulis('buruk', `Email ${alt} sudah dipakai dosen lain.`);
    if (lain.some(d => String(d.email_alternatif || '').toLowerCase() === isi.email))
      return tulis('buruk', `Email ${isi.email} sudah menjadi email alternatif dosen lain.`);
  }
  if (SUNTING === SAYA.id) { isi.peran = 'admin'; isi.aktif = true; }
  const adminTersisa = lain.some(d => d.peran === 'admin' && d.aktif) || (isi.peran === 'admin' && isi.aktif);
  if (!adminTersisa) return tulis('buruk', 'Harus tersisa minimal satu admin aktif.');
  const ingat = Object.entries(POLA)
    .filter(([k, [re]]) => isi[k] && !re.test(isi[k]))
    .map(([k, [, ket]]) => `${k} (${ket})`);
  if (ingat.length && !confirm(`Format ${ingat.join(', ')} tidak sesuai; tautan profil mungkin tidak berfungsi. Tetap simpan?`)) return;

  $('simpan').disabled = true;
  const { error } = SUNTING
    ? await sb.from('dosen').update({ ...isi, diubah_pada: new Date().toISOString() }).eq('id', SUNTING)
    : await sb.from('dosen').insert(isi);
  if (error) { $('simpan').disabled = false; return tulis('buruk', 'Gagal menyimpan: ' + error.message); }
  const baru = !SUNTING;
  SUNTING = null;
  await muat();
  tulis('ok', baru ? `${isi.nama} ditambahkan. Ia sekarang bisa masuk dengan ${isi.email}.` : 'Perubahan tersimpan.');
}

function layarMasuk(){
  $('hSub').textContent = 'Perlu masuk';
  $('isi').innerHTML = `<div class="masuk"><p>Masukkan email kampus Anda — tautan masuk dikirim tanpa kata sandi.</p>
    <input id="em" type="email" placeholder="nama@kampus.ac.id" autocomplete="email">
    <button class="btn" id="kirim">Kirim tautan masuk</button><p class="ket" id="pesan"></p></div>`;
  $('kirim').onclick = async () => {
    const em = $('em').value.trim();
    if (!em) return;
    const { error } = await sb.auth.signInWithOtp({ email: em, options: { emailRedirectTo: location.href } });
    $('pesan').textContent = error ? 'Gagal: ' + error.message : 'Tautan masuk sudah dikirim. Periksa email Anda.';
  };
}

sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_IN' && !SAYA) mulai(); });
mulai().catch(e => { $('isi').innerHTML = `<p class="kosong">${esc(e.message)}</p>`; });
</script>
