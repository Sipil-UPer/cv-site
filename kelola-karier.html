<style>
  /* Karier dan rekrutmen asisten (202-patch-karier-asisten.sql, pemilik 2026-11-28) */
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
  .wrap{max-width:1200px;margin:0 auto;padding:18px 20px 80px}
  .kosong, .ket{color:var(--muted)}
  .ket{font-size:13px}
  .kartu{background:var(--panel);border:1px solid var(--line);padding:14px 18px;margin-bottom:16px}
  .kartu h2{font-size:17px;margin:0 0 6px;color:var(--biru)}
  .kartu h3{font-size:15px;margin:14px 0 4px}
  .alat{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0}
  select, input[type=text], input[type=number], input[type=date], input[type=url], input[type=email], input[type=search], textarea{font:inherit;font-size:14px;padding:5px 7px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
  textarea{width:100%}
  .form{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px 14px;margin:8px 0}
  .form label{display:flex;flex-direction:column;font-size:13px;color:var(--muted);gap:3px}
  .form .lebar{grid-column:1/-1}
  .b{font:inherit;font-size:14px;padding:5px 12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;text-decoration:none}
  .b.utama{background:var(--biru);border-color:var(--biru);color:#fff}
  .b.bahaya{color:var(--merah);border-color:var(--merah)}
  .b.kecil{font-size:12.5px;padding:2px 8px}
  .pesan{font-size:13.5px;margin:6px 0} .pesan.galat{color:var(--merah)} .pesan.ok{color:var(--hijau)}
  .gulir{overflow-x:auto}
  table.ds{width:100%;border-collapse:collapse;font-size:13.5px}
  table.ds th{text-align:left;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);padding:5px 6px}
  table.ds td{padding:5px 6px;border-bottom:1px solid var(--line-soft);vertical-align:top}
  td.aksi{white-space:nowrap}
  .st{font-size:12px;font-weight:600;padding:1px 7px;border:1px solid var(--line);white-space:nowrap}
  .st.tayang, .st.buka, .st.diterima{color:var(--hijau);border-color:var(--hijau)} .st.usulan, .st.masuk{color:var(--biru);border-color:var(--biru)}
  .st.ditolak, .st.mundur{color:var(--merah);border-color:var(--merah)} .st.tutup, .st.selesai, .st.draf{color:var(--muted)}
  .usul{border:1px solid var(--line);padding:10px 12px;margin:8px 0}
  .beda{color:#8A5A00;font-weight:600}
  .tab{display:flex;gap:6px;margin:0 0 14px}
  .tab a{padding:6px 14px;border:1px solid var(--line);text-decoration:none;color:var(--ink);background:var(--panel)}
  .tab a.aktif{background:var(--biru);color:#fff;border-color:var(--biru)}
  @media(max-width:700px){.wrap{padding-left:16px;padding-right:16px}}
</style>
</head>

<script>
// Galat saat memuat skrip ditampilkan sebagai pesan, bukan halaman kosong.
addEventListener('error', function (e) {
  if (document.getElementById('galat-muat')) return;
  var d = document.createElement('div');
  d.id = 'galat-muat';
  d.style.cssText = 'margin:16px;padding:12px 14px;border:1px solid var(--merah);' +
    'background:var(--merah-m3);color:var(--ink);font:14px/1.5 system-ui,sans-serif';
  d.textContent = 'Halaman gagal dimuat: ' + (e.message || 'galat skrip') +
    '. Tekan Ctrl+Shift+R untuk memuat ulang tanpa cache; bila tetap muncul, kirim pesan ini ke admin.';
  document.body.insertBefore(d, document.body.firstChild);
});
</script>
<script type="module">
// Karier dan rekrutmen asisten (202, pemilik 2026-11-28). Lowongan: admin, Kaprodi, pembina kemahasiswaan (moderasi usulan
// alumni/mitra dari karier.html). Asisten: admin/Kaprodi semua; kepala lab untuk lab-nya; PJ dosen memutuskan lamaran
// rekrutmennya; SK asisten dibuat di Surat dan SK (admin/Kaprodi). Logika: karier.js.
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/+esm';
import { gerbang } from './menu.js?v=2026-11-28-2346ab';
import { punya } from './koordinator.js?v=2026-11-28-2346ab';
import { JENIS_LOWONGAN, SUMBER_LOWONGAN, STATUS_LOWONGAN, JENIS_ASISTEN, STATUS_REKRUTMEN, STATUS_LAMARAN, tempatRekrutmen, rekapAsisten, rekapLowongan, kiniWIB }
  from './karier.js?v=2026-11-28-2346ab';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sb = createClient(window.SB_URL, window.SB_KEY);
const opsi = (o, v) => Object.entries(o).map(([k, l]) => `<option value="${k}"${k === v ? ' selected' : ''}>${esc(l)}</option>`).join('');
function tulis(id, k, t){ const m = $(id); if (m) { m.className = 'pesan ' + k; m.textContent = t; } }
const angka = v => (v == null || v === '' ? '—' : String(v).replace('.', ','));
const BLN = new Date(Date.now() + 7 * 3600e3), TA_KINI = BLN.getUTCMonth() >= 7 ? `${BLN.getUTCFullYear()}/${BLN.getUTCFullYear() + 1}` : `${BLN.getUTCFullYear() - 1}/${BLN.getUTCFullYear()}`;

let SAYA = null, TAB = location.hash === '#asisten' ? 'asisten' : 'lowongan';
let LOW = [], MITRA = [], PEMANGKU = [], REK = [], LAMARAN = {}, IPK = {}, LAB = [], LAB_SAYA = [], DOSEN = [], ADA = { low: true, rek: true };
let UBAH_L = null, UBAH_R = null, BUKA = new Set();
const ADMIN = () => SAYA?.peran === 'admin';
const KAPRODI = () => punya(SAYA, 'kaprodi');
const KELOLA_LOW = () => ADMIN() || KAPRODI() || punya(SAYA, 'pembina_kemahasiswaan');
const SURAT = () => ADMIN() || KAPRODI();
const BUAT_REK = () => ADMIN() || KAPRODI() || LAB_SAYA.length > 0;
const kelolaRek = r => ADMIN() || KAPRODI() || LAB_SAYA.includes(r.laboratorium_id) || r.pj_dosen_id === SAYA.id;
const namaLab = id => LAB.find(l => l.id === id)?.nama || '';
const namaDosen = id => DOSEN.find(d => d.id === id)?.nama || '';

async function muatLow(){
  const r = await sb.from('lowongan').select('*').order('id', { ascending: false });
  ADA.low = !r.error; LOW = r.data || [];
}
async function muatRek(){
  const r = await sb.from('asisten_rekrutmen').select('*').order('buka', { ascending: false });
  ADA.rek = !r.error; REK = (r.data || []).filter(kelolaRek);
  const ids = REK.map(x => x.id);
  const l = ids.length ? await sb.from('asisten_lamaran').select('*').in('rekrutmen_id', ids).order('dikirim') : { data: [] };
  LAMARAN = {}; for (const x of l.data || []) (LAMARAN[x.rekrutmen_id] ||= []).push(x);
}

// ---------- Lowongan ----------
function formLow(){
  const x = UBAH_L || { jenis: 'kerja', sumber: 'mitra', status: 'tayang' };
  return `<section class="kartu" id="formLow"><h2>${UBAH_L ? 'Ubah lowongan' : 'Tambah lowongan'}</h2>
    <div class="form">
      <label class="lebar">Posisi / judul <input type="text" id="lJudul" maxlength="200" value="${esc(x.judul || '')}"></label>
      <label>Organisasi <input type="text" id="lOrg" maxlength="200" value="${esc(x.organisasi || '')}"></label>
      <label>Jenis <select id="lJenis">${opsi(JENIS_LOWONGAN, x.jenis)}</select></label>
      <label>Bidang (opsional) <input type="text" id="lBidang" maxlength="120" value="${esc(x.bidang || '')}" placeholder="mis. Struktur, Geoteknik"></label>
      <label>Lokasi <input type="text" id="lLokasi" maxlength="200" value="${esc(x.lokasi || '')}"></label>
      <label>Batas lamaran <input type="date" id="lBatas" value="${esc(x.batas || '')}"></label>
      <label>Sumber <select id="lSumber">${opsi(SUMBER_LOWONGAN, x.sumber)}</select></label>
      <label>Mitra kerja sama (opsional) <select id="lMitra"><option value="">—</option>${MITRA.map(m => `<option value="${m.id}"${m.id === x.kerjasama_id ? ' selected' : ''}>${esc(m.mitra)}</option>`).join('')}</select></label>
      ${PEMANGKU.length ? `<label>Pemangku (opsional) <select id="lPemangku"><option value="">—</option>${PEMANGKU.map(p => `<option value="${p.id}"${p.id === x.pemangku_id ? ' selected' : ''}>${esc(p.organisasi || p.nama)}</option>`).join('')}</select></label>` : ''}
      <label>Status <select id="lStatus">${opsi(STATUS_LOWONGAN, x.status)}</select></label>
      <label class="lebar">Uraian <textarea id="lDesk" rows="4" maxlength="4000">${esc(x.deskripsi || '')}</textarea></label>
      <label class="lebar">Syarat <textarea id="lSyarat" rows="3" maxlength="3000">${esc(x.syarat || '')}</textarea></label>
      <label class="lebar">Cara melamar <input type="text" id="lCara" maxlength="1000" value="${esc(x.cara_melamar || '')}"></label>
      <label>Tautan lamaran (https) <input type="url" id="lTautan" value="${esc(x.tautan || '')}"></label>
      <label>Email kontak perusahaan <input type="email" id="lKontak" maxlength="200" value="${esc(x.kontak_email || '')}"></label>
      <label class="lebar">Catatan internal (tidak tampil publik) <input type="text" id="lCatatan" maxlength="1000" value="${esc(x.catatan || '')}"></label></div>
    <div class="alat"><button type="button" class="b utama" id="bSimpanL">${UBAH_L ? 'Simpan perubahan' : 'Tambah lowongan'}</button>
      ${UBAH_L ? '<button type="button" class="b" id="bBatalL">Batal</button>' : ''}<span class="pesan" id="mLow" role="status"></span></div></section>`;
}
function htmlLowongan(){
  if (!ADA.low) return '<p class="kosong">Tabel belum ada: jalankan supabase/202-patch-karier-asisten.sql.</p>';
  if (!KELOLA_LOW()) {
    const xs = LOW.filter(l => l.status === 'tayang');
    return `<section class="kartu"><h2>Lowongan yang tayang</h2><p class="ket">Teruskan ke mahasiswa atau lulusan; halaman publik: <a href="karier.html">Lowongan kerja dan magang</a>.
      Usulkan lowongan dari jejaring Anda lewat formulir di halaman itu.</p>
      ${xs.length ? `<ul>${xs.map(l => `<li><b>${esc(l.judul)}</b> · ${esc(l.organisasi)}${l.batas ? ` · batas ${esc(l.batas)}` : ''}</li>`).join('')}</ul>` : '<p class="kosong">Belum ada.</p>'}</section>`;
  }
  const usul = LOW.filter(l => l.status === 'usulan'), lain = LOW.filter(l => l.status !== 'usulan'), rek = rekapLowongan(LOW);
  return `<section class="kartu" id="usulan"><h2>Usulan dari alumni dan mitra</h2>
      <p class="ket">Masuk dari formulir di halaman publik. Periksa kewajaran (bukan penipuan, tanpa biaya lamaran) sebelum ditayangkan; ubah dulu bila perlu.</p>
      ${usul.length ? usul.map(l => `<div class="usul"><b>${esc(l.judul)}</b> · ${esc(l.organisasi)} <span class="ket">(${esc(JENIS_LOWONGAN[l.jenis])}${l.lokasi ? ', ' + esc(l.lokasi) : ''}${l.batas ? ', batas ' + esc(l.batas) : ''})</span>
        ${l.deskripsi ? `<div class="ket" style="white-space:pre-wrap">${esc(l.deskripsi)}</div>` : ''}
        <div class="ket">Lamar: ${l.tautan ? `<a href="${esc(l.tautan)}" target="_blank" rel="noopener">${esc(l.tautan)}</a>` : esc(l.kontak_email || '')} ·
          Pengusul: ${esc(l.pengusul_nama || '')} &lt;${esc(l.pengusul_email || '')}&gt; (${esc(SUMBER_LOWONGAN[l.sumber] || l.sumber)}), ${esc(String(l.diusulkan || '').slice(0, 10))}</div>
        <div class="alat"><button type="button" class="b kecil utama" data-tayang="${l.id}">Tayangkan</button>
          <button type="button" class="b kecil" data-ubah-l="${l.id}">Ubah dulu</button>
          <button type="button" class="b kecil bahaya" data-tolak="${l.id}">Tolak</button></div></div>`).join('') : '<p class="kosong">Tidak ada usulan baru.</p>'}</section>
    ${formLow()}
    <section class="kartu" id="lowongan"><h2>Semua lowongan</h2>
      <p class="ket">Tampil di <a href="karier.html" target="_blank" rel="noopener">halaman publik</a> selama berstatus Tayang dan belum lewat batas.</p>
      ${lain.length ? `<div class="gulir"><table class="ds"><thead><tr><th>Lowongan</th><th>Jenis</th><th>Sumber</th><th>Batas</th><th>Status</th><th></th></tr></thead><tbody>
        ${lain.map(l => `<tr><td><b>${esc(l.judul)}</b><div class="ket">${esc(l.organisasi)}${l.lokasi ? ' · ' + esc(l.lokasi) : ''}</div>${l.catatan ? `<div class="ket">${esc(l.catatan)}</div>` : ''}</td>
          <td>${esc(JENIS_LOWONGAN[l.jenis])}</td><td>${esc(SUMBER_LOWONGAN[l.sumber] || l.sumber)}</td><td>${esc(l.batas || '—')}${l.batas && l.batas < kiniWIB() ? ' <span class="ket">(lewat)</span>' : ''}</td>
          <td><span class="st ${esc(l.status)}">${esc(STATUS_LOWONGAN[l.status])}</span></td>
          <td class="aksi"><button type="button" class="b kecil" data-ubah-l="${l.id}">Ubah</button>
            ${l.status === 'tayang' ? `<button type="button" class="b kecil" data-tutup-l="${l.id}">Tutup</button>` : ''}
            <button type="button" class="b kecil bahaya" data-hapus-l="${l.id}">Hapus</button></td></tr>`).join('')}</tbody></table></div>` : '<p class="kosong">Belum ada lowongan.</p>'}
      <h3>Rekap lowongan tayang</h3>
      ${rek.length ? `<table class="ds"><thead><tr><th>Tahun</th><th>Jenis</th><th>Lowongan</th><th>Dari alumni</th></tr></thead><tbody>
        ${rek.map(x => `<tr><td>${x.tahun}</td><td>${esc(JENIS_LOWONGAN[x.jenis])}</td><td>${x.n}</td><td>${x.dariAlumni}</td></tr>`).join('')}</tbody></table>` : '<p class="kosong">Belum ada.</p>'}</section>`;
}

// ---------- Asisten ----------
function formRek(){
  if (!BUAT_REK() && !UBAH_R) return '';
  const x = UBAH_R || { jenis: 'praktikum', tahun_akademik: TA_KINI, semester: 'Genap', kuota: 2, status: 'draf', laboratorium_id: LAB_SAYA[0] || null };
  const labs = ADMIN() || KAPRODI() ? LAB : LAB.filter(l => LAB_SAYA.includes(l.id) || l.id === x.laboratorium_id);
  return `<section class="kartu" id="formRek"><h2>${UBAH_R ? 'Ubah rekrutmen' : 'Buka rekrutmen asisten'}</h2>
    <p class="ket">Simpan sebagai <b>Draf</b>, lalu ubah ke <b>Dibuka</b> agar tampil di halaman publik <a href="asisten.html" target="_blank" rel="noopener">Rekrutmen asisten</a>
      antara tanggal buka dan tutup.</p>
    <div class="form">
      <label class="lebar">Judul <input type="text" id="rJudul" maxlength="200" value="${esc(x.judul || '')}" placeholder="mis. Asisten Praktikum Mekanika Tanah Genap 2026/2027"></label>
      <label>Jenis <select id="rJenis">${opsi(JENIS_ASISTEN, x.jenis)}</select></label>
      <label id="rLabW">Laboratorium <select id="rLab">${labs.map(l => `<option value="${l.id}"${l.id === x.laboratorium_id ? ' selected' : ''}>${esc(l.nama)}</option>`).join('')}</select></label>
      <label id="rKurW">Kurikulum <select id="rKur">${['K26', 'K21'].map(k => `<option${k === x.kurikulum ? ' selected' : ''}>${k}</option>`).join('')}</select></label>
      <label id="rMkW">Kode MK <input type="text" id="rMk" maxlength="20" value="${esc(x.kode_mk || '')}"></label>
      <label>Tahun akademik <input type="text" id="rTa" maxlength="9" value="${esc(x.tahun_akademik)}"></label>
      <label>Semester <select id="rSem">${['Ganjil', 'Genap', 'Pendek'].map(k => `<option${k === x.semester ? ' selected' : ''}>${k}</option>`).join('')}</select></label>
      <label>Kuota <input type="number" id="rKuota" min="1" max="100" value="${esc(x.kuota)}"></label>
      <label>IPK minimal (opsional) <input type="number" id="rIpk" min="0" max="4" step="0.01" value="${esc(x.ipk_min ?? '')}"></label>
      <label>Buka <input type="date" id="rBuka" value="${esc(x.buka || kiniWIB())}"></label>
      <label>Tutup <input type="date" id="rTutup" value="${esc(x.tutup || '')}"></label>
      <label>Penanggung jawab (opsional) <select id="rPj"><option value="">—</option>${DOSEN.map(d => `<option value="${d.id}"${d.id === x.pj_dosen_id ? ' selected' : ''}>${esc(d.nama)}</option>`).join('')}</select></label>
      <label>Status <select id="rStatus">${opsi(STATUS_REKRUTMEN, x.status)}</select></label>
      <label class="lebar">Syarat dan tugas (tampil publik) <textarea id="rSyarat" rows="4" maxlength="3000">${esc(x.syarat || '')}</textarea></label></div>
    <div class="alat"><button type="button" class="b utama" id="bSimpanR">${UBAH_R ? 'Simpan perubahan' : 'Simpan rekrutmen'}</button>
      ${UBAH_R ? '<button type="button" class="b" id="bBatalR">Batal</button>' : ''}<span class="pesan" id="mRek" role="status"></span></div></section>`;
}
function tabelLamaran(r){
  const xs = LAMARAN[r.id] || [], ipk = IPK[r.id] || {};
  if (!xs.length) return '<p class="kosong">Belum ada lamaran.</p>';
  return `<div class="gulir"><table class="ds"><thead><tr><th>Pelamar</th><th>IPK diakui</th><th>IPK SIAKAD</th><th>Nilai MK</th><th>Motivasi dan pengalaman</th><th>Keputusan</th></tr></thead><tbody>
    ${xs.map(l => { const s = ipk[l.nim]; const beda = s?.ipk != null && l.ipk != null && Math.abs(+s.ipk - +l.ipk) >= 0.05;
      return `<tr><td><b>${esc(l.nama)}</b><div class="ket">${esc(l.nim)} · ${esc(l.email)}</div><div class="ket">${esc(String(l.dikirim).slice(0, 10))}</div></td>
        <td>${esc(angka(l.ipk))}</td>
        <td>${s ? (s.ipk != null ? `<span class="${beda ? 'beda' : ''}">${esc(angka(s.ipk))}</span><div class="ket">${esc(s.semester)} ${esc(s.ts)}</div>` : `<span class="ket">${s.terdaftar ? 'belum ada IPK' : 'NIM tidak ada di data mahasiswa'}</span>`) : '…'}</td>
        <td>${esc(l.nilai_mk || '—')}</td>
        <td><details><summary class="ket">${esc(String(l.motivasi).slice(0, 60))}…</summary><div style="white-space:pre-wrap">${esc(l.motivasi)}</div>
          ${l.pengalaman ? `<div class="ket" style="white-space:pre-wrap">${esc(l.pengalaman)}</div>` : ''}</details></td>
        <td class="aksi"><select data-st="${l.id}">${opsi(STATUS_LAMARAN, l.status)}</select>
          <input type="text" data-ct="${l.id}" maxlength="1000" placeholder="catatan" value="${esc(l.catatan || '')}" style="width:140px">
          <button type="button" class="b kecil" data-simpan-lm="${l.id}">Simpan</button></td></tr>`; }).join('')}</tbody></table></div>`;
}
function htmlAsisten(){
  if (!ADA.rek) return '<p class="kosong">Tabel belum ada: jalankan supabase/202-patch-karier-asisten.sql.</p>';
  const rek = rekapAsisten(REK.map(r => ({ ...r, lamaran: LAMARAN[r.id] || [] })));
  return `${formRek()}<section class="kartu" id="asisten"><h2>Rekrutmen asisten</h2>
    <p class="ket">${ADMIN() || KAPRODI() ? 'Semua rekrutmen.' : 'Rekrutmen laboratorium Anda dan yang Anda tanggung jawabi.'} IPK SIAKAD = IPK terakhir dari data akademik yang
      diimpor; berwarna bila berbeda dari yang diakui pelamar. SK asisten dibuat admin atau Kaprodi di Surat dan SK (ditandatangani Dekan).</p>
    ${REK.length ? REK.map(r => { const xs = LAMARAN[r.id] || [], dt = xs.filter(l => l.status === 'diterima').length;
      return `<div class="usul"><div><b>${esc(r.judul)}</b> <span class="st ${esc(r.status)}">${esc(STATUS_REKRUTMEN[r.status])}</span></div>
        <div class="ket">${esc(JENIS_ASISTEN[r.jenis])} · ${esc(tempatRekrutmen(r, namaLab(r.laboratorium_id)))} · ${esc(r.semester)} ${esc(r.tahun_akademik)} ·
          ${esc(r.buka)} s.d. ${esc(r.tutup)} · kuota ${esc(r.kuota)} · pelamar ${xs.length} · diterima ${dt}${r.pj_dosen_id ? ' · PJ ' + esc(namaDosen(r.pj_dosen_id)) : ''}</div>
        <div class="alat"><button type="button" class="b kecil" data-lamaran="${r.id}">${BUKA.has(r.id) ? 'Sembunyikan lamaran' : `Lamaran (${xs.length})`}</button>
          <button type="button" class="b kecil" data-ubah-r="${r.id}">Ubah</button>
          <button type="button" class="b kecil" data-salin="${r.id}">Salin tautan publik</button>
          ${SURAT() && dt ? (r.sk_surat_id ? `<a class="b kecil" href="surat.html#agenda">SK sudah dibuat</a>`
            : `<a class="b kecil utama" href="surat.html?asisten=${r.id}#form">Buat SK asisten</a>`) : ''}
          ${!xs.length ? `<button type="button" class="b kecil bahaya" data-hapus-r="${r.id}">Hapus</button>` : ''}</div>
        ${BUKA.has(r.id) ? tabelLamaran(r) : ''}</div>`; }).join('') : '<p class="kosong">Belum ada rekrutmen.</p>'}
    <h3>Rekap per tahun akademik</h3>
    ${rek.length ? `<table class="ds"><thead><tr><th>Tahun akademik</th><th>Rekrutmen</th><th>Kuota</th><th>Pelamar</th><th>Diterima</th></tr></thead><tbody>
      ${rek.map(x => `<tr><td>${esc(x.tahun_akademik)}</td><td>${x.rekrutmen}</td><td>${x.kuota}</td><td>${x.pelamar}</td><td>${x.diterima}</td></tr>`).join('')}</tbody></table>` : '<p class="kosong">Belum ada.</p>'}</section>`;
}

function gambar(){
  const tab = `<nav class="tab"><a href="#lowongan" data-tab="lowongan" class="${TAB === 'lowongan' ? 'aktif' : ''}">Lowongan kerja dan magang</a>
    <a href="#asisten" data-tab="asisten" class="${TAB === 'asisten' ? 'aktif' : ''}">Rekrutmen asisten</a></nav>`;
  $('isi').innerHTML = tab + (TAB === 'lowongan' ? htmlLowongan() : htmlAsisten());
  pasang();
}

const on = (sel, f) => document.querySelectorAll(sel).forEach(b => { b.onclick = e => f(b, e); });
function pasang(){
  on('[data-tab]', (b, e) => { e.preventDefault(); TAB = b.dataset.tab; history.replaceState(null, '', '#' + TAB); gambar(); });
  // Lowongan
  on('[data-tayang]', async b => { const { error } = await sb.from('lowongan').update({ status: 'tayang' }).eq('id', +b.dataset.tayang); if (error) return alert(error.message); await muatLow(); gambar(); });
  on('[data-tolak]', async b => {
    const c = prompt('Alasan menolak (catatan internal, tidak dikirim ke pengusul):', ''); if (c == null) return;
    const { error } = await sb.from('lowongan').update({ status: 'ditolak', catatan: c.trim() || null }).eq('id', +b.dataset.tolak); if (error) return alert(error.message);
    await muatLow(); gambar();
  });
  on('[data-tutup-l]', async b => { const { error } = await sb.from('lowongan').update({ status: 'tutup' }).eq('id', +b.dataset.tutupL); if (error) return alert(error.message); await muatLow(); gambar(); });
  on('[data-hapus-l]', async b => { if (!confirm('Hapus lowongan ini? Untuk berhenti menayangkan, cukup Tutup.')) return;
    const { error } = await sb.from('lowongan').delete().eq('id', +b.dataset.hapusL); if (error) return alert(error.message); await muatLow(); gambar(); });
  on('[data-ubah-l]', b => { UBAH_L = LOW.find(l => l.id === +b.dataset.ubahL); gambar(); $('formLow').scrollIntoView(); });
  if ($('bSimpanL')) $('bSimpanL').onclick = simpanLow;
  if ($('bBatalL')) $('bBatalL').onclick = () => { UBAH_L = null; gambar(); };
  // Asisten
  if ($('rJenis')) { const atur = () => { const p = $('rJenis').value === 'praktikum'; $('rLabW').style.display = p ? '' : 'none'; $('rKurW').style.display = $('rMkW').style.display = p ? 'none' : ''; };
    $('rJenis').onchange = atur; atur(); }
  if ($('bSimpanR')) $('bSimpanR').onclick = simpanRek;
  if ($('bBatalR')) $('bBatalR').onclick = () => { UBAH_R = null; gambar(); };
  on('[data-ubah-r]', b => { UBAH_R = REK.find(r => r.id === +b.dataset.ubahR); gambar(); $('formRek').scrollIntoView(); });
  on('[data-hapus-r]', async b => { if (!confirm('Hapus rekrutmen ini?')) return;
    const { error } = await sb.from('asisten_rekrutmen').delete().eq('id', +b.dataset.hapusR); if (error) return alert(error.message); await muatRek(); gambar(); });
  on('[data-salin]', async b => { const u = new URL(`asisten.html?r=${b.dataset.salin}`, location.href).href;
    try { await navigator.clipboard.writeText(u); b.textContent = 'Tersalin'; } catch { prompt('Salin tautan ini:', u); } });
  on('[data-lamaran]', async b => {
    const id = +b.dataset.lamaran;
    if (BUKA.has(id)) { BUKA.delete(id); return gambar(); }
    BUKA.add(id);
    if (!IPK[id]) { const { data } = await sb.rpc('asisten_ipk_sistem', { p_rekrutmen: id }); IPK[id] = Object.fromEntries((data || []).map(x => [x.nim, x])); }
    gambar();
  });
  on('[data-simpan-lm]', async b => {
    const id = +b.dataset.simpanLm, st = document.querySelector(`[data-st="${id}"]`).value, ct = document.querySelector(`[data-ct="${id}"]`).value.trim();
    const { error } = await sb.from('asisten_lamaran').update({ status: st, catatan: ct || null }).eq('id', id);
    if (error) return alert('Gagal menyimpan: ' + error.message);
    await muatRek(); gambar();
  });
}

async function simpanLow(){
  const v = id => $(id)?.value?.trim() ?? '';
  const isi = { judul: v('lJudul'), organisasi: v('lOrg'), jenis: v('lJenis'), bidang: v('lBidang') || null, lokasi: v('lLokasi') || null, batas: v('lBatas') || null,
    sumber: v('lSumber'), kerjasama_id: v('lMitra') ? +v('lMitra') : null, status: v('lStatus'), deskripsi: v('lDesk') || null, syarat: v('lSyarat') || null,
    cara_melamar: v('lCara') || null, tautan: v('lTautan') || null, kontak_email: v('lKontak') || null, catatan: v('lCatatan') || null };
  if ($('lPemangku')) isi.pemangku_id = v('lPemangku') ? +v('lPemangku') : null;
  if (isi.judul.length < 3 || isi.organisasi.length < 2) return tulis('mLow', 'galat', 'Tulis judul dan organisasi.');
  if (isi.tautan && !/^https:\/\/\S+$/i.test(isi.tautan)) return tulis('mLow', 'galat', 'Tautan harus diawali https://');
  if (!isi.tautan && !isi.kontak_email && (isi.cara_melamar || '').length < 5) return tulis('mLow', 'galat', 'Isi tautan, email kontak, atau cara melamar.');
  const { error } = UBAH_L ? await sb.from('lowongan').update(isi).eq('id', UBAH_L.id) : await sb.from('lowongan').insert(isi);
  if (error) return tulis('mLow', 'galat', 'Gagal menyimpan: ' + error.message);
  UBAH_L = null; await muatLow(); gambar(); tulis('mLow', 'ok', 'Tersimpan.');
}
async function simpanRek(){
  const v = id => $(id)?.value?.trim() ?? '';
  const isi = { judul: v('rJudul'), jenis: v('rJenis'), tahun_akademik: v('rTa'), semester: v('rSem'), kuota: +v('rKuota') || 1, ipk_min: v('rIpk') === '' ? null : +v('rIpk'),
    buka: v('rBuka'), tutup: v('rTutup'), pj_dosen_id: v('rPj') || null, status: v('rStatus'), syarat: v('rSyarat') || null };
  if (isi.jenis === 'praktikum') Object.assign(isi, { laboratorium_id: v('rLab') ? +v('rLab') : null, kurikulum: null, kode_mk: null });
  else Object.assign(isi, { laboratorium_id: null, kurikulum: v('rKur'), kode_mk: v('rMk').toUpperCase() || null });
  if (isi.judul.length < 3) return tulis('mRek', 'galat', 'Tulis judul rekrutmen.');
  if (!/^\d{4}\/\d{4}$/.test(isi.tahun_akademik)) return tulis('mRek', 'galat', 'Tahun akademik, mis. 2026/2027.');
  if (!isi.buka || !isi.tutup || isi.tutup < isi.buka) return tulis('mRek', 'galat', 'Isi tanggal buka dan tutup (tutup tidak sebelum buka).');
  if (isi.jenis === 'praktikum' && !isi.laboratorium_id) return tulis('mRek', 'galat', 'Pilih laboratorium.');
  if (isi.jenis === 'mk' && !isi.kode_mk) return tulis('mRek', 'galat', 'Tulis kode MK.');
  const { error } = UBAH_R ? await sb.from('asisten_rekrutmen').update(isi).eq('id', UBAH_R.id) : await sb.from('asisten_rekrutmen').insert(isi);
  if (error) return tulis('mRek', 'galat', 'Gagal menyimpan: ' + error.message);
  UBAH_R = null; await muatRek(); gambar(); tulis('mRek', 'ok', 'Tersimpan.');
}

async function mulai(){
  SAYA = await gerbang(sb);
  if (!SAYA) return;
  $('hSub').textContent = `Masuk sebagai ${SAYA.nama}`;
  const [lab, kl, ds, mt, pm] = await Promise.all([
    sb.from('laboratorium').select('id,nama').order('nama'),
    sb.from('koordinator').select('laboratorium_id,mulai,selesai').eq('dosen_id', SAYA.id).eq('jabatan', 'kepala_lab'),
    sb.from('dosen').select('id,nama,aktif,peran').order('nama'),
    sb.from('lkps_kerjasama').select('id,mitra').order('mitra'),
    sb.from('pemangku').select('id,nama,organisasi').order('nama'),
  ]);
  LAB = lab.data || [];
  const hari = kiniWIB();
  LAB_SAYA = (kl.data || []).filter(k => k.laboratorium_id && k.mulai <= hari && (!k.selesai || k.selesai >= hari)).map(k => k.laboratorium_id);
  DOSEN = (ds.data || []).filter(d => d.aktif !== false && !['asesor', 'pimpinan'].includes(d.peran));
  MITRA = mt.error ? [] : [...new Map((mt.data || []).map(m => [m.mitra, m])).values()];
  PEMANGKU = pm.error ? [] : (pm.data || []);
  await Promise.all([muatLow(), muatRek()]);
  if (!KELOLA_LOW() && (BUAT_REK() || REK.length)) TAB = location.hash === '#lowongan' ? 'lowongan' : 'asisten';
  gambar();
}
mulai().catch(e => { $('isi').innerHTML = `<p class="kosong">Gagal memuat: ${esc(e.message)}</p>`; });
</script>
