<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Penugasan koordinator — Ruang kerja</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tema.css?v=2026-11-20-90548a">
<link rel="stylesheet" href="kepala.css?v=2026-11-20-90548a">
<style>
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
  .wrap{max-width:1120px;margin:0 auto;padding:18px 20px 80px}
  .kosong, .ket{color:var(--muted)} .ket{font-size:13px}
  h2{font-family:var(--serif);font-size:19px;font-weight:600;margin:22px 0 8px}
  table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);font-size:14px}
  th{text-align:left;font-size:12px;color:var(--muted);font-weight:500;border-bottom:1px solid var(--line);padding:7px 10px;background:var(--bg)}
  td{border-bottom:1px solid var(--line-soft);padding:7px 10px;vertical-align:top}
  tr.berakhir td{color:var(--muted)}
  .lencana{font-family:var(--mono);font-size:11px;text-transform:uppercase;padding:1px 6px;border:1px solid var(--line)}
  .lencana.aktif{border-color:var(--hijau);color:var(--hijau)}
  .kotak{background:var(--panel);border:1px solid var(--line);padding:12px 14px;margin-top:10px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px 14px}
  .grid label{display:flex;flex-direction:column;font-size:13px;color:var(--muted)}
  .grid input, .grid select{font:inherit;font-size:14px;padding:6px 8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin-top:2px}
  button.b{font:inherit;font-size:13.5px;padding:6px 12px;border:1px solid var(--biru);background:var(--panel);color:var(--biru);cursor:pointer}
  button.utama{background:var(--biru);color:#fff}
  button.b:disabled{opacity:.55}
  .msg{font-size:13.5px;margin-left:8px} .msg.buruk{color:var(--merah)} .msg.ok{color:var(--hijau)}
  @media(max-width:760px){.lebar-tabel{overflow-x:auto}}
</style>
</head>
<body>
<header class="hero"><div class="hero-in">
  <div class="hero-inst" data-identitas></div>
  <h1>Penugasan koordinator</h1>
  <div class="sub" id="hSub">Memuat…</div>
</div></header>
<main class="wrap" id="isi"><p class="kosong">Memuat…</p></main>
<script src="config.js?v=2026-11-20-90548a"></script>
<script>
// Galat saat memuat skrip ditampilkan sebagai pesan, bukan halaman kosong.
addEventListener('error', function (e) {
  if (document.getElementById('galat-muat')) return;
  var d = document.createElement('div');
  d.id = 'galat-muat';
  d.style.cssText = 'margin:16px;padding:12px 14px;border:1px solid var(--merah);' +
    'background:var(--merah-m3);color:var(--ink);font:14px/1.5 system-ui,sans-serif';
  d.textContent = 'Halaman gagal dimuat: ' + (e.message || 'galat skrip') +
    '. Tekan Ctrl+Shift+R untuk memuat ulang tanpa cache; bila tetap muncul, kirim pesan ini ke admin.';
  document.body.insertBefore(d, document.body.firstChild);
});
</script>
<script type="module">
// Penugasan koordinator (97-patch-koordinator.sql, pemilik 2026-11-17): admin menetapkan dosen, jabatan, periode, dan SK.
// SK diunggah ke pustaka dokumen (jenis "sk") sehingga sekaligus menjadi bukti tata pamong. Wewenang berlaku selama periode.
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/+esm';
import { gerbang } from './menu.js?v=2026-11-20-90548a';
import { JABATAN, labelJabatan, aktifPada } from './koordinator.js?v=2026-11-20-90548a';
import { unggahKePustaka } from './pustaka-dokumen.js?v=2026-11-20-90548a';

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = id => document.getElementById(id);
const sb = createClient(window.SB_URL, window.SB_KEY);
const UNGGAH = (() => {
  const url = String(window.UPLOAD_URL || '').trim();
  if (!url) return null;
  const ext = String(window.UPLOAD_EXT || '').toLowerCase().split(',').map(s => s.trim()).filter(Boolean);
  return { url, ext, maxMb: Number(window.UPLOAD_MAX_MB) || 0, accept: ext.map(x => '.' + x).join(',') };
})();
const WEWENANG = {
  koordinator_ta: 'Menjadwalkan seminar/sidang TA dan menetapkan penguji, mengubah jadwal dan revisi (Data prodi › Jadwal TA), Rekap TA.',
  koordinator_kp: 'Tahap admin pengajuan KP: memeriksa, mengunggah surat pengantar, mengesahkan laporan selesai KP.',
  pembina_kemahasiswaan: 'Tahap admin laporan lomba dan publikasi/luaran mahasiswa; Data prodi › Prestasi, Publikasi, Luaran mahasiswa.',
  kepala_lab: 'Profil laboratorium miliknya dan alatnya (tahap 2).',
  gkm: 'Modul akreditasi dan SPMI (tahap 2).',
  kaprodi: 'Memeriksa dan mengesahkan RPS; nama di kolom Ketua Program Studi lembar pengesahan RPS (admin boleh a.n., khusus RPS).',
  dekan: 'Menetapkan RPS setelah disahkan Kaprodi; nama di kolom Dekan lembar pengesahan RPS (admin boleh a.n., khusus RPS).',
};
// 117 (pemilik 2026-11-19): sebutan di dokumen untuk Kaprodi/Dekan, mis. "Pjs. Dekan Fakultas Perencanaan Infrastruktur".
const BERSEBUTAN = ['kaprodi', 'dekan'];
let SAYA = null, BARIS = [], DOSEN = [], LAB = [], SUNTING = null;

const tulis = (k, t) => { $('msg').className = 'msg ' + k; $('msg').textContent = t; };
const opsi = (xs, v) => xs.map(([k, l]) => `<option value="${esc(k)}"${k === v ? ' selected' : ''}>${esc(l)}</option>`).join('');

async function muat(){
  const [k, d, l] = await Promise.all([
    sb.from('koordinator').select('*, dosen(nama), laboratorium(nama), dokumen(url,nomor,judul)').order('mulai', { ascending: false }),
    sb.from('dosen').select('id,nama,aktif,peran,dtps').order('nama'),
    sb.from('laboratorium').select('id,nama').order('nama')]);
  if (k.error) throw new Error(/koordinator/.test(k.error.message) ? 'Tabel belum ada: jalankan supabase/97-patch-koordinator.sql.' : k.error.message);
  BARIS = k.data || [];
  DOSEN = (d.data || []).filter(x => x.aktif && (x.dtps || ['dosen', 'pimpinan', 'admin'].includes(x.peran)));
  LAB = l.data || [];
}

function gambar(){
  const aktif = new Set(aktifPada(BARIS).map(x => x.id));
  $('daftar').innerHTML = BARIS.length ? `<div class="lebar-tabel"><table><thead><tr><th>Jabatan</th><th>Dosen</th><th>Periode</th><th>SK</th><th></th></tr></thead>
    <tbody>${BARIS.map(r => `<tr class="${aktif.has(r.id) ? '' : 'berakhir'}"><td>${esc(labelJabatan(r.jabatan))}${r.laboratorium?.nama ? '<br><span class="ket">' + esc(r.laboratorium.nama) + '</span>' : ''}${
        r.sebutan ? '<br><span class="ket">' + esc(r.sebutan) + '</span>' : ''}</td>
      <td>${esc(r.dosen?.nama || '')}</td><td>${esc(r.mulai)} s.d. ${esc(r.selesai || 'sekarang')} <span class="lencana${aktif.has(r.id) ? ' aktif' : ''}">${aktif.has(r.id) ? 'aktif' : 'tidak aktif'}</span></td>
      <td>${r.nomor_sk ? esc(r.nomor_sk) : ''}${r.dokumen?.url ? ` <a href="${esc(r.dokumen.url)}" target="_blank" rel="noopener">berkas</a>` : ''}</td>
      <td><button class="b" data-ubah="${r.id}">Ubah</button></td></tr>`).join('')}</tbody></table></div>`
    : '<p class="kosong">Belum ada koordinator.</p>';
  document.querySelectorAll('[data-ubah]').forEach(b => { b.onclick = () => isiForm(BARIS.find(r => r.id === +b.dataset.ubah)); });
}

function isiForm(r){
  SUNTING = r?.id || null;
  $('f_dosen').value = r?.dosen_id || ''; $('f_jab').value = r?.jabatan || 'koordinator_ta'; $('f_lab').value = r?.laboratorium_id || '';
  $('f_mulai').value = r?.mulai || new Date().toISOString().slice(0, 10); $('f_selesai').value = r?.selesai || '';
  $('f_sk').value = r?.nomor_sk || ''; $('f_berkas').value = ''; $('f_sebutan').value = r?.sebutan || '';
  $('judulForm').textContent = r ? 'Ubah penugasan' : 'Tetapkan koordinator';
  $('b_akhiri').hidden = !r; aturLab(); tulis('', '');
}
const aturLab = () => { $('l_lab').hidden = $('f_jab').value !== 'kepala_lab'; $('l_sebutan').hidden = !BERSEBUTAN.includes($('f_jab').value);
  $('wewenang').textContent = WEWENANG[$('f_jab').value] || ''; };

async function simpan(akhiri = false){
  const isi = { dosen_id: $('f_dosen').value, jabatan: $('f_jab').value, laboratorium_id: $('f_jab').value === 'kepala_lab' ? +$('f_lab').value || null : null,
    mulai: $('f_mulai').value, selesai: akhiri ? new Date().toISOString().slice(0, 10) : ($('f_selesai').value || null),
    nomor_sk: $('f_sk').value.trim() || null, oleh: SAYA.email, diperbarui: new Date().toISOString(),
    ...(BERSEBUTAN.includes($('f_jab').value) ? { sebutan: $('f_sebutan').value.trim().replace(/\s+/g, ' ') || null } : {}) };
  if (!isi.dosen_id || !isi.mulai) return tulis('buruk', 'Pilih dosen dan isi tanggal mulai.');
  if (isi.jabatan === 'kepala_lab' && !isi.laboratorium_id) return tulis('buruk', 'Pilih laboratoriumnya.');
  $('b_simpan').disabled = true;
  try {
    const f = [...$('f_berkas').files];
    if (f.length) {
      if (!UNGGAH) throw new Error('Layanan unggah belum disiapkan.');
      const nama = DOSEN.find(x => x.id === isi.dosen_id)?.nama || '';
      const d = await unggahKePustaka(sb, UNGGAH, { jenis: 'sk', tahun: isi.mulai.slice(0, 4), judul: `SK ${labelJabatan(isi.jabatan)} ${nama}`.slice(0, 120),
        berkas: f, oleh: SAYA.email, nomor: isi.nomor_sk, progres: s => tulis('', s) });
      isi.dokumen_id = d.id;
    }
    const q = SUNTING ? sb.from('koordinator').update(isi).eq('id', SUNTING) : sb.from('koordinator').insert(isi);
    const { error } = await q;
    if (error) throw new Error(error.message);
    await muat(); gambar(); isiForm(null); tulis('ok', akhiri ? 'Penugasan diakhiri hari ini.' : 'Tersimpan.');
  } catch (e) { tulis('buruk', e.message || String(e)); }
  finally { $('b_simpan').disabled = false; }
}

async function mulai(){
  SAYA = await gerbang(sb);
  if (!SAYA) return;
  $('hSub').textContent = `Masuk sebagai ${SAYA.nama}`;
  await muat();
  $('isi').innerHTML = `
    <p class="ket">Koordinator membantu Kaprodi dan menggantikan admin di bidangnya; admin tetap bisa semuanya. Wewenang berlaku selama
      periode penugasan (selesai kosong = sampai diakhiri). SK diunggah ke pustaka dokumen sebagai bukti tata pamong.</p>
    <div id="daftar"></div>
    <div class="kotak"><b id="judulForm">Tetapkan koordinator</b>
      <div class="grid" style="margin-top:8px">
        <label>Dosen<select id="f_dosen"><option value="">(pilih)</option>${opsi(DOSEN.map(x => [x.id, x.nama]))}</select></label>
        <label>Jabatan<select id="f_jab">${opsi(JABATAN)}</select></label>
        <label id="l_lab">Laboratorium<select id="f_lab"><option value="">(pilih)</option>${opsi(LAB.map(x => [String(x.id), x.nama]))}</select></label>
        <label>Mulai<input type="date" id="f_mulai"></label>
        <label>Selesai (opsional)<input type="date" id="f_selesai"></label>
        <label>Nomor SK<input id="f_sk" maxlength="200"></label>
        <label id="l_sebutan" hidden>Sebutan di dokumen (opsional)<input id="f_sebutan" maxlength="200" placeholder="mis. Pjs. Dekan Fakultas Perencanaan Infrastruktur"></label>
        <label>Berkas SK (ke pustaka dokumen)<input type="file" id="f_berkas" accept="${esc(UNGGAH?.accept || '.pdf')}"></label>
      </div>
      <p class="ket" id="wewenang"></p>
      <button class="b utama" id="b_simpan">Simpan</button> <button class="b" id="b_akhiri">Akhiri hari ini</button>
      <button class="b" id="b_baru">Baru</button><span class="msg" id="msg" role="status"></span></div>`;
  $('f_jab').onchange = aturLab;
  $('b_simpan').onclick = () => simpan(false);
  $('b_akhiri').onclick = () => { if (confirm('Akhiri penugasan ini hari ini?')) simpan(true); };
  $('b_baru').onclick = () => isiForm(null);
  gambar(); isiForm(null);
}
mulai().catch(e => { $('isi').innerHTML = `<p class="kosong">Gagal memuat: ${esc(e.message)}</p>`; });
</script>
</body>
</html>
