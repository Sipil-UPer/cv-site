<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Laporan kinerja tahunan — Program Studi</title>
<meta name="description" content="Laporan kinerja tahunan Program Studi Teknik Sipil: mahasiswa dan lulusan, prestasi, kepuasan pemangku kepentingan, capaian pembelajaran, penelitian, pengabdian, dan publikasi per tahun akademik.">
<meta property="og:title" content="Laporan kinerja tahunan">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tema.css?v=2026-11-28-cb6cb1">
<style>
  /* Laporan kinerja tahunan, versi publik (pemilik 2026-11-27): model isi yang sama dengan laporan Word admin
     (site/laporan-tahunan.js), tanpa IKU/IKT, perkiraan akreditasi, dan temuan internal. */
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15.5px;line-height:1.6}
  .kepala{background:var(--biru);color:#fff}
  .kepala-in{max-width:1120px;margin:0 auto;padding:38px 20px 30px;display:flex;flex-wrap:wrap;gap:16px 30px;align-items:flex-end;justify-content:space-between}
  .eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--biru-m2)}
  h1{font-family:var(--serif);font-size:clamp(30px,4.6vw,48px);margin:8px 0 6px;line-height:1.08}
  .kepala p{margin:0;color:var(--biru-m4);max-width:620px}
  .alat{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .alat label{font-size:14px;color:var(--biru-m4)}
  .alat select,.alat button{font:inherit;font-size:14px;padding:7px 12px;border:1px solid rgba(255,255,255,.5);background:transparent;color:#fff;cursor:pointer}
  .alat select option{color:var(--ink)}
  .alat button{background:#fff;color:var(--biru);font-weight:600}
  .alat button:disabled{opacity:.6;cursor:wait}
  .isi{max-width:1120px;margin:0 auto;padding:8px 20px 50px}
  .isi h2{font-family:var(--serif);font-size:26px;color:var(--biru);margin:34px 0 12px;padding-bottom:4px;border-bottom:3px solid var(--aksen)}
  .isi h3{font-size:17px;margin:20px 0 8px}
  .isi p.ket{color:var(--muted);font-style:italic;font-size:14px}
  .gulir{overflow-x:auto;margin:6px 0 14px}
  .isi table{border-collapse:collapse;width:100%;font-size:14px;background:#fff}
  .isi th{text-align:left;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);padding:6px 8px}
  .isi td{padding:6px 8px;border-bottom:1px solid var(--line-soft);vertical-align:top}
  .kosong{color:var(--muted);font-size:14px;margin:16px 0}
  .catatan{margin-top:30px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<script>
// Galat saat memuat skrip (mis. modul lama dari cache bercampur dengan
// halaman baru) ditampilkan sebagai pesan, bukan halaman kosong.
addEventListener('error', function (e) {
  if (document.getElementById('galat-muat')) return;
  var d = document.createElement('div');
  d.id = 'galat-muat';
  d.style.cssText = 'margin:16px;padding:12px 14px;border:1px solid var(--merah);' +
    'background:var(--merah-m3);color:var(--ink);font:14px/1.5 system-ui,sans-serif';
  d.textContent = 'Halaman gagal dimuat: ' + (e.message || 'galat skrip') +
    '. Tekan Ctrl+Shift+R untuk memuat ulang tanpa cache; bila tetap muncul, kirim pesan ini ke admin.';
  document.body.insertBefore(d, document.body.firstChild);
});
</script>
<main id="utama">
  <div class="kepala" role="region" aria-label="Pembuka halaman"><div class="kepala-in">
    <div><div class="eyebrow" id="hProdi">Program studi</div>
      <h1>Laporan kinerja tahunan</h1>
      <p>Ringkasan satu tahun akademik (1 September – 31 Agustus) atau satu tahun kalender dari data terverifikasi: mahasiswa dan lulusan, prestasi,
        kepuasan pemangku kepentingan, capaian pembelajaran, penelitian, pengabdian, dan publikasi.</p></div>
    <div class="alat"><label for="pilihPer">Periode</label><select id="pilihPer"><option value="ts">Tahun akademik</option>
      <option value="kalender">Tahun kalender</option></select><select id="pilihTS" aria-label="Tahun"></select>
      <button type="button" id="unduh">Unduh Word</button></div>
  </div></div>
  <div class="isi" id="isi"><p class="kosong">Memuat…</p></div>
</main>
<script src="config.js?v=2026-11-28-cb6cb1"></script>
<script type="module">
import { pasangKerangka, isiKerangka } from './kerangka.js?v=2026-11-28-cb6cb1';
pasangKerangka({ aktif: 'kinerja' });
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/+esm';
import { susunLaporan, htmlDariBlok, buatLaporanTahunan, pilihanTS, pilihanTahun } from './laporan-tahunan.js?v=2026-11-28-cb6cb1';

const $ = id => document.getElementById(id);
let D = null, SURVEI = [], TS = null, KAL = false;
const sb = window.SB_URL && window.SB_KEY ? createClient(window.SB_URL, window.SB_KEY) : null;

function gambar(){
  // Versi publik: hanya data publik (data.json) dan rekap survei yang sudah diterbitkan.
  $('isi').innerHTML = htmlDariBlok(susunLaporan({ D, ts: TS, survei: SURVEI }, { publik: true, kalender: KAL }))
    + `<p class="catatan">Grafik lintas tahun: <a href="kinerja.html">Kinerja program studi</a>. Rincian survei:
      <a href="hasil-survei.html">Hasil survei kepuasan</a>. Data diperbarui ${D.diperbarui || ''}.</p>`;
}

const simpanUrl = () => { try { history.replaceState(null, '', KAL ? `?periode=kalender&th=${TS}` : `?ts=${TS}`); } catch (_) {} };
// Daftar tahun sesuai periode; bawaan = periode terakhir yang sudah selesai (bukan yang berjalan).
function isiPilihan(minta){
  const ops = KAL ? pilihanTahun(D) : pilihanTS(D);
  TS = ops.some(o => o.ts === minta) ? minta : (ops.find(o => !o.label.includes('berjalan')) || ops[0]).ts;
  $('pilihTS').innerHTML = ops.map(o => `<option value="${o.ts}"${o.ts === TS ? ' selected' : ''}>${o.label}</option>`).join('');
}
$('pilihTS').onchange = e => { TS = +e.target.value; simpanUrl(); gambar(); };
$('pilihPer').onchange = e => { KAL = e.target.value === 'kalender'; isiPilihan(null); simpanUrl(); gambar(); };
$('unduh').onclick = async () => {
  const b = $('unduh'), asli = b.textContent;
  b.disabled = true; b.textContent = 'Menyusun…';
  try {
    const blob = await buatLaporanTahunan({ D, ts: TS, survei: SURVEI }, { publik: true, kalender: KAL });
    const u = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = u; a.download = KAL ? `laporan-kinerja-tahun-${TS}.docx` : `laporan-kinerja-${TS - 1}-${TS}.docx`; a.click();
    setTimeout(() => URL.revokeObjectURL(u), 5000);
    b.textContent = asli;
  } catch (e) { b.textContent = 'Gagal: ' + e.message; setTimeout(() => { b.textContent = asli; }, 5000); }
  finally { b.disabled = false; }
};

Promise.all([
  fetch('data.json', { cache: 'no-cache' }).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }),
  sb ? sb.rpc('survei_rekap').then(({ data }) => data || [], () => []) : Promise.resolve([])])
  .then(([d, sv]) => {
    D = d; SURVEI = sv;
    isiKerangka(d);
    $('hProdi').textContent = ['Program Studi ' + (d.prodi || ''), d.institusi].filter(Boolean).join(' · ');
    document.title = 'Laporan kinerja tahunan — ' + ['Program Studi ' + d.prodi, d.institusi].filter(Boolean).join(' ');
    const q = new URLSearchParams(location.search);
    KAL = q.get('periode') === 'kalender';
    $('pilihPer').value = KAL ? 'kalender' : 'ts';
    isiPilihan(+(KAL ? q.get('th') : q.get('ts')));
    gambar();
  })
  .catch(() => { $('isi').innerHTML = '<p class="kosong">Data sedang diperbarui. Silakan muat ulang beberapa saat lagi.</p>'; });
</script>
</body>
</html>
