<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Berkas privat</title>
<link rel="stylesheet" href="tema.css?v=2026-11-12-abe677">
<style>
  /* Berkas privat (pemilik 2026-11-06): tanpa tautan publik. Admin dan pemilik yang
     login langsung masuk (buka_bkd); asesor memakai kata sandi (buka_lkd_sandi). */
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
  .wrap{max-width:460px;margin:0 auto;padding:40px 16px}
  .wrap.lebar{max-width:1000px;padding-top:16px}
  .kartu{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:22px 24px}
  h1{font-family:var(--serif);font-size:22px;margin:0 0 6px}
  p{color:var(--muted);font-size:14px;margin:0 0 14px}
  label{display:block;font-size:13px;font-weight:600;margin-bottom:4px}
  input{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:3px}
  button{font:inherit;font-weight:600;background:var(--biru);color:#fff;border:0;border-radius:3px;
    padding:8px 16px;cursor:pointer;margin-top:12px}
  button[disabled]{opacity:.5;cursor:default}
  #msg{display:block;margin-top:10px;font-size:13.5px;color:var(--merah)}
  iframe{width:100%;height:80vh;border:1px solid var(--line);background:#fff}
  a{color:var(--biru-2)}
</style>
</head>
<body>
<main class="wrap" id="wadah">
  <div class="kartu" id="kartu">
    <h1>Berkas privat</h1>
    <p>Berkas ini memuat data pribadi atau internal, jadi dibuka dengan kata sandi dari program studi.</p>
    <p id="status" role="status" hidden>Membuka berkas… Mohon tunggu, biasanya beberapa detik.</p>
    <form id="form">
      <label for="sandi">Kata sandi</label>
      <input id="sandi" type="password" autocomplete="off" required>
      <button type="submit" id="buka">Buka berkas</button>
      <span id="msg" role="alert"></span>
    </form>
  </div>
</main>
<script src="config.js?v=2026-11-12-abe677"></script>
<script>
var q = new URLSearchParams(location.search), id = q.get('f') || '', tautan = q.get('t') || '';
var el = function (i) { return document.getElementById(i); };
if (!/^[A-Za-z0-9_-]{20,}$/.test(id)) {
  el('msg').textContent = 'Tautan berkas tidak lengkap.';
  el('buka').disabled = true;
}
// Berkas diambil utuh lewat Apps Script, jadi ada jeda beberapa detik.
function sedang(ya) {
  if (!el('form')) return;
  el('form').hidden = ya;
  el('status').hidden = !ya;
}
function minta(isi) {
  return fetch(window.UPLOAD_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(isi) }).then(function (r) { return r.json(); });
}
// Admin atau pemilik: tautan 2 bulan tanpa login, untuk laporan SISTER.
function pasangBagi(token) {
  el('bagi').innerHTML = '<button type="button" id="buat">Buat tautan sementara (2 bulan)</button>'
    + '<p id="bagi-ket" style="margin-top:8px">Siapa pun yang punya tautan ini bisa membuka berkas tanpa login, misalnya untuk laporan SISTER.</p>';
  el('buat').onclick = async function () {
    el('buat').disabled = true;
    var out = await minta({ token: token, kind: 'bagikan_sementara', url: 'https://drive.google.com/file/d/' + id + '/view' });
    if (!out.ok) { el('bagi-ket').textContent = out.error || 'Tautan gagal dibuat.'; el('buat').disabled = false; return; }
    var u = new URL(location.href);
    u.search = '?f=' + encodeURIComponent(id) + '&t=' + encodeURIComponent(out.token);
    el('bagi').innerHTML = '<label for="alamat">Tautan berlaku sampai ' + out.sampai + '</label><input id="alamat" readonly>'
      + '<button type="button" id="salin">Salin tautan</button>';
    el('alamat').value = u.href;
    el('salin').onclick = function () {
      el('alamat').select();
      navigator.clipboard.writeText(u.href).then(function () { el('salin').textContent = 'Tersalin'; });
    };
  };
}
function tampil(out, token) {
    var isi = Uint8Array.from(atob(out.data), function (c) { return c.charCodeAt(0); });
    var url = URL.createObjectURL(new Blob([isi], { type: out.mime || 'application/pdf' }));
    el('wadah').className = 'wrap lebar';
    el('kartu').innerHTML = '<div id="bagi" style="margin-bottom:14px"></div><p><a id="unduh">Unduh berkas</a></p>'
      + '<iframe id="pdf" title="Berkas"></iframe>';
    el('unduh').href = url;
    el('unduh').download = out.name || 'LKD.pdf';
    el('pdf').src = url;
    if (token) pasangBagi(token);
}
// Sudah login sebagai admin atau pemilik: tanpa kata sandi.
(async function () {
  if (!id) return;
  if (tautan) {
    sedang(true);
    var t = await minta({ kind: 'buka_lkd_token', id: id, tautan: tautan }).catch(function (e) { return { error: e.message }; });
    if (t.ok) return tampil(t);
    sedang(false);
    el('msg').textContent = (t.error || 'Tautan tidak sah.') + ' Masukkan kata sandi bila Anda memilikinya.';
  }
  try {
    var m = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
    var s = (await m.createClient(window.SB_URL, window.SB_KEY).auth.getSession()).data.session;
    if (!s) {
      // Masa akses asesor dibuka admin (pemilik 2026-11-10): tanpa kata sandi.
      sedang(true);
      var a = await minta({ kind: 'buka_lkd_asesor', id: id }).catch(function () { return {}; });
      if (a.ok) {
        tampil(a);
        el('bagi').textContent = 'Akses asesor tanpa kata sandi berlaku sampai ' + a.sampai + '.';
        return;
      }
      sedang(false);
      return;
    }
    sedang(true);
    var out = await minta({ token: s.access_token, kind: 'buka_bkd', url: 'https://drive.google.com/file/d/' + id + '/view' });
    if (out.ok) tampil(out, s.access_token);
    else sedang(false);
  } catch (e) { sedang(false); /* formulir kata sandi tetap tersedia */ }
})();
el('form').onsubmit = async function (e) {
  e.preventDefault();
  el('buka').disabled = true;
  el('msg').textContent = '';
  sedang(true);
  try {
    var out = await minta({ kind: 'buka_lkd_sandi', id: id, sandi: el('sandi').value });
    if (!out.ok) throw new Error(out.error || 'Berkas tidak bisa dibuka.');
    tampil(out);
  } catch (err) {
    sedang(false);
    el('msg').textContent = err.message || String(err);
    el('buka').disabled = false;
  }
};
</script>
</body>
</html>
