<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Berkas pribadi dosen</title>
<link rel="stylesheet" href="tema.css?v=2026-11-06-f488b4">
<style>
  /* LKD untuk asesor (pemilik 2026-11-06): berkas tanpa tautan publik, dibuka
     dengan kata sandi lewat Apps Script (kind buka_lkd_sandi). */
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
  .wrap{max-width:460px;margin:0 auto;padding:40px 16px}
  .wrap.lebar{max-width:1000px;padding-top:16px}
  .kartu{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:22px 24px}
  h1{font-family:var(--serif);font-size:22px;margin:0 0 6px}
  p{color:var(--muted);font-size:14px;margin:0 0 14px}
  label{display:block;font-size:13px;font-weight:600;margin-bottom:4px}
  input{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:3px}
  button{font:inherit;font-weight:600;background:var(--biru);color:#fff;border:0;border-radius:3px;
    padding:8px 16px;cursor:pointer;margin-top:12px}
  button[disabled]{opacity:.5;cursor:default}
  #msg{display:block;margin-top:10px;font-size:13.5px;color:var(--merah)}
  iframe{width:100%;height:80vh;border:1px solid var(--line);background:#fff}
  a{color:var(--biru-2)}
</style>
</head>
<body>
<main class="wrap" id="wadah">
  <div class="kartu" id="kartu">
    <h1>Berkas pribadi dosen</h1>
    <p>Laporan Kinerja Dosen memuat data pribadi, jadi dibuka dengan kata sandi dari program studi.</p>
    <form id="form">
      <label for="sandi">Kata sandi</label>
      <input id="sandi" type="password" autocomplete="off" required>
      <button type="submit" id="buka">Buka berkas</button>
      <span id="msg" role="alert"></span>
    </form>
  </div>
</main>
<script src="config.js?v=2026-11-06-f488b4"></script>
<script>
var id = new URLSearchParams(location.search).get('f') || '';
var el = function (i) { return document.getElementById(i); };
if (!/^[A-Za-z0-9_-]{20,}$/.test(id)) {
  el('msg').textContent = 'Tautan berkas tidak lengkap.';
  el('buka').disabled = true;
}
el('form').onsubmit = async function (e) {
  e.preventDefault();
  el('buka').disabled = true;
  el('msg').textContent = '';
  try {
    var res = await fetch(window.UPLOAD_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ kind: 'buka_lkd_sandi', id: id, sandi: el('sandi').value }) });
    var out = await res.json();
    if (!out.ok) throw new Error(out.error || 'Berkas tidak bisa dibuka.');
    var isi = Uint8Array.from(atob(out.data), function (c) { return c.charCodeAt(0); });
    var url = URL.createObjectURL(new Blob([isi], { type: out.mime || 'application/pdf' }));
    el('wadah').className = 'wrap lebar';
    el('kartu').innerHTML = '<p><a id="unduh">Unduh berkas</a></p><iframe id="pdf" title="Berkas"></iframe>';
    el('unduh').href = url;
    el('unduh').download = out.name || 'LKD.pdf';
    el('pdf').src = url;
  } catch (err) {
    el('msg').textContent = err.message || String(err);
    el('buka').disabled = false;
  }
};
</script>
</body>
</html>
