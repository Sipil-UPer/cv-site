<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Mutu data — Ruang kerja</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tema.css?v=2026-11-22-866c27">
<link rel="stylesheet" href="kepala.css?v=2026-11-22-866c27">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
  .wrap{max-width:1000px;margin:0 auto;padding:18px 20px 80px}
  .kosong, .ket{color:var(--muted)}
  .ket{font-size:13px}
  /* Pemeriksa mutu data (pemilik 2026-11-11) */
  .ringkas{display:flex;gap:18px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);
    border-top:4px solid var(--aksi);padding:14px 18px;margin-bottom:16px}
  .ringkas b{font-size:20px}
  .ringkas .aksi{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .ringkas button{font:13px var(--sans);padding:6px 12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
  .ringkas button:hover{border-color:var(--biru);color:var(--biru)}
  details.cek{background:var(--panel);border:1px solid var(--line);margin-bottom:10px;padding:8px 16px}
  details.cek > summary{cursor:pointer;display:flex;gap:10px;align-items:baseline;list-style:none}
  details.cek > summary::-webkit-details-marker{display:none}
  details.cek > summary h2{font-size:15.5px;margin:0;flex:1}
  .tkt{font-size:11.5px;font-weight:600;padding:1px 7px;border:1px solid currentColor;border-radius:3px;white-space:nowrap}
  .jml{font-family:var(--mono);font-size:14px;min-width:3ch;text-align:right}
  .jml.nol{color:var(--hijau)}
  details.cek ol{margin:8px 0 6px;padding-left:22px;font-size:13.5px}
  details.cek li{margin:3px 0;overflow-wrap:anywhere}
  details.cek a.ke{font-size:13px;color:var(--aksi)}
  .sembunyi-bersih details.cek.bersih{display:none}
</style>
</head>
<body>
<header class="hero"><div class="hero-in">
  <div class="hero-inst" data-identitas></div>
  <h1>Mutu data</h1>
  <div class="sub" id="hSub">Memuat…</div>
</div></header>
<main class="wrap" id="isi"><p class="kosong">Memuat…</p></main>
<script src="config.js?v=2026-11-22-866c27"></script>
<script>
// Galat saat memuat skrip (mis. modul lama dari cache bercampur dengan
// halaman baru) ditampilkan sebagai pesan, bukan halaman kosong.
addEventListener('error', function (e) {
  if (document.getElementById('galat-muat')) return;
  var d = document.createElement('div');
  d.id = 'galat-muat';
  d.style.cssText = 'margin:16px;padding:12px 14px;border:1px solid var(--merah);' +
    'background:var(--merah-m3);color:var(--ink);font:14px/1.5 system-ui,sans-serif';
  d.textContent = 'Halaman gagal dimuat: ' + (e.message || 'galat skrip') +
    '. Tekan Ctrl+Shift+R untuk memuat ulang tanpa cache; bila tetap muncul, kirim pesan ini ke admin.';
  document.body.insertBefore(d, document.body.firstChild);
});
</script>
<script type="module">
// Pemeriksa mutu data (pemilik 2026-11-11): admin melihat data yang perlu
// diperbaiki sebelum asesor/auditor. Hanya membaca; aturannya di mutu-data.js.
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/+esm';
import { gerbang } from './menu.js?v=2026-11-22-866c27';
import { bolehMutu } from './koordinator.js?v=2026-11-22-866c27';
import { periksaMutu, periksaSitus, tautanInternal, csvMutu, TINGKAT } from './mutu-data.js?v=2026-11-22-866c27';

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = id => document.getElementById(id);
const sb = createClient(window.SB_URL, window.SB_KEY);
const TAMPIL = 200;   // butir temuan yang ditampilkan per pemeriksaan; CSV memuat semuanya

// Supabase membatasi 1000 baris per permintaan: ambil berhalaman.
async function semua(buat){
  const out = [];
  for (let awal = 0; ; awal += 1000) {
    const { data, error } = await buat().range(awal, awal + 999);
    if (error) throw new Error(error.message);
    out.push(...(data || []));
    if (!data || data.length < 1000) return out;
  }
}
const aman = async (nama, janji) => { try { return await janji; } catch (e) { GAGAL.push(`${nama}: ${e.message}`); return []; } };
const GAGAL = [];

async function mulai(){
  const saya = await gerbang(sb);
  if (!saya) return;
  $('hSub').textContent = `Masuk sebagai ${saya.nama}`;
  if (!bolehMutu(saya)) { $('isi').innerHTML = '<p class="kosong">Halaman ini khusus admin prodi dan GKM.</p>'; return; }
  $('isi').innerHTML = '<p class="kosong">Memeriksa data…</p>';
  const [karya, karyaBukti, karyaPenulis, dosen, mk, kerjasama, tracer, rps, rpsTtd, bidang] = await Promise.all([
    aman('karya', semua(() => sb.from('karya').select('id,kategori,judul,judul_norm,tahun,jenis,doi,url,bukti_url,status,induk_id,dibuat_pada')
      .in('status', ['diajukan', 'terverifikasi']).order('id'))),
    aman('karya_bukti', semua(() => sb.from('karya_bukti').select('karya_id').order('id'))),
    aman('karya_penulis', semua(() => sb.from('karya_penulis').select('karya_id').order('karya_id').order('dosen_id'))),
    aman('dosen', semua(() => sb.from('dosen').select('*').order('nama'))),   // * : nama_gelar (111), bidang_keahlian
    aman('ref_mata_kuliah', semua(() => sb.from('ref_mata_kuliah').select('*').order('id'))),
    aman('lkps_kerjasama', semua(() => sb.from('lkps_kerjasama').select('mitra,jenis,tanggal_selesai,tahun_selesai').order('id'))),
    aman('lkps_tracer_lulusan', semua(() => sb.from('lkps_tracer_lulusan').select('*').order('id'))),
    aman('mk_rps', semua(() => sb.from('mk_rps').select('kurikulum,kode_mk,revisi').order('kurikulum').order('kode_mk'))),
    aman('mk_rps_ttd', semua(() => sb.from('mk_rps_ttd').select('kurikulum,kode_mk,revisi').order('id'))),
    aman('ref_bidang_keahlian', semua(() => sb.from('ref_bidang_keahlian').select('nama,aktif').order('urutan'))),
  ]);
  const hasil = periksaMutu({ karya, karyaBukti, karyaPenulis, dosen, mk, kerjasama, tracer, rps, rpsTtd, bidang });
  // Situs publik (pemilik 2026-11-22): dari data.json yang tayang (dibangun bangun.py tiap jam).
  const publik = await aman('data.json', fetch('data.json?v=' + Date.now()).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }));
  if (publik && !Array.isArray(publik)) hasil.push(...periksaSitus(publik));
  gambar(hasil);
}

function gambar(hasil){
  const n = t => hasil.filter(h => h.tingkat === t).reduce((a, h) => a + h.temuan.length, 0);
  const bersih = hasil.filter(h => !h.temuan.length).length;
  $('isi').innerHTML = `<p class="ket">Pemeriksaan otomatis atas data yang sudah masuk (karya diajukan/terverifikasi, dosen, MK,
      kerja sama, tracer). Tidak ada yang diubah di halaman ini; perbaiki lewat tautan di tiap pemeriksaan, lalu muat ulang.
      Draf karya dosen tidak terlihat admin, jadi tidak ikut diperiksa.</p>
    ${GAGAL.length ? `<p class="ket" style="color:var(--merah)">Sebagian data tidak terbaca: ${esc(GAGAL.join('; '))}.</p>` : ''}
    <div class="ringkas">
      ${['penting', 'periksa', 'info'].map(t => `<span><b style="color:${TINGKAT[t][1]}">${n(t)}</b> ${TINGKAT[t][0].toLowerCase()}</span>`).join('')}
      <span class="ket">${bersih} dari ${hasil.length} pemeriksaan bersih</span>
      <span class="aksi"><label class="ket"><input type="checkbox" id="sembunyi" checked> sembunyikan yang bersih</label>
        <button type="button" id="csv">Unduh CSV</button><button type="button" id="cekTautan">Periksa tautan internal</button></span></div>
    <div id="hasilTautan"></div>
    ${hasil.map(h => `<details class="cek${h.temuan.length ? '' : ' bersih'}"${h.temuan.length && h.tingkat === 'penting' ? ' open' : ''}>
      <summary><span class="tkt" style="color:${TINGKAT[h.tingkat][1]}">${TINGKAT[h.tingkat][0]}</span><h2>${esc(h.judul)}</h2>
        <span class="jml${h.temuan.length ? '' : ' nol'}">${h.temuan.length || '✓'}</span></summary>
      <p class="ket">${esc(h.ket)} <a class="ke" href="${esc(h.ke)}">Perbaiki di sini ›</a></p>
      ${h.temuan.length ? `<ol>${h.temuan.slice(0, TAMPIL).map(t => `<li>${esc(t.teks)}</li>`).join('')}</ol>
        ${h.temuan.length > TAMPIL ? `<p class="ket">… dan ${h.temuan.length - TAMPIL} lainnya (lihat CSV).</p>` : ''}` : '<p class="ket">Tidak ada temuan.</p>'}
    </details>`).join('')}`;
  $('cekTautan').onclick = () => periksaTautan(hasil);
  const atur = () => document.body.classList.toggle('sembunyi-bersih', $('sembunyi').checked);
  $('sembunyi').onchange = atur; atur();
  $('csv').onclick = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csvMutu(hasil)], { type: 'text/csv;charset=utf-8' }));
    a.download = `mutu-data-${new Date().toISOString().slice(0, 10)}.csv`;
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1500);
  };
}

// Tautan internal rusak (pemilik 2026-11-22): jelajahi halaman situs dari beranda (paling banyak MAKS_HALAMAN), lalu cek
// setiap tujuan .html sekali. Hanya berkas di folder situs ini; tautan luar tidak bisa dicek dari peramban (CORS).
const MAKS_HALAMAN = 400;
async function periksaTautan(hasil){
  const tombol = $('cekTautan'), kotak = $('hasilTautan');
  tombol.disabled = true;
  const akar = new URL('./', location.href).href;
  const dikunjungi = new Map(), antre = [akar + 'index.html'], status = new Map(), asal = new Map();
  // Titik awal: semua alamat di sitemap.xml (alamatnya memakai domain situs; dipetakan ke folder ini lewat alamat pertama =
  // beranda), menu kepala dan kaki (dibuat skrip, tidak ada di HTML), lalu tautan statis di tiap halaman.
  const awal = (u, dari) => { if (!antre.includes(u)) antre.push(u); if (!asal.has(u)) asal.set(u, dari); };
  try {
    const peta = await (await fetch(akar + 'sitemap.xml', { cache: 'no-store' })).text();
    const loc = [...peta.matchAll(/<loc>([^<]+)<\/loc>/g)].map(m => m[1].replace(/&amp;/g, '&'));
    const dasar = loc.find(u => u.endsWith('/')) || '';
    loc.forEach(u => { if (dasar && u.startsWith(dasar)) awal(akar + (u.slice(dasar.length) || 'index.html'), 'sitemap.xml'); });
  } catch { /* tanpa sitemap: mulai dari beranda dan menu saja */ }
  try {
    const { MENU } = await import('./kerangka.js?v=2026-11-22-866c27');
    MENU.flatMap(m => m.isi).map(x => x.href).filter(h => h && !h.startsWith('#'))
      .forEach(h => { const u = new URL(h, akar); u.hash = ''; u.search = ''; awal(u.href, 'menu kepala'); });
  } catch { /* menu tidak terbaca */ }
  ['privasi.html', 'peta-situs.html', 'ruang-kerja.html'].forEach(h => awal(akar + h, 'kaki halaman'));
  const ambil = async u => { if (!status.has(u)) status.set(u, fetch(u, { cache: 'no-store' }).then(r => r.ok ? r.text().then(t => [r.status, t]) : [r.status, ''])
    .catch(() => [0, ''])); return status.get(u); };
  try {
    while (antre.length && dikunjungi.size < MAKS_HALAMAN) {
      const kelompok = antre.splice(0, 6).filter(u => !dikunjungi.has(u));
      kotak.innerHTML = `<p class="ket">Memeriksa tautan… ${dikunjungi.size} halaman dibaca.</p>`;
      await Promise.all(kelompok.map(async u => {
        const [kode, isi] = await ambil(u);
        dikunjungi.set(u, kode);
        // Halaman ruang kerja tidak dijelajahi lebih jauh (isinya dibuat skrip setelah masuk); tetap dicek ada atau tidak.
        if (kode !== 200 || /<meta name="robots" content="noindex/.test(isi)) return;
        for (const t of tautanInternal(isi, u, akar)) {
          if (!asal.has(t)) asal.set(t, u);
          if (!dikunjungi.has(t) && !antre.includes(t)) antre.push(t);
        }
      }));
    }
    const rusak = [...dikunjungi].filter(([, k]) => k !== 200).map(([u, k]) =>
      ({ teks: `${u.slice(akar.length)} (${k || 'gagal dibuka'}) — ditautkan dari ${(asal.get(u) || '').slice(akar.length) || '?'}` }));
    const h = { id: 'situs_tautan', judul: 'Situs publik: Tautan internal rusak', tingkat: 'penting',
      ket: `${dikunjungi.size} halaman diperiksa${antre.length ? ` (berhenti di batas ${MAKS_HALAMAN})` : ''}.`, ke: 'peta-situs.html', temuan: rusak };
    hasil.push(h);
    kotak.innerHTML = `<details class="cek" open><summary><span class="tkt" style="color:${TINGKAT.penting[1]}">${TINGKAT.penting[0]}</span>
      <h2>${esc(h.judul)}</h2><span class="jml${rusak.length ? '' : ' nol'}">${rusak.length || '✓'}</span></summary>
      <p class="ket">${esc(h.ket)} Tautan luar (DOI, situs mitra) tidak ikut diperiksa.</p>
      ${rusak.length ? `<ol>${rusak.map(t => `<li>${esc(t.teks)}</li>`).join('')}</ol>` : '<p class="ket">Tidak ada tautan rusak.</p>'}</details>`;
  } catch (e) { kotak.innerHTML = `<p class="kosong">Pemeriksaan tautan gagal: ${esc(e.message)}</p>`; }
  finally { tombol.disabled = false; }
}

mulai().catch(e => { $('isi').innerHTML = `<p class="kosong">Gagal memuat: ${esc(e.message)}</p>`; });
</script>
</body>
</html>
