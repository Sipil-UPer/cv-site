<head>

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@500;600&display=swap" rel="stylesheet">

<style>
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
  .wrap{max-width:1120px;margin:0 auto;padding:18px 20px 80px}
  .kosong, .ket{color:var(--muted)} .ket{font-size:13px}
  .tab{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
  .tab button{font:inherit;font-size:14px;padding:6px 12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
  .tab button[aria-pressed="true"]{border-color:var(--biru);box-shadow:0 0 0 1px var(--biru);font-weight:600}
  .tab .n{font-family:var(--mono);font-size:12px;color:var(--muted);margin-left:4px}
  .saring{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin:0 0 12px;font-size:13.5px}
  .saring select, .saring input{font:inherit;font-size:14px;padding:5px 7px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
  .saring input{min-width:220px}
  .kartu{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--line);margin:0 0 10px}
  .kartu.tunggu{border-left-color:var(--biru)} .kartu.dikembalikan{border-left-color:var(--emas)}
  .kartu.disetujui{border-left-color:var(--hijau)} .kartu.ditolak{border-left-color:var(--merah)}
  .kartu summary{cursor:pointer;padding:10px 14px;list-style:none;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
  .kartu summary::-webkit-details-marker{display:none}
  .kartu .judul{font-weight:600}
  .kartu .meta{font-size:13px;color:var(--muted)}
  .lencana{font-family:var(--mono);font-size:11px;text-transform:uppercase;padding:1px 6px;border:1px solid var(--line);color:var(--muted)}
  .lencana.saya{border-color:var(--biru);color:var(--biru)}
  .badan{padding:0 14px 14px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:760px){.badan{grid-template-columns:1fr}}
  .badan h3{font-size:13px;color:var(--muted);font-weight:500;margin:6px 0 4px;text-transform:uppercase;letter-spacing:.04em}
  dl{display:grid;grid-template-columns:max-content 1fr;gap:2px 12px;margin:0;font-size:14px}
  dt{color:var(--muted)} dd{margin:0;overflow-wrap:anywhere;white-space:pre-line}
  ul.polos{list-style:none;margin:0;padding:0;font-size:14px}
  ul.polos li{display:flex;gap:8px;align-items:center;padding:3px 0;border-bottom:1px solid var(--line-soft)}
  ul.polos li .isi{flex:1;min-width:0;overflow-wrap:anywhere}
  .riwayat li{display:block}
  .riwayat .cat{white-space:pre-line;color:var(--ink)}
  button.b{font:inherit;font-size:13.5px;padding:5px 11px;border:1px solid var(--biru);background:var(--panel);color:var(--biru);cursor:pointer}
  button.utama{background:var(--biru);color:#fff} button.awas{border-color:var(--merah);color:var(--merah)}
  button.b:disabled{opacity:.55;cursor:default}
  .aksi{grid-column:1/-1;border-top:1px solid var(--line-soft);padding-top:10px}
  .aksi textarea{width:100%;font:inherit;font-size:14px;min-height:60px;padding:7px 9px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
  .baris{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px}
  .kotak-rekap{background:var(--panel);border:1px solid var(--line);padding:8px 14px;margin:0 0 12px}
  .kotak-rekap summary{cursor:pointer;font-weight:600}
  .ringkas-angka{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
  .ringkas-angka div{border:1px solid var(--line);background:var(--bg);padding:6px 12px}
  .ringkas-angka b{font-family:var(--mono);font-size:18px;display:block}
  .ringkas-angka span{font-size:12.5px;color:var(--muted)}
  .t-rekap{border-collapse:collapse;font-size:14px;margin:6px 0;min-width:320px}
  .t-rekap th{text-align:left;font-size:12px;color:var(--muted);font-weight:500;border-bottom:1px solid var(--line);padding:4px 10px}
  .t-rekap td{border-bottom:1px solid var(--line-soft);padding:4px 10px}
  .t-rekap td+td, .t-rekap th+th{text-align:right;font-family:var(--mono)}
  .jadwal-form{border:1px solid var(--line);background:var(--bg);padding:8px 10px;margin-bottom:8px}
  .jadwal-form label{font-size:13.5px}
  .jadwal-form input{font:inherit;font-size:13.5px;padding:3px 6px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
  .usulan ol{margin:2px 0 6px;padding-left:20px;font-size:13.5px}
  .penguji{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:2px 12px;font-size:13.5px}
  .msg{font-size:13.5px} .msg.buruk{color:var(--merah)} .msg.ok{color:var(--hijau)}
</style>

<script>
// Galat saat memuat skrip ditampilkan sebagai pesan, bukan halaman kosong.
addEventListener('error', function (e) {
  if (document.getElementById('galat-muat')) return;
  var d = document.createElement('div');
  d.id = 'galat-muat';
  d.style.cssText = 'margin:16px;padding:12px 14px;border:1px solid var(--merah);' +
    'background:var(--merah-m3);color:var(--ink);font:14px/1.5 system-ui,sans-serif';
  d.textContent = 'Halaman gagal dimuat: ' + (e.message || 'galat skrip') +
    '. Tekan Ctrl+Shift+R untuk memuat ulang tanpa cache; bila tetap muncul, kirim pesan ini ke admin.';
  document.body.insertBefore(d, document.body.firstChild);
});
</script>
<script type="module">
// Pengajuan KP dan laporan lomba dari mahasiswa (90-patch-pengajuan-mahasiswa.sql, pemilik 2026-11-17).
// Bertingkat: dosen pembimbing lalu admin. Pembimbing hanya melihat pengajuan bimbingannya (RLS); admin semua.
// Berkas privat dibuka lewat Apps Script (mhs_buka_prodi); surat pengantar KP diunggah admin (mhs_unggah_prodi);
// mahasiswa dikabari email saat dikembalikan, ditolak, atau disetujui (mhs_kabari).
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/+esm';
import { gerbang } from './menu.js?v=2026-11-18-f65a5e';
import { bolehPengajuan, punya, labelJabatan } from './koordinator.js?v=2026-11-18-f65a5e';
import { JENIS, LABEL_BERKAS, LABEL_STATUS, TINGKAT, BIDANG, teksAnggota, judulPengajuan, keB64, bukaIsi, appsScript, labelStatus, JENIS_SURAT, TAHAP_TA, JENIS_PUB, TINGKAT_PUB, INDEKSASI, JENIS_LUARAN, waktuPengajuan, rekapPengajuan, lembarPengajuan, labelProgram } from './pengajuan-mhs.js?v=2026-11-18-f65a5e';
import { opsiPeriode, cocokPeriode, labelPeriode, taTeks, tsKarya } from './sdgs-unduh.js?v=2026-11-18-f65a5e';
import { SHEETJS } from './nilai-cpl.js?v=2026-11-18-f65a5e';
import { barisKuota, teksPilihanPembimbing } from './rekap-kp.js?v=2026-11-18-f65a5e';
import { siapkan } from './pembimbing.js?v=2026-11-18-f65a5e';
import { usulPenguji, bebanUji, tsDari } from './usulan-penguji.js?v=2026-11-18-f65a5e';

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = id => document.getElementById(id);
const sb = createClient(window.SB_URL, window.SB_KEY);
const tgl = s => s ? new Date(s).toLocaleString('id-ID', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
const KABARI = new Set(['dikembalikan', 'ditolak', 'disetujui']);   // status yang dikabarkan ke email mahasiswa
let SAYA = null, ADMIN = false, UNDUH = false, DATA = [], TAB = 'tunggu', BUKA = new Set();
// Seminar/sidang TA (94): daftar dosen (NIDN, nama) untuk penguji; jadwal per pengajuan.
let DOSEN = [], JADWAL = new Map(), SEMUA_JADWAL = [], MODEL = null;   // MODEL: mesin Cari pembimbing (usulan penguji)
// Pembimbing KP ditetapkan koordinator KP/admin (107): beban dan kuota per TS (kp_beban), Map ts -> baris.
let BEBAN = new Map();
const tsKP = p => tsDari(String(p.data_selesai?.tanggal_mulai || p.data?.tanggal_mulai || p.data?.rencana_mulai || p.dibuat || ''));
const bolehTetapkan = p => p.jenis === 'kp' && boleh(p) && !['draf', 'ditolak'].includes(p.status)
  && !(p.tahap === 'selesai' && p.status === 'disetujui');

// Koordinator bidangnya menggantikan admin (97); surat tetap admin.
const boleh = p => bolehPengajuan(SAYA, p.jenis);
const menungguSaya = p => (p.status === 'pembimbing' && (p.pembimbing_id === SAYA.id || boleh(p))) || (p.status === 'admin' && boleh(p));
const sesi = async () => (await sb.auth.getSession()).data.session?.access_token;

async function muat(){
  // tahap/data_selesai: 91-patch-laporan-selesai-kp.sql; sebelum patch itu dibaca tanpa kolom tersebut.
  const baca = (kp, kr) => sb.from('pengajuan_mahasiswa')
    .select('id,jenis,nim,nama,email,status,data,pembimbing_id,prestasi_id,dibuat,diperbarui,dosen(nama),' + kp
      + 'pengajuan_berkas(id,jenis,nama,oleh,dibuat,url),pengajuan_riwayat(status,oleh,catatan,waktu' + kr + ')')
    .order('diperbarui', { ascending: false }).limit(1000);
  let { data, error } = await baca('tahap,data_selesai,', ',tahap');
  if (error && /tahap|data_selesai/.test(error.message)) ({ data, error } = await baca('', ''));
  if (error) throw new Error(/pengajuan_mahasiswa/.test(error.message) ? 'Tabel belum ada: jalankan supabase/90-patch-pengajuan-mahasiswa.sql.' : error.message);
  DATA = data || [];
  const [dq, jq] = await Promise.all([sb.from('dosen').select('id,nidn,nama,aktif,peran,dtps').order('nama'),
    sb.from('jadwal_ta').select('pengajuan_id,tanggal,jam,ruang,tautan_daring,status,penguji,penguji_luar')]);
  // Calon penguji = aturan daftar dosen Data prodi: DTPS atau berperan dosen/pimpinan; staf admin non-dosen tidak.
  DOSEN = (dq.data || []).filter(d => d.aktif && d.nidn && (d.dtps || ['dosen', 'pimpinan'].includes(d.peran)));
  SEMUA_JADWAL = jq.error ? [] : jq.data || [];
  JADWAL = new Map(SEMUA_JADWAL.filter(j => j.pengajuan_id).map(j => [j.pengajuan_id, j]));
  // Beban/kuota hanya untuk TS pengajuan KP yang pembimbingnya bisa ditetapkan; sebelum patch 107: kosong.
  BEBAN = new Map();
  for (const ts of new Set(DATA.filter(bolehTetapkan).map(tsKP).filter(Boolean))) {
    const { data: b, error: eb } = await sb.rpc('kp_beban', { p_ts: ts });
    if (!eb) BEBAN.set(ts, barisKuota(b));
  }
  if (!MODEL) MODEL = await fetch('data.json?v=' + Date.now()).then(r => r.ok ? r.json() : null).then(d => d ? siapkan(d) : null).catch(() => null);
}

const lbl = (xs, k) => (xs.find(t => t[0] === k) || [, ''])[1];
function ringkasLuaran(d){
  return [['Kategori', d.kategori === 'luaran' ? 'Luaran (HKI, produk, buku)' : 'Publikasi'], ['Judul', d.judul],
    ['Jenis', d.kategori === 'luaran' ? lbl(JENIS_LUARAN, d.jenis_luaran) : lbl(JENIS_PUB, d.jenis_pub)],
    ['Tingkat / indeksasi', [lbl(TINGKAT_PUB, d.tingkat), lbl(INDEKSASI, d.indeksasi)].filter(Boolean).join(' · ')],
    ['Terbitan', d.terbitan], ['Nomor', d.nomor], ['Status paten', d.status_hki], ['TKT', d.tkt],
    ['Tahun', [d.bulan, d.tahun].filter(Boolean).join('/')], ['DOI/URL', d.doi_url], ['Anggota lain', teksAnggota(d.anggota)],
    ['Bersama dosen prodi', d.bersama_dosen ? 'ya (dicatat lewat karya dosen)' : 'tidak (mandiri)']];
}

function ringkas(p){
  const d = p.data || {};
  const nmDosen = id => DOSEN.find(x => x.id === id)?.nama || '';
  const nmNidn = n => DOSEN.find(x => x.nidn === n)?.nama || n;
  const j = JADWAL.get(p.id);
  const xs = p.jenis === 'luaran' ? ringkasLuaran(d)
    : p.jenis === 'ta'
    ? [['Tahap', (TAHAP_TA.find(t => t[0] === d.tahap_ta) || [, ''])[1]], ['Judul', d.judul], ['Pembimbing 2', nmDosen(d.pembimbing_2)],
       ['Nama di jadwal publik', d.tampil_nama ? 'disetujui mahasiswa' : 'tidak'],
       ...(j ? [['Jadwal', [j.tanggal, j.jam, j.ruang, j.tautan_daring ? 'daring' : ''].filter(Boolean).join(' · ') + (j.status !== 'terjadwal' ? ` (${j.status})` : '')],
                ['Penguji', [...(j.penguji || []).map(nmNidn), j.penguji_luar].filter(Boolean).join(', ')]] : [])]
    : p.jenis === 'surat'
    ? [['Jenis surat', judulPengajuan(p)], ['Keperluan', d.keperluan], ['Tujuan', [d.tujuan_surat, d.alamat_tujuan].filter(Boolean).join(', ')],
       ['Judul penelitian', d.judul_penelitian], ['Lokasi', d.lokasi], ['Waktu', d.waktu_pelaksanaan]]
    : p.jenis === 'kp'
    ? [['Program', labelProgram(d.program)], ['Instansi', d.instansi], ['Alamat', d.alamat_instansi], ['Bidang/divisi', d.bidang_kerja],
       ['Kontak', d.kontak_instansi],
       ['Rencana', [d.rencana_mulai, d.rencana_selesai].filter(Boolean).join(' s.d. ')],
       // Jawaban instansi atas surat pengantar (107).
       ['Jawaban instansi', d.jawaban_instansi === 'diterima' ? `diterima${d.tanggal_mulai ? ', mulai ' + d.tanggal_mulai : ''}`
         : d.jawaban_instansi === 'ditolak' ? `ditolak${d.alasan_instansi ? ': ' + d.alasan_instansi : ''} (pengajuan ditutup)` : ''],
       // Lapor selesai KP (106): KP yang sudah selesai sebelum layanan dipakai; tanpa surat pengantar.
       ['Dilaporkan', d.susulan === 'selesai' ? 'setelah KP selesai (tanpa surat pengantar)' : '']]
    : [['Kegiatan', d.nama_kegiatan], ['Penyelenggara', d.penyelenggara], ['Tanggal', d.tanggal],
       ['Tingkat', (TINGKAT.find(t => t[0] === d.tingkat) || [, ''])[1]], ['Bidang', (BIDANG.find(t => t[0] === d.bidang) || [, ''])[1]],
       ['Capaian', d.capaian], ['Anggota lain', teksAnggota(d.anggota)], ['Nama di situs', d.tampil_nama ? 'disetujui mahasiswa' : 'tidak'],
       ['Cerita', d.cerita]];
  const s = p.data_selesai || {};
  const selesai = p.tahap === 'selesai' || Object.keys(s).length ? [['Laporan selesai: tanggal', [s.tanggal_mulai, s.tanggal_selesai].filter(Boolean).join(' s.d. ')],
    ['Pembimbing lapangan', [s.pembimbing_lapangan, s.jabatan_lapangan].filter(Boolean).join(', ')], ['Kontak lapangan', s.kontak_lapangan],
    ['Bagian/proyek', s.divisi], ['Ringkasan kegiatan', s.ringkasan]] : [];
  return [['Mahasiswa', `${p.nama} (${p.nim})`], ['Email', p.email], ['Pembimbing', p.dosen?.nama || '—'], ...xs, ...selesai].filter(([, v]) => v);
}

// Nilai pembimbing lapangan (99-patch-kp-magang.sql, pemilik 2026-11-17): diunggah dosen pembimbing pengajuan itu,
// koordinator KP, atau admin, setelah pengajuan KP disetujui (atau pada laporan selesai).
const bolehNilai = p => p.jenis === 'kp' && (p.status === 'disetujui' || p.tahap === 'selesai')
  && (boleh(p) || p.pembimbing_id === SAYA.id);

function kartu(p){
  const saya = menungguSaya(p), berkas = [...(p.pengajuan_berkas || [])].sort((a, b) => a.id - b.id);
  const riwayat = [...(p.pengajuan_riwayat || [])].sort((a, b) => String(a.waktu).localeCompare(String(b.waktu)));
  const kelas = ['pembimbing', 'admin'].includes(p.status) ? 'tunggu' : p.status;
  const bolehTolak = boleh(p);
  return `<details class="kartu ${kelas}" data-id="${p.id}"${BUKA.has(p.id) ? ' open' : ''}>
    <summary><span class="lencana">${esc(JENIS[p.jenis]?.singkat || p.jenis)}</span>
      <span class="judul">${esc(judulPengajuan(p))}</span><span class="meta">${esc(p.nama)} · ${esc(p.nim)} · ${p.jenis === 'surat' ? 'tanpa pembimbing' : esc(p.dosen?.nama || '—')}</span>
      <span class="lencana${saya ? ' saya' : ''}">${esc(labelStatus(p))}${saya ? ' · menunggu Anda' : ''}</span>
      <span class="meta">${esc(tgl(p.diperbarui))}</span></summary>
    <div class="badan">
      <div><h3>Isian</h3><dl>${ringkas(p).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>
        ${p.prestasi_id ? '<p class="ket">Sudah tercatat di Prestasi mahasiswa (Data prodi).</p>' : ''}</div>
      <div><h3>Berkas</h3><ul class="polos">${berkas.map(b => `<li><div class="isi">${esc(LABEL_BERKAS[b.jenis] || b.jenis)}
          <span class="ket"> · ${esc(b.nama)}${b.oleh !== 'mahasiswa' ? ' · dari prodi' : ''}</span></div>
          <button class="b" data-buka="${b.id}">Buka</button></li>`).join('') || '<li class="kosong">Belum ada berkas.</li>'}</ul>
        ${((p.jenis === 'kp' && (p.tahap || 'pengajuan') === 'pengajuan' && boleh(p)) || (p.jenis === 'surat' && ADMIN)) && ['admin', 'disetujui'].includes(p.status)
          ? `<div class="baris" style="margin-top:8px"><input type="file" id="sp_${p.id}" accept=".pdf,.docx,.jpg,.jpeg,.png">
          <button class="b" data-pengantar="${p.id}" data-jenis="${p.jenis === 'surat' ? 'surat_jadi' : 'surat_pengantar'}">${p.jenis === 'surat'
            ? 'Unggah surat bertanda tangan' : 'Unggah surat pengantar'}</button></div>` : ''}
        ${bolehTetapkan(p) ? htmlTetapkan(p) : ''}
        ${bolehNilai(p) ? `<div class="baris" style="margin-top:8px"><input type="file" id="nl_${p.id}" accept=".pdf,.docx,.jpg,.jpeg,.png"
          aria-label="Berkas nilai pembimbing lapangan"><button class="b" data-pengantar="${p.id}" data-jenis="nilai_lapangan" data-input="nl_${p.id}">
          Unggah nilai pembimbing lapangan</button></div>
          <p class="ket">${berkas.some(b => b.jenis === 'nilai_lapangan') ? 'Nilai pembimbing lapangan sudah ada; unggah lagi bila ada perbaikan.'
            : 'Nilai dari pembimbing lapangan (instansi) diunggah dosen pembimbing, koordinator KP, atau admin prodi.'}</p>` : ''}
        <h3>Jalur proses</h3><ul class="polos riwayat">${riwayat.map(r => `<li><b>${r.tahap === 'selesai' ? 'Laporan selesai: ' : ''}${esc(LABEL_STATUS[r.status] || r.status)}</b>
          <span class="ket"> · ${esc(r.oleh)} · ${esc(tgl(r.waktu))}</span>${r.catatan ? `<div class="cat">${esc(r.catatan)}</div>` : ''}</li>`).join('')}</ul></div>
      ${saya ? `<div class="aksi"><label class="ket" for="c_${p.id}">Catatan untuk mahasiswa (wajib bila dikembalikan${bolehTolak ? ' atau ditolak' : ''};
          terkirim lewat email dan tampil di halaman mahasiswa)</label>
        <textarea id="c_${p.id}" maxlength="2000"></textarea>
        ${p.jenis === 'ta' && p.status === 'admin' && boleh(p) ? htmlJadwal(p) : ''}
        <div class="baris">${p.jenis === 'ta' && p.status === 'admin' ? '' : `<button class="b utama" data-aksi="setujui" data-p="${p.id}">${p.status === 'pembimbing' && p.jenis !== 'lomba' ? 'Setujui, teruskan ke admin' : 'Sahkan'}</button>`}
          <button class="b" data-aksi="kembalikan" data-p="${p.id}">Kembalikan untuk diperbaiki</button>
          ${bolehTolak ? `<button class="b awas" data-aksi="tolak" data-p="${p.id}">Tolak</button>` : ''}
          <span class="msg" id="m_${p.id}" role="status"></span></div>
        ${p.status === 'pembimbing' && p.pembimbing_id !== SAYA.id ? `<p class="ket">${p.jenis === 'lomba'
          ? 'Anda mengesahkan sebagai pembina kemahasiswaan/admin; cukup satu persetujuan (pembimbing atau pembina), tercatat di jalur proses.'
          : 'Anda memutuskan sebagai admin menggantikan pembimbing; tercatat di jalur proses.'}</p>` : ''}
        ${['pembimbing', 'admin'].includes(p.status) && p.jenis === 'lomba' ? '<p class="ket">Sahkan = tercatat sebagai prestasi mahasiswa terverifikasi beserta buktinya (108: cukup satu persetujuan).</p>' : ''}
        ${p.status === 'admin' && p.jenis === 'luaran' ? `<p class="ket">${p.data?.bersama_dosen
          ? 'Ditulis bersama dosen: Sahkan TIDAK menambah tabel mahasiswa; pastikan dosennya memasukkan karya ini dengan mahasiswa sebagai penulis.'
          : `Sahkan = tercatat di Data prodi › ${p.data?.kategori === 'luaran' ? 'Luaran mahasiswa (6.e.3)' : 'Publikasi mahasiswa (6.e.1)'} beserta buktinya.`}</p>` : ''}
        ${p.status === 'admin' && p.jenis === 'surat' ? '<p class="ket">Unggah surat yang sudah ditandatangani Kaprodi dulu, lalu Sahkan; mahasiswa mengunduhnya lewat tautannya.</p>' : ''}
        ${p.status === 'admin' && p.tahap === 'selesai' ? '<p class="ket">Sahkan = KP mahasiswa ini dinyatakan selesai.</p>' : ''}
        ${p.status === 'admin' && p.jenis === 'kp' && (p.tahap || 'pengajuan') === 'pengajuan' ? `<p class="ket">Periksa dulu dosen pembimbing
          (usulan mahasiswa) dan kuotanya di atas; Sahkan = pengajuan disetujui, lalu unggah surat pengantar. Mahasiswa kemudian melaporkan
          jawaban instansi.</p>` : ''}</div>`
        : `<span class="msg" id="m_${p.id}" role="status"></span>`}
    </div></details>`;
}

// Penetapan dosen pembimbing KP (107, pemilik 2026-11-18): koordinator KP/admin memilih dengan melihat beban/kuota TS KP itu.
function htmlTetapkan(p){
  const ts = tsKP(p), rows = BEBAN.get(ts);
  if (!rows) return '';
  const kini = rows.find(r => r.dosen_id === p.pembimbing_id);
  return `<h3>Dosen pembimbing KP</h3>
    <div class="baris"><select id="pb_${p.id}" aria-label="Dosen pembimbing KP">${rows.map(r => `<option value="${r.dosen_id}"${r.dosen_id === p.pembimbing_id
      ? ' selected' : ''}>${esc(teksPilihanPembimbing(r))}</option>`).join('')}${kini ? '' : `<option value="" selected>${esc(p.dosen?.nama || '(belum ada)')}</option>`}</select>
      <button class="b" data-tetapkan="${p.id}">Tetapkan pembimbing</button></div>
    <p class="ket">Angka = beban/kuota bimbingan KP pada TS ${ts - 1}/${ts}. Kuota diatur di <a href="rekap-kp.html">Rekap KP dan magang</a>.
      Penggantian tercatat di jalur proses.</p>`;
}

async function tetapkan(id, b){
  const p = DATA.find(x => x.id === id), pilih = $('pb_' + id).value;
  if (!pilih || pilih === p.pembimbing_id) return pesan(id, '', 'Pembimbing tidak berubah.');
  const r = (BEBAN.get(tsKP(p)) || []).find(x => x.dosen_id === pilih);
  if (r?.lebih && !confirm(`Kuota ${r.nama} pada TS ini sudah penuh (${r.beban}/${r.kuota}). Tetap tetapkan?`)) return;
  b.disabled = true;
  try {
    const { error } = await sb.rpc('kp_tetapkan_pembimbing', { p_id: id, p_dosen: pilih });
    if (error) throw new Error(error.message);
    BUKA.add(id);
    await muat(); gambar(); gambarRekap();
    pesan(id, 'ok', `Dosen pembimbing ditetapkan: ${r?.nama || ''}.`);
  } catch (e) { pesan(id, 'buruk', e.message); b.disabled = false; }
}

// Jadwal seminar/sidang (94): admin menetapkan tanggal, jam, ruang/daring, penguji; Jadwalkan = setujui.
// Usulan penguji (pemilik 2026-11-17): cocok dengan judul (Cari calon pembimbing TA), tanpa pembimbing; beban TS berjalan.
function htmlUsulan(p, pbId){
  const kecuali = new Set(DOSEN.filter(x => pbId.includes(x.id)).map(x => x.nidn));
  const ts = tsDari(new Date().toISOString().slice(0, 10));
  const xs = usulPenguji(p.data?.judul, MODEL, DOSEN, { kecuali, beban: bebanUji(SEMUA_JADWAL, ts) });
  if (!xs.length) return `<p class="ket">Usulan penguji: ${MODEL ? 'tidak ada dosen yang cocok dengan judul ini; pilih manual.' : 'data keahlian belum termuat.'}</p>`;
  const JN = { topik: 'topik keahlian', bidang: 'bidang', publikasi: 'publikasi', kegiatan: 'penelitian/PkM' };
  return `<div class="usulan"><div class="ket" style="margin-top:6px">Usulan penguji (cocok dengan judul; beban menguji TS ${ts - 1}/${ts}):</div>
    <ol>${xs.map(x => `<li><b>${esc(x.nama)}</b> <span class="ket">· beban ${x.beban}${x.alasan?.length ? ' · ' + esc(x.alasan.slice(0, 2)
      .map(a => `${JN[a.jenis] || a.jenis}: ${String(a.label).slice(0, 70)}`).join('; ')) : ''}</span></li>`).join('')}</ol>
    <button class="b" type="button" data-usul="${p.id}" data-nidn="${esc(xs.slice(0, 2).map(x => x.nidn).join(','))}">Centang ${Math.min(2, xs.length)} usulan teratas</button></div>`;
}

function htmlJadwal(p){
  const pb = [p.pembimbing_id, p.data?.pembimbing_2].filter(Boolean);
  return `<div class="jadwal-form"><b>Jadwal ${esc(((TAHAP_TA.find(t => t[0] === p.data?.tahap_ta) || [, 'seminar/sidang'])[1]).toLowerCase())}</b>
    <div class="baris"><label>Tanggal <input type="date" id="jt_${p.id}"></label><label>Jam <input id="jj_${p.id}" placeholder="09.00–10.30" size="12"></label>
      <label>Ruang <input id="jr_${p.id}" size="14"></label><label>Tautan daring <input id="jd_${p.id}" type="url" placeholder="https://… (opsional)" size="24"></label></div>
    ${htmlUsulan(p, pb)}
    <div class="ket" style="margin-top:6px">Penguji (prodi):</div>
    <div class="penguji">${DOSEN.filter(x => !pb.includes(x.id)).map(x => `<label><input type="checkbox" data-uji="${p.id}" value="${esc(x.nidn)}"> ${esc(x.nama)}</label>`).join('')}</div>
    <div class="baris"><label>Penguji luar prodi <input id="jl_${p.id}" placeholder="nama, instansi (opsional)" size="30"></label>
      <button class="b utama" data-jadwalkan="${p.id}">Jadwalkan</button></div>
    <p class="ket">Jadwalkan = pengajuan disetujui; mahasiswa dikabari jadwalnya lewat email lalu menginput ke SIUP. Jadwal tampil di
      Layanan mahasiswa dan bisa diubah kemudian di Data prodi › Jadwal seminar/sidang TA.</p></div>`;
}

async function jadwalkan(id, b){
  const v = k => ($(k + id)?.value || '').trim();
  const penguji = [...document.querySelectorAll(`[data-uji="${id}"]:checked`)].map(c => c.value);
  if (!v('jt_')) return pesan(id, 'buruk', 'Isi tanggal.');
  if (!penguji.length && !v('jl_')) return pesan(id, 'buruk', 'Pilih minimal satu penguji.');
  b.disabled = true;
  try {
    const { error } = await sb.rpc('pengajuan_jadwalkan', { p_id: id, p_tanggal: v('jt_'), p_jam: v('jj_'), p_ruang: v('jr_'),
      p_tautan: v('jd_') || null, p_penguji: penguji, p_penguji_luar: v('jl_') || null });
    if (error) throw new Error(error.message);
    let kabar = '';
    try { await appsScript({ kind: 'mhs_kabari', token: await sesi(), pengajuan_id: id, catatan: $('c_' + id)?.value.trim() || '' });
          kabar = ' Mahasiswa dikabari lewat email.'; }
    catch (e) { kabar = ' Email ke mahasiswa gagal (' + e.message + '); jadwal tetap terlihat di tautannya.'; }
    BUKA.add(id);
    await muat(); gambar(); gambarRekap();
    const p = DATA.find(x => x.id === id);
    atas(`${p ? p.nama + ' — ' + judulPengajuan(p) + ': ' : ''}Terjadwal.${kabar}`);
  } catch (e) { pesan(id, 'buruk', e.message); b.disabled = false; }
}

function gambar(){
  const jenis = $('fJenis').value, cari = $('fCari').value.trim().toLowerCase();
  const proses = p => ['pembimbing', 'admin', 'dikembalikan'].includes(p.status)
    || (p.jenis === 'kp' && p.status === 'disetujui' && (p.tahap || 'pengajuan') === 'pengajuan' && p.tahap !== undefined);
  const tuntas = p => ['disetujui', 'ditolak'].includes(p.status) && !proses(p);
  const n = { tunggu: DATA.filter(menungguSaya).length, proses: DATA.filter(proses).length, selesai: DATA.filter(tuntas).length, semua: DATA.length };
  $('tab').innerHTML = [['tunggu', 'Menunggu saya'], ['proses', 'Dalam proses'], ['selesai', 'Selesai'], ['semua', 'Semua']]
    .map(([k, l]) => `<button type="button" data-tab="${k}" aria-pressed="${TAB === k}">${l}<span class="n">${n[k]}</span></button>`).join('');
  const xs = DATA.filter(p => (TAB === 'semua' || (TAB === 'tunggu' ? menungguSaya(p)
      : TAB === 'proses' ? proses(p) : tuntas(p)))
    && (!jenis || p.jenis === jenis)
    && (!cari || `${p.nama} ${p.nim} ${judulPengajuan(p)} ${p.dosen?.nama || ''}`.toLowerCase().includes(cari)));
  $('daftar').innerHTML = xs.map(kartu).join('') || '<p class="kosong">Tidak ada pengajuan untuk saringan ini.</p>';
  document.querySelectorAll('[data-tab]').forEach(b => { b.onclick = () => { TAB = b.dataset.tab; gambar(); }; });
  document.querySelectorAll('details.kartu').forEach(d => { d.ontoggle = () => { d.open ? BUKA.add(+d.dataset.id) : BUKA.delete(+d.dataset.id); }; });
  document.querySelectorAll('[data-buka]').forEach(b => { b.onclick = () => buka(b); });
  document.querySelectorAll('[data-aksi]').forEach(b => { b.onclick = () => putuskan(+b.dataset.p, b.dataset.aksi, b); });
  document.querySelectorAll('[data-jadwalkan]').forEach(b => { b.onclick = () => jadwalkan(+b.dataset.jadwalkan, b); });
  document.querySelectorAll('[data-tetapkan]').forEach(b => { b.onclick = () => tetapkan(+b.dataset.tetapkan, b); });
  document.querySelectorAll('[data-usul]').forEach(b => { b.onclick = () => {
    const pilih = new Set(b.dataset.nidn.split(','));
    document.querySelectorAll(`[data-uji="${b.dataset.usul}"]`).forEach(c => { if (pilih.has(c.value)) c.checked = true; });
  }; });
  document.querySelectorAll('[data-pengantar]').forEach(b => { b.onclick = () => pengantar(+b.dataset.pengantar, b, b.dataset.jenis, b.dataset.input || undefined); });
}

const atas = teks => { const m = $('mAtas'); if (m) m.textContent = teks; };
const pesan = (id, kelas, teks) => { const m = $('m_' + id); if (m) { m.className = 'msg ' + kelas; m.textContent = teks; } };

async function buka(b){
  b.disabled = true;
  try { bukaIsi(await appsScript({ kind: 'mhs_buka_prodi', token: await sesi(), berkas: +b.dataset.buka })); }
  catch (e) { alert(e.message); }
  finally { b.disabled = false; }
}

async function putuskan(id, aksi, b){
  const catatan = $('c_' + id).value.trim();
  if (aksi !== 'setujui' && !catatan) return pesan(id, 'buruk', 'Tulis catatan untuk mahasiswa dulu.');
  if (aksi === 'tolak' && !confirm('Tolak pengajuan ini? Mahasiswa tidak bisa mengirim ulang pengajuan yang ditolak.')) return;
  document.querySelectorAll(`[data-p="${id}"]`).forEach(x => { x.disabled = true; });
  try {
    const { data: status, error } = await sb.rpc('pengajuan_putuskan', { p_id: id, p_aksi: aksi, p_catatan: catatan || null });
    if (error) throw new Error(error.message);
    let kabar = '';
    if (KABARI.has(status)) {
      try { await appsScript({ kind: 'mhs_kabari', token: await sesi(), pengajuan_id: id, catatan }); kabar = ' Mahasiswa dikabari lewat email.'; }
      catch (e) { kabar = ' Email ke mahasiswa gagal (' + e.message + '); status tetap terlihat di tautannya.'; }
    }
    BUKA.add(id);
    await muat(); gambar(); gambarRekap();
    const p = DATA.find(x => x.id === id);
    const lbl = p ? labelStatus(p) : (LABEL_STATUS[status] || status);
    atas(`${p ? p.nama + ' — ' + judulPengajuan(p) + ': ' : ''}${lbl}.${kabar}`);   // kartu bisa pindah tab
    pesan(id, 'ok', lbl + '.' + kabar);
  } catch (e) {
    pesan(id, 'buruk', e.message);
    document.querySelectorAll(`[data-p="${id}"]`).forEach(x => { x.disabled = false; });
  }
}

async function pengantar(id, b, jenis = 'surat_pengantar', input = 'sp_' + id){
  const f = $(input).files[0];
  if (!f) return pesan(id, 'buruk', jenis === 'nilai_lapangan' ? 'Pilih berkas nilai dulu.' : 'Pilih berkas surat pengantar dulu.');
  b.disabled = true; pesan(id, '', 'Mengunggah…');
  try {
    await appsScript({ kind: 'mhs_unggah_prodi', token: await sesi(), pengajuan_id: id, jenis_berkas: jenis,
                       filename: f.name, data: await keB64(f) });
    BUKA.add(id);
    await muat(); gambar();
    pesan(id, 'ok', (jenis === 'nilai_lapangan' ? 'Nilai pembimbing lapangan terunggah.'
      : jenis === 'surat_jadi' ? 'Surat terunggah; tekan Sahkan supaya mahasiswa dikabari.'
      : 'Surat pengantar terunggah; mahasiswa bisa membukanya di tautannya.'));
  } catch (e) { pesan(id, 'buruk', e.message); b.disabled = false; }
}

// Rekap KP/lomba per periode (pemilik 2026-11-17): TS, 3 TS, atau tahun kalender, sama dengan Rekap SDGs.
// Waktu: tanggal mulai KP (laporan selesai), rencana mulai, atau tanggal lomba (waktuPengajuan). Draf tidak dihitung.
let PERIODE = '';
const dgWaktu = p => ({ ...p, ...waktuPengajuan(p) });
const tsTeks = p => { const t = tsKarya(waktuPengajuan(p)); return t ? taTeks(t) : ''; };
function gambarRekap(){
  const xs = DATA.map(dgWaktu).filter(p => p.status !== 'draf' && cocokPeriode(p, PERIODE));
  const r = rekapPengajuan(xs), opsi = opsiPeriode(DATA.map(dgWaktu)).filter(g => g.opsi.length);
  $('rekapIsi').innerHTML = `
    <div class="saring" style="margin-top:8px"><label>Periode <select id="rPeriode"><option value="">Semua</option>${opsi.map(g =>
      `<optgroup label="${esc(g.grup)}">${g.opsi.map(([v, l]) => `<option value="${v}"${v === PERIODE ? ' selected' : ''}>${esc(l)}</option>`).join('')}</optgroup>`).join('')}</select></label>
      ${UNDUH ? `<button type="button" class="b utama" id="rUnduh"${xs.length ? '' : ' disabled'}>Unduh Excel (${xs.length} pengajuan + berkas)</button>` : ''}
      <span class="msg" id="rMsg" role="status"></span></div>
    <div class="ringkas-angka">
      <div><b>${r.kp.selesai}</b><span>KP selesai</span></div><div><b>${r.kp.berjalan}</b><span>KP dilaksanakan</span></div>
      <div><b>${r.kp.proses}</b><span>pengajuan KP diperiksa</span></div><div><b>${r.instansi.length}</b><span>instansi tempat KP</span></div>
      <div><b>${r.lomba.disetujui}</b><span>laporan lomba disahkan</span></div>
      <div><b>${r.lomba.tingkat.internasional || 0} / ${r.lomba.tingkat.nasional || 0} / ${r.lomba.tingkat.wilayah_lokal || 0}</b><span>lomba internasional / nasional / lokal</span></div>
    </div>
    ${r.instansi.length ? `<table class="t-rekap"><thead><tr><th>Instansi tempat KP</th><th>Mahasiswa</th><th>Selesai</th><th>Berjalan</th></tr></thead>
      <tbody>${r.instansi.map(x => `<tr><td>${esc(x.instansi)}</td><td>${x.mahasiswa}</td><td>${x.selesai}</td><td>${x.berjalan}</td></tr>`).join('')}</tbody></table>`
      : '<p class="kosong">Belum ada KP pada periode ini.</p>'}
    <p class="ket">Periode KP mengikuti tanggal mulai KP (atau rencana mulai bila laporan selesai belum masuk); lomba mengikuti tanggal lomba.
      TS = 1 September s.d. 31 Agustus. Draf tidak dihitung.${UNDUH ? ' Unduhan memuat NIM: simpan di tempat yang aman.' : ''}</p>`;
  $('rPeriode').onchange = e => { PERIODE = e.target.value; gambarRekap(); };
  if (UNDUH) $('rUnduh').onclick = () => unduhRekap(xs);
}
async function unduhRekap(xs){
  const b = $('rUnduh'); b.disabled = true;
  try {
    const X = await import(SHEETJS), wb = X.utils.book_new(), L = lembarPengajuan(xs, tsTeks);
    for (const [nama, baris] of Object.entries(L)) {
      const ws = X.utils.aoa_to_sheet(baris.map(r => r.map(c => c && typeof c === 'object' ? c.t : c)));
      baris.forEach((r, i) => r.forEach((c, j) => { if (c && typeof c === 'object' && c.l) ws[X.utils.encode_cell({ r: i, c: j })].l = { Target: c.l }; }));
      ws['!cols'] = baris[0].map((_, j) => ({ wch: Math.min(60, Math.max(8, ...baris.slice(0, 200).map(r => String(r[j]?.t ?? r[j] ?? '').length))) }));
      X.utils.book_append_sheet(wb, ws, nama);
    }
    const ket = X.utils.aoa_to_sheet([['Rekap pengajuan mahasiswa'], ['Periode', labelPeriode(PERIODE)], ['Diunduh', new Date().toLocaleString('id-ID')],
      ['Catatan', 'Memuat NIM; untuk keperluan internal prodi dan akreditasi. Draf tidak ikut. Tautan berkas hanya terbuka bagi akun prodi.']]);
    ket['!cols'] = [{ wch: 12 }, { wch: 90 }];
    X.utils.book_append_sheet(wb, ket, 'Keterangan');
    const [j, n] = (PERIODE || '').split(':');
    X.writeFile(wb, `rekap-pengajuan-mahasiswa-${!PERIODE ? 'semua' : j === 'th' ? n : j === 'ts' ? `TS${n - 1}-${n}` : `TS${n - 3}-${n}`}.xlsx`);
  } catch (e) { $('rMsg').className = 'msg buruk'; $('rMsg').textContent = 'Unduh gagal: ' + (e.message || e); }
  finally { b.disabled = !xs.length; }
}

async function mulai(){
  SAYA = await gerbang(sb);
  if (!SAYA) return;
  ADMIN = SAYA.peran === 'admin';
  UNDUH = ADMIN || punya(SAYA, 'koordinator_kp') || punya(SAYA, 'pembina_kemahasiswaan');
  const jab = (SAYA.koordinator || []).filter(j => ['koordinator_ta', 'koordinator_kp', 'pembina_kemahasiswaan'].includes(j));
  $('hSub').textContent = `Masuk sebagai ${SAYA.nama}`;
  await muat();
  $('isi').innerHTML = `
    <p class="ket">Pengajuan Kerja Praktik, seminar/sidang TA, laporan lomba, dan permohonan surat yang dikirim mahasiswa lewat <a href="pengajuan.html">halaman pengajuan</a>
      (tanpa login; tautan pribadi ke email kampus). Urutan pemeriksaan: dosen pembimbing, lalu admin prodi; <b>pengajuan KP</b> langsung ke
      koordinator KP/admin, yang menetapkan dosen pembimbing sesuai kuota (pelaporan selesai KP tetap: dosen pembimbing, lalu koordinator KP/admin);
      permohonan surat langsung ke admin (ditandatangani Kaprodi).
      ${ADMIN ? 'Admin melihat semua pengajuan dan boleh memutuskan tahap pembimbing bila pembimbing berhalangan.'
        : jab.length ? `Anda ${jab.map(labelJabatan).join(', ')}: memegang tahap admin pengajuan bidang Anda dan boleh menggantikan pembimbing yang berhalangan.` : 'Anda melihat pengajuan yang memilih Anda sebagai pembimbing.'}
      ${ADMIN ? 'Draf yang belum dikirim mahasiswa tampil di "Semua".' : 'Draf yang belum dikirim mahasiswa tidak tampil.'}</p>
    <details class="kotak-rekap" id="rekap"><summary>Rekap dan unduhan per periode</summary><div id="rekapIsi"></div></details>
    <div class="tab" id="tab" role="group" aria-label="Kelompok"></div>
    <div class="saring">
      <label>Jenis <select id="fJenis"><option value="">Semua</option><option value="kp">KP</option><option value="lomba">Lomba</option><option value="ta">Seminar/sidang TA</option><option value="luaran">Publikasi/luaran</option><option value="surat">Surat</option></select></label>
      <input id="fCari" type="search" placeholder="Cari nama, NIM, instansi, lomba" aria-label="Cari">
    </div>
    <p class="msg ok" id="mAtas" role="status"></p>
    <div id="daftar"></div>`;
  gambarRekap();
  $('fJenis').onchange = gambar;
  $('fCari').oninput = gambar;
  if (!DATA.some(menungguSaya)) TAB = 'proses';
  gambar();
}
mulai().catch(e => { $('isi').innerHTML = `<p class="kosong">Gagal memuat: ${esc(e.message)}</p>`; });
</script>
