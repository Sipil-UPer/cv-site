<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Pengajuan mahasiswa — Kinerja Program Studi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tema.css?v=2026-11-17-767e44">
<link rel="stylesheet" href="kepala.css?v=2026-11-17-767e44">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
  .wrap{max-width:1120px;margin:0 auto;padding:18px 20px 80px}
  .kosong, .ket{color:var(--muted)} .ket{font-size:13px}
  .tab{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
  .tab button{font:inherit;font-size:14px;padding:6px 12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
  .tab button[aria-pressed="true"]{border-color:var(--biru);box-shadow:0 0 0 1px var(--biru);font-weight:600}
  .tab .n{font-family:var(--mono);font-size:12px;color:var(--muted);margin-left:4px}
  .saring{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin:0 0 12px;font-size:13.5px}
  .saring select, .saring input{font:inherit;font-size:14px;padding:5px 7px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
  .saring input{min-width:220px}
  .kartu{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--line);margin:0 0 10px}
  .kartu.tunggu{border-left-color:var(--biru)} .kartu.dikembalikan{border-left-color:var(--emas)}
  .kartu.disetujui{border-left-color:var(--hijau)} .kartu.ditolak{border-left-color:var(--merah)}
  .kartu summary{cursor:pointer;padding:10px 14px;list-style:none;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
  .kartu summary::-webkit-details-marker{display:none}
  .kartu .judul{font-weight:600}
  .kartu .meta{font-size:13px;color:var(--muted)}
  .lencana{font-family:var(--mono);font-size:11px;text-transform:uppercase;padding:1px 6px;border:1px solid var(--line);color:var(--muted)}
  .lencana.saya{border-color:var(--biru);color:var(--biru)}
  .badan{padding:0 14px 14px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:760px){.badan{grid-template-columns:1fr}}
  .badan h3{font-size:13px;color:var(--muted);font-weight:500;margin:6px 0 4px;text-transform:uppercase;letter-spacing:.04em}
  dl{display:grid;grid-template-columns:max-content 1fr;gap:2px 12px;margin:0;font-size:14px}
  dt{color:var(--muted)} dd{margin:0;overflow-wrap:anywhere;white-space:pre-line}
  ul.polos{list-style:none;margin:0;padding:0;font-size:14px}
  ul.polos li{display:flex;gap:8px;align-items:center;padding:3px 0;border-bottom:1px solid var(--line-soft)}
  ul.polos li .isi{flex:1;min-width:0;overflow-wrap:anywhere}
  .riwayat li{display:block}
  .riwayat .cat{white-space:pre-line;color:var(--ink)}
  button.b{font:inherit;font-size:13.5px;padding:5px 11px;border:1px solid var(--biru);background:var(--panel);color:var(--biru);cursor:pointer}
  button.utama{background:var(--biru);color:#fff} button.awas{border-color:var(--merah);color:var(--merah)}
  button.b:disabled{opacity:.55;cursor:default}
  .aksi{grid-column:1/-1;border-top:1px solid var(--line-soft);padding-top:10px}
  .aksi textarea{width:100%;font:inherit;font-size:14px;min-height:60px;padding:7px 9px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
  .baris{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px}
  .msg{font-size:13.5px} .msg.buruk{color:var(--merah)} .msg.ok{color:var(--hijau)}
</style>
</head>
<body>
<header class="hero"><div class="hero-in">
  <div class="hero-inst" data-identitas></div>
  <h1>Pengajuan mahasiswa</h1>
  <div class="sub" id="hSub">Memuat…</div>
</div></header>
<main class="wrap" id="isi"><p class="kosong">Memuat…</p></main>
<script src="config.js?v=2026-11-17-767e44"></script>
<script>
// Galat saat memuat skrip ditampilkan sebagai pesan, bukan halaman kosong.
addEventListener('error', function (e) {
  if (document.getElementById('galat-muat')) return;
  var d = document.createElement('div');
  d.id = 'galat-muat';
  d.style.cssText = 'margin:16px;padding:12px 14px;border:1px solid var(--merah);' +
    'background:var(--merah-m3);color:var(--ink);font:14px/1.5 system-ui,sans-serif';
  d.textContent = 'Halaman gagal dimuat: ' + (e.message || 'galat skrip') +
    '. Tekan Ctrl+Shift+R untuk memuat ulang tanpa cache; bila tetap muncul, kirim pesan ini ke admin.';
  document.body.insertBefore(d, document.body.firstChild);
});
</script>
<script type="module">
// Pengajuan KP dan laporan lomba dari mahasiswa (90-patch-pengajuan-mahasiswa.sql, pemilik 2026-11-17).
// Bertingkat: dosen pembimbing lalu admin. Pembimbing hanya melihat pengajuan bimbingannya (RLS); admin semua.
// Berkas privat dibuka lewat Apps Script (mhs_buka_prodi); surat pengantar KP diunggah admin (mhs_unggah_prodi);
// mahasiswa dikabari email saat dikembalikan, ditolak, atau disetujui (mhs_kabari).
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/+esm';
import { gerbang } from './menu.js?v=2026-11-17-767e44';
import { JENIS, LABEL_BERKAS, LABEL_STATUS, TINGKAT, BIDANG, teksAnggota, judulPengajuan, keB64, bukaIsi, appsScript } from './pengajuan-mhs.js?v=2026-11-17-767e44';

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = id => document.getElementById(id);
const sb = createClient(window.SB_URL, window.SB_KEY);
const tgl = s => s ? new Date(s).toLocaleString('id-ID', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
const KABARI = new Set(['dikembalikan', 'ditolak', 'disetujui']);   // status yang dikabarkan ke email mahasiswa
let SAYA = null, ADMIN = false, DATA = [], TAB = 'tunggu', BUKA = new Set();

const menungguSaya = p => (p.status === 'pembimbing' && (p.pembimbing_id === SAYA.id || ADMIN)) || (p.status === 'admin' && ADMIN);
const sesi = async () => (await sb.auth.getSession()).data.session?.access_token;

async function muat(){
  const { data, error } = await sb.from('pengajuan_mahasiswa')
    .select('id,jenis,nim,nama,email,status,data,pembimbing_id,prestasi_id,dibuat,diperbarui,dosen(nama),'
      + 'pengajuan_berkas(id,jenis,nama,oleh,dibuat),pengajuan_riwayat(status,oleh,catatan,waktu)')
    .order('diperbarui', { ascending: false }).limit(1000);
  if (error) throw new Error(/pengajuan_mahasiswa/.test(error.message) ? 'Tabel belum ada: jalankan supabase/90-patch-pengajuan-mahasiswa.sql.' : error.message);
  DATA = data || [];
}

function ringkas(p){
  const d = p.data || {};
  const xs = p.jenis === 'kp'
    ? [['Instansi', d.instansi], ['Alamat', d.alamat_instansi], ['Bidang/divisi', d.bidang_kerja], ['Kontak', d.kontak_instansi],
       ['Rencana', [d.rencana_mulai, d.rencana_selesai].filter(Boolean).join(' s.d. ')]]
    : [['Kegiatan', d.nama_kegiatan], ['Penyelenggara', d.penyelenggara], ['Tanggal', d.tanggal],
       ['Tingkat', (TINGKAT.find(t => t[0] === d.tingkat) || [, ''])[1]], ['Bidang', (BIDANG.find(t => t[0] === d.bidang) || [, ''])[1]],
       ['Capaian', d.capaian], ['Anggota lain', teksAnggota(d.anggota)], ['Nama di situs', d.tampil_nama ? 'disetujui mahasiswa' : 'tidak'],
       ['Cerita', d.cerita]];
  return [['Mahasiswa', `${p.nama} (${p.nim})`], ['Email', p.email], ['Pembimbing', p.dosen?.nama || '—'], ...xs].filter(([, v]) => v);
}

function kartu(p){
  const saya = menungguSaya(p), berkas = [...(p.pengajuan_berkas || [])].sort((a, b) => a.id - b.id);
  const riwayat = [...(p.pengajuan_riwayat || [])].sort((a, b) => String(a.waktu).localeCompare(String(b.waktu)));
  const kelas = ['pembimbing', 'admin'].includes(p.status) ? 'tunggu' : p.status;
  const bolehTolak = ADMIN;
  return `<details class="kartu ${kelas}" data-id="${p.id}"${BUKA.has(p.id) ? ' open' : ''}>
    <summary><span class="lencana">${esc(JENIS[p.jenis]?.singkat || p.jenis)}</span>
      <span class="judul">${esc(judulPengajuan(p))}</span><span class="meta">${esc(p.nama)} · ${esc(p.nim)} · ${esc(p.dosen?.nama || '—')}</span>
      <span class="lencana${saya ? ' saya' : ''}">${esc(LABEL_STATUS[p.status] || p.status)}${saya ? ' · menunggu Anda' : ''}</span>
      <span class="meta">${esc(tgl(p.diperbarui))}</span></summary>
    <div class="badan">
      <div><h3>Isian</h3><dl>${ringkas(p).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>
        ${p.prestasi_id ? '<p class="ket">Sudah tercatat di Prestasi mahasiswa (Data prodi).</p>' : ''}</div>
      <div><h3>Berkas</h3><ul class="polos">${berkas.map(b => `<li><div class="isi">${esc(LABEL_BERKAS[b.jenis] || b.jenis)}
          <span class="ket"> · ${esc(b.nama)}${b.oleh !== 'mahasiswa' ? ' · dari prodi' : ''}</span></div>
          <button class="b" data-buka="${b.id}">Buka</button></li>`).join('') || '<li class="kosong">Belum ada berkas.</li>'}</ul>
        ${ADMIN && p.jenis === 'kp' && ['admin', 'disetujui'].includes(p.status) ? `<div class="baris" style="margin-top:8px">
          <input type="file" id="sp_${p.id}" accept=".pdf,.docx,.jpg,.jpeg,.png">
          <button class="b" data-pengantar="${p.id}">Unggah surat pengantar</button></div>` : ''}
        <h3>Jalur proses</h3><ul class="polos riwayat">${riwayat.map(r => `<li><b>${esc(LABEL_STATUS[r.status] || r.status)}</b>
          <span class="ket"> · ${esc(r.oleh)} · ${esc(tgl(r.waktu))}</span>${r.catatan ? `<div class="cat">${esc(r.catatan)}</div>` : ''}</li>`).join('')}</ul></div>
      ${saya ? `<div class="aksi"><label class="ket" for="c_${p.id}">Catatan untuk mahasiswa (wajib bila dikembalikan${bolehTolak ? ' atau ditolak' : ''};
          terkirim lewat email dan tampil di halaman mahasiswa)</label>
        <textarea id="c_${p.id}" maxlength="2000"></textarea>
        <div class="baris"><button class="b utama" data-aksi="setujui" data-p="${p.id}">${p.status === 'pembimbing' ? 'Setujui, teruskan ke admin' : 'Sahkan'}</button>
          <button class="b" data-aksi="kembalikan" data-p="${p.id}">Kembalikan untuk diperbaiki</button>
          ${bolehTolak ? `<button class="b awas" data-aksi="tolak" data-p="${p.id}">Tolak</button>` : ''}
          <span class="msg" id="m_${p.id}" role="status"></span></div>
        ${p.status === 'pembimbing' && p.pembimbing_id !== SAYA.id ? '<p class="ket">Anda memutuskan sebagai admin menggantikan pembimbing; tercatat di jalur proses.</p>' : ''}
        ${p.status === 'admin' && p.jenis === 'lomba' ? '<p class="ket">Sahkan = tercatat sebagai prestasi mahasiswa terverifikasi beserta buktinya.</p>' : ''}</div>`
        : `<span class="msg" id="m_${p.id}" role="status"></span>`}
    </div></details>`;
}

function gambar(){
  const jenis = $('fJenis').value, cari = $('fCari').value.trim().toLowerCase();
  const n = { tunggu: DATA.filter(menungguSaya).length, proses: DATA.filter(p => ['pembimbing', 'admin', 'dikembalikan'].includes(p.status)).length,
              selesai: DATA.filter(p => ['disetujui', 'ditolak'].includes(p.status)).length, semua: DATA.length };
  $('tab').innerHTML = [['tunggu', 'Menunggu saya'], ['proses', 'Dalam proses'], ['selesai', 'Selesai'], ['semua', 'Semua']]
    .map(([k, l]) => `<button type="button" data-tab="${k}" aria-pressed="${TAB === k}">${l}<span class="n">${n[k]}</span></button>`).join('');
  const xs = DATA.filter(p => (TAB === 'semua' || (TAB === 'tunggu' ? menungguSaya(p)
      : TAB === 'proses' ? ['pembimbing', 'admin', 'dikembalikan'].includes(p.status) : ['disetujui', 'ditolak'].includes(p.status)))
    && (!jenis || p.jenis === jenis)
    && (!cari || `${p.nama} ${p.nim} ${judulPengajuan(p)} ${p.dosen?.nama || ''}`.toLowerCase().includes(cari)));
  $('daftar').innerHTML = xs.map(kartu).join('') || '<p class="kosong">Tidak ada pengajuan untuk saringan ini.</p>';
  document.querySelectorAll('[data-tab]').forEach(b => { b.onclick = () => { TAB = b.dataset.tab; gambar(); }; });
  document.querySelectorAll('details.kartu').forEach(d => { d.ontoggle = () => { d.open ? BUKA.add(+d.dataset.id) : BUKA.delete(+d.dataset.id); }; });
  document.querySelectorAll('[data-buka]').forEach(b => { b.onclick = () => buka(b); });
  document.querySelectorAll('[data-aksi]').forEach(b => { b.onclick = () => putuskan(+b.dataset.p, b.dataset.aksi, b); });
  document.querySelectorAll('[data-pengantar]').forEach(b => { b.onclick = () => pengantar(+b.dataset.pengantar, b); });
}

const atas = teks => { const m = $('mAtas'); if (m) m.textContent = teks; };
const pesan = (id, kelas, teks) => { const m = $('m_' + id); if (m) { m.className = 'msg ' + kelas; m.textContent = teks; } };

async function buka(b){
  b.disabled = true;
  try { bukaIsi(await appsScript({ kind: 'mhs_buka_prodi', token: await sesi(), berkas: +b.dataset.buka })); }
  catch (e) { alert(e.message); }
  finally { b.disabled = false; }
}

async function putuskan(id, aksi, b){
  const catatan = $('c_' + id).value.trim();
  if (aksi !== 'setujui' && !catatan) return pesan(id, 'buruk', 'Tulis catatan untuk mahasiswa dulu.');
  if (aksi === 'tolak' && !confirm('Tolak pengajuan ini? Mahasiswa tidak bisa mengirim ulang pengajuan yang ditolak.')) return;
  document.querySelectorAll(`[data-p="${id}"]`).forEach(x => { x.disabled = true; });
  try {
    const { data: status, error } = await sb.rpc('pengajuan_putuskan', { p_id: id, p_aksi: aksi, p_catatan: catatan || null });
    if (error) throw new Error(error.message);
    let kabar = '';
    if (KABARI.has(status)) {
      try { await appsScript({ kind: 'mhs_kabari', token: await sesi(), pengajuan_id: id, catatan }); kabar = ' Mahasiswa dikabari lewat email.'; }
      catch (e) { kabar = ' Email ke mahasiswa gagal (' + e.message + '); status tetap terlihat di tautannya.'; }
    }
    BUKA.add(id);
    await muat(); gambar();
    const p = DATA.find(x => x.id === id);
    atas(`${p ? p.nama + ' — ' + judulPengajuan(p) + ': ' : ''}${LABEL_STATUS[status] || status}.${kabar}`);   // kartu bisa pindah tab
    pesan(id, 'ok', (LABEL_STATUS[status] || status) + '.' + kabar);
  } catch (e) {
    pesan(id, 'buruk', e.message);
    document.querySelectorAll(`[data-p="${id}"]`).forEach(x => { x.disabled = false; });
  }
}

async function pengantar(id, b){
  const f = $('sp_' + id).files[0];
  if (!f) return pesan(id, 'buruk', 'Pilih berkas surat pengantar dulu.');
  b.disabled = true; pesan(id, '', 'Mengunggah…');
  try {
    await appsScript({ kind: 'mhs_unggah_prodi', token: await sesi(), pengajuan_id: id, jenis_berkas: 'surat_pengantar',
                       filename: f.name, data: await keB64(f) });
    BUKA.add(id);
    await muat(); gambar();
    pesan(id, 'ok', 'Surat pengantar terunggah; mahasiswa bisa membukanya di tautannya.');
  } catch (e) { pesan(id, 'buruk', e.message); b.disabled = false; }
}

async function mulai(){
  SAYA = await gerbang(sb);
  if (!SAYA) return;
  ADMIN = SAYA.peran === 'admin';
  $('hSub').textContent = `Masuk sebagai ${SAYA.nama}`;
  await muat();
  $('isi').innerHTML = `
    <p class="ket">Pengajuan Kerja Praktik dan laporan lomba yang dikirim mahasiswa lewat <a href="pengajuan.html">halaman pengajuan</a>
      (tanpa login; tautan pribadi ke email kampus). Urutan pemeriksaan: dosen pembimbing, lalu admin prodi.
      ${ADMIN ? 'Admin melihat semua pengajuan dan boleh memutuskan tahap pembimbing bila pembimbing berhalangan.' : 'Anda melihat pengajuan yang memilih Anda sebagai pembimbing.'}
      ${ADMIN ? 'Draf yang belum dikirim mahasiswa tampil di "Semua".' : 'Draf yang belum dikirim mahasiswa tidak tampil.'}</p>
    <div class="tab" id="tab" role="group" aria-label="Kelompok"></div>
    <div class="saring">
      <label>Jenis <select id="fJenis"><option value="">Semua</option><option value="kp">KP</option><option value="lomba">Lomba</option></select></label>
      <input id="fCari" type="search" placeholder="Cari nama, NIM, instansi, lomba" aria-label="Cari">
    </div>
    <p class="msg ok" id="mAtas" role="status"></p>
    <div id="daftar"></div>`;
  $('fJenis').onchange = gambar;
  $('fCari').oninput = gambar;
  if (!DATA.some(menungguSaya)) TAB = 'proses';
  gambar();
}
mulai().catch(e => { $('isi').innerHTML = `<p class="kosong">Gagal memuat: ${esc(e.message)}</p>`; });
</script>
</body>
</html>
