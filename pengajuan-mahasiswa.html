<style>
  *{box-sizing:border-box}

  /* Foto kabar kegiatan mahasiswa (144): pratinjau dari folder foto bertautan. */

  .foto-kabar img{width:120px;height:90px;object-fit:cover;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
  .riwayat li{display:block}

  button.b{font:inherit;font-size:13.5px;padding:5px 11px;border:1px solid var(--biru);background:var(--panel);color:var(--biru);cursor:pointer}
  button.utama{background:var(--biru);color:#fff} button.awas{border-color:var(--merah);color:var(--merah)}
  button.b:disabled{opacity:.55;cursor:default}
  .aksi{grid-column:1/-1;border-top:1px solid var(--line-soft);padding-top:10px}

  d.style.cssText = 'margin:16px;padding:12px 14px;border:1px solid var(--merah);' +
    'background:var(--merah-m3);color:var(--ink);font:14px/1.5 system-ui,sans-serif';
  d.textContent = 'Halaman gagal dimuat: ' + (e.message || 'galat skrip') +

<script type="module">
// Pengajuan KP dan laporan lomba dari mahasiswa (90-patch-pengajuan-mahasiswa.sql, pemilik 2026-11-17).
// Bertingkat: dosen pembimbing lalu admin. Pembimbing hanya melihat pengajuan bimbingannya (RLS); admin semua.
// Berkas privat dibuka lewat Apps Script (mhs_buka_prodi); surat pengantar KP diunggah admin (mhs_unggah_prodi);
// mahasiswa dikabari email saat dikembalikan, ditolak, atau disetujui (mhs_kabari).
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/+esm';
import { gerbang } from './menu.js?v=2026-11-26-f0c804';
import { bolehPengajuan, punya, labelJabatan } from './koordinator.js?v=2026-11-26-f0c804';
import { JENIS, LABEL_BERKAS, LABEL_STATUS, TINGKAT, BIDANG, teksAnggota, judulPengajuan, keB64, bukaIsi, appsScript, labelStatus, JENIS_SURAT, TAHAP_TA, JENIS_PUB, TINGKAT_PUB, INDEKSASI, JENIS_LUARAN, waktuPengajuan, rekapPengajuan, lembarPengajuan, labelProgram, penetapanTA, pilihanPembimbingTA, kkCocok,
         BERKAS_YUDISIUM_BAWAAN, kelengkapanYudisium, labelBerkas, JENIS_KEGIATAN, bolehBatalProdi, BERKAS_TA_BAWAAN, berkasTahapTA, TAHAP_TA_BERKAS,
         semesterTA, kunciSemester, teksSemester, BATAS_KEMIRIPAN, persenKemiripan, perluCekKemiripan, teksKemiripan } from './pengajuan-mhs.js?v=2026-11-26-f0c804';
import { opsiPeriode, cocokPeriode, labelPeriode, taTeks, tsKarya } from './sdgs-unduh.js?v=2026-11-26-f0c804';
import { SHEETJS } from './nilai-cpl.js?v=2026-11-26-f0c804';
import { barisKuota, teksPilihanPembimbing } from './rekap-kp.js?v=2026-11-26-f0c804';
import { siapkan } from './pembimbing.js?v=2026-11-26-f0c804';
import { usulPenguji, bebanUji, tsDari } from './usulan-penguji.js?v=2026-11-26-f0c804';
import { usulanWaktu } from './cari-waktu.js?v=2026-11-26-f0c804';
import { bacaJam, formatJam, sibukSidang, gabungSibuk, periksaWaktu } from './jadwal-sidang.js?v=2026-11-26-f0c804';

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = id => document.getElementById(id);
const sb = createClient(window.SB_URL, window.SB_KEY);
const tgl = s => s ? new Date(s).toLocaleString('id-ID', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
const KABARI = new Set(['dikembalikan', 'ditolak', 'disetujui']);   // status yang dikabarkan ke email mahasiswa
let SAYA = null, ADMIN = false, UNDUH = false, DATA = [], TAB = 'tunggu', BUKA = new Set();
let YUD = BERKAS_YUDISIUM_BAWAAN;
let BERKAS_TA = BERKAS_TA_BAWAAN;
let BATAS = BATAS_KEMIRIPAN;   // 185: batas persen kemiripan sidang akhir (ta_kemiripan_batas)   // 174: berkas seminar/sidang TA per tahap (bukan TAB: itu tab penyaring)
// Seminar/sidang TA (94): daftar dosen (NIDN, nama) untuk penguji; jadwal per pengajuan.
let DOSEN = [], JADWAL = new Map(), SEMUA_JADWAL = [], MODEL = null;   // MODEL: mesin Cari pembimbing (usulan penguji)
// Pembimbing KP ditetapkan koordinator KP/admin (107): beban dan kuota per TS (kp_beban), Map ts -> baris.
let BEBAN = new Map();
const tsKP = p => tsDari(String(p.data_selesai?.tanggal_mulai || p.data?.tanggal_mulai || p.data?.rencana_mulai || p.dibuat || ''));
const bolehTetapkan = p => p.jenis === 'kp' && boleh(p) && !['draf', 'ditolak'].includes(p.status)
  && !(p.tahap === 'selesai' && p.status === 'disetujui');
// Pembimbing TA ditetapkan koordinator TA/admin (110): KK topik TA, pasangan KK berdekatan, beban/kuota TA per semester (180).
let BEBAN_TA = new Map(), DEKAT = [], KK = [];
const smtTA = p => semesterTA(String(p.dibuat || ''));
const bolehTetapkanTA = p => penetapanTA(p) && boleh(p) && ['pembimbing', 'admin'].includes(p.status);
// 180: ganti pembimbing (bimbingan dibatalkan) pada penetapan yang sudah disahkan; pilihan memakai beban semester berjalan.
const bolehGantiTA = p => penetapanTA(p) && boleh(p) && p.status === 'disetujui';
const namaKK = k => KK.find(x => x.kode === k)?.nama || k || '';

// Koordinator bidangnya menggantikan admin (97); surat tetap admin.
const boleh = p => bolehPengajuan(SAYA, p.jenis);
const menungguSaya = p => (p.status === 'pembimbing' && (p.pembimbing_id === SAYA.id || boleh(p))) || (p.status === 'admin' && boleh(p));
const sesi = async () => (await sb.auth.getSession()).data.session?.access_token;

// Batalkan atas permintaan mahasiswa (161, pemilik 2026-11-24): admin/koordinator bidangnya; alasan wajib, dicatat di riwayat.
async function batalProdi(id, tombol){
  const p = DATA.find(x => x.id === id);
  const alasan = (prompt(`Batalkan pengajuan ${p?.nama || ''} (${p?.nim || ''})?\nTulis alasan (wajib), mis. "permintaan mahasiswa: salah jalur KP".`) || '').trim();
  if (!alasan) return;
  tombol.disabled = true;
  const { error } = await sb.rpc('pengajuan_batalkan', { p_id: id, p_alasan: alasan });
  if (error) { tombol.disabled = false; return alert(/pengajuan_batalkan/.test(error.message) ? 'Patch 161 belum dijalankan.' : error.message); }
  await muat(); gambar(); gambarRekap();
}

async function muat(){
  // tahap/data_selesai: 91-patch-laporan-selesai-kp.sql; sebelum patch itu dibaca tanpa kolom tersebut.
  const baca = (kp, kr) => sb.from('pengajuan_mahasiswa')
    .select('id,jenis,nim,nama,email,status,data,pembimbing_id,prestasi_id,dibuat,diperbarui,dosen(nama),' + kp
      // (*): kolom tautan (122) ikut bila patch sudah dijalankan, tanpa memutus halaman bila belum.
      + 'pengajuan_berkas(*),pengajuan_riwayat(status,oleh,catatan,waktu' + kr + ')')
    .order('diperbarui', { ascending: false }).limit(1000);
  let { data, error } = await baca('tahap,data_selesai,', ',tahap');
  if (error && /tahap|data_selesai/.test(error.message)) ({ data, error } = await baca('', ''));
  if (error) throw new Error(/pengajuan_mahasiswa/.test(error.message) ? 'Tabel belum ada: jalankan supabase/90-patch-pengajuan-mahasiswa.sql.' : error.message);
  DATA = data || [];
  // Daftar berkas yudisium (122); sebelum patch 122: daftar bawaan.
  const yd = await sb.rpc('yudisium_berkas_daftar');
  YUD = !yd.error && Array.isArray(yd.data) && yd.data.length ? yd.data : BERKAS_YUDISIUM_BAWAAN;
  const tb = await sb.rpc('ta_berkas_daftar');
  BERKAS_TA = !tb.error && Array.isArray(tb.data) && tb.data.length ? tb.data : BERKAS_TA_BAWAAN;
  const bk = await sb.rpc('ta_kemiripan_batas');
  if (!bk.error && bk.data != null) BATAS = Number(bk.data);
  const [dq, jq] = await Promise.all([sb.from('dosen').select('id,nidn,nama,aktif,peran,dtps').order('nama'),
    sb.from('jadwal_ta').select('pengajuan_id,tahap,tanggal,jam,ruang,tautan_daring,status,pembimbing,penguji,penguji_luar')]);
  // Calon penguji = aturan daftar dosen Data prodi: DTPS atau berperan dosen/pimpinan; staf admin non-dosen tidak.
  DOSEN = (dq.data || []).filter(d => d.aktif && d.nidn && (d.dtps || ['dosen', 'pimpinan'].includes(d.peran)));
  SEMUA_JADWAL = jq.error ? [] : jq.data || [];
  JADWAL = new Map(SEMUA_JADWAL.filter(j => j.pengajuan_id).map(j => [j.pengajuan_id, j]));
  // Beban/kuota hanya untuk TS pengajuan KP yang pembimbingnya bisa ditetapkan; sebelum patch 107: kosong.
  BEBAN = new Map();
  for (const ts of new Set(DATA.filter(bolehTetapkan).map(tsKP).filter(Boolean))) {
    const { data: b, error: eb } = await sb.rpc('kp_beban', { p_ts: ts });
    if (!eb) BEBAN.set(ts, barisKuota(b));
  }
  BEBAN_TA = new Map();
  const smtTa = new Map(DATA.filter(bolehTetapkanTA).map(smtTA).filter(Boolean).map(s => [kunciSemester(s), s]));
  if (DATA.some(bolehGantiTA)) { const s = semesterTA(new Date().toISOString()); smtTa.set(kunciSemester(s), s); }
  if (smtTa.size) {
    const dk = await sb.from('ta_kk_dekat').select('kk_a,kk_b');
    DEKAT = dk.error ? [] : dk.data || [];
    for (const [k, s] of smtTa) { const { data: b, error: eb } = await sb.rpc('ta_beban', { p_ts: s.ts, p_sm: s.sm }); if (!eb) BEBAN_TA.set(k, b || []); }
  }
  if (!MODEL) MODEL = await fetch('data.json', {cache: 'no-cache'}).then(r => r.ok ? r.json() : null)
    .then(d => { if (d) KK = d.situs?.kelompok_keahlian || []; return d ? siapkan(d) : null; }).catch(() => null);
}

const lbl = (xs, k) => (xs.find(t => t[0] === k) || [, ''])[1];
function ringkasLuaran(d){
  return [['Kategori', d.kategori === 'luaran' ? 'Luaran (HKI, produk, buku)' : 'Publikasi'], ['Judul', d.judul],
    ['Jenis', d.kategori === 'luaran' ? lbl(JENIS_LUARAN, d.jenis_luaran) : lbl(JENIS_PUB, d.jenis_pub)],
    ['Tingkat / indeksasi', [lbl(TINGKAT_PUB, d.tingkat), lbl(INDEKSASI, d.indeksasi)].filter(Boolean).join(' · ')],
    ['Terbitan', d.terbitan], ['Nomor', d.nomor], ['Status paten', d.status_hki], ['TKT', d.tkt],
    ['Tahun', [d.bulan, d.tahun].filter(Boolean).join('/')], ['DOI/URL', d.doi_url], ['Anggota lain', teksAnggota(d.anggota)],
    ['Bersama dosen prodi', d.bersama_dosen ? 'ya (dicatat lewat karya dosen)' : 'tidak (mandiri)']];
}

function ringkas(p){
  const d = p.data || {};
  const nmDosen = id => DOSEN.find(x => x.id === id)?.nama || '';
  const nmNidn = n => DOSEN.find(x => x.nidn === n)?.nama || n;
  const j = JADWAL.get(p.id);
  const xs = p.jenis === 'luaran' ? ringkasLuaran(d)
    : p.jenis === 'yudisium' ? (k => [['Judul Tugas Akhir', d.judul], ['Catatan mahasiswa', d.catatan],
        ['Berkas wajib', `${k.ada} dari ${k.wajib}${k.kurang.length ? ' · belum: ' + k.kurang.join(', ') : ' (lengkap)'}`]])(kelengkapanYudisium(YUD, p.pengajuan_berkas || []))
    : p.jenis === 'kabar'
    ? [['Judul', d.judul], ['Tanggal kegiatan', d.tanggal], ['Jenis kegiatan', lbl(JENIS_KEGIATAN, d.jenis_kegiatan) || 'Lainnya'],
       ['Tempat', d.tempat], ['Ringkasan', d.ringkasan], ['Tautan', d.tautan]]
    : penetapanTA(p)
    ? [['Tahap', 'Pengajuan pembimbing TA'], ['Kelompok keahlian', namaKK(d.kk_ta)], ['Judul awal', d.judul],
       ['Pembimbing 2', nmDosen(d.pembimbing_2)], ['Alasan di luar kelompok keahlian', d.alasan_luar_kk],
       (k => ['Berkas wajib', `${k.ada} dari ${k.wajib}${k.kurang.length ? ' · belum: ' + k.kurang.join(', ') : ' (lengkap)'}`])(
         kelengkapanYudisium(berkasTahapTA(BERKAS_TA, 'penetapan_pembimbing'), p.pengajuan_berkas || []))]   // 176
    : p.jenis === 'ta'
    ? [['Tahap', (TAHAP_TA.find(t => t[0] === d.tahap_ta) || [, ''])[1]], ['Judul', d.judul], ['Pembimbing 2', nmDosen(d.pembimbing_2)],
       ...(TAHAP_TA_BERKAS.includes(d.tahap_ta) ? [(k => ['Berkas wajib', `${k.ada} dari ${k.wajib}${k.kurang.length ? ' · belum: ' + k.kurang.join(', ') : ' (lengkap)'}`])(
         kelengkapanYudisium(berkasTahapTA(BERKAS_TA, d.tahap_ta), p.pengajuan_berkas || []))] : []),   // 174
       ['Nama di jadwal publik', d.tampil_nama ? 'disetujui mahasiswa' : 'tidak'],
       ...(d.tahap_ta === 'sidang_akhir' ? [['Cek kemiripan', teksKemiripan(d, BATAS)]] : []),   // 185
       ...(d.tahap_ta === 'seminar_proposal' && d.metopen ? [['Metodologi Penelitian', 'bagian dari MK Metopen semester ini']] : []),
       ...(j ? [['Jadwal', [j.tanggal, j.jam, j.ruang, j.tautan_daring ? 'daring' : ''].filter(Boolean).join(' · ') + (j.status !== 'terjadwal' ? ` (${j.status})` : '')],
                ['Penguji', [...(j.penguji || []).map(nmNidn), j.penguji_luar].filter(Boolean).join(', ')]] : [])]
    : p.jenis === 'surat'
    ? [['Jenis surat', judulPengajuan(p)], ['Keperluan', d.keperluan], ['Tujuan', [d.tujuan_surat, d.alamat_tujuan].filter(Boolean).join(', ')],
       ['Judul penelitian', d.judul_penelitian], ['Lokasi', d.lokasi], ['Waktu', d.waktu_pelaksanaan]]
    : p.jenis === 'kp'
    ? [['Program', labelProgram(d.program)], ['Instansi', d.instansi], ['Alamat', d.alamat_instansi], ['Bidang/divisi', d.bidang_kerja],
       ['Kontak', d.kontak_instansi],
       ['Rencana', [d.rencana_mulai, d.rencana_selesai].filter(Boolean).join(' s.d. ')],
       // Jawaban instansi atas surat pengantar (107).
       ['Jawaban instansi', d.jawaban_instansi === 'diterima' ? `diterima${d.tanggal_mulai ? ', mulai ' + d.tanggal_mulai : ''}`
         : d.jawaban_instansi === 'ditolak' ? `ditolak${d.alasan_instansi ? ': ' + d.alasan_instansi : ''} (pengajuan ditutup)` : ''],
       // Lapor selesai KP (106): KP yang sudah selesai sebelum layanan dipakai; tanpa surat pengantar.
       ['Dilaporkan', d.susulan === 'selesai' ? 'setelah KP selesai (tanpa surat pengantar)' : '']]
    : [['Kegiatan', d.nama_kegiatan], ['Penyelenggara', d.penyelenggara], ['Tanggal', d.tanggal],
       ['Tingkat', (TINGKAT.find(t => t[0] === d.tingkat) || [, ''])[1]], ['Bidang', (BIDANG.find(t => t[0] === d.bidang) || [, ''])[1]],
       ['Capaian', d.capaian], ['Anggota lain', teksAnggota(d.anggota)], ['Nama di situs', d.tampil_nama ? 'disetujui mahasiswa' : 'tidak'],
       ['Cerita', d.cerita]];
  const s = p.data_selesai || {};
  const selesai = p.tahap === 'selesai' || Object.keys(s).length ? [['Laporan selesai: tanggal', [s.tanggal_mulai, s.tanggal_selesai].filter(Boolean).join(' s.d. ')],
    ['Pembimbing lapangan', [s.pembimbing_lapangan, s.jabatan_lapangan].filter(Boolean).join(', ')], ['Kontak lapangan', s.kontak_lapangan],
    ['Bagian/proyek', s.divisi], ['Ringkasan kegiatan', s.ringkasan]] : [];
  return [['Mahasiswa', `${p.nama} (${p.nim})`], ['Email', p.email], p.jenis === 'kabar' ? ['Dosen pendamping', p.dosen?.nama || 'tidak ada']
    : ['Pembimbing', JENIS[p.jenis]?.tanpaPembimbing ? '' : p.dosen?.nama || '—'],
    ...xs, ...selesai].filter(([, v]) => v);
}

        ${penetapanTA(p) && p.status === 'admin' ? `<p class="ket">Periksa kelompok keahlian, pembimbing, dan kuotanya di atas; Sahkan = pembimbing
          TA mahasiswa ini ditetapkan. Seminar/sidang mahasiswa ini kemudian memakai pembimbing tersebut.</p>` : ''}

}

// Pratinjau foto kabar kegiatan (144): foto kabar disimpan Apps Script di folder bertautan (siapa saja dengan link),
// jadi gambar mini Drive bisa tampil. Tautan tanpa id Drive dilewati; berkas tetap bisa dibuka lewat tombol Buka.
function htmlFotoKabar(berkas){
  const xs = berkas.filter(b => b.jenis === 'foto').map(b => (String(b.url || '').match(/\/d\/([\w-]{10,})|[?&]id=([\w-]{10,})/) || []).slice(1).find(Boolean))
    .filter(Boolean);
  if (!xs.length) return '<p class="ket">Belum ada foto kegiatan.</p>';
  return `<div class="foto-kabar">${xs.map((id, i) => `<img src="https://drive.google.com/thumbnail?id=${encodeURIComponent(id)}&amp;sz=w240"
    alt="Foto kegiatan ${i + 1}" loading="lazy">`).join('')}</div><p class="ket">${xs.length} foto${xs.length > 6 ? '; hanya 6 pertama yang terbit' : ''}.</p>`;
}

async function tetapkanTA(id, b){
  const p = DATA.find(x => x.id === id), satu = $('pt1_' + id).value, dua = $('pt2_' + id).value || null, alasan = $('pta_' + id).value.trim();
  if (!satu) return pesan(id, 'buruk', 'Pilih pembimbing 1.');
  if (dua && dua === satu) return pesan(id, 'buruk', 'Pembimbing 2 harus berbeda dari pembimbing 1.');
  const r = (BEBAN_TA.get(kunciSemester(smtTA(p))) || []).find(x => x.dosen_id === satu);
  if (r && !kkCocok(p.data?.kk_ta, r.kk, DEKAT) && alasan.length < 5) return pesan(id, 'buruk', 'Pembimbing 1 di luar kelompok keahlian TA: tulis alasannya.');
  if (r && r.kuota != null && r.beban >= r.kuota && !confirm(`Kuota TA ${r.nama} pada semester ini sudah penuh (${r.beban}/${r.kuota}). Tetap tetapkan?`)) return;
  b.disabled = true;
  try {
    const { error } = await sb.rpc('ta_tetapkan_pembimbing', { p_id: id, p_dosen: satu, p_dosen2: dua, p_alasan: alasan || null });
    if (error) throw new Error(error.message);
    BUKA.add(id);
    await muat(); gambar(); gambarRekap();
    pesan(id, 'ok', `Pembimbing TA ditetapkan: ${r?.nama || ''}. Tekan Sahkan bila sudah sesuai.`);
  } catch (e) { pesan(id, 'buruk', e.message); b.disabled = false; }
}

// Ganti pembimbing TA (180, pemilik 2026-11-25): mahasiswa tidak melanjutkan bimbingan; koordinator TA/admin mengganti

  const rows = BEBAN_TA.get(kunciSemester(semesterTA(new Date().toISOString())));

  return `<details class="ganti-ta" style="margin-top:10px"><summary><b>Ganti pembimbing (bimbingan dibatalkan)</b></summary>
    <p class="ket">Untuk mahasiswa yang tidak melanjutkan bimbingan dengan pembimbing sekarang (${esc(p.dosen?.nama || '—')}). Mahasiswa tidak
      mengajukan ulang: seminar/sidang dan catatan bimbingan berikutnya memakai pembimbing baru, dan pengajuan TA yang masih berjalan ikut
      dipindah. Kuota dosen pengganti tidak berkurang. Catatan bimbingan lama tetap tersimpan; semuanya tercatat di jalur proses.</p>
    <div class="baris"><label>Pembimbing 1 baru <select id="pg1_${p.id}"><option value="">(pilih)</option>${xs.map(r =>
      `<option value="${r.dosen_id}">${esc(r.teks)}</option>`).join('')}</select></label>
      <label>Pembimbing 2 <select id="pg2_${p.id}"><option value="">(tidak ada)</option>${rows.map(r => `<option value="${r.dosen_id}"${

    <div class="baris"><label style="flex:1">Judul TA <input id="pgj_${p.id}" maxlength="300" style="width:100%" value="${esc(p.data?.judul || '')}"></label></div>
    <div class="baris"><label style="flex:1">Alasan (wajib) <input id="pga_${p.id}" maxlength="600" style="width:100%"
      placeholder="mis. mahasiswa tidak melanjutkan bimbingan sejak ..."></label>
      <button class="b" data-ganti-ta="${p.id}">Ganti pembimbing</button></div></details>`;
}

async function gantiTA(id, b){
  const satu = $('pg1_' + id).value, dua = $('pg2_' + id).value || null, judul = $('pgj_' + id).value.trim(), alasan = $('pga_' + id).value.trim();
  if (!satu) return pesan(id, 'buruk', 'Pilih pembimbing 1 baru.');
  if (dua && dua === satu) return pesan(id, 'buruk', 'Pembimbing 2 harus berbeda dari pembimbing 1.');
  if (alasan.length < 5) return pesan(id, 'buruk', 'Tulis alasan penggantian (bimbingan dibatalkan).');
  if (!confirm('Batalkan bimbingan dan ganti pembimbing? Mahasiswa tidak perlu mengajukan ulang; kuota dosen pengganti tidak berkurang.')) return;
  b.disabled = true;
  try {
    const { error } = await sb.rpc('ta_ganti_pembimbing', { p_id: id, p_dosen: satu, p_dosen2: dua, p_judul: judul || null, p_alasan: alasan });
    if (error) throw new Error(error.message);
    BUKA.add(id);
    await muat(); gambar(); gambarRekap();
    pesan(id, 'ok', 'Pembimbing TA diganti. Seminar/sidang dan catatan bimbingan berikutnya memakai pembimbing baru.');
  } catch (e) { pesan(id, 'buruk', e.message); b.disabled = false; }
}

async function tetapkan(id, b){
  const p = DATA.find(x => x.id === id), pilih = $('pb_' + id).value;
  if (!pilih || pilih === p.pembimbing_id) return pesan(id, '', 'Pembimbing tidak berubah.');
  const r = (BEBAN.get(tsKP(p)) || []).find(x => x.dosen_id === pilih);
  if (r?.lebih && !confirm(`Kuota ${r.nama} pada TS ini sudah penuh (${r.beban}/${r.kuota}). Tetap tetapkan?`)) return;
  b.disabled = true;
  try {
    const { error } = await sb.rpc('kp_tetapkan_pembimbing', { p_id: id, p_dosen: pilih });
    if (error) throw new Error(error.message);
    BUKA.add(id);
    await muat(); gambar(); gambarRekap();
    pesan(id, 'ok', `Dosen pembimbing ditetapkan: ${r?.nama || ''}.`);
  } catch (e) { pesan(id, 'buruk', e.message); b.disabled = false; }
}

// Jadwal seminar/sidang (94): admin menetapkan tanggal, jam, ruang/daring, penguji; Jadwalkan = setujui.
// Usulan penguji (pemilik 2026-11-17): cocok dengan judul (Cari calon pembimbing TA), tanpa pembimbing; beban TS berjalan.
function htmlUsulan(p, pbId){
  const kecuali = new Set(DOSEN.filter(x => pbId.includes(x.id)).map(x => x.nidn));
  const ts = tsDari(new Date().toISOString().slice(0, 10));
  const xs = usulPenguji(p.data?.judul, MODEL, DOSEN, { kecuali, beban: bebanUji(SEMUA_JADWAL, ts) });
  if (!xs.length) return `<p class="ket">Usulan penguji: ${MODEL ? 'tidak ada dosen yang cocok dengan judul ini; pilih manual.' : 'data keahlian belum termuat.'}</p>`;
  const JN = { topik: 'topik keahlian', bidang: 'bidang', publikasi: 'publikasi', kegiatan: 'penelitian/PkM' };
  return `<div class="usulan"><div class="ket" style="margin-top:6px">Usulan penguji (cocok dengan judul; beban menguji TS ${ts - 1}/${ts}):</div>

// Periksa jadwal dosen sebelum menjadwalkan (pemilik 2026-11-22): cari_waktu_rapat (berhalangan, rapat, kuliah sah; 138/152)
// + sidang TA lain (jadwal-sidang.js). Usulan jam kosong untuk semua pembimbing dan penguji yang dicentang, 14 hari.
let SLOT_SIDANG = null;
async function periksaJadwalDosen(id, b){
  const p = DATA.find(x => x.id === id), el = $('jcek_' + id);
  const pb = [p.pembimbing_id, p.data?.pembimbing_2].filter(Boolean);
  const uji = [...document.querySelectorAll(`[data-uji="${id}"]:checked`)].map(c => DOSEN.find(d => d.nidn === c.value)?.id).filter(Boolean);
  const peserta = [...new Set([...pb, ...uji])];
  const durasi = Math.min(300, Math.max(30, +$('jdur_' + id).value || 90));
  const hariIni = new Date().toISOString().slice(0, 10), dari = $('jt_' + id).value && $('jt_' + id).value >= hariIni ? $('jt_' + id).value : hariIni;
  const sampai = new Date(Date.parse(dari + 'T00:00:00Z') + 13 * 864e5).toISOString().slice(0, 10);
  if (!peserta.length) { el.innerHTML = '<p class="pesan buruk">Belum ada pembimbing atau penguji yang dipilih.</p>'; return; }
  b.disabled = true; el.innerHTML = '<p class="ket">Memeriksa…</p>';
  try {
    if (!SLOT_SIDANG) {
      const [s, h] = await Promise.all([sb.from('jadwal_slot').select('id,mulai,selesai').eq('aktif', true).order('mulai'), sb.from('jadwal_hari').select('hari')]);
      SLOT_SIDANG = { slot: s.data || [], hari: (h.data || []).map(x => +x.hari) };
    }
    if (!SLOT_SIDANG.slot.length) throw new Error('Slot jam kuliah belum diatur (Jadwal berhalangan, admin).');
    const { data, error } = await sb.rpc('cari_waktu_rapat', { p_peserta: peserta, p_dari: dari, p_sampai: sampai });
    if (error) throw error;
    const tanggal = [];
    for (let t = Date.parse(dari + 'T00:00:00Z'); t <= Date.parse(sampai + 'T00:00:00Z'); t += 864e5) {
      const d = new Date(t), h = d.getUTCDay() || 7;
      if (!SLOT_SIDANG.hari.length || SLOT_SIDANG.hari.includes(h)) tanggal.push(d.toISOString().slice(0, 10));
    }
    const sid = sibukSidang({ jadwal: SEMUA_JADWAL, slot: SLOT_SIDANG.slot, dosen: DOSEN, tanggal, kecuali: id, durasi });
    const sibuk = gabungSibuk(data.sibuk || [], data.nama ? sid : []);
    const namaD = x => DOSEN.find(d => d.id === x)?.nama || '?';
    const k = new Date(), kini = { tanggal: hariIni, menit: k.getHours() * 60 + k.getMinutes() };
    const u = usulanWaktu({ tanggal, slot: SLOT_SIDANG.slot, sibuk, durasi, kini, maks: 6 });
    const tgl = t => new Date(t + 'T00:00:00').toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    let html = '';
    const w = $('jt_' + id).value ? bacaJam($('jj_' + id).value, durasi) : null;
    if (w) {
      const r = periksaWaktu({ tanggal: $('jt_' + id).value, mulai: w.mulai, selesai: w.selesai, slot: SLOT_SIDANG.slot, sibukRapat: data.sibuk || [],
        jadwal: data.nama ? SEMUA_JADWAL : [], dosen: DOSEN, peserta, kecuali: id, nama: namaD, durasi });
      const waktu = `${tgl($('jt_' + id).value)}, ${formatJam(w.mulai, w.selesai)}`;
      html += r.bentrok.length || r.tanpaNama
        ? `<div class="pesan buruk"><b>Bentrok pada ${esc(waktu)}:</b><ul>${r.bentrok.map(x => `<li>${esc(x.nama)}: ${esc(x.sebab.join('; '))}</li>`).join('')}`
          + `${r.tanpaNama ? `<li>${r.tanpaNama} dosen tidak bisa</li>` : ''}</ul></div>`
        : `<p class="pesan ok">Semua ${peserta.length} dosen bisa pada ${esc(waktu)}.</p>`;
      html += r.tidakTerbaca.map(x => `<p class="ket">${esc(x)}</p>`).join('');
    } else if ($('jt_' + id).value && $('jj_' + id).value) html += '<p class="ket">Jam belum terbaca; tulis seperti 09.00–10.30.</p>';
    const j = x => x.replace(':', '.');
    html += u.length ? `<div class="ket" style="margin-top:6px">Usulan jam (${durasi} menit) untuk ${peserta.length} dosen, ${esc(tgl(dari))} s.d. ${esc(tgl(sampai))}:</div><ul>`
      + u.map(x => `<li>${esc(tgl(x.tanggal))}, ${esc(j(x.mulai))}–${esc(j(x.selesai))} · `
        + (x.n ? `<span class="buruk">${x.dosen ? 'tidak bisa: ' + esc(x.dosen.map(namaD).join(', ')) : x.n + ' dosen tidak bisa'}</span>` : '<b>semua bisa</b>')
        + ` <button class="b" type="button" data-pakai="${id}" data-t="${x.tanggal}" data-j="${j(x.mulai)}–${j(x.selesai)}">Pakai</button></li>`).join('') + '</ul>'
      : '<p class="ket">Tidak ada jam kuliah yang cukup panjang dalam 14 hari itu.</p>';
    if (!data.nama) html += '<p class="ket">Nama dosen yang tidak bisa dan sidang TA lain hanya terlihat oleh pengatur jadwal (admin, Kaprodi, koordinator TA/KP).</p>';
    el.innerHTML = html;
    el.querySelectorAll('[data-pakai]').forEach(x => { x.onclick = () => { $('jt_' + id).value = x.dataset.t; $('jj_' + id).value = x.dataset.j; periksaJadwalDosen(id, b); }; });
  } catch (e) { el.innerHTML = `<p class="pesan buruk">${esc(/cari_waktu_rapat/.test(e.message || '') ? 'Fungsi Cari waktu belum ada (patch 138).' : (e.message || String(e)))}</p>`; }
  b.disabled = false;
}

async function jadwalkan(id, b){
  const v = k => ($(k + id)?.value || '').trim();
  const penguji = [...document.querySelectorAll(`[data-uji="${id}"]:checked`)].map(c => c.value);
  if (!v('jt_')) return pesan(id, 'buruk', 'Isi tanggal.');
  if (!penguji.length && !v('jl_')) return pesan(id, 'buruk', 'Pilih minimal satu penguji.');
  b.disabled = true;
  try {
    await catatKemiripan(id);   // 185
    const { error } = await sb.rpc('pengajuan_jadwalkan', { p_id: id, p_tanggal: v('jt_'), p_jam: v('jj_'), p_ruang: v('jr_'),
      p_tautan: v('jd_') || null, p_penguji: penguji, p_penguji_luar: v('jl_') || null });
    if (error) throw new Error(error.message);
    let kabar = '';
    try { await appsScript({ kind: 'mhs_kabari', token: await sesi(), pengajuan_id: id, catatan: $('c_' + id)?.value.trim() || '' });
          kabar = ' Mahasiswa dikabari lewat email.'; }

    atas(`${p ? p.nama + ' — ' + judulPengajuan(p) + ': ' : ''}Terjadwal.${kabar}`);

}

  document.querySelectorAll('[data-tetapkan]').forEach(b => { b.onclick = () => tetapkan(+b.dataset.tetapkan, b); });
  document.querySelectorAll('[data-tetapkan-ta]').forEach(b => { b.onclick = () => tetapkanTA(+b.dataset.tetapkanTa, b); });
  document.querySelectorAll('[data-ganti-ta]').forEach(b => { b.onclick = () => gantiTA(+b.dataset.gantiTa, b); });
  document.querySelectorAll('[data-usul]').forEach(b => { b.onclick = () => {

async function catatKemiripan(id){

async function putuskan(id, aksi, b){

  document.querySelectorAll(`[data-p="${id}"]`).forEach(x => { x.disabled = true; });
  try {

// Rekap KP/lomba per periode (pemilik 2026-11-17): TS, 3 TS, atau tahun kalender, sama dengan Rekap SDGs.
// Waktu: tanggal mulai KP (laporan selesai), rencana mulai, atau tanggal lomba (waktuPengajuan). Draf tidak dihitung.
let PERIODE = '';
const dgWaktu = p => ({ ...p, ...waktuPengajuan(p) });
const tsTeks = p => { const t = tsKarya(waktuPengajuan(p)); return t ? taTeks(t) : ''; };
function gambarRekap(){
  const xs = DATA.map(dgWaktu).filter(p => !['draf', 'dibatalkan'].includes(p.status) && cocokPeriode(p, PERIODE));   // 161

      ${r.yudisium.semua ? `<div><b>${r.yudisium.disahkan} / ${r.yudisium.diperiksa}</b><span>berkas yudisium disahkan / diperiksa</span></div>` : ''}
    </div>

async function unduhRekap(xs){
  const b = $('rUnduh'); b.disabled = true;
  try {
    const X = await import(SHEETJS), wb = X.utils.book_new(), L = lembarPengajuan(xs, tsTeks, YUD);
    for (const [nama, baris] of Object.entries(L)) {
      const ws = X.utils.aoa_to_sheet(baris.map(r => r.map(c => c && typeof c === 'object' ? c.t : c)));
      baris.forEach((r, i) => r.forEach((c, j) => { if (c && typeof c === 'object' && c.l) ws[X.utils.encode_cell({ r: i, c: j })].l = { Target: c.l }; }));
      ws['!cols'] = baris[0].map((_, j) => ({ wch: Math.min(60, Math.max(8, ...baris.slice(0, 200).map(r => String(r[j]?.t ?? r[j] ?? '').length))) }));
      X.utils.book_append_sheet(wb, ws, nama);
    }
    const ket = X.utils.aoa_to_sheet([['Rekap pengajuan mahasiswa'], ['Periode', labelPeriode(PERIODE)], ['Diunduh', new Date().toLocaleString('id-ID')],
      ['Catatan', 'Memuat NIM; untuk keperluan internal prodi dan akreditasi. Draf tidak ikut. Tautan berkas hanya terbuka bagi akun prodi.']]);
    ket['!cols'] = [{ wch: 12 }, { wch: 90 }];
    X.utils.book_append_sheet(wb, ket, 'Keterangan');
    const [j, n] = (PERIODE || '').split(':');
    X.writeFile(wb, `rekap-pengajuan-mahasiswa-${!PERIODE ? 'semua' : j === 'th' ? n : j === 'ts' ? `TS${n - 1}-${n}` : `TS${n - 3}-${n}`}.xlsx`);
  } catch (e) { $('rMsg').className = 'msg buruk'; $('rMsg').textContent = 'Unduh gagal: ' + (e.message || e); }
  finally { b.disabled = !xs.length; }
}

async function mulai(){
  SAYA = await gerbang(sb);
  if (!SAYA) return;
  ADMIN = SAYA.peran === 'admin';
  UNDUH = ADMIN || punya(SAYA, 'koordinator_kp') || punya(SAYA, 'pembina_kemahasiswaan');
  const jab = (SAYA.koordinator || []).filter(j => ['koordinator_ta', 'koordinator_kp', 'pembina_kemahasiswaan'].includes(j));
  $('hSub').textContent = `Masuk sebagai ${SAYA.nama}`;
  await muat();
  $('isi').innerHTML = `
    <p class="ket">Pengajuan Kerja Praktik, seminar/sidang TA, laporan lomba, kabar kegiatan, dan permohonan surat yang dikirim mahasiswa lewat <a href="pengajuan.html">halaman pengajuan</a>
      (tanpa masuk akun; tautan pribadi ke email kampus). Urutan pemeriksaan: dosen pembimbing, lalu admin prodi; <b>pengajuan KP</b> langsung ke
      koordinator KP/admin, yang menetapkan dosen pembimbing sesuai kuota (pelaporan selesai KP tetap: dosen pembimbing, lalu koordinator KP/admin);
      permohonan surat langsung ke admin (ditandatangani Kaprodi); berkas yudisium langsung ke admin prodi; laporan lomba dan
      kabar kegiatan cukup satu persetujuan (dosen pembimbing/pendamping, pembina kemahasiswaan, atau admin).
      ${ADMIN ? 'Admin melihat semua pengajuan dan boleh memutuskan tahap pembimbing bila pembimbing berhalangan.'
        : jab.length ? `Anda ${jab.map(labelJabatan).join(', ')}: memegang tahap admin pengajuan bidang Anda dan boleh menggantikan pembimbing yang berhalangan.` : 'Anda melihat pengajuan yang memilih Anda sebagai pembimbing.'}
      ${ADMIN ? 'Draf yang belum dikirim mahasiswa tampil di "Semua".' : 'Draf yang belum dikirim mahasiswa tidak tampil.'}</p>
    <p class="ket">Sosialisasi: <a class="b" href="pengajuan.html?latihan=1" target="_blank" rel="noopener">Buka mode latihan</a>
      alur mahasiswa lengkap dengan data fiktif (email tiruan berisi tautan pribadi, unggah, kirim, pesan merah); tidak tersimpan di
      prodi dan tidak mengirim email. Mahasiswa bisa mencobanya di HP lewat alamat <code>pengajuan.html?latihan=1</code> situs ini.</p>
    <details class="kotak-rekap" id="rekap"><summary>Rekap dan unduhan per periode</summary><div id="rekapIsi"></div></details>
    <div class="tab" id="tab" role="group" aria-label="Kelompok"></div>
    <div class="saring">
      <label>Jenis <select id="fJenis"><option value="">Semua</option><option value="kp">KP</option><option value="lomba">Lomba</option><option value="ta">Seminar/sidang TA</option><option value="luaran">Publikasi/luaran</option><option value="kabar">Kabar kegiatan</option><option value="surat">Surat</option><option value="yudisium">Berkas yudisium</option></select></label>
      <input id="fCari" type="search" placeholder="Cari nama, NIM, instansi, lomba" aria-label="Cari">
    </div>
    <p class="msg ok" id="mAtas" role="status"></p>
    <div id="daftar"></div>`;
  gambarRekap();
  $('fJenis').onchange = gambar;
  $('fCari').oninput = gambar;
  if (!DATA.some(menungguSaya)) TAB = 'proses';
  gambar();
}
mulai().catch(e => { $('isi').innerHTML = `<p class="kosong">Gagal memuat: ${esc(e.message)}</p>`; });
</script>
