  if (document.getElementById('galat-muat')) return;
  var d = document.createElement('div');

  d.style.cssText = 'margin:16px;padding:12px 14px;border:1px solid var(--merah);' +

});

// TA (110): tahap Pengajuan pembimbing menampilkan KK dan menyaring pembimbing 1 (KK sama atau berdekatan).
let MKP_AWAL = [];   // 196: MK pilihan tersimpan, diisi saat formulir digambar
function pasangTA(){
  const th = $('f_tahap'); if (!th) return;
  const pb = $('f_pb'), awal = pb.value;
  const atur = () => {
    const aju = th.value === TAHAP_PEMBIMBING_TA, kk = $('f_kk').value, pilih = pb.value || awal;
    document.querySelectorAll('[data-ta]').forEach(el => { el.hidden = el.dataset.ta !== (aju ? 'pembimbing' : 'seminar'); });
    // 196: MK pilihan K26 menurut KK; pilihan sebelumnya dipertahankan bila masih sebidang.
    if ($('f_mkp_f')) {
      $('f_mkp_f').hidden = !aju || $('f_kur').value !== 'K26';
      const xs = mkPilihanBidang(MKP, kk), lama = [$('f_mkp1').value || MKP_AWAL[0], $('f_mkp2').value || MKP_AWAL[1]];
      const isi = (el, v) => { el.innerHTML = `<option value="">${kk ? '(pilih)' : '(pilih kelompok keahlian dulu)'}</option>` + xs.map(m =>
        `<option value="${esc(m.kode)}"${m.kode === v ? ' selected' : ''}>${esc(m.nama)} (${esc(m.kode)}, ${esc(m.sks)} sks)</option>`).join(''); };
      isi($('f_mkp1'), lama[0]); isi($('f_mkp2'), lama[1]);
      $('f_mkp_ket').textContent = kk && xs.length < 2 ? `Daftar MK pilihan K26 untuk bidang ini kurang dari 2; hubungi koordinator TA.` : '';
    }
    document.querySelectorAll('[data-tahap]').forEach(el => { el.hidden = !el.dataset.tahap.split(' ').includes(th.value); });   // 185
    const xs = aju && DOSEN_TA ? pembimbingCocok(DOSEN_TA, kk) : DOSEN;
    pb.innerHTML = `<option value="">${aju && !kk ? '(pilih kelompok keahlian dulu)' : '(pilih)'}</option>` + xs.map(x =>
      `<option value="${x.id}"${x.id === pilih ? ' selected' : ''}>${esc(x.nama)}${aju && x.kk && x.kk !== kk ? ` (${esc(x.kk)}, berdekatan)` : ''}</option>`).join('');
  };
  th.onchange = atur; $('f_kk').onchange = atur; if ($('f_kur')) $('f_kur').onchange = atur; atur();
}

// Kolom publikasi/luaran mengikuti kategori (96).
function pasangLuaran(){
  const rs = document.querySelectorAll('[name=f_kat]'); if (!rs.length) return;
  const atur = () => { const k = document.querySelector('[name=f_kat]:checked')?.value;
    document.querySelectorAll('[data-kat]').forEach(el => { el.hidden = el.dataset.kat !== k; }); };
  rs.forEach(r => { r.onchange = atur; }); atur();
}

function pasangSurat(){
  const js = $('f_js'); if (!js) return;
  const atur = () => document.querySelectorAll('[data-surat]').forEach(el => { el.hidden = !el.dataset.surat.split(' ').includes(js.value); });
  js.onchange = atur; atur();
}

function bacaIsian(jenis){
  const v = id => ($(id)?.value || '').trim();
  if (jenis === 'luaran') {
    const kat = document.querySelector('[name=f_kat]:checked')?.value || '';
    const umum = { kategori: kat, judul: v('f_judul'), tahun: v('f_th'), bulan: v('f_bl'), doi_url: v('f_doi'),
                   anggota: bacaAnggota($('f_anggota').value), bersama_dosen: $('f_bd').checked };
    return { nama: v('f_nama'), pembimbing: v('f_pb'), data: kat === 'luaran'
      ? { ...umum, jenis_luaran: v('f_jl'), nomor: v('f_no'), status_hki: v('f_sh'), tkt: v('f_tkt') }
      : { ...umum, jenis_pub: v('f_jp'), tingkat: v('f_tk'), indeksasi: v('f_ix'), terbitan: v('f_tb') } };
  }
  if (jenis === 'ta') return { nama: v('f_nama'), pembimbing: v('f_pb'), data: { tahap_ta: v('f_tahap'), judul: v('f_judul'),
    pembimbing_2: v('f_pb2'), tampil_nama: $('f_tampil').checked, ...(v('f_tahap') === TAHAP_PEMBIMBING_TA ? { kk_ta: v('f_kk'),
      kurikulum_ta: v('f_kur'), ...(v('f_kur') === 'K26' ? { mk_pilihan_ta: [v('f_mkp1'), v('f_mkp2')].filter(Boolean) } : {}) } : {}),   // 196
    ...(v('f_tahap') === 'sidang_akhir' ? { kemiripan_persen: v('f_kemiripan') } : {}),   // 185
    ...(v('f_tahap') === 'seminar_proposal' && $('f_metopen')?.checked ? { metopen: true } : {}) } };
  if (jenis === 'yudisium') return { nama: v('f_nama'), pembimbing: '', data: { judul: v('f_judul'), catatan: v('f_cat') } };
  // Kabar (144): dosen pendamping kosong dikirim null (basis data: opsional).
  if (jenis === 'kabar') return { nama: v('f_nama'), pembimbing: v('f_pb') || null, data: { judul: v('f_judul'), tanggal: v('f_tgl'),
    jenis_kegiatan: v('f_jk'), tempat: v('f_tempat'), ringkasan: v('f_ring'), tautan: v('f_taut') } };
  if (jenis === 'surat') return { nama: v('f_nama'), pembimbing: '', data: { jenis_surat: v('f_js'), keperluan: v('f_kep'),
    tujuan_surat: v('f_tuj'), alamat_tujuan: v('f_alt'), judul_penelitian: v('f_jdl'), lokasi: v('f_lok'), waktu_pelaksanaan: v('f_wkt') } };
  const data = jenis === 'kp'
    ? { program: v('f_program'), instansi: v('f_instansi'), alamat_instansi: v('f_alamat'), bidang_kerja: v('f_bidang'), kontak_instansi: v('f_kontak'),
        rencana_mulai: v('f_mulai'), rencana_selesai: v('f_selesai'), susulan: v('f_susulan') }
    : { nama_kegiatan: v('f_keg'), penyelenggara: v('f_peny'), tanggal: v('f_tgl'), tingkat: v('f_tingkat'), bidang: v('f_bid'),
        capaian: v('f_capaian'), anggota: bacaAnggota($('f_anggota').value), cerita: v('f_cerita'), tampil_nama: $('f_tampil').checked };
  return { nama: v('f_nama'), pembimbing: v('f_pb'), data };
}

    } catch (err) { tulis('m_alt', 'buruk', err.message); }
    finally { $('b_alt').disabled = false; }
  };
  $('frmUlang').onsubmit = async e => {
    e.preventDefault();
    const nim = $('u_nim').value.trim();
    if (!/^\d{6,15}$/.test(nim)) return tulis('m_ulang', 'buruk', 'NIM harus angka 6–15 digit.');
    $('b_ulang').disabled = true; tulis('m_ulang', '', 'Mengirim…');

      tulis('m_ulang', 'ok', `Bila NIM ini punya pengajuan, tautan baru sudah dikirim ke ${out.email || 'email kampus'}.`);
    } catch (err) { tulis('m_ulang', 'buruk', err.message); }
    finally { $('b_ulang').disabled = false; }
  };
}

// ---------- dengan token: pengajuan saya ----------
async function muat(){
  if (PRATINJAU) {
    const sbAdmin = createClient(window.SB_URL, window.SB_KEY);   // sesi login ruang kerja
    const { data: { session } } = await sbAdmin.auth.getSession();
    if (!session) throw new Error('Pratinjau khusus admin: masuk ruang kerja dulu, lalu buka lagi dari halaman Pengajuan mahasiswa.');
    const { data, error } = await sbAdmin.rpc('mhs_pratinjau_admin', { p_id: PRATINJAU });
    if (error) throw new Error(/mhs_pratinjau_admin/.test(error.message) ? 'Patch 160 belum dijalankan.' : error.message);
    P = data.lihat; PERIKSA = data.periksa || [];
    return;
  }
  const { data, error } = await sb.rpc('mhs_lihat', { p_token: TOKEN });
  if (error) throw new Error(error.message);
  P = data;
  await muatBimbingan();   // 175
  await muatKemajuan();    // 182
}

// Buka pengajuan lain dengan NIM yang sama dari tautan ini: kunci pembuka baru, lalu muat ulang dengan #t=<kunci>.
async function pindah(id, tombol){

// Catatan bimbingan TA (175, pemilik 2026-11-25): mahasiswa mencatat tiap bimbingan; pembimbing mengonfirmasi atau
// mengembalikan; 14 hari tanpa tanggapan = terkonfirmasi otomatis. Syarat mendaftar seminar/sidang = jumlah terkonfirmasi.
// BIMB = hasil mhs_bimbingan(token); null = bukan TA, pratinjau admin, contoh, atau patch 175 belum ada.
let BIMB = null, UBAH_BIMB = null;
async function muatBimbingan(){
  BIMB = null;
  if (!TOKEN || P?.jenis !== 'ta') return;
  const { data, error } = await sb.rpc('mhs_bimbingan', { p_token: TOKEN });
  if (!error && data) BIMB = data;
}
function htmlBimbingan(){
  const b = BIMB, x = UBAH_BIMB ? b.catatan.find(c => c.id === UBAH_BIMB) || {} : {};
  const hariIni = new Date(Date.now() + 7 * 3600e3).toISOString().slice(0, 10);
  const pb = b.pembimbing || [];
  const kelas = { dikonfirmasi: 'ada', otomatis: 'ada', dikembalikan: 'kurang', menunggu: '' };
  return `<h2 id="bimbingan">Catatan bimbingan</h2>
    <p class="ket">Catat setiap bimbingan TA di sini; pembimbing mengonfirmasinya. Catatan yang ${b.hari_otomatis || HARI_OTOMATIS} hari tidak ditanggapi
      terkonfirmasi otomatis. Bimbingan lama (sebelum situs dipakai) boleh dicatat juga. Tiap catatan boleh diberi satu lampiran (mis. draf bab;
      PDF/JPG/PNG) selama belum terkonfirmasi; lampiran dihapus otomatis 30 hari setelah Anda lulus, catatannya tetap.</p>
    <ul class="ket" style="margin:4px 0 8px 18px">${(b.syarat || []).map(s => `<li>${esc(teksSyarat(s))}</li>`).join('')}</ul>
    ${pb.length ? `<details class="kotak"${UBAH_BIMB ? ' open' : ''}><summary><b>${UBAH_BIMB ? 'Ubah catatan bimbingan' : 'Catat bimbingan'}</b></summary>
      <form id="frmBimb" novalidate><div class="dua">
        <div class="fld"><label for="bm_tgl">Tanggal bimbingan</label><input id="bm_tgl" type="date" max="${hariIni}" value="${esc(x.tanggal || '')}"></div>
        <div class="fld"><label for="bm_cara">Cara</label><select id="bm_cara">${CARA_BIMBINGAN.map(([k, l]) =>
          `<option value="${k}"${k === (x.cara || 'tatap_muka') ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select></div>
        <div class="fld"><label for="bm_pb">Pembimbing</label><select id="bm_pb">${pb.map(d =>
          `<option value="${esc(d.id)}"${d.id === (x.pembimbing_id || pb[0].id) ? ' selected' : ''}>${esc(d.nama)} (pembimbing ${d.ke})</option>`).join('')}</select></div></div>
        <div class="fld"><label for="bm_topik">Topik yang dibahas</label><textarea id="bm_topik" maxlength="1000" placeholder="mis. Bab 3 metodologi: pemilihan data hujan">${esc(x.topik || '')}</textarea></div>
        <div class="fld"><label for="bm_arahan">Arahan pembimbing dan rencana berikutnya <span>(opsional)</span></label>
          <textarea id="bm_arahan" maxlength="2000">${esc(x.arahan || '')}</textarea></div>
        <p><button type="submit" class="b utama" id="b_bimb">${UBAH_BIMB ? 'Simpan perubahan' : 'Simpan catatan'}</button>
          ${UBAH_BIMB ? '<button type="button" class="b" id="b_bimb_batal">Batal</button>' : ''}<span class="msg" id="m_bimb" role="status"></span></p></form></details>`
      : '<p class="kosong">Pembimbing TA Anda belum tercatat. Ajukan pembimbing TA dulu (Tahap: Pengajuan pembimbing TA).</p>'}
    <ul class="daftar yud">${(b.catatan || []).map(c => { const s = statusBimbingan(c), bisa = !c.sah;
      return `<li class="${kelas[s.kode]}"><div class="isi"><span class="tanda-yud">${esc(s.kode === 'menunggu' ? 'menunggu' : s.kode === 'dikembalikan' ? 'kembali' : '✓')}</span>
        <b>${esc(tglPendek(c.tanggal))}</b> · ${esc(labelCara(c.cara))}${c.pembimbing ? ' · ' + esc(c.pembimbing) : ''}
        <div>${esc(c.topik)}</div>${c.arahan ? `<div class="meta">Arahan: ${esc(c.arahan)}</div>` : ''}
        <div class="meta">${esc(s.label)}${s.otomatisPada ? ` (otomatis terkonfirmasi ${esc(tglPendek(s.otomatisPada))} bila tidak ditanggapi)` : ''}${
          c.catatan_pembimbing ? ` · Catatan pembimbing: ${esc(c.catatan_pembimbing)}` : ''}</div>
        <div class="meta">${c.ada_lampiran ? `Lampiran: ${esc(c.lampiran_nama || 'berkas')} <button class="b kecil" data-lampiran-buka="${c.id}">Buka</button>`
          : c.lampiran_dihapus ? 'Lampiran dihapus otomatis (30 hari setelah lulus).' : ''}${bisa ? ` <label class="b kecil" style="cursor:pointer">${c.ada_lampiran ? 'Ganti lampiran' : 'Lampirkan berkas'}
          <input type="file" accept=".pdf,.jpg,.jpeg,.png" data-lampiran-unggah="${c.id}" hidden></label>` : ''}
          ${bisa ? `<button class="b kecil" data-ubah-bimb="${c.id}">Ubah</button><button class="b kecil" data-hapus-bimb="${c.id}" aria-label="Hapus catatan">×</button>` : ''}</div></div></li>`; }).join('')

const tglPendek = s => s ? new Date(String(s).slice(0, 10) + 'T00:00:00Z').toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' }) : '';
function pasangBimbingan(){
  if (!BIMB || !$('bimbingan')) return;
  const segarkan = async pesan => { await muatBimbingan(); UBAH_BIMB = null; halamanSaya(); if (pesan) tulis('m_bimb', 'ok', pesan); };
  const f = $('frmBimb');
  if (f) f.onsubmit = async e => {
    e.preventDefault();
    const x = { tanggal: $('bm_tgl').value, cara: $('bm_cara').value, pembimbing: $('bm_pb').value, topik: $('bm_topik').value, arahan: $('bm_arahan').value };
    const g = periksaBimbingan(x, BIMB.pembimbing || []);
    if (g.length) return tulis('m_bimb', 'buruk', g.join(' '));
    $('b_bimb').disabled = true;
    const { error } = await sb.rpc('mhs_bimbingan_simpan', { p_token: TOKEN, p_id: UBAH_BIMB, p_tanggal: x.tanggal, p_cara: x.cara,
      p_pembimbing: x.pembimbing, p_topik: x.topik, p_arahan: x.arahan });
    if (error) { $('b_bimb').disabled = false; return tulis('m_bimb', 'buruk', error.message); }
    await segarkan('Catatan tersimpan; menunggu konfirmasi pembimbing.');
    $('bimbingan').scrollIntoView({ block: 'start' });
  };
  if ($('b_bimb_batal')) $('b_bimb_batal').onclick = () => { UBAH_BIMB = null; halamanSaya(); $('bimbingan').scrollIntoView({ block: 'start' }); };
  document.querySelectorAll('[data-ubah-bimb]').forEach(b => { b.onclick = () => { UBAH_BIMB = +b.dataset.ubahBimb; halamanSaya(); $('bimbingan').scrollIntoView({ block: 'start' }); }; });
  // 179: lampiran (PDF/JPG/PNG) per catatan yang belum terkonfirmasi; dihapus otomatis 30 hari setelah lulus.
  document.querySelectorAll('[data-lampiran-unggah]').forEach(x => { x.onchange = async () => {
    const f = x.files[0]; if (!f) return;
    tulis('m_bimb', '', `Mengunggah ${f.name}…`);
    try { await appsScript({ kind: 'mhs_bimbingan_unggah', t: TOKEN, id: +x.dataset.lampiranUnggah, filename: f.name, data: await keB64(f) });
      await segarkan('Lampiran terunggah.'); }
    catch (e) { tulis('m_bimb', 'buruk', e.message); }
  }; });
  document.querySelectorAll('[data-lampiran-buka]').forEach(b => { b.onclick = async () => {
    try { bukaIsi(await appsScript({ kind: 'mhs_bimbingan_buka', t: TOKEN, id: +b.dataset.lampiranBuka })); }
    catch (e) { tulis('m_bimb', 'buruk', e.message); }
  }; });
  document.querySelectorAll('[data-hapus-bimb]').forEach(b => { b.onclick = async () => {
    if (!confirm('Hapus catatan bimbingan ini?')) return;
    const { error } = await sb.rpc('mhs_bimbingan_hapus', { p_token: TOKEN, p_id: +b.dataset.hapusBimb });
    if (error) return tulis('m_bimb', 'buruk', error.message);
    await segarkan('Catatan dihapus.');
  }; });
}

// Pratinjau admin: pita di atas, hasil pemeriksaan tombol Kirim (bunyi pesan sama dengan yang dilihat mahasiswa), lalu
// semua tombol, isian, dan unggahan dikunci supaya admin tidak mengubah apa pun atas nama mahasiswa.
function kunciPratinjau(){
  const isi = $('isi');
  const periksa = PERIKSA.length ? PERIKSA.map(x => x.lolos
      ? `<li><b>${esc(x.label)}</b>: <span class="msg ok">akan berhasil</span> (semua isian dan berkas wajib sudah lengkap).</li>`
      : `<li><b>${esc(x.label)}</b>: akan ditolak. Mahasiswa melihat tulisan merah ini:<br><span class="msg buruk">${esc(x.pesan)}</span></li>`).join('')
    : `<li>Tidak ada tombol kirim pada keadaan ini (status: ${esc(labelStatus(P))}).</li>`;
  isi.insertAdjacentHTML('afterbegin', `<div class="kotak pratinjau" role="note">
    <b>Pratinjau admin: tampilan ${esc(P.nama)} (${esc(P.nim)})</b>
    <p class="ket" style="margin:4px 0">Hanya-baca: tombol dan isian dikunci, tautan pribadi mahasiswa tidak berubah. Berkas dibuka dari
      halaman <a href="pengajuan-mahasiswa.html">Pengajuan mahasiswa</a>.</p>
    <p style="margin:6px 0 2px"><b>Pemeriksaan tombol kirim</b></p><ul style="margin:0 0 4px 18px">${periksa}</ul></div>`);
  isi.querySelectorAll('button, input, select, textarea').forEach(x => { if (!x.closest('.pratinjau')) x.disabled = true; });
  isi.addEventListener('submit', e => e.preventDefault(), true);
  isi.addEventListener('click', e => { if (e.target.closest('button')) { e.preventDefault(); e.stopPropagation(); } }, true);
}

function htmlJalur(xs){
  return `<ol class="jalur" aria-label="Jalur proses">${xs.map(t => `<li class="${t.keadaan}">
      <span class="tanda">${{ selesai: 'selesai', kini: 'sekarang', nanti: 'berikutnya', kembali: 'perlu diperbaiki', tolak: 'ditolak', batal: 'dibatalkan' }[t.keadaan]}</span>
      <b>${esc(t.label)}</b>${t.waktu ? `<div class="meta ket">${esc(tglWaktu(t.waktu))}${t.oleh && t.oleh !== 'mahasiswa' ? ' · ' + esc(t.oleh) : ''}</div>` : ''}
      ${t.catatan ? `<div class="cat">${esc(t.catatan)}</div>` : ''}</li>`).join('')}</ol>`;
}

const bacaSelesai = () => { const v = id => ($(id)?.value || '').trim();
  return { tanggal_mulai: v('s_mulai'), tanggal_selesai: v('s_selesai'), pembimbing_lapangan: v('s_pl'), jabatan_lapangan: v('s_jab'),

const lbl = (xs, k) => (xs.find(t => t[0] === k) || [, ''])[1];
function ringkasLuaran(d){
  return [['Kategori', d.kategori === 'luaran' ? 'Luaran (HKI, produk, buku)' : 'Publikasi'], ['Judul', d.judul],
    ['Jenis', d.kategori === 'luaran' ? lbl(JENIS_LUARAN, d.jenis_luaran) : lbl(JENIS_PUB, d.jenis_pub)],
    ['Tingkat / indeksasi', [lbl(TINGKAT_PUB, d.tingkat), lbl(INDEKSASI, d.indeksasi)].filter(Boolean).join(' · ')],
    ['Terbitan', d.terbitan], ['Nomor', d.nomor], ['Status paten', d.status_hki], ['TKT', d.tkt],
    ['Tahun', [d.bulan, d.tahun].filter(Boolean).join('/')], ['DOI/URL', d.doi_url], ['Anggota lain', teksAnggota(d.anggota)],
    ['Bersama dosen prodi', d.bersama_dosen ? 'ya (dicatat lewat karya dosen)' : 'tidak (mandiri)']];
}

function halamanSaya(){
  const p = P, J = JENIS[p.jenis], d = p.data || {}, ds = p.data_selesai || {};
  const ubah = p.boleh_ubah ?? bolehUbah(p.status);                         // sebelum patch 91: status saja
  const ubahPengajuan = (p.tahap || 'pengajuan') === 'pengajuan' && bolehUbah(p.status);
  const jendelaSelesai = !!p.jendela_selesai, adaSelesai = p.jenis === 'kp' && (jendelaSelesai || p.tahap === 'selesai');
  const jenisUnggah = ubahPengajuan ? J.berkas : BERKAS_SELESAI;
  // Lapor selesai KP (106): langsung ke laporan selesai. Nilai lama 'berjalan' = pengajuan KP biasa (107).
  const sus = p.jenis === 'kp' && d.susulan === 'selesai' ? 'selesai' : '';
  const wajibAwal = sus === 'selesai' || penetapanTA(p) ? null : J.wajib;   // pengajuan pembimbing TA (110): naskah tidak wajib
  // Jawaban instansi atas surat pengantar (107): diterima (surat balasan + tanggal mulai) atau ditolak (pengajuan ditutup).
  const tahapAju = p.jenis === 'kp' && (p.tahap || 'pengajuan') === 'pengajuan';
  const bisaJawab = tahapAju && p.status === 'disetujui' && !d.jawaban_instansi;
  const ditolakInstansi = tahapAju && p.status === 'ditolak' && d.jawaban_instansi === 'ditolak';
  // Pelaporan selesai KP dibuka setelah diterima instansi (pengajuan lama sebelum 107: laporkan diterima dulu).
  const bukaSelesai = jendelaSelesai && (sus === 'selesai' || p.tahap === 'selesai' || d.jawaban_instansi === 'diterima');
  // Sebelum jawaban instansi: surat balasan (atau lainnya); berkas laporan selesai menyusul setelah diterima.
  const unggahan = !ubahPengajuan ? (bisaJawab ? ['surat_balasan', 'lainnya'] : jenisUnggah)
    : sus === 'selesai' ? BERKAS_SELESAI : jenisUnggah;
  const baru = `pengajuan.html?jenis=kp&nim=${encodeURIComponent(p.nim)}${p.pembimbing_id ? '&pembimbing=' + encodeURIComponent(p.pembimbing_id) : ''}`;
  // Berkas bertanda "[ditolak …]" (106) adalah catatan surat ke instansi yang menolak: tidak bisa dibuang mahasiswa.
  const bisaBuang = b => ubah && b.oleh !== 'prodi' && !(p.status === 'disetujui' && b.jenis === 'surat_permohonan')
    && !String(b.nama || '').startsWith('[ditolak ');
  const ringkas = p.jenis === 'luaran' ? ringkasLuaran(d)
    : p.jenis === 'ta'
    ? penetapanTA(p)
      ? [['Tahap', 'Pengajuan pembimbing TA'], ['Kelompok keahlian', KK.find(k => k.kode === d.kk_ta)?.nama || d.kk_ta], ['Judul awal', d.judul],
         [p.status === 'disetujui' ? 'Pembimbing (ditetapkan)' : 'Pembimbing', [p.pembimbing, p.pembimbing_2].filter(Boolean).join(', ')],
         ['Kurikulum', d.kurikulum_ta],
         ...(d.kurikulum_ta === 'K26' ? [['MK pilihan sesuai bidang', (d.mk_pilihan_ta || []).map(k => MKP.find(m => m.kode === k)?.nama || k).join('; ')],
           ['Pemeriksaan koordinator TA', teksCekMK(d.mk_pilihan_cek)]] : [])]
      : [['Tahap', (TAHAP_TA.find(t => t[0] === d.tahap_ta) || [, ''])[1]], ['Judul', d.judul],
         ['Pembimbing', [p.pembimbing, p.pembimbing_2].filter(Boolean).join(', ')], ['Nama di jadwal publik', d.tampil_nama ? 'boleh ditampilkan' : 'tidak'],
         ...(d.tahap_ta === 'sidang_akhir' ? [['Cek kemiripan', teksKemiripan(d, BATAS)]] : []),   // 185
         ...(d.tahap_ta === 'seminar_proposal' && d.metopen ? [['Metodologi Penelitian', 'bagian dari MK Metopen semester ini']] : [])]
    : p.jenis === 'yudisium' ? [['Judul Tugas Akhir', d.judul], ['Catatan untuk admin', d.catatan]]
    : p.jenis === 'kabar' ? [['Judul', d.judul], ['Tanggal', d.tanggal], ['Jenis kegiatan', lbl(JENIS_KEGIATAN, d.jenis_kegiatan)],
       ['Tempat', d.tempat], ['Ringkasan', d.ringkasan], ['Tautan', d.tautan], ['Dosen pendamping', p.pembimbing]]
    : p.jenis === 'surat'
    ? [['Jenis surat', judulPengajuan(p)], ['Keperluan', d.keperluan], ['Tujuan', [d.tujuan_surat, d.alamat_tujuan].filter(Boolean).join(', ')],
       ['Judul penelitian', d.judul_penelitian], ['Lokasi', d.lokasi], ['Waktu', d.waktu_pelaksanaan]]
    : p.jenis === 'kp'
    ? [['Program', labelProgram(d.program)], ['Instansi', d.instansi], ['Alamat', d.alamat_instansi], ['Bidang/divisi', d.bidang_kerja],
       ['Kontak', d.kontak_instansi],
       ['Rencana', [d.rencana_mulai, d.rencana_selesai].filter(Boolean).join(' s.d. ')],
       ['Jawaban instansi', d.jawaban_instansi === 'diterima' ? `diterima${d.tanggal_mulai ? ', mulai KP ' + d.tanggal_mulai : ''}`
         : d.jawaban_instansi === 'ditolak' ? `ditolak${d.alasan_instansi ? ': ' + d.alasan_instansi : ''}` : ''],
       ['Dilaporkan', sus === 'selesai' ? 'setelah KP selesai' : '']]
    : [['Kegiatan', d.nama_kegiatan], ['Penyelenggara', d.penyelenggara], ['Tanggal', d.tanggal],
       ['Tingkat', (TINGKAT.find(t => t[0] === d.tingkat) || [, ''])[1]], ['Bidang', (BIDANG.find(t => t[0] === d.bidang) || [, ''])[1]],
       ['Capaian', d.capaian], ['Anggota lain', teksAnggota(d.anggota)], ['Nama di situs', d.tampil_nama ? 'boleh ditampilkan' : 'tidak']];
  const ringkasSelesai = [['Tanggal', [ds.tanggal_mulai, ds.tanggal_selesai].filter(Boolean).join(' s.d. ')], ['Pembimbing lapangan',
    [ds.pembimbing_lapangan, ds.jabatan_lapangan].filter(Boolean).join(', ')], ['Kontak', ds.kontak_lapangan], ['Bagian/proyek', ds.divisi],
    ['Ringkasan', ds.ringkasan]];
  const pengantar = p.berkas.filter(b => b.jenis === 'surat_pengantar' || b.jenis === 'surat_jadi');
  const tahapTA = new Map((KEM?.pengajuan || []).map(x => [x.id, x.tahap_ta]));   // 182: pengajuan pembimbing vs seminar
  const semua = [{ id: p.id, jenis: p.jenis, status: p.status, tahap: p.tahap, judul: judulPengajuan(p), data: p.data, ini: true },
    ...(p.lain || []).map(x => ({ ...x, data: { tahap_ta: tahapTA.get(x.id) } }))];
  $('isi').innerHTML = `
    <p class="ket">Halaman ini terbuka dengan tautan pribadi dari email kampus Anda. Jangan bagikan alamatnya.</p>
    <h2>${esc(J.label)}${p.jenis === 'yudisium' ? (d.judul ? ': ' + esc(d.judul) : '') : ': ' + esc(judulPengajuan(p))}</h2>
    <div>Status: <span class="status">${esc(labelStatus(p))}</span> · ${esc(p.nama)} (${esc(p.nim)})
      ${J.tanpaPembimbing ? '' : (p.jenis === 'kabar' ? '· dosen pendamping ' : '· pembimbing ') + esc([p.pembimbing, p.pembimbing_2].filter(Boolean).join(', ') || '—')}</div>
    ${TOKEN ? '<div id="nilaiLayanan"></div>' : ''}
    ${p.jenis === 'ta' && KEM ? htmlKemajuan() : ''}
    ${sus === 'selesai' ? '<p class="ket">KP dilaporkan setelah selesai: tahap pengajuan dan surat pengantar dilewati.</p>'
      : `${p.jenis === 'kp' ? '<h3 class="sub-h">Pengajuan KP</h3>' : p.jenis === 'ta' && KEM ? '<h3 class="sub-h">Proses pendaftaran ini</h3>' : ''}${htmlJalur(jalurTahap(p, 'pengajuan'))}`}
    ${adaSelesai && (bukaSelesai || p.tahap === 'selesai') ? `<h3 class="sub-h">Pelaporan selesai KP</h3>${htmlJalur(jalurTahap(p, 'selesai'))}` : ''}
    ${p.jenis === 'ta' && !penetapanTA(p) && p.penetapan_ta ? `<div class="kotak"><b>Pembimbing TA Anda (ditetapkan koordinator TA):</b>
      ${esc([p.penetapan_ta.pembimbing, p.penetapan_ta.pembimbing_2].filter(Boolean).join(', '))}.
      <span class="ket">Seminar/sidang ini memakai pembimbing tersebut.</span></div>` : ''}
    ${p.jadwal ? `<div class="kotak jadwal-kotak"><b>Jadwal ${esc((TAHAP_TA.find(t => t[0] === d.tahap_ta) || [, 'seminar/sidang'])[1].toLowerCase())}
      Anda${p.jadwal.status === 'ditunda' ? ' (DITUNDA)' : p.jadwal.status === 'batal' ? ' (DIBATALKAN)' : ''}</b>
      <dl class="ringkas">${[['Tanggal', p.jadwal.tanggal ? new Date(p.jadwal.tanggal + 'T00:00').toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }) : ''],
        ['Jam', p.jadwal.jam], ['Ruang', p.jadwal.ruang], ['Tautan daring', p.jadwal.tautan_daring],
        ['Penguji', [...(p.jadwal.penguji || []), p.jadwal.penguji_luar].filter(Boolean).join(', ')]]
        .filter(([, v]) => v).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>
      ${p.jadwal.hasil ? `<p><b>Hasil: ${esc({ lulus: 'Lulus', lulus_revisi: 'Lulus dengan revisi', mengulang: 'Mengulang' }[p.jadwal.hasil] || p.jadwal.hasil)}</b>${
        p.jadwal.hasil === 'lulus_revisi' ? (p.jadwal.revisi_selesai ? ` · revisi selesai ${esc(tglIndo(p.jadwal.revisi_selesai))}`
          : ` · batas revisi ${esc(p.jadwal.batas_revisi ? tglIndo(p.jadwal.batas_revisi) : '(belum ditetapkan)')}`) : ''}</p>
        ${p.jadwal.catatan_revisi && !p.jadwal.revisi_selesai ? `<p class="ket" style="white-space:pre-line">Catatan revisi: ${esc(p.jadwal.catatan_revisi)}</p>` : ''}`
      : '<p class="ket">Langkah berikutnya: input jadwal ini ke SIUP sesuai ketentuan universitas.</p>'}</div>` : ''}
    ${pengantar.length ? `<div class="kotak"><b>${p.jenis === 'surat' ? 'Surat dari prodi sudah terbit.' : 'Surat pengantar dari prodi sudah tersedia.'}</b>
      ${pengantar.map(b => `<button class="b" data-buka="${b.id}" style="margin-left:8px">Buka ${esc(b.nama || 'surat')}</button>`).join('')}</div>` : ''}
    ${bisaJawab ? `<div class="kotak" id="kJawab"><b>Laporkan jawaban instansi atas surat pengantar</b>
      <p class="ket" style="margin-top:4px">Setelah surat pengantar Anda kirim ke ${esc(d.instansi || 'instansi')}, laporkan jawabannya di sini.</p>
      <div class="dua">
        <div><b>Diterima</b><p class="ket" style="margin:2px 0 6px">Unggah <b>surat balasan instansi</b> di bagian Berkas, isi tanggal mulai KP.</p>
          <div class="fld"><label for="j_mulai">Tanggal mulai KP</label><input id="j_mulai" type="date"></div>
          <button class="b utama" id="b_terima">Laporkan diterima</button><span class="msg" id="m_terima" role="status"></span></div>
        <div><b>Ditolak</b><p class="ket" style="margin:2px 0 6px">Pengajuan ini <b>ditutup</b>; lalu buat pengajuan baru untuk instansi lain
          (diperiksa lagi oleh koordinator KP).</p>
          <div class="fld"><label for="t_alasan">Alasan dari instansi <span>(mis. kuota penuh)</span></label>
            <textarea id="t_alasan" maxlength="300" style="min-height:60px"></textarea></div>
          <button class="b" id="b_tolak">Laporkan ditolak</button><span class="msg" id="m_tolak" role="status"></span></div>
      </div></div>` : ''}
    ${ditolakInstansi ? `<div class="kotak"><b>Pengajuan ini ditutup karena ditolak instansi.</b> Buat pengajuan KP baru untuk instansi lain;
      NIM dan usulan pembimbing sudah terisi. <p><a class="b utama" href="${esc(baru)}">Buat pengajuan baru</a></p></div>` : ''}
    ${jendelaSelesai && !bukaSelesai ? `<p class="ket">Pelaporan selesai KP terbuka setelah Anda melaporkan <b>diterima instansi</b>.</p>` : ''}
    ${bukaSelesai ? `<div class="kotak"><b>Pelaporan selesai KP.</b> Setelah KP selesai, isi laporan selesai di bawah, unggah <b>laporan KP</b> dan
      <b>surat keterangan selesai</b> (wajib), serta logbook dan foto bila ada, lalu tekan <b>Kirim laporan selesai</b>.
      Diperiksa dosen pembimbing, lalu koordinator KP atau admin prodi.</div>` : ''}
    ${p.jenis === 'yudisium' ? htmlYudisium(p, ubah, bisaBuang)
      : berkasTA(p) ? htmlYudisium(p, ubah, bisaBuang, { daftar: berkasTA(p), judul: `Berkas ${NAMA_TAHAP_BERKAS[d.tahap_ta]}`, tautan: false,
          ket: 'Tiap butir boleh lebih dari satu berkas; maks. 20 berkas. Berkas lain di luar daftar masuk <b>Lainnya</b>.' })
      : `<h2>Berkas</h2>
    <p class="ket">${ubahPengajuan && wajibAwal ? `Wajib sebelum dikirim: <b>${esc(LABEL_BERKAS[wajibAwal])}</b>${p.jenis === 'kp'
      ? ' (atau <b>surat balasan instansi</b> bila Anda sudah diterima)' : ''}. ` : ''}${p.jenis === 'kabar'
      ? 'Unggah 1–6 foto kegiatan (JPG/PNG); paling banyak 6 foto pertama yang tampil di situs. Jangan unggah foto yang memperlihatkan wajah orang yang tidak setuju dipublikasikan. ' : ''}${p.jenis === 'surat' ? 'Lampiran pendukung (mis. proposal) boleh diunggah, tidak wajib. ' : ''}${bukaSelesai
      ? 'Wajib untuk laporan selesai: <b>Laporan KP</b> dan <b>Surat keterangan selesai</b>. ' : ''}Boleh lebih dari satu berkas per jenis; maks. 20 berkas.</p>
    <ul class="daftar">${p.berkas.map(b => `<li class="${b.oleh === 'prodi' ? 'prodi-berkas' : ''}"><div class="isi">${esc(LABEL_BERKAS[b.jenis] || b.jenis)}
      <div class="meta">${esc(b.nama)} · ${esc(tglWaktu(b.dibuat))}${b.oleh === 'prodi' ? ' · dari prodi' : ''}</div></div>
      <button class="b" data-buka="${b.id}">Buka</button>${bisaBuang(b) ? `<button class="b" data-buang="${b.id}" aria-label="Buang berkas">×</button>` : ''}</li>`).join('')
      || '<li><span class="kosong">Belum ada berkas.</span></li>'}</ul>
    ${ubah ? `<div class="unggah"><select id="u_jenis" aria-label="Jenis berkas">${unggahan.map(k => `<option value="${k}">${esc(LABEL_BERKAS[k])}</option>`).join('')}</select>
      <input type="file" id="u_berkas" multiple accept=".pdf,.jpg,.jpeg,.png">

async function gambarNilai(){

  try { const res = await sb.rpc('mhs_nilai_lihat', { p_token: TOKEN }); if (res.error) return; r = res.data; } catch (e) { return; }
  if (!r || (!r.boleh && !r.skor)) return;
  const LBL = ['', 'Sangat kurang', 'Kurang', 'Cukup', 'Baik', 'Sangat baik'];
  box.innerHTML = `<div class="kotak nilai-layanan"><b>Nilai layanan ini</b>
    <p class="ket">Bagaimana pelayanan program studi untuk pengajuan ini? Nilai Anda dibaca pengelola prodi untuk perbaikan layanan

    <div class="bintang" role="radiogroup" aria-label="Nilai 1 sampai 5">${[1, 2, 3, 4, 5].map(n =>
      `<label><input type="radio" name="nl_skor" value="${n}"${r.skor === n ? ' checked' : ''}${r.boleh ? '' : ' disabled'}><span>${n}<small>${LBL[n]}</small></span></label>`).join('')}</div>
    <textarea id="nl_kom" maxlength="1000" placeholder="Komentar (opsional): apa yang sudah baik, apa yang perlu diperbaiki"${r.boleh ? '' : ' disabled'}>${esc(r.komentar || '')}</textarea>
    ${r.boleh ? '<button type="button" class="b" id="nl_simpan">Simpan nilai</button>' : ''} <span class="msg" id="nl_m" role="status">${r.skor ? 'Terima kasih, nilai Anda sudah tersimpan.' : ''}</span></div>`;
  const b = $('nl_simpan');
  if (b) b.onclick = async () => {
    const skor = +(document.querySelector('input[name="nl_skor"]:checked')?.value || 0);
    if (!skor) return tulis('nl_m', 'err', 'Pilih nilai 1 sampai 5.');
    b.disabled = true;
    const { error } = await sb.rpc('mhs_nilai', { p_token: TOKEN, p_skor: skor, p_komentar: $('nl_kom').value.trim() || null });
    b.disabled = false;
    tulis('nl_m', error ? 'err' : 'ok', error ? 'Gagal: ' + error.message : 'Terima kasih, nilai Anda tersimpan.');
  };
}

// Berkas yudisium (122): daftar kelengkapan per butir; tiap butir boleh lebih dari satu berkas; berkas yang melebihi
// batas unggah boleh berupa tautan Google Drive (dibuka langsung, dibuang = barisnya saja).
// 174: dipakai juga untuk berkas seminar/sidang TA per tahap (o = { daftar, judul, ket, tautan: false }).
function htmlYudisium(p, ubah, bisaBuang, o = {}){
  const daftar = o.daftar || YUD, tautan = o.tautan !== false;
  const k = kelengkapanYudisium(daftar, p.berkas), kurang1 = k.butir.find(b => b.wajib && !b.berkas.length)?.kode;
  const pilihan = id => `<select id="${id}" aria-label="Jenis berkas">${k.butir.map(b => `<option value="${esc(b.kode)}"${b.kode === kurang1 ? ' selected' : ''}>${
    b.berkas.length ? '✓ ' : ''}${esc(b.label)}${b.wajib ? '' : ' (opsional)'}</option>`).join('')}</select>`;
  const berkas = f => `<div class="meta">${f.tautan ? 'Tautan: ' : ''}${esc(f.nama)} · ${esc(tglWaktu(f.dibuat))}
    ${f.tautan && f.url ? `<a href="${esc(f.url)}" target="_blank" rel="noopener">Buka tautan</a>` : `<button class="b kecil" data-buka="${f.id}">Buka</button>`}${
    bisaBuang(f) ? `<button class="b kecil" data-buang="${f.id}" aria-label="Buang berkas">×</button>` : ''}</div>`;
  return `<h2>${esc(o.judul || 'Berkas yudisium')}</h2>
    <p class="ket">Berkas wajib: <b>${k.ada} dari ${k.wajib}</b> sudah ada${k.kurang.length ? '' : ' (lengkap)'}. ${o.ket || `Tiap butir boleh lebih dari satu berkas;
      maks. 40 berkas. Berkas lain di luar daftar masuk <b>Bukti tambahan</b>.`}</p>
    <ul class="daftar yud">${k.butir.map(b => `<li class="${b.berkas.length ? 'ada' : b.wajib ? 'kurang' : ''}"><div class="isi">
      <span class="tanda-yud">${b.berkas.length ? '✓ ada' : b.wajib ? 'belum' : 'opsional'}</span> ${esc(b.label)}
      ${b.keterangan ? `<div class="meta">${esc(b.keterangan)}</div>` : ''}${b.berkas.map(berkas).join('')}</div></li>`).join('')}</ul>
    ${ubah ? `<div class="unggah">${pilihan('u_jenis')}
      <input type="file" id="u_berkas" multiple accept=".pdf,.jpg,.jpeg,.png">
      <button class="b" id="b_unggah">Unggah</button><span class="msg" id="m_berkas" role="status"></span></div>
      <p class="ket">PDF, JPG, atau PNG (berkas Word/Excel disimpan sebagai PDF dulu).</p>
      ${tautan ? `<details class="tautan-yud"><summary>Berkas terlalu besar untuk diunggah? Tempel tautan Google Drive</summary>
        <div class="unggah">${pilihan('t_jenis')}
          <input id="t_url" type="url" maxlength="500" placeholder="https://drive.google.com/…" aria-label="Tautan Google Drive">
          <input id="t_nama" maxlength="200" placeholder="Nama berkas, mis. Bebas plagiasi.pdf" aria-label="Nama berkas">
          <button class="b" id="b_tautan">Simpan tautan</button><span class="msg" id="m_tautan" role="status"></span></div>
        <p class="ket">Simpan berkasnya di Google Drive kampus, lalu bagikan supaya admin prodi bisa membukanya
          (Bagikan › Siapa saja yang memiliki link › Pelihat). Berkas di Drive Anda tidak diubah atau dihapus oleh situs.</p></details>` : ''}`
      : '<span class="msg" id="m_berkas" role="status"></span>'}`;
}
async function tempelTautan(){
  const url = $('t_url').value.trim();
  if (!/^https:\/\/(drive|docs)\.google\.com\/\S+$/.test(url)) return tulis('m_tautan', 'buruk', 'Tempelkan tautan Google Drive (diawali https://drive.google.com/).');
  $('b_tautan').disabled = true;
  try {
    const { error } = await sb.rpc('mhs_tautan_berkas', { p_token: TOKEN, p_jenis: $('t_jenis').value, p_nama: $('t_nama').value.trim(), p_url: url });
    if (error) throw new Error(error.message);
    await simpanDiam(); await muat(); halamanSaya(); tulis('m_berkas', 'ok', 'Tautan tersimpan.');
  } catch (e) { tulis('m_tautan', 'buruk', e.message); $('b_tautan').disabled = false; }
}

async function buka(id, tombol){
  tombol.disabled = true;

}
async function buang(id, tombol){

}
async function unggah(){
  const fs = [...$('u_berkas').files], jenis = $('u_jenis').value;
  if (!fs.length) return tulis('m_berkas', 'buruk', 'Pilih berkas dulu.');
  $('b_unggah').disabled = true;
  try {
    for (let i = 0; i < fs.length; i++) {
      tulis('m_berkas', '', `Mengunggah ${i + 1}/${fs.length}: ${fs[i].name}…`);
      await appsScript({ kind: 'mhs_unggah', t: TOKEN, jenis_berkas: jenis, filename: fs[i].name, data: await keB64(fs[i]) });
    }
    await simpanDiam(); await muat(); halamanSaya(); tulis('m_berkas', 'ok', 'Berkas terunggah.');
  } catch (e) {
    // 122: berkas yudisium yang melebihi batas unggah boleh berupa tautan Google Drive.
    const saran = P.jenis === 'yudisium' && /lebih dari|terlalu besar|too large/i.test(e.message)
      ? ' Pakai "Tempel tautan Google Drive" di bawah untuk berkas ini.' : '';
    tulis('m_berkas', 'buruk', e.message + saran); $('b_unggah').disabled = false;
    if (saran) document.querySelector('.tautan-yud')?.setAttribute('open', '');
  }
}
async function simpan(){
  const x = bacaIsian(P.jenis), g = periksaIsian(P.jenis, x);
  if (g.length) { tulis('m_simpan', 'buruk', g.join(' ')); return false; }
  const { error } = await sb.rpc('mhs_ubah', { p_token: TOKEN, p_nama: x.nama, p_pembimbing: x.pembimbing, p_data: x.data });
  if (error) { tulis('m_simpan', 'buruk', error.message); return false; }
  tulis('m_simpan', 'ok', 'Tersimpan.');
  // 174: tahap TA berubah -> daftar berkas wajibnya ikut berubah.
  if (P.jenis === 'ta' && (x.data?.tahap_ta || '') !== (P.data?.tahap_ta || '')) { await muat(); halamanSaya(); tulis('m_simpan', 'ok', 'Tersimpan; daftar berkas mengikuti tahap baru.'); }
  return true;
}
async function kirim(){
  $('b_kirim').disabled = true;

    if (berkasTA(P)) { const k = kelengkapanYudisium(berkasTA(P), P.berkas);   // 174: pesan sama dengan ta_periksa_berkas
      if (k.kurang.length) throw new Error(`Berkas wajib ${NAMA_TAHAP_BERKAS[P.data.tahap_ta]} belum lengkap: ${k.kurang.join(', ')}.`); }
    const { error } = await sb.rpc('mhs_kirim', { p_token: TOKEN });
    if (error) throw new Error(error.message);
    await muat(); halamanSaya();
  } catch (e) { tulis('m_kirim', 'buruk', e.message); $('b_kirim').disabled = false; }
}

    if (error) throw new Error(/mhs_batal/.test(error.message) ? 'Pembatalan belum dibuka admin prodi.' : error.message);

// Contoh tautan pribadi: penggambar asli (halamanSaya) + data fiktif; semua isian dan tombol nonaktif, kecuali tautan.
function halamanContoh(){
  P = contohPengajuan(CONTOH);
  halamanSaya();
  const kini = CONTOH_PENGAJUAN.find(([k]) => k === CONTOH) || CONTOH_PENGAJUAN[0];
  document.querySelectorAll('#isi button, #isi input, #isi select, #isi textarea').forEach(x => { x.disabled = true; });
  document.querySelectorAll('#isi form').forEach(f => { f.onsubmit = e => e.preventDefault(); });
  const pita = document.createElement('div');
  pita.className = 'contoh-pita'; pita.setAttribute('role', 'note');
  pita.innerHTML = `<b>CONTOH, data fiktif.</b> Begini halaman yang terbuka dari tautan di email kampus Anda; tombol di contoh ini tidak berfungsi.
    <nav aria-label="Pilih contoh">${CONTOH_PENGAJUAN.map(([k, l]) => k === kini[0] ? `<b>${esc(l)}</b>`
      : `<a href="pengajuan.html?contoh=${k}">${esc(l)}</a>`).join(' · ')}</nav>
    <div class="ket">${esc(kini[2])}</div>
    <a class="b utama" href="pengajuan.html">Kembali: buat pengajuan</a>`;

}

async function mulai(){
  const D = await fetch('data.json', {cache: 'no-cache'}).then(r => r.ok ? r.json() : {}).catch(() => ({}));
  if (D.prodi) document.title = document.title.split(' — ')[0] + ' — ' + ['Program Studi ' + D.prodi, D.institusi].filter(Boolean).join(' ');
  $('hProdi').textContent = [D.prodi, D.institusi].filter(Boolean).join(' · '); SARAN = saranInstansi(D); isiSaran();
  KK = D.situs?.kelompok_keahlian || [];
  MKP = mkPilihanK26(D);   // 196
  // Pilihan pembimbing TA menurut KK (110); tanpa patch 110: tahap Pengajuan pembimbing tidak ditawarkan.
  const ta = await sb.rpc('pembimbing_pilihan_ta');
  DOSEN_TA = ta.error ? null : (ta.data || []);
  const yd = await sb.rpc('yudisium_berkas_daftar');
  if (!yd.error && Array.isArray(yd.data) && yd.data.length) YUD = yd.data;
  const tb = await sb.rpc('ta_berkas_daftar');
  if (!tb.error && Array.isArray(tb.data) && tb.data.length) TAB = tb.data;
  const bk = await sb.rpc('ta_kemiripan_batas');
  if (!bk.error && bk.data != null) BATAS = Number(bk.data);
  if (CONTOH) return halamanContoh();
  if (!window.UPLOAD_URL) throw new Error('Layanan unggah belum disiapkan admin.');
  const { data, error } = await sb.rpc('pembimbing_pilihan');
  if (error) throw new Error(/pembimbing_pilihan/.test(error.message) ? 'Layanan pengajuan belum dibuka admin prodi.' : error.message);
  DOSEN = data || [];
  if (ALT) return konfirmasiAlt();
  if (!TOKEN && !PRATINJAU) return LAPOR ? halamanLapor() : halamanBaru();
  await muat();
  halamanSaya();
  if (PRATINJAU) kunciPratinjau();
}
mulai().catch(e => { $('isi').innerHTML = `<p class="kosong">${esc(e.message)}</p>
  ${TOKEN ? '<p><a href="pengajuan.html">Minta tautan baru</a></p>' : ''}`; });
</script>
