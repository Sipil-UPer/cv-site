  .ket, .kosong{color:var(--muted)} .ket{font-size:13.5px}
  .kotak{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-top:10px}
  .pilih{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
  .pilih label{flex:1 1 220px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;display:flex;gap:8px;align-items:flex-start}
  .pilih label:has(input:checked){border-color:var(--biru);box-shadow:0 0 0 1px var(--biru)}
  .pilih small{display:block;color:var(--muted);font-size:12.5px}
  .fld{margin:10px 0}
  .fld>label{display:block;font-size:13.5px;font-weight:600;margin-bottom:4px}

  .fld input:not([type=checkbox]), .fld textarea, .fld select{width:100%;font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink)}
  .fld textarea{min-height:80px;resize:vertical}
  .fld small{display:block;color:var(--muted);font-size:12.5px;margin-top:3px}
  .cek{display:flex;gap:8px;align-items:flex-start;font-size:14px}
  .dua{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
  @media (max-width:560px){.dua{grid-template-columns:1fr}}
  .jebakan{position:absolute;left:-10000px;width:1px;height:1px;overflow:hidden}
  button.b{font:inherit;font-weight:600;font-size:14px;border-radius:7px;padding:9px 18px;cursor:pointer;border:1px solid var(--biru);background:var(--panel);color:var(--biru)}
  button.utama{background:var(--biru);color:#fff}
  button.b:disabled{opacity:.6;cursor:default}
  button.b:focus-visible{outline:2px solid var(--biru);outline-offset:2px}
  .msg{font-size:14px;margin-left:8px} .msg.buruk{color:var(--merah)} .msg.ok{color:var(--hijau)}
  /* Jalur proses */
  .jalur{list-style:none;margin:8px 0 0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  @media (max-width:640px){.jalur{grid-template-columns:1fr}}
  .jalur li{border:1px solid var(--line);border-top:4px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--panel);font-size:13.5px}
  .jalur li b{display:block;font-size:14px}
  .jalur li.selesai{border-top-color:var(--hijau)} .jalur li.kini{border-top-color:var(--biru);box-shadow:0 0 0 1px var(--biru)}
  .jalur li.kembali{border-top-color:var(--emas)} .jalur li.tolak{border-top-color:var(--merah)}
  .jalur .tanda{font-family:var(--mono);font-size:11px;text-transform:uppercase;color:var(--muted)}
  .jalur .cat{margin-top:4px;white-space:pre-line;color:var(--ink)}
  .status{font-weight:600}
  h3.sub-h{font-size:14px;font-weight:600;color:var(--muted);margin:14px 0 0;text-transform:uppercase;letter-spacing:.04em}
  .daftar{list-style:none;margin:6px 0 0;padding:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
  .daftar li{display:flex;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line-soft);font-size:14px}
  .daftar li:last-child{border-bottom:0}
  .daftar .isi{flex:1;min-width:0;overflow-wrap:anywhere}

  .unggah{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
  .unggah select{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink)}
  .ringkas{display:grid;grid-template-columns:max-content 1fr;gap:3px 14px;font-size:14px}

  .ringkas dt{color:var(--muted)} .ringkas dd{margin:0;overflow-wrap:anywhere;white-space:pre-line}
  footer{margin-top:32px;font-size:13px;color:var(--muted)} footer a{color:var(--muted)}
</style>

<script>
// Galat saat memuat skrip ditampilkan sebagai pesan, bukan halaman kosong.
addEventListener('error', function (e) {
  if (document.getElementById('galat-muat')) return;
  var d = document.createElement('div');
  d.id = 'galat-muat';
  d.style.cssText = 'margin:16px;padding:12px 14px;border:1px solid var(--merah);' +
    'background:var(--merah-m3);color:var(--ink);font:14px/1.5 system-ui,sans-serif';
  d.textContent = 'Halaman gagal dimuat: ' + (e.message || 'galat skrip') +
    '. Tekan Ctrl+Shift+R untuk memuat ulang tanpa cache; bila tetap muncul, kirim pesan ini ke admin.';
  document.body.insertBefore(d, document.body.firstChild);
});
</script>
<script type="module">
// Mahasiswa tidak login (pemilik 2026-11-17). Tanpa token: formulir baru dan minta tautan lagi; Apps Script
// membuat pengajuan dan mengirim tautan pribadi ke <NIM>@<domain kampus>. Dengan #t=<token> (dari email):
// jalur proses, berkas, perbaikan isian, dan Kirim untuk diperiksa (fungsi mhs_* di patch 90).
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/+esm';
import { JENIS, LABEL_BERKAS, LABEL_STATUS, TINGKAT, BIDANG, jalur, bolehUbah, bacaAnggota, teksAnggota,
         periksaIsian, judulPengajuan, keB64, bukaIsi, appsScript, labelStatus, jalurTahap, BERKAS_SELESAI, PROGRAM_KP, labelProgram,
         periksaSelesai, JENIS_SURAT, TAHAP_TA, JENIS_PUB, TINGKAT_PUB, INDEKSASI, JENIS_LUARAN } from './pengajuan-mhs.js?v=2026-11-18-e8ee03';
import { saranInstansi } from './rekap-kp.js?v=2026-11-18-e8ee03';

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = id => document.getElementById(id);
const sb = createClient(window.SB_URL, window.SB_KEY, { auth: { persistSession: false } });
const tglWaktu = s => s ? new Date(s).toLocaleString('id-ID', { day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
const opsi = (xs, v) => xs.map(([k, l]) => `<option value="${k}"${k === v ? ' selected' : ''}>${esc(l)}</option>`).join('');
const TOKEN = (new URLSearchParams(location.hash.slice(1)).get('t') || '').trim();
// Konfirmasi email alternatif (104): tautan #alt=<token> dari email kampus.
const ALT = (new URLSearchParams(location.hash.slice(1)).get('alt') || '').trim();
// Ruang KP (105): ?jenis=kp memilih jenis; usulan nama instansi dari data.json (mitra kerja sama + tempat KP).
const JENIS_AWAL = (new URLSearchParams(location.search).get('jenis') || '').trim();
let SARAN = [];
function isiSaran(){
  const dl = $('daftar_instansi');
  if (dl) dl.innerHTML = SARAN.map(n => `<option value="${esc(n)}">`).join('');
}
let DOSEN = [], P = null;

function tulis(id, kelas, teks){ const m = $(id); m.className = 'msg ' + kelas; m.textContent = teks; }

// Isian per jenis (dipakai formulir baru dan perbaikan).
function htmlIsian(jenis, d = {}, nama = '', pembimbing = ''){
  const pb = `<div class="fld"><label for="f_pb">Dosen pembimbing ${jenis === 'kp' ? 'KP' : jenis === 'ta' ? 'TA' : 'lomba'}</label>
    <select id="f_pb"><option value="">(pilih)</option>${DOSEN.map(x => `<option value="${x.id}"${x.id === pembimbing ? ' selected' : ''}>${esc(x.nama)}</option>`).join('')}</select>
    <small>Dosen ini memeriksa pengajuan Anda lebih dulu, lalu admin prodi.</small></div>`;
  const nm = `<div class="fld"><label for="f_nama">Nama lengkap</label><input id="f_nama" maxlength="120" autocomplete="name" value="${esc(nama)}"></div>`;
  if (jenis === 'luaran') return `${nm}${pb.replace('Dosen pembimbing lomba', 'Dosen pemeriksa (pembimbing/dosen terkait)')}
    <div class="pilih" role="radiogroup" aria-label="Kategori">
      <label><input type="radio" name="f_kat" value="publikasi"${d.kategori !== 'luaran' ? ' checked' : ''}><span>Publikasi<small>jurnal, prosiding, buku</small></span></label>
      <label><input type="radio" name="f_kat" value="luaran"${d.kategori === 'luaran' ? ' checked' : ''}><span>Luaran<small>paten, hak cipta, desain industri,
        merek, TTG, produk, buku ber-ISBN, book chapter</small></span></label></div>
    <div class="fld"><label for="f_judul">Judul</label><textarea id="f_judul" maxlength="400" style="min-height:60px">${esc(d.judul)}</textarea></div>
    <div class="dua">
      <div class="fld" data-kat="publikasi"><label for="f_jp">Jenis publikasi</label><select id="f_jp"><option value="">(pilih)</option>${opsi(JENIS_PUB, d.jenis_pub)}</select></div>
      <div class="fld" data-kat="luaran"><label for="f_jl">Jenis luaran</label><select id="f_jl"><option value="">(pilih)</option>${opsi(JENIS_LUARAN, d.jenis_luaran)}</select></div>
      <div class="fld"><label for="f_th">Tahun terbit/terdaftar</label><input id="f_th" inputmode="numeric" maxlength="4" value="${esc(d.tahun)}"></div>
      <div class="fld"><label for="f_bl">Bulan <span>(1–12, dianjurkan)</span></label><input id="f_bl" inputmode="numeric" maxlength="2" value="${esc(d.bulan)}"></div>
      <div class="fld" data-kat="publikasi"><label for="f_tk">Tingkat</label><select id="f_tk"><option value="">(pilih)</option>${opsi(TINGKAT_PUB, d.tingkat)}</select></div>
      <div class="fld" data-kat="publikasi"><label for="f_ix">Indeksasi</label><select id="f_ix"><option value="">(pilih)</option>${opsi(INDEKSASI, d.indeksasi)}</select></div>
      <div class="fld" data-kat="publikasi"><label for="f_tb">Nama jurnal/prosiding/penerbit</label><input id="f_tb" maxlength="300" value="${esc(d.terbitan)}"></div>
      <div class="fld" data-kat="luaran"><label for="f_no">Nomor (pendaftaran/HKI/sertifikat TKT/ISBN)</label><input id="f_no" maxlength="300" value="${esc(d.nomor)}"></div>
      <div class="fld" data-kat="luaran"><label for="f_sh">Status paten <span>(paten saja)</span></label><select id="f_sh"><option value="">—</option>${opsi([['registered', 'Terdaftar'], ['granted', 'Diberikan (granted)'], ['komersial', 'Dikomersialkan']], d.status_hki)}</select></div>
      <div class="fld" data-kat="luaran"><label for="f_tkt">TKT <span>(TTG/produk, 1–9)</span></label><input id="f_tkt" inputmode="numeric" maxlength="1" value="${esc(d.tkt)}"></div>
    </div>
    <div class="fld"><label for="f_doi">DOI atau URL <span>(opsional)</span></label><input id="f_doi" type="url" maxlength="300" value="${esc(d.doi_url)}" placeholder="https://doi.org/…"></div>
    <div class="fld"><label for="f_anggota">Mahasiswa lain penulis/pencipta <span>(opsional; satu per baris: NIM - Nama)</span></label>
      <textarea id="f_anggota">${esc(teksAnggota(d.anggota))}</textarea></div>
    <label class="cek"><input type="checkbox" id="f_bd"${d.bersama_dosen ? ' checked' : ''}> Ditulis/dibuat bersama dosen prodi. Bila dicentang, karya ini
      dicatat lewat karya dosen (dosen memasukkannya dengan Anda sebagai penulis), bukan sebagai karya mandiri mahasiswa.</label>`;
  if (jenis === 'ta') return `${nm}
    <div class="dua">
      <div class="fld"><label for="f_tahap">Tahap</label><select id="f_tahap"><option value="">(pilih)</option>${opsi(TAHAP_TA, d.tahap_ta)}</select></div>
      ${pb.replace('Dosen pembimbing TA', 'Pembimbing 1')}
    </div>
    <div class="fld"><label for="f_pb2">Pembimbing 2 <span>(opsional)</span></label>
      <select id="f_pb2"><option value="">(tidak ada)</option>${DOSEN.map(x => `<option value="${x.id}"${x.id === d.pembimbing_2 ? ' selected' : ''}>${esc(x.nama)}</option>`).join('')}</select>
      <small>Belum punya pembimbing? <a href="berkas-mahasiswa.html#pembimbing" target="_blank" rel="noopener">Cari calon pembimbing TA</a>
        menurut judul. Pembimbing 1 memeriksa kesiapan Anda, lalu admin prodi menetapkan jadwal dan penguji.</small></div>
    <div class="fld"><label for="f_judul">Judul TA</label><textarea id="f_judul" maxlength="400" style="min-height:60px">${esc(d.judul)}</textarea></div>
    <label class="cek"><input type="checkbox" id="f_tampil"${d.tampil_nama ? ' checked' : ''}> Saya setuju nama saya ditampilkan
      di jadwal seminar/sidang di situs prodi (tanpa NIM). Tanpa centang: ditulis "Mahasiswa TA".</label>`;
  if (jenis === 'surat') return `${nm}
    <div class="fld"><label for="f_js">Jenis surat</label><select id="f_js"><option value="">(pilih)</option>${opsi(JENIS_SURAT, d.jenis_surat)}</select>
      <small>Ditandatangani Kaprodi. Diproses admin prodi; surat yang sudah ditandatangani diunduh lewat tautan pribadi Anda.</small></div>
    <div class="fld"><label for="f_kep">Keperluan</label><textarea id="f_kep" maxlength="600" placeholder="mis. syarat beasiswa, pengambilan data Tugas Akhir">${esc(d.keperluan)}</textarea></div>
    <div class="fld" data-surat="izin_penelitian rekomendasi"><label for="f_tuj">Tujuan surat (kepada)</label><input id="f_tuj" maxlength="300" value="${esc(d.tujuan_surat)}" placeholder="mis. Kepala Dinas PUPR Kota …"></div>
    <div class="fld" data-surat="izin_penelitian rekomendasi"><label for="f_alt">Alamat tujuan <span>(opsional)</span></label><input id="f_alt" maxlength="300" value="${esc(d.alamat_tujuan)}"></div>
    <div class="fld" data-surat="izin_penelitian"><label for="f_jdl">Judul penelitian</label><input id="f_jdl" maxlength="300" value="${esc(d.judul_penelitian)}"></div>
    <div class="dua" data-surat="izin_penelitian">
      <div class="fld"><label for="f_lok">Lokasi <span>(opsional)</span></label><input id="f_lok" maxlength="300" value="${esc(d.lokasi)}"></div>
      <div class="fld"><label for="f_wkt">Waktu pelaksanaan <span>(opsional)</span></label><input id="f_wkt" maxlength="300" value="${esc(d.waktu_pelaksanaan)}" placeholder="mis. Desember 2026 – Januari 2027"></div>
    </div>`;
  if (jenis === 'kp') return `${nm}${pb}
    <div class="fld"><label for="f_program">Program</label><select id="f_program">${PROGRAM_KP.map(([k, l]) =>
      `<option value="${k}"${(d.program || 'kp') === k ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select></div>
    <div class="fld"><label for="f_instansi">Instansi tujuan KP/magang</label><input id="f_instansi" maxlength="300" value="${esc(d.instansi)}" list="daftar_instansi" autocomplete="off">
      <datalist id="daftar_instansi"></datalist>
      <small>Bila instansinya sudah pernah dipakai KP atau menjadi mitra prodi, pilih nama dari usulan supaya tercatat sama.</small></div>
    <div class="fld"><label for="f_alamat">Alamat instansi <span>(opsional)</span></label><input id="f_alamat" maxlength="300" value="${esc(d.alamat_instansi)}"></div>
    <div class="dua">
      <div class="fld"><label for="f_bidang">Bidang/divisi <span>(opsional)</span></label><input id="f_bidang" maxlength="300" value="${esc(d.bidang_kerja)}"></div>
      <div class="fld"><label for="f_kontak">Kontak instansi <span>(opsional)</span></label><input id="f_kontak" maxlength="300" value="${esc(d.kontak_instansi)}" placeholder="nama, jabatan, telepon/email"></div>
      <div class="fld"><label for="f_mulai">Rencana mulai <span>(opsional)</span></label><input id="f_mulai" type="date" value="${esc(d.rencana_mulai)}"></div>
      <div class="fld"><label for="f_selesai">Rencana selesai <span>(opsional)</span></label><input id="f_selesai" type="date" value="${esc(d.rencana_selesai)}"></div>
    </div>`;
  return `${nm}${pb}
    <div class="fld"><label for="f_keg">Nama kegiatan/lomba</label><input id="f_keg" maxlength="300" value="${esc(d.nama_kegiatan)}"></div>
    <div class="dua">
      <div class="fld"><label for="f_peny">Penyelenggara <span>(opsional)</span></label><input id="f_peny" maxlength="300" value="${esc(d.penyelenggara)}"></div>
      <div class="fld"><label for="f_tgl">Tanggal lomba (hari pengumuman)</label><input id="f_tgl" type="date" value="${esc(d.tanggal)}"></div>
      <div class="fld"><label for="f_tingkat">Tingkat</label><select id="f_tingkat"><option value="">(pilih)</option>${opsi(TINGKAT, d.tingkat)}</select></div>
      <div class="fld"><label for="f_bid">Bidang</label><select id="f_bid"><option value="">(pilih)</option>${opsi(BIDANG, d.bidang)}</select></div>
    </div>
    <div class="fld"><label for="f_capaian">Capaian <span>(mis. Juara 1, Finalis)</span></label><input id="f_capaian" maxlength="300" value="${esc(d.capaian)}"></div>
    <div class="fld"><label for="f_anggota">Anggota tim lain <span>(opsional; satu orang per baris: NIM - Nama)</span></label>
      <textarea id="f_anggota">${esc(teksAnggota(d.anggota))}</textarea></div>
    <div class="fld"><label for="f_cerita">Cerita singkat untuk situs prodi <span>(opsional, maks. 600 huruf)</span></label>
      <textarea id="f_cerita" maxlength="600">${esc(d.cerita)}</textarea></div>
    <label class="cek"><input type="checkbox" id="f_tampil"${d.tampil_nama ? ' checked' : ''}> Saya dan anggota tim setuju nama kami
      ditampilkan di situs prodi bila prestasi ini disetujui (tanpa NIM). Tanpa centang: ditulis "Tim mahasiswa".</label>`;
}

// Kolom publikasi/luaran mengikuti kategori (96).
function pasangLuaran(){
  const rs = document.querySelectorAll('[name=f_kat]'); if (!rs.length) return;
  const atur = () => { const k = document.querySelector('[name=f_kat]:checked')?.value;
    document.querySelectorAll('[data-kat]').forEach(el => { el.hidden = el.dataset.kat !== k; }); };
  rs.forEach(r => { r.onchange = atur; }); atur();
}

function pasangSurat(){
  const js = $('f_js'); if (!js) return;
  const atur = () => document.querySelectorAll('[data-surat]').forEach(el => { el.hidden = !el.dataset.surat.split(' ').includes(js.value); });
  js.onchange = atur; atur();
}

function bacaIsian(jenis){
  const v = id => ($(id)?.value || '').trim();
  if (jenis === 'luaran') {
    const kat = document.querySelector('[name=f_kat]:checked')?.value || '';
    const umum = { kategori: kat, judul: v('f_judul'), tahun: v('f_th'), bulan: v('f_bl'), doi_url: v('f_doi'),
                   anggota: bacaAnggota($('f_anggota').value), bersama_dosen: $('f_bd').checked };
    return { nama: v('f_nama'), pembimbing: v('f_pb'), data: kat === 'luaran'
      ? { ...umum, jenis_luaran: v('f_jl'), nomor: v('f_no'), status_hki: v('f_sh'), tkt: v('f_tkt') }
      : { ...umum, jenis_pub: v('f_jp'), tingkat: v('f_tk'), indeksasi: v('f_ix'), terbitan: v('f_tb') } };
  }
  if (jenis === 'ta') return { nama: v('f_nama'), pembimbing: v('f_pb'), data: { tahap_ta: v('f_tahap'), judul: v('f_judul'),
    pembimbing_2: v('f_pb2'), tampil_nama: $('f_tampil').checked } };
  if (jenis === 'surat') return { nama: v('f_nama'), pembimbing: '', data: { jenis_surat: v('f_js'), keperluan: v('f_kep'),
    tujuan_surat: v('f_tuj'), alamat_tujuan: v('f_alt'), judul_penelitian: v('f_jdl'), lokasi: v('f_lok'), waktu_pelaksanaan: v('f_wkt') } };
  const data = jenis === 'kp'
    ? { program: v('f_program'), instansi: v('f_instansi'), alamat_instansi: v('f_alamat'), bidang_kerja: v('f_bidang'), kontak_instansi: v('f_kontak'),
        rencana_mulai: v('f_mulai'), rencana_selesai: v('f_selesai') }
    : { nama_kegiatan: v('f_keg'), penyelenggara: v('f_peny'), tanggal: v('f_tgl'), tingkat: v('f_tingkat'), bidang: v('f_bid'),
        capaian: v('f_capaian'), anggota: bacaAnggota($('f_anggota').value), cerita: v('f_cerita'), tampil_nama: $('f_tampil').checked };
  return { nama: v('f_nama'), pembimbing: v('f_pb'), data };
}

    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return tulis('m_alt', 'buruk', 'Tulis alamat email alternatif yang sah.');
    $('b_alt').disabled = true; tulis('m_alt', '', 'Mengirim…');

      tulis('m_alt', 'ok', `Tautan konfirmasi dikirim ke ${out.email || 'email kampus Anda'}; berlaku 2 hari.`);
    } catch (err) { tulis('m_alt', 'buruk', err.message); }
    finally { $('b_alt').disabled = false; }
  };
  $('frmUlang').onsubmit = async e => {
    e.preventDefault();
    const nim = $('u_nim').value.trim();
    if (!/^\d{6,15}$/.test(nim)) return tulis('m_ulang', 'buruk', 'NIM harus angka 6–15 digit.');
    $('b_ulang').disabled = true; tulis('m_ulang', '', 'Mengirim…');
    try {
      const out = await appsScript({ kind: 'mhs_tautan_ulang', nim, jebakan: $('u_situs').value });
      tulis('m_ulang', 'ok', `Bila NIM ini punya pengajuan, tautan baru sudah dikirim ke ${out.email || 'email kampus'}.`);
    } catch (err) { tulis('m_ulang', 'buruk', err.message); }
    finally { $('b_ulang').disabled = false; }
  };
}

      <div class="meta">${esc(labelStatus(x))}${x.ini ? ' · sedang dibuka' : ''}</div></div></li>`).join('')}</ul>
    <p class="ket"><a href="pengajuan.html">Buat pengajuan baru</a> (tautannya dikirim ke email kampus).</p>`;
  document.querySelectorAll('[data-buka]').forEach(b => { b.onclick = () => buka(+b.dataset.buka, b); });
  document.querySelectorAll('[data-buang]').forEach(b => { b.onclick = () => buang(+b.dataset.buang, b); });
  if (ubah) $('b_unggah').onclick = unggah;
  if (ubahPengajuan) {
    pasangSurat(); pasangLuaran(); isiSaran();
    $('frmUbah').onsubmit = async e => { e.preventDefault(); await simpan(); };
    $('b_kirim').onclick = kirim;
  }
  if (jendelaSelesai) {
    $('frmSelesai').onsubmit = async e => { e.preventDefault(); await simpanSelesai(); };
    $('b_kirimS').onclick = kirimSelesai;
  }
}

// Halaman digambar ulang setelah unggah/buang berkas: isian yang sedang diketik disimpan dulu supaya tidak hilang.
// Isian pengajuan disimpan hanya bila sudah sah; laporan selesai selalu (sebagai draf).
async function simpanDiam(){
  try {
    if ($('frmSelesai')) await sb.rpc('mhs_ubah_selesai', { p_token: TOKEN, p_data: bacaSelesai() });
    if ($('frmUbah')) { const x = bacaIsian(P.jenis);
      if (!periksaIsian(P.jenis, x).length) await sb.rpc('mhs_ubah', { p_token: TOKEN, p_nama: x.nama, p_pembimbing: x.pembimbing, p_data: x.data }); }
  } catch { /* tidak menghalangi unggah */ }
}

async function simpanSelesai(){
  const ds = bacaSelesai(), g = periksaSelesai(ds);
  const { error } = await sb.rpc('mhs_ubah_selesai', { p_token: TOKEN, p_data: ds });
  if (error) { tulis('m_simpanS', 'buruk', error.message); return false; }
  tulis('m_simpanS', g.length ? '' : 'ok', g.length ? 'Tersimpan sebagai draf. Belum lengkap: ' + g.join(' ') : 'Tersimpan.');
  return !g.length;
}
async function kirimSelesai(){
  $('b_kirimS').disabled = true;
  try {
    if (!(await simpanSelesai())) throw new Error('Lengkapi laporan selesai di atas dulu.');
    const { error } = await sb.rpc('mhs_kirim_selesai', { p_token: TOKEN });
    if (error) throw new Error(error.message);
    await muat(); halamanSaya();
  } catch (e) { tulis('m_kirimS', 'buruk', e.message); $('b_kirimS').disabled = false; }
}

async function buka(id, tombol){
  tombol.disabled = true;
  try { bukaIsi(await appsScript({ kind: 'mhs_buka', t: TOKEN, berkas: id })); }
  catch (e) { tulis('m_berkas', 'buruk', e.message); }
  finally { tombol.disabled = false; }
}
async function buang(id, tombol){
  if (!confirm('Buang berkas ini?')) return;
  tombol.disabled = true;
  try { await appsScript({ kind: 'mhs_buang', t: TOKEN, berkas: id }); await simpanDiam(); await muat(); halamanSaya(); }
  catch (e) { tulis('m_berkas', 'buruk', e.message); tombol.disabled = false; }
}
async function unggah(){
  const fs = [...$('u_berkas').files], jenis = $('u_jenis').value;
  if (!fs.length) return tulis('m_berkas', 'buruk', 'Pilih berkas dulu.');
  $('b_unggah').disabled = true;
  try {
    for (let i = 0; i < fs.length; i++) {
      tulis('m_berkas', '', `Mengunggah ${i + 1}/${fs.length}: ${fs[i].name}…`);
      await appsScript({ kind: 'mhs_unggah', t: TOKEN, jenis_berkas: jenis, filename: fs[i].name, data: await keB64(fs[i]) });
    }
    await simpanDiam(); await muat(); halamanSaya(); tulis('m_berkas', 'ok', 'Berkas terunggah.');
  } catch (e) { tulis('m_berkas', 'buruk', e.message); $('b_unggah').disabled = false; }
}
async function simpan(){
  const x = bacaIsian(P.jenis), g = periksaIsian(P.jenis, x);
  if (g.length) { tulis('m_simpan', 'buruk', g.join(' ')); return false; }
  const { error } = await sb.rpc('mhs_ubah', { p_token: TOKEN, p_nama: x.nama, p_pembimbing: x.pembimbing, p_data: x.data });
  if (error) { tulis('m_simpan', 'buruk', error.message); return false; }
  tulis('m_simpan', 'ok', 'Tersimpan.');
  return true;
}
async function kirim(){
  $('b_kirim').disabled = true;
  try {
    if (!(await simpan())) throw new Error('Periksa isian di atas dulu.');
    const { error } = await sb.rpc('mhs_kirim', { p_token: TOKEN });
    if (error) throw new Error(error.message);
    await muat(); halamanSaya();
  } catch (e) { tulis('m_kirim', 'buruk', e.message); $('b_kirim').disabled = false; }
}

// Konfirmasi email alternatif dari tautan di email kampus (104).
async function konfirmasiAlt(){
  $('isi').innerHTML = '<p class="kosong">Mengaktifkan email alternatif…</p>';
  history.replaceState(null, '', location.pathname);   // token tidak tertinggal di riwayat peramban
  const out = await appsScript({ kind: 'mhs_email_alt_konfirmasi', token: ALT });
  $('isi').innerHTML = `<div class="kotak"><p><b>Email alternatif ${esc(out.email || '')} sudah aktif.</b></p>
    <p>Mulai sekarang tautan dan kabar pengajuan dikirim ke email kampus dan email alternatif ini.
      Pemberitahuan juga dikirim ke kedua alamat.</p><p><a href="pengajuan.html">Ke halaman pengajuan</a></p></div>`;
}

async function mulai(){
  fetch('data.json?v=' + Date.now()).then(r => r.ok ? r.json() : {}).catch(() => ({}))
    .then(d => { $('hProdi').textContent = [d.prodi, d.institusi].filter(Boolean).join(' · '); SARAN = saranInstansi(d); isiSaran(); });
  if (!window.UPLOAD_URL) throw new Error('Layanan unggah belum disiapkan admin.');
  const { data, error } = await sb.rpc('pembimbing_pilihan');
  if (error) throw new Error(/pembimbing_pilihan/.test(error.message) ? 'Layanan pengajuan belum dibuka admin prodi.' : error.message);
  DOSEN = data || [];
  if (ALT) return konfirmasiAlt();
  if (!TOKEN) return halamanBaru();
  await muat();
  halamanSaya();
}
mulai().catch(e => { $('isi').innerHTML = `<p class="kosong">${esc(e.message)}</p>
  ${TOKEN ? '<p><a href="pengajuan.html">Minta tautan baru</a></p>' : ''}`; });
</script>
