<style>
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
       font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{max-width:900px;margin:0 auto;padding:0 20px 80px}
  a{color:var(--biru-2)}
  .hero-in{max-width:900px}
  h1{font-family:var(--serif);font-size:clamp(21px,3.4vw,28px);font-weight:600;margin:0;color:#fff}
  h2{font-family:var(--serif);font-size:18px;margin:0 0 8px;color:var(--biru)}
  .sub{color:var(--biru-m4);font-size:14px;margin-top:6px}
  .b{background:var(--panel);border:1px solid var(--line);padding:16px 18px;margin-top:16px}
  .ket{font-size:13px;color:var(--muted);margin:0 0 10px}
  .info{padding:10px 14px;border-left:3px solid var(--emas);background:#FFFBEF;font-size:13.5px;margin-top:16px}
  .info.tolak{border-left-color:var(--merah);background:var(--merah-m4)}
  .tetap{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px 14px;font-size:14px}
  .tetap span{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--muted)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px 14px}
  .fld label{display:block;font-size:12.5px;margin-bottom:3px}
  .fld .wj{color:var(--merah)}
  .fld input,.fld select{width:100%;padding:7px 9px;border:1px solid var(--line);
    border-radius:2px;font:inherit;font-size:13.5px;background:#fff}
  .fld.penuh{grid-column:1/-1}
  .fld small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
  .aksi{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px}
  button.btn{font:inherit;font-size:13px;padding:7px 14px;border:1px solid var(--biru);
    background:var(--biru);color:#fff;cursor:pointer;border-radius:2px}
  button.btn.ghost{background:#fff;color:var(--biru)}
  button:disabled{opacity:.5;cursor:default}
  .msg{font-size:13px}
  .msg.ok{color:var(--hijau)} .msg.buruk{color:var(--merah)}
  table.beda{border-collapse:collapse;font-size:13.5px;width:100%;margin-top:6px}
  table.beda th,table.beda td{border-bottom:1px solid var(--line-soft);padding:5px 8px;text-align:left}
  table.beda th{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  table.beda td:nth-child(3){background:#EAF4EC}
  .kosong{color:var(--muted);font-size:13.5px;padding:12px 0}
  .masuk{max-width:420px;margin:40px auto;background:#fff;border:1px solid var(--line);padding:20px}
  .masuk input{width:100%;padding:8px 10px;margin:8px 0;font:inherit}
</style>

<body>

<header class="hero">
  <div class="hero-in">
    <div class="hero-inst" data-identitas></div>
    <h1>Profil saya</h1>
    <div class="sub" id="hSub">Memuat&hellip;</div>
  </div>
</header>

<main class="wrap" id="isi"></main>

<script src="config.js?v=2026-11-11-47188b"></script>
<script>
// Galat saat memuat skrip (mis. modul lama dari cache bercampur dengan
// halaman baru) ditampilkan sebagai pesan, bukan halaman kosong.
addEventListener('error', function (e) {
  if (document.getElementById('galat-muat')) return;
  var d = document.createElement('div');
  d.id = 'galat-muat';
  d.style.cssText = 'margin:16px;padding:12px 14px;border:1px solid var(--merah);' +
    'background:var(--merah-m3);color:var(--ink);font:14px/1.5 system-ui,sans-serif';
  d.textContent = 'Halaman gagal dimuat: ' + (e.message || 'galat skrip') +
    '. Tekan Ctrl+Shift+R untuk memuat ulang tanpa cache; bila tetap muncul, kirim pesan ini ke admin.';
  document.body.insertBefore(d, document.body.firstChild);
});
</script>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
import { pasangMenu } from './menu.js?v=2026-11-11-47188b';
import { ISIAN_PROFIL, KOLOM_PROFIL, tampil as tampilIsian, sama, formLKPS, bacaFormLKPS, pasangEditor }
  from './profil-dosen.js?v=2026-11-11-47188b';

/* =====================================================================
   PROFIL SAYA — dosen mengajukan perubahan profilnya sendiri (keputusan
   pemilik 2026-11-04, supabase/20-patch-ajuan-ubah.sql). Yang bisa
   diajukan: nama, SINTA, Scopus, ORCID, jabatan, dan profil LKPS 4.a
   (22-patch-profil-dosen.sql, profil-dosen.js: riwayat pendidikan ->
   pendidikan tertinggi, keahlian, sertifikat, SKIP, STRI, MK PS lain).
   Email, NIDN, peran, aktif, DTPS, kategori, dan kesesuaian hanya diubah
   admin di kelola-dosen.html.
   Ajuan (tabel ajuan_ubah, jenis 'profil') diputuskan admin di
   verifikasi.html, tab Profil dosen; satu ajuan menunggu per dosen.
   Nilai sah dan pembersih ID sama dengan kelola-dosen.html.
   ===================================================================== */

const esc = s => String(s ?? '').replace(/[&<>"']/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = id => document.getElementById(id);

const SB_URL = window.SB_URL || '', SB_KEY = window.SB_KEY || '';
if (!SB_URL || !SB_KEY || SB_URL.includes('xxxx')) {
  $('isi').innerHTML = '<p class="kosong">config.js belum diisi.</p>';
  throw new Error('config.js belum diisi');
}
const sb = createClient(SB_URL, SB_KEY);

const PERAN = { dosen: 'Dosen', admin: 'Admin', pimpinan: 'Pimpinan', asesor: 'Asesor' };
const JABATAN = [['', 'Belum punya jabatan'], ['tenaga_pengajar', 'Tenaga pengajar'],
  ['asisten_ahli', 'Asisten ahli'], ['lektor', 'Lektor'], ['lektor_kepala', 'Lektor kepala'],
  ['guru_besar', 'Guru besar']];
const POLA = {
  sinta_id: [/^[0-9]+$/, 'hanya angka'],
  scopus_id: [/^[0-9]+$/, 'hanya angka'],
  orcid: [/^[0-9]{4}-[0-9]{4}-[0-9]{4}-[0-9]{3}[0-9X]$/i, 'format 0000-0000-0000-0000'],
};
// Kolom yang boleh diajukan, berurutan seperti form; label untuk tabel.
const ISIAN = ISIAN_PROFIL;

let SAYA = null, ADA_LKPS = true;

const opsi = (daftar, v) => daftar.map(([k, l]) =>
  `<option value="${esc(k)}"${k === (v || '') ? ' selected' : ''}>${esc(l)}</option>`).join('');
const tampil = (k, v) => tampilIsian(k, v, JABATAN);

function tulis(jenis, teks){ const m = $('pesan'); m.className = 'msg ' + jenis; m.textContent = teks; }

// Tempel URL profil -> ambil ID-nya (sama dengan kelola-dosen.html).
function idSaja(v){
  let s = String(v || '').trim();
  if (!s || ['nan', 'none', '-'].includes(s.toLowerCase())) return '';
  if (/http/i.test(s)) {
    s = s.slice(s.toLowerCase().lastIndexOf('http'));
    const m = s.match(/authorId=([0-9]+)/i);
    if (m) return m[1];
    s = s.replace(/\/+$/, '').split('?')[0].split('#')[0].split('/').pop();
  }
  return s.trim();
}

function tabelBeda(data, lama){
  return `<table class="beda"><thead><tr><th>Isian</th><th>Sekarang</th><th>Diajukan</th></tr></thead><tbody>${
    ISIAN.filter(([k]) => k in data).map(([k, l]) =>
      `<tr><td>${esc(l)}</td><td>${esc(tampil(k, lama?.[k]))}</td><td>${esc(tampil(k, data[k]))}</td></tr>`).join('')
  }</tbody></table>`;
}

async function mulai(){
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return layarMasuk();
  const DASAR = 'id,nidn,nama,email,peran,pendidikan,jabatan,sinta_id,scopus_id,orcid';
  let { data: saya, error: eS } = await sb.from('dosen').select(DASAR + ',' + KOLOM_PROFIL)
    .ilike('email', session.user.email).maybeSingle();
  if (eS) {   // 22-patch-profil-dosen.sql belum dijalankan
    ADA_LKPS = false;
    ({ data: saya } = await sb.from('dosen').select(DASAR).ilike('email', session.user.email).maybeSingle());
  }
  if (!saya) { $('hSub').textContent = 'Tidak terdaftar'; $('isi').innerHTML = '<p class="kosong">Email belum terdaftar. Hubungi admin prodi.</p>'; return; }
  SAYA = saya;
  pasangMenu(sb);
  $('hSub').textContent = `Masuk sebagai ${saya.nama}`;
  await gambar();
}

async function gambar(){
  const { data: aj, error } = await sb.from('ajuan_ubah')
    .select('id,data,lama,status,alasan,catatan_admin,dibuat_pada')
    .eq('jenis', 'profil').eq('dosen_id', SAYA.id).order('dibuat_pada', { ascending: false });
  const tunggu = (aj || []).find(a => a.status === 'menunggu');
  const tolak = (aj || []).find(a => a.status === 'ditolak');

  $('isi').innerHTML = `
    <div class="b"><h2>Data akun</h2>
      <p class="ket">Diisi admin prodi dan tidak bisa diubah di sini. Bila salah, hubungi admin.</p>
      <div class="tetap">
        <div><span>Email</span>${esc(SAYA.email)}</div>
        <div><span>NIDN / kode</span>${esc(SAYA.nidn)}</div>
        <div><span>Peran</span>${esc(PERAN[SAYA.peran] || SAYA.peran)}</div>
      </div></div>
    ${error ? `<div class="info tolak">Ajuan perubahan belum tersedia (${esc(error.message)}).
      Admin perlu menjalankan supabase/20-patch-ajuan-ubah.sql.</div>` : ''}
    ${tolak ? `<div class="info tolak"><b>Ajuan perubahan Anda ditolak admin.</b>
      Alasan: ${esc(tolak.catatan_admin || '-')}${tabelBeda(tolak.data, tolak.lama)}
      <div class="aksi"><button class="btn ghost" id="tutup">Tutup pemberitahuan</button></div></div>` : ''}
    ${tunggu ? `<div class="info"><b>Ajuan perubahan menunggu persetujuan admin</b>
      (dikirim ${esc(String(tunggu.dibuat_pada).slice(0, 10))}). Data di bawah berlaku setelah disetujui.
      ${tabelBeda(tunggu.data, tunggu.lama)}
      <div class="aksi"><button class="btn ghost" id="batalAjuan">Batalkan ajuan</button></div></div>` : ''}
    <div class="b"><h2>Data profil</h2>
      <p class="ket">Perubahan dikirim sebagai ajuan dan berlaku setelah disetujui admin prodi.
        Untuk SINTA/Scopus/ORCID boleh menempel tautan profilnya; ID-nya diambil otomatis.</p>
      <div class="grid">
        <div class="fld penuh"><label>Nama lengkap <span class="wj">*</span></label><input id="f_nama" value="${esc(SAYA.nama)}">
          <small>Lengkap dengan gelar, sesuai SK; tampil di situs dan laporan.</small></div>
        <div class="fld"><label>Pendidikan tertinggi</label><input value="${esc(SAYA.pendidikan || '—')}" disabled>
          <small>${ADA_LKPS ? 'Dihitung dari riwayat pendidikan di bawah.' : 'Diubah admin.'}</small></div>
        <div class="fld"><label>Jabatan akademik</label><select id="f_jabatan">${opsi(JABATAN, SAYA.jabatan)}</select></div>
        <div class="fld"><label>SINTA ID</label><input id="f_sinta_id" value="${esc(SAYA.sinta_id)}"></div>
        <div class="fld"><label>Scopus ID</label><input id="f_scopus_id" value="${esc(SAYA.scopus_id)}"></div>
        <div class="fld"><label>ORCID</label><input id="f_orcid" value="${esc(SAYA.orcid)}"></div>
      </div>
      ${ADA_LKPS ? `<h2 style="margin-top:18px">Profil untuk LKPS (Tabel 4.a)</h2>
        <p class="ket">Dipakai untuk mengisi LKPS dan LED. Kategori dosen dan penilaian kesesuaian diisi admin prodi.</p>
        ${formLKPS(SAYA)}` : `<div class="info">Isian profil LKPS (riwayat pendidikan, keahlian, sertifikat)
        belum tersedia: admin perlu menjalankan supabase/22-patch-profil-dosen.sql.</div>`}
      <div class="grid" style="margin-top:14px">
        <div class="fld penuh"><label>Keterangan untuk admin</label><input id="f_alasan"
          placeholder="Contoh: SK jabatan lektor terbit Oktober 2026">
          <small>Opsional; membantu admin memeriksa.</small></div>
      </div>
      <div class="aksi"><button class="btn" id="kirim"${tunggu || error ? ' disabled' : ''}>Kirim ajuan</button>
        <span class="msg" id="pesan">${tunggu ? 'Masih ada ajuan yang menunggu.' : ''}</span></div></div>`;

  if (ADA_LKPS) pasangEditor($('isi'));
  if (tolak) $('tutup').onclick = () => hapusAjuan(tolak.id, null);
  if (tunggu) $('batalAjuan').onclick = () => hapusAjuan(tunggu.id, 'Batalkan ajuan perubahan profil?');
  if (!tunggu && !error) $('kirim').onclick = kirim;
}

async function hapusAjuan(id, tanya){
  if (tanya && !confirm(tanya)) return;
  const { error } = await sb.from('ajuan_ubah').delete().eq('id', id);
  if (error) alert('Gagal: ' + error.message);
  await gambar();
}

async function kirim(){
  const v = k => $('f_' + k).value.trim();
  const baru = {
    nama: v('nama'), jabatan: v('jabatan') || null,
    sinta_id: idSaja(v('sinta_id')) || null, scopus_id: idSaja(v('scopus_id')) || null,
    orcid: idSaja(v('orcid')) || null,
    ...(ADA_LKPS ? bacaFormLKPS(SAYA.pendidikan) : {}),
  };
  if (!baru.nama) return tulis('buruk', 'Nama wajib diisi.');
  const data = {}, lama = {};
  ISIAN.forEach(([k]) => {
    if (k in baru && !sama(baru[k], SAYA[k])) { data[k] = baru[k]; lama[k] = SAYA[k] ?? null; }
  });
  if (!Object.keys(data).length) return tulis('buruk', 'Tidak ada isian yang berubah.');
  const ingat = Object.entries(POLA)
    .filter(([k, [re]]) => data[k] && !re.test(data[k]))
    .map(([k, [, ket]]) => `${k} (${ket})`);
  if (ingat.length && !confirm(`Format ${ingat.join(', ')} tidak sesuai; tautan profil mungkin tidak berfungsi. Tetap kirim?`)) return;

  $('kirim').disabled = true;
  const { error } = await sb.from('ajuan_ubah').insert({
    jenis: 'profil', dosen_id: SAYA.id, data, lama, alasan: v('alasan') || null, oleh: SAYA.id });
  if (error) {
    $('kirim').disabled = false;
    return tulis('buruk', error.code === '23505' ? 'Masih ada ajuan yang menunggu.' : 'Gagal mengirim: ' + error.message);
  }
  await gambar();
  tulis('ok', 'Ajuan terkirim. Admin prodi akan meninjaunya.');
}

function layarMasuk(){
  $('hSub').textContent = 'Perlu masuk';
  $('isi').innerHTML = `<div class="masuk"><p>Masukkan email kampus Anda — tautan masuk dikirim tanpa kata sandi.</p>
    <input id="em" type="email" placeholder="nama@kampus.ac.id" autocomplete="email">
    <button class="btn" id="kirimMasuk">Kirim tautan masuk</button><p class="ket" id="pesan"></p></div>`;
  $('kirimMasuk').onclick = async () => {
    const em = $('em').value.trim();
    if (!em) return;
    const { error } = await sb.auth.signInWithOtp({ email: em, options: { emailRedirectTo: location.href } });
    $('pesan').textContent = error ? 'Gagal: ' + error.message : 'Tautan masuk sudah dikirim. Periksa email Anda.';
  };
}

sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_IN' && !SAYA) mulai(); });
mulai().catch(e => { $('isi').innerHTML = `<p class="kosong">${esc(e.message)}</p>`; });
</script>
</body>
