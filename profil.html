  d.id = 'galat-muat';
  d.style.cssText = 'margin:16px;padding:12px 14px;border:1px solid var(--merah);' +
    'background:var(--merah-m3);color:var(--ink);font:14px/1.5 system-ui,sans-serif';

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
import { pasangMenu } from './menu.js?v=2026-11-13-a41e8b';
import { dosenLogin } from './dosen-login.js?v=2026-11-13-a41e8b';
import { unduhCV, htmlTombolCV, mkDiampu } from './cv-dosen.js?v=2026-11-13-a41e8b';
import { keBase64 } from './pustaka-dokumen.js?v=2026-11-13-a41e8b';
import { tautanBerkas, temuanPakai } from './tautan-privat.js?v=2026-11-13-a41e8b';
import { periksaBerkas, sidikBerkas } from './sidik-berkas.js?v=2026-11-13-a41e8b';
import { ISIAN_PROFIL, KOLOM_PROFIL, tampil as tampilIsian, sama, formLKPS, bacaFormLKPS, pasangEditor, bacaKataKunci,
  setelNamaTopik, htmlPilihTopik, bacaPilihTopik, MAKS_TOPIK }
  from './profil-dosen.js?v=2026-11-13-a41e8b';

/* =====================================================================
   PROFIL SAYA — dosen mengajukan perubahan profilnya sendiri (keputusan
   pemilik 2026-11-04, supabase/20-patch-ajuan-ubah.sql). Yang bisa
   diajukan: nama, SINTA, Scopus, ORCID, jabatan, dan profil LKPS 4.a
   (22-patch-profil-dosen.sql, profil-dosen.js: riwayat pendidikan ->
   pendidikan tertinggi, keahlian, sertifikat, SKIP, STRI, MK PS lain).
   Email, NIDN, peran, aktif, DTPS, kategori, dan kesesuaian hanya diubah
   admin di kelola-dosen.html.
   Ajuan (tabel ajuan_ubah, jenis 'profil') diputuskan admin di
   verifikasi.html, tab Profil dosen; satu ajuan menunggu per dosen.
   Nilai sah dan pembersih ID sama dengan kelola-dosen.html.
   ===================================================================== */

const esc = s => String(s ?? '').replace(/[&<>"']/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = id => document.getElementById(id);

const SB_URL = window.SB_URL || '', SB_KEY = window.SB_KEY || '';
if (!SB_URL || !SB_KEY || SB_URL.includes('xxxx')) {
  $('isi').innerHTML = '<p class="kosong">config.js belum diisi.</p>';
  throw new Error('config.js belum diisi');
}
const sb = createClient(SB_URL, SB_KEY);

const PERAN = { dosen: 'Dosen', admin: 'Admin', pimpinan: 'Pimpinan', asesor: 'Asesor' };
const JABATAN = [['', 'Belum punya jabatan'], ['tenaga_pengajar', 'Tenaga pengajar'],
  ['asisten_ahli', 'Asisten ahli'], ['lektor', 'Lektor'], ['lektor_kepala', 'Lektor kepala'],
  ['guru_besar', 'Guru besar']];
const POLA = {
  sinta_id: [/^[0-9]+$/, 'hanya angka'],
  scopus_id: [/^[0-9]+$/, 'hanya angka'],
  orcid: [/^[0-9]{4}-[0-9]{4}-[0-9]{4}-[0-9]{3}[0-9X]$/i, 'format 0000-0000-0000-0000'],
};
// Kolom yang boleh diajukan, berurutan seperti form; label untuk tabel.
const ISIAN = ISIAN_PROFIL;

let SAYA = null, ADA_LKPS = true, ADA_ALT = false, MK_PRODI = null;
let BAKU = null;   // daftar keahlian baku aktif (61-patch-keahlian-baku.sql); null bila belum ada
// CV dosen otomatis (pemilik 2026-11-11): tombol di kartu "CV saya".
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-cv="saya"]');
  if (!b || !SAYA) return;
  const m = $('cv_msg_saya');
  b.disabled = true; m.textContent = 'Menyusun dokumen…';
  try { await unduhCV(SAYA, $('cv_periode_saya').value, $('cv_gaya_saya').value, sb); m.textContent = 'Berkas diunduh.'; }
  catch (err) { m.textContent = 'Gagal: ' + (err.message || err); }
  finally { b.disabled = false; }
});

const opsi = (daftar, v) => daftar.map(([k, l]) =>
  `<option value="${esc(k)}"${k === (v || '') ? ' selected' : ''}>${esc(l)}</option>`).join('');
const tampil = (k, v) => tampilIsian(k, v, JABATAN);

// Bukti ijazah/sertifikat (pemilik 2026-11-13): berkas privat lewat Apps Script (kind karya,
// folder karya/<tahun>/<nama dosen>); tautannya lkd.html?f=<id>, dibuka admin, pemilik, dan asesor.
// Satu isi berkas = satu unggahan (2026-11-13): sidik SHA-256 -> janji tautan selama halaman terbuka,
// jadi berkas yang sama dipilih lagi (juga bersamaan) memakai tautan yang sama; berkas privat yang
// sudah tersimpan di bukti lain dipakai ulang (temuanPakai).
const UNGGAH_SESI = new Map();
async function unggahBuktiProfil(f, opsi){
  const s = await periksaBerkas(sb, f);
  const h = s.sha256 || await sidikBerkas(f).catch(() => null);   // juga tanpa patch 31 (cari_sha256)
  if (h && UNGGAH_SESI.has(h)) return UNGGAH_SESI.get(h);
  const lama = temuanPakai(s.temuan, true);
  if (lama) return lama.url;
  const janji = kirimBuktiProfil(f, opsi);
  if (h) { UNGGAH_SESI.set(h, janji); janji.catch(() => UNGGAH_SESI.delete(h)); }
  return janji;
}
async function kirimBuktiProfil(f, { jenis, tahun }){
  const ext = String(window.UPLOAD_EXT || '').toLowerCase().split(',').map(s => s.trim()).filter(Boolean);
  const maxMb = Number(window.UPLOAD_MAX_MB) || 0, e = ((f.name.match(/\.([^.]+)$/) || [])[1] || '').toLowerCase();
  if (ext.length && !ext.includes(e)) throw new Error(`jenis berkas tidak diterima (${ext.join(', ')})`);
  if (maxMb && f.size > maxMb * 1024 * 1024) throw new Error(`lebih dari ${maxMb} MB`);
  const { data: { session } } = await sb.auth.getSession();
  if (!session) throw new Error('sesi login habis; muat ulang halaman');
  const awalan = jenis === 'riwayat' ? 'Ijazah' : 'Sertifikat';
  const res = await fetch(window.UPLOAD_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ token: session.access_token, kind: 'karya', year: tahun, privat: true,
                           filename: `${awalan} - ${f.name}`, data: await keBase64(f) }) });
  const out = await res.json();
  if (!out.ok) throw new Error(out.error || 'unggah gagal');
  return tautanBerkas(out);
}

function tulis(jenis, teks){ const m = $('pesan'); m.className = 'msg ' + jenis; m.textContent = teks; }

// Tempel URL profil -> ambil ID-nya (sama dengan kelola-dosen.html).
function idSaja(v){
  let s = String(v || '').trim();
  if (!s || ['nan', 'none', '-'].includes(s.toLowerCase())) return '';
  if (/http/i.test(s)) {
    s = s.slice(s.toLowerCase().lastIndexOf('http'));
    const m = s.match(/authorId=([0-9]+)/i);
    if (m) return m[1];
    s = s.replace(/\/+$/, '').split('?')[0].split('#')[0].split('/').pop();
  }
  return s.trim();
}

function tabelBeda(data, lama){
  return `<table class="beda"><thead><tr><th>Isian</th><th>Sekarang</th><th>Diajukan</th></tr></thead><tbody>${
    ISIAN.filter(([k]) => k in data).map(([k, l]) =>
      `<tr><td>${esc(l)}</td><td>${esc(tampil(k, lama?.[k]))}</td><td>${esc(tampil(k, data[k]))}</td></tr>`).join('')
  }</tbody></table>`;
}

async function mulai(){
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return layarMasuk();
  const DASAR = 'id,nidn,nama,email,peran,pendidikan,jabatan,sinta_id,scopus_id,orcid';
  let { data: saya, error: eS } = await dosenLogin(sb, session, DASAR + ',' + KOLOM_PROFIL);
  if (eS) {   // 22-patch-profil-dosen.sql belum dijalankan
    ADA_LKPS = false;
    ({ data: saya } = await dosenLogin(sb, session, DASAR));
  }
  if (!saya) { $('hSub').textContent = 'Tidak terdaftar'; $('isi').innerHTML = '<p class="kosong">Email belum terdaftar. Hubungi admin prodi.</p>'; return; }
  SAYA = saya;
  // Email alternatif untuk login (patch 69); kueri terpisah supaya isian lain tetap tampil sebelum patch.
  const { data: alt, error: eAlt } = await sb.from('dosen').select('email_alternatif').eq('id', saya.id).maybeSingle();
  ADA_ALT = !eAlt;
  if (ADA_ALT) SAYA.email_alternatif = alt?.email_alternatif ?? null;
  // Daftar keahlian baku (patch 61): dibaca pengguna terdaftar; gagal = belum ada patch, pemilih tidak tampil.
  const [rb, rt] = await Promise.all([
    sb.from('ref_bidang_keahlian').select('kode,nama,nama_en,urutan,aktif').order('urutan'),
    sb.from('ref_topik_keahlian').select('kode,bidang,nama,nama_en,urutan,aktif').order('bidang').order('urutan')]);
  if (!rb.error && !rt.error && (rt.data || []).length) {
    BAKU = { bidang: rb.data.filter(b => b.aktif), topik: rt.data.filter(t => t.aktif) };
    setelNamaTopik(rt.data);
  }
  // MK yang ditugaskan admin di Data prodi › Kurikulum (pengampu = NIDN); gagal baca = blok tidak tampil.
  const rMk = await sb.from('ref_mata_kuliah').select('kode,nama,sks,pengampu,aktif');
  MK_PRODI = rMk.error ? null : mkDiampu(saya, rMk.data);
  pasangMenu(sb);
  $('hSub').textContent = `Masuk sebagai ${saya.nama}`;
  await gambar();
}

async function gambar(){
  const { data: aj, error } = await sb.from('ajuan_ubah')
    .select('id,data,lama,status,alasan,catatan_admin,dibuat_pada')
    .eq('jenis', 'profil').eq('dosen_id', SAYA.id).order('dibuat_pada', { ascending: false });
  const tunggu = (aj || []).find(a => a.status === 'menunggu');
  const tolak = (aj || []).find(a => a.status === 'ditolak');

  $('isi').innerHTML = `
    <div class="b"><h2>Data akun</h2>
      <p class="ket">Diisi admin prodi dan tidak bisa diubah di sini. Bila salah, hubungi admin.</p>
      <div class="tetap">
        <div><span>Email</span>${esc(SAYA.email)}</div>
        <div><span>NIDN / kode</span>${esc(SAYA.nidn)}</div>
        <div><span>Peran</span>${esc(PERAN[SAYA.peran] || SAYA.peran)}</div>
      </div></div>
    <div class="b"><h2>CV saya</h2>
      <p class="ket">CV akademik dalam Word (.docx), disusun dari profil ini dan karya Anda yang sudah diverifikasi prodi.
        Bisa disunting sebelum dipakai untuk hibah, SISTER, atau kenaikan jabatan.</p>
      ${htmlTombolCV('saya')}</div>
    ${error ? `<div class="info tolak">Ajuan perubahan belum tersedia (${esc(error.message)}).
      Admin perlu menjalankan supabase/20-patch-ajuan-ubah.sql.</div>` : ''}
    ${tolak ? `<div class="info tolak"><b>Ajuan perubahan Anda ditolak admin.</b>
      Alasan: ${esc(tolak.catatan_admin || '-')}${tabelBeda(tolak.data, tolak.lama)}
      <div class="aksi"><button class="btn ghost" id="tutup">Tutup pemberitahuan</button></div></div>` : ''}
    ${tunggu ? `<div class="info"><b>Ajuan perubahan menunggu persetujuan admin</b>
      (dikirim ${esc(String(tunggu.dibuat_pada).slice(0, 10))}). Data di bawah berlaku setelah disetujui.
      ${tabelBeda(tunggu.data, tunggu.lama)}
      <div class="aksi"><button class="btn ghost" id="batalAjuan">Batalkan ajuan</button></div></div>` : ''}
    <div class="b"><h2>Data profil</h2>
      <p class="ket">Perubahan dikirim sebagai ajuan dan berlaku setelah disetujui admin prodi.
        Untuk SINTA/Scopus/ORCID boleh menempel tautan profilnya; ID-nya diambil otomatis.</p>
      <div class="grid">
        <div class="fld penuh"><label>Nama lengkap <span class="wj">*</span></label><input id="f_nama" value="${esc(SAYA.nama)}">
          <small>Lengkap dengan gelar, sesuai SK; tampil di situs dan laporan.</small></div>
        <div class="fld"><label>Pendidikan tertinggi</label><input value="${esc(SAYA.pendidikan || '—')}" disabled>
          <small>${ADA_LKPS ? 'Dihitung dari riwayat pendidikan di bawah.' : 'Diubah admin.'}</small></div>
        <div class="fld"><label>Jabatan akademik</label><select id="f_jabatan">${opsi(JABATAN, SAYA.jabatan)}</select></div>
        <div class="fld"><label>SINTA ID</label><input id="f_sinta_id" value="${esc(SAYA.sinta_id)}"></div>
        <div class="fld"><label>Scopus ID</label><input id="f_scopus_id" value="${esc(SAYA.scopus_id)}"></div>
        <div class="fld"><label>ORCID</label><input id="f_orcid" value="${esc(SAYA.orcid)}"></div>
        ${ADA_ALT ? `<div class="fld penuh"><label>Email alternatif untuk login</label><input id="f_email_alternatif" type="email"
          value="${esc(SAYA.email_alternatif)}" placeholder="mis. nama@gmail.com" autocomplete="email">
          <small>Dipakai bila tautan masuk tidak sampai ke email kampus: masukkan email ini di halaman masuk.
          Hanya untuk login; data Anda tetap atas email kampus. Kosongkan untuk menghapus.</small></div>` : ''}
        ${BAKU ? `<div class="fld penuh"><label>Topik keahlian <span class="ket" id="hitungTopik"></span></label>
          <div class="pilih-topik-kotak" id="pilihTopik">${htmlPilihTopik(BAKU.bidang, BAKU.topik, SAYA.topik_keahlian)}</div>
          <small>Pilih topik dari daftar keahlian prodi (paling banyak ${MAKS_TOPIK}); boleh dari beberapa bidang. Nama Indonesia dan
          Inggris sudah ada, tidak perlu ditulis dua kali. Tampil di <a href="keahlian.html">Kepakaran dosen</a> dan dipakai untuk
          usulan tim hibah serta pembimbing TA.</small></div>` : ''}
        <div class="fld penuh"><label>Kata kunci tambahan${BAKU ? ' (opsional)' : ''}</label><input id="f_kata_kunci" value="${esc((SAYA.kata_kunci || []).join(', '))}"
          placeholder="${BAKU ? 'Istilah yang belum ada di daftar, mis. GSMaP, FEWS' : 'Contoh: banjir, hidrologi, prakiraan hujan, GSMaP'}">
          <small>${BAKU ? 'Untuk istilah khusus yang tidak ada di daftar topik; admin bisa menjadikannya topik baru. '
            : '3–10 kata kunci, pisahkan dengan koma. '}Pisahkan dengan koma, paling banyak 10.</small></div>
      </div>
      ${ADA_LKPS ? `<h2 style="margin-top:18px">Profil untuk LKPS (Tabel 4.a)</h2>
        <p class="ket">Dipakai untuk mengisi LKPS dan LED. Kategori dosen dan penilaian kesesuaian diisi admin prodi.</p>
        ${formLKPS(SAYA, { mkProdi: MK_PRODI })}` : `<div class="info">Isian profil LKPS (riwayat pendidikan, keahlian, sertifikat)
        belum tersedia: admin perlu menjalankan supabase/22-patch-profil-dosen.sql.</div>`}
      <div class="grid" style="margin-top:14px">
        <div class="fld penuh"><label>Keterangan untuk admin</label><input id="f_alasan"
          placeholder="Contoh: SK jabatan lektor terbit Oktober 2026">
          <small>Opsional; membantu admin memeriksa.</small></div>
      </div>
      <div class="aksi"><button class="btn" id="kirim"${tunggu || error ? ' disabled' : ''}>Kirim ajuan</button>
        <span class="msg" id="pesan">${tunggu ? 'Masih ada ajuan yang menunggu.' : ''}</span></div></div>`;

  if (ADA_LKPS) pasangEditor($('isi'), String(window.UPLOAD_URL || '').trim() ? { unggah: unggahBuktiProfil } : {});
  if (BAKU && $('pilihTopik')) {
    // Penghitung per bidang dan batas MAKS_TOPIK (sama dengan rapikan_topik_keahlian di patch 61).
    const hitung = () => {
      const xs = [...$('pilihTopik').querySelectorAll('[data-topik]:checked')];
      $('hitungTopik').textContent = `· ${xs.length} dari ${MAKS_TOPIK} dipilih`;
      $('pilihTopik').querySelectorAll('[data-hitung-bidang]').forEach(el => {
        const n = xs.filter(c => c.dataset.bidang === el.dataset.hitungBidang).length;
        el.textContent = n ? `· ${n} dipilih` : '';
      });
    };
    $('pilihTopik').addEventListener('change', e => {
      if (e.target.checked && $('pilihTopik').querySelectorAll('[data-topik]:checked').length > MAKS_TOPIK) {
        e.target.checked = false; alert(`Paling banyak ${MAKS_TOPIK} topik.`);
      }
      hitung();
    });
    hitung();
  }
  if (tolak) $('tutup').onclick = () => hapusAjuan(tolak.id, null);
  if (tunggu) $('batalAjuan').onclick = () => hapusAjuan(tunggu.id, 'Batalkan ajuan perubahan profil?');
  if (!tunggu && !error) $('kirim').onclick = kirim;
}

async function hapusAjuan(id, tanya){
  if (tanya && !confirm(tanya)) return;
  const { error } = await sb.from('ajuan_ubah').delete().eq('id', id);
  if (error) alert('Gagal: ' + error.message);
  await gambar();
}

async function kirim(){
  const v = k => $('f_' + k).value.trim();
  const baru = {
    nama: v('nama'), jabatan: v('jabatan') || null,
    sinta_id: idSaja(v('sinta_id')) || null, scopus_id: idSaja(v('scopus_id')) || null,
    orcid: idSaja(v('orcid')) || null,
    ...(ADA_LKPS ? bacaFormLKPS(SAYA.pendidikan) : {}),
    ...(ADA_LKPS ? { kata_kunci: bacaKataKunci(v('kata_kunci')) } : {}),
    ...(ADA_ALT ? { email_alternatif: v('email_alternatif').toLowerCase() || null } : {}),
    ...(BAKU && $('pilihTopik') ? { topik_keahlian: bacaPilihTopik($('pilihTopik')) } : {}),
  };
  if (!baru.nama) return tulis('buruk', 'Nama wajib diisi.');
  if (baru.email_alternatif && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(baru.email_alternatif)) return tulis('buruk', 'Email alternatif tidak sah.');
  if (baru.email_alternatif && baru.email_alternatif === String(SAYA.email).toLowerCase()) return tulis('buruk', 'Email alternatif sama dengan email kampus.');
  const kk = v('kata_kunci').split(/[,;\n]+/).map(x => x.trim()).filter(Boolean);
  if (kk.some(x => x.length > 60)) return tulis('buruk', 'Tiap kata kunci paling panjang 60 karakter.');
  if (kk.length > 10 && !confirm('Kata kunci lebih dari 10; hanya 10 pertama yang disimpan. Lanjutkan?')) return;
  const data = {}, lama = {};
  ISIAN.forEach(([k]) => {
    if (k in baru && !sama(baru[k], SAYA[k])) { data[k] = baru[k]; lama[k] = SAYA[k] ?? null; }
  });
  if (!Object.keys(data).length) return tulis('buruk', 'Tidak ada isian yang berubah.');
  const ingat = Object.entries(POLA)
    .filter(([k, [re]]) => data[k] && !re.test(data[k]))
    .map(([k, [, ket]]) => `${k} (${ket})`);
  if (ingat.length && !confirm(`Format ${ingat.join(', ')} tidak sesuai; tautan profil mungkin tidak berfungsi. Tetap kirim?`)) return;

  $('kirim').disabled = true;
  const { error } = await sb.from('ajuan_ubah').insert({
    jenis: 'profil', dosen_id: SAYA.id, data, lama, alasan: v('alasan') || null, oleh: SAYA.id });
  if (error) {
    $('kirim').disabled = false;
    return tulis('buruk', error.code === '23505' ? 'Masih ada ajuan yang menunggu.' : 'Gagal mengirim: ' + error.message);
  }
  await gambar();
  tulis('ok', 'Ajuan terkirim. Admin prodi akan meninjaunya.');
}

function layarMasuk(){
  $('hSub').textContent = 'Perlu masuk';
  $('isi').innerHTML = `<div class="masuk"><p>Masukkan email kampus Anda — tautan masuk dikirim tanpa kata sandi.</p>
    <input id="em" type="email" placeholder="nama@kampus.ac.id" autocomplete="email">
    <button class="btn" id="kirimMasuk">Kirim tautan masuk</button><p class="ket" id="pesan"></p></div>`;
  $('kirimMasuk').onclick = async () => {
    const em = $('em').value.trim();
    if (!em) return;
    const { error } = await sb.auth.signInWithOtp({ email: em, options: { emailRedirectTo: location.href } });
    $('pesan').textContent = error ? 'Gagal: ' + error.message : 'Tautan masuk sudah dikirim. Periksa email Anda.';
  };
}

sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_IN' && !SAYA) mulai(); });
mulai().catch(e => { $('isi').innerHTML = `<p class="kosong">${esc(e.message)}</p>`; });
</script>
