addEventListener('error', function (e) {
  if (document.getElementById('galat-muat')) return;
  var d = document.createElement('div');
  d.id = 'galat-muat';
  d.style.cssText = 'margin:16px;padding:12px 14px;border:1px solid var(--merah);' +
    'background:var(--merah-m3);color:var(--ink);font:14px/1.5 system-ui,sans-serif';
  d.textContent = 'Halaman gagal dimuat: ' + (e.message || 'galat skrip') +
    '. Tekan Ctrl+Shift+R untuk memuat ulang tanpa cache; bila tetap muncul, kirim pesan ini ke admin.';
  document.body.insertBefore(d, document.body.firstChild);
});

<script type="module">
// Rekap seminar proposal, seminar kemajuan, dan sidang akhir (94-patch-jadwal-ta.sql, pemilik 2026-11-17): jumlah per tahap
// dan beban membimbing/menguji per dosen pada periode terpilih (TS, 3 TS, tahun). Sumber: jadwal_ta (semua pengguna login
// membaca). Unduh Excel khusus admin (memuat NIM).
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/+esm';
import { gerbang } from './menu.js?v=2026-11-27-7c5f44';
import { pasangTab } from './tab-seksi.js?v=2026-11-27-7c5f44';   // susunan bertab (pemilik 2026-11-25)
import { punya } from './koordinator.js?v=2026-11-27-7c5f44';
import { TAHAP, STATUS, waktuJadwal, rekapTA, lembarTA, revisiBerjalan } from './rekap-ta.js?v=2026-11-27-7c5f44';
import { opsiPeriode, cocokPeriode, labelPeriode, taTeks, tsKarya, tsBerjalan } from './sdgs-unduh.js?v=2026-11-27-7c5f44';
import { barisKuota } from './rekap-kp.js?v=2026-11-27-7c5f44';
import { semesterTA, kunciSemester, teksSemester, geserSemester, TAHAP_PERINGATAN, teksPeringatanTA, BATAS_KEMIRIPAN, HASIL_TA } from './pengajuan-mhs.js?v=2026-11-27-7c5f44';
import { SHEETJS } from './nilai-cpl.js?v=2026-11-27-7c5f44';

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = id => document.getElementById(id);
const sb = createClient(window.SB_URL, window.SB_KEY);
let SAYA = null, ADMIN = false, KOOR = false, BARIS = [], DOSEN = {}, PERIODE = '';
const dgWaktu = r => ({ ...r, ...waktuJadwal(r) });
const tsTeks = r => { const t = tsKarya(waktuJadwal(r)); return t ? taTeks(t) : ''; };

function gambar(){
  const xs = BARIS.map(dgWaktu).filter(r => cocokPeriode(r, PERIODE));
  const r = rekapTA(xs, DOSEN), kini = new Date().toISOString().slice(0, 10);
  const akan = xs.filter(x => x.tanggal >= kini && x.status !== 'batal').sort((a, b) => String(a.tanggal).localeCompare(String(b.tanggal)));
  const nm = v => (Array.isArray(v) ? v : []).map(n => DOSEN[n] || n).join(', ');
  $('ringkas').innerHTML = TAHAP.map(([k, l]) => `<div><b>${r.tahap[k].selesai} / ${r.tahap[k].semua}</b><span>${esc(l)}: selesai / semua</span></div>`).join('')
    + `<div><b>${r.dosen.length}</b><span>dosen terlibat</span></div>`;
  if ($('beban')) $('beban').innerHTML = r.dosen.length ? `<div class="lebar-tabel"><table><thead><tr><th>Dosen</th><th class="n">Membimbing</th>${TAHAP.map(([, l]) =>
      `<th class="n">${esc(l)}</th>`).join('')}<th class="n">Menguji</th>${TAHAP.map(([, l]) => `<th class="n">${esc(l)}</th>`).join('')}</tr></thead>
    <tbody>${r.dosen.map(d => `<tr><td>${esc(d.nama)}</td><td class="n">${d.bimbing}</td>${TAHAP.map(([k]) => `<td class="n">${d['bimbing_' + k]}</td>`).join('')}
      <td class="n">${d.uji}</td>${TAHAP.map(([k]) => `<td class="n">${d['uji_' + k]}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`
    : '<p class="kosong">Belum ada jadwal pada periode ini.</p>';
  $('akan').innerHTML = akan.length ? `<div class="lebar-tabel"><table><thead><tr><th>Tanggal</th><th>Tahap</th><th>Mahasiswa</th><th>Judul</th><th>Pembimbing</th><th>Penguji</th><th>Ruang</th></tr></thead>
    <tbody>${akan.map(x => `<tr><td>${esc(x.tanggal)}${x.jam ? '<br>' + esc(x.jam) : ''}</td><td>${esc((TAHAP.find(t => t[0] === x.tahap) || [, ''])[1])}${
      x.status !== 'terjadwal' ? `<br><b>${esc(STATUS[x.status] || x.status)}</b>` : ''}</td><td>${esc(x.nama_mahasiswa)}</td><td>${esc(x.judul)}</td>
      <td>${esc([nm(x.pembimbing), x.pembimbing_luar].filter(Boolean).join(', '))}</td><td>${esc([nm(x.penguji), x.penguji_luar].filter(Boolean).join(', '))}</td><td>${esc(x.ruang || (x.tautan_daring ? 'daring' : ''))}</td></tr>`).join('')}</tbody></table></div>`
    : '<p class="kosong">Tidak ada jadwal mendatang pada periode ini.</p>';
  gambarRevisi();
  if (ADMIN) { $('unduh').disabled = !xs.length; $('unduh').onclick = () => unduh(xs); }
}

// Revisi setelah seminar/sidang (95): semua periode; pembimbing mahasiswa itu atau admin menandai selesai.
function gambarRevisi(){
  const xs = revisiBerjalan(BARIS), nidn = SAYA?.nidn;
  const nm = v => (Array.isArray(v) ? v : []).map(n => DOSEN[n] || n).join(', ');
  $('revisiIsi').innerHTML = xs.length ? `<div class="lebar-tabel"><table><thead><tr><th>Batas</th><th>Mahasiswa</th><th>Tahap / judul</th>
      <th>Pembimbing</th><th>Catatan</th><th></th></tr></thead><tbody>${xs.map(r => `<tr><td>${esc(r.batas_revisi || 'belum diisi')}${
      r.hari == null ? '' : `<br><span class="${r.hari < 0 ? 'lewat' : 'ket'}">${r.hari < 0 ? `lewat ${-r.hari} hari` : r.hari === 0 ? 'hari ini' : `${r.hari} hari lagi`}</span>`}</td>
      <td>${esc(r.nama_mahasiswa)}</td><td>${esc((TAHAP.find(t => t[0] === r.tahap) || [, ''])[1])}<br><span class="ket">${esc(r.judul)}</span></td>
      <td>${esc(nm(r.pembimbing))}</td><td class="ket">${esc(r.catatan_revisi || '')}</td>
      <td>${ADMIN || (nidn && (r.pembimbing || []).includes(nidn)) ? `<button type="button" class="b kecil" data-revisi="${r.id}">Tandai selesai</button>` : ''}</td></tr>`).join('')}</tbody></table></div>`
    : '<p class="kosong">Tidak ada revisi yang belum selesai.</p>';
  document.querySelectorAll('[data-revisi]').forEach(b => { b.onclick = async () => {
    if (!confirm('Nyatakan revisi mahasiswa ini selesai?')) return;
    b.disabled = true;
    const { data, error } = await sb.rpc('ta_revisi_selesai', { p_id: +b.dataset.revisi, p_selesai: true });
    if (error) { alert(error.message); b.disabled = false; return; }
    const r = BARIS.find(x => x.id === +b.dataset.revisi); if (r) r.revisi_selesai = data;
    gambarRevisi();
  }; });
}

async function unduh(xs){
  const b = $('unduh'); b.disabled = true;
  try {
    const X = await import(SHEETJS), wb = X.utils.book_new(), L = lembarTA(xs, DOSEN, tsTeks);
    for (const [nama, baris] of Object.entries(L)) {
      const ws = X.utils.aoa_to_sheet(baris);
      ws['!cols'] = baris[0].map((_, j) => ({ wch: Math.min(60, Math.max(8, ...baris.slice(0, 200).map(r => String(r[j] ?? '').length))) }));
      X.utils.book_append_sheet(wb, ws, nama);
    }
    const ket = X.utils.aoa_to_sheet([['Rekap seminar/sidang TA'], ['Periode', labelPeriode(PERIODE)], ['Diunduh', new Date().toLocaleString('id-ID')],
      ['Catatan', 'Beban dihitung dari semua jadwal yang tidak batal (terjadwal dan selesai). Memuat NIM: untuk keperluan internal.']]);
    ket['!cols'] = [{ wch: 12 }, { wch: 90 }];
    X.utils.book_append_sheet(wb, ket, 'Keterangan');
    const [j, n] = (PERIODE || '').split(':');
    X.writeFile(wb, `rekap-ta-${!PERIODE ? 'semua' : j === 'th' ? n : j === 'ts' ? `TS${n - 1}-${n}` : `TS${n - 3}-${n}`}.xlsx`);
  } catch (e) { alert('Unduh gagal: ' + (e.message || e)); }
  finally { b.disabled = false; }
}

// Kuota pembimbing 1 TA per semester (180-patch-kuota-ta-semester.sql, pemilik 2026-11-25; sebelumnya per TS, 110).
// Semua staf melihat; koordinator TA/admin (ADMIN) mengubah kuota bawaan dan kuota per dosen. Beban = penetapan baru
// semester itu; mahasiswa lama yang belum lulus (dibimbing) tidak mengurangi kuota.
const SMT_KINI = semesterTA(new Date().toISOString());
let SMT_KUOTA = SMT_KINI, KUOTA = null;
async function muatKuota(){
  const { data, error } = await sb.rpc('ta_beban', { p_ts: SMT_KUOTA.ts, p_sm: SMT_KUOTA.sm });
  KUOTA = error ? null : barisKuota(data);
}
function tulisKuota(k, t){ const m = $('mKuota'); if (m) { m.className = 'msg ' + k; m.textContent = t; } }
function gambarKuota(){
  const el = $('kuota'); if (!el) return;
  if (!KUOTA) { el.innerHTML = '<p class="kosong">Kuota belum tersedia (jalankan supabase/180-patch-kuota-ta-semester.sql).</p>'; return; }
  const bawaan = KUOTA.find(r => !r.kuota_sendiri)?.kuota ?? null;
  const pilih = new Map([-2, -1, 0, 1, 2].map(n => geserSemester(SMT_KINI, n)).concat([SMT_KUOTA]).map(s => [kunciSemester(s), s]));
  const urut = [...pilih.values()].sort((a, b) => kunciSemester(a).localeCompare(kunciSemester(b)));
  el.innerHTML = `<div class="saring"><label>Semester <select id="kTS">${urut.map(s => `<option value="${kunciSemester(s)}"${kunciSemester(s) === kunciSemester(SMT_KUOTA)
    ? ' selected' : ''}>${teksSemester(s)}</option>`).join('')}</select></label>
    ${ADMIN ? `<label>Kuota bawaan semua dosen <input id="kBawaan" type="number" min="0" max="100" style="width:5em" value="${bawaan ?? ''}"
      placeholder="—"></label><button type="button" class="b" id="kSimpanBawaan">Simpan</button>` : ''}<span class="msg" id="mKuota"></span></div>
    <p class="ket">Kuota per semester. Beban = pengajuan pembimbing TA (sebagai pembimbing 1) yang diajukan pada semester ${teksSemester(SMT_KUOTA)};
      draf dan pengajuan yang ditolak tidak dihitung. Mahasiswa yang masih dibimbing dari semester sebelumnya (belum lulus) tidak mengurangi kuota.
      Bila pembimbing diganti (bimbingan dibatalkan), beban tetap pada pembimbing pertama, jadi kuota dosen pengganti tidak berkurang.
      Kuota tidak memblokir: koordinator TA diberi peringatan saat menetapkan pembimbing yang kuotanya penuh.
      ${ADMIN ? 'Kosongkan kuota seorang dosen untuk kembali ke kuota bawaan.' : ''}</p>
    <div class="lebar-tabel"><table><thead><tr><th>Dosen</th><th>KK</th><th class="n">Kuota</th><th class="n">Beban semester ini</th><th class="n">Sisa</th><th class="n">Masih dibimbing</th></tr></thead>
    <tbody>${KUOTA.map(r => `<tr><td>${esc(r.nama)}${r.lebih ? ' <span class="tag tinggi">penuh</span>' : ''}</td><td>${esc(r.kk || '—')}</td>
      <td class="n">${ADMIN ? `<input type="number" min="0" max="100" style="width:5em" data-kuota="${r.dosen_id}" value="${r.kuota_sendiri ? r.kuota : ''}"
          placeholder="${r.kuota ?? '—'}" aria-label="Kuota ${esc(r.nama)}">` : (r.kuota ?? '—')}${r.kuota_sendiri && !ADMIN ? '*' : ''}</td>
      <td class="n">${r.beban}</td><td class="n">${r.sisa ?? '—'}</td><td class="n">${r.dibimbing ?? 0}</td></tr>`).join('')}</tbody></table></div>
    ${ADMIN ? '<p class="ket">Kuota per dosen tersimpan saat kolomnya ditinggalkan (Tab/klik di luar).</p>' : '<p class="ket">* kuota khusus dosen itu.</p>'}`;
  $('kTS').onchange = async e => { SMT_KUOTA = pilih.get(e.target.value) || SMT_KINI; await muatKuota(); gambarKuota(); };
  if (!ADMIN) return;
  const simpan = async (dosen, v) => {
    const n = String(v).trim() === '' ? null : Math.round(+v);
    if (n !== null && !(n >= 0 && n <= 100)) { tulisKuota('err', 'Kuota 0 sampai 100.'); return; }
    const { error } = await sb.rpc('ta_atur_kuota', { p_ts: SMT_KUOTA.ts, p_sm: SMT_KUOTA.sm, p_dosen: dosen, p_kuota: n });
    if (error) { tulisKuota('err', error.message); return; }
    await muatKuota(); gambarKuota(); tulisKuota('ok', 'Kuota tersimpan.');
  };
  $('kSimpanBawaan').onclick = () => simpan(null, $('kBawaan').value);
  el.querySelectorAll('[data-kuota]').forEach(i => { i.onchange = () => simpan(i.dataset.kuota, i.value); });
}

// Peringatan dini TA (183-patch-peringatan-pengingat-ta.sql, pemilik 2026-11-26): mahasiswa TA aktif yang bimbingannya
// berhenti, terlalu lama di satu tahap, atau revisinya lewat batas. Koordinator TA/admin melihat semua dan mengatur ambang;
// dosen lain melihat mahasiswa bimbingannya sendiri (penyaringan di SQL). PERINGATAN = null: patch 183 belum ada.
let PERINGATAN = null, TAB = null, AMBANG = {};
async function muatPeringatan(){
  const [r, a] = await Promise.all([sb.rpc('ta_peringatan_dini'),
    sb.from('pengaturan').select('kunci,nilai').in('kunci', ['ta_peringatan_bimbingan_hari', 'ta_peringatan_tahap_hari'])]);
  PERINGATAN = r.error ? null : (r.data || []);
  AMBANG = Object.fromEntries((a.data || []).map(x => [x.kunci, +x.nilai]));
}
function gambarPeringatan(){
  const el = $('peringatan'); if (!el) return;
  if (!PERINGATAN) { el.innerHTML = '<p class="kosong">Peringatan dini belum tersedia (jalankan supabase/183-patch-peringatan-pengingat-ta.sql).</p>'; return; }
  TAB?.angka(TAB.panel.findIndex(p => p.contains(el)), PERINGATAN.length);
  const ab = AMBANG.ta_peringatan_bimbingan_hari ?? PERINGATAN[0]?.ambang_bimbingan ?? 60;
  const at = AMBANG.ta_peringatan_tahap_hari ?? PERINGATAN[0]?.ambang_tahap ?? 180;
  el.innerHTML = `<p class="ket">Mahasiswa TA aktif (pembimbing sudah ditetapkan, sidang akhir belum tuntas) yang perlu disapa: tidak ada catatan
      bimbingan lebih dari ${ab} hari, lebih dari ${at} hari sejak tahap terakhir, atau revisinya lewat batas. Dua yang pertama
      tidak muncul bila tahap berikutnya sedang diperiksa atau terjadwal. ${ADMIN ? '' : 'Anda melihat mahasiswa bimbingan Anda sendiri.'}</p>
    ${ADMIN ? `<div class="saring"><label>Hari tanpa bimbingan <input id="pdB" type="number" min="14" max="365" style="width:5em" value="${ab}"></label>
      <label>Hari di satu tahap <input id="pdT" type="number" min="30" max="730" style="width:5em" value="${at}"></label>
      <button type="button" class="b" id="pdSimpan">Simpan ambang</button><span class="msg" id="mPd" role="status"></span></div>` : ''}
    ${PERINGATAN.length ? `<div class="lebar-tabel"><table><thead><tr><th>Mahasiswa</th><th>Pembimbing</th><th>Tahap</th><th>Peringatan</th></tr></thead>
      <tbody>${PERINGATAN.map(r => `<tr><td>${esc(r.nama)}<div class="ket">${esc(r.nim)}${r.judul ? ' · ' + esc(r.judul) : ''}</div></td>
        <td>${esc(r.pembimbing || '—')}</td><td>${esc(TAHAP_PERINGATAN[r.tahap] || r.tahap)}</td>
        <td>${teksPeringatanTA(r).map(t => `<div>${esc(t)}</div>`).join('')}</td></tr>`).join('')}</tbody></table></div>`
      : '<p class="kosong">Tidak ada mahasiswa yang perlu diperingatkan.</p>'}`;
  if (!ADMIN) return;
  $('pdSimpan').onclick = async () => {
    const m = $('mPd');
    const { error } = await sb.rpc('ta_peringatan_atur', { p_bimbingan: Math.round(+$('pdB').value), p_tahap: Math.round(+$('pdT').value) });
    if (error) { m.className = 'msg err'; m.textContent = error.message; return; }
    await muatPeringatan(); gambarPeringatan(); const m2 = $('mPd'); if (m2) { m2.className = 'msg ok'; m2.textContent = 'Ambang tersimpan.'; }
  };
}

// Penanda Metopen (185, pemilik 2026-11-26): seminar proposal sebagai nilai UAS Metodologi Penelitian. Daftar ta_metopen()
// per semester (dari tanggal pendaftaran, WIB) dengan nilai akhir setelah berita acara ditetapkan; diunduh dosen Metopen.
let METOPEN = null, SM_METOPEN = '';
async function muatMetopen(){
  const { data, error } = await sb.rpc('ta_metopen');
  METOPEN = error ? null : (data || []);
}
const LABEL_AJU = { draf: 'Draf', pembimbing: 'Diperiksa pembimbing', admin: 'Menunggu jadwal', disetujui: 'Terjadwal', dikembalikan: 'Dikembalikan' };
function barisMetopen(r){
  return { ...r, semester: kunciSemester(semesterTA(r.dibuat)),
    keadaan: r.hasil ? (HASIL_TA[r.hasil] || r.hasil) : r.status_jadwal === 'terjadwal' ? 'Terjadwal' : r.status_jadwal === 'selesai' ? 'Menunggu hasil'
      : LABEL_AJU[r.status] || r.status,
    nilai: r.ba_ditetapkan && r.nilai_akhir != null ? Number(r.nilai_akhir) : null };
}
function gambarMetopen(){
  const el = $('metopenIsi'); if (!el) return;
  if (!METOPEN) { el.innerHTML = '<p class="kosong">Belum tersedia (jalankan supabase/185-patch-kemiripan-seminar-ulang-metopen.sql).</p>'; return; }
  const semua = METOPEN.map(barisMetopen), sms = [...new Set(semua.map(r => r.semester).filter(Boolean))].sort().reverse();
  if (!sms.includes(SM_METOPEN)) SM_METOPEN = sms[0] || '';
  const xs = semua.filter(r => r.semester === SM_METOPEN);
  const teksSm = k => { const [ts, sm] = k.split(' '); return teksSemester({ ts: +ts, sm }); };
  el.innerHTML = `<p class="ket">Seminar proposal yang ditandai mahasiswa sebagai bagian dari MK Metodologi Penelitian. Jalurnya sama dengan
      seminar proposal lain; nilai akhir tampil setelah berita acara ditetapkan dan bisa dipakai sebagai nilai UAS Metopen.</p>
    ${sms.length ? `<div class="saring"><label>Semester <select id="mtSm">${sms.map(k => `<option value="${esc(k)}"${k === SM_METOPEN ? ' selected' : ''}>${esc(teksSm(k))}</option>`).join('')}</select></label>
      <button type="button" class="b" id="mtUnduh"${xs.length ? '' : ' disabled'}>Unduh Excel</button></div>` : ''}
    ${xs.length ? `<div class="lebar-tabel"><table><thead><tr><th>Mahasiswa</th><th>Judul</th><th>Pembimbing</th><th>Seminar</th><th>Keadaan</th><th class="n">Nilai akhir</th></tr></thead>
      <tbody>${xs.map(r => `<tr><td>${esc(r.nama)}<div class="ket">${esc(r.nim)}</div></td><td>${esc(r.judul)}</td><td>${esc(r.pembimbing || '—')}</td>
        <td>${esc(r.tanggal || '—')}</td><td>${esc(r.keadaan)}</td><td class="n">${r.nilai == null ? '—' : esc(r.nilai.toFixed(2))}</td></tr>`).join('')}</tbody></table></div>`
      : '<p class="kosong">Belum ada seminar proposal bertanda Metopen.</p>'}`;
  TAB?.angka(TAB.panel.findIndex(p => p.contains(el)), xs.length);
  if ($('mtSm')) $('mtSm').onchange = e => { SM_METOPEN = e.target.value; gambarMetopen(); };
  if ($('mtUnduh')) $('mtUnduh').onclick = async () => {
    try {
      const X = await import(SHEETJS), wb = X.utils.book_new();
      const ws = X.utils.aoa_to_sheet([['NIM', 'Nama', 'Judul', 'Pembimbing', 'Tanggal seminar', 'Keadaan', 'Nilai akhir'],
        ...xs.map(r => [r.nim, r.nama, r.judul, r.pembimbing || '', r.tanggal || '', r.keadaan, r.nilai ?? ''])]);
      ws['!cols'] = [12, 28, 60, 36, 14, 18, 10].map(wch => ({ wch }));
      X.utils.book_append_sheet(wb, ws, 'Metopen');
      X.writeFile(wb, `metopen-proposal-${SM_METOPEN.replace(' ', '-')}.xlsx`);
    } catch (e) { alert('Unduh gagal: ' + (e.message || e)); }
  };
}

// Batas kemiripan sidang akhir (185): koordinator TA/admin.
async function gambarBatasKemiripan(){
  const el = $('batasKm'); if (!el) return;
  const r = await sb.rpc('ta_kemiripan_batas');
  if (r.error) { el.innerHTML = ''; return; }
  el.innerHTML = `<div class="saring"><label>Batas kemiripan laporan akhir (sidang akhir)
      <input id="kmBatas" type="number" min="1" max="100" step="0.5" style="width:5em" value="${esc(r.data ?? BATAS_KEMIRIPAN)}"> %</label>
    <button type="button" class="b" id="kmSimpan">Simpan batas</button><span class="msg" id="mKm" role="status"></span></div>
    <p class="ket">Mahasiswa tidak bisa mendaftar sidang akhir bila persen kemiripannya di atas batas ini; pembimbing 1, koordinator TA,
      atau admin memeriksa laporannya sebelum pendaftaran diteruskan atau dijadwalkan.</p>`;
  $('kmSimpan').onclick = async () => {
    const m = $('mKm');
    const { error } = await sb.rpc('ta_kemiripan_atur', { p_batas: +$('kmBatas').value });
    m.className = 'msg ' + (error ? 'err' : 'ok'); m.textContent = error ? error.message : 'Batas tersimpan.';
  };
}

// Urutan tahap TA (172-patch-urutan-tahap-ta.sql, pemilik 2026-11-25): kemajuan setelah proposal lulus + revisi selesai,
// sidang setelah kemajuan. Koordinator TA/admin mengecualikan satu mahasiswa untuk satu tahap dengan alasan tercatat.
const TAHAP_KECUALI = [['seminar_kemajuan', 'Seminar kemajuan'], ['sidang_akhir', 'Sidang akhir']];
let KECUALI = null;
async function muatKecuali(){
  const { data, error } = await sb.from('ta_kecuali_urutan').select('*').order('dibuat', { ascending: false });
  KECUALI = error ? null : (data || []);
}
function tulisKecuali(k, t){ const m = $('mKecuali'); if (m) { m.className = 'msg ' + k; m.textContent = t; } }
function gambarKecuali(){
  const el = $('kecuali'); if (!el) return;
  if (!KECUALI) { el.innerHTML = '<p class="kosong">Belum tersedia (jalankan supabase/172-patch-urutan-tahap-ta.sql).</p>'; return; }
  const nmT = k => (TAHAP_KECUALI.find(t => t[0] === k) || [, k])[1];
  el.innerHTML = `<p class="ket">Mahasiswa hanya bisa mengirim pendaftaran seminar kemajuan setelah seminar proposalnya lulus dan revisinya
      dinyatakan selesai, dan sidang akhir setelah seminar kemajuan. Untuk mahasiswa yang sudah melalui tahap itu sebelum pendaftaran lewat situs,
      catat seminar lamanya di Data prodi › Jadwal seminar/sidang TA (dengan NIM), atau beri pengecualian di sini dengan alasannya.</p>
    <div class="saring"><label>NIM <input id="kNim" maxlength="30" style="width:9em"></label>
      <label>Tahap yang boleh didaftarkan <select id="kTahap">${TAHAP_KECUALI.map(([v, l]) => `<option value="${v}">${esc(l)}</option>`).join('')}</select></label>
      <label style="flex:1 1 260px">Alasan <input id="kAlasan" maxlength="500" style="width:100%" placeholder="mis. seminar kemajuan 2025, sebelum pendaftaran lewat situs"></label>
      <button type="button" class="b" id="kCatat">Catat pengecualian</button><span class="msg" id="mKecuali"></span></div>
    ${KECUALI.length ? `<div class="lebar-tabel"><table><thead><tr><th>NIM</th><th>Tahap</th><th>Alasan</th><th>Dicatat</th><th></th></tr></thead>
      <tbody>${KECUALI.map(r => `<tr><td>${esc(r.nim)}</td><td>${esc(nmT(r.tahap))}</td><td>${esc(r.alasan)}</td>
        <td class="ket">${esc(r.oleh || '')}<br>${esc(String(r.dibuat || '').slice(0, 10))}</td>
        <td><button type="button" class="b kecil" data-hapus-kecuali="${esc(r.nim)}|${esc(r.tahap)}">Hapus</button></td></tr>`).join('')}</tbody></table></div>`
      : '<p class="kosong">Belum ada pengecualian.</p>'}`;
  const kirim = async (nim, tahap, alasan, pesan) => {
    const { error } = await sb.rpc('ta_kecualikan_urutan', { p_nim: nim, p_tahap: tahap, p_alasan: alasan });
    if (error) { tulisKecuali('err', error.message); return; }
    await muatKecuali(); gambarKecuali(); tulisKecuali('ok', pesan);
  };
  $('kCatat').onclick = () => {
    const nim = $('kNim').value.trim(), alasan = $('kAlasan').value.trim();
    if (!nim || alasan.length < 5) { tulisKecuali('err', 'Isi NIM dan alasan (minimal 5 huruf).'); return; }
    kirim(nim, $('kTahap').value, alasan, 'Pengecualian tercatat.');
  };
  el.querySelectorAll('[data-hapus-kecuali]').forEach(b => { b.onclick = () => {
    const [nim, tahap] = b.dataset.hapusKecuali.split('|');
    if (confirm(`Hapus pengecualian ${nim} (${nmT(tahap)})?`)) kirim(nim, tahap, null, 'Pengecualian dihapus.');
  }; });
}

// Berkas pendaftaran seminar/sidang TA per tahap (174-patch-berkas-tahap-ta.sql, pemilik 2026-11-25): koordinator TA/admin
// mengubah label, keterangan, wajib, urutan, aktif, dan menambah berkas (kode ta_*). Naskah (naskah_ta) selalu wajib dan aktif.
// Tidak ada hapus: berkas yang tidak dipakai lagi dinonaktifkan supaya berkas lama mahasiswa tetap berlabel.
const TAHAP_BERKAS = [['penetapan_pembimbing', 'Pengajuan pembimbing TA'], ['seminar_proposal', 'Seminar proposal'], ['seminar_kemajuan', 'Seminar kemajuan'], ['sidang_akhir', 'Sidang akhir']];
let BERKAS_TA = null, TAHAP_B = 'penetapan_pembimbing';
async function muatBerkasTA(){
  const { data, error } = await sb.from('ta_berkas').select('*').order('urut').order('kode');
  BERKAS_TA = error ? null : (data || []);
}
function tulisBerkas(k, t){ const m = $('mBerkas'); if (m) { m.className = 'msg ' + k; m.textContent = t; } }
const kodeBerkas = label => 'ta_' + (String(label).toLowerCase().normalize('NFD').replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '') || 'berkas').slice(0, 40);
function gambarBerkasTA(){
  const el = $('berkasTA'); if (!el) return;
  if (!BERKAS_TA) { el.innerHTML = '<p class="kosong">Belum tersedia (jalankan supabase/174-patch-berkas-tahap-ta.sql).</p>'; return; }
  const xs = BERKAS_TA.filter(r => r.tahap === TAHAP_B);
  el.innerHTML = `<p class="ket">Berkas yang diunggah mahasiswa saat mengajukan pembimbing TA dan saat mendaftar seminar/sidang. Berkas wajib harus ada
      sebelum pengajuan bisa dikirim. Naskah selalu wajib di seminar/sidang. Bimbingan dibuktikan lewat catatan bimbingan (halaman Bimbingan TA). Berkas yang tidak dipakai lagi dinonaktifkan (tidak dihapus), supaya berkas lama tetap berlabel.</p>
    <div class="saring"><label>Tahap <select id="bTahap">${TAHAP_BERKAS.map(([v, l]) => `<option value="${v}"${v === TAHAP_B ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select></label>
      <span class="msg" id="mBerkas"></span></div>
    <div class="lebar-tabel"><table><thead><tr><th>Berkas</th><th>Keterangan untuk mahasiswa</th><th>Wajib</th><th>Aktif</th><th class="n">Urutan</th><th></th></tr></thead>
      <tbody>${xs.map(r => { const n = r.kode === 'naskah_ta', k = esc(r.kode);
        return `<tr data-kode="${k}"${r.aktif ? '' : ' style="opacity:.6"'}><td><input data-f="label" maxlength="200" value="${esc(r.label)}" style="width:100%"><div class="ket">${k}</div></td>
        <td><input data-f="keterangan" maxlength="500" value="${esc(r.keterangan)}" style="width:100%"></td>
        <td><input type="checkbox" data-f="wajib"${r.wajib ? ' checked' : ''}${n ? ' disabled title="Naskah selalu wajib"' : ''} aria-label="Wajib"></td>
        <td><input type="checkbox" data-f="aktif"${r.aktif ? ' checked' : ''}${n ? ' disabled title="Naskah selalu aktif"' : ''} aria-label="Aktif"></td>
        <td class="n"><input type="number" data-f="urut" value="${esc(r.urut)}" style="width:5em"></td>
        <td><button type="button" class="b kecil" data-simpan-berkas="${k}">Simpan</button></td></tr>`; }).join('')}</tbody></table></div>
    <div class="saring" style="margin-top:10px"><label style="flex:1 1 220px">Berkas baru <input id="bLabel" maxlength="200" style="width:100%" placeholder="mis. Surat persetujuan pembimbing"></label>
      <label style="flex:2 1 260px">Keterangan <input id="bKet" maxlength="500" style="width:100%"></label>
      <label><input type="checkbox" id="bWajib" checked> wajib</label>
      <button type="button" class="b" id="bTambah">Tambah</button></div>`;
  $('bTahap').onchange = e => { TAHAP_B = e.target.value; gambarBerkasTA(); };
  const segarkan = async pesan => { await muatBerkasTA(); gambarBerkasTA(); tulisBerkas('ok', pesan); };
  el.querySelectorAll('[data-simpan-berkas]').forEach(b => { b.onclick = async () => {
    const tr = b.closest('tr'), v = f => tr.querySelector(`[data-f="${f}"]`);
    const ubah = { label: v('label').value.trim(), keterangan: v('keterangan').value.trim(), urut: +v('urut').value || 100, diperbarui: new Date().toISOString() };
    if (tr.dataset.kode !== 'naskah_ta') Object.assign(ubah, { wajib: v('wajib').checked, aktif: v('aktif').checked });
    if (ubah.label.length < 2) return tulisBerkas('err', 'Nama berkas minimal 2 huruf.');
    const { error } = await sb.from('ta_berkas').update(ubah).eq('tahap', TAHAP_B).eq('kode', tr.dataset.kode);
    if (error) return tulisBerkas('err', error.message);
    await segarkan('Tersimpan.');
  }; });
  $('bTambah').onclick = async () => {
    const label = $('bLabel').value.trim();
    if (label.length < 2) return tulisBerkas('err', 'Tulis nama berkas baru.');
    const kode = kodeBerkas(label);
    if (xs.some(r => r.kode === kode)) return tulisBerkas('err', 'Berkas dengan nama itu sudah ada di tahap ini (aktifkan bila nonaktif).');
    const { error } = await sb.from('ta_berkas').insert({ tahap: TAHAP_B, kode, label, keterangan: $('bKet').value.trim(),
      wajib: $('bWajib').checked, aktif: true, urut: Math.max(0, ...xs.map(r => +r.urut || 0)) + 1 });
    if (error) return tulisBerkas('err', error.message);
    await segarkan('Berkas ditambahkan.');
  };
}

async function mulai(){
  SAYA = await gerbang(sb);
  if (!SAYA) return;
  ADMIN = SAYA.peran === 'admin' || punya(SAYA, 'koordinator_ta');   // koordinator TA (97): unduh dan tandai revisi
  // Beban dosen dan kuota pembimbing (pemilik 2026-11-26): koordinator TA, Kaprodi, pimpinan, GKM, admin; dosen biasa tidak.
  KOOR = ADMIN || punya(SAYA, 'kaprodi') || punya(SAYA, 'gkm') || SAYA.peran === 'pimpinan';
  $('hSub').textContent = `Masuk sebagai ${SAYA.nama}`;
  const [jq, dq] = await Promise.all([sb.from('jadwal_ta').select('*').order('tanggal'), sb.from('dosen').select('nidn,nama')]);
  if (jq.error) throw new Error(/jadwal_ta/.test(jq.error.message) ? 'Tabel belum ada: jalankan supabase/94-patch-jadwal-ta.sql.' : jq.error.message);
  BARIS = jq.data || [];
  DOSEN = Object.fromEntries((dq.data || []).map(d => [d.nidn, d.nama]));
  const opsi = opsiPeriode(BARIS.map(waktuJadwal)).filter(g => g.opsi.length);
  $('isi').innerHTML = `
    <p class="ket">Seminar proposal, seminar kemajuan, dan sidang akhir dari jadwal yang ditetapkan prodi (pengajuan mahasiswa atau
      Data prodi › Jadwal seminar/sidang TA). Beban dosen menghitung semua jadwal yang tidak batal.</p>
    <div class="saring"><label>Periode <select id="fPeriode"><option value="">Semua</option>${opsi.map(g => `<optgroup label="${esc(g.grup)}">${
      g.opsi.map(([v, l]) => `<option value="${v}">${esc(l)}</option>`).join('')}</optgroup>`).join('')}</select></label>
      ${ADMIN ? '<button type="button" class="b" id="unduh">Unduh Excel</button>' : ''}</div>
    <div class="ringkas" id="ringkas"></div>
    <h2 id="jadwal-mendatang">Jadwal mendatang</h2><div id="akan"></div>
    <h2 id="revisi">Revisi berjalan</h2><div id="revisiIsi"></div>
    ${SAYA.peran === 'asesor' ? '' : '<h2 id="peringatan-dini">Peringatan dini</h2><div id="peringatan"></div>'}
    ${KOOR || SAYA.peran === 'asesor' ? '<h2 id="beban-dosen">Beban dosen</h2><div id="beban"></div>' : ''}
    ${KOOR ? '<h2 id="kuota-ta">Kuota pembimbing</h2><div id="kuota"></div>' : ''}
    ${ADMIN ? '<h2 id="urutan-tahap">Pengecualian urutan</h2><div id="kecuali"></div>' : ''}
    ${SAYA.peran === 'asesor' ? '' : '<h2 id="metopen">Metopen</h2><div id="metopenIsi"></div>'}
    ${ADMIN ? '<h2 id="berkas-ta">Berkas per tahap</h2><div id="batasKm"></div><div id="berkasTA"></div>' : ''}`;
  TAB = pasangTab($('isi'));
  $('fPeriode').onchange = e => { PERIODE = e.target.value; gambar(); };
  gambar();
  if ($('peringatan')) { await muatPeringatan(); gambarPeringatan(); }
  if ($('kuota')) { await muatKuota(); gambarKuota(); }
  if ($('kecuali')) { await muatKecuali(); gambarKecuali(); }
  if ($('berkasTA')) { await muatBerkasTA(); gambarBerkasTA(); await gambarBatasKemiripan(); }
  if ($('metopenIsi')) { await muatMetopen(); gambarMetopen(); }
}
mulai().catch(e => { $('isi').innerHTML = `<p class="kosong">Gagal memuat: ${esc(e.message)}</p>`; });
</script>
