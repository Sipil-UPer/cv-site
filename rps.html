  *{box-sizing:border-box}

  .kartu{background:var(--panel);border:1px solid var(--line);padding:14px 18px;margin-bottom:16px}

  .b{font:12.5px/1.4 var(--sans);padding:5px 12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
  .b:hover{border-color:var(--biru);color:var(--biru)}

  .b.awas{color:var(--merah)}
  .b:disabled{opacity:.5;cursor:default}
  select, input, textarea{font:inherit;font-size:14px;padding:4px 6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);max-width:100%}
  textarea{width:100%;min-height:52px;resize:vertical}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px 14px;margin:6px 0}

  .sks{display:flex;gap:6px;flex-wrap:wrap} .sks label{display:flex;align-items:center;gap:3px;font-size:13px} .sks input{width:56px}
  .gulir{overflow-x:auto}
  table.ds{width:100%;border-collapse:collapse;font-size:13.5px}
  table.ds th{text-align:left;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);padding:5px 8px;vertical-align:bottom}

  .chip.ok{color:var(--hijau);border-color:var(--hijau)} .chip.galat{color:var(--merah);border-color:var(--merah)} .chip.saran{color:#8A5A00;border-color:#8A5A00}
  .msg{font-size:13px;margin-left:8px} .msg.buruk{color:var(--merah)} .msg.ok{color:var(--hijau)}

  .pekan-kepala{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .pekan-kepala input{width:80px}
  .centang{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;margin:4px 0}
  .dua{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
  .pustaka{display:grid;grid-template-columns:110px 1fr auto;gap:6px;align-items:start;margin:4px 0}
  .lengket{position:sticky;top:0;z-index:5;background:var(--panel)}
  @media(max-width:700px){.wrap{padding-left:16px;padding-right:16px}.dua,.pustaka{grid-template-columns:1fr}}
</style>

<script>
// Galat saat memuat skrip ditampilkan sebagai pesan, bukan halaman kosong.
addEventListener('error', function (e) {
  if (document.getElementById('galat-muat')) return;
  var d = document.createElement('div');
  d.id = 'galat-muat';
  d.style.cssText = 'margin:16px;padding:12px 14px;border:1px solid var(--merah);' +
    'background:var(--merah-m3);color:var(--ink);font:14px/1.5 system-ui,sans-serif';
  d.textContent = 'Halaman gagal dimuat: ' + (e.message || 'galat skrip') +
    '. Tekan Ctrl+Shift+R untuk memuat ulang tanpa cache; bila tetap muncul, kirim pesan ini ke admin.';
  document.body.insertBefore(d, document.body.firstChild);
});
</script>
<script type="module">
// RPS K26 (111-patch-rps-k26.sql, pemilik 2026-11-18): dosen mengisi RPS di situs; data tersimpan (mk_rps), bisa diubah,
// dan bagian B langsung dari struktur CPMK (mk_struktur, halaman CPMK). Ekspor Word mengikuti Formulir RPS K26.
// Penyusun = koordinator MK atau pengampu kelas MK semester terakhir (boleh_rps, 112); GKM dan admin hanya melihat.
// Pengesahan (112): dosen mengajukan -> Kaprodi aktif mengesahkan atau mengembalikan; daftar revisi (bagian F) otomatis.
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/+esm';
import { gerbang } from './menu.js?v=2026-11-19-b5974d';
import { bolehMutu, aktifPada, punya } from './koordinator.js?v=2026-11-19-b5974d';
import { cplMK } from './cpmk.js?v=2026-11-19-b5974d';
import { JENIS_ASESMEN, JENIS_MK, DIREKTORI, jenisAsesmen, bloom, hots, rapikanRps, kerangkaPekan, barisPekan, periksaRps, modelRps,
  namaBerkasRps, penyusunMK, revisiDariLog, tanggalLokal, waktuLokal, evaluasiDariData, BENTUK, SCL, rekapRps, BENTUK_INTEGRASI } from './rps.js?v=2026-11-19-b5974d';
import { JENIS_PETA, relasiPeta, petaSvg } from './rps-peta.js?v=2026-11-19-b5974d';
import { keB64 } from './pengajuan-mhs.js?v=2026-11-19-b5974d';
import { bacaTinjauan, bahanTinjauan } from './tinjauan-rps.js?v=2026-11-19-b5974d';
import { buatRpsDocx } from './rps-docx.js?v=2026-11-19-b5974d';

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sb = createClient(window.SB_URL, window.SB_KEY);
const baca = q => q.then(r => r.error ? [] : (r.data || []), () => []);
const tulis = (id, kelas, teks) => { const e = $(id); if (e) { e.className = 'msg ' + kelas; e.textContent = teks; } };
const kunci = (kur, kode) => `${kur}|${kode}`;
const opsi = (xs, v) => xs.map(([k, l]) => `<option value="${esc(k)}"${String(v ?? '') === String(k) ? ' selected' : ''}>${esc(l)}</option>`).join('');
const JSZIP = 'https://cdn.jsdelivr.net/npm/jszip@3.10.1/+esm';

let SAYA = null, KELOLA = false, MK = [], REF_CPL = [], PETA = [], DOSEN = [], BOLEH = new Set(), STR = new Map(), RPS = new Map();
let KAPRODI = null, SITUS = {}, PILIH = null, R = null, KOTOR = false, LOG = [], KELAS = [], SAYA_KAPRODI = false, F_MENUNGGU = false;
// Kurikulum daftar (pemilik 2026-11-19): pilih K21, K26, atau kurikulum berikutnya; bawaan terbaru, diingat di ?kur=.
let KUR_DAFTAR = '';
// Karya penelitian/PkM dan integrasi (pemilik 2026-11-19): integrasi di RPS dipilih dari karya tersimpan supaya judul tidak salah.
let KARYA = [], PENULIS = [], F_SEMUA_KARYA = false;
// Bukti akreditasi (113, pemilik 2026-11-19): hanya RPS bertanda tangan Dekan yang diunggah (mk_rps_ttd; terakhir = rps_url).
let TTD = [];
const ST = { draf: 'draf', diajukan: 'diajukan ke Kaprodi', dikembalikan: 'dikembalikan', disahkan: 'disahkan' };
const URL_AWAL = new URLSearchParams(location.search);
addEventListener('beforeunload', e => { if (KOTOR) { e.preventDefault(); e.returnValue = ''; } });

async function muat(){
  const kolomDosen = 'id,nama,nidn,email,peran,aktif,nip,nama_gelar';
  let dq = await sb.from('dosen').select(kolomDosen).order('nama');
  if (dq.error) dq = await sb.from('dosen').select('id,nama,nidn,email,peran,aktif,nip').order('nama');   // sebelum patch 111
  // Kolom pengesahan (112); sebelum patch itu dibaca tanpa kolom tersebut.
  let rq = await sb.from('mk_rps').select('kurikulum,kode_mk,data,status,oleh,diperbarui,revisi,sah,sah_pada,sah_oleh');
  if (rq.error) rq = await sb.from('mk_rps').select('kurikulum,kode_mk,data,status,oleh,diperbarui');
  const [mk, cpl, peta, str, boleh, koor, situs, log, kelas] = await Promise.all([
    baca(sb.from('ref_mata_kuliah').select('kurikulum,kode,nama,sks,sks_kuliah,sks_praktikum,semester,sifat,capstone,aktif,pengampu')
      .order('kurikulum').order('semester').order('kode')),
    baca(sb.from('ref_cpl').select('kurikulum,kode,rumusan,indikator,urutan')),
    baca(sb.from('ref_mk_cpl').select('kurikulum,kode_mk,cpl,indikator')),
    baca(sb.from('mk_struktur').select('kurikulum,kode_mk,data')),
    baca(sb.rpc('rps_boleh_saya')),
    baca(sb.from('koordinator').select('jabatan,mulai,selesai,dosen(id,nama,nama_gelar,nip)').eq('jabatan', 'kaprodi')),
    fetch('data.json?v=' + Date.now()).then(r => (r.ok ? r.json() : {})).catch(() => ({})),
    baca(sb.from('mk_rps_pengesahan').select('*').order('waktu')),   // * : penyusun_sendiri (114) bila patch sudah dijalankan
    baca(sb.from('cpl_kelas').select('tahun_akademik,semester,kode_mk,dosen_email'))]);
  TTD = await baca(sb.from('mk_rps_ttd').select('kurikulum,kode_mk,url,nama,revisi,oleh,waktu').order('waktu'));
  [KARYA, PENULIS] = await Promise.all([
    baca(sb.from('karya').select('id,kategori,judul,tahun,status,mata_kuliah,induk_id,sub_jenis').in('kategori', ['penelitian', 'pkm', 'integrasi'])),
    baca(sb.from('karya_penulis').select('karya_id,dosen_id,peran'))]);
  const rps = rq.error ? [] : rq.data || [];
  LOG = log; KELAS = kelas; SAYA_KAPRODI = punya(SAYA, 'kaprodi');
  MK = mk; REF_CPL = cpl; PETA = peta; SITUS = situs || {};
  DOSEN = (dq.data || []).filter(d => d.aktif !== false && d.nidn && d.peran !== 'asesor');
  STR = new Map(str.map(s => [kunci(s.kurikulum, s.kode_mk), s.data]));
  RPS = new Map(rps.map(r => [kunci(r.kurikulum, r.kode_mk), r]));
  BOLEH = new Set(boleh.map(b => kunci(b.kurikulum, b.kode_mk)));   // GKM/admin tidak otomatis (pemilik 2026-11-18)
  KAPRODI = aktifPada(koor, new Date())[0]?.dosen || null;
  const kode = URL_AWAL.get('kode'), kur = URL_AWAL.get('kur');
  { const kurs = [...new Set(MK.map(m => m.kurikulum))].sort(); KUR_DAFTAR = kurs.includes(kur) ? kur : kurs[kurs.length - 1] || ''; }
  if (kode && !PILIH) {
    const m = [...MK].reverse().find(x => x.kode.toUpperCase() === kode.toUpperCase() && (!kur || x.kurikulum === kur));
    if (m) buka(m.kurikulum, m.kode, false);
  }
  gambar();
}

const mkDari = k => MK.find(m => kunci(m.kurikulum, m.kode) === k);
const ro = () => !BOLEH.has(PILIH) || RPS.get(PILIH)?.status === 'diajukan';
const logMK = k => LOG.filter(l => kunci(l.kurikulum, l.kode_mk) === k);
const penyusun = k => penyusunMK(mkDari(k), DOSEN, KELAS);
const dis = () => (ro() ? ' disabled' : '');
const namaDosen = id => DOSEN.find(d => d.id === id);
const pengampuAwal = m => (m.pengampu || []).map(n => DOSEN.find(d => d.nidn === n)).filter(Boolean);
function ctx(k = PILIH, r = R){
  const m = mkDari(k), S = STR.get(k) || null;
  return { mk: m, struktur: S, rps: r, cpl: cplMK(REF_CPL, PETA, m.kurikulum, m.kode).cpl, pengembang: namaDosen(r?.pengembang) || null, kaprodi: KAPRODI,
           penyusun: penyusun(k), revisi: revisiDariLog(logMK(k)) };
}

function buka(kur, kode, gambarUlang = true){
  if (KOTOR && !confirm('Perubahan belum disimpan. Tinggalkan?')) return;
  PILIH = kunci(kur, kode);
  const m = mkDari(PILIH), ada = RPS.get(PILIH)?.data;
  R = rapikanRps(ada ? JSON.parse(JSON.stringify(ada)) : null, m, SITUS);
  if (!ada) {
    const p = pengampuAwal(m), ps = penyusun(PILIH);
    R.pengampu = (p.length ? p : ps).map(d => d.nama_gelar || d.nama).join('\n');
    R.pengembang = (ps.some(d => d.id === SAYA.id) ? SAYA.id : ps[0]?.id) || '';
  }
  KOTOR = false;
  history.replaceState(null, '', `?kur=${encodeURIComponent(kur)}&kode=${encodeURIComponent(kode)}`);
  if (gambarUlang) { gambar(); scrollTo(0, 0); }
}

// ---------- daftar ----------
function htmlDaftar(){
  const kurs = [...new Set(MK.map(m => m.kurikulum))].sort(), kur = KUR_DAFTAR;
  // "Menunggu pemeriksaan Anda" (Kaprodi): semua kurikulum; selain itu kurikulum terpilih.
  const xs = MK.filter(m => (F_MENUNGGU ? RPS.get(kunci(m.kurikulum, m.kode))?.status === 'diajukan' : m.kurikulum === kur) && m.aktif !== false);
  const menunggu = [...RPS.values()].filter(r => r.status === 'diajukan').length;
  return `<section class="kartu"><h2>RPS mata kuliah</h2>
    <div class="alat"><label>Kurikulum <select id="fKurDaftar"${F_MENUNGGU ? ' disabled' : ''}>${kurs.map(k => `<option${k === kur ? ' selected' : ''}>${esc(k)}</option>`).join('')}</select></label>
      <span class="ket">${F_MENUNGGU ? 'Menampilkan RPS yang menunggu dari semua kurikulum.' : `${xs.length} mata kuliah ${esc(kur)}`}</span></div>
    <p class="ket">Isi RPS sekali per mata kuliah; bagian B (CPL, CPMK, Sub-CPMK, asesmen, bobot) diambil dari halaman
      <a href="cpmk.html">CPMK dan RPS</a>, jadi RPS dan nilai CPL selalu memakai bobot yang sama. Unduh Word mengikuti formulir RPS universitas (UP-SPMI/FR008/R05).
      RPS disusun koordinator MK atau dosen pengampu, diajukan ke Kaprodi, lalu disahkan; Dekan menandatangani Word di luar situs.
      <a href="panduan.html#rps">Panduan langkah demi langkah</a>.</p>
    ${SAYA_KAPRODI ? `<p><label class="centang"><input type="checkbox" id="fMenunggu"${F_MENUNGGU ? ' checked' : ''}> Hanya yang menunggu pemeriksaan Anda
      (${menunggu})</label></p>` : ''}
    <div class="gulir"><table class="ds"><thead><tr><th>Kode</th><th>Mata kuliah</th>${F_MENUNGGU ? '<th>Kurikulum</th>' : ''}<th>Smt</th><th>RPS</th><th>Pemeriksaan</th><th></th></tr></thead>
    <tbody>${xs.map(m => { const k = kunci(m.kurikulum, m.kode), r = RPS.get(k);
      const temuan = r ? periksaRps(ctx(k, rapikanRps(r.data, m, SITUS))) : null, galat = temuan ? temuan.filter(t => t.tingkat === 'galat').length : null;
      return `<tr><td class="kode">${esc(m.kode)}</td><td>${esc(m.nama)}</td>${F_MENUNGGU ? `<td>${esc(m.kurikulum)}</td>` : ''}<td>${esc(m.semester ?? '')}</td>
        <td>${r ? `<span class="chip${r.status === 'disahkan' ? ' ok' : r.status === 'dikembalikan' ? ' galat' : r.status === 'diajukan' ? ' saran' : ''}">${esc(ST[r.status] || r.status)}</span>${
          r.revisi > 1 ? ` <span class="ket">rev. ${r.revisi - 1}</span>` : ''}${SAYA_KAPRODI && r.status === 'diajukan' ? ' <b>menunggu Anda</b>' : ''}` : '<span class="kosong">belum</span>'}</td>
        <td>${temuan == null ? '' : galat ? `<span class="chip galat">${galat} perlu dilengkapi</span>` : '<span class="chip ok">lengkap</span>'}</td>
        <td><a class="b" href="?kur=${encodeURIComponent(m.kurikulum)}&kode=${encodeURIComponent(m.kode)}">${
          SAYA_KAPRODI && r?.status === 'diajukan' ? 'Periksa' : BOLEH.has(k) ? 'Isi' : 'Lihat'}</a></td></tr>`; }).join('')}
    </tbody></table></div></section>`;
}

// ---------- satu MK ----------
function htmlPeriksa(){
  const xs = periksaRps(ctx()), galat = xs.filter(t => t.tingkat === 'galat').length;
  if (!xs.length) return '<div class="periksa ok">Semua butir daftar periksa Panduan Pengisian RPS terpenuhi.</div>';
  const per = ['A', 'B', 'C', 'D', 'E'].map(b => [b, xs.filter(t => t.bagian === b)]).filter(([, t]) => t.length);
  return `<div class="periksa"><b>${galat ? `${galat} butir perlu dilengkapi` : 'Wajib sudah lengkap'}</b>${xs.length - galat ? `, ${xs.length - galat} saran` : ''}.
    ${per.map(([b, t]) => `<div><b>Bagian ${b}</b><ul>${t.map(x => `<li class="${x.tingkat}">${esc(x.pesan)}</li>`).join('')}</ul></div>`).join('')}</div>`;
}

// Bukti akreditasi (113): RPS disahkan Kaprodi sudah terhitung di penilaian; bukti untuk asesor hanya RPS bertanda tangan
// Dekan yang diunggah penyusun MK atau admin. RPS di luar situs (mis. K21 lama) boleh diunggah langsung.
const ttdMK = k => TTD.filter(t => kunci(t.kurikulum, t.kode_mk) === k);
function htmlBukti(){
  const r = RPS.get(PILIH), xs = ttdMK(PILIH), akhir = xs[xs.length - 1];
  const bisa = (BOLEH.has(PILIH) || SAYA.peran === 'admin') && (!r || r.revisi > 0);
  const lama = akhir && r?.revisi && akhir.revisi != null && akhir.revisi < r.revisi;
  return `<div class="periksa${akhir && !lama ? ' ok' : ''}" style="margin:8px 0"><b>Bukti akreditasi (RPS bertanda tangan Dekan):</b>
    ${akhir ? `<a href="${esc(akhir.url)}" target="_blank" rel="noopener">${esc(akhir.nama || 'buka berkas')}</a>
      <span class="ket">diunggah ${esc(tanggalLokal(akhir.waktu))} oleh ${esc(akhir.oleh || '')}${akhir.revisi ? ` · pengesahan ke-${akhir.revisi}` : ' · RPS di luar situs'}</span>`
      : `<span class="ket">belum ada. ${r?.revisi ? 'RPS ini sudah terhitung di penilaian (disahkan Kaprodi), tetapi asesor belum punya bukti.' : ''}</span>`}
    ${lama ? `<div style="color:#8A5A00">RPS sudah disahkan ulang (pengesahan ke-${r.revisi}); unggah versi bertanda tangan yang terbaru.</div>` : ''}
    ${bisa ? `<div class="alat"><input type="file" id="ttdBerkas" accept=".pdf">
        <label class="centang"><input type="checkbox" id="ttdYakin"> Sudah ditandatangani dosen pengembang, Kaprodi, dan Dekan</label>
        <button class="b" id="ttdUnggah">Unggah RPS bertanda tangan</button><span class="msg" id="mTtd"></span></div>
      <div class="ket">${r ? 'Unduh versi disahkan, tandatangani, lalu unggah PDF hasil pindaian di sini.' : 'RPS mata kuliah ini belum disusun di situs; RPS lama yang sudah bertanda tangan Dekan boleh diunggah sebagai bukti.'}
        Hanya berkas inilah yang dilihat asesor sebagai bukti RPS.</div>`
      : r && !r.revisi ? '<div class="ket">Unggah setelah RPS disahkan Kaprodi dan ditandatangani Dekan.</div>' : ''}
  </div>`;
}

async function unggahTtd(){
  const f = $('ttdBerkas').files[0], [kur, kode] = PILIH.split('|');
  if (!f) return tulis('mTtd', 'buruk', 'Pilih berkas PDF.');
  if (!/\.pdf$/i.test(f.name)) return tulis('mTtd', 'buruk', 'Unggah PDF hasil pindaian yang sudah bertanda tangan.');
  if (!$('ttdYakin').checked) return tulis('mTtd', 'buruk', 'Centang pernyataan bahwa RPS sudah ditandatangani Dekan.');
  if (!window.UPLOAD_URL) return tulis('mTtd', 'buruk', 'Unggahan belum diatur (UPLOAD_URL di config.js).');
  $('ttdUnggah').disabled = true; tulis('mTtd', '', 'Mengunggah…');
  try {
    const { data: { session } } = await sb.auth.getSession();
    const res = await fetch(window.UPLOAD_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ token: session.access_token, kind: 'rps', kurikulum: kur, kode_mk: kode, filename: f.name, data: await keB64(f) }) });
    const out = await res.json();
    if (!out.ok) throw new Error(out.error || 'Unggah gagal.');
    const { error } = await sb.rpc('rps_unggah_ttd', { p_kurikulum: kur, p_kode: kode, p_url: out.url, p_nama: f.name });
    if (error) throw new Error(/rps_unggah_ttd/.test(error.message) ? 'Jalankan supabase/113-patch-rps-bukti-ttd.sql dulu.' : error.message);
    TTD = await baca(sb.from('mk_rps_ttd').select('kurikulum,kode_mk,url,nama,revisi,oleh,waktu').order('waktu'));
    gambar(); tulis('mTtd', 'ok', 'RPS bertanda tangan Dekan tersimpan sebagai bukti akreditasi.');
  } catch (e) { tulis('mTtd', 'buruk', e.message); $('ttdUnggah').disabled = false; }
}

// Integrasi penelitian/PkM (pemilik 2026-11-19): dari karya tersimpan (penelitian/PkM, bukan draf orang lain); judul, tahun,
// pelaksana disalin ke RPS saat dipilih. Karya "Integrasi ke pembelajaran" MK ini (LKPS 3.a.3) ditunjukkan bila ada.
const pelaksana = id => {
  const ps = PENULIS.filter(x => x.karya_id === id), nama = d => DOSEN.find(x => x.id === d)?.nama;
  const ketua = ps.filter(x => /ketua/i.test(x.peran || '')).map(x => nama(x.dosen_id)).filter(Boolean);
  const semua = ps.map(x => nama(x.dosen_id)).filter(Boolean);
  const xs = ketua.length ? ketua : semua.slice(0, 1);
  return xs.join(', ') + (semua.length > xs.length ? ' dkk.' : '');
};

// Ubah R menurut alamat "a.b.0.c".
function atur(path, nilai){
  const ks = path.split('.'), akhir = ks.pop();
  let o = R;
  for (const k of ks) o = o[/^\d+$/.test(k) ? +k : k];
  o[/^\d+$/.test(akhir) ? +akhir : akhir] = nilai;
}
function ambil(path){ return path.split('.').reduce((o, k) => o?.[/^\d+$/.test(k) ? +k : k], R); }
const segarkanPeriksa = () => { const e = $('periksa'); if (e) e.innerHTML = htmlPeriksa(); };   // panel pengesahan diperbarui saat simpan

    if (t.dataset.intPilih) {

      baca(sb.from('evaluasi_tindak').select('evaluasi_id,masalah,rencana'))]);
    const h0 = evaluasiDariData({ ringkasan: rq.data?.[0]?.data, evaluasi: eq, tindak: tq, kode });

// SVG peta -> PNG (2x) untuk Word.
async function pngPeta(struktur, peta, entry){
  const { svg, w, h } = petaSvg(struktur, peta, entry);
  const img = new Image();
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  await img.decode();
  const c = Object.assign(document.createElement('canvas'), { width: w * 2, height: h * 2 }), g = c.getContext('2d');
  g.scale(2, 2); g.drawImage(img, 0, 0, w, h);
  const blob = await new Promise(r => c.toBlob(r, 'image/png'));
  return { png: new Uint8Array(await blob.arrayBuffer()), w, h };
}

    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    tulis('mSimpan', 'ok', versiSah ? 'Word versi disahkan diunduh.' : KOTOR ? 'Word diunduh (berisi perubahan yang belum disimpan).' : 'Word diunduh.');
  } catch (e) { tulis('mSimpan', 'buruk', 'Gagal membuat Word: ' + e.message); }
  b.disabled = false;
}

async function mulai(){
  SAYA = await gerbang(sb);
  if (!SAYA) return;
  KELOLA = bolehMutu(SAYA);
  $('hSub').textContent = `Masuk sebagai ${SAYA.nama}`;
  await muat();
}
mulai().catch(e => { $('isi').innerHTML = `<p class="kosong">Gagal memuat: ${esc(e.message)}</p>`; });
</script>
