function buka(kur, kode, gambarUlang = true){
  if (KOTOR && !confirm('Perubahan belum disimpan. Tinggalkan?')) return;
  PILIH = kunci(kur, kode);
  const m = mkDari(PILIH), ada = RPS.get(PILIH)?.data;
  R = rapikanRps(ada ? JSON.parse(JSON.stringify(ada)) : null, m, SITUS);
  if (!ada) {

    R.pengampu = (p.length ? p : ps).map(d => d.nama_gelar || d.nama).join('\n');
    R.pengembang = (ps.some(d => d.id === SAYA.id) ? SAYA.id : ps[0]?.id) || '';
    const sil = silabusMK(PILIH);   // 129: RPS baru mulai dari silabus MK
    if (sil) R = rpsDariSilabus(R, sil.isi);
  }
  KOTOR = false;
  DASAR = RPS.get(PILIH)?.diperbarui || null;
  const df = bacaDraf(PILIH);
  PULIH = df?.R && JSON.stringify(df.R) !== JSON.stringify(R) ? df : null;
  history.replaceState(null, '', `?kur=${encodeURIComponent(kur)}&kode=${encodeURIComponent(kode)}`);

async function unggahTtd(){
  const f = $('ttdBerkas').files[0], [kur, kode] = PILIH.split('|');
  if (!f) return tulis('mTtd', 'buruk', 'Pilih berkas PDF.');
  if (!/\.pdf$/i.test(f.name)) return tulis('mTtd', 'buruk', 'Unggah PDF hasil pindaian yang sudah bertanda tangan.');
  if (!$('ttdYakin').checked) return tulis('mTtd', 'buruk', 'Centang pernyataan bahwa RPS sudah ditandatangani Dekan.');
  if (!window.UPLOAD_URL) return tulis('mTtd', 'buruk', 'Unggahan belum diatur (UPLOAD_URL di config.js).');
  $('ttdUnggah').disabled = true; tulis('mTtd', '', 'Mengunggah…');
  try {
    const { data: { session } } = await sb.auth.getSession();
    const res = await fetch(window.UPLOAD_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ token: session.access_token, kind: 'rps', kurikulum: kur, kode_mk: kode, filename: f.name, data: await keB64(f) }) });
    const out = await res.json();
    if (!out.ok) throw new Error(out.error || 'Unggah gagal.');
    const { error } = await sb.rpc('rps_unggah_ttd', { p_kurikulum: kur, p_kode: kode, p_url: out.url, p_nama: f.name });
    if (error) throw new Error(/rps_unggah_ttd/.test(error.message) ? 'Jalankan supabase/113-patch-rps-bukti-ttd.sql dulu.' : error.message);
    TTD = await baca(sb.from('mk_rps_ttd').select('kurikulum,kode_mk,url,nama,revisi,oleh,waktu').order('waktu'));
    gambar(); tulis('mTtd', 'ok', 'RPS bertanda tangan Dekan tersimpan sebagai bukti akreditasi.');
  } catch (e) { tulis('mTtd', 'buruk', e.message); $('ttdUnggah').disabled = false; }
}

};

    <p class="ket">1 sks = 45 jam per semester; kuliah/responsi/tutorial 50′ PB + 60′ PT + 60′ KM per pekan per sks; praktikum, praktik lapangan, simulasi 170′ per pekan per sks
      (Panduan Pengisian RPS). Sebaran sks dari bagian A.</p>
    <h3>2. Bentuk pembelajaran dan metode SCL</h3>
    ${tb(['Bentuk/metode', 'Pekan', 'Jumlah pekan'], [...X.bentuk, ...X.scl].map(x => `<tr><td>${esc(x.label)}</td><td>${esc(x.pekan)}</td><td>${x.jumlah}</td></tr>`).join('')

// Ubah R menurut alamat "a.b.0.c".
function atur(path, nilai){
  const ks = path.split('.'), akhir = ks.pop();
  let o = R;
  for (const k of ks) o = o[/^\d+$/.test(k) ? +k : k];
  o[/^\d+$/.test(akhir) ? +akhir : akhir] = nilai;
}
function ambil(path){ return path.split('.').reduce((o, k) => o?.[/^\d+$/.test(k) ? +k : k], R); }

let IMPOR = null;
async function unduhXlsx(){
  const X = await import(SHEETJS), m = mkDari(PILIH), wb = X.utils.book_new();

    // Sel kosong ditulis kosong (bukan teks ''); sel rumus {f} diisi sesudahnya.
    const ws = X.utils.aoa_to_sheet(rows.map(r => r.map(v => (v && typeof v === 'object' ? null : v === '' ? null : v))));
    rows.forEach((r, i) => r.forEach((v, j) => { if (v && typeof v === 'object' && v.f) ws[X.utils.encode_cell({ r: i, c: j })] = { t: 'n', v: v.v ?? 0, f: v.f }; }));
    ws['!cols'] = (LEBAR_KOLOM[nama] || []).map(w => ({ wch: w }));

async function kabariReviewer(kur, kode, reviewer){
  try {
    if (!window.UPLOAD_URL) throw new Error('Apps Script belum disiapkan (UPLOAD_URL).');
    const { data: { session } } = await sb.auth.getSession();
    if (!session) throw new Error('Sesi masuk habis. Muat ulang halaman.');
    const res = await fetch(window.UPLOAD_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ token: session.access_token, kind: 'rps_review_kabari', kurikulum: kur, kode, reviewer,
        pengirim: SITUS.prodi ? `Program Studi ${SITUS.prodi}` : 'Program Studi' }) });
    const out = await res.json();
    if (!out.ok) throw new Error(/tidak dikenal/i.test(out.error || '') ? 'Apps Script belum diperbarui: terbitkan ulang Code.gs.' : out.error);
    return `Email undangan terkirim${out.ke ? ` ke ${out.ke}` : ''}.`;

      new URL(`verifikasi-rps.html?k=${encodeURIComponent(r?.kode_verifikasi || '')}`, location.href).href,
      { tanggal: tglDok, sebutanKaprodi: sebutanPada(r?.sah_atas_nama, 'kaprodi', r?.sah_pada), sebutanDekan: sebutanPada(r?.tetap_atas_nama, 'dekan', r?.tetap_pada) }) : null;
    if (versiSah || r?.status === 'disahkan') c.kaprodi_penyusun = !!r?.sah?.kaprodi_penyusun;   // 114
    const peta = c.struktur?.sub?.length ? await pngPeta(c.struktur, c.rps.peta, entryPeta(c.rps)) : null;
    const qr = c.esign ? await pngQr(c.esign.url).catch(() => null) : null;
    const blob = await buatRpsDocx(modelRps(c), { JSZip, logo, peta, qr });
    const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: namaBerkasRps(mkDari(PILIH)) });
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    tulis('mSimpan', 'ok', versiSah ? 'Word versi disahkan diunduh.' : KOTOR ? 'Word diunduh (berisi perubahan yang belum disimpan).' : 'Word diunduh.');
  } catch (e) { tulis('mSimpan', 'buruk', 'Gagal membuat Word: ' + e.message); }
  b.disabled = false;
}

mulai().catch(e => { $('isi').innerHTML = `<p class="kosong">Gagal memuat: ${esc(e.message)}</p>`; });
