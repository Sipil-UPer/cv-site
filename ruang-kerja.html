<style>
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
       font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
  .hero{background:var(--biru);color:#fff;border-bottom:4px solid var(--merah)}
  .hero-in{max-width:1180px;margin:0 auto;padding:34px 24px 30px}
  .hero-baris{display:flex;gap:20px;align-items:center;margin-top:14px;flex-wrap:wrap}
  .logo-kampus{background:#fff;border-radius:6px;padding:8px 12px;line-height:0}
  .logo-kampus img{height:72px}
  .eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;
           text-transform:uppercase;color:var(--biru-m3)}
  h1{font-family:var(--serif);font-weight:600;font-size:30px;margin:6px 0 4px}
  .sub{color:var(--biru-m5);font-size:14px}
  .balik{color:var(--biru-m5);font-size:13px;text-decoration:none}
  .balik:hover{color:#fff}
  .wrap{max-width:1180px;margin:0 auto;padding:26px 24px 60px}
  .modul{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px}
  .m{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--biru);
     border-radius:4px;padding:18px 20px}
  .m h2{font-family:var(--serif);font-size:19px;margin:0 0 2px;color:var(--biru)}
  .m>p{margin:0 0 12px;color:var(--muted);font-size:13.5px}
  .m a{display:block;text-decoration:none;color:var(--ink);padding:9px 10px;margin:0 -10px;
       border-radius:3px}
  .m a:hover{background:var(--line-soft)}
  .m a b{color:var(--biru-2)}
  .m a span{display:block;color:var(--muted);font-size:13px}
  .m h3.m-sub{font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:14px 0 2px}
  .info{background:#FFF8E5;border:1px solid #E8D9A8;border-radius:4px;padding:10px 14px;
        margin-bottom:18px;font-size:14px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:4px;
         padding:22px 24px;max-width:440px}
  .panel h2{margin:0 0 6px;font-family:var(--serif)}
  .hint{color:var(--muted);font-size:14px}
  label{display:block;font-size:13px;font-weight:600;margin:12px 0 4px}
  input{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:3px}
  .btn{font:inherit;font-weight:600;background:var(--biru);color:#fff;border:0;border-radius:3px;
       padding:8px 16px;cursor:pointer;margin-top:14px}
  .btn.ghost{background:none;color:var(--biru);border:1px solid var(--line)}
  .msg{margin-left:10px;font-size:13.5px}
  .msg.err{color:var(--merah)} .msg.ok{color:var(--hijau)}
  .tugas{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--merah);
         border-radius:4px;padding:16px 20px;margin-bottom:22px}
  .tugas h2{font-family:var(--serif);font-size:19px;margin:0 0 2px;color:var(--biru)}
  .tugas>p{margin:0 0 8px;color:var(--muted);font-size:13.5px}
  .tugas ul{list-style:none;margin:0;padding:0}
  .tugas li{border-top:1px solid var(--line-soft);padding:8px 0;display:flex;gap:10px;align-items:baseline}
  .tugas li:first-child{border-top:0}
  .tugas .tk{flex:none;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;
             border-radius:3px;padding:1px 6px;background:var(--line-soft);color:var(--muted);min-width:64px;text-align:center}
  .tugas .lewat .tk{background:var(--merah);color:#fff}
  .tugas .dekat .tk{background:#8A5A00;color:#fff}
  .tugas li a,.tugas li b{color:var(--biru-2);font-weight:600;text-decoration:none}
  .tugas li a:hover{text-decoration:underline}
  .tugas li span{display:block;color:var(--muted);font-size:13px}
  .tugas details summary{cursor:pointer;color:var(--biru-2);font-size:13.5px;margin-top:6px}
  /* Pintasan per peran (pemilik 2026-11-20, tahap 3) */
  .pintasan{margin-bottom:26px}
  .pintasan h2,.semua-h{font-family:var(--serif);font-size:19px;margin:0 0 4px;color:var(--biru)}
  .p-grup{margin-top:10px}
  .p-grup h3{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;font-weight:500}
  .p-isi{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
  .p-isi a{display:block;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--biru);border-radius:4px;
    padding:9px 12px;text-decoration:none;color:var(--biru-2);font-weight:600;font-size:14px}
  .p-isi a:hover{background:var(--line-soft)}
  .semua-h{margin:6px 0 10px}
  /* Ponsel (tahap 3): kepala ringkas; Beranda umum ada di menu. */
  @media(max-width:640px){.hero-in{padding-top:16px;padding-bottom:14px}.hero .balik,.logo-deret{display:none}
    .hero-baris{margin-top:0} h1{font-size:23px}}
  @media(max-width:640px){.hero-in,.wrap{padding-left:16px;padding-right:16px}
    .modul{grid-template-columns:1fr} .p-isi{grid-template-columns:1fr 1fr}}
</style>

<script>
// Galat saat memuat skrip (mis. modul lama dari cache) tampil sebagai pesan.
addEventListener('error', function (e) {
  if (document.getElementById('galat-muat')) return;
  var d = document.createElement('div');
  d.id = 'galat-muat';
  d.style.cssText = 'margin:16px;padding:12px 14px;border:1px solid var(--merah);' +
    'background:var(--merah-m3);color:var(--ink);font:14px/1.5 system-ui,sans-serif';
  d.textContent = 'Halaman gagal dimuat: ' + (e.message || 'galat skrip') +
    '. Tekan Ctrl+Shift+R untuk memuat ulang tanpa cache; bila tetap muncul, kirim pesan ini ke admin.';
  document.body.insertBefore(d, document.body.firstChild);
});
</script>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/+esm';
import { pengguna, pasangMenu, halamanBoleh, bolehBuka, identitas, pasangJudul, pintasanUntuk, denganSub } from './menu.js?v=2026-11-28-777263';
import { kelasMengajarSaya } from './mk-saya.js?v=2026-11-28-777263';
import { hitungVerifikasi } from './verifikasi-hitung.js?v=2026-11-28-777263';
import { rubrikRps } from './rps.js?v=2026-11-28-777263';
import { rencanaRps, rekapJurnal } from './jurnal.js?v=2026-11-28-777263';
import { bacaTinjauan } from './tinjauan-rps.js?v=2026-11-28-777263';
import { isoDari } from './pengingat-rps.js?v=2026-11-28-777263';
import { tugasSaya } from './tugas-saya.js?v=2026-11-28-777263';
import { fiturAktif, halamanAktif } from './fitur.js?v=2026-11-28-777263';
// Situs publik mati (templat akreditasi, pemilik 2026-11-23): tanpa tautan ke beranda umum.
if (!halamanAktif('index.html')) document.querySelector('a.balik[href="index.html"]')?.remove();
import { barisDosen } from './target-kinerja.js?v=2026-11-28-777263';

const sb = createClient(window.SB_URL, window.SB_KEY);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const q = new URLSearchParams(location.search);
// ?ke= : halaman yang diminta sebelum login (dari gerbang di menu.js).
// ?tolak= : halaman yang tidak boleh dibuka peran ini.
const KE = q.get('ke'), TOLAK = q.get('tolak');
let siap = false;

// Merek institusi di kepala halaman, juga di layar masuk.
identitas().then(({ prodi, institusi }) => {
  if (institusi) { $('hInst').textContent = institusi; $('hLogo').alt = institusi; }
  if (prodi) $('hProdi').textContent = 'Program Studi ' + prodi;
});
pasangJudul();

async function mulai(){
  const u = await pengguna(sb);
  if (!u) return layarMasuk();
  if (!u.saya) return layarTidakTerdaftar(u.email);
  siap = true;
  // Hanya halaman ruang kerja yang dikenal menu.js, supaya ?ke= tidak bisa
  // dipakai mengalihkan ke situs lain.
  if (KE && bolehBuka(u.saya, KE)) return location.replace(KE);
  await pasangMenu(sb);
  $('hSub').textContent = `Masuk sebagai ${u.saya.nama} (${u.saya.peran}).`;
  const tolak = TOLAK || (KE && bolehBuka(u.saya, KE) === false ? KE : '');
  $('isi').innerHTML = (tolak ? `<div class="info">Halaman <code>${esc(tolak.split('?')[0])}</code>
      ${halamanAktif(tolak) ? `tidak tersedia untuk peran ${esc(u.saya.peran)}. Hubungi admin prodi bila perlu akses.`
        : 'termasuk modul yang tidak diaktifkan di situs ini.'}</div>` : '')
    // Tahap 3 (pemilik 2026-11-20): Tugas saya, pintasan menurut peran/jabatan, lalu semua halaman.
    + (pin => pin.length ? `<section class="pintasan" aria-labelledby="jPin"><h2 id="jPin">Pintasan untuk Anda</h2>
        ${pin.map(g => `<div class="p-grup"><h3>${esc(g.label)}</h3><div class="p-isi">${g.halaman.map(h =>
          `<a href="${esc(h.href)}" title="${esc(h.ket || '')}">${esc(h.judul)}</a>`).join('')}</div></div>`).join('')}</section>` : '')(pintasanUntuk(u.saya))
    + `<h2 class="semua-h">Semua halaman</h2>`
    + `<div class="modul">${halamanBoleh(u.saya).map(m => `<section class="m">
        <h2>${esc(m.judul)}</h2><p>${esc(m.ket)}</p>
        ${denganSub(m.halaman).map(([sub, h]) => (sub ? `<h3 class="m-sub">${esc(sub)}</h3>` : '') + `<a href="${esc(h.href)}"><b>${esc(h.judul)}</b>
          <span>${esc(h.ket)}</span></a>`).join('')}</section>`).join('')}</div>`;
  if (u.saya.peran !== 'asesor') {
    ($('isi').querySelector('.pintasan') || $('isi').querySelector('.semua-h')).insertAdjacentHTML('beforebegin', '<div id="tugas"></div>');
    muatTugas(u.saya).then(xs => { $('tugas').innerHTML = htmlTugas(xs); })
      .catch(e => { $('tugas').innerHTML = `<p class="hint">Tugas saya gagal dimuat: ${esc(e.message || e)}</p>`; });
  }
  // Total yang menunggu verifikasi pada kartu Verifikasi (admin; pemilik 2026-11-08).
  // Juga pada petak pintasan (tahap 3): kartu = <b> di daftar modul, petak = tautannya sendiri.
  const kartu = [...$('isi').querySelectorAll('.modul a[href="verifikasi.html"] b, .pintasan a[href="verifikasi.html"]')];
  if (kartu.length) hitungVerifikasi(sb).then(n => {
    if (n.total) kartu.forEach(k => k.insertAdjacentHTML('beforeend',
      ` <span style="display:inline-block;background:#8A5A00;color:#fff;border-radius:9px;padding:0 7px;font-size:12px">${n.total} menunggu</span>`));
  });
}

function layarMasuk(){
  // ?habis=1: dikeluarkan otomatis (menu.js, admin tidak aktif KELUAR_OTOMATIS_JAM jam; pemilik 2026-11-20).
  $('isi').innerHTML = (q.get('habis') ? `<div class="info">Anda dikeluarkan otomatis karena ruang kerja tidak dipakai beberapa jam
      (khusus akun admin, untuk keamanan). Silakan masuk lagi.</div>` : '') + `<div class="panel"><h2>Masuk</h2>
    <p class="hint">Gunakan email kampus yang sudah didaftarkan admin prodi.
    Kami kirimkan tautan masuk — tidak ada kata sandi yang perlu diingat.</p>
    <label for="em">Alamat email</label>
    <input id="em" type="email" autocomplete="email" placeholder="nama@kampus.ac.id">
    <button class="btn" id="kirim">Kirim tautan masuk</button><span class="msg" id="m"></span></div>`;
  const em = $('em'), m = $('m'), kirim = $('kirim');
  em.onkeydown = e => { if (e.key === 'Enter') kirim.click(); };
  kirim.onclick = async () => {
    m.className = 'msg';
    if (!em.value.includes('@')) { m.className = 'msg err'; m.textContent = 'Masukkan email yang valid.'; return; }
    kirim.disabled = true; m.textContent = 'Mengirim…';
    const { error } = await sb.auth.signInWithOtp({ email: em.value.trim(),
      options: { emailRedirectTo: location.href.split('#')[0] } });
    kirim.disabled = false;
    if (error) { m.className = 'msg err'; m.textContent = error.message; }
    else { m.className = 'msg ok'; m.textContent = 'Tautan terkirim. Periksa kotak masuk Anda.'; }
  };
}

async function layarTidakTerdaftar(email){
  // 155 (pemilik 2026-11-22): terdaftar tetapi tidak boleh masuk -> pesan sendiri. RPC belum ada = dianggap belum terdaftar.
  const ditutup = await sb.rpc('akses_masuk_ditutup').then(r => r.data === true, () => false);
  $('isi').innerHTML = ditutup ? `<div class="panel"><h2>Akses masuk belum dibuka</h2>
    <p class="hint"><strong>${esc(email)}</strong> terdaftar di prodi, tetapi belum diberi akses masuk situs.
    Hubungi admin prodi bila Anda perlu menginput data.</p>
    <button class="btn ghost" id="kl">Keluar</button></div>` : `<div class="panel"><h2>Email belum terdaftar</h2>
    <p class="hint"><strong>${esc(email)}</strong> belum ada di daftar prodi.
    Hubungi admin prodi untuk didaftarkan.</p>
    <button class="btn ghost" id="kl">Keluar</button></div>`;
  $('kl').onclick = async () => { await sb.auth.signOut(); location.reload(); };
}

// "Tugas saya" (pemilik 2026-11-12; tugas-saya.js). Tabel yang belum ada (patch belum
// dijalankan) dibaca sebagai kosong; RLS membatasi pada data milik sendiri.
const LABEL_JENIS = { profil: 'Profil', karya: 'Karya', bkd: 'BKD', rapat: 'Rapat', hibah: 'Hibah', ami: 'AMI', cpl: 'CPL', target: 'Target', evaluasi: 'Evaluasi', cpmk: 'CPMK', portofolio: 'Portofolio', tinjauan: 'Tinjauan RPS', review: 'Review RPS', rps: 'RPS', insentif: 'Insentif', perwalian: 'Perwalian', agenda: 'Agenda', survei: 'Survei', kotak: 'Kotak masuk', ujian: 'Ujian', sdm: 'Pengembangan', lab: 'Laboratorium', pemangku: 'Pemangku', surat: 'Surat', karier: 'Karier' };
const MAKS_TAMPIL = 8;
async function muatTugas(saya){
  const baca = q => q.then(r => r.error ? [] : (r.data || []), () => []);
  const em = saya.email || '';
  const [karya, draf, bkd, tindak, hibah, temuan, kelasCpl] = await Promise.all([
    baca(sb.from('karya').select('id,judul,status,bukti_url,catatan,dilaporkan_oleh,karya_penulis!inner(dosen_id)')
      .eq('karya_penulis.dosen_id', saya.id).in('status', ['ditolak', 'terverifikasi']).limit(2000)),
    // Draf hanya terbaca oleh pelapor/penulisnya (41-patch-draf-karya.sql).
    baca(sb.from('karya').select('id,judul,status,dilaporkan_oleh,karya_penulis(dosen_id)').eq('status', 'draf').limit(500)),
    baca(sb.from('lkps_bkd').select('tahun_akademik,semester,verifikasi,catatan').eq('verifikasi', 'ditolak')),
    !fiturAktif('rapat') ? [] : baca(sb.from('rapat_tindak').select('id,rapat_id,keputusan,tenggat,status,pj_dosen_id,rapat(judul,tanggal)')
      .eq('pj_dosen_id', saya.id).in('status', ['terbuka', 'proses'])),
    !fiturAktif('hibah') ? [] : baca(sb.from('hibah_ajuan').select('judul,status,tenggat_ajuan,tanggal_ajuan,tenggat_kemajuan,kemajuan_selesai,tenggat_akhir,akhir_selesai,hibah_tim!inner(dosen_id,peran)')
      .eq('hibah_tim.dosen_id', saya.id).in('status', ['rencana', 'didanai'])),
    em ? baca(sb.from('ami_temuan').select('kode,siklus,uraian,status,tenggat,pj_email').ilike('pj_email', em)) : [],
    em ? baca(sb.from('cpl_kelas').select('id,tahun_akademik,semester,kode_mk,nama_mk,kelas').ilike('dosen_email', em)) : []]);
  const ids = karya.filter(k => k.status === 'terverifikasi' && !k.bukti_url).map(k => k.id);
  const [bukti, berkasCpl] = await Promise.all([
    ids.length ? baca(sb.from('karya_bukti').select('karya_id').in('karya_id', ids.slice(0, 300))) : [],
    kelasCpl.length ? baca(sb.from('cpl_berkas').select('kelas_id').in('kelas_id', kelasCpl.map(k => k.id))) : []]);
  // Lebih dari 300 karya tanpa bukti_url: sisanya dianggap berbukti (tidak dilaporkan keliru).
  const berBukti = new Set([...bukti.map(b => b.karya_id), ...ids.slice(300)]);
  // Target kinerja tahun berjalan (66-patch-target-dosen.sql); tanpa tabel atau tanpa target = tidak tampil.
  const th = new Date().getFullYear();
  const [tBaku, tKhusus, tKarya, tHibah, tSkema] = await Promise.all([
    baca(sb.from('target_baku').select('*').eq('tahun', th).eq('jabatan', saya.jabatan || '-')),
    baca(sb.from('target_dosen').select('*').eq('tahun', th).eq('dosen_id', saya.id)),
    baca(sb.from('karya').select('id,kategori,indeksasi,tahun,status,karya_penulis!inner(dosen_id)').eq('karya_penulis.dosen_id', saya.id)
      .eq('tahun', th).in('status', ['terverifikasi', 'diajukan'])),
    !fiturAktif('hibah') ? [] : baca(sb.from('hibah_ajuan').select('status,tanggal_ajuan,tahun_usulan,skema_kode,hibah_tim!inner(dosen_id)').eq('hibah_tim.dosen_id', saya.id)),
    baca(sb.from('ref_skema_dana').select('kode,kelompok'))]);
  const kel = new Map(tSkema.map(s => [s.kode, s.kelompok]));
  const target = (tBaku.length || tKhusus.length) ? barisDosen(saya, th, { baku: tBaku, khusus: tKhusus, karya: tKarya,
    hibah: tHibah.map(a => ({ ...a, skema: { kelompok: kel.get(a.skema_kode) } })) }) : [];
  // Evaluasi pembelajaran (68-patch-evaluasi-pembelajaran.sql); tanpa tabel = tidak tampil.
  const [evaluasi, tindakEval] = await Promise.all([
    baca(sb.from('evaluasi_mk').select('id,dosen_id,tahun_akademik,semester,kode_mk,rps_sesuai').eq('dosen_id', saya.id)),
    baca(sb.from('evaluasi_tindak').select('id,pj_id,status,rencana,masalah,tenggat,evaluasi_mk(kode_mk,tahun_akademik,semester)')
      .eq('pj_id', saya.id).in('status', ['terbuka', 'proses']))]);
  // OBE O1 (101-patch-evaluasi-cpl-gkm.sql): perlu tindak lanjut; rekap prodi hanya terbaca GKM/admin/pimpinan.
  const [perluTL, tanpaBaris] = await Promise.all([baca(sb.rpc('evaluasi_perlu_tl')), baca(sb.rpc('cpl_belum_tanpa_evaluasi'))]);
  // Koordinator MK dan pengampu (OBE O2-O3, pemilik 2026-11-17): CPMK/RPS dan portofolio. Data tambahan hanya dimuat
  // bila pengguna koordinator MK (ref_mata_kuliah.pengampu) atau mengajar kelas (daftar kelas CPL).
  // MK universitas/fakultas (pemilik 2026-11-24): penyelenggara dan PIC (koordinator_nidn, 158) ikut dimuat; tanpa patch 158 = tanpa kolom itu.
  const KOLOM_MK = 'kurikulum,kode,nama,semester,aktif,unit_penyelenggara,pengampu,rps_url,rps_ada';
  let mkRef = await sb.from('ref_mata_kuliah').select(KOLOM_MK + ',koordinator_nidn').then(r => (r.error ? null : r.data || []), () => null);
  if (!mkRef) mkRef = await baca(sb.from('ref_mata_kuliah').select(KOLOM_MK));
  let dataMK = null;
  const tim = await kelasMengajarSaya(sb, saya);   // 137: termasuk anggota team teaching (Penyusunan kelas)
  // Admin juga (pemilik 2026-11-28): portofolio kelas dosen luar DTPS dibantu admin.
  if ((saya.nidn && mkRef.some(m => (m.pengampu || []).includes(saya.nidn))) || kelasCpl.length || tim.length || saya.peran === 'admin') {
    const [struktur, refCpl, peta, kelasMK, berkasPorto] = await Promise.all([
      baca(sb.from('mk_struktur').select('kurikulum,kode_mk,data')),
      baca(sb.from('ref_cpl').select('kurikulum,kode,rumusan,indikator,urutan')),
      baca(sb.from('ref_mk_cpl').select('kurikulum,kode_mk,cpl,indikator')),
      sb.rpc('portofolio_ringkas').then(r => r.data?.kelas || [], () => []),
      baca(sb.from('portofolio_berkas').select('tahun_akademik,semester,kurikulum,kode_mk,kelas,komponen,asesmen'))]);
    const rpsBaris = await baca(sb.from('mk_rps').select('kurikulum,kode_mk,data,sah'));
    const rubrikMK = new Map(rpsBaris.map(r => [`${r.kurikulum}|${r.kode_mk}`, rubrikRps(r.sah?.rps || r.data)]));
    // Jurnal perkuliahan (206): rekap per kelas; jurnal lengkap memenuhi komponen BAP (tanpa patch = kosong).
    const rencanaMK = new Map(rpsBaris.map(r => [`${r.kurikulum}|${r.kode_mk}`, rencanaRps(r.sah?.rps || r.data)]));
    const [kk, jr] = await Promise.all([baca(sb.from('kelas_kuliah').select('id,tahun_akademik,semester,kurikulum,kode_mk,kelas')),
      baca(sb.from('kelas_pertemuan').select('kelas_id,materi,materi_rps'))]);
    const jurnal = new Map(kk.map(k => [`${k.tahun_akademik}|${k.semester}|${String(k.kode_mk).toUpperCase()}|${k.kelas}`,
      rekapJurnal(jr.filter(j => j.kelas_id === k.id), rencanaMK.get(`${k.kurikulum}|${k.kode_mk}`) || [])]));
    const dtpsEmail = saya.peran === 'admin' ? new Set((await baca(sb.from('dosen').select('email,dtps,aktif')))
      .filter(x => x.dtps === true && x.aktif !== false && x.email).map(x => String(x.email).toLowerCase())) : null;
    dataMK = { mk: mkRef, struktur, refCpl, peta, kelas: kelasMK, berkas: berkasPorto, tinjau: await bacaTinjauan(sb), rubrikRps: rubrikMK, tim, dtpsEmail, jurnal };   // tinjauan RPS (115)
  }
  // Pengajuan mahasiswa (90-patch-pengajuan-mahasiswa.sql); tanpa tabel = tidak tampil.
  const pengajuanMhs = await baca(sb.from('pengajuan_mahasiswa').select('nama,jenis,status,pembimbing_id,diperbarui')
    .in('status', ['pembimbing', 'admin']).limit(500));
  // Revisi TA (95-patch-revisi-ta.sql); tanpa kolom = tidak tampil.
  const revisiTa = await baca(sb.from('jadwal_ta').select('id,nama_mahasiswa,judul,pembimbing,hasil,batas_revisi,revisi_selesai')
    .eq('hasil', 'lulus_revisi').is('revisi_selesai', null).limit(500));
  // Penilaian seminar/sidang TA (173-patch-penilaian-ta.sql); tanpa patch = kosong.
  const nilaiTa = await sb.rpc('ta_nilai_tugas').then(r => (Array.isArray(r.data) ? r.data : []), () => []);
  // Catatan bimbingan TA menunggu konfirmasi saya (175-patch-bimbingan-ta.sql); tanpa patch = kosong.
  const bimbinganTa = await sb.rpc('ta_bimbingan_menunggu').then(r => (Array.isArray(r.data) ? r.data : []), () => []);
  // Peringatan dini TA (183-patch-peringatan-pengingat-ta.sql); tanpa patch = kosong.
  const peringatanTa = await sb.rpc('ta_peringatan_dini').then(r => (Array.isArray(r.data) ? r.data : []), () => []);
  const perwalian = await sb.rpc('perwalian_tugas').then(r => r.data || null, () => null);   // 186
  // Review sejawat RPS (118/119): penunjukan milik sendiri (RLS), rekap per MK, dan MK yang boleh saya susun. Tanpa patch = kosong.
  const [reviewSaya, rekapReview, bolehRps] = await Promise.all([
    baca(sb.from('mk_rps_review').select('kurikulum,kode_mk,ditunjuk_pada,kirim_pada').eq('reviewer_id', saya.id)),
    sb.rpc('rps_review_rekap').then(r => (Array.isArray(r.data) ? r.data : []), () => []),
    baca(sb.rpc('rps_boleh_saya'))]);
  const mkNama = new Map(mkRef.map(m => [`${m.kurikulum}|${m.kode}`, m.nama]));
  // Tenggat RPS dan review (120): pengaturan + status RPS (semester MK pilihan dari isian RPS). Tanpa patch = tanpa tenggat.
  const [atur, rpsSt] = await Promise.all([
    baca(sb.from('pengaturan').select('kunci,nilai').in('kunci', ['rps_tenggat_ganjil', 'rps_tenggat_genap', 'rps_review_hari'])),
    baca(sb.from('mk_rps').select('kurikulum,kode_mk,status,revisi,tetap_pada,smt:data->identitas->>semester'))]);
  const nilaiAtur = k => atur.find(x => x.kunci === k)?.nilai;
  const tenggatRps = { Ganjil: isoDari(nilaiAtur('rps_tenggat_ganjil')), Genap: isoDari(nilaiAtur('rps_tenggat_genap')) };
  const rpsStatus = new Map(rpsSt.map(r => [`${r.kurikulum}|${r.kode_mk}`, r]));
  // Sertifikat milik sendiri untuk pengingat masa berlaku (pemilik 2026-11-24).
  const sertifikat = await sb.from('dosen').select('sertifikat').eq('id', saya.id).maybeSingle().then(r => r.data?.sertifikat || [], () => []);
  // Insentif publikasi (163, pemilik 2026-11-24): klaim yang terbaca (milik sendiri, sebagai penulis, atau semua bagi admin/Kaprodi).
  const klaimIns = await sb.from('insentif_publikasi').select('karya_id,pengklaim_id,status,catatan').in('status', ['diklaim', 'dikembalikan'])
    .then(r => r.data || [], () => []);
  let insentif = null;
  if (klaimIns.length) {
    const idsK = [...new Set(klaimIns.map(x => x.karya_id))];
    const [kj, kb] = await Promise.all([baca(sb.from('karya').select('id,judul,status').in('id', idsK)),
      baca(sb.from('karya_bukti').select('karya_id,jenis').in('karya_id', idsK))]);
    const bukti = new Map(); for (const b of kb) { if (!bukti.has(b.karya_id)) bukti.set(b.karya_id, []); bukti.get(b.karya_id).push(b); }
    insentif = { klaim: klaimIns, karya: new Map(kj.map(x => [x.id, x])), bukti,
      pengelola: saya.peran === 'admin' || (saya.koordinator || []).includes('kaprodi') };
  }
  // Agenda tugas berjadwal (191, pemilik 2026-11-27): admin, Kaprodi, GKM; tanpa tabel = kosong.
  const kelolaAgenda = saya.peran === 'admin' || ['kaprodi', 'gkm'].some(j => (saya.koordinator || []).includes(j));
  const batasAgenda = new Date(Date.now() + 7 * 3600e3 + 14 * 864e5).toISOString().slice(0, 10);
  const agenda = kelolaAgenda ? await baca(sb.from('agenda_tugas').select('id,judul,keterangan,mulai,tenggat,tautan,status')
    .eq('status', 'terbuka').lte('mulai', batasAgenda).order('mulai')) : [];
  // Survei yang sedang dibuka (pemilik 2026-11-27): admin dan GKM melihat responden dibanding target (survei-mutu.js).
  // Data target hanya dimuat bila ada survei terbuka.
  let surveiBerjalan = [];
  if (saya.peran === 'admin' || (saya.koordinator || []).includes('gkm')) {
    const hariIni = new Date(Date.now() + 7 * 3600e3).toISOString().slice(0, 10);
    const buka = await baca(sb.from('survei').select('id,judul,kelompok,tahun_ts,mulai,selesai,dicabut')
      .lte('mulai', hariIni).gte('selesai', hariIni).eq('dicabut', false));
    if (buka.length) {
      const { muatPopulasi, targetSurvei } = await import('./survei-mutu.js?v=2026-11-28-777263');
      const [pop, ns] = await Promise.all([muatPopulasi(sb, saya), Promise.all(buka.map(s =>
        sb.from('survei_jawaban').select('id', { count: 'exact', head: true }).eq('survei_id', s.id).then(r => r.count || 0, () => 0)))]);
      surveiBerjalan = buka.map((s, i) => ({ judul: s.judul, selesai: s.selesai, n: ns[i], target: targetSurvei(s, pop, hariIni).target }));
    }
  }
  // Kotak masuk mahasiswa (193): admin, Kaprodi, GKM; RLS menyaring (pengaduan hanya Kaprodi/GKM).
  const kotakMasuk = (saya.peran === 'admin' || ['kaprodi', 'gkm'].some(j => (saya.koordinator || []).includes(j)))
    ? await baca(sb.from('masukan_mahasiswa').select('jenis,status,dikirim').eq('status', 'baru').limit(500)) : [];
  // Ujian (195): jadwal 21 hari ke depan (kelas dan pengawas) dan status validasi soal; tanpa patch = kosong.
  const hariUjian = new Date(Date.now() + 7 * 3600e3).toISOString().slice(0, 10);
  const batasUjian = new Date(Date.now() + 7 * 3600e3 + 21 * 864e5).toISOString().slice(0, 10);
  const ujian = (await baca(sb.from('ujian_jadwal').select('id,jenis,tanggal,mulai,selesai,ruang,kelas_kuliah(tahun_akademik,semester,kurikulum,kode_mk,kelas),ujian_pengawas(dosen_id)')
    .gte('tanggal', hariUjian).lte('tanggal', batasUjian))).map(u => ({ ...u, ...(u.kelas_kuliah || {}), pengawas: (u.ujian_pengawas || []).map(p => p.dosen_id),
      nama_mk: mkRef.find(m => m.kurikulum === u.kelas_kuliah?.kurikulum && m.kode === u.kelas_kuliah?.kode_mk)?.nama }));
  const soalValidasi = ujian.length || saya.peran === 'admin' || ['kaprodi', 'gkm'].some(j => (saya.koordinator || []).includes(j))
    ? await baca(sb.from('soal_validasi').select('tahun_akademik,semester,kurikulum,kode_mk,asesmen,status,catatan').in('status', ['diajukan', 'revisi', 'layak']).limit(2000)) : [];
  const sdmRencana = await baca(sb.from('sdm_rencana').select('dosen_id,jenis,uraian,tahun_target,status').eq('dosen_id', saya.id)
    .in('status', ['rencana', 'berjalan']));   // 198
  // Laboratorium (199): kepala lab (labnya), admin dan Kaprodi (semua lab); tanpa patch = kosong.
  const labSaya = saya.koordinatorLab || [], kelolaSemua = saya.peran === 'admin' || (saya.koordinator || []).includes('kaprodi');
  let lab = null;
  if (kelolaSemua || labSaya.length) {
    const [la, al, pj] = await Promise.all([baca(sb.from('laboratorium').select('id,nama')),
      baca(sb.from('lab_alat').select('id,laboratorium_id,nama,kondisi,kalibrasi_perlu,kalibrasi_terakhir,kalibrasi_bulan')),
      // 204: status dan tanggal pinjam untuk pengajuan daring yang menunggu kepala lab.
      baca(sb.from('lab_pinjam').select('alat_id,peminjam,rencana_kembali,kembali_pada,status,tanggal_pinjam').is('kembali_pada', null))]);
    lab = { lab: la, alat: al, pinjam: pj, labSaya: kelolaSemua ? null : labSaya };
  }
  // Forum pemangku (200): yang terbaca RLS (pengelola semua, dosen PJ miliknya), hanya yang belum diputuskan.
  const masukanPemangku = await baca(sb.from('pemangku_masukan').select('id,tanggal,topik,isi,status,pj_dosen_id,tenggat').in('status', ['baru', 'dikaji']));
  // Surat dan SK (201): yang terbaca RLS (penyusun, pimpinan), hanya yang menunggu tanda tangan atau dikembalikan.
  const surat = await baca(sb.from('surat').select('id,jenis,perihal,status,penandatangan,catatan,surat_jenis(nama,penandatangan)').in('status', ['diajukan', 'dikembalikan']));
  // Karier dan asisten (202): usulan lowongan (hanya terbaca pengelola) dan rekrutmen dengan lamaran yang terbaca (pengelola rekrutmen itu).
  const lowonganUsulan = await baca(sb.from('lowongan').select('id,status,diusulkan').eq('status', 'usulan'));
  const rekrutmenAsisten = (await baca(sb.from('asisten_rekrutmen').select('id,judul,status,tutup,sk_surat_id,lamaran:asisten_lamaran(status)')
    .in('status', ['buka', 'tutup', 'selesai']))).filter(r => (r.lamaran || []).length);
  return tugasSaya({ saya, agenda, surveiBerjalan, kotakMasuk, ujian, soalValidasi, sdmRencana, lab, masukanPemangku, surat, lowonganUsulan, rekrutmenAsisten, sertifikat, insentif, karya: [...karya, ...draf], berBukti, bkd, tindak, hibah, temuan, kelasCpl, berkasCpl, target, tahunTarget: th,
                     evaluasi, tindakEval, perluTL, tanpaBaris, pengajuanMhs, revisiTa, nilaiTa, bimbinganTa, peringatanTa, perwalian, dataMK, reviewSaya, rekapReview, bolehRps, mkNama,
                     hariReview: +nilaiAtur('rps_review_hari') || undefined, tenggatRps, mkRef, rpsStatus });
}

function htmlTugas(xs){
  const teks = { lewat: 'lewat', dekat: 'segera', biasa: '' };
  const li = x => `<li class="${x.tingkat}"><span class="tk">${esc(teks[x.tingkat] || LABEL_JENIS[x.jenis] || '')}</span>
    <div>${x.href ? `<a href="${esc(x.href)}">${esc(x.judul)}</a>` : `<b>${esc(x.judul)}</b>`}<span>${esc(x.rinci)}</span></div></li>`;
  if (!xs.length) return `<section class="tugas"><h2>Tugas saya</h2><p>Tidak ada yang menunggu tindakan Anda. Terima kasih.</p></section>`;
  const lewat = xs.filter(x => x.tingkat === 'lewat').length;
  return `<section class="tugas"><h2>Tugas saya</h2>
    <p>${xs.length} hal menunggu tindakan Anda${lewat ? `, ${lewat} lewat tenggat` : ''}.</p>
    <ul>${xs.slice(0, MAKS_TAMPIL).map(li).join('')}</ul>
    ${xs.length > MAKS_TAMPIL ? `<details><summary>Tampilkan ${xs.length - MAKS_TAMPIL} lainnya</summary><ul>${xs.slice(MAKS_TAMPIL).map(li).join('')}</ul></details>` : ''}</section>`;
}

sb.auth.onAuthStateChange(ev => {
  if (ev === 'SIGNED_IN' && !siap) { pengguna(sb, true); mulai(); }
});
mulai().catch(e => { $('isi').innerHTML = `<p class="hint">${esc(e.message)}</p>`; });
</script>
