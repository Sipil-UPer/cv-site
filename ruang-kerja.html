<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ruang kerja — Kinerja Program Studi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tema.css?v=2026-11-13-08f7cd">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
       font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
  .hero{background:var(--biru);color:#fff;border-bottom:4px solid var(--merah)}
  .hero-in{max-width:1180px;margin:0 auto;padding:34px 24px 30px}
  .hero-baris{display:flex;gap:20px;align-items:center;margin-top:14px;flex-wrap:wrap}
  .logo-kampus{background:#fff;border-radius:6px;padding:8px 12px;line-height:0}
  .logo-kampus img{height:72px}
  .eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;
           text-transform:uppercase;color:var(--biru-m3)}
  h1{font-family:var(--serif);font-weight:600;font-size:30px;margin:6px 0 4px}
  .sub{color:var(--biru-m5);font-size:14px}
  .balik{color:var(--biru-m5);font-size:13px;text-decoration:none}
  .balik:hover{color:#fff}
  .wrap{max-width:1180px;margin:0 auto;padding:26px 24px 60px}
  .modul{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px}
  .m{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--biru);
     border-radius:4px;padding:18px 20px}
  .m h2{font-family:var(--serif);font-size:19px;margin:0 0 2px;color:var(--biru)}
  .m>p{margin:0 0 12px;color:var(--muted);font-size:13.5px}
  .m a{display:block;text-decoration:none;color:var(--ink);padding:9px 10px;margin:0 -10px;
       border-radius:3px}
  .m a:hover{background:var(--line-soft)}
  .m a b{color:var(--biru-2)}
  .m a span{display:block;color:var(--muted);font-size:13px}
  .info{background:#FFF8E5;border:1px solid #E8D9A8;border-radius:4px;padding:10px 14px;
        margin-bottom:18px;font-size:14px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:4px;
         padding:22px 24px;max-width:440px}
  .panel h2{margin:0 0 6px;font-family:var(--serif)}
  .hint{color:var(--muted);font-size:14px}
  label{display:block;font-size:13px;font-weight:600;margin:12px 0 4px}
  input{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:3px}
  .btn{font:inherit;font-weight:600;background:var(--biru);color:#fff;border:0;border-radius:3px;
       padding:8px 16px;cursor:pointer;margin-top:14px}
  .btn.ghost{background:none;color:var(--biru);border:1px solid var(--line)}
  .msg{margin-left:10px;font-size:13.5px}
  .msg.err{color:var(--merah)} .msg.ok{color:var(--hijau)}
  .tugas{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--merah);
         border-radius:4px;padding:16px 20px;margin-bottom:22px}
  .tugas h2{font-family:var(--serif);font-size:19px;margin:0 0 2px;color:var(--biru)}
  .tugas>p{margin:0 0 8px;color:var(--muted);font-size:13.5px}
  .tugas ul{list-style:none;margin:0;padding:0}
  .tugas li{border-top:1px solid var(--line-soft);padding:8px 0;display:flex;gap:10px;align-items:baseline}
  .tugas li:first-child{border-top:0}
  .tugas .tk{flex:none;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;
             border-radius:3px;padding:1px 6px;background:var(--line-soft);color:var(--muted);min-width:64px;text-align:center}
  .tugas .lewat .tk{background:var(--merah);color:#fff}
  .tugas .dekat .tk{background:#8A5A00;color:#fff}
  .tugas li a,.tugas li b{color:var(--biru-2);font-weight:600;text-decoration:none}
  .tugas li a:hover{text-decoration:underline}
  .tugas li span{display:block;color:var(--muted);font-size:13px}
  .tugas details summary{cursor:pointer;color:var(--biru-2);font-size:13.5px;margin-top:6px}
  @media(max-width:640px){.hero-in,.wrap{padding-left:16px;padding-right:16px}
    .modul{grid-template-columns:1fr}}
</style>
</head>
<body>

<header class="hero">
  <div class="hero-in">
    <a class="balik" href="index.html">&larr; Beranda umum</a>
    <div class="hero-baris">
      <div class="logo-kampus"><img src="logo-uper.png" alt="" id="hLogo"></div>
      <div>
        <div class="eyebrow" id="hInst">&nbsp;</div>
        <h1 id="hProdi">Ruang kerja</h1>
        <div class="sub"><b>Ruang kerja</b> &middot; <span id="hSub">khusus email yang didaftarkan admin prodi.</span></div>
      </div>
    </div>
  </div>
</header>

<main class="wrap" id="isi"><p class="hint">Memuat&hellip;</p></main>

<script src="config.js?v=2026-11-13-08f7cd"></script>
<script>
// Galat saat memuat skrip (mis. modul lama dari cache) tampil sebagai pesan.
addEventListener('error', function (e) {
  if (document.getElementById('galat-muat')) return;
  var d = document.createElement('div');
  d.id = 'galat-muat';
  d.style.cssText = 'margin:16px;padding:12px 14px;border:1px solid var(--merah);' +
    'background:var(--merah-m3);color:var(--ink);font:14px/1.5 system-ui,sans-serif';
  d.textContent = 'Halaman gagal dimuat: ' + (e.message || 'galat skrip') +
    '. Tekan Ctrl+Shift+R untuk memuat ulang tanpa cache; bila tetap muncul, kirim pesan ini ke admin.';
  document.body.insertBefore(d, document.body.firstChild);
});
</script>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
import { pengguna, pasangMenu, halamanBoleh, bolehBuka, identitas, pasangJudul } from './menu.js?v=2026-11-13-08f7cd';
import { hitungVerifikasi } from './verifikasi-hitung.js?v=2026-11-13-08f7cd';
import { tugasSaya } from './tugas-saya.js?v=2026-11-13-08f7cd';
import { fiturAktif, halamanAktif } from './fitur.js?v=2026-11-13-08f7cd';
import { barisDosen } from './target-kinerja.js?v=2026-11-13-08f7cd';

const sb = createClient(window.SB_URL, window.SB_KEY);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const q = new URLSearchParams(location.search);
// ?ke= : halaman yang diminta sebelum login (dari gerbang di menu.js).
// ?tolak= : halaman yang tidak boleh dibuka peran ini.
const KE = q.get('ke'), TOLAK = q.get('tolak');
let siap = false;

// Merek institusi di kepala halaman, juga di layar masuk.
identitas().then(({ prodi, institusi }) => {
  if (institusi) { $('hInst').textContent = institusi; $('hLogo').alt = institusi; }
  if (prodi) $('hProdi').textContent = 'Program Studi ' + prodi;
});
pasangJudul();

async function mulai(){
  const u = await pengguna(sb);
  if (!u) return layarMasuk();
  if (!u.saya) return layarTidakTerdaftar(u.email);
  siap = true;
  // Hanya halaman ruang kerja yang dikenal menu.js, supaya ?ke= tidak bisa
  // dipakai mengalihkan ke situs lain.
  if (KE && bolehBuka(u.saya, KE)) return location.replace(KE);
  await pasangMenu(sb);
  $('hSub').textContent = `Masuk sebagai ${u.saya.nama} (${u.saya.peran}).`;
  const tolak = TOLAK || (KE && bolehBuka(u.saya, KE) === false ? KE : '');
  $('isi').innerHTML = (tolak ? `<div class="info">Halaman <code>${esc(tolak.split('?')[0])}</code>
      ${halamanAktif(tolak) ? `tidak tersedia untuk peran ${esc(u.saya.peran)}. Hubungi admin prodi bila perlu akses.`
        : 'termasuk modul yang tidak diaktifkan di situs ini.'}</div>` : '')
    + `<div class="modul">${halamanBoleh(u.saya).map(m => `<section class="m">
        <h2>${esc(m.judul)}</h2><p>${esc(m.ket)}</p>
        ${m.halaman.map(h => `<a href="${esc(h.href)}"><b>${esc(h.judul)}</b>
          <span>${esc(h.ket)}</span></a>`).join('')}</section>`).join('')}</div>`;
  if (u.saya.peran !== 'asesor') {
    $('isi').querySelector('.modul').insertAdjacentHTML('beforebegin', '<div id="tugas"></div>');
    muatTugas(u.saya).then(xs => { $('tugas').innerHTML = htmlTugas(xs); })
      .catch(e => { $('tugas').innerHTML = `<p class="hint">Tugas saya gagal dimuat: ${esc(e.message || e)}</p>`; });
  }
  // Total yang menunggu verifikasi pada kartu Verifikasi (admin; pemilik 2026-11-08).
  const kartu = $('isi').querySelector('a[href="verifikasi.html"] b');
  if (kartu) hitungVerifikasi(sb).then(n => {
    if (n.total) kartu.insertAdjacentHTML('beforeend',
      ` <span style="display:inline-block;background:#8A5A00;color:#fff;border-radius:9px;padding:0 7px;font-size:12px">${n.total} menunggu</span>`);
  });
}

function layarMasuk(){
  $('isi').innerHTML = `<div class="panel"><h2>Masuk</h2>
    <p class="hint">Gunakan email kampus yang sudah didaftarkan admin prodi.
    Kami kirimkan tautan masuk — tidak ada kata sandi yang perlu diingat.</p>
    <label for="em">Alamat email</label>
    <input id="em" type="email" autocomplete="email" placeholder="nama@kampus.ac.id">
    <button class="btn" id="kirim">Kirim tautan masuk</button><span class="msg" id="m"></span></div>`;
  const em = $('em'), m = $('m'), kirim = $('kirim');
  em.onkeydown = e => { if (e.key === 'Enter') kirim.click(); };
  kirim.onclick = async () => {
    m.className = 'msg';
    if (!em.value.includes('@')) { m.className = 'msg err'; m.textContent = 'Masukkan email yang valid.'; return; }
    kirim.disabled = true; m.textContent = 'Mengirim…';
    const { error } = await sb.auth.signInWithOtp({ email: em.value.trim(),
      options: { emailRedirectTo: location.href.split('#')[0] } });
    kirim.disabled = false;
    if (error) { m.className = 'msg err'; m.textContent = error.message; }
    else { m.className = 'msg ok'; m.textContent = 'Tautan terkirim. Periksa kotak masuk Anda.'; }
  };
}

function layarTidakTerdaftar(email){
  $('isi').innerHTML = `<div class="panel"><h2>Email belum terdaftar</h2>
    <p class="hint"><strong>${esc(email)}</strong> belum ada di daftar prodi.
    Hubungi admin prodi untuk didaftarkan.</p>
    <button class="btn ghost" id="kl">Keluar</button></div>`;
  $('kl').onclick = async () => { await sb.auth.signOut(); location.reload(); };
}

// "Tugas saya" (pemilik 2026-11-12; tugas-saya.js). Tabel yang belum ada (patch belum
// dijalankan) dibaca sebagai kosong; RLS membatasi pada data milik sendiri.
const LABEL_JENIS = { profil: 'Profil', karya: 'Karya', bkd: 'BKD', rapat: 'Rapat', hibah: 'Hibah', ami: 'AMI', cpl: 'CPL', target: 'Target', evaluasi: 'Evaluasi' };
const MAKS_TAMPIL = 8;
async function muatTugas(saya){
  const baca = q => q.then(r => r.error ? [] : (r.data || []), () => []);
  const em = saya.email || '';
  const [karya, draf, bkd, tindak, hibah, temuan, kelasCpl] = await Promise.all([
    baca(sb.from('karya').select('id,judul,status,bukti_url,catatan,dilaporkan_oleh,karya_penulis!inner(dosen_id)')
      .eq('karya_penulis.dosen_id', saya.id).in('status', ['ditolak', 'terverifikasi']).limit(2000)),
    // Draf hanya terbaca oleh pelapor/penulisnya (41-patch-draf-karya.sql).
    baca(sb.from('karya').select('id,judul,status,dilaporkan_oleh,karya_penulis(dosen_id)').eq('status', 'draf').limit(500)),
    baca(sb.from('lkps_bkd').select('tahun_akademik,semester,verifikasi,catatan').eq('verifikasi', 'ditolak')),
    !fiturAktif('rapat') ? [] : baca(sb.from('rapat_tindak').select('id,rapat_id,keputusan,tenggat,status,pj_dosen_id,rapat(judul,tanggal)')
      .eq('pj_dosen_id', saya.id).in('status', ['terbuka', 'proses'])),
    !fiturAktif('hibah') ? [] : baca(sb.from('hibah_ajuan').select('judul,status,tenggat_ajuan,tanggal_ajuan,tenggat_kemajuan,kemajuan_selesai,tenggat_akhir,akhir_selesai,hibah_tim!inner(dosen_id,peran)')
      .eq('hibah_tim.dosen_id', saya.id).in('status', ['rencana', 'didanai'])),
    em ? baca(sb.from('ami_temuan').select('kode,siklus,uraian,status,tenggat,pj_email').ilike('pj_email', em)) : [],
    em ? baca(sb.from('cpl_kelas').select('id,tahun_akademik,semester,kode_mk,nama_mk,kelas').ilike('dosen_email', em)) : []]);
  const ids = karya.filter(k => k.status === 'terverifikasi' && !k.bukti_url).map(k => k.id);
  const [bukti, berkasCpl] = await Promise.all([
    ids.length ? baca(sb.from('karya_bukti').select('karya_id').in('karya_id', ids.slice(0, 300))) : [],
    kelasCpl.length ? baca(sb.from('cpl_berkas').select('kelas_id').in('kelas_id', kelasCpl.map(k => k.id))) : []]);
  // Lebih dari 300 karya tanpa bukti_url: sisanya dianggap berbukti (tidak dilaporkan keliru).
  const berBukti = new Set([...bukti.map(b => b.karya_id), ...ids.slice(300)]);
  // Target kinerja tahun berjalan (66-patch-target-dosen.sql); tanpa tabel atau tanpa target = tidak tampil.
  const th = new Date().getFullYear();
  const [tBaku, tKhusus, tKarya, tHibah, tSkema] = await Promise.all([
    baca(sb.from('target_baku').select('*').eq('tahun', th).eq('jabatan', saya.jabatan || '-')),
    baca(sb.from('target_dosen').select('*').eq('tahun', th).eq('dosen_id', saya.id)),
    baca(sb.from('karya').select('id,kategori,indeksasi,tahun,status,karya_penulis!inner(dosen_id)').eq('karya_penulis.dosen_id', saya.id)
      .eq('tahun', th).in('status', ['terverifikasi', 'diajukan'])),
    !fiturAktif('hibah') ? [] : baca(sb.from('hibah_ajuan').select('status,tanggal_ajuan,tahun_usulan,skema_kode,hibah_tim!inner(dosen_id)').eq('hibah_tim.dosen_id', saya.id)),
    baca(sb.from('ref_skema_dana').select('kode,kelompok'))]);
  const kel = new Map(tSkema.map(s => [s.kode, s.kelompok]));
  const target = (tBaku.length || tKhusus.length) ? barisDosen(saya, th, { baku: tBaku, khusus: tKhusus, karya: tKarya,
    hibah: tHibah.map(a => ({ ...a, skema: { kelompok: kel.get(a.skema_kode) } })) }) : [];
  // Evaluasi pembelajaran (68-patch-evaluasi-pembelajaran.sql); tanpa tabel = tidak tampil.
  const [evaluasi, tindakEval] = await Promise.all([
    baca(sb.from('evaluasi_mk').select('id,dosen_id,tahun_akademik,semester,kode_mk,rps_sesuai').eq('dosen_id', saya.id)),
    baca(sb.from('evaluasi_tindak').select('id,pj_id,status,rencana,masalah,tenggat,evaluasi_mk(kode_mk,tahun_akademik,semester)')
      .eq('pj_id', saya.id).in('status', ['terbuka', 'proses']))]);
  return tugasSaya({ saya, karya: [...karya, ...draf], berBukti, bkd, tindak, hibah, temuan, kelasCpl, berkasCpl, target, tahunTarget: th, evaluasi, tindakEval });
}

function htmlTugas(xs){
  const teks = { lewat: 'lewat', dekat: 'segera', biasa: '' };
  const li = x => `<li class="${x.tingkat}"><span class="tk">${esc(teks[x.tingkat] || LABEL_JENIS[x.jenis] || '')}</span>
    <div>${x.href ? `<a href="${esc(x.href)}">${esc(x.judul)}</a>` : `<b>${esc(x.judul)}</b>`}<span>${esc(x.rinci)}</span></div></li>`;
  if (!xs.length) return `<section class="tugas"><h2>Tugas saya</h2><p>Tidak ada yang menunggu tindakan Anda. Terima kasih.</p></section>`;
  const lewat = xs.filter(x => x.tingkat === 'lewat').length;
  return `<section class="tugas"><h2>Tugas saya</h2>
    <p>${xs.length} hal menunggu tindakan Anda${lewat ? `, ${lewat} lewat tenggat` : ''}.</p>
    <ul>${xs.slice(0, MAKS_TAMPIL).map(li).join('')}</ul>
    ${xs.length > MAKS_TAMPIL ? `<details><summary>Tampilkan ${xs.length - MAKS_TAMPIL} lainnya</summary><ul>${xs.slice(MAKS_TAMPIL).map(li).join('')}</ul></details>` : ''}</section>`;
}

sb.auth.onAuthStateChange(ev => {
  if (ev === 'SIGNED_IN' && !siap) { pengguna(sb, true); mulai(); }
});
mulai().catch(e => { $('isi').innerHTML = `<p class="hint">${esc(e.message)}</p>`; });
</script>
</body>
</html>
