<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Rekap SDGs dan bukti — Ruang kerja</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tema.css?v=2026-11-20-85f5d3">
<link rel="stylesheet" href="kepala.css?v=2026-11-20-85f5d3">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
  .wrap{max-width:1120px;margin:0 auto;padding:18px 20px 80px}
  .kosong, .ket{color:var(--muted)}
  .ket{font-size:13px}
  .ringkas{display:flex;flex-wrap:wrap;gap:10px;margin:4px 0 14px}
  .ringkas div{background:var(--panel);border:1px solid var(--line);padding:8px 14px}
  .ringkas b{font-family:var(--mono);font-size:20px;display:block}
  .ringkas span{font-size:12.5px;color:var(--muted)}
  .ringkas .awas b{color:var(--merah)}
  .sdg-kisi{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin:6px 0 14px}
  .sdg{font:inherit;text-align:left;background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--w);padding:6px 9px;cursor:pointer}
  .sdg[aria-pressed="true"]{box-shadow:0 0 0 2px var(--w)}
  .sdg.nol{opacity:.5}
  .sdg .no{font-family:var(--mono);font-size:11px;color:var(--muted)}
  .sdg .n{font-family:var(--mono);font-size:17px;float:right}
  .sdg .nm{font-size:12px;line-height:1.25;display:block;clear:both}
  .saring{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin:4px 0 12px;font-size:13.5px}
  .saring select, .saring input[type=search]{font:inherit;font-size:14px;padding:5px 7px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
  .saring input[type=search]{min-width:240px}
  .unduh{font:inherit;font-size:13.5px;padding:6px 12px;border:1px solid var(--biru);background:var(--biru);color:#fff;cursor:pointer;margin-left:auto}
  .unduh:disabled{opacity:.5;cursor:default}
  table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);font-size:14px}
  th{text-align:left;font-size:12px;color:var(--muted);font-weight:500;border-bottom:1px solid var(--line);padding:7px 10px;background:var(--bg)}
  td{border-bottom:1px solid var(--line-soft);padding:8px 10px;vertical-align:top}
  td .judul{font-weight:600}
  td .judul a{color:var(--biru-2)}
  td .sub{font-size:12.5px;color:var(--muted)}
  .lencana{display:inline-block;font-family:var(--mono);font-size:11px;color:#fff;background:var(--w);padding:1px 6px;margin:0 3px 3px 0}
  .bukti{margin:0;padding-left:16px;font-size:13px}
  .bukti a{color:var(--biru-2);overflow-wrap:anywhere}
  .tanpa{color:var(--merah);font-size:13px;font-weight:600}
  .tunggu{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;color:var(--emas)}
  @media(max-width:760px){thead{display:none}tr{display:block;border-bottom:1px solid var(--line)}td{display:block;border:0;padding:4px 10px}}
</style>
</head>
<body>
<header class="hero"><div class="hero-in">
  <div class="hero-inst" data-identitas></div>
  <h1>Rekap SDGs dan bukti</h1>
  <div class="sub" id="hSub">Memuat…</div>
</div></header>
<main class="wrap" id="isi"><p class="kosong">Memuat…</p></main>
<script src="config.js?v=2026-11-20-85f5d3"></script>
<script>
// Galat saat memuat skrip ditampilkan sebagai pesan, bukan halaman kosong.
addEventListener('error', function (e) {
  if (document.getElementById('galat-muat')) return;
  var d = document.createElement('div');
  d.id = 'galat-muat';
  d.style.cssText = 'margin:16px;padding:12px 14px;border:1px solid var(--merah);' +
    'background:var(--merah-m3);color:var(--ink);font:14px/1.5 system-ui,sans-serif';
  d.textContent = 'Halaman gagal dimuat: ' + (e.message || 'galat skrip') +
    '. Tekan Ctrl+Shift+R untuk memuat ulang tanpa cache; bila tetap muncul, kirim pesan ini ke admin.';
  document.body.insertBefore(d, document.body.firstChild);
});
</script>
<script type="module">
// Rekap SDGs dengan bukti untuk Monitoring (pemilik 2026-11-16): karya yang dikaitkan dosen ke SDG
// (karya.sdgs, 47-patch-sdgs.sql) beserta berkas bukti (karya_bukti) dan DOI/tautannya, langsung dari
// Supabase, jadi SDG yang baru disetujui segera terlihat. Halaman publik sdgs.html hanya daftar, tanpa bukti.
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/+esm';
import { gerbang } from './menu.js?v=2026-11-20-85f5d3';
import { jagaHalaman } from './fitur.js?v=2026-11-20-85f5d3';
import { SDGS, WARNA_SDG } from './form-karya.js?v=2026-11-20-85f5d3';
import { opsiPeriode, cocokPeriode, labelPeriode, namaBerkas, lembarUnduh, tsKarya, taTeks } from './sdgs-unduh.js?v=2026-11-20-85f5d3';
import { SHEETJS } from './nilai-cpl.js?v=2026-11-20-85f5d3';
if (!jagaHalaman()) await new Promise(() => {});   // modul SDGs dimatikan (config.js FITUR_MATI)

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = id => document.getElementById(id);
const sb = createClient(window.SB_URL, window.SB_KEY);
const KAT = { publikasi: 'Publikasi', penelitian: 'Penelitian', pkm: 'PkM', luaran: 'Luaran' };
const JENIS_BUKTI = { naskah: 'Naskah', sk: 'SK', korespondensi: 'Korespondensi', laporan: 'Laporan', sertifikat: 'Sertifikat',
  foto: 'Foto', lainnya: 'Bukti' };
const nomorSDG = v => (Array.isArray(v) ? v : String(v || '').replace(/[{}]/g, '').split(',')).map(Number).filter(n => n >= 1 && n <= 17);

let SEMUA = [], PILIH = null, TAMPIL = [];

// Unduhan Excel (pemilik 2026-11-17): mengikuti saringan yang tampil; lembar Daftar, Bukti (tautan bisa diklik), Rekap SDG.
async function unduh(){
  const b = $('fUnduh'); b.disabled = true;
  try {
    const X = await import(SHEETJS);
    const wb = X.utils.book_new();
    const isi = lembarUnduh(TAMPIL.map(k => ({ ...k, tautan: tautanKarya(k) })), { sdgs: SDGS, kat: KAT, jenisBukti: JENIS_BUKTI });
    const lebar = { Daftar: [5, 60, 11, 7, 7, 11, 34, 10, 40, 40, 18, 8], Bukti: [8, 60, 11, 14, 30, 60], 'Rekap SDG': [6, 44, 13, 17, 17] };
    for (const [nama, baris] of Object.entries(isi)) {
      const ws = X.utils.aoa_to_sheet(baris.map(r => r.map(c => c && typeof c === 'object' ? c.t : c)));
      baris.forEach((r, i) => r.forEach((c, j) => {
        if (c && typeof c === 'object' && c.l) ws[X.utils.encode_cell({ r: i, c: j })].l = { Target: c.l };
      }));
      ws['!cols'] = lebar[nama].map(w => ({ wch: w }));
      X.utils.book_append_sheet(wb, ws, nama);
    }
    const info = [['Rekap SDGs dan bukti'], ['Periode', labelPeriode($('fPeriode').value)],
      ['SDG', PILIH ? `SDG ${PILIH}` : 'Semua'], ['Pencarian', $('fCari').value.trim() || '-'],
      ['Status', $('fTunggu').checked ? 'terverifikasi + menunggu verifikasi' : 'terverifikasi'],
      ['Diunduh', new Date().toLocaleString('id-ID')],
      ['Catatan', 'TS = 1 September s.d. 31 Agustus; karya bulan September-Desember masuk TS berikutnya, bulan kosong = tahun karya.']];
    const wi = X.utils.aoa_to_sheet(info); wi['!cols'] = [{ wch: 12 }, { wch: 90 }];
    X.utils.book_append_sheet(wb, wi, 'Keterangan');
    X.writeFile(wb, namaBerkas($('fPeriode').value, PILIH));
  } catch (e) { alert('Unduh gagal: ' + (e.message || e)); }
  finally { b.disabled = !TAMPIL.length; }
}

function tautanKarya(k){
  if (k.doi) return `https://doi.org/${String(k.doi).replace(/^https?:\/\/(dx\.)?doi\.org\//i, '')}`;
  return /^https?:\/\//i.test(k.url || '') ? k.url : '';
}

function gambar(){
  const periode = $('fPeriode').value, cari = $('fCari').value.trim().toLowerCase(), tunggu = $('fTunggu').checked;
  const dasar = SEMUA.filter(k => (tunggu || k.status === 'terverifikasi') && cocokPeriode(k, periode)
    && (!cari || (k.judul + ' ' + k.dosen.join(' ')).toLowerCase().includes(cari)));
  const xs = dasar.filter(k => !PILIH || k.sdgs.includes(PILIH));
  TAMPIL = xs;
  $('fUnduh').disabled = !xs.length;
  $('fUnduh').textContent = `Unduh Excel (${xs.length} karya + bukti)`;
  const tanpaBukti = xs.filter(k => !k.bukti.length).length;
  $('ringkas').innerHTML = `<div><b>${xs.length}</b><span>karya terkait SDGs${PILIH ? ' ' + PILIH : ''}</span></div>
    <div><b>${new Set(dasar.flatMap(k => k.sdgs)).size}</b><span>dari 17 SDG tersentuh</span></div>
    <div class="${tanpaBukti ? 'awas' : ''}"><b>${tanpaBukti}</b><span>karya belum ada bukti</span></div>`;
  $('kisi').innerHTML = SDGS.map(([n, nama]) => {
    const c = dasar.filter(k => k.sdgs.includes(n)).length;
    return `<button type="button" class="sdg${c ? '' : ' nol'}" data-sdg="${n}" style="--w:${WARNA_SDG[n - 1]}" aria-pressed="${PILIH === n}"
      title="${esc(nama)}"><span class="no">SDG ${n}</span><span class="n">${c}</span><span class="nm">${esc(nama)}</span></button>`;
  }).join('');
  $('daftar').innerHTML = xs.length ? `<table><thead><tr><th>Karya</th><th>Dosen</th><th>SDG</th><th>Bukti</th></tr></thead><tbody>${
    xs.map(k => {
      const t = tautanKarya(k);
      return `<tr><td><div class="judul">${t ? `<a href="${esc(t)}" target="_blank" rel="noopener">${esc(k.judul)}</a>` : esc(k.judul)}</div>
        <div class="sub">${KAT[k.kategori] || esc(k.kategori)} · ${esc(k.tahun || '')}${tsKarya(k) ? ' · TS ' + taTeks(tsKarya(k)) : ''}${k.doi ? ' · DOI ' + esc(k.doi) : ''}
        ${k.status !== 'terverifikasi' ? ' <span class="tunggu">menunggu verifikasi</span>' : ''}</div></td>
        <td>${esc(k.dosen.join(', '))}</td>
        <td>${k.sdgs.map(n => `<span class="lencana" style="--w:${WARNA_SDG[n - 1]}" title="${esc((SDGS.find(x => x[0] === n) || [, ''])[1])}">SDG ${n}</span>`).join('')}</td>
        <td>${k.bukti.length ? `<ul class="bukti">${k.bukti.map(b => `<li><a href="${esc(b.url)}" target="_blank" rel="noopener">${
          esc(JENIS_BUKTI[b.jenis] || b.jenis)}${b.judul ? ': ' + esc(b.judul) : ''}</a></li>`).join('')}</ul>`
          : '<span class="tanpa">Belum ada bukti</span>'}</td></tr>`;
    }).join('')}</tbody></table>` : '<p class="kosong">Tidak ada karya terkait SDGs untuk saringan ini.</p>';
  document.querySelectorAll('[data-sdg]').forEach(b => { b.onclick = () => { PILIH = PILIH === +b.dataset.sdg ? null : +b.dataset.sdg; gambar(); }; });
}

async function mulai(){
  const saya = await gerbang(sb);
  if (!saya) return;
  $('hSub').textContent = `Masuk sebagai ${saya.nama}`;
  const { data, error } = await sb.from('karya')
    .select('id,judul,kategori,tahun,bulan,status,doi,url,sdgs,karya_penulis(dosen(nama)),karya_bukti(jenis,judul,url)')
    .neq('status', 'draf').order('tahun', { ascending: false });
  if (error) throw new Error(/sdgs/.test(error.message) ? 'Kolom SDGs belum ada: jalankan supabase/47-patch-sdgs.sql.' : error.message);
  SEMUA = (data || []).map(k => ({ ...k, sdgs: nomorSDG(k.sdgs),
    dosen: [...new Set((k.karya_penulis || []).map(p => p.dosen?.nama).filter(Boolean))],
    bukti: (k.karya_bukti || []).filter(b => b.url) })).filter(k => k.sdgs.length)
    .sort((a, b) => (b.tahun || 0) - (a.tahun || 0) || a.judul.localeCompare(b.judul));
  const opsi = opsiPeriode(SEMUA).filter(g => g.opsi.length);
  $('isi').innerHTML = `
    <p class="ket">Karya dosen yang dikaitkan ke SDG, dengan berkas bukti (dari isian karya) dan DOI/tautannya, untuk pemantauan
      dan akreditasi. Halaman publik <a href="sdgs.html">Rekap SDGs</a> menampilkan daftar yang sama tanpa bukti.
      Klik kotak SDG untuk menyaring.</p>
    <div class="ringkas" id="ringkas"></div>
    <div class="sdg-kisi" id="kisi"></div>
    <div class="saring">
      <label>Periode <select id="fPeriode"><option value="">Semua</option>${opsi.map(g => `<optgroup label="${esc(g.grup)}">${
        g.opsi.map(([v, l]) => `<option value="${v}">${esc(l)}</option>`).join('')}</optgroup>`).join('')}</select></label>
      <input id="fCari" type="search" placeholder="Cari judul atau nama dosen" aria-label="Cari">
      <label><input id="fTunggu" type="checkbox"> Termasuk yang menunggu verifikasi</label>
      <button type="button" class="unduh" id="fUnduh">Unduh Excel</button>
    </div>
    <p class="ket">TS = 1 September s.d. 31 Agustus: karya bulan September–Desember masuk TS berikutnya; karya tanpa bulan dihitung
      pada TS tahun karyanya. Unduhan mengikuti saringan di atas (periode, SDG, pencarian, status).</p>
    <div id="daftar"></div>`;
  ['fPeriode', 'fTunggu'].forEach(id => { $(id).onchange = gambar; });
  $('fUnduh').onclick = unduh;
  $('fCari').oninput = gambar;
  gambar();
}
mulai().catch(e => { $('isi').innerHTML = `<p class="kosong">Gagal memuat: ${esc(e.message)}</p>`; });
</script>
</body>
</html>
