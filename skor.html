<style>

  .manual{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;

<body>

<div class="hero"><div class="hero-in">
  <div class="hero-inst" data-identitas></div>
  <h1>Kalkulator Skor Akreditasi <span class="versi-statis">v2026-10-14a</span></h1>
  <div class="prodi" id="nama-prodi">Memuat&hellip;</div>
  <div class="periode" id="pilih-ts"></div>
</div></div>

<main class="wrap" id="isi"><p class="kosong" style="margin-top:30px">Memuat data&hellip;</p></main>

<script>
// Pengawas: skrip modul di bawah bisa mati total sebelum sempat menulis
// apa pun (impor CDN gagal, config.js hilang, galat keamanan penyimpanan).
// Blok klasik ini berdiri sendiri sehingga tetap hidup dan mengubah
// "Memuat" abadi menjadi diagnosis yang bisa ditindaklanjuti.
window.addEventListener('error', function(e){
  var isi = document.getElementById('isi');
  if (!window.__skorHidup && isi) isi.innerHTML =
    '<div class="kartu" style="margin-top:30px"><p class="kosong"><b>Halaman gagal '+
    'dijalankan.</b> Pesan galat: <code>'+String(e.message).replace(/</g,'&lt;')+
    '</code>. Buka konsol peramban (F12) untuk rinciannya, lalu kirimkan ke pengelola.</p></div>';
});
// Kalau halaman tidak juga hidup, JANGAN menebak penyebabnya: periksa
// dulu. Satu berkas modul yang belum diunggah menggagalkan seluruh skrip
// dengan gejala yang persis sama dengan CDN terblokir, dan pesan yang
// menebak salah mengirim orang mencari di tempat yang keliru.
var MODUL = ['rincian.js', 'butir-manual.js', 'bobot.js', 'syarat-unggul.js'];
setTimeout(function(){
  if (window.__skorHidup) return;
  var isi = document.getElementById('isi');
  if (!isi) return;
  isi.innerHTML = '<div class="kartu" style="margin-top:30px">' +
    '<p class="kosong">Halaman tidak kunjung siap — memeriksa penyebabnya…</p></div>';

  Promise.all(MODUL.map(function(m){
    return fetch(m + '?cek=' + Date.now())
      .then(function(r){ return { m: m, ok: r.ok, kode: r.status }; })

function lompatKeButir(id, gulir = true){
  const el = document.getElementById(id);
  if (!el) return false;
  for (let p = el.parentElement; p; p = p.parentElement)
    if (p.tagName === 'DETAILS') p.open = true;
  if (gulir) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  el.classList.add('sorot');
  setTimeout(() => el.classList.remove('sorot'), 2000);
  return true;
}
document.addEventListener('click', e => {
  const a = e.target.closest('a[href^="#butir-"]');
  if (!a) return;
  e.preventDefault();
  const id = a.getAttribute('href').slice(1);
  if (lompatKeButir(id)) history.replaceState(null, '', '#' + id);
});

async function ambilDaftarLKPS(){
  // Tahap 2: lembar daftar (lkps.js petaDaftar). Tabel yang belum ada
  // (patch belum dijalankan) cukup kosong.
  const ambil = async q => { const { data, error } = await q; if (error) console.warn(error.message); return data || []; };
  // Dosen dengan profil LKPS 4.a (22-patch-profil-dosen.sql); tanpa patch: kolom dasar.

  const ambilDosen = async () => {
    const { data, error } = await sb.from('dosen').select(DOSEN_DASAR + ',' + KOLOM_PROFIL);
    return error ? ambil(sb.from('dosen').select(DOSEN_DASAR)) : (data || []);
  };
  // Mata kuliah untuk 3.a.1/3.a.4/3.a.5 dan 4.a kolom 15 (23-patch-kurikulum.sql);
  // tanpa patch: kolom lama (kode, nama, sks, semester, inti).
  const MK_DASAR = 'id,kode,nama,sks,semester,inti,aktif,urutan';
  const ambilMK = async () => {
    const { data, error } = await sb.from('ref_mata_kuliah').select(MK_DASAR +
      ',sks_kuliah,sks_seminar,sks_praktikum,rps_ada,rps_url,unit_penyelenggara,basic_science,capstone,' +
      'capstone_cakupan,capstone_pendukung,pengampu');
    return error ? ambil(sb.from('ref_mata_kuliah').select(MK_DASAR)) : (data || []);
  };
  // Kerja sama induk (24-patch-kerjasama-induk.sql): kolom baru + karya.kerjasama_id;
  // tanpa patch: kolom lama.
  const KARYA_DASAR = 'id,kategori,judul,tahun,bulan,sub_jenis,jenis,tingkat,indeksasi,nama_terbitan,doi,url,bukti_url,' +
    'mata_kuliah,induk_id,status,' +
    'karya_penulis(peran,korespondensi,dosen(nama)),karya_mitra(institusi,tingkat),karya_mahasiswa(nama)';
  // Kolom isian tambahan (25-patch-isian-karya.sql): 4.f.3, 4.i, 3.a.3, 6.h.1, 6.i.
  const KARYA_25 = ',tkt,nomor_tkt,jumlah_sitasi,tema_id,keterlibatan_mhs,bukti_integrasi,sesuai_rps';
  const ambilKarya = async () => {
    const q = kol => sb.from('karya').select(kol).eq('status', 'terverifikasi').limit(5000);
    for (const kol of [KARYA_DASAR + ',kerjasama_id' + KARYA_25, KARYA_DASAR + ',kerjasama_id']) {
      const { data, error } = await q(kol);
      if (!error) return data || [];
    }
    return ambil(q(KARYA_DASAR));
  };
  const KS_DASAR = 'mitra,jenis,tingkat,kegiatan,tahun_mulai,tahun_selesai';
  const ambilKS = async () => {
    const { data, error } = await sb.from('lkps_kerjasama')
      .select('id,' + KS_DASAR + ',tautan_bukti,manfaat,tanggal_mulai,tanggal_selesai,jenis_bukti');
    return error ? ambil(sb.from('lkps_kerjasama').select(KS_DASAR)) : (data || []);
  };
  const [dosen, karya, kerjasama, bkd, prestasi, luaranMhs, mk, tema, mhs, tracer,
         vmts, prodiUpps, dana, tendik, buktiVmts, prasarana, dokK3l, fasK3l, dokumen, ppepp, buktiBaris, buktiKarya] = await Promise.all([
    ambilDosen(),
    ambilKarya(),
    ambilKS(),
    ambil(sb.from('lkps_bkd').select('nidn,tahun_akademik,semester,sks_pendidikan,sks_penelitian,sks_pkm,sks_penunjang')),
    ambil(sb.from('lkps_prestasi_mahasiswa').select('*')),
    // select('*'): kolom patch 26 (status/nomor/TKT) ikut bila sudah ada; hanya di browser admin.
    ambil(sb.from('lkps_luaran_mahasiswa').select('*')),
    ambilMK(),
    ambil(sb.from('ref_tema_peta_jalan').select('id,nama,jenis')),
    // 6.a/6.b/6.f.1/6.f.2: kolom patch 26 dari Data prodi (Mahasiswa per TS, Tracer study).
    ambil(sb.from('lkps_mahasiswa_ta').select('*')),
    ambil(sb.from('lkps_tracer_lulusan').select('*')),
    // PS / Tabel 1 / 2.b / 4.b (27-patch-institusi-upps.sql); bukti VMTS = Link Dokumen Tabel 1.
    ambil(sb.from('lkps_vmts').select('*')),
    ambil(sb.from('lkps_prodi_upps').select('*')),
    ambil(sb.from('lkps_penggunaan_dana').select('*')),
    ambil(sb.from('lkps_tendik').select('*')),
    // Bukti VMTS: tautan luar atau dokumen pustaka (29-patch-pustaka-dokumen.sql).
    (async () => { const q = kol => sb.from('lkps_bukti').select(kol).eq('tabel', 'lkps_vmts').order('id');
      const { data, error } = await q('baris_id,url,dokumen(url)');
      return error ? ambil(q('baris_id,url')) : (data || []); })(),
    // 5.a / 5.b / 5.c (28-patch-sarana-k3l.sql).
    ambil(sb.from('lkps_prasarana').select('*')),
    ambil(sb.from('lkps_dokumen_k3l').select('*')),
    ambil(sb.from('lkps_fasilitas_k3l').select('*')),
    // 7.a dari pustaka dokumen, 7.b tahap PPEPP (30-patch-spmi.sql).
    ambil(sb.from('dokumen').select('*')),
    ambil(sb.from('lkps_spmi_ppepp').select('*')),
    // Bukti baris Data prodi untuk tabel bukti LED (29-patch-pustaka-dokumen.sql).
    (async () => { const q = kol => sb.from('lkps_bukti').select(kol).order('id');
      const { data, error } = await q('tabel,baris_id,judul,url,dokumen(jenis,tahun,judul,nomor,url)');
      return error ? ambil(q('tabel,baris_id,judul,url')) : (data || []); })(),
    ambil(sb.from('karya_bukti').select('karya_id,jenis,judul,url')),
  ]);
  return { dosen, karya, kerjasama, bkd, prestasi, luaranMhs, mk, tema, mhs, tracer,
           vmts, prodiUpps, dana, tendik, buktiVmts, prasarana, dokK3l, fasK3l, dokumen, ppepp, buktiBaris, buktiKarya };
}

// idTombol: unduhLKPS = templat resmi terisi; unduhTabelLKPS = workbook sendiri
// (lkps-tabel.js, pemilik 2026-11-05). Data yang diambil sama.
async function unduhLKPS(idTombol){
  const a = document.getElementById(idTombol);
  if (!a || !CTX_LED || a.dataset.sibuk) return;
  a.dataset.sibuk = '1';
  const asli = a.textContent;
  a.textContent = 'Menyusun LKPS…';
  try {
    const ts = CTX_LED.tsData;
    const { data: kp } = await sb.from('lkps_kepuasan_pengguna')
      .select('aspek, rencana_tindak_lanjut').eq('tahun_akademik', taDari(ts));
    const rencanaKepuasan = Object.fromEntries((kp || [])
      .filter(r => r.rencana_tindak_lanjut).map(r => [r.aspek, r.rencana_tindak_lanjut]));
    const daftar = await ambilDaftarLKPS();
    const buat = idTombol === 'unduhTabelLKPS' ? (await import('./lkps-tabel.js?v=2026-11-05-b4cb9a')).buatTabelLKPS
      : idTombol === 'unduhIndeksBukti' ? (await import('./lkps-bukti.js?v=2026-11-05-b4cb9a')).buatIndeksBukti
      : (await import('./lkps.js?v=2026-11-05-b4cb9a')).buatLKPS;
    const hasil = await buat({ D, ts, prodi: D.prodi, institusi: D.institusi, rencanaKepuasan,
      daftar });
    a.textContent = idTombol === 'unduhIndeksBukti' ? `Indeks terunduh (${hasil.sel} tautan, ${hasil.lembar.length} tabel)`
      : `LKPS terunduh (${hasil.sel} sel pada ${hasil.lembar.length} lembar)`;
  } catch (e) {
    console.error(e);
    a.textContent = 'Gagal menyusun LKPS: ' + e.message;
  } finally {
    setTimeout(() => { a.textContent = asli; delete a.dataset.sibuk; }, 6000);
  }
}

// Draf LED (led.js, keputusan pemilik 2026-11-03): memakai konteks skor yang
// sama dengan ringkasan, dan tabel dibaca dari kartu yang sudah dirender,
// jadi angka di Word sama dengan halaman ini. led.js dimuat saat diklik.
let CTX_LED = null;
async function unduhLED(){
  const a = document.getElementById('unduhLED');
  if (!a || !CTX_LED || a.dataset.sibuk) return;
  a.dataset.sibuk = '1';
  const asli = a.textContent;
  a.textContent = 'Menyusun draf LED…';
  try {
    const { buatLED } = await import('./led.js?v=2026-11-05-b4cb9a');
    const ts = CTX_LED.tsData;
    const hasil = await buatLED({
      D, ts, taDari, f2, versi: VERSI,
      skorButir: CTX_LED.skorButir, judulButir: CTX_LED.judulButir,
      st: CTX_LED.st, NA: CTX_LED.NA, NAmax: CTX_LED.NAmax, semuaSy: CTX_LED.semuaSy,
      tren: CTX_LED.tren, tsTren: CTX_LED.tsTren,
      bobotButir,
      manual: new Set(BUTIR_MANUAL.map(b => b.no)),
      buktiButir: no => ISteks(`bukti_b${no}`),
      dokumen: DOK,
      butirBukti: BB,
      daftar: await ambilDaftarLKPS(),
      rekapKarya: no => {
        if (!BUTIR[no]) return null;
        const rows = BUTIR[no].baris(D, ts) || [];
        return { n: rows.length, ada: rows.filter(r => cariBukti(r)).length };
      },
      urlRincian: no => new URL(`rincian.html?butir=${no}&ts=${ts}`, location.href).href,
      // Lampiran B: karya per butir dengan tautan Drive langsung (asesor
      // tidak bisa membuka situs yang perlu login).
      daftarKarya: no => {
        const def = BUTIR[no];
        if (!def) return null;
        const kb = kolomBukti(def);
        return (def.baris(D, ts) || []).map(r => ({
          tahun: r.tahun, judul: r[kb] || r.judul, bukti: daftarBukti(r) }));
      },
      kartu: no => document.getElementById(`butir-${no}`),
    });
    a.textContent = hasil.gagal.length
      ? `Terunduh; ${hasil.gagal.length} subbagian belum terisi (lihat catatan di halaman 1)`
      : 'Draf LED terunduh';
  } catch (e) {
    console.error(e);
    a.textContent = 'Gagal menyusun LED: ' + e.message;
  } finally {
    setTimeout(() => { a.textContent = asli; delete a.dataset.sibuk; }, 6000);
  }
}

function jumlahJendela(baris, kunci, n){
  // total tiap kolom `kunci` untuk baris bertahun [TS-n+1 .. TS]
  const t0 = TS - n + 1;
  const pilih = baris.filter(r => r.tahun >= t0 && r.tahun <= TS);
  const out = {}; kunci.forEach(k => out[k] = 0);
  pilih.forEach(r => kunci.forEach(k => out[k] += (r[k] || 0)));
  return out;
}

// ---------------------------------------------------------------------
//  Rumus inti matriks: skor dari tiga rasio RI/RN/RW dengan faktor a,b,c
//  (butir 33, 43, 46). Termasuk aturan substitusi batas dari instrumen.
// ---------------------------------------------------------------------
function skorRasio(RI, RN, RW, a, b, c){
  if (RI > a && RN > b) return 4;
  if (RI <= 0 && RN <= 0 && RW <= 0) return 0;
  if (RI >= a && RN < b) RI = a;
  if (RI < a && RN >= b) RN = b;
  if (RW >= c) RW = c;
  const A = RI / a, B = RN / b, C = RW / c;
  const skor = 3.75 * ((A + B + C / 2) - (A * B) - (A * C) / 2
                       - (B * C) / 2 + (A * B * C) / 2);
  return Math.max(0, Math.min(4, skor));
}

// Rincian per butir. Seluruh penyaring ada di rincian.js dan dipakai

function rincianButir(no){
  const def = BUTIR[String(no)];
  if (!def) return '';
  const daftar = def.baris(D, TS);
  if (!daftar.length) return '';
  const kb = kolomBukti(def);
  const sel = (r, c) => {
    let v = esc(r[c.kunci] ?? '\u2014');
    if (c.kunci === kb){
      const xs = daftarBukti(r);
      v += xs.length ? xs.map(x => ` <a class="bukti-sel" href="${esc(x.url)}" target="_blank"
             rel="noopener nofollow" title="${esc(x.label)}">&#128206; ${esc(x.label)}</a>`).join('')
             : ` <span class="bukti-kos">tanpa bukti</span>`;
      if (r.doi) v += ` <a class="bukti-sel" href="https://doi.org/${esc(r.doi)}"
             target="_blank" rel="noopener">DOI</a>`;
    }
    if (c.kunci === 'mhs') return `<td class="mhs${r.mhs ? ' ya' : ''}">${r.mhs || '&ndash;'}</td>`;
    return `<td${c.kelas ? ` class="${c.kelas}"` : ''}>${v}</td>`;
  };
  const n = def.penyebut(D, TS);
  let cek = '';
  if (n != null){
    const cocok = daftar.length === n;
    cek = `<div class="rinci-cek${cocok ? '' : ' beda'}">` + (cocok
      ? `${daftar.length} baris, sama dengan ${def.labelPenyebut} pada kartu.`
      : `PERIKSA: daftar ${daftar.length} baris, ${def.labelPenyebut} pada kartu `
        + `${n}. Keduanya tidak berasal dari penyaring yang sama.`) + `</div>`;
  }
  return `<details class="rinci">
    <summary>Rincian ${def.judul} &mdash; ${daftar.length} baris</summary>
    <div class="gulir"><table class="rinci-t">
      <thead><tr>${def.kolom.map(c => `<th>${c.th}</th>`).join('')}</tr></thead>
      <tbody>${daftar.map(r => `<tr>${def.kolom.map(c => sel(r, c)).join('')}</tr>`).join('')}</tbody>
    </table></div>${cek}
    ${def.catatan ? `<div class="rinci-cek">${def.catatan}</div>` : ''}
    </details>
    <a class="tbl-rinci" href="rincian.html?butir=${esc(no)}&ts=${TS}" rel="noopener">
      Lihat ${daftar.length} data yang dipakai &#8599;</a>`;
}

  const { skor, nilai, lengkap } = skorManual(b, IS);
  const kunci = kunciButir(b);
  const label = b.hitung ? b.hitung.label
              : b.komponen ? ['I. ' + b.komponen[0], 'II. ' + b.komponen[1]]
              : ['Skor hasil penilaian matriks (0–4)'];
  const baris = kunci.map((k, i) => `<tr>
      <td>${esc(label[i])}<br><span class="isian">kunci: ${esc(k)}</span></td>
      <td>${nilai[i] == null ? '<span class="isian">belum diisi</span>'
                             : esc(f2(nilai[i]))}</td></tr>`).join('');
  const rumus = b.hitung ? b.hitung.rumus
              : b.rumus || 'Skor diisi langsung dari matriks penilaian (0–4).';
  const bukti = ISteks(kunciBuktiButir(b));
  const konteks = b.konteks ? b.konteks(D, TS) : '';
  const isi = `
    ${konteks ? `<p class="ctt" style="margin:0 0 10px">
      <b>Data pendukung:</b> ${esc(konteks)}</p>` : ''}
    <div class="gulir"><table class="rin"><thead><tr>
      <th>Komponen</th><th>Nilai</th></tr></thead><tbody>${baris}</tbody></table></div>
    <div class="rumus">${esc(rumus)}</div>
    ${bukti ? `<a class="tbl-bukti" href="${esc(bukti)}"
        target="_blank" rel="noopener nofollow">&#128206;&nbsp; Bukti &#8599;</a>`
      : `<p class="isian" style="margin-top:10px">Bukti belum ditautkan — unggah
         atau tautkan di <a href="input-butir.html">halaman isi butir</a>.</p>`}`;
  const ket = [b.tabel, b.ket].filter(Boolean).join(' · ');
  return kartuButir(b.no, b.judul, isi, skor,
    (lengkap ? '' : 'Belum lengkap — isi di <a href="input-butir.html">halaman ' +
      'isi butir</a>. ') +

    '<span class="manual">diisi manual</span>');
}

function blokSyarat(no, skor){
  const s = statusSyarat(no, skor);
  if (!s) return '';
  const amb = t => `${f2(s[t])}${s.satuan === '%' ? '%' : ' ' + s.satuan}`;
  const tanda = ok => ok == null ? '<span style="color:var(--muted)">belum terhitung</span>'

  const kls = !s.tahu ? '' : s.u5ok ? ' lolos' : ' gagal';
  // Syarat Terakreditasi hanya tampil bila disyaratkan (saat ini butir 19).
  const baris_t = s.skorMin.t == null ? '' :
    `Terakreditasi: ${s.arah === 'max' ? '≤' : '≥'} ${amb('t')}
    (setara skor ${f2(s.skorMin.t)}) &mdash; ${tanda(s.tok)} · `;
  return `<div class="syarat-ket${kls}">
    <b>Syarat perlu &mdash; syarat ${esc(s.syarat)} Tabel 4.3.1 pedoman
    penilaian (${esc(s.label)})</b><br>
    ${baris_t}Unggul 3 tahun: ${s.arah === 'max' ? '≤' : '≥'} ${amb('u3')}
    (setara skor ${f2(s.skorMin.u3)}) &mdash; ${tanda(s.u3ok)} ·
    Unggul 5 tahun: ${s.arah === 'max' ? '≤' : '≥'} ${amb('u5')}

}

function butir42(){
  const A = (D.akreditasi || {}).ta || [];
  const pilih = A.filter(r => r.tahun_ts >= TS - 2 && r.tahun_ts <= TS && r.lulusan > 0);
  if (!pilih.length)
    return kartuButir(42, 'IPK lulusan', `<p class="kosong"><a href="data-prodi.html?tab=mahasiswa">Data prodi › Mahasiswa per TS</a>
      belum berisi jumlah lulusan dan rerata IPK
      untuk TS ${esc(taDari(TS))} atau dua TS sebelumnya.</p>`, null, '');
  const nLul = pilih.reduce((a, r) => a + r.lulusan, 0);
  const ripk = pilih.reduce((a, r) => a + r.rerata_ipk * r.lulusan, 0) / nLul;
  let skor;
  if (ripk >= 3.25) skor = 4;
  else skor = Math.max(2, ((8 * ripk) - 6) / 5);
  const isi = `
    <div class="gulir"><table class="rin"><thead><tr>
      <th>TS</th><th>Lulusan</th><th>Rerata IPK</th></tr></thead><tbody>
      ${pilih.map(r => `<tr><td>${esc(r.ta)}</td><td>${r.lulusan}</td>
        <td>${f2(r.rerata_ipk)}</td></tr>`).join('')}
      <tr><td><b>RIPK tertimbang</b></td><td>${nLul}</td><td><b>${f2(ripk)}</b></td></tr>
    </tbody></table></div>
    <div class="rumus">RIPK &ge; 3,25 &rarr; 4 &nbsp;·&nbsp; 2,00 &le; RIPK &lt; 3,25 &rarr; ((8 &times; RIPK) &minus; 6) / 5 &nbsp;·&nbsp; skor terendah 2</div>`;
  return kartuButir(42, 'IPK lulusan', isi, skor,
    'RIPK dihitung sebagai rata-rata tertimbang jumlah lulusan per TS. ' +
    'Instrumen menulis "rata-rata IPK lulusan dalam 3 tahun terakhir" tanpa ' +
    'merinci pembobotan; bila asesor meminta rata-rata sederhana antar-TS, ' +
    'selisihnya kecil kecuali jumlah lulusan antar-TS timpang.');
}

//  Butir 43 — Prestasi mahasiswa (5 tahun terakhir)
// ---------------------------------------------------------------------
function siapkanPrestasi(bidang){
  const P = D.prestasi_agregat || [];
  const t0 = TS - 4;
  let NI = 0, NN = 0, NW = 0;
  // tahun_ts (TS: 1 Sep - 31 Agu) dari bangun.py; data lama tanpa kolom itu
  // jatuh ke tahun kalender.
  const tsDari = r => (r.tahun_ts != null ? r.tahun_ts : r.tahun);
  P.filter(r => tsDari(r) >= t0 && tsDari(r) <= TS &&
                (r.bidang || '').startsWith(bidang === 'akademik' ? 'akademik' : 'non'))
   .forEach(r => {
     const tg = (r.tingkat || '').toLowerCase();
     if (tg.includes('internasional')) NI += r.jumlah;
     else if (tg.includes('nasional')) NN += r.jumlah;
     else NW += r.jumlah;
   });
  return {NI, NN, NW};
}

function butir43(){
  const A = (D.akreditasi || {}).ta || [];
  const barisTS = A.find(r => r.tahun_ts === TS);
  const NM = barisTS ? barisTS.mahasiswa_aktif : 0;
  const sub = (label, d) => {
    const skor = NM > 0
      ? skorRasio(d.NI / NM, d.NN / NM, d.NW / NM, 0.002, 0.02, 0.04) : null;
    return {skor, html: `
      <div class="gulir"><table class="rin"><thead><tr><th>${esc(label)}</th>
        <th>NI int.</th><th>NN nas.</th><th>NW wil.</th><th>NM</th><th>Skor</th></tr></thead>
        <tbody><tr><td>jumlah 5 TS</td><td>${d.NI}</td><td>${d.NN}</td><td>${d.NW}</td>
        <td>${NM || '—'}</td><td><b>${skor == null ? '—' : f2(skor)}</b></td></tr></tbody></table></div>`};
  };
  const ak = sub('I. Akademik', siapkanPrestasi('akademik'));
  const na = sub('II. Non-akademik', siapkanPrestasi('non'));
  const skor = (ak.skor == null || na.skor == null) ? null
             : (ak.skor * 3 + na.skor) / 4;
  const isi = ak.html + na.html +
    `<div class="rumus">Skor = ((I &times; 3) + II) / 4 &nbsp;·&nbsp; faktor a=0,2% &nbsp;b=2% &nbsp;c=4% terhadap NM</div>`;
  return kartuButir(43, 'Prestasi akademik dan non-akademik mahasiswa', isi, skor,
    (NM ? '' : `NM (jumlah mahasiswa saat TS) belum ada — isi "Mahasiswa aktif"
      di <a href="data-prodi.html?tab=mahasiswa">Data prodi › Mahasiswa per TS</a>
      untuk TS ${esc(taDari(TS))}. `) +
    'Jendela 5 TS: TS ' + taDari(TS - 4) + ' s.d. ' + taDari(TS) +
    ' (prestasi tanpa bulan dihitung menurut tahun kalendernya). ' +
    'Baris dengan tingkat selain internasional/nasional dihitung wilayah/lokal.');
}

  const N = (D.dtps || {}).jumlah || 0;
  const j = jumlahJendela(((D.akreditasi || {}).publikasi_dtps) || [],

// Butir 26 — kecukupan DTPS.
function butir26(){
  const N = ndtps();
  const ndtt = IS('ndtt');
  if (ndtt == null) return kartuManualKosong(26, 'Kecukupan jumlah DTPS (Tabel 4.a LKPS)', 'ndtt');
  const PDTT = (ndtt / ((N + ndtt) || 1)) * 100;
  let skor;
  if (N < 5) skor = 0;
  else if (N >= 12 && PDTT <= 10) skor = 4;
  else if (N >= 12 && PDTT <= 40) skor = 2 + 2 * ((40 - PDTT) / 30);
  else if (PDTT <= 40) skor = 2 + 2 * (((N - 5) / 7) * ((40 - PDTT) / 40));
  else skor = 2;
  const isi = `
    <div class="gulir"><table class="rin"><tbody>
      <tr><td>NDTPS</td><td>${N}</td></tr>
      <tr><td>NDTT (dosen tidak tetap)</td><td>${ndtt}</td></tr>
      <tr><td><b>PDTT</b></td><td><b>${f2(PDTT)}%</b></td></tr>
    </tbody></table></div>
    <div class="rumus">NDTPS ≥ 12 dan PDTT ≤ 10% → 4 · rumus antara lihat instrumen · NDTPS &lt; 5 → 0</div>`;
  return kartuButir(26, 'Kecukupan jumlah DTPS (Tabel 4.a LKPS)', isi, skor,
    'NDTPS memakai jumlah dosen aktif; NDT dianggap sama dengan NDTPS.');
}

// Butir 40 & 41 — rasio mahasiswa dan mahasiswa asing.
function barisTA(){ return (((D.akreditasi || {}).ta) || []).find(r => r.tahun_ts === TS); }
function butir40(){
  const N = ndtps(); const b = barisTA();
  const NM = b ? b.mahasiswa_aktif : 0;
  if (!N || !NM)
    return kartuButir(40, 'Rasio mahasiswa terhadap DTPS (Tabel 6.a LKPS)',
      `<p class="kosong">Isi "Mahasiswa aktif" di <a href="data-prodi.html?tab=mahasiswa">Data prodi › Mahasiswa per TS</a>
      untuk TS ${esc(taDari(TS))}.</p>`, null, '');
  const RMD = NM / N;
  let skor;
  const A = (N - 5) / 7;
  const B = RMD < 15 ? RMD / 15 : RMD <= 25 ? 1 : RMD <= 35 ? (35 - RMD) / 10 : 0;
  if (RMD > 35) skor = 0;
  else if (N >= 12 && RMD >= 15 && RMD <= 25) skor = 4;
  else if (N >= 12) skor = 1 + 3 * B;
  else skor = 1 + 3 * (A * B);
  return kartuButir(40, 'Rasio mahasiswa terhadap DTPS (Tabel 6.a LKPS)',
    `<div class="rumus">RMD = ${NM}/${N} = ${f2(RMD)} · ideal 15–25 dengan NDTPS ≥ 12 → 4 · RMD &gt; 35 → 0</div>`,
    skor, '');
}
function butir41(){
  const b = barisTA();
  if (!b || !b.mahasiswa_aktif || b.mahasiswa_asing == null)

  const P = b.mahasiswa_asing / b.mahasiswa_aktif;

  return kartuButir(41, 'Mahasiswa asing (Tabel 6.a LKPS)',
    `<div class="rumus">PMA = ${b.mahasiswa_asing}/${b.mahasiswa_aktif} = ${f2(P * 100)}% · ≥ 1% → 4 · di bawah itu → 2 + (200 × PMA)</div>`,
    skor, '');
}

// Butir 44 & 45 — masa studi & tepat waktu (rerata tertimbang 3 TS).
function reratTA(kunci){
  const rows = (((D.akreditasi || {}).ta) || [])
    .filter(r => r.tahun_ts >= TS - 2 && r.tahun_ts <= TS && r.lulusan > 0 && r[kunci] > 0);
  if (!rows.length) return null;
  const n = rows.reduce((a, r) => a + r.lulusan, 0);
  return rows.reduce((a, r) => a + r[kunci] * r.lulusan, 0) / n;
}

// memuat kohort baris TS-7 s.d. TS. TS di halaman ini = tahun ujung TS
// (TS 2025/2026 -> 2026), jadi angkatan yang masuk September 2025 adalah
// baris TS: baris TS-k = tahun_masuk TS - 1 - k.
// Tafsiran (keputusan pemilik 2026-10-12, docs/analisis... §4):
//   butir 44: MS = rerata tertimbang lulusan seluruh kohort TS-7..TS;
//             3 < MS <= 3,5 -> skor 4, MS > 8 -> skor 0 (celah rubrik);
//   butir 45: PTW = b/a pada kohort bertanda (a)(b) di Tabel 6.d, yaitu
//             baris TS-3: a = jumlah masuk, b = lulus 3,5 < MS <= 4,5.
const tahunMasukBaris = k => TS - 1 - k;
function kohort6d(){
  return (((D.akreditasi || {}).kohort) || [])
    .filter(k => k.tahun_masuk >= tahunMasukBaris(7) && k.tahun_masuk <= tahunMasukBaris(0))
    .sort((a, b) => b.tahun_masuk - a.tahun_masuk);
}
function skorMS(MS){
  if (MS > 3 && MS <= 4.5) return 4;          // 3 < MS <= 3,5: celah, diberi 4
  if (MS > 4.5 && MS <= 8) return (55 - 6 * MS) / 7;
  return 0;                                    // MS <= 3 atau MS > 8 (celah, diberi 0)
}

function butir44(){
  const K = kohort6d().filter(k => k.lulus > 0);
  if (K.length){
    const n = K.reduce((a, k) => a + k.lulus, 0);
    const MS = K.reduce((a, k) => a + k.ms_tertimbang * k.lulus, 0) / n;
    const skor = skorMS(MS);
    const ket = (MS > 3 && MS <= 3.5) || MS > 8
      ? 'MS berada di celah rubrik instrumen; skor mengikuti tafsiran yang disepakati. ' : '';
    const isi = `
      <div class="gulir"><table class="rin"><thead><tr><th>Angkatan</th>
        <th>Masuk</th><th>Lulus</th><th>MS taksiran</th></tr></thead><tbody>
        ${K.map(k => `<tr><td>${k.tahun_masuk}</td><td>${k.masuk}</td>
          <td>${k.lulus}</td><td>${f2(k.ms_tertimbang)}</td></tr>`).join('')}
        <tr><td><b>Gabungan</b></td><td></td><td>${n}</td><td><b>${f2(MS)}</b></td></tr>
      </tbody></table></div>
      <div class="rumus">3,5 &lt; MS ≤ 4,5 → 4 · 4,5 &lt; MS ≤ 8 → (55 − 6×MS)/7 · MS ≤ 3 → 0
        · celah: 3 &lt; MS ≤ 3,5 → 4, MS &gt; 8 → 0</div>`;
    return kartuButir(44, 'Masa studi (Tabel 6.d LKPS)', isi, skor, ket +
      `Kohort baris TS-7 s.d. TS Tabel 6.d: angkatan masuk ${tahunMasukBaris(7)}–${
      tahunMasukBaris(0)}. MS ditaksir dari titik tengah tiap pita masa studi ` +
      '(4,0 · 5,0 · 6,0 · 7,25) karena tabel LKPS hanya memberi rentang.');
  }
  const MS = reratTA('rerata_masa_studi');
  if (MS == null){
    const adaKohort = (((D.akreditasi || {}).kohort) || []).length > 0;
    return kartuButir(44, 'Masa studi (Tabel 6.d LKPS)', `<p class="kosong">${
      adaKohort
        ? `<a href="data-prodi.html?tab=kohort">Data prodi › Kohort lulusan</a> sudah terisi, tetapi belum ada
           lulusan dari angkatan masuk ${tahunMasukBaris(7)}–${tahunMasukBaris(0)}
           (kohort baris TS-7 s.d. TS Tabel 6.d).`
        : `Isi <a href="data-prodi.html?tab=kohort">Data prodi › Kohort lulusan</a>: jumlah masuk per angkatan
           dan jumlah lulusan pada tiap pita masa studi. Sebagai cadangan,
           kolom "Rerata masa studi" di Mahasiswa per TS juga dibaca.`}</p>`, null, '');
  }
  const skor = skorMS(MS);
  const ket = (MS > 3 && MS <= 3.5) || MS > 8
    ? 'MS berada di celah rubrik instrumen; skor mengikuti tafsiran yang disepakati.' : '';
  return kartuButir(44, 'Masa studi (Tabel 6.d LKPS)',
    `<div class="rumus">MS = ${f2(MS)} tahun · 3,5 &lt; MS ≤ 4,5 → 4 · 4,5 &lt; MS ≤ 8 → (55 − 6×MS)/7 · MS ≤ 3 → 0</div>`,
    skor, ket + ' Rerata tertimbang jumlah lulusan, 3 TS terakhir.');
}

// Butir 49, 50, 51 — tracer, jendela TS-2 s.d. TS-1.
function tracerJendela(){
  const tr = (D.tracer || []).filter(t => t.tahun_lulus >= TS - 2 && t.tahun_lulus <= TS - 1);
  const lulusan = tr.reduce((a, t) => a + (t.lulusan || 0), 0);
  const terlacak = tr.reduce((a, t) => a + (t.terlacak || 0), 0);
  return { tr, lulusan, terlacak,
           responden: lulusan ? (terlacak / lulusan) * 100 : 0 };
}
function catatanResponden(J){
  let c = `Jendela tahun lulus ${TS - 2}–${TS - 1} (TS-2 s.d. TS-1 — berbeda dari syarat perlu yang memakai dua tahun terakhir). `;
  if (J.lulusan) c += `Responden ${f2(J.responden)}%` +
    (J.responden < 30 ? ' — DI BAWAH batas minimal 30%, skor tidak sahih menurut instrumen.' : ' (memenuhi minimal 30%).');
  return c;
}
function butir49(){
  const J = tracerJendela();
  if (!J.terlacak)
    return kartuButir(49, 'Waktu tunggu (Tabel 6.f.1 LKPS)', `<p class="kosong"><a href="data-prodi.html?tab=tracer">Data prodi › Tracer study</a>
      belum berisi tahun lulus ${TS - 2}–${TS - 1}.</p>`, null, '');
  const WT = J.tr.reduce((a, t) => a + (t.waktu_tunggu_bulan || 0) * (t.terlacak || 0), 0) / J.terlacak;
  const skor = WT <= 3 ? 4 : WT <= 18 ? Math.max(1, (23 - WT) / 5) : 1;
  const P = cekPitaWT(J.tr, WT);
  const pita = !P ? '' : `<div class="rumus">Pita Tabel 6.f.1: &lt; 3 bulan ${P.a} · 3–18 bulan ${P.b} · &gt; 18 bulan ${P.c} orang`
    + ` → rata-rata yang mungkin ${f2(P.bawah)}–${P.atas === Infinity ? '…' : f2(P.atas)} bulan`
    + (P.cocok ? ' (cocok)' : ` · <b>TIDAK COCOK</b> dengan rata-rata ${f2(WT)} bulan: periksa isian Data prodi › Tracer study`) + `</div>`;
  return kartuButir(49, 'Waktu tunggu (Tabel 6.f.1 LKPS)',
    `<div class="rumus">WT = ${f2(WT)} bulan (rata-rata laporan tracer) · ≤ 3 → 4 · 3 &lt; WT ≤ 18 → (23 − WT)/5 · skor terendah 1</div>${pita}`,
    skor, catatanResponden(J));
}

}

    return `<div class="kartu"><p class="kosong">Belum ada keterlibatan

// TS berjalan menurut tanggal hari ini. TS = 1 September s.d. 31 Agustus,
// ditulis sebagai tahun ujung (Oktober 2026 -> 2027 = TS 2026/2027).
function tsBerjalan(){
  const d = new Date();
  return d.getMonth() >= 8 ? d.getFullYear() + 1 : d.getFullYear();
}
// Pilihan TS: TS berjalan selalu ada (meski datanya belum masuk), ditambah
// TS yang punya data. Publikasi memakai tahun_ts, bukan tahun kalender.
// TS setelah TS berjalan (salah ketik data) tidak ditampilkan.
function daftarTS(){
  const kini = tsBerjalan();
  const th = new Set([kini]);
  (((D.akreditasi || {}).ta) || []).forEach(r => th.add(r.tahun_ts));
  (D.publikasi || []).forEach(p => th.add(+(p.tahun_ts ?? p.tahun)));
  return [...th].filter(t => Number.isFinite(t) && t <= kini)
    .sort((a, b) => b - a).slice(0, 6);
}

// ---------------------------------------------------------------------
//  Tren skor: satu baris per butir, tiga kolom TS, panah perubahan
//  TS-1 -> TS. Nilai dana/pengaturan yang berlaku "3 tahun terakhir"
//  tunggal akan tampak sama di ketiga kolom — itu wajar, bukan galat.
// ---------------------------------------------------------------------
function bagianTren(daftar, tren, tsTren){
  const chip = v => v == null ? '<span class="tchip kos">—</span>'
    : `<span class="tchip ${v >= 3.5 ? 'hij' : v >= 2 ? 'kun' : 'mer'}">${f2(v)}</span>`;
  const baris = daftar.map(x => {
    const t = tren[x.no] || {};
    const kini = t[tsTren[2]], lalu = t[tsTren[1]];
    let arah = '';
    if (kini != null && lalu != null){
      const d = kini - lalu;
      arah = Math.abs(d) < 0.005 ? '<span class="tarah datar">&#8213;</span>'
        : d > 0 ? `<span class="tarah naik">&#9650; ${f2(d)}</span>`
                : `<span class="tarah turun">&#9660; ${f2(-d)}</span>`;
    }
    return `<tr><td><a class="ke-butir" href="#butir-${x.no}">Butir ${x.no}</a></td>
      ${tsTren.map(ts => `<td>${chip(t[ts])}</td>`).join('')}
      <td>${arah}</td></tr>`;
  }).join('');
  return `<div class="kartu">
    <div class="gulir"><table class="rin tren"><thead><tr>
      <th style="text-align:left">Butir</th>
      ${tsTren.map(ts => `<th>TS ${taDari(ts)}</th>`).join('')}
      <th>&Delta; setahun</th>
    </tr></thead><tbody>${baris}</tbody></table></div>
    <p class="ctt" style="font-size:12.5px;color:var(--muted);margin-top:10px">
    Jendela tiap butir ikut bergeser: kolom TS ${esc(taDari(tsTren[0]))} menilai
    seolah-olah pengajuan dilakukan pada TS itu, memakai data tiga/lima tahun
    sebelumnya. Kolom lama wajar lebih kosong bila datanya belum sejauh itu.
    Butir dari tabel pengaturan dan BOP bernilai tunggal sehingga sama di
    ketiga kolom.</p></div>`;
}

// Indikator syarat rerata: komponen I/II butir manual, atau skor butir utuh.
function nilaiIndikator(ind){
  if (ind.komponen) {
    const v = IS(`b${ind.butir}_${ind.komponen}`);
    return v == null || !Number.isFinite(v) ? null : Math.max(0, Math.min(4, v));
  }
  const b = BUTIR_MANUAL.find(x => x.no === ind.butir);
  return b ? skorManual(b, IS).skor : null;
}

const NAMA_SASARAN = { t: 'Terakreditasi', u3: 'Unggul 3 th', u5: 'Unggul 5 th' };
const perluOrang = (persen, N) => Math.ceil(persen / 100 * N - 1e-9);

// Sama dengan aturan karya utama di bangun.py (publikasi bereputasi);
// "anggota" = dosen ikut menulis tetapi bukan penulis pertama/korespondensi.
const teksBereputasi = p => /bereputasi|scopus|ieee|spie|wos/i
  .test(`${p.jenis || ''} ${p.tingkat || ''} ${p.indeksasi || ''}`);

function kebutuhanSyarat(x, sa, tsData){
  const N = (D.dtps || {}).jumlah || 0;
  const amb = x[sa];   // ambang sasaran: % / sks untuk butir, skor untuk rerata
  if (x.indikator) {
    const rendah = x.indikator
      .map((ind, i) => ({ ind, v: x.nilai[i] }))
      .filter(o => o.v == null || o.v < x[sa] - 0.005)
      .map(o => `butir ${o.ind.butir}${o.ind.komponen ? '-' + o.ind.komponen.toUpperCase() : ''} ` +
                (o.v == null ? '(kosong)' : `(${f2(o.v)})`));
    return x.rerata == null
      ? `isi indikator yang kosong: ${rendah.filter(s => s.includes('kosong')).join(', ')}`
      : `rerata ${f2(x.rerata)}, perlu ${f2(amb)}; indikator di bawah ambang: ${rendah.join(', ') || '—'}`;
  }
  const jab = (D.dtps || {}).jabatan || {};
  if (x.no === '27') {
    const ada = (D.dtps || {}).doktor || 0;
    return `${ada} dari ${N} doktor; perlu ${perluOrang(amb, N)} (${amb}%) → ` +
           `kurang ${Math.max(0, perluOrang(amb, N) - ada)} dosen`;
  }
  if (x.no === '28') {
    const ada = (jab.lektor || 0) + (jab.lektor_kepala || 0) + (jab.guru_besar || 0);
    return `${ada} dari ${N} Lektor ke atas; perlu ${perluOrang(amb, N)} (${amb}%) → ` +
           `kurang ${Math.max(0, perluOrang(amb, N) - ada)} dosen`;
  }
  if (x.no === '35') {
    const ada = new Set(((D.dtps || {}).karya_utama_rinci || [])
      .filter(r => r.tahun >= tsData - 2 && r.tahun <= tsData).map(r => r.slug)).size;
    return `${ada} dari ${N} dosen punya karya utama di TS ${taDari(tsData - 2)} s.d. ` +
           `${taDari(tsData)}; perlu ${perluOrang(amb, N)} (${amb}%) → kurang ` +
           `${Math.max(0, perluOrang(amb, N) - ada)} dosen (lihat kontribusi per dosen)`;
  }
  if (x.no === '19') return `perlu ≥ ${amb} sks basic sciences dan matematika (isi di halaman isi butir)`;
  if (x.no === '49' || x.no === '50') return 'isi Data prodi › Tracer study (tahun lulus TS-2 dan TS-1)';
  return '';
}

  // B. Peluang poin: (4 - skor) x bobot, butir kosong dihitung dari 0.
  const peluang = Object.keys(skorButir).map(no => {
    const { n, ada } = skorButir[no];
    const b = bobotButir(no);
    return { no, n, ada, b, sisa: (4 - (ada ? n : 0)) * b,

  }).sort((p, q) => q.sisa - p.sisa);
  const tabelB = `

      <button type="button" id="sim-reset">Kosongkan simulasi</button></div>
    <div id="sim-hasil" class="ket" style="margin-top:8px"></div>`;

  // D. Kontribusi per dosen (khusus admin dan pimpinan). data.json memang
  // publik; batas peran di sini untuk tampilan, bukan pengaman data.
  let tabelD = '<p class="ket">Rincian kontribusi per dosen hanya tampil untuk peran admin dan pimpinan.</p>';
  if (PER_DOSEN) {
    const t0 = tsData - 2;
    const utama = {};
    ((D.dtps || {}).karya_utama_rinci || []).filter(r => r.tahun >= t0 && r.tahun <= tsData)
      .forEach(r => (utama[r.slug] = utama[r.slug] || new Set()).add(r.tahun));
    const anggota = {};
    (D.publikasi || []).filter(p => (p.tahun_ts ?? p.tahun) >= t0 && (p.tahun_ts ?? p.tahun) <= tsData
                                    && teksBereputasi(p))
      .forEach(p => (p.penulis || []).forEach(a => {
        if (a.peran !== 'penulis_pertama' && !a.korespondensi)
          (anggota[a.slug] = anggota[a.slug] || []).push(p.judul);
      }));
    const rek = {};
    (((D.akreditasi || {}).rekognisi_dtps) || []).filter(r => r.tahun >= t0 && r.tahun <= tsData)
      .forEach(r => rek[r.slug] = (rek[r.slug] || 0) + 1);
    const baris = (D.dosen || []).map(d => {
      const ok = !!utama[d.slug], ang = (anggota[d.slug] || []).length;
      const urut = ok ? 2 : ang ? 0 : 1;
      const ket = ok ? 'sudah menyumbang syarat 6'
        : ang ? 'paling dekat: sudah menulis di publikasi bereputasi sebagai anggota; ' +
                'jadikan penulis pertama/korespondensi pada publikasi berikutnya'
        : 'belum ada publikasi bereputasi di jendela ini';
      return { d, ok, ang, urut, ket, rek: rek[d.slug] || 0,
               th: ok ? [...utama[d.slug]].sort().map(taDari).join(', ') : '' };
    }).sort((a, b) => a.urut - b.urut || a.d.nama.localeCompare(b.d.nama));
    tabelD = `
      <p class="ket">Jendela TS ${esc(taDari(t0))} s.d. ${esc(taDari(tsData))}. Karya utama =
      penulis pertama/korespondensi publikasi bereputasi (Scopus/WoS/IEEE/SPIE) atau paten,
      aturan yang sama dengan butir 35 dan syarat 6.</p>
      <div class="gulir"><table class="rin"><thead><tr><th>Dosen</th><th>Karya utama (syarat 6)</th>
        <th>Bereputasi sebagai anggota</th><th>Rekognisi</th><th>Keterangan</th></tr></thead><tbody>
        ${baris.map(r => `<tr><td>${esc(r.d.nama)}</td>

          <td>${r.ang || '—'}</td><td>${r.rek || '—'}</td><td>${esc(r.ket)}</td></tr>`).join('')}
      </tbody></table></div>`;

  return `
    <p class="ket">Perkiraan status saat ini: <b>${esc(st.status)}${st.durasi ? ' ' + st.durasi + ' tahun' : ''}</b>

    <h3 class="sub-jalan">C. Kontribusi per dosen</h3>${tabelD}`;
}

// ---------------------------------------------------------------------
//  Rekap bukti: satu baris per butir (60). Bukti butir = kunci
//  bukti_b<NN> (tautan lama) dan butir_bukti; bukti karya = tautan bukti tiap
//  karya pembentuk butir, memakai peta yang sama dengan halaman rincian
//  (rincian.js), jadi angkanya sama dengan kartu dan rincian.html.
// ---------------------------------------------------------------------
function bagianRekapBukti(ctx){
  const { skorButir, judulButir, tsData } = ctx;
  const baris = Object.keys(skorButir).map(no => {
    const manual = BUTIR_MANUAL.some(m => m.no === no);
    // Bukti butir: tautan folder lama (bukti_b<NN>) dan/atau bukti tertaut
    // di tabel butir_bukti (sejak 2026-11-03).
    const tertaut = buktiButir(no, opsiBukti(tsData)).filter(x => x.url).length;
    const u = ISteks(`bukti_b${no}`) || (tertaut ? `${tertaut} tertaut` : '');
    let karya = null;
    if (BUTIR[no]) {
      const rows = BUTIR[no].baris(D, tsData) || [];
      karya = { n: rows.length, ada: rows.filter(r => cariBukti(r)).length };
    }
    const karyaLengkap = !karya || karya.n === 0 || karya.ada === karya.n;
    const status = u && karyaLengkap ? 'lengkap'
                 : u || (karya && karya.ada > 0) ? 'sebagian' : 'kosong';
    return { no, manual, u, karya, status, bobot: bobotButir(no),
             judul: judulButir[no] || '' };
  });
  // Urut nomor butir 1–60 (pemilik 2026-11-03); status tetap terlihat dari chip.
  baris.sort((a, b) => a.no - b.no);
  const jml = s => baris.filter(x => x.status === s);
  const bobotAda = baris.filter(x => x.status !== 'kosong').reduce((a, x) => a + x.bobot, 0);
  const chip = { lengkap: '<span class="tchip hij">lengkap</span>',
                 sebagian: '<span class="tchip kun">sebagian</span>',
                 kosong: '<span class="tchip mer">kosong</span>' };
  return `
    <p class="ket"><b>${jml('lengkap').length}</b> butir lengkap ·
      <b>${jml('sebagian').length}</b> sebagian · <b>${jml('kosong').length}</b> tanpa bukti ·
      butir berbukti mencakup <b>${f2(bobotAda / BOBOT_TOTAL * 100)}%</b> bobot.
      Urutan: nomor butir. Bukti karya dihitung pada
      jendela TS ${esc(taDari(tsData - 2))} s.d. ${esc(taDari(tsData))}.</p>
    <div class="gulir" style="max-height:520px"><table class="rin"><thead><tr>
      <th>Butir</th><th>Judul</th><th>Bobot</th><th>Bukti butir</th>
      <th>Bukti karya</th><th>Status</th></tr></thead><tbody>
      ${baris.map(x => `<tr>
        <td><a class="ke-butir" href="#butir-${esc(x.no)}">${esc(x.no)}</a></td><td>${esc(x.judul)}${x.manual ? ' <span class="tchip">kualitatif</span>' : ''}</td>
        <td>${f2(x.bobot)}</td>
        <td>${!x.u ? '—' : /^https?:/i.test(x.u) ? `<a class="bukti-sel" href="${esc(x.u)}" target="_blank"
               rel="noopener nofollow">buka &#8599;</a>` : `<a class="ke-butir" href="#butir-${esc(x.no)}">${esc(x.u)}</a>`}</td>
        <td>${x.karya ? (x.karya.n
              ? `<a href="rincian.html?butir=${esc(x.no)}">${x.karya.ada} dari ${x.karya.n} karya</a>`
              : 'tidak ada karya di jendela') : '—'}</td>
        <td>${chip[x.status]}</td></tr>`).join('')}
    </tbody></table></div>
    <p class="ket">Bukti butir diunggah (berkas, satu per satu atau beberapa sekaligus) di
      <a href="input-butir.html">halaman isi butir</a>; bukti karya diunggah dosen
      di form karya. Status "lengkap" = bukti butir ada dan, bila butir itu
      dibentuk karya, semua karyanya berbukti.</p>`;
}

function pasangSimulasi(ctx){
  const tabel = document.getElementById('tabel-simulasi');
  if (!tabel) return;
  const masukan = [...tabel.querySelectorAll('input[data-butir]')];
  const hasil = document.getElementById('sim-hasil');
  const hitung = () => {
    const sim = {};
    masukan.forEach(i => {
      const v = i.value.trim() === '' ? null : Math.max(0, Math.min(4, +i.value));
      if (v != null && Number.isFinite(v)) sim[i.dataset.butir] = v;
    });
    if (!Object.keys(sim).length) { hasil.innerHTML = 'Belum ada skor simulasi.'; return; }
    let NAmin = 0, NAmx = 0;
    const nilai = {};
    Object.keys(ctx.skorButir).forEach(no => {
      const { n, ada } = ctx.skorButir[no];
      const v = no in sim ? sim[no] : ada ? n : null;
      nilai[no] = v;
      NAmin += bobotButir(no) * (v ?? 0);
      NAmx  += bobotButir(no) * (v ?? 4);
    });
    // Syarat: butir syarat memakai skor simulasi; syarat rerata memakai skor
    // simulasi butir utuh bila butir itu diisi, selain itu nilai sebenarnya.
    const syB = Object.keys(SYARAT_UNGGUL).map(no => statusSyarat(no, nilai[no]));
    const syR = SYARAT_RERATA.map(d => statusRerata(d,
      ind => ind.butir in sim ? sim[ind.butir] : nilaiIndikator(ind)));
    const ok = sa => gabungSyarat([...syB, ...syR].map(x => x[sa + 'ok']));
    const s = statusRentang(NAmin, NAmx, ok('t'), ok('u3'), ok('u5'));
    hasil.innerHTML = `<b>Hasil simulasi:</b> ${esc(s.status)}${s.durasi ? ' ' + s.durasi + ' tahun' : ''}
      · NA ${f2(NAmin)}${NAmx - NAmin > 0.005 ? ` s.d. ${f2(NAmx)} (butir yang masih kosong)` : ''}
      · ${Object.keys(sim).length} butir diubah. ${esc(s.catatan || '')}`;
  };
  document.getElementById('sim-hitung').onclick = hitung;
  document.getElementById('sim-reset').onclick = () => { masukan.forEach(i => i.value = ''); hitung(); };
  document.getElementById('sim-empat').onclick = () => {
    masukan.forEach(i => { if (!ctx.skorButir[i.dataset.butir].ada) i.value = '4'; }); hitung(); };
  masukan.forEach(i => i.addEventListener('keydown', e => { if (e.key === 'Enter') hitung(); }));
}

    {no:'25', f: () => butirKegMhs(25, 'PkM DTPS melibatkan mahasiswa (Tabel 6.i LKPS)', 'pkm')},
    {no:'26', f: butir26}, {no:'27', f: butir27}, {no:'28', f: butir28},

    {no:'32', f: () => butirDanaSumber(32, 'PkM DTPS per sumber dana (Tabel 3.c LKPS)', 'pkm')},
    {no:'33', f: butir33}, {no:'34', f: butir34}, {no:'35', f: butir35},
    {no:'36', f: butir36}, {no:'37', f: butir37},
    {no:'40', f: butir40}, {no:'41', f: butir41},
    {no:'42', f: butir42}, {no:'43', f: butir43},
    {no:'44', f: butir44}, {no:'45', f: butir45},
    {no:'46', f: butir46}, {no:'47', f: butir47},
    {no:'49', f: butir49}, {no:'50', f: butir50}, {no:'51', f: butir51},
    // 32 butir manual dari butir-manual.js — selalu tampil, meski kosong.
    ...BUTIR_MANUAL.map(b => ({no: b.no, f: () => butirManual(b)})),
  ].sort((a, b) => (+a.no) - (+b.no));
  // Mengembalikan {n, ada}: n selalu angka (0 bila butir tak terhitung),
  // `ada` menandai apakah butir itu benar-benar punya nilai. Dua angka
  // berbeda dilaporkan di ringkasan supaya perkiraan yang memasukkan nol
  // tidak tertukar dengan rata-rata butir yang sungguh terhitung.
  const skorDari = h => {
    const m = h.match(/class="angka ([^"]*)">([\d.,]+)</);
    if (!m) return { n: 0, ada: false };
    if (/\bnol\b/.test(m[1])) return { n: 0, ada: false };
    return { n: +String(m[2]).replace(',', '.'), ada: true };
  };

  // Seluruh fungsi butir membaca TS global sebagai UJUNG jendela data.
  // TS digeser di sini sesuai sakelar, lalu dipulihkan setelah semua
  // kartu jadi — label di dalam kartu otomatis menunjukkan tahun data
  // yang sebenarnya dipakai.
  const TS_PILIH = TS;
  TS = TS_PILIH - JENDELA_OFS;

  // Tren 3 TS: tiap butir dihitung ulang pada TS-2, TS-1, dan TS dengan
  // menggeser TS global sementara. Seluruh fungsi butir membaca TS global,
  // jadi satu mekanisme ini berlaku untuk semua rumus sekaligus.
  const tsTren = [TS - 2, TS - 1, TS];
  const tsAsli = TS;
  const tren = {};
  tsTren.forEach(t => {
    TS = t;
    daftar.forEach(x => { const r = skorDari(x.f());
      (tren[x.no] = tren[x.no] || {})[t] = r.ada ? r.n : null; });
  });
  TS = tsAsli;

  const kartu = {};
  daftar.forEach(x => kartu[x.no] = x.f());
  const htmlIntegrasi = bagianIntegrasi();
  const htmlKeterlibatan = bagianKeterlibatan();
  const TS_DATA = TS;
  TS = TS_PILIH;
  const semuaSkor = [];        // hanya butir yang benar-benar terhitung
  const ring = daftar.map(x => {
    const { n, ada } = skorDari(kartu[x.no]);
    if (ada) semuaSkor.push(n);
    const kls = !ada ? 'kos' : n >= 3.5 ? 'hij' : n >= 2 ? 'kun' : 'mer';
    return `<a class="${kls} ke-butir" href="#butir-${x.no}" data-no="${x.no}"
      data-n="${ada ? n : 0}" data-b="${bobotButir(x.no)}" title="${ada ? 'Klik: kartu butir dan buktinya' : 'Klik untuk kartu butir. Belum ada nilai — dihitung 0'}">
      <b>${f2(ada ? n : 0)}</b><span>Butir ${x.no}${ada ? '' : ' \u00b7 kosong'}</span></a>`;
  }).join('');
  const kosong = daftar.length - semuaSkor.length;
  // Butir kosong punya DUA sebab yang berbeda penanganannya:
  //  - butir manual belum dinilai   -> isi di input-butir.html
  //  - butir terhitung tanpa data   -> lengkapi lembar Excel / Supabase
  // Menggabungkannya jadi satu angka membuat orang mencari di tempat salah.
  const noManual = new Set(BUTIR_MANUAL.map(b => b.no));
  const kosongNo = daftar.filter(x => !skorDari(kartu[x.no]).ada).map(x => x.no);
  const kosongManual = kosongNo.filter(n => noManual.has(n));
  const kosongData = kosongNo.filter(n => !noManual.has(n));

  // Nilai berbobot menurut lampiran bobot LAM Teknik. Bobot seluruh butir
  // berjumlah 100, jadi Σ(skor × bobot) langsung berskala 0–400 dan
  // dibagi 100 kembali ke skala 0–4 yang sama dengan tiap kartu.
  const bw = no => bobotButir(no);
  let poinBobot = 0, bobotTerisi = 0;
  daftar.forEach(x => {
    const { n, ada } = skorDari(kartu[x.no]);
    poinBobot += (ada ? n : 0) * bw(x.no);
    if (ada) bobotTerisi += bw(x.no);
  });
  const cakupan        = (bobotTerisi / BOBOT_TOTAL) * 100;
  const persen2        = (poinBobot / (BOBOT_TOTAL * 4)) * 100;

  // Butir TERISI yang nilainya di bawah 2,50. Nilai yang ditampilkan adalah
  // skor butir apa adanya (tanpa dikalikan bobot), karena itu yang sebanding
  // dengan skala 0–4 di tiap kartu. Bobot tetap dipakai untuk MENGURUTKAN:
  // sisa poin yang bisa direbut = (4 − skor) × bobot. Butir bernilai 1,46
  // berbobot 0,22 hampir tak berpengaruh; butir 2,40 berbobot 5,32 sangat.
  const AMBANG_LEMAH = 2.5;
  const lemah = daftar
    .map(x => ({ no: x.no, ...skorDari(kartu[x.no]), b: bw(x.no) }))
    .filter(x => x.ada && x.n < AMBANG_LEMAH)
    .map(x => ({ ...x, sisa: (4 - x.n) * x.b }))
    .sort((p, q) => q.sisa - p.sisa);

  // Syarat perlu (Tabel 4.3.1) dan status akreditasi (Tabel 3), pedoman
  // penilaian LAM Teknik 2025; aturannya di syarat-unggul.js. Syarat tidak
  // ikut dirata-ratakan ke NA: satu syarat gagal menggugurkan sasarannya.
  const syButir = Object.keys(SYARAT_UNGGUL).map(no => {
    const { n, ada } = skorDari(kartu[no] || '');
    return { no, n, ada, ...statusSyarat(no, ada ? n : null) };
  });
  const syRerata = SYARAT_RERATA.map(d => statusRerata(d, nilaiIndikator));
  const semuaSy = [...syButir, ...syRerata];
  const okSasaran = sa => gabungSyarat(semuaSy.map(x => x[sa + 'ok']));
  // NA = poinBobot (Σ bobot × skor, skala 0–400) adalah BATAS BAWAH: butir
  // kosong bernilai 0. Batas atas = bila semua butir kosong bernilai 4.
  // Status hanya dinyatakan bila kedua batas memberi status yang sama.
  const NAmax = poinBobot + 4 * (BOBOT_TOTAL - bobotTerisi);
  const st = statusRentang(poinBobot, NAmax, okSasaran('t'), okSasaran('u3'), okSasaran('u5'));
  const stKls = st.status.startsWith('Terakreditasi Unggul') ? 'hij'
              : st.status === 'Terakreditasi' ? 'kun'
              : st.status === 'Tidak Terakreditasi' ? 'mer' : '';
  const uraiSyarat = (x, sa) => x.indikator
    ? `${x.label} ${x.rerata == null ? 'belum lengkap' : f2(x.rerata)}, perlu ${f2(x[sa])}`
    : `butir ${x.no} ${x.ada ? f2(x.n) : 'kosong'}, perlu ${f2(x.skorMin[sa])}`;
  const daftarGagal = SASARAN.map(sa => {
    const g = semuaSy.filter(x => x[sa + 'ok'] === false);
    return g.length ? `<b>${NAMA_SASARAN[sa]} belum terpenuhi:</b> ` +
      g.map(x => uraiSyarat(x, sa)).join('; ') + '.' : '';
  }).filter(Boolean);
  const syBelum = semuaSy.filter(x => SASARAN.some(sa => x[sa + 'ok'] == null))

  // Konteks seksi "Jalan menuju Unggul": skor dan judul tiap butir diambil
  // dari kartu yang sudah dirender, jadi angkanya sama dengan ringkasan.
  const ctxJalan = {
    semuaSy, st, NA: poinBobot, NAmax, tsData: TS_DATA, tren, tsTren,
    skorButir: Object.fromEntries(daftar.map(x => [x.no, skorDari(kartu[x.no])])),
    judulButir: Object.fromEntries(daftar.map(x => {
      const m = (kartu[x.no] || '').match(/<h3>([^<]*)/);
      return [x.no, m ? m[1].trim() : ''];
    })),
  };
  const seksi = (id, judul, ket, nomor) =>
    seksiLipat(id, judul, ket, nomor.map(n => kartu[n]).join(''));
  // Nomor butir manual per seksi, diurutkan angka.
  const man = sk => BUTIR_MANUAL.filter(b => b.seksi === sk).map(b => b.no);
  const gab = (...xs) => [...new Set(xs.flat())].sort((a, b) => (+a) - (+b));
  const rentang = ns => ns.length ? `Butir ${ns[0]}\u2013${ns[ns.length - 1]}` : '';

  document.getElementById('isi').innerHTML = `

// Urutan chip ringkasan (permintaan pemilik 2026-11-03). Bawaan = nomor
// butir; skor tidak dihitung ulang, hanya urutan elemen yang diganti.
const URUT_RINGKAS = {
  no:    (a, b) => a.dataset.no - b.dataset.no,
  nilai: (a, b) => a.dataset.n - b.dataset.n || a.dataset.no - b.dataset.no,
  bobot: (a, b) => b.dataset.b - a.dataset.b || a.dataset.no - b.dataset.no,
};
function urutkanRingkas(cara){
  if (cara) simpanAman.set('urutRingkas', cara);
  cara = simpanAman.get('urutRingkas');
  if (!URUT_RINGKAS[cara]) cara = 'no';
  const wadah = document.querySelector('.ringkas');
  if (!wadah) return;
  [...wadah.children].sort(URUT_RINGKAS[cara]).forEach(c => wadah.appendChild(c));
  document.querySelectorAll('#urut-ringkas button').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.urut === cara)));
}
document.addEventListener('click', e => {
  const b = e.target.closest('#urut-ringkas button[data-urut]');
  if (b) urutkanRingkas(b.dataset.urut);
});

function pasangTS(){
  const wadah = document.getElementById('pilih-ts');
  const daftar = daftarTS();
  // Bawaan: TS berjalan (dari tanggal hari ini), supaya tahun berjalan
  // terpantau sejak awal; TS yang sudah tutup tetap bisa dipilih
  // (keputusan pemilik 2026-10-15).
  const kini = tsBerjalan();
  if (TS == null) TS = daftar.includes(kini) ? kini : daftar[0];
  wadah.innerHTML = `<span class="lbl">TS</span>` + daftar.map(t =>
    `<button aria-pressed="${t === TS}" data-ts="${t}"${t === kini
       ? ' title="TS berjalan: belum tutup buku sampai 31 Agustus"' : ''}>${taDari(t)}${
       t === kini ? ' · berjalan' : ''}</button>`).join('')
    + `<span class="lbl" style="margin-left:14px">Jendela</span>
       <button aria-pressed="${JENDELA_OFS === 0}" data-ofs="0"
         title="Sama dengan kolom TS-2, TS-1, TS di tabel LKPS">LKPS (TS-2…TS)</button>
       <button aria-pressed="${JENDELA_OFS === 1}" data-ofs="1"
         title="Seluruh jendela digeser setahun ke belakang. Alat bantu internal, BUKAN definisi LKPS">Mundur 1 TS</button>`;
  wadah.querySelectorAll('button[data-ts]').forEach(b =>
    b.addEventListener('click', () => { TS = +b.dataset.ts; pasangTS(); render(); pasangSeksi(); angkaNaik('.ringkas b'); }));
  wadah.querySelectorAll('button[data-ofs]').forEach(b =>
    b.addEventListener('click', () => {
      JENDELA_OFS = +b.dataset.ofs;
      try { sessionStorage.setItem('jendelaOfsLkps', String(JENDELA_OFS)); } catch {}
      pasangTS(); render(); pasangSeksi(); angkaNaik('.ringkas b');
    }));
}

async function mulai(){
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return layarMasuk();

  const { data: saya } = await sb.from('dosen').select('id,nama,email,peran')
    .ilike('email', session.user.email).maybeSingle();
  if (!saya) return layarTidakTerdaftar(session.user.email);
  pasangMenu(sb);
  PER_DOSEN = ['admin', 'pimpinan'].includes(saya.peran);
  ADMIN = saya.peran === 'admin';
  SAYA_EMAIL = saya.email;

  document.getElementById('nama-prodi').textContent = 'Memuat data\u2026';
  const [jsonR, danaR, pengR, buktiR, dokR, bbR, kbR] = await Promise.all([
    fetch('data.json?v=' + Date.now()),
    sb.from('karya').select('id,induk_id,tahun,bulan,kategori,besaran_dana,judul,bukti_url')
      .eq('status', 'terverifikasi').in('kategori', ['penelitian', 'pkm']),
    sb.from('pengaturan').select('kunci,nilai'),
    sb.from('karya').select('id,induk_id,tahun,kategori,judul,bukti_url')
      .eq('status', 'terverifikasi').in('kategori', ['publikasi', 'rekognisi']),
    sb.from('dokumen').select('*'),
    sb.from('butir_bukti').select('*'),
    sb.from('karya_bukti').select('karya_id,jenis,judul,url'),
  ]);
  if (!jsonR.ok) throw new Error('data.json ' + jsonR.status);
  D = await jsonR.json();
  DANA = danaR.data || [];
  // Bukti digabung dari dua query karya: penelitian/PkM (ikut query dana)
  // dan publikasi/rekognisi. Keduanya lewat RLS, jadi hanya terbaca oleh
  // pengguna yang sudah login dan terdaftar di tabel `dosen`.
  isiPetaBukti([...(danaR.data || []), ...(buktiR.data || [])], kbR.data || []);
  (pengR.data || []).forEach(r => PENG[r.kunci] = r.nilai);
  PENG_GAGAL = !!pengR.error;
  DOK = dokR.data || [];
  BB = bbR.data || [];
  BB_GAGAL = bbR.error ? bbR.error.message : '';
  if (bbR.error || kbR.error) console.warn('Bukti jamak tidak terbaca (patch 14?):',
    (bbR.error || kbR.error).message);
  if (dokR.error) console.warn('Tabel dokumen tidak terbaca:', dokR.error.message);

  // Prodi dan institusi tampil di baris atas kepala (kepala.css); Keluar ada di menu.
  document.getElementById('nama-prodi').textContent = `Masuk sebagai ${saya.nama}`;
  pasangTS(); render(); pasangSeksi(); angkaNaik('.ringkas b');
  if (location.hash.startsWith('#butir-')) lompatKeButir(location.hash.slice(1));
}

  document.getElementById('nama-prodi').textContent = 'Halaman khusus dosen prodi';
  document.getElementById('isi').innerHTML = `
    <div class="kartu" style="margin-top:30px;max-width:480px">
      <h3 style="font-family:var(--serif);color:var(--biru);margin:0 0 6px">Masuk</h3>
      <p class="ket">Halaman skor hanya untuk dosen yang emailnya terdaftar.
      Masukkan email kampus Anda — tautan masuk dikirim tanpa kata sandi.</p>
      <input id="em" type="email" placeholder="nama@kampus.ac.id"
        style="width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:2px;
               font:inherit;margin-bottom:10px">
      <button id="kirim" style="font-family:var(--mono);font-size:12px;letter-spacing:.06em;
        text-transform:uppercase;background:var(--biru);color:#fff;border:0;
        padding:10px 18px;border-radius:2px;cursor:pointer">Kirim tautan masuk</button>
      <span id="m" class="ket" style="margin-left:10px"></span>
    </div>`;
  const em = document.getElementById('em'), m = document.getElementById('m'),
        kirim = document.getElementById('kirim');
  em.onkeydown = e => { if (e.key === 'Enter') kirim.click(); };
  kirim.onclick = async () => {

    kirim.disabled = true; m.textContent = 'Mengirim\u2026';

      options: { emailRedirectTo: location.href.split('#')[0] } });
    kirim.disabled = false;
    m.textContent = error ? error.message : 'Tautan terkirim. Periksa kotak masuk Anda.';
  };
}

// Angka pita/ringkasan naik perlahan saat pertama tampil (hormati
// preferensi reduced-motion; teks non-angka dibiarkan apa adanya).
function angkaNaik(sel){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  document.querySelectorAll(sel).forEach(el => {
    if (el.dataset.naik) return; el.dataset.naik = '1';
    const asli = el.textContent.trim();
    const t = parseFloat(asli.replace(',', '.'));
    if (!isFinite(t) || /[^0-9.,]/.test(asli)) return;
    const des = (asli.split(/[.,]/)[1] || '').length;
    const m0 = performance.now();
    const tik = n => {
      const q = Math.min(1, (n - m0) / 600), e = 1 - Math.pow(1 - q, 3);
      el.textContent = (t * e).toFixed(des).replace('.', asli.includes(',') ? ',' : '.');
      if (q < 1) requestAnimationFrame(tik); else el.textContent = asli;
    };
    requestAnimationFrame(tik);
  });
}
