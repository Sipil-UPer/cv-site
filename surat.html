<style>
  /* Surat dan SK prodi (201-patch-surat-sk-prodi.sql, pemilik 2026-11-28) */
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
  .wrap{max-width:1200px;margin:0 auto;padding:18px 20px 80px}
  .kosong, .ket{color:var(--muted)}
  .ket{font-size:13px}
  .kartu{background:var(--panel);border:1px solid var(--line);padding:14px 18px;margin-bottom:16px}
  .kartu h2{font-size:17px;margin:0 0 6px;color:var(--biru)}
  .kartu h3{font-size:15px;margin:14px 0 4px}
  .alat{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0}
  select, input[type=text], input[type=number], input[type=date], input[type=url], input[type=search], textarea{font:inherit;font-size:14px;padding:5px 7px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
  textarea{width:100%}
  .form{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px 14px;margin:8px 0}
  .form label{display:flex;flex-direction:column;font-size:13px;color:var(--muted);gap:3px}
  .form .lebar{grid-column:1/-1}
  .pilih-dosen{max-height:210px;overflow:auto;border:1px solid var(--line);padding:6px 8px;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:2px 12px}
  .pilih-dosen label{flex-direction:row;align-items:center;gap:6px;color:var(--ink);font-size:13.5px}
  .b{font:inherit;font-size:14px;padding:5px 12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
  .b.utama{background:var(--biru);border-color:var(--biru);color:#fff}
  .b.bahaya{color:var(--merah);border-color:var(--merah)}
  .b.kecil{font-size:12.5px;padding:2px 8px}
  .b:disabled{opacity:.6;cursor:default}
  .pesan{font-size:13.5px;margin:6px 0} .pesan.galat{color:var(--merah)} .pesan.ok{color:var(--hijau)}
  .gulir{overflow-x:auto}
  table.ds{width:100%;border-collapse:collapse;font-size:13.5px}
  table.ds th{text-align:left;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);padding:5px 6px}
  table.ds td{padding:5px 6px;border-bottom:1px solid var(--line-soft);vertical-align:top}
  table.ds td.aksi{white-space:nowrap}
  .st{font-size:12px;font-weight:600;padding:1px 7px;border:1px solid var(--line);white-space:nowrap}
  .st.disahkan{color:var(--hijau);border-color:var(--hijau)} .st.diajukan{color:var(--biru);border-color:var(--biru)}
  .st.dikembalikan{color:#8A5A00;border-color:#8A5A00} .st.dibatalkan{color:var(--merah);border-color:var(--merah)} .st.draf, .st.arsip{color:var(--muted)}
  .tanda{border:1px solid var(--line);padding:10px 12px;margin:8px 0}
  .tanda .isi{white-space:pre-wrap;font-size:13.5px;background:var(--bg);padding:8px;margin:6px 0;max-height:260px;overflow:auto}
  code{font-family:var(--mono);font-size:12.5px}
  @media(max-width:700px){.wrap{padding-left:16px;padding-right:16px}}
</style>

<div class="hero" role="region" aria-label="Pembuka halaman"><div class="hero-in">
  <div class="hero-inst" data-identitas></div>
  <h1>Surat dan SK</h1>

</div></div>
<main class="wrap" id="isi"><p class="kosong">Memuat…</p></main>

<script>
// Galat saat memuat skrip ditampilkan sebagai pesan, bukan halaman kosong.
addEventListener('error', function (e) {
  if (document.getElementById('galat-muat')) return;
  var d = document.createElement('div');
  d.id = 'galat-muat';
  d.style.cssText = 'margin:16px;padding:12px 14px;border:1px solid var(--merah);' +
    'background:var(--merah-m3);color:var(--ink);font:14px/1.5 system-ui,sans-serif';
  d.textContent = 'Halaman gagal dimuat: ' + (e.message || 'galat skrip') +
    '. Tekan Ctrl+Shift+R untuk memuat ulang tanpa cache; bila tetap muncul, kirim pesan ini ke admin.';
  document.body.insertBefore(d, document.body.firstChild);
});
</script>
<script type="module">
// Surat dan SK prodi (201, pemilik 2026-11-28): admin dan Kaprodi menyusun; SK prodi disahkan Dekan, jenis lain Kaprodi,
// sendiri (tanpa a.n.); nomor dari pola per jenis diberikan saat disahkan; Word ber-QR ke verifikasi-surat.html.
// Dosen melihat surat yang menyebut dirinya. Logika murni: surat.js.
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/+esm';
import { gerbang } from './menu.js?v=2026-11-28-07d8c8';
import { punya } from './koordinator.js?v=2026-11-28-07d8c8';
import { STATUS_SURAT, PENANDATANGAN, PENANDA_POLA, galatPola, nomorBerikut, hariIniWIB, buatSurat, namaBerkasSurat, urlVerifikasi, rekapSurat, tglPanjang }
  from './surat.js?v=2026-11-28-07d8c8';
import { pngQr } from './rps-word.js?v=2026-11-28-07d8c8';
import { drafSkAsisten } from './karier.js?v=2026-11-28-07d8c8';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sb = createClient(window.SB_URL, window.SB_KEY);
const TH = +hariIniWIB().slice(0, 4);

let SAYA = null, JENIS = [], SURAT = [], URUT = [], DOSEN = [], PRODI = {}, ADA = true, UBAH = null, PENGAJUAN = null;
let SARING = { tahun: String(TH), jenis: '', status: '', cari: '' };
const ADMIN = () => SAYA?.peran === 'admin';
const KELOLA = () => ADMIN() || punya(SAYA, 'kaprodi');
const TANDA = () => ({ kaprodi: punya(SAYA, 'kaprodi'), dekan: punya(SAYA, 'dekan') });
const BACA_SEMUA = () => KELOLA() || punya(SAYA, 'dekan') || SAYA?.peran === 'pimpinan';
const jenisDari = k => JENIS.find(j => j.kode === k) || { kode: k, nama: k, penandatangan: 'kaprodi' };
const namaDosen = id => { const d = DOSEN.find(x => x.id === id); return d ? (d.nama_gelar || d.nama) : '?'; };
function tulis(id, k, t){ const m = $(id); if (m) { m.className = 'pesan ' + k; m.textContent = t; } }
const opsiJenis = (v, semua = false) => JENIS.filter(j => semua || j.aktif || j.kode === v)
  .map(j => `<option value="${esc(j.kode)}"${j.kode === v ? ' selected' : ''}>${esc(j.nama)}</option>`).join('');

async function muat(){
  const [j, s, u] = await Promise.all([
    sb.from('surat_jenis').select('*').order('urut_tampil').order('nama'),
    sb.from('surat').select('*').order('id', { ascending: false }),
    sb.from('surat_nomor_urut').select('*'),
  ]);
  ADA = !j.error && !s.error; JENIS = j.data || []; SURAT = s.data || []; URUT = u.error ? [] : (u.data || []);
}

// ---------- Word ----------
const konsepDari = s => ({ jenis: s.jenis, jenis_nama: jenisDari(s.jenis).nama, perihal: s.perihal, tujuan: s.tujuan, isi: s.isi,
  dosen: (s.dosen_ids || []).map(id => { const d = DOSEN.find(x => x.id === id); return { nama: d ? (d.nama_gelar || d.nama) : '?', nidn: d?.nidn || '' }; }) });
async function unduhWord(s){
  const o = { prodi: PRODI.prodi, institusi: PRODI.institusi };
  let S, qr = null;
  if (s.status === 'disahkan' && s.sah && s.kode_verifikasi) {
    S = s.sah; o.url = urlVerifikasi(s.kode_verifikasi, location.href);
    qr = await pngQr(o.url).catch(() => null);
  } else {
    S = konsepDari(s); o.konsep = true; o.penandatangan = { jabatan: jenisDari(s.jenis).penandatangan };
  }
  const blob = await buatSurat(S, o, qr);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = namaBerkasSurat(S); a.click(); URL.revokeObjectURL(a.href);
}

// ---------- Bagian halaman ----------
function htmlTanda(){
  const t = TANDA(), xs = SURAT.filter(s => s.status === 'diajukan' && t[s.penandatangan || jenisDari(s.jenis).penandatangan]);
  if (!t.kaprodi && !t.dekan) return '';
  return `<section class="kartu" id="tanda"><h2>Menunggu tanda tangan Anda</h2>
    <p class="ket">${t.dekan ? 'SK prodi' : ''}${t.dekan && t.kaprodi ? ' dan ' : ''}${t.kaprodi ? 'surat prodi' : ''} yang diajukan admin atau Kaprodi.
      <b>Sahkan</b> memberi nomor otomatis, tanggal hari ini, dan kode QR verifikasi; isi tidak bisa diubah lagi (bila keliru: batalkan, lalu buat surat baru).
      Pengesahan tidak bisa diwakilkan.</p>
    ${xs.length ? xs.map(s => `<div class="tanda">
      <div><b>${esc(s.perihal)}</b> <span class="ket">· ${esc(jenisDari(s.jenis).nama)}</span></div>
      ${s.tujuan ? `<div class="ket">Kepada: ${esc(s.tujuan)}</div>` : ''}
      ${s.isi ? `<div class="isi">${esc(s.isi)}</div>` : ''}
      ${(s.dosen_ids || []).length ? `<div class="ket">Nama disebut: ${esc(s.dosen_ids.map(namaDosen).join(', '))}</div>` : ''}
      ${s.lampiran_url ? `<div class="ket"><a href="${esc(s.lampiran_url)}" target="_blank" rel="noopener">Buka lampiran/konsep</a></div>` : ''}
      <div class="alat"><button type="button" class="b" data-word="${s.id}">Unduh konsep Word</button>
        <button type="button" class="b utama" data-sahkan="${s.id}">Sahkan</button>
        <input type="text" id="kc_${s.id}" maxlength="2000" placeholder="Catatan bila dikembalikan" style="flex:1;min-width:200px">
        <button type="button" class="b" data-kembalikan="${s.id}">Kembalikan</button>
        <span class="pesan" id="mt_${s.id}" role="status"></span></div></div>`).join('')
      : '<p class="kosong">Tidak ada surat yang menunggu.</p>'}</section>`;
}

function htmlForm(){
  if (!KELOLA()) return '';
  const x = UBAH || { jenis: PENGAJUAN ? 'surat_mahasiswa' : (JENIS.find(j => j.aktif)?.kode || ''), dosen_ids: [], status: 'draf', ...(PENGAJUAN?.isi || {}) };
  const arsip = x.status === 'arsip';
  return `<section class="kartu" id="form"><h2>${UBAH ? 'Ubah surat' : 'Tulis surat'}</h2>
    <p class="ket">Susun isi surat, simpan sebagai draf, lalu <b>ajukan</b> ke penandatangan (SK prodi: Dekan; jenis lain: Kaprodi).
      Nomor dan tanggal diberikan otomatis saat disahkan. Sampai templat per jenis tersedia, Word memakai bentuk umum: kop, nomor, perihal,
      kepada, isi, daftar nama, tanda tangan ber-QR.${PENGAJUAN ? ` <b>${esc(PENGAJUAN.label || `Dari permohonan mahasiswa #${PENGAJUAN.id}.`)}</b>` : ''}</p>
    <div class="form">
      <label>Jenis <select id="fJenis">${opsiJenis(x.jenis)}</select></label>
      <label class="lebar">Perihal (tampil di halaman verifikasi publik; jangan memuat data pribadi)
        <input type="text" id="fPerihal" maxlength="300" value="${esc(x.perihal || '')}" placeholder="mis. Pembimbing tugas akhir semester Genap 2026/2027"></label>
      <label class="lebar">Kepada (satu baris per baris surat; kosongkan untuk SK)
        <textarea id="fTujuan" rows="2" maxlength="500">${esc(x.tujuan || '')}</textarea></label>
      <label class="lebar">Isi surat (paragraf dipisah baris baru; untuk SK tulis Menimbang, Mengingat, Memutuskan)
        <textarea id="fIsi" rows="9" maxlength="20000">${esc(x.isi || '')}</textarea></label>
      <div class="lebar"><div class="ket">Dosen yang disebut (SK, surat tugas): tampil di lampiran Word dan di halaman Surat dan SK dosen itu.</div>
        <input type="search" id="fCariDosen" placeholder="Saring nama dosen" style="margin:4px 0">
        <div class="pilih-dosen" id="fDosen">${DOSEN.map(d => `<label data-nama="${esc((d.nama_gelar || d.nama).toLowerCase())}"><input type="checkbox" value="${d.id}"${
          (x.dosen_ids || []).includes(d.id) ? ' checked' : ''}> ${esc(d.nama_gelar || d.nama)}</label>`).join('')}</div></div>
      <label class="lebar">Lampiran atau konsep (tautan https, mis. Google Drive; opsional)
        <input type="url" id="fLampiran" value="${esc(x.lampiran_url || '')}"></label>
      <label class="lebar" style="flex-direction:row;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" id="fArsip"${arsip ? ' checked' : ''}${UBAH && !arsip ? ' disabled' : ''}>
        Surat lama atau sudah ditandatangani di luar situs (dicatat sebagai arsip dengan nomor yang tertulis di surat; tanpa QR)</label>
      <div class="lebar form" id="fArsipIsi" style="${arsip ? '' : 'display:none'}">
        <label>Nomor surat <input type="text" id="fNomor" maxlength="120" value="${esc(x.nomor || '')}"></label>
        <label>Tanggal surat <input type="date" id="fTanggal" value="${esc(x.tanggal || '')}"></label>
        <label class="lebar">Berkas bertanda tangan (tautan https) <input type="url" id="fBerkas" value="${esc(x.arsip_url || '')}"></label>
      </div></div>
    <div class="alat"><button type="button" class="b utama" id="bSimpan">${UBAH ? 'Simpan perubahan' : 'Simpan draf'}</button>
      ${!arsip ? `<button type="button" class="b" id="bSimpanAjukan">Simpan dan ajukan</button>` : ''}
      ${UBAH || PENGAJUAN ? '<button type="button" class="b" id="bBatal">Batal</button>' : ''}<span class="pesan" id="mForm" role="status"></span></div></section>`;
}

const tersaring = () => SURAT.filter(s => {
  const th = s.tanggal ? String(s.tanggal).slice(0, 4) : String(TH);   // draf/diajukan dihitung tahun berjalan
  const q = SARING.cari.toLowerCase();
  return (!SARING.tahun || th === SARING.tahun) && (!SARING.jenis || s.jenis === SARING.jenis) && (!SARING.status || s.status === SARING.status)
    && (!q || `${s.nomor || ''} ${s.perihal} ${s.tujuan || ''}`.toLowerCase().includes(q));
});
function aksiAgenda(s){
  const k = KELOLA(), b = [];
  if (['draf', 'dikembalikan'].includes(s.status) && k) b.push(`<button type="button" class="b kecil" data-ubah="${s.id}">Ubah</button>`,
    `<button type="button" class="b kecil utama" data-ajukan="${s.id}">Ajukan</button>`, `<button type="button" class="b kecil bahaya" data-hapus="${s.id}">Hapus</button>`);
  if (s.status === 'diajukan' && k) b.push(`<button type="button" class="b kecil" data-tarik="${s.id}">Tarik</button>`);
  if (['draf', 'dikembalikan', 'diajukan', 'disahkan'].includes(s.status)) b.push(`<button type="button" class="b kecil" data-word="${s.id}">Word</button>`);
  if (s.status === 'disahkan') {
    b.push(`<a class="b kecil" href="verifikasi-surat.html?k=${esc(s.kode_verifikasi)}" target="_blank" rel="noopener">Verifikasi</a>`);
    if (k) b.push(`<button type="button" class="b kecil" data-berkas="${s.id}">Berkas akhir</button>`);
    if (k || TANDA()[s.penandatangan]) b.push(`<button type="button" class="b kecil bahaya" data-batal="${s.id}">Batalkan</button>`);
  }
  if (s.status === 'arsip' && k) b.push(`<button type="button" class="b kecil" data-ubah="${s.id}">Ubah</button>`, `<button type="button" class="b kecil bahaya" data-hapus="${s.id}">Hapus</button>`);
  b.push(`<button type="button" class="b kecil" data-jejak="${s.id}">Riwayat</button>`);
  return b.join(' ');
}
function htmlAgenda(){
  if (!BACA_SEMUA()) return '';
  const tahun = [...new Set([String(TH), ...SURAT.map(s => s.tanggal ? String(s.tanggal).slice(0, 4) : String(TH))])].sort().reverse();
  const xs = tersaring(), rek = rekapSurat(SURAT, JENIS);
  return `<section class="kartu" id="agenda"><h2>Agenda surat</h2>
    <div class="alat"><label>Tahun <select id="sTahun"><option value="">Semua</option>${tahun.map(t => `<option${t === SARING.tahun ? ' selected' : ''}>${t}</option>`).join('')}</select></label>
      <label>Jenis <select id="sJenis"><option value="">Semua</option>${opsiJenis(SARING.jenis, true)}</select></label>
      <label>Status <select id="sStatus"><option value="">Semua</option>${Object.entries(STATUS_SURAT).map(([k, l]) => `<option value="${k}"${k === SARING.status ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select></label>
      <input type="search" id="sCari" placeholder="Cari nomor atau perihal" value="${esc(SARING.cari)}">
      <button type="button" class="b" id="bCsv">Unduh CSV</button></div>
    ${xs.length ? `<div class="gulir"><table class="ds"><thead><tr><th>Nomor</th><th>Tanggal</th><th>Jenis</th><th>Perihal</th><th>Status</th><th>Penanda tangan</th><th></th></tr></thead>
      <tbody>${xs.map(s => `<tr><td>${s.nomor ? `<code>${esc(s.nomor)}</code>` : '<span class="ket">—</span>'}</td><td>${esc(s.tanggal ? tglPanjang(s.tanggal) : '')}</td>
        <td>${esc(jenisDari(s.jenis).nama)}</td>
        <td>${esc(s.perihal)}${s.tujuan ? `<div class="ket">${esc(s.tujuan.split('\n')[0])}</div>` : ''}${s.status === 'dikembalikan' && s.catatan ? `<div class="ket">Catatan: ${esc(s.catatan)}</div>` : ''}
          ${s.status === 'dibatalkan' && s.alasan_batal ? `<div class="ket">Dibatalkan: ${esc(s.alasan_batal)}</div>` : ''}
          ${s.arsip_url ? `<div class="ket"><a href="${esc(s.arsip_url)}" target="_blank" rel="noopener">berkas bertanda tangan</a></div>` : ''}
          <div id="jj_${s.id}"></div></td>
        <td><span class="st ${esc(s.status)}">${esc(STATUS_SURAT[s.status] || s.status)}</span></td>
        <td>${esc(PENANDATANGAN[s.penandatangan || jenisDari(s.jenis).penandatangan] || '')}</td>
        <td class="aksi">${aksiAgenda(s)}</td></tr>`).join('')}</tbody></table></div>` : '<p class="kosong">Tidak ada surat untuk saringan ini.</p>'}
    <h3>Rekap per tahun</h3>
    ${rek.length ? `<div class="gulir"><table class="ds"><thead><tr><th>Tahun</th><th>Jenis</th><th>Terbit</th><th>Dibatalkan</th></tr></thead>
      <tbody>${rek.map(r => `<tr><td>${r.tahun}</td><td>${esc(r.nama)}</td><td>${r.terbit}</td><td>${r.batal}</td></tr>`).join('')}</tbody></table></div>`
      : '<p class="kosong">Belum ada surat terbit.</p>'}</section>`;
}

function htmlSaya(){
  const xs = SURAT.filter(s => (s.dosen_ids || []).includes(SAYA.id) && ['disahkan', 'arsip', 'dibatalkan'].includes(s.status));
  return `<section class="kartu" id="saya"><h2>Surat dan SK untuk saya</h2>
    <p class="ket">SK prodi dan surat tugas yang menyebut nama Anda; unduh Word bertanda tangan elektronik untuk BKD/SISTER.</p>
    ${xs.length ? `<div class="gulir"><table class="ds"><thead><tr><th>Nomor</th><th>Tanggal</th><th>Jenis</th><th>Perihal</th><th>Status</th><th></th></tr></thead>
      <tbody>${xs.map(s => `<tr><td><code>${esc(s.nomor)}</code></td><td>${esc(tglPanjang(s.tanggal))}</td><td>${esc(jenisDari(s.jenis).nama)}</td><td>${esc(s.perihal)}</td>
        <td><span class="st ${esc(s.status)}">${esc(STATUS_SURAT[s.status])}</span></td>
        <td class="aksi">${s.status === 'disahkan' ? `<button type="button" class="b kecil" data-word="${s.id}">Word</button>` : ''}
          ${s.arsip_url ? `<a class="b kecil" href="${esc(s.arsip_url)}" target="_blank" rel="noopener">Berkas</a>` : ''}</td></tr>`).join('')}</tbody></table></div>`
      : '<p class="kosong">Belum ada surat atau SK yang menyebut nama Anda.</p>'}</section>`;
}

function htmlPengaturan(){
  if (!ADMIN()) return '';
  const urutan = [...new Set(JENIS.map(j => j.urutan))].sort();
  const terakhir = u => URUT.find(x => x.urutan === u && x.tahun === TH)?.terakhir || 0;
  return `<section class="kartu" id="pengaturan"><h2>Pengaturan nomor</h2>
    <p class="ket">Pola memakai penanda ${PENANDA_POLA.map(p => `<code>${p}</code>`).join(' ')} (wajib <code>{urut}</code>). Jenis dengan <b>urutan</b> sama berbagi satu
      nomor urut per tahun; nomor urut mulai dari 1 tiap tahun. Surat belum bisa disahkan sebelum <b>kode nomor</b> jenisnya diisi.
      Jenis baru (format dari pemilik) ditambahkan di baris terakhir.</p>
    <div class="gulir"><table class="ds"><thead><tr><th>Kode</th><th>Nama</th><th>Kode nomor</th><th>Pola</th><th>Urutan</th><th>Lebar</th><th>Penanda tangan</th><th>Aktif</th><th>Nomor berikutnya</th><th></th></tr></thead>
      <tbody>${JENIS.map(j => `<tr data-jenis="${esc(j.kode)}"><td><code>${esc(j.kode)}</code></td>
        <td><input type="text" data-k="nama" value="${esc(j.nama)}" maxlength="120"></td>
        <td><input type="text" data-k="kode_nomor" value="${esc(j.kode_nomor || '')}" maxlength="60" placeholder="mis. TS-UPER" size="12"></td>
        <td><input type="text" data-k="pola" value="${esc(j.pola)}" maxlength="120" size="30"></td>
        <td><input type="text" data-k="urutan" value="${esc(j.urutan)}" maxlength="30" size="8"></td>
        <td><input type="number" data-k="lebar_urut" value="${esc(j.lebar_urut)}" min="1" max="6" style="width:56px"></td>
        <td><select data-k="penandatangan">${Object.entries(PENANDATANGAN).map(([k, l]) => `<option value="${k}"${k === j.penandatangan ? ' selected' : ''}>${l}</option>`).join('')}</select></td>
        <td><input type="checkbox" data-k="aktif"${j.aktif ? ' checked' : ''}></td>
        <td><code>${esc(nomorBerikut(j, terakhir(j.urutan)))}</code></td>
        <td><button type="button" class="b kecil" data-simpan-jenis="${esc(j.kode)}">Simpan</button></td></tr>`).join('')}
        <tr data-jenis=""><td><input type="text" id="jBaruKode" maxlength="30" size="10" placeholder="kode_baru"></td>
          <td><input type="text" id="jBaruNama" maxlength="120" placeholder="Nama jenis"></td>
          <td colspan="7" class="ket">Pola dan penanda tangan diatur setelah ditambahkan.</td>
          <td><button type="button" class="b kecil" id="bJenisBaru">Tambah</button></td></tr></tbody></table></div>
    <span class="pesan" id="mJenis" role="status"></span>
    <h3>Nomor urut terakhir tahun ${TH}</h3>
    <p class="ket">Bila tahun ini sudah ada surat bernomor sebelum situs dipakai, isi nomor urut terakhir yang sudah terpakai; surat berikutnya melanjutkan dari sana.
      Jangan menurunkan angka yang sudah dipakai situs.</p>
    <div class="alat">${urutan.map(u => `<label>${esc(u)} <input type="number" min="0" max="99999" data-urutan="${esc(u)}" value="${terakhir(u)}" style="width:90px"></label>`).join('')}
      <button type="button" class="b" id="bSimpanUrut">Simpan nomor urut</button><span class="pesan" id="mUrut" role="status"></span></div></section>`;
}

function gambar(){
  if (!ADA) { $('isi').innerHTML = '<p class="kosong">Tabel belum ada: jalankan supabase/201-patch-surat-sk-prodi.sql.</p>'; return; }
  $('isi').innerHTML = htmlTanda() + htmlForm() + htmlAgenda() + htmlSaya() + htmlPengaturan();
  pasang();
}

// ---------- Aksi ----------
const cari = id => SURAT.find(s => s.id === +id);
async function rpc(nama, arg, pesan){
  const { data, error } = await sb.rpc(nama, arg);
  if (error) { alert(`${pesan}: ${error.message}`); return null; }
  return data ?? true;
}
function pasang(){
  const on = (sel, f) => document.querySelectorAll(sel).forEach(b => { b.onclick = () => f(b); });
  on('[data-word]', async b => { b.disabled = true; try { await unduhWord(cari(b.dataset.word)); } catch (e) { alert('Gagal membuat Word: ' + e.message); } b.disabled = false; });
  on('[data-sahkan]', async b => {
    const s = cari(b.dataset.sahkan);
    if (!confirm(`Sahkan "${s.perihal}"? Nomor dan tanggal hari ini diberikan otomatis; isi tidak bisa diubah lagi.`)) return;
    b.disabled = true;
    const v = await rpc('surat_putuskan', { p_id: s.id, p_aksi: 'sahkan' }, 'Gagal mengesahkan');
    if (v) { await muat(); gambar(); tulis('mForm', 'ok', `Disahkan dengan nomor ${v}.`); } else b.disabled = false;
  });
  on('[data-kembalikan]', async b => {
    const id = +b.dataset.kembalikan, c = $(`kc_${id}`).value.trim();
    if (!c) return tulis(`mt_${id}`, 'galat', 'Tulis catatan untuk penyusun.');
    if (await rpc('surat_putuskan', { p_id: id, p_aksi: 'kembalikan', p_catatan: c }, 'Gagal mengembalikan')) { await muat(); gambar(); }
  });
  on('[data-ajukan]', async b => { if (await rpc('surat_ajukan', { p_id: +b.dataset.ajukan }, 'Gagal mengajukan')) { await muat(); gambar(); } });
  on('[data-tarik]', async b => {
    if (!confirm('Tarik surat ini kembali menjadi draf?')) return;
    if (await rpc('surat_ajukan', { p_id: +b.dataset.tarik, p_tarik: true }, 'Gagal menarik')) { await muat(); gambar(); }
  });
  on('[data-batal]', async b => {
    const a = prompt('Alasan pembatalan (tampil di agenda; halaman verifikasi menyatakan surat tidak berlaku):');
    if (a == null) return;
    if (await rpc('surat_batalkan', { p_id: +b.dataset.batal, p_alasan: a }, 'Gagal membatalkan')) { await muat(); gambar(); }
  });
  on('[data-berkas]', async b => {
    const s = cari(b.dataset.berkas), u = prompt('Tautan berkas akhir bertanda tangan (https, mis. PDF di Google Drive):', s.arsip_url || '');
    if (u == null) return;
    if (u.trim() && !/^https:\/\/\S+$/i.test(u.trim())) return alert('Tautan harus diawali https://');
    const { error } = await sb.from('surat').update({ arsip_url: u.trim() || null }).eq('id', s.id);
    if (error) return alert('Gagal menyimpan: ' + error.message);
    await muat(); gambar();
  });
  on('[data-hapus]', async b => {
    if (!confirm('Hapus surat ini? Surat yang sudah disahkan tidak bisa dihapus (gunakan Batalkan).')) return;
    const { error } = await sb.from('surat').delete().eq('id', +b.dataset.hapus);
    if (error) return alert('Gagal menghapus: ' + error.message);
    await muat(); gambar();
  });
  on('[data-ubah]', b => { UBAH = cari(b.dataset.ubah); PENGAJUAN = null; gambar(); $('form').scrollIntoView(); });
  on('[data-jejak]', async b => {
    const el = $(`jj_${b.dataset.jejak}`);
    if (el.innerHTML) { el.innerHTML = ''; return; }
    const { data, error } = await sb.from('surat_jejak').select('aksi,oleh_nama,catatan,waktu').eq('surat_id', +b.dataset.jejak).order('id');
    el.innerHTML = error ? `<div class="ket">${esc(error.message)}</div>` : (data || []).length ? `<ul class="ket" style="margin:4px 0;padding-left:18px">${data.map(x =>
      `<li>${esc(new Date(x.waktu).toLocaleString('id-ID'))}: ${esc(x.aksi)} oleh ${esc(x.oleh_nama || '?')}${x.catatan ? ` — ${esc(x.catatan)}` : ''}</li>`).join('')}</ul>`
      : '<div class="ket">Belum ada riwayat.</div>';
  });
  if ($('bSimpan')) {
    $('bSimpan').onclick = () => simpan(false);
    if ($('bSimpanAjukan')) $('bSimpanAjukan').onclick = () => simpan(true);
    if ($('bBatal')) $('bBatal').onclick = () => { UBAH = null; PENGAJUAN = null; history.replaceState(null, '', location.pathname); gambar(); };
    $('fArsip').onchange = e => { $('fArsipIsi').style.display = e.target.checked ? '' : 'none'; if ($('bSimpanAjukan')) $('bSimpanAjukan').style.display = e.target.checked ? 'none' : ''; };
    $('fCariDosen').oninput = e => { const q = e.target.value.toLowerCase(); document.querySelectorAll('#fDosen label').forEach(l => { l.style.display = l.dataset.nama.includes(q) ? '' : 'none'; }); };
  }
  if ($('sTahun')) {
    $('sTahun').onchange = e => { SARING.tahun = e.target.value; gambar(); };
    $('sJenis').onchange = e => { SARING.jenis = e.target.value; gambar(); };
    $('sStatus').onchange = e => { SARING.status = e.target.value; gambar(); };
    $('sCari').onchange = e => { SARING.cari = e.target.value.trim(); gambar(); };
    $('bCsv').onclick = unduhCsv;
  }
  on('[data-simpan-jenis]', simpanJenis);
  if ($('bJenisBaru')) $('bJenisBaru').onclick = tambahJenis;
  if ($('bSimpanUrut')) $('bSimpanUrut').onclick = simpanUrut;
}

async function simpan(ajukan){
  const v = id => $(id)?.value?.trim() ?? '';
  const arsip = $('fArsip').checked;
  const isi = { jenis: v('fJenis'), perihal: v('fPerihal'), tujuan: v('fTujuan') || null, isi: $('fIsi').value.replace(/\s+$/, '') || null,
    dosen_ids: [...document.querySelectorAll('#fDosen input:checked')].map(c => c.value), lampiran_url: v('fLampiran') || null };
  if (!isi.jenis) return tulis('mForm', 'galat', 'Pilih jenis surat.');
  if (isi.perihal.length < 3) return tulis('mForm', 'galat', 'Tulis perihal surat.');
  if (isi.lampiran_url && !/^https:\/\/\S+$/i.test(isi.lampiran_url)) return tulis('mForm', 'galat', 'Lampiran harus tautan https://');
  if (arsip) {
    Object.assign(isi, { status: 'arsip', nomor: v('fNomor'), tanggal: v('fTanggal') || null, arsip_url: v('fBerkas') || null });
    if (!isi.nomor || !isi.tanggal) return tulis('mForm', 'galat', 'Surat arsip perlu nomor dan tanggal surat.');
    if (isi.arsip_url && !/^https:\/\/\S+$/i.test(isi.arsip_url)) return tulis('mForm', 'galat', 'Berkas harus tautan https://');
  }
  if (!UBAH && PENGAJUAN && !PENGAJUAN.asisten) isi.pengajuan_id = PENGAJUAN.id;
  const q = UBAH ? sb.from('surat').update(isi).eq('id', UBAH.id).select('id') : sb.from('surat').insert(isi).select('id');
  const { data, error } = await q;
  if (error) return tulis('mForm', 'galat', 'Gagal menyimpan: ' + error.message);
  const sid = data?.[0]?.id;
  // SK asisten (202): tautkan surat ke rekrutmennya.
  if (!UBAH && PENGAJUAN?.asisten && sid) {
    const t = await sb.from('asisten_rekrutmen').update({ sk_surat_id: sid }).eq('id', PENGAJUAN.asisten);
    if (t.error) alert('Surat tersimpan, tetapi gagal ditautkan ke rekrutmen asisten: ' + t.error.message);
  }
  if (ajukan && sid && !(await rpc('surat_ajukan', { p_id: sid }, 'Tersimpan sebagai draf, tetapi gagal diajukan'))) { UBAH = null; await muat(); return gambar(); }
  UBAH = null; PENGAJUAN = null; history.replaceState(null, '', location.pathname);
  await muat(); gambar();
  tulis('mForm', 'ok', ajukan ? 'Tersimpan dan diajukan ke penanda tangan.' : 'Tersimpan.');
}

function unduhCsv(){
  const k = x => `"${String(x ?? '').replace(/"/g, '""')}"`;
  const baris = [['Nomor', 'Tanggal', 'Jenis', 'Perihal', 'Kepada', 'Status', 'Penanda tangan', 'Nama disebut', 'Berkas'],
    ...tersaring().map(s => [s.nomor, s.tanggal, jenisDari(s.jenis).nama, s.perihal, s.tujuan, STATUS_SURAT[s.status], PENANDATANGAN[s.penandatangan] || '',
      (s.dosen_ids || []).map(namaDosen).join('; '), s.arsip_url])];
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + baris.map(r => r.map(k).join(',')).join('\r\n')], { type: 'text/csv;charset=utf-8' }));
  a.download = `agenda-surat-${SARING.tahun || 'semua'}.csv`; a.click(); URL.revokeObjectURL(a.href);
}

async function simpanJenis(b){
  const tr = b.closest('tr'), g = k => tr.querySelector(`[data-k="${k}"]`);
  const isi = { nama: g('nama').value.trim(), kode_nomor: g('kode_nomor').value.trim() || null, pola: g('pola').value.trim(),
    urutan: g('urutan').value.trim().toLowerCase(), lebar_urut: +g('lebar_urut').value, penandatangan: g('penandatangan').value, aktif: g('aktif').checked };
  const gp = galatPola(isi.pola);
  if (gp) return tulis('mJenis', 'galat', gp);
  if (!/^[a-z][a-z0-9_]{1,30}$/.test(isi.urutan)) return tulis('mJenis', 'galat', 'Urutan: huruf kecil, angka, garis bawah (mis. surat, sk).');
  const { error } = await sb.from('surat_jenis').update(isi).eq('kode', b.dataset.simpanJenis);
  if (error) return tulis('mJenis', 'galat', 'Gagal menyimpan: ' + error.message);
  await muat(); gambar(); tulis('mJenis', 'ok', `Jenis "${isi.nama}" tersimpan.`);
}
async function tambahJenis(){
  const kode = $('jBaruKode').value.trim().toLowerCase(), nama = $('jBaruNama').value.trim();
  if (!/^[a-z][a-z0-9_]{1,30}$/.test(kode)) return tulis('mJenis', 'galat', 'Kode: huruf kecil, angka, garis bawah (mis. surat_undangan).');
  if (nama.length < 2) return tulis('mJenis', 'galat', 'Tulis nama jenis.');
  const { error } = await sb.from('surat_jenis').insert({ kode, nama, urutan: 'surat', penandatangan: 'kaprodi' });
  if (error) return tulis('mJenis', 'galat', 'Gagal menambah: ' + error.message);
  await muat(); gambar(); tulis('mJenis', 'ok', `Jenis "${nama}" ditambahkan; isi kode nomor dan polanya.`);
}
async function simpanUrut(){
  const xs = [...document.querySelectorAll('[data-urutan]')].map(i => ({ urutan: i.dataset.urutan, tahun: TH, terakhir: Math.max(0, Math.floor(+i.value || 0)) }));
  const { error } = await sb.from('surat_nomor_urut').upsert(xs, { onConflict: 'urutan,tahun' });
  if (error) return tulis('mUrut', 'galat', 'Gagal menyimpan: ' + error.message);
  await muat(); gambar(); tulis('mUrut', 'ok', 'Nomor urut tersimpan.');
}

// Surat mahasiswa dari permohonan (pengajuan-mahasiswa.html): ?pengajuan=<id> mengisi jenis, perihal, kepada, dan isi awal.
async function dariPengajuan(){
  const pid = +new URLSearchParams(location.search).get('pengajuan');
  if (!pid || !KELOLA()) return;
  const { data } = await sb.from('pengajuan_mahasiswa').select('id,jenis,nim,nama,data').eq('id', pid).maybeSingle();
  if (!data || data.jenis !== 'surat') return;
  const d = data.data || {}, judul = { aktif_kuliah: 'Surat keterangan aktif kuliah', izin_penelitian: 'Surat izin penelitian/survei', rekomendasi: 'Surat rekomendasi' }[d.jenis_surat] || 'Surat mahasiswa';
  const ada = SURAT.find(s => s.pengajuan_id === pid && s.status !== 'dibatalkan');
  if (ada) { UBAH = ['draf', 'dikembalikan'].includes(ada.status) ? ada : null; if (!UBAH) alert(`Permohonan ini sudah punya surat (${STATUS_SURAT[ada.status]}${ada.nomor ? ', ' + ada.nomor : ''}).`); return; }
  PENGAJUAN = { id: pid, isi: { jenis: 'surat_mahasiswa', perihal: judul, tujuan: [d.tujuan_surat, d.alamat_tujuan].filter(Boolean).join('\n') || null,
    isi: [`Nama: ${data.nama}`, `NIM: ${data.nim}`, d.keperluan ? `Keperluan: ${d.keperluan}` : '', d.judul_penelitian ? `Judul penelitian: ${d.judul_penelitian}` : '',
      d.lokasi ? `Lokasi: ${d.lokasi}` : '', d.waktu_pelaksanaan ? `Waktu: ${d.waktu_pelaksanaan}` : ''].filter(Boolean).join('\n') } };
}

// SK asisten dari rekrutmen (kelola-karier.html, 202): ?asisten=<id> mengisi SK dengan pelamar yang diterima.
async function dariAsisten(){
  const rid = +new URLSearchParams(location.search).get('asisten');
  if (!rid || !KELOLA()) return;
  const [r, l] = await Promise.all([sb.from('asisten_rekrutmen').select('*').eq('id', rid).maybeSingle(),
    sb.from('asisten_lamaran').select('nim,nama,status').eq('rekrutmen_id', rid).eq('status', 'diterima')]);
  if (!r.data) return;
  if (r.data.sk_surat_id) { const s = SURAT.find(x => x.id === r.data.sk_surat_id);
    if (s && ['draf', 'dikembalikan'].includes(s.status)) { UBAH = s; return; }
    if (s && s.status !== 'dibatalkan') { alert(`Rekrutmen ini sudah punya SK (${STATUS_SURAT[s.status]}${s.nomor ? ', ' + s.nomor : ''}).`); return; } }
  const lab = r.data.laboratorium_id ? (await sb.from('laboratorium').select('nama').eq('id', r.data.laboratorium_id).maybeSingle()).data?.nama : '';
  const mk = r.data.kode_mk ? (await sb.from('ref_mata_kuliah').select('nama').eq('kurikulum', r.data.kurikulum).eq('kode', r.data.kode_mk).maybeSingle()).data?.nama : '';
  PENGAJUAN = { id: rid, asisten: rid, label: `SK asisten dari rekrutmen "${r.data.judul}" (${(l.data || []).length} diterima).`,
    isi: drafSkAsisten(r.data, l.data || [], { labNama: lab, mkNama: mk }) };
}

async function mulai(){
  SAYA = await gerbang(sb);
  if (!SAYA) return;
  $('hSub').textContent = `Masuk sebagai ${SAYA.nama}`;
  const [ds, dj] = await Promise.all([sb.from('dosen').select('id,nama,nama_gelar,nidn,aktif,peran').order('nama'),
    fetch('data.json', { cache: 'no-cache' }).then(r => (r.ok ? r.json() : {})).catch(() => ({}))]);
  DOSEN = (ds.data || []).filter(d => d.aktif !== false && !['asesor'].includes(d.peran));
  PRODI = { prodi: dj.prodi || '', institusi: dj.institusi || '' };
  await muat();
  await dariPengajuan();
  await dariAsisten();
  gambar();
  if (location.hash && $(location.hash.slice(1))) $(location.hash.slice(1)).scrollIntoView();
}
mulai().catch(e => { $('isi').innerHTML = `<p class="kosong">Gagal memuat: ${esc(e.message)}</p>`; });
